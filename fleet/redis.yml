# redis.yml: the store's ACL users and rules, generated by `nova-redis acl render`
# from the function library the installed nova-redis embeds and the key families
# its tools use, one rule set per role (coordinator, member, table, friend).
# Nothing is pinned by hand: a function added to the library reaches its roles
# at the next run.
#
#   ansible-playbook -i ./nova-inventory fleet/redis.yml --check --diff | cat
#   ansible-playbook -i ./nova-inventory fleet/redis.yml | cat
#
# The rules are printed first, on the machine running the play (`acl render`
# opens no store). The store_deployer machine (the fleet's coordinator) then
# compares them with the live ACL (`acl check`: ACL OK, DRIFT or MISSING per
# user; --check stops there) and writes the users that differ (`acl apply`),
# logged in as the admin user under the seat that holds its password. A user
# keeps the password it has; a user the store lacks is created with the password
# in the seat's secret nova_redis_user_password_keys names, and refused when it
# names none.
- name: the rules this build renders
  hosts: localhost
  gather_facts: false
  tasks:
    - name: acl render (opens no store)
      ansible.builtin.command:
        argv: [nova-redis, acl, render]
      register: redis_render
      changed_when: false
      check_mode: false

    - name: the rendered users
      ansible.builtin.debug: { var: redis_render.stdout_lines }

- name: the store's ACL
  hosts: store_deployer
  gather_facts: false
  vars:
    redis_login: >-
      {{ [nova_bin_dir ~ '/nova-secrets', 'exec', '--store', nova_secrets_store, '--as', nova_seat,
          '--key', nova_secrets_key_dir ~ '/' ~ nova_seat ~ '.key', '--sops', nova_sops,
          '--only', ([nova_redis_admin_password_key] + (nova_redis_user_password_keys.values() | list)) | unique | join(','),
          '--require=' ~ nova_redis_admin_password_key, '--'] }}
    redis_flags: [--addr, "{{ nova_redis_addr }}", --user, "{{ nova_redis_admin_user }}", --password-env, "{{ nova_redis_admin_password_key }}"]
  tasks:
    - name: the sops binary (nova_sops, else the first of nova_sops_candidates on the machine)
      ansible.builtin.stat: { path: "{{ item }}" }
      loop: "{{ nova_sops_candidates }}"
      register: redis_sops
      when: nova_sops is not defined

    - name: the sops the seat is opened with
      ansible.builtin.set_fact:
        nova_sops: >-
          {{ nova_sops if nova_sops is defined else (redis_sops.results | selectattr('stat', 'defined')
             | selectattr('stat.exists') | map(attribute='item') | first | default('')) }}

    - name: the store_deployer machine has sops
      ansible.builtin.assert:
        that: nova_sops != ''
        fail_msg: "{{ inventory_hostname }} has no sops at any of {{ nova_sops_candidates | join(', ') }}; install it or set nova_sops in host_vars"
        quiet: true

    - name: acl check (the diff against the live ACL; writes nothing)
      ansible.builtin.command:
        argv: "{{ redis_login + [nova_bin_dir ~ '/nova-redis', 'acl', 'check'] + redis_flags }}"
      register: redis_check
      check_mode: false
      changed_when: redis_check.rc == 1
      failed_when: redis_check.rc > 1

    - name: the diff
      ansible.builtin.debug: { var: redis_check.stdout_lines }

    - name: acl apply (the users that differ)
      ansible.builtin.command:
        argv: >-
          {{ redis_login + [nova_bin_dir ~ '/nova-redis', 'acl', 'apply'] + redis_flags
             + (nova_redis_user_password_keys | dict2items | map(attribute='key') | zip(nova_redis_user_password_keys | dict2items | map(attribute='value'))
                | map('join', '=') | map('regex_replace', '^', '--password-env-for=') | list) }}
      register: redis_apply
      changed_when: redis_apply.stdout is search('^ACL SET ', multiline=True)
      when: redis_check.rc == 1

    - name: the receipt
      ansible.builtin.debug: { var: redis_apply.stdout_lines }
      when: redis_apply is not skipped
