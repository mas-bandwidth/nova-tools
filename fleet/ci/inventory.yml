# A stub inventory for CI: one Linux localhost carrying one loop row, in the
# shape `nova-config inventory` prints (nova_loops on the host). CI runs
# loops.yml against it with --check, so no unit is written.
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_system: Linux
      nova_loops:
        - name: bus-hook
          argv: ["nova-bus", "hook", "--as", "reader"]
          env: { NOVA_BUS_REDIS: "redis-host:6379" }
