# join.yml: a new machine joins the fleet (docs/FLEET.md, "join.yml"). In order, each play only after the one before
# passed, all idempotent, so a join that stopped is resumed by running the same command again:
#
#   1. the machine row (control node): `nova-config machine add` where the row of nova_join_host is missing, then the
#      inventory is read again so the plays below find it. A row that exists is never edited; a row whose user differs
#      from nova_join_user stops the join by name. The machine's SSH host key is pinned in nova_join_known_hosts
#      (ssh-keyscan of the row's address, where the file has no line for it), and every play below reaches the
#      machine with that file alone (StrictHostKeyChecking=yes).
#   2. the login (Linux, as root): the row's user, no password, in nova_join_sudo_group with passwordless sudo (checked
#      by visudo before it lands), root's authorized_keys copied to it (or the file nova_join_authorized_keys names on
#      the control node), linger on, the hostname set to the inventory name.
#   3. tailscale.yml: Tailscale installed and up with the adopter's tagged auth key, the MagicDNS name recorded as the
#      machine's address, the firewall closed to everything but the tailnet. From here on the plays reach the machine
#      over the tailnet.
#   4. the tools a seat needs (as the login): the bin directory on the login PATH, and on Linux the pinned age and sops.
#   5. the tailnet check (control node): the row's address is a tailnet peer name the control node sees online, and
#      the host key it answers with over the tailnet is the one pinned at the row; else the join stops here, before
#      any seat is made.
#   6. seat.yml: the seat key made on the machine by age-keygen, its rule added to the secrets store, its public half
#      pinned on the control node (nova_seal_pins); then (control node, with nova_seal_seat and nova_seal_key, the
#      control seat and its key) `nova-secrets grant` writes the seat's grants file with the names in nova_join_grant,
#      sealed to the pinned machine key and the pinned recovery key only; the store is pushed, the machine gets the
#      recovery pin for its own `set`, and pulls its clone (secrets-refresh).
#   7. the check: the control node sees the machine as an online tailnet peer, and `nova-bus who` from the machine
#      reaches the bus (a NOTE instead when the bus is not configured for it yet).
#
# A darwin machine skips 2 (it has no root login: its login and sudo are set up at its console) and takes age and
# sops from Homebrew. A Windows machine gets 1 and 3 only.
#
# The machine is named by -e nova_join_host, never by -l (a machine with no row yet is in no inventory):
#
#   nova-secrets exec --only TAILSCALE_AUTHKEY,NOVA_PG_PASSWORD --store S --key K --as SEAT -- \
#     env NOVA_PG_DSN=postgres://nova_config@HOST:5432/nova \
#     ansible-playbook -i ./inventory fleet/join.yml \
#       -e nova_join_host=<name> -e nova_join_user=<login> -e nova_join_address=<address> \
#       -e nova_join_os=linux -e nova_join_arch=amd64 -e nova_seal_store=<store clone> \
#       -e nova_seal_seat=<operator seat> -e nova_seal_key=<its key>
- name: the machine row (control node)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    join_dry: "{{ ['--dry-run'] if ansible_check_mode else [] }}"
  tasks:
    - name: one machine, named
      ansible.builtin.assert:
        that: nova_join_host is defined and nova_join_host is match('^[a-z0-9][a-z0-9-]*$')
        fail_msg: "JOIN STOP: join.yml takes the machine as -e nova_join_host=<name> (a lowercase machine name), never -l"
        quiet: true

    - name: nova-config's store is in the environment
      ansible.builtin.assert:
        that: lookup('ansible.builtin.env', 'NOVA_PG_DSN') | length > 0
        fail_msg: "JOIN STOP {{ nova_join_host }} at the machine row: no NOVA_PG_DSN in the environment (the password in NOVA_PG_PASSWORD, under nova-secrets exec; docs/FLEET.md, \"join.yml\")"
        quiet: true

    - name: the machine row now
      ansible.builtin.command: { argv: ["{{ nova_control_config }}", machine, show, "{{ nova_join_host }}", --json] }
      register: join_show
      changed_when: false
      failed_when: false
      check_mode: false

    - name: the row, parsed
      ansible.builtin.set_fact:
        join_row: >-
          {{ ((((join_show.stdout | from_json).get('items') or [{}]) | first).get('fields', {}))
             if (join_show.rc == 0 and (join_show.stdout | trim).startswith('{')) else {} }}

    - name: a missing row has its fields given
      ansible.builtin.assert:
        that:
          - nova_join_user is defined and nova_join_user | length > 0
          - nova_join_address is defined and nova_join_address | length > 0
          - nova_join_os is defined and nova_join_os in ['linux', 'darwin']
          - nova_join_arch is defined and nova_join_arch | length > 0
        fail_msg: >-
          JOIN STOP {{ nova_join_host }} at the machine row: there is no row yet, and adding one needs -e nova_join_user,
          nova_join_address, nova_join_os (linux|darwin) and nova_join_arch
        quiet: true
      when: join_row | length == 0

    - name: an existing row is the declared machine (its user is its identity)
      ansible.builtin.assert:
        that: nova_join_user is not defined or join_row.user == nova_join_user
        fail_msg: >-
          JOIN STOP {{ nova_join_host }} at the machine row: nova-config has user={{ join_row.user }}, the join says
          user={{ nova_join_user | default('') }}; settle it with nova-config machine set, then run the join again
        quiet: true
      when: join_row | length > 0

    - name: the machine row added
      ansible.builtin.command:
        argv: >-
          {{ [nova_control_config, 'machine', 'add', nova_join_host, '--address', nova_join_address, '--user', nova_join_user,
              '--os', nova_join_os, '--arch', nova_join_arch, '--roles', nova_join_roles]
             + (['--cores', nova_join_cores | string] if nova_join_cores is defined else [])
             + ['--actor', nova_join_actor, '--reason', 'fleet join (fleet/join.yml)'] + join_dry }}
      check_mode: false   # nova-config's own --dry-run under --check: it reads the store and writes nothing
      when: join_row | length == 0

    # read before the root plays below replace ansible_user for their connection
    - name: the machine's login, and the address its host key is pinned by
      ansible.builtin.set_fact:
        nova_join_login: "{{ join_row.user if join_row | length > 0 else nova_join_user }}"
        nova_join_first_address: "{{ join_row.address if join_row | length > 0 else nova_join_address }}"

    - name: "the machine's SSH host key, pinned in {{ nova_join_known_hosts }} (ssh-keyscan, where the file has no line for the address)"
      ansible.builtin.shell: |
        f="{{ nova_join_known_hosts }}"; a="{{ nova_join_first_address }}"
        umask 077; mkdir -p "$(dirname "$f")"; touch "$f"
        grep -qs "^$a " "$f" && { echo present; exit 0; }
        keys=$(ssh-keyscan -T 10 "$a" 2>/dev/null) || true
        [ -n "$keys" ] || { echo none; exit 0; }
        {% if not ansible_check_mode %}printf '%s\n' "$keys" >> "$f"{% endif %}
        echo pinned
      args: { executable: /bin/bash }
      register: join_hostkey
      changed_when: join_hostkey.stdout | trim == 'pinned'
      check_mode: false

    - name: a machine that answers with no host key is not reached
      ansible.builtin.assert:
        that: join_hostkey.stdout | trim != 'none'
        fail_msg: "JOIN STOP {{ nova_join_host }} at the host key: ssh-keyscan {{ nova_join_first_address }} returned nothing (is it up, and is 22 open to this node?)"
        quiet: true

    - name: the host key's receipt
      ansible.builtin.debug:
        msg: "JOIN HOSTKEY {{ nova_join_first_address }} {{ 'WOULD-PIN' if (ansible_check_mode and join_hostkey.stdout | trim == 'pinned') else join_hostkey.stdout | trim }} ({{ nova_join_known_hosts }})"

    - name: the inventory, read again (a new row is a host now)
      ansible.builtin.meta: refresh_inventory

    # the fact rides with the host through every play below, imported ones included
    - name: every play reaches the machine with the pinned host keys alone
      ansible.builtin.set_fact:
        ansible_ssh_common_args: "-o UserKnownHostsFile={{ nova_join_known_hosts }} -o StrictHostKeyChecking=yes"
      delegate_to: "{{ nova_join_host }}"
      delegate_facts: true
      when: join_row | length > 0 or not ansible_check_mode

    - name: the row's receipt
      ansible.builtin.debug:
        msg: >-
          JOIN ROW {{ nova_join_host }} user={{ nova_join_login }}
          {{ 'present' if join_row | length > 0 else ('WOULD-ADD (check: nothing written; the plays below match no host)' if ansible_check_mode else 'ADDED') }}

- name: the login (Linux, as root)
  hosts: "{{ nova_join_host | default('!all') }}"   # no machine named, no host
  gather_facts: false
  vars:
    ansible_user: "{{ nova_join_root_user }}"
    join_login: "{{ hostvars['localhost']['nova_join_login'] }}"
  tasks:
    - name: only a Linux machine has a root login to set up
      ansible.builtin.meta: end_host
      when: (nova_os | default('linux')) != 'linux'

    - name: the machine has a login to make
      ansible.builtin.assert:
        that: join_login | length > 0 and join_login != nova_join_root_user
        fail_msg: "JOIN STOP {{ inventory_hostname }}: its machine row has no user other than {{ nova_join_root_user }} (nova-config machine set {{ inventory_hostname }} --user <login>)"
        quiet: true

    - name: the machine's facts, as root
      ansible.builtin.setup:
        gather_subset: [min]

    - name: a Linux machine
      ansible.builtin.assert:
        that: ansible_system == 'Linux'
        fail_msg: "{{ inventory_hostname }} reports {{ ansible_system }}; its row says os={{ nova_os | default('') }}"
        quiet: true

    - name: "the login {{ join_login }} (no password, bash, group {{ nova_join_sudo_group }})"
      ansible.builtin.user:
        name: "{{ join_login }}"
        shell: /bin/bash
        groups: ["{{ nova_join_sudo_group }}"]
        append: true
        create_home: true
      register: join_user

    - name: "sudo without a password for {{ join_login }} (visudo checks it before it lands)"
      ansible.builtin.copy:
        content: "{{ join_login }} ALL=(ALL) NOPASSWD:ALL\n"
        dest: "/etc/sudoers.d/90-nova-{{ join_login }}"
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s

    - name: "~{{ join_login }}/.ssh"
      ansible.builtin.file:
        path: "{{ join_user.home | default('/home/' ~ join_login) }}/.ssh"
        state: directory
        owner: "{{ join_login }}"
        group: "{{ join_login }}"
        mode: "0700"
      register: join_ssh_dir

    # under --check a directory not made yet cannot take the copy; the task above already says it would be made
    - name: "the authorized keys of {{ join_login }}: root's, or the control node's file nova_join_authorized_keys names"
      ansible.builtin.copy:
        src: "{{ nova_join_authorized_keys | default('/root/.ssh/authorized_keys') }}"
        remote_src: "{{ nova_join_authorized_keys is not defined }}"
        dest: "{{ join_user.home | default('/home/' ~ join_login) }}/.ssh/authorized_keys"
        owner: "{{ join_login }}"
        group: "{{ join_login }}"
        mode: "0600"
      when: not (ansible_check_mode and join_ssh_dir is changed)

    - name: "linger for {{ join_login }} (its user units run with no session open)"
      ansible.builtin.command: "loginctl enable-linger {{ join_login }}"
      args: { creates: "/var/lib/systemd/linger/{{ join_login }}" }

    - name: "the hostname is {{ inventory_hostname }}"
      ansible.builtin.hostname: { name: "{{ inventory_hostname }}" }
      when: nova_join_hostname | bool

- name: the tailnet
  ansible.builtin.import_playbook: tailscale.yml

- name: the tools a seat needs (as the login)
  hosts: "{{ nova_join_host | default('!all') }}"   # no machine named, no host
  gather_facts: true
  gather_subset: [min]
  vars:
    join_platform: "{{ ansible_system | lower }}-{{ 'arm64' if ansible_architecture in ['arm64', 'aarch64'] else 'amd64' }}"
  tasks:
    - name: a Windows machine has no seat here
      ansible.builtin.meta: end_host
      when: ansible_os_family == 'Windows'

    - name: the bin directory
      ansible.builtin.file: { path: "{{ nova_bin_dir }}", state: directory, mode: "0755" }
      register: join_bin_dir

    - name: the login profile bash -l reads
      ansible.builtin.shell: |
        for f in .bash_profile .bash_login .profile; do [ -f "$HOME/$f" ] && { echo "$HOME/$f"; exit 0; }; done; echo "$HOME/.profile"
      args: { executable: /bin/bash }
      register: join_profile
      changed_when: false
      check_mode: false

    - name: the bin directory on the login PATH
      ansible.builtin.blockinfile:
        path: "{{ join_profile.stdout | trim }}"
        create: true
        mode: "0644"
        marker: "# {mark} nova bin directory (fleet/join.yml)"
        block: |
          case ":$PATH:" in *":{{ nova_bin_dir }}:"*) ;; *) PATH="{{ nova_bin_dir }}:$PATH"; export PATH;; esac

    - name: "age {{ nova_age_version }} (Linux, the release archive at its pinned digest)"
      ansible.builtin.get_url:
        url: "https://github.com/FiloSottile/age/releases/download/v{{ nova_age_version }}/age-v{{ nova_age_version }}-{{ join_platform }}.tar.gz"
        dest: "{{ nova_bin_dir }}/.age-v{{ nova_age_version }}-{{ join_platform }}.tar.gz"
        checksum: "sha256:{{ nova_age_sha256[join_platform] }}"
        mode: "0644"
      register: join_age_archive
      when: ansible_system == 'Linux' and not (ansible_check_mode and join_bin_dir is changed)   # --check: no directory to fetch into yet

    - name: age-keygen in the bin directory
      ansible.builtin.stat: { path: "{{ nova_bin_dir }}/age-keygen" }
      register: join_keygen
      when: ansible_system == 'Linux'

    - name: age and age-keygen unpacked into the bin directory (a new archive, or none there)
      ansible.builtin.unarchive:
        src: "{{ nova_bin_dir }}/.age-v{{ nova_age_version }}-{{ join_platform }}.tar.gz"
        dest: "{{ nova_bin_dir }}"
        remote_src: true
        include: [age/age, age/age-keygen]
        extra_opts: [--strip-components=1]
      when: >-
        ansible_system == 'Linux' and (join_age_archive is changed or not join_keygen.stat.exists)
        and not (ansible_check_mode and (join_age_archive is changed or join_age_archive is skipped))

    - name: "sops {{ nova_sops_version }} (Linux, the release binary at its pinned digest)"
      ansible.builtin.get_url:
        url: "https://github.com/getsops/sops/releases/download/v{{ nova_sops_version }}/sops-v{{ nova_sops_version }}.{{ join_platform | replace('-', '.') }}"
        dest: "{{ nova_sops }}"
        checksum: "sha256:{{ nova_sops_sha256[join_platform] }}"
        mode: "0755"
      when: ansible_system == 'Linux' and not (ansible_check_mode and join_bin_dir is changed)

    - name: age-keygen and sops answer
      ansible.builtin.shell: |
        printf 'age=%s sops=%s\n' "$({{ nova_age_keygen }} --version 2>/dev/null || echo none)" "$({{ nova_sops }} --version 2>/dev/null | head -1 | awk '{print $2}' || echo none)"
      args: { executable: /bin/bash }
      register: join_tools
      changed_when: false
      failed_when: false
      check_mode: false

    - name: the tools' receipt
      ansible.builtin.debug:
        msg: "JOIN TOOLS {{ inventory_hostname }} {{ join_tools.stdout | trim }}{{ ' (darwin: brew install age sops where none)' if ansible_system == 'Darwin' else '' }}"

- name: the tailnet check, before any seat is made (control node)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    peer_address: "{{ hostvars[nova_join_host].ansible_host | default('') if nova_join_host in hostvars else '' }}"
  tasks:
    - name: the control node's view of the tailnet
      ansible.builtin.command: tailscale status --json
      register: peer_status
      changed_when: false
      failed_when: false
      check_mode: false

    - name: the machine among the control node's peers, by the row's address
      ansible.builtin.set_fact:
        peer_row: >-
          {{ ((peer_status.stdout | from_json).Peer | default({})).values() | selectattr('DNSName', 'defined')
             | selectattr('DNSName', 'equalto', peer_address ~ '.') | list | first | default({})
             if (peer_status.stdout | default('') | trim).startswith('{') else {} }}

    - name: the row's address is an online tailnet peer name
      ansible.builtin.assert:
        that: peer_address | length > 0 and peer_row.Online | default(false)
        fail_msg: >-
          JOIN STOP {{ nova_join_host }} at the tailnet check: the row's address {{ peer_address }} is not an online peer in
          the control node's `tailscale status` (tailscale.yml records the MagicDNS name; the policy must let this node
          see tag:nova); no seat is made for a machine that is not on the tailnet
        quiet: true
      when: not ansible_check_mode

    - name: "the host key over the tailnet is the one pinned at the row ({{ nova_join_known_hosts }})"
      ansible.builtin.shell: |
        f="{{ nova_join_known_hosts }}"; a="{{ nova_join_first_address }}"; n="{{ peer_address }}"
        grep -qs "^$n " "$f" && { echo present; exit 0; }
        new=$(ssh-keyscan -T 10 "$n" 2>/dev/null) || true
        [ -n "$new" ] || { echo none; exit 0; }
        old=$(grep "^$a " "$f" | awk '{print $2" "$3}' | sort)
        nk=$(printf '%s\n' "$new" | awk '{print $2" "$3}' | sort)
        [ "$old" = "$nk" ] || { echo differs; exit 0; }
        {% if not ansible_check_mode %}printf '%s\n' "$new" >> "$f"{% endif %}
        echo pinned
      args: { executable: /bin/bash }
      register: peer_hostkey
      changed_when: peer_hostkey.stdout | trim == 'pinned'
      check_mode: false
      when: peer_address | length > 0

    - name: a tailnet name that answers with another host key is not this machine
      ansible.builtin.assert:
        that: peer_hostkey.stdout | default('present') | trim in ['present', 'pinned']
        fail_msg: >-
          JOIN STOP {{ nova_join_host }} at the tailnet check: {{ peer_address }} answers with
          {{ 'no host key' if peer_hostkey.stdout | trim == 'none' else 'a host key that is not the one pinned for ' ~ nova_join_first_address }}
          ({{ nova_join_known_hosts }}); a person settles which machine this is
        quiet: true
      when: not ansible_check_mode

    - name: the tailnet check's receipt
      ansible.builtin.debug:
        msg: >-
          JOIN PEER {{ nova_join_host }} address={{ peer_address }} peer={{ 'online' if peer_row.Online | default(false) else ('WOULD-CHECK' if ansible_check_mode else 'missing') }}
          hostkey={{ 'WOULD-PIN' if (ansible_check_mode and peer_hostkey.stdout | default('') | trim == 'pinned') else peer_hostkey.stdout | default('none') | trim }}

- name: the seat
  ansible.builtin.import_playbook: seat.yml

- name: the fleet values, granted into the seat (control node)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    grant_seat: "{{ hostvars[nova_join_host].nova_seat | default(nova_join_host) if nova_join_host in hostvars else nova_join_host }}"
    # the machine's key as seat.yml read it on the machine: grant pins it, or checks it against the pin
    grant_pub: "{{ hostvars[nova_join_host].seat_pub | default('') if nova_join_host in hostvars else '' }}"
  tasks:
    - name: nova_join_grant is a list of names
      ansible.builtin.assert:
        that: nova_join_grant is iterable and nova_join_grant is not string and nova_join_grant is not mapping
        fail_msg: "JOIN STOP {{ nova_join_host }} at the fleet values: nova_join_grant is a list, as -e '{\"nova_join_grant\": [\"A\", \"B\"]}'"
        quiet: true

    - name: granting is asked for
      ansible.builtin.set_fact:
        grant_asked: "{{ nova_seal_seat is defined and nova_seal_key is defined and (nova_join_grant | length) > 0 }}"

    # grant reads the values from the control seat and writes the new seat's grants file in memory, sealed to the pinned
    # machine key and the pinned recovery key: no value is an argument or an output, so the task needs no no_log, and a
    # refusal is one line that names no value
    - name: "{{ nova_join_grant | join(',') }} granted into the new seat (nova-secrets grant)"
      ansible.builtin.command:
        argv: >-
          {{ [nova_control_secrets, 'grant', nova_join_grant | join(','), '--to', grant_seat, '--pins', nova_seal_pins,
              '--store', nova_seal_store, '--key', nova_seal_key, '--as', nova_seal_seat, '--sops', nova_control_sops]
             + (['--pub', grant_pub] if grant_pub is match('^age1') else []) }}
      register: join_grant
      changed_when: "'committed' in join_grant.stdout"
      failed_when: false
      when: grant_asked and not ansible_check_mode

    - name: a refused grant stops the join with its reason
      ansible.builtin.fail:
        msg: >-
          JOIN STOP {{ nova_join_host }} at the fleet values:
          {{ join_grant.stderr_lines | select('match', '^(SECRETS GRANT REFUSED|nova-secrets grant:) ') | first | default('rc=' ~ join_grant.rc) }}
      when: join_grant is not skipped and join_grant.rc != 0

    - name: commits the machine needs that are not pushed yet (its rule, its values)
      ansible.builtin.command: { argv: [git, -C, "{{ nova_seal_store }}", rev-list, --count, "@{u}..HEAD"] }
      register: join_ahead
      changed_when: false
      failed_when: false
      check_mode: false
      when: nova_seal_push | bool

    - name: the store, pushed (the machine pulls its clone next)
      ansible.builtin.command: { argv: [git, -C, "{{ nova_seal_store }}", push, -q] }
      when: nova_seal_push | bool and join_ahead.rc | default(1) == 0 and (join_ahead.stdout | default('0') | int) > 0 and not ansible_check_mode

    - name: the grant's receipt
      ansible.builtin.debug:
        msg: >-
          JOIN GRANT {{ grant_seat }}
          {%- if not grant_asked %} not asked (give nova_seal_seat, the operator's seat, and nova_seal_key, its key)
          {%- elif ansible_check_mode %} WOULD-GRANT {{ nova_join_grant | join(',') }} from {{ nova_seal_seat }} (check: nothing written)
          {%- else %} {{ join_grant.stdout | trim | regex_replace('^SECRETS GRANT OK ', '') | regex_replace(';.*$', '') }}{% endif %}
          {%- if nova_seal_push | bool and join_ahead.rc | default(0) != 0 %} NOTE not pushed: the clone has no upstream (git -C {{ nova_seal_store }} push -u origin HEAD, then run again)
          {%- elif nova_seal_push | bool and (join_ahead.stdout | default('0') | int) > 0 %} pushed={{ 'WOULD-PUSH' if ansible_check_mode else join_ahead.stdout | trim }}{% endif %}

- name: the store, pulled on the machine
  hosts: "{{ nova_join_host | default('!all') }}"
  gather_facts: true
  gather_subset: [min]
  pre_tasks:
    - name: the control node's recovery pin
      ansible.builtin.stat: { path: "{{ nova_seal_pins }}/recovery.pub" }
      delegate_to: localhost
      become: false
      register: join_rec_pin
      when: ansible_os_family != 'Windows'

    - name: the machine's pin directory (private)
      ansible.builtin.file: { path: "{{ nova_secrets_pins }}", state: directory, mode: "0700" }
      when: ansible_os_family != 'Windows' and join_rec_pin.stat.exists | default(false)

    - name: "the recovery pin on the machine, from the control node's (what its own `set` seals to)"
      ansible.builtin.copy:
        src: "{{ nova_seal_pins }}/recovery.pub"
        dest: "{{ nova_secrets_pins }}/recovery.pub"
        mode: "0600"
      when: ansible_os_family != 'Windows' and join_rec_pin.stat.exists | default(false)
  roles:
    - role: secrets-refresh
      when: ansible_os_family != 'Windows'
  tasks:
    - name: one pull now, so the check below sees what was pushed (the timer keeps it current)
      ansible.builtin.command: { argv: ["{{ nova_bin_dir }}/nova-secrets-refresh", "{{ nova_secrets_store }}", "{{ nova_secrets_refresh_log }}"] }
      changed_when: false
      failed_when: false
      when: ansible_os_family != 'Windows' and nova_secrets_refresh | bool and not ansible_check_mode

- name: the join's check
  hosts: "{{ nova_join_host | default('!all') }}"   # no machine named, no host
  gather_facts: true
  gather_subset: [min]
  tasks:
    - name: the control node's view of the tailnet
      ansible.builtin.command: tailscale status --json
      delegate_to: localhost
      become: false
      register: check_peers
      changed_when: false
      failed_when: false
      check_mode: false

    - name: the machine among the control node's peers
      ansible.builtin.set_fact:
        check_peer: >-
          {{ ((check_peers.stdout | from_json).Peer | default({})).values() | selectattr('DNSName', 'defined')
             | selectattr('DNSName', 'equalto', (ansible_host | default('')) ~ '.') | list | first | default({})
             if (check_peers.stdout | default('') | trim).startswith('{') else {} }}

    - name: the peer is online
      ansible.builtin.assert:
        that: check_peer.Online | default(false)
        fail_msg: >-
          JOIN CHECK {{ inventory_hostname }}: the control node's `tailscale status` has no online peer {{ ansible_host | default('') }}
          (the control node must be on the same tailnet, and the policy must let it see tag:nova)
        quiet: true
      when: not ansible_check_mode

    - name: the bus password in the machine's seat (names only; no value read)
      ansible.builtin.command:
        argv: ["{{ nova_bin_dir }}/nova-secrets", names, --store, "{{ nova_secrets_store }}", --as, "{{ nova_seat }}"]
      register: check_names
      changed_when: false
      failed_when: false
      check_mode: false
      when: ansible_os_family != 'Windows' and nova_bus_redis is defined

    - name: nova-bus who, from the machine
      ansible.builtin.command:
        argv:
          - "{{ nova_bin_dir }}/nova-secrets"
          - exec
          - --only
          - "{{ nova_redis_seal_name | default('NOVA_BUS_PASSWORD') }}"
          - --store
          - "{{ nova_secrets_store }}"
          - --key
          - "{{ nova_secrets_key_dir }}/{{ nova_seat }}.key"
          - --as
          - "{{ nova_seat }}"
          - --sops
          - "{{ nova_sops }}"
          - --
          - env
          - "NOVA_BUS_REDIS={{ nova_bus_redis | default('') }}"
          - "NOVA_BUS_USER={{ nova_bus_user }}"
          - "{{ nova_bin_dir }}/nova-bus"
          - who
      register: check_who
      changed_when: false
      check_mode: false
      when: check_names is not skipped and (nova_redis_seal_name | default('NOVA_BUS_PASSWORD')) in check_names.stdout_lines

    - name: the check's receipt
      ansible.builtin.debug:
        msg: >-
          JOIN CHECK {{ inventory_hostname }} peer={{ 'online' if check_peer.Online | default(false) else ('WOULD-CHECK' if ansible_check_mode else 'missing') }}
          {%- if check_who is not skipped %} bus={{ check_who.stdout_lines | first | default('?') }}
          {%- elif nova_bus_redis is not defined %} NOTE bus not checked: no nova_bus_redis (host:port) given
          {%- elif nova_seal_seat is defined and nova_seal_key is defined %} NOTE bus not checked: seat {{ nova_seat }} holds no {{ nova_redis_seal_name | default('NOVA_BUS_PASSWORD') }} in this machine's clone yet (the grant is not pushed, or not pulled here: see JOIN GRANT, then run again)
          {%- else %} NOTE bus not checked: seat {{ nova_seat }} holds no {{ nova_redis_seal_name | default('NOVA_BUS_PASSWORD') }} yet (give -e nova_seal_seat=<the operator's seat> -e nova_seal_key=<its key> and run again: the join grants it){% endif %}
