# tailscale.yml: each machine on the tailnet, its address the MagicDNS name, its firewall closed to everything but
# the tailnet (docs/FLEET.md, "tailscale.yml"; join.yml imports it). The adopter owns the account, the auth key and
# the policy (fleet/tailscale-acl.json); this play does the rest:
#
#   1. Tailscale installed: Tailscale's apt repository on Debian and Ubuntu, Homebrew's cask on macOS, winget on Windows.
#   2. `tailscale up --auth-key=file:/dev/stdin --hostname <machine> --advertise-tags=tag:nova[,tag:runner] [--ssh]`,
#      the key TAILSCALE_AUTHKEY from the control node's environment, on stdin; skipped when the machine is Running
#      with the same tags (a hostname or Tailscale SSH that differs is set in place, with no key).
#   3. The machine's MagicDNS name (<machine>.<tailnet>.ts.net) recorded as its address in nova-config
#      (`nova-config machine set <name> --address ...`), then the inventory read again, so the next play, every later
#      run, the bus and the services reach it there.
#   4. The firewall: ufw denies incoming on Linux but on tailscale0 (only over a run that already comes in on the
#      tailnet, so it cannot lock itself out); the application firewall on macOS.
#
#   nova-secrets exec --only TAILSCALE_AUTHKEY,NOVA_PG_PASSWORD --store S --key K --as SEAT -- \
#     env NOVA_PG_DSN=postgres://nova_config@HOST:5432/nova ansible-playbook -i ./inventory fleet/tailscale.yml -l <machine>
- name: the tailnet
  hosts: "{{ nova_join_host | default('all') }}"
  gather_facts: true
  gather_subset: [min]
  tasks:
    - name: install, join, record the address
      ansible.builtin.include_role: { name: tailscale }

    - name: the inventory, read again (the address is the tailnet name now)
      ansible.builtin.meta: refresh_inventory

- name: the firewall (over the tailnet)
  hosts: "{{ nova_join_host | default('all') }}"
  gather_facts: true
  gather_subset: [min]
  tasks:
    - name: deny incoming but the tailnet
      ansible.builtin.include_role: { name: tailscale, tasks_from: firewall }
