# purpose: every machine's copy of the secrets store kept current: pushed by the control node, or pulled on a timer
#
# secrets-refresh.yml: every machine's copy of the secrets store at nova_secrets_store, kept current, so a seat never
# opens a stale store (fleet/README.md, "secrets-refresh.yml").
#
# Push mode (the default, nova_secrets_repo empty): the control node puts the store's files there over SSH (rsync,
# no .git, 0700 directories, 0600 files); with -e nova_seal_store=<the control node's clone> this play does the push.
# No timer runs on the machine, and one left from pull mode is removed. A machine with no store fails the run
# (mode=push missing).
#
# Pull mode (nova_secrets_repo set): a git clone pulled fast-forward only every nova_secrets_refresh_every seconds by
# files/nova-secrets-refresh, which reads no value, prints no credential and logs one line per run.
#
#   ansible-playbook -i ./inventory fleet/secrets-refresh.yml -e nova_seal_store=S --check --diff
#   ansible-playbook -i ./inventory fleet/secrets-refresh.yml -e nova_seal_store=S
- name: the secrets store, kept current
  hosts: all
  gather_facts: true
  gather_subset: [min]
  pre_tasks:
    - name: the control node has what the run needs
      ansible.builtin.include_role: { name: preflight }
      vars:
        preflight_control: >-
          {{ [{'cmd': 'rsync', 'for': 'the push of the store'}]
             if (nova_seal_store is defined and (nova_secrets_repo | default('')) | length == 0) else [] }}
  roles:
    - secrets-refresh
