# secrets-refresh.yml: every machine's clone of the secrets store (nova_secrets_store) pulled fast-forward only every
# nova_secrets_refresh_every seconds, so a seat never opens a stale store (docs/FLEET.md, "secrets-refresh.yml"). The
# pull is files/nova-secrets-refresh: it reads no value, prints no credential and logs one line per run (time, commit,
# ok or FAIL). A machine with nova_secrets_refresh false (the one that writes the store) has the timer removed.
#
#   ansible-playbook -i ./inventory fleet/secrets-refresh.yml --check --diff
#   ansible-playbook -i ./inventory fleet/secrets-refresh.yml
- name: the secrets store, pulled on a timer
  hosts: all
  gather_facts: true
  gather_subset: [min]
  roles:
    - secrets-refresh
