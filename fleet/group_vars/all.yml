      file: "OpenJDK21U-jdk_x64_mac_hotspot_{{ nova_sdk_jdk_version }}.tar.gz"
      sha256: 44db0f08196daf19a47f90d13388b0c943b67663cb537f998fe29e836fa842ce
      top: "jdk-{{ nova_sdk_jdk_version | replace('_', '+') }}"
    otp:
      url: "https://github.com/erlef/otp_builds/releases/download/OTP-{{ nova_sdk_otp_version }}/otp-x86_64-apple-darwin.tar.gz"
      file: "otp-{{ nova_sdk_otp_version }}-x86_64-apple-darwin.tar.gz"
