    jdk:
      url: "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-{{ nova_sdk_jdk_version | replace('_', '%2B') }}/OpenJDK21U-jdk_x64_linux_hotspot_{{ nova_sdk_jdk_version }}.tar.gz"
      file: "OpenJDK21U-jdk_x64_linux_hotspot_{{ nova_sdk_jdk_version }}.tar.gz"
      sha256: ce79869e1307ed8ee1e2baa86a412b1eb5b75d10a01006d788a6f968bcfaee94
