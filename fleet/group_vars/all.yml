# The defaults of the fleet plays (tools.yml, redis.yml, loops.yml). The
# inventory nova-config prints (its host variables) overrides each, and so do
# a group_vars/<group>.yml (benches.yml) and host_vars/<machine>.yml beside the
# inventory; a group_vars/all.yml beside the inventory does not (this file is
# read after it). No value here names a machine, a seat or a person; those
# come from nova-config (docs/FLEET.md).

# Where a machine keeps the tools and the fleet's files: its login's home.
nova_home: "{{ ansible_env.HOME }}"
nova_bin_dir: "{{ nova_home }}/.local/bin"
nova_release_dir: "{{ nova_home }}/nova-bench/release"
# The installed build is recorded here, one line: the version tools.yml last
# installed (the machine's nova_build fact).
nova_build_file: "{{ nova_home }}/.config/nova/build"

# The PATH a loop unit runs with (/usr/sbin and /sbin hold lsof, which nova-sprint live needs).
nova_loop_path: "{{ nova_bin_dir }}:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
# A darwin machine's loops are LaunchAgents in the login's GUI domain (gui) or
# LaunchDaemons dropped to the login (system, which needs sudo); auto asks
# launchd whether the login has a GUI domain (a login that is never the
# console user has none) and takes system when it has not. On darwin, launchd
# agent logs go under the user's home (~/Library/Logs/nova-loop-<name>.log)
# because launchd cannot open log files on network volumes such as
# /Volumes/nova; the program's own state and logs stay where they are. A linux
# machine's are systemd user units (user, with linger) or system units dropped
# to the login (system).
nova_launchd_domain: auto
nova_systemd_scope: user
# Units of another tool's (com.nova.loop.<name>.plist, nova-loop-<name>.service
# not written by loops.yml) to retire by name; every other such unit is left
# alone and listed.
nova_retire_units: []

# The disk guard loops.yml adds to every machine (nova-swarm disk-guard): on
# when true, run every nova_disk_guard_every seconds, with these arguments
# after the --root of each loop record's argv. The scan finds the readers'
# roots, a stopped loop's too; the glob holds the CI runners' Go build caches.
nova_disk_guard: true
nova_disk_guard_every: 900
nova_disk_guard_args: ["--scan", "~/nova-bench/run", "--cache", "~/runner-*/_cache/go-build"]

# The loop records loops.yml renders and restarts, by name (a list, or one
# comma-separated word); empty is every record of the machine. Under it every
# other unit is left as it is and nothing is retired.
nova_loop_only: []

# The loop records a run restarts even when their unit file did not change, by
# name (a list, or one comma-separated word); a loop hung on a dead server is
# restarted through the play, never by hand. Empty restarts nothing extra.
nova_loop_restart: []

# How long the supervisor waits for a member loop (nova-swarm member) it stops
# before it kills what is left, in seconds: a member drains on SIGTERM (takes
# nothing new, lets its running cards finish and reports them) for at most
# member.DrainMost, two minutes, and this is a minute above it (KillMode=mixed
# and TimeoutStopSec under systemd, ExitTimeOut under launchd).
nova_member_stop_timeout: 180

# The nova-secrets layout a loop with keys opens its secrets through: the
# store, the directory of seat keys (<seat>.key) and the sops binary: nova_sops
# when a host sets it, else the first of these that exists on the machine.
nova_secrets_store: "{{ nova_home }}/nova-bench/secrets"
nova_secrets_key_dir: "{{ nova_home }}/.config/nova-secrets"
nova_sops_candidates: ["{{ nova_home }}/.local/bin/sops", /opt/homebrew/bin/sops, /usr/local/bin/sops]

# The store endpoint comes from the applied fleet row as host variables
# nova_redis_port and nova_redis_addr. Host scope keeps this file's defaults
# from replacing a declared nonstandard port.
# Who loads the function library (fn load) and who writes the ACL (acl
# apply), and the names of the secrets that hold their passwords in the
# store_deployer machine's seat.
nova_redis_deploy_user: coordinator
nova_redis_deploy_password_key: NOVA_REDIS_COORDINATOR_PASSWORD
nova_redis_admin_user: admin
nova_redis_admin_password_key: NOVA_REDIS_ADMIN_PASSWORD
# The secret, in the store_deployer machine's seat, that holds the password a
# user acl apply creates gets; a user the store lacks and this map does not
# name is refused, never created without a password.
nova_redis_user_password_keys:
  coordinator: NOVA_REDIS_COORDINATOR_PASSWORD
  bench: NOVA_REDIS_BENCH_PASSWORD

# The configuration store tools.yml migrates before anything reads a kind the
# build adds. Its explicit password-free nova_pg_dsn comes from the applied
# fleet row. The migration runs as nova_pg_owner, the one Postgres role that
# owns schema config and every table in it (only the owner alters and fills
# them; on 2026-10-08 a migrate as the seat's own role was refused and the
# store stayed behind the build for 7h45m): nova_pg_owner_dsn is nova_pg_dsn
# with its user replaced by that role, and nova_pg_password_key names the
# owner's password in the store_deployer machine's seat. The seat play reads
# the store's owner back (nova-config migrate --dry-run, owner=) before its
# window and refuses a store not owned whole by this role.
nova_pg_owner: nova_config
nova_pg_owner_dsn: >-
  {{ ((nova_pg_dsn.split('://', 1) | first) ~ '://' ~ nova_pg_owner ~ '@'
      ~ ((nova_pg_dsn.split('://', 1) | last) | regex_replace('^[^@/]*@', '')))
     if '://' in nova_pg_dsn else
     (((nova_pg_dsn.split() | reject('match', 'user=') | list) + ['user=' ~ nova_pg_owner]) | join(' ')) }}
nova_pg_password_key: NOVA_PG_CONFIG_PASSWORD

# The build tools.yml installs: nova_version (required, -e) built from the
# nova-tools checkout nova_source on the machine that runs the play, under
# nova_release_out, with nova-sprint, nova-card and nova-work (which left
# nova-tools at v1.2.3) taken from the mas-bandwidth/nova-sprint release
# downloaded into nova_sprint_release (required, -e; `gh release download <tag>
# -R mas-bandwidth/nova-sprint -D <dir>`), verified and never compiled here.
# nova_release_gate_args is passed to the build as is, for
# its definition-of-done gate: the checkout's command reference and the dogfood
# receipts in nova_dogfood_receipts (required, -e: the build guesses no
# receipts directory, SPEC-RELEASE rule 12). A waiver replaces the list whole:
#   -e '{"nova_release_gate_args": ["--no-dogfood-gate", "--reason", "<why>"]}'
nova_release_out: "{{ lookup('env', 'HOME') }}/nova-bench/release-build"
nova_release_gocache: "{{ lookup('env', 'HOME') }}/nova-bench/release-gocache"
nova_release_gate_args: ["--cli", "{{ nova_source }}/docs/CLI.md", "--receipts", "{{ nova_dogfood_receipts }}"]
# nova_release_build_args is appended to the build after the gate's: empty for
# a whole build; `nova-update release cycle` passes --incremental and
# --gate report --reason <why> (docs/SPEC-RELEASE.md rule 13).
nova_release_build_args: []

# The TLC record machines (the inventory's tla group: the machine rows with
# tla=true) hold the pinned TLC jar at nova_tla_jar, owned by the login. The
# tools play's tla play checks its SHA-256 against the sum the repository
# holds (nova_tla_sha256_file, read on the machine running the play) and
# refuses a jar that differs or is missing; it downloads nothing, so the jar
# is placed by hand (tla/README.md, "The record machines"). java is the first
# of nova_tla_java_candidates that exists on the machine.
nova_tla_dir: /opt/tla
nova_tla_jar: "{{ nova_tla_dir }}/tla2tools.jar"
nova_tla_sha256_file: "{{ playbook_dir }}/../tla/tla2tools.sha256"
nova_tla_java_candidates: ["{{ nova_home }}/sdk/bin/java", /usr/bin/java, /usr/local/bin/java]

# The seat play of tools.yml (the coordinator machine adopts the build): the
# dashboard binary links that name the installed nova-sprint (empty: none),
# the URL whose answer is the dashboard's summary ("" skips the check), extra
# host:port addresses the server must answer on besides its --listen ones,
# the deadline of the build's shadow tick before any restart, how long each
# reinstalled friend daemon has to beat (seconds), and the launchd labels the
# play never restarts.
nova_seat_dashboard_links: []
nova_seat_dashboard_url: ""
nova_seat_server_ports: []
nova_seat_tick_deadline: 60s
nova_seat_beat_within: 60
nova_seat_hold: []
# The launchd agents directory the seat play reads and the launchctl it
# runs, and how long it waits for a stale friend daemon's lanes to put their
# cards down when its plist sets no ExitTimeOut (seconds).
nova_seat_agents_dir: "{{ nova_home }}/Library/LaunchAgents"
nova_launchctl: launchctl
nova_seat_friend_drain: 180
# Where the seat play keeps the tools an adoption replaces (bin/), so a
# refusal inside its window can put them back, load their library again and
# start the old server on them; and how long the window waits for every old
# nova-sprint and nova-swarm member to be gone before it migrates (seconds).
nova_seat_rollback_dir: "{{ nova_release_dir }}/adopt-rollback"
nova_seat_quiet: 60

# The coordinator's self a friend's lane wall never writes inside (nova-friend install
# --deny-self), for a friend whose plist records none; the seat play passes it to the
# reinstall. Empty (the default) leaves the daemon's own default: the seat's working root,
# <home>/<seat>-working. A friend's plist that already records --deny-self keeps its own.
nova_friend_deny_self: ""

# What a friend's lane wall lets its harness read beyond the system roots (nova-friend install
# --wall-reads), for a friend whose plist records none; the seat play passes it to the reinstall.
# A pinned harness whose shim lives under the home (~/.local/bin/opencode execs ~/nova-bench/<harness_dir>)
# needs its directory here or every lane exits 126 (Operation not permitted). Set it in the host's
# host_vars; empty (the default) adds nothing. A friend's plist that already records --wall-reads keeps its own.
nova_friend_wall_reads: ""

# The toolchains every member carries (fleet/toolchains.yml): the bench
# standard of 2026-09-20 (hetzner1, space, vision, batman, superman were made
# by hand then; the play converges the rest to the same layout). Each lives
# under nova_sdk_dir as <tool>-<version>/ with its executables linked into
# nova_sdk_dir/bin, and nova_sdk_dir/env.sh puts that directory first on PATH;
# ~/.bashrc (Linux, its first line) and ~/.zshenv (Darwin) source it, so a card
# or a make recipe in a non-login shell sees every tool. The downloads land in
# nova_sdk_dir/dl, each checked against the SHA-256 recorded here before it is
# unpacked (a changed file refuses the play: update the pin on purpose). The
# versions are the bench standard's; change them here and nowhere else.
nova_sdk_dir: "{{ nova_home }}/sdk"
# Go lives at nova_sdk_dir/go<version> (no dash: the directory the standard
# made by hand on 2026-09-20 and the join put on b1-b3, hetzner2 and mini-m5),
# linked as go and gofmt in bin/ and as ~/go/bin/go, the link the member's
# BenchGoBin (pkg/swarm/toolchain.go) looks for.
nova_sdk_go_version: 1.26.6
nova_sdk_rust_version: 1.98.1
nova_sdk_dart_version: 3.13.2
nova_sdk_node_version: 26.7.0
# Eclipse Temurin 21.0.12.1+1; the directory is jdk-21.0.12.1_1 (no '+' in a path).
nova_sdk_jdk_version: 21.0.12.1_1
nova_sdk_dotnet_version: 10.0.401
nova_sdk_otp_version: 29.0.5
nova_sdk_elixir_version: 1.20.4
nova_sdk_sbcl_version: 2.5.8
# The TLC jar every member holds for the TLA cards (nova_tla_jar, pinned by
# tla/tla2tools.sha256): the TLA+ project's v1.7.4 release, whose jar has that
# SHA-256 (measured 2026-10-11 against the jar the record machines hold).
nova_sdk_tla_jar_url: https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
# Downloads the platform does not decide.
nova_sdk_common_downloads:
  # Elixir's precompiled release for OTP 29 (BEAM bytecode, one zip for every platform).
  elixir:
    url: "https://github.com/elixir-lang/elixir/releases/download/v{{ nova_sdk_elixir_version }}/elixir-otp-29.zip"
    file: elixir-otp-29.zip
    sha256: 7863c546cda13fecc949e562e326042451dacf8fd8698a36783cb71eeb223b46
  # Microsoft's installer script; it downloads the pinned SDK for the machine's
  # platform itself. The script is republished in place, so this pin is of the
  # text the fleet was made with (2026-09-20); a changed script refuses the
  # play until the pin is re-read on purpose.
  dotnet_install:
    url: https://dot.net/v1/dotnet-install.sh
    file: dotnet-install.sh
    sha256: 082f7685e156738a1b2e2ed8381a621870d4ce8e8c59278034556f05c186eb2e
  # SBCL's source, built on Darwin where sbcl.org publishes no binary of this
  # version (the bootstrap host lisp is the platform's sbcl_boot below).
  sbcl_source:
    url: "https://sourceforge.net/projects/sbcl/files/sbcl/{{ nova_sdk_sbcl_version }}/sbcl-{{ nova_sdk_sbcl_version }}-source.tar.bz2/download"
    file: "sbcl-{{ nova_sdk_sbcl_version }}-source.tar.bz2"
    sha256: a7603e855095f635de021710a4e720d74d0b3e7c3e7ac520fe358897f586a9ae
# Downloads by platform (<system>-<arch>, as tools.yml's nova_platform). Each
# entry is url, file (the name under nova_sdk_dir/dl) and sha256, plus `top`,
# the directory the archive unpacks to ('' when it unpacks flat).
nova_sdk_downloads:
  linux-amd64:
    go:
      url: "https://go.dev/dl/go{{ nova_sdk_go_version }}.linux-amd64.tar.gz"
      file: "go{{ nova_sdk_go_version }}.linux-amd64.tar.gz"
      sha256: 708effb774be8237570d0add163225abbdfaf4fca28b2611df167beba4feef89
      top: go
    rust:
      url: "https://static.rust-lang.org/dist/rust-{{ nova_sdk_rust_version }}-x86_64-unknown-linux-gnu.tar.xz"
      file: "rust-{{ nova_sdk_rust_version }}-x86_64-unknown-linux-gnu.tar.xz"
