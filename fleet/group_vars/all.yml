# The defaults the fleet plays share (every fleet/*.yml; a role keeps its own in roles/<role>/defaults). Override
# any of them from the inventory: a host variable from `nova-config inventory`,
# or a group_vars/<group>.yml or host_vars/<machine>.yml beside it (fleet/README.md,
# "Overriding the defaults"). A group_vars/all.yml beside the inventory does not
# override these: this file is read after it.

# The tools nova-tools ships, by name: install.yml installs them and
# services.yml prefixes argv[0] with nova_bin_dir when it is one of them.
nova_tools_names: [nova-bus, nova-cairn, nova-config, nova-sandbox, nova-secrets, nova-reserve, nova-fleet]

# Where a machine keeps the tools: its login's home.
nova_home: "{{ ansible_facts['env']['HOME'] }}"
nova_bin_dir: "{{ nova_home }}/.local/bin"

# The PATH a service unit runs with; a service row's env may set its own.
nova_service_path: "{{ nova_bin_dir }}:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

# A darwin machine's services are LaunchAgents in the login's GUI domain (gui) or
# LaunchDaemons dropped to the login (system, which needs sudo); auto asks
# launchd whether the login has a GUI domain and takes system when it has not.
# A linux machine's are systemd user units (user, with linger) or system units
# dropped to the login (system).
nova_launchd_domain: auto
nova_systemd_scope: user

# Units of another tool's (com.nova.service.<name>.plist, nova-service-<name>.service
# not written by services.yml) to retire by name; every other such unit is left
# alone and listed.
nova_retire_units: []

# The service records services.yml renders and restarts, by name (a list, or one
# comma-separated word); empty is every record of the machine. Under it every
# other unit is left as it is and nothing is retired.
nova_service_only: []

# The service records a run restarts even when their unit file did not change, by
# name (a list, or one comma-separated word). Empty restarts nothing extra.
nova_service_restart: []

# A host with no service rows retires the units this play wrote only when asked:
# otherwise the run refuses and names them (-e nova_service_retire_all=true).
nova_service_retire_all: false

# The nova-secrets layout a service with keys opens its secrets through: the
# store, the directory of seat keys (<seat>.key) and the sops binary
# (nova-secrets exec requires --store and --key and takes --sops).
nova_secrets_store: "{{ nova_home }}/.local/share/nova/secrets"
nova_secrets_key_dir: "{{ nova_home }}/.config/nova-secrets"
# The pins nova-secrets set seals to on a machine: <dir>/recovery.pub, put there by join.yml from the control node's.
nova_secrets_pins: "{{ nova_home }}/.config/nova-secrets/pins"
nova_sops: "{{ '/opt/homebrew/bin/sops' if (nova_system | default(ansible_facts['system'] | default(''))) == 'Darwin' else nova_bin_dir ~ '/sops' }}"

# The seat a machine opens its secrets as (nova-secrets --as, services.yml's
# <seat>.key): its inventory name, the short hostname nova-secrets defaults to.
nova_seat: "{{ inventory_hostname }}"
# What join.yml puts in the bin directory on Linux (age, age-keygen, sops): the
# install's leftover check allows them (fleet/README.md, "install", Leftovers).
nova_join_owns:
  bin: [age, age-keygen, sops]
nova_age_keygen: "{{ '/opt/homebrew/bin/age-keygen' if (nova_system | default(ansible_facts['system'] | default(''))) == 'Darwin' else nova_bin_dir ~ '/age-keygen' }}"

# The age and sops a Linux machine gets from join.yml, pinned by the digest
# GitHub publishes for each release asset. A darwin machine takes Homebrew's.
nova_age_version: "1.3.2"
nova_age_sha256:
  linux-amd64: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
  linux-arm64: 6b8dc4333c53a5a57c9e5834e3a48f92605d7154014cd07269ff3327db5d37f4
nova_sops_version: "3.13.3"
nova_sops_sha256:
  linux-amd64: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
  linux-arm64: 53b0abacd38ef1b12a66d6c100956691b9cefce018d91f81e73ddf7438b94d77

# join.yml (fleet/README.md, "join"). The machine and its row's fields
# (nova_join_host, nova_join_user, nova_join_address, nova_join_os,
# nova_join_arch, nova_join_cores) have no default: they are the run's.
nova_join_roles: bench
nova_join_actor: "{{ lookup('ansible.builtin.env', 'USER') or 'fleet' }}"
nova_join_root_user: root
nova_join_sudo_group: sudo
nova_join_hostname: true
# nova_join_host_key ("ssh-ed25519 AAAA...", from the provider's console) has no default: given, it is the host key
# pinned for the row's address; else the key the address answers with at the first connection is.

# The names join.yml grants into a new machine's seat from the control seat
# (nova_seal_seat, opened with nova_seal_key).
nova_join_grant: [NOVA_BUS_PASSWORD]

# The control node's side of the secrets store: nova_seal_store (its clone of
# the store) has no default. seat.yml adds seat rules there; redis.yml and
# postgres.yml seal a password into the seat nova_seal_seat names, opened with
# the key nova_seal_key, when both are given. The three binaries are the
# control node's (on its PATH unless given as paths).
nova_control_secrets: nova-secrets
nova_control_config: nova-config
nova_control_sops: sops
# The control node's pins, outside the store: recovery.pub (nova-secrets init --pins writes it) and one <seat>.pub
# per machine, written by seat.yml from the key read on the machine; set and grant seal to these, whatever the
# store says.
nova_seal_pins: "{{ lookup('ansible.builtin.env', 'HOME') }}/.config/nova-secrets/pins"
