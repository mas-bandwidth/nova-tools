    otp:
      url: "https://github.com/erlef/otp_builds/releases/download/OTP-{{ nova_sdk_otp_version }}/otp-aarch64-apple-darwin.tar.gz"
      file: "otp-{{ nova_sdk_otp_version }}-aarch64-apple-darwin.tar.gz"
      sha256: 24b9e00da2b9ad25b1f182e2efd73ff316e46ec4b143c0cc3c69dbd27d5a594d
      top: ""
    # The host lisp that builds nova_sdk_sbcl_version from source: Homebrew's
    # sbcl (brew: names the formula). The newest arm64 Darwin binary sbcl.org
    # publishes, 2.4.0, does not start on macOS 27 (mini-m5, 2026-10-11:
    # "failed to allocate 1048576 bytes at 0x300100000"). The host only compiles
    # the pinned source; what lands in nova_sdk_dir is the pinned version.
    sbcl_boot:
      brew: sbcl
    # SBCL 2.5.8 itself does not run on macOS 27 arm64: built here, its own
    # warm init stops at the same "failed to allocate ... at 0x300100000"
