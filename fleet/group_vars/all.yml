# The defaults of the fleet plays (loops.yml, nova-tools-install.yml). The
# inventory nova-config prints (its host variables) overrides each, and so do
# a group_vars/<group>.yml and host_vars/<machine>.yml beside the inventory; a
# group_vars/all.yml beside the inventory does not (this file is read after
# it). No value here names a machine, a seat or a person; those come from
# nova-config (docs/FLEET.md).

# Where a machine keeps the tools: its login's home.
nova_home: "{{ ansible_env.HOME }}"
nova_bin_dir: "{{ nova_home }}/.local/bin"

# The PATH a loop unit runs with.
nova_loop_path: "{{ nova_bin_dir }}:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
# A darwin machine's loops are LaunchAgents in the login's GUI domain (gui) or
# LaunchDaemons dropped to the login (system, which needs sudo); auto asks
# launchd whether the login has a GUI domain (a login that is never the
# console user has none) and takes system when it has not. On darwin, launchd
# agent logs go under the user's home (~/Library/Logs/nova-loop-<name>.log)
# because launchd cannot open log files on network volumes; the program's own
# state and logs stay where they are. A linux machine's are systemd user units
# (user, with linger) or system units dropped to the login (system).
nova_launchd_domain: auto
nova_systemd_scope: user
# Units of another tool's (com.nova.loop.<name>.plist, nova-loop-<name>.service
# not written by loops.yml) to retire by name; every other such unit is left
# alone and listed.
nova_retire_units: []

# The loop records loops.yml renders and restarts, by name (a list, or one
# comma-separated word); empty is every record of the machine. Under it every
# other unit is left as it is and nothing is retired.
nova_loop_only: []

# The loop records a run restarts even when their unit file did not change, by
# name (a list, or one comma-separated word); a loop hung on a dead server is
# restarted through the play, never by hand. Empty restarts nothing extra.
nova_loop_restart: []

