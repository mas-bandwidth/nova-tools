# purpose: guards that let a Linux machine get itself out of trouble, and a disk report
#
# health.yml: guards that let a Linux machine get itself out of trouble, and a disk report (fleet/README.md,
# "health"): the journal kept on disk, a kernel panic that reboots, ssh sessions the OOM killer may kill, rsyslog's
# files rotated by size with an already flooded one cut down, a memory ceiling on the login's user slice with a user
# manager that comes back, and a DISK line in the journal every 6 hours (DISK-WARN over nova_health_disk_warn_pct).
# A darwin machine is skipped.
#
#   ansible-playbook -i ./inventory fleet/health.yml --check --diff
#   ansible-playbook -i ./inventory fleet/health.yml
- name: self-healing guards and the disk report (Linux)
  hosts: all
  gather_facts: true
  gather_subset: [min, hardware]
  roles:
    - health
