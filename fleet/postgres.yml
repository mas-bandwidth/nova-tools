# postgres.yml: the PostgreSQL nova-config keeps the fleet in, on each machine of the `services` group (docs/FLEET.md,
# "postgres.yml"): postgresql-<nova_pg_version> from the release's main or the PostgreSQL project's repository (its key
# pinned by fingerprint), listening on the tailnet address only, scram-sha-256 from nova_pg_allow_cidr and nothing
# else; the database, nova-config's roles nova_admin, nova_config and nova_read with a password each made once on the
# machine (<nova_pg_dir>/<role>.pass, root 0600) and proven over the network, the grants on schema config, and a
# nightly pg_dump kept nova_pg_dump_keep_days. With nova_seal_store, nova_seal_seat and nova_seal_key given, the
# nova_config password is set into that seat as NOVA_PG_PASSWORD (the seal role). Then the control node proves the port.
#
#   ansible-playbook -i ./inventory fleet/postgres.yml --check --diff
#   ansible-playbook -i ./inventory fleet/postgres.yml -e nova_seal_store=S -e nova_seal_seat=SEAT -e nova_seal_key=K
#   nova-config schema | psql "postgres://nova_admin@<address>:5432/nova"     (once, then after a nova-config upgrade)
- name: nova-config's PostgreSQL
  hosts: services
  become: true
  gather_facts: true
  gather_subset: [min]
  roles:
    - postgres
  tasks:
    - name: the nova_config password, sealed into a seat
      ansible.builtin.include_role:
        name: seal
      vars:
        seal_file: "{{ nova_pg_dir }}/{{ nova_pg_seal_role }}.pass"
        seal_name: "{{ nova_pg_seal_name }}"

- name: the port answers from the control node
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: a TCP connect to each store
      ansible.builtin.wait_for:
        host: "{{ hostvars[item].pg_listen[0] }}"
        port: "{{ hostvars[item].nova_pg_port | default(5432) }}"
        timeout: 5
      loop: "{{ groups['services'] | default([]) | select('in', hostvars) | list }}"
      when: hostvars[item].pg_listen is defined and hostvars[item].pg_listen | length > 0
      register: pg_reach
      ignore_errors: true   # each failure is named below, and the run fails after all of them are
      check_mode: false

    - name: the reach (--check reports it; a run is judged on it)
      ansible.builtin.debug:
        msg: >-
          PG {{ 'REACH' if not (item.failed | default(false)) else ('NOT-YET' if ansible_check_mode else 'FAIL') }}
          from=control to={{ hostvars[item.item].pg_listen[0] }}:{{ hostvars[item.item].nova_pg_port | default(5432) }}
      loop: "{{ pg_reach.results | default([]) | rejectattr('skipped', 'defined') | list }}"
      loop_control: { label: "{{ item.item }}" }

    - name: every store answers
      ansible.builtin.assert:
        that: pg_reach.results | default([]) | selectattr('failed', 'defined') | selectattr('failed') | list | length == 0
        fail_msg: "PG FAIL a store does not answer from the control node (above)"
        quiet: true
      when: not ansible_check_mode
