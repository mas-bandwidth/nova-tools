# purpose: install one nova-tools release, by tag, on the machines named (bench, runner and services groups)
#
# It downloads each tool's release asset,
# checks it against the release's SHA256SUMS and puts it in the bin directory;
# a second run changes nothing, and nothing is restarted unless asked. With
# -e nova_tools_remove_enabled=true it then moves the retired binaries aside.
# Last it lists what an older install left beside the new binaries (binaries the
# release does not list, units no service record names), one INSTALL line per
# host, and refuses a host with any; it removes nothing itself.
# Then the bench group gets the opencode its workers run, at the version and digest
# roles/opencode/defaults/main.yml pins, into the same bin directory.
#
#   nova-fleet install --check --diff -- -e nova_tools_version=v1.0.0 -l <machine>
#   nova-fleet install -- -e nova_tools_version=v1.0.0 -l <machine>
#
# A dependent tool's release, laid out the same way, installs with --repo (every
# binary its SHA256SUMS lists for the machine's platform unless --names says which):
#
#   nova-fleet install --repo OWNER/NAME --tag v2.0.0 [--names a,b] <machine>...
#
# Variables: roles/nova-tools-install/defaults/main.yml. A Windows host
# needs the ansible.windows collection on the control node (requirements.yml).
- name: nova-tools release on the machine
  hosts: bench:runner:services   # the fleet's workers, never all: a seat-only machine (roles -) gets no software (D13, 2026-11-07)
  gather_facts: true
  gather_subset: [min]
  roles:
    - nova-tools-install

- name: the pinned opencode a bench worker runs
  hosts: bench
  gather_facts: true
  gather_subset: [min]
  roles:
    - opencode
