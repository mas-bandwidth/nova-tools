# The fixture the plays' functional test checks against: the machine running
# the test, named localhost so the inventory marks it ansible_connection=local
# (NOVA_MACHINE=localhost), with no coordinator, so no task dials a store. Its
# loops are a member kept alive with a secret from its seat and a
# periodic loop written disabled.
machines:
  localhost: {user: nova, seat: seat-local, slots: 2}
fleet: {store: localhost, coordinator: "", redis_port: 6380, pg_dsn: ""}
loops:
  member-local:
    machine: localhost
    argv: [/usr/bin/env, "NOVA_SPRINT_REDIS=old-store:6379", "NOVA_SPRINT_REDIS_USER=bench", "NOVA_SPRINT_REDIS_PASSWORD_ENV=NOVA_REDIS_BENCH_PASSWORD", nova-swarm, member, --as, localhost, --width, "2"]
    seat: seat-local
    keys: [API_KEY, NOVA_REDIS_BENCH_PASSWORD]
    keepalive: true
    width: 2
  tick-local:
    machine: localhost
    argv: ["~/bin/tick", --once, "50%"]
    every: 30
    enabled: false
