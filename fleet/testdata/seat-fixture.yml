# Functional adopt fixture: an explicit localhost plus one coordinator and one
# bench/store. The named hosts all use Ansible's local connection in the test;
# the seat play runs on the coordinator and the fixture store tasks on the bench.
machines:
  localhost: {user: nova, seat: seat-local, slots: 1}
  coord-a: {user: nova, seat: seat-coordinator, slots: 1, os: darwin, arch: arm64}
  bench: {user: nova, seat: seat-bench, slots: 1, os: darwin, arch: arm64}
fleet: {store: bench, coordinator: coord-a, redis_port: 6380, pg_dsn: postgres://nova_config@localhost:5432/nova, loops_dir: "~/nova-bench/loops"}
loops: {}
