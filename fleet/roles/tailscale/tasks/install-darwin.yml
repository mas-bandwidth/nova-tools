---
# Tailscale on macOS: Homebrew's cask (the standalone app). Its first launch, and the approval of its VPN configuration,
# happen at the console once; until then the CLI answers that the app is not running.
- name: Homebrew
  ansible.builtin.shell: "command -v brew || ls /opt/homebrew/bin/brew /usr/local/bin/brew 2>/dev/null | head -1"
  register: ts_brew
  changed_when: false
  failed_when: ts_brew.stdout | trim | length == 0
  check_mode: false

- name: the app is installed
  ansible.builtin.stat: { path: /Applications/Tailscale.app }
  register: ts_app

- name: brew install --cask tailscale
  ansible.builtin.command: "{{ ts_brew.stdout_lines | first }} install --cask tailscale"
  when: not ts_app.stat.exists and not ansible_check_mode
  changed_when: true

- name: would install the app
  ansible.builtin.debug: { msg: "WOULD-INSTALL brew install --cask tailscale" }
  changed_when: true
  when: not ts_app.stat.exists and ansible_check_mode
