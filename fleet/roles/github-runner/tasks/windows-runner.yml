---
# One wanted runner, number runner_index.
- name: this runner's names
  ansible.builtin.set_fact:
    github_runner_dir: "{{ github_runner_base_dir }}\\{{ github_runner_slug }}-{{ runner_index }}"
    github_runner_name: "{{ inventory_hostname }}-{{ runner_index }}"

- name: nothing registered yet for this runner
  ansible.builtin.set_fact:
    github_runner_registration: { changed: false }

- name: the directory
  ansible.windows.win_file: { path: "{{ github_runner_dir }}", state: directory }
  register: github_runner_made

- name: is the release in the cache
  ansible.windows.win_stat:
    path: "{{ github_runner_base_dir }}\\.cache\\actions-runner-{{ github_runner_os }}-{{ github_runner_arch }}-{{ github_runner_version }}.zip"
  register: github_runner_cached

- name: unpack the runner where config.cmd is missing
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    Expand-Archive -Path '{{ github_runner_base_dir }}\.cache\actions-runner-{{ github_runner_os }}-{{ github_runner_arch }}-{{ github_runner_version }}.zip' -DestinationPath '{{ github_runner_dir }}' -Force
  args: { creates: "{{ github_runner_dir }}\\config.cmd" }
  when: not (ansible_check_mode and (github_runner_made is changed or not github_runner_cached.stat.exists))

- name: register with GitHub and install the service (the token reaches the runner on its stdin)
  ansible.windows.win_shell: |
    $env:ACTIONS_RUNNER_INPUT_TOKEN = [Console]::In.ReadLine()
    .\config.cmd --unattended --url '{{ github_runner_url }}' --name '{{ github_runner_name }}' `
      --labels '{{ github_runner_label_string }}' --work _work --replace --runasservice
    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  args:
    chdir: "{{ github_runner_dir }}"
    creates: "{{ github_runner_dir }}\\.runner"
    stdin: "{{ github_runner_token | default('') }}"
  no_log: true
  register: github_runner_registration
  when: runner_index in github_runner_need and not ansible_check_mode

- name: the labels it was registered with
  ansible.windows.win_copy:
    content: "{{ github_runner_label_string }}\n"
    dest: "{{ github_runner_dir }}\\.labels"
    force: false
  when: github_runner_registration is changed

- name: the labels it holds now
  ansible.windows.win_shell: "if (Test-Path '{{ github_runner_dir }}\\.labels') { (Get-Content -Raw '{{ github_runner_dir }}\\.labels').Trim() }"
  register: github_runner_held
  changed_when: false
  check_mode: false

- name: label drift is reported, not corrected (labels are fixed at registration)
  ansible.builtin.debug:
    msg: >-
      LABEL-DRIFT {{ github_runner_name }}: registered with {{ github_runner_held.stdout | trim }}, wants {{ github_runner_label_string }}.
      Retire it (-e github_runner_state=absent) and converge again to relabel.
  when: (github_runner_held.stdout | trim) | length > 0 and (github_runner_held.stdout | trim) != github_runner_label_string

# the service config.cmd installed: automatic start, running (found by the runner directory in its path)
- name: the service starts at boot and is running
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    $s = Get-CimInstance Win32_Service | Where-Object { $_.PathName -like '*{{ github_runner_dir }}\*' }
    if (-not $s) { throw 'NO-SERVICE for {{ github_runner_dir }}' }
    $changed = $false
    if ($s.StartMode -ne 'Auto') { Set-Service -Name $s.Name -StartupType Automatic; $changed = $true }
    if ($s.State -ne 'Running') { Start-Service -Name $s.Name; $changed = $true }
    if ($changed) { 'CHANGED' }
  register: github_runner_service
  changed_when: "'CHANGED' in github_runner_service.stdout"
  when: not ansible_check_mode
