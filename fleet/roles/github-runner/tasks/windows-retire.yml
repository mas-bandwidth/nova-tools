---
# Retire runner number runner_index: remove it from GitHub and uninstall its service (config.cmd remove does
# both), or, with github_runner_deregister false, only uninstall the service; then delete its directory.
- name: the retiring runner's directory
  ansible.builtin.set_fact:
    github_runner_dir: "{{ github_runner_base_dir }}\\{{ github_runner_slug }}-{{ runner_index }}"

- name: remove it from GitHub and uninstall the service (the token reaches the runner on its stdin)
  ansible.windows.win_shell: |
    $env:ACTIONS_RUNNER_INPUT_TOKEN = [Console]::In.ReadLine()
    .\config.cmd remove
    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  args:
    chdir: "{{ github_runner_dir }}"
    removes: "{{ github_runner_dir }}\\.runner"
    stdin: "{{ github_runner_token | default('') }}"
  no_log: true
  register: github_runner_removal
  failed_when: false
  when: github_runner_deregister | bool and not ansible_check_mode

- name: a failed removal says why (the token, if it ever appeared, redacted)
  ansible.builtin.fail:
    msg: >-
      GITHUB RUNNER REMOVE {{ inventory_hostname }} rc={{ github_runner_removal.rc }}:
      {%- set s = (github_runner_removal.stderr | default('') ~ ' ' ~ github_runner_removal.stdout | default('')) | trim | truncate(600) %}
      {{ s | regex_replace(github_runner_token | regex_escape, 'REDACTED') if github_runner_token | default('') | length > 0 else s }}
  when: github_runner_removal is not skipped and github_runner_removal.rc | default(0) != 0

- name: uninstall the service only (no removal from GitHub)
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    $s = Get-CimInstance Win32_Service | Where-Object { $_.PathName -like '*{{ github_runner_dir }}\*' }
    if ($s) { Stop-Service -Name $s.Name -Force; sc.exe delete $s.Name | Out-Null; 'REMOVED' }
  register: github_runner_unserved
  changed_when: "'REMOVED' in github_runner_unserved.stdout"
  when: not (github_runner_deregister | bool) and not ansible_check_mode

- name: delete the directory
  ansible.windows.win_file: { path: "{{ github_runner_dir }}", state: absent }
