---
# Included by main.yml for a Windows host only; needs the ansible.windows collection on the
# control node (ansible-galaxy collection install -r fleet/requirements.yml). The connection
# user must be an administrator: the runner's own config.cmd installs the Windows service
# (--runasservice, start type automatic, so it survives a reboot).

- name: the runner directories that exist for this url
  ansible.windows.win_find:
    paths: "{{ github_runner_base_dir }}"
    patterns: ["^{{ github_runner_slug | regex_escape }}-[0-9]+$"]
    use_regex: true
    file_type: directory
    recurse: false
  register: github_runner_found

- name: the runners to retire (above the count, or all of them when absent)
  ansible.builtin.set_fact:
    github_runner_retire: >-
      {{ github_runner_found.files | map(attribute='path') | map('regex_replace', '^.*-([0-9]+)$', '\1')
         | map('int') | difference(github_runner_want) | sort | reverse | list }}

- name: which of the wanted runners are registered
  ansible.windows.win_stat:
    path: "{{ github_runner_base_dir }}\\{{ github_runner_slug }}-{{ item }}\\.runner"
  loop: "{{ github_runner_want }}"
  register: github_runner_registered

- name: the runners that need registering
  ansible.builtin.set_fact:
    github_runner_need: "{{ github_runner_registered.results | rejectattr('stat.exists') | map(attribute='item') | list }}"

- name: a token is needed (registering, or removing from GitHub)
  ansible.builtin.include_tasks: token.yml
  when: not ansible_check_mode and (github_runner_need | length > 0 or (github_runner_retire | length > 0 and github_runner_deregister | bool))

- name: the plan
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }}: {{ github_runner_want | length }} wanted, would register {{ github_runner_need }}, would retire {{ github_runner_retire }}, labels {{ github_runner_label_string }}"
  when: ansible_check_mode and (github_runner_need | length > 0 or github_runner_retire | length > 0)

- name: retire the runners above the count
  ansible.builtin.include_tasks: windows-retire.yml
  loop: "{{ github_runner_retire }}"
  loop_control: { loop_var: runner_index }

- name: the cache directory
  ansible.windows.win_file: { path: "{{ github_runner_base_dir }}\\.cache", state: directory }
  register: github_runner_cache
  when: github_runner_want | length > 0

- name: the pinned runner release, checked against its digest
  ansible.windows.win_get_url:
    url: "{{ github_runner_release_url }}/v{{ github_runner_version }}/actions-runner-{{ github_runner_os }}-{{ github_runner_arch }}-{{ github_runner_version }}.zip"
    dest: "{{ github_runner_base_dir }}\\.cache\\actions-runner-{{ github_runner_os }}-{{ github_runner_arch }}-{{ github_runner_version }}.zip"
    checksum: "{{ github_runner_sha256[github_runner_os ~ '-' ~ github_runner_arch] }}"
    checksum_algorithm: sha256
  when: github_runner_want | length > 0 and not (ansible_check_mode and github_runner_cache is changed)

- name: each wanted runner
  ansible.builtin.include_tasks: windows-runner.yml
  loop: "{{ github_runner_want }}"
  loop_control: { loop_var: runner_index }
