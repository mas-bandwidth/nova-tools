---
# Retire v1's Windows side of a WSL machine (fleet/README.md, "Windows runners of a WSL machine"): opt-in, with the
# run's own list of what v1 left there as JSON extra vars, -e '{"nova_windows_retire_v1": {"runners": [...], "labels":
# {...}, "delete": [...], "tasks": [...], "kept": [...]}}' (defaults/main.yml says each key). Refused unless every v2
# Windows runner the record names is whole and online (wsl-windows.yml read both just before), every v1 target is
# covered by v2, and no v1 runner is busy, so CI keeps its Windows runners throughout. Then v1 is deleted, not moved
# aside: each runner is stopped, checked for a job again, removed from GitHub (config.cmd remove --unattended, a removal
# token on stdin) and its directory deleted; then each delete path, then each task. One line per item:
# V1-RETIRE <host> <what happened>.

- name: v1 is retired only beside a v2 that is up
  ansible.builtin.assert:
    quiet: true
    that:
      - nova_windows_runners | default([]) | length > 0
      - github_runner_win_unread | length == 0
      - github_runner_win_registered_n | int == github_runner_win_want | length
      - github_runner_win_online_n | int == github_runner_win_want | length
    fail_msg: >-
      V1-RETIRE {{ inventory_hostname }} refused: {{ github_runner_win_want | length }} v2 Windows runners wanted,
      {{ github_runner_win_registered_n }} registered, {{ github_runner_win_online_n }} online; every one must be
      registered and online before v1 goes. Run the play without the opt-in until the GITHUB-RUNNERS line is whole.

- name: the v1 list is whole
  ansible.builtin.assert:
    quiet: true
    that:
      - nova_windows_retire_v1 is mapping
      - nova_windows_retire_v1.runners is sequence and nova_windows_retire_v1.runners is not string
      - nova_windows_retire_v1.runners | rejectattr('dir', 'defined') | list | length == 0
      - nova_windows_retire_v1.runners | rejectattr('name', 'defined') | list | length == 0
      - nova_windows_retire_v1.runners | rejectattr('url', 'defined') | list | length == 0
      - nova_windows_retire_v1.labels | default({}) is mapping
      - nova_windows_retire_v1.delete | default([]) is sequence and nova_windows_retire_v1.delete | default([]) is not string
      - nova_windows_retire_v1.tasks | default([]) is sequence and nova_windows_retire_v1.tasks | default([]) is not string
    fail_msg: >-
      V1-RETIRE {{ inventory_hostname }} refused: nova_windows_retire_v1 wants {"runners": [{"dir", "name", "url"}],
      "labels": {url: [labels]}, "delete": [paths], "tasks": [names], "kept": [lines]} (fleet/README.md)

# Each v1 target must be one the record names, and its v2 runners must carry the labels its workflows select, or the
# target's jobs would have no Windows runner left.
- name: the v1 targets v2 does not cover
  ansible.builtin.set_fact:
    github_runner_v1_uncovered: >-
      {%- set out = [] -%}
      {%- for u in nova_windows_retire_v1.runners | map(attribute='url') | unique -%}
      {%- set have = github_runner_win_want | selectattr('url', 'equalto', u) | map(attribute='labels') | first | default('') -%}
      {%- set missing = ((nova_windows_retire_v1.labels | default({}))[u] | default([])) | difference(have.split(',') if have else []) -%}
      {%- if have == '' -%}{%- set _ = out.append(u ~ ' (not in the record)') -%}
      {%- elif missing | length > 0 -%}{%- set _ = out.append(u ~ ' (v2 lacks the labels ' ~ missing | join(',') ~ ')') -%}{%- endif -%}
      {%- endfor -%}
      {{ out }}

- name: v1 is retired only where v2 covers its targets
  ansible.builtin.assert:
    quiet: true
    that: github_runner_v1_uncovered | length == 0
    fail_msg: >-
      V1-RETIRE {{ inventory_hostname }} refused: v2 does not cover {{ github_runner_v1_uncovered | join('; ') }};
      set the record: nova-config machine set {{ inventory_hostname }} --windows_runners '<url>=<count>:<label>+<label>,...'

# A runner removed mid-job ends the job: refused while any v1 runner is busy, naming it. No waiting; run again.
- name: GitHub's list of v1's targets
  ansible.builtin.include_tasks: wsl-windows-github.yml
  vars:
    github_runner_gh_urls: "{{ nova_windows_retire_v1.runners | map(attribute='url') | unique | list }}"
    github_runner_gh_wait: {}

- name: v1 is retired only while none of its runners runs a job
  ansible.builtin.assert:
    quiet: true
    that:
      - github_runner_gh_unread | length == 0
      - github_runner_v1_busy | length == 0
    fail_msg: >-
      V1-RETIRE {{ inventory_hostname }} refused:
      {{ ('busy ' ~ github_runner_v1_busy | join(',') ~ ' (a job is running; run again when it ends)') if github_runner_v1_busy | length > 0
         else ('gh could not list the runners of ' ~ github_runner_gh_unread | join(', ')) }}
  vars:
    github_runner_v1_busy: >-
      {{ github_runner_gh_lines | select('match', '^[^ ]+ [^ ]+ true$') | map('split') | map('first')
         | intersect(nova_windows_retire_v1.runners | map(attribute='name') | list) }}

- name: the plan
  ansible.builtin.debug:
    msg: >-
      V1-RETIRE {{ inventory_hostname }} would: stop, remove and delete {{ nova_windows_retire_v1.runners | map(attribute='dir') | join(',') }};
      delete {{ nova_windows_retire_v1.delete | default([]) | join(',') }};
      unregister the scheduled task(s) {{ nova_windows_retire_v1.tasks | default([]) | join(',') }};
      keep {{ nova_windows_retire_v1.kept | default([]) | join('; ') }} (check: nothing changed)
  when: ansible_check_mode

- name: v1's runners, one target at a time (each target's own removal token)
  ansible.builtin.include_tasks: wsl-windows-retire-v1-runners.yml
  loop: "{{ nova_windows_retire_v1.runners | map(attribute='url') | unique | list }}"
  loop_control: { loop_var: github_runner_v1_url }
  when: not ansible_check_mode

- name: v1's files, deleted
  ansible.builtin.shell: >-
    "{{ github_runner_wsl_powershell }}" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {{ github_runner_wsl_script | quote }}
    -Action delete -Path {{ item | quote }} </dev/null
  args: { executable: /bin/sh }
  loop: "{{ nova_windows_retire_v1.delete | default([]) }}"
  register: github_runner_v1_deleted
  changed_when: "'DELETED ' in github_runner_v1_deleted.stdout"
  when: not ansible_check_mode

- name: v1's scheduled tasks, unregistered
  ansible.builtin.shell: >-
    "{{ github_runner_wsl_powershell }}" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {{ github_runner_wsl_script | quote }}
    -Action untask -Task {{ item | quote }} </dev/null
  args: { executable: /bin/sh }
  loop: "{{ nova_windows_retire_v1.tasks | default([]) }}"
  register: github_runner_v1_untasked
  changed_when: "'UNTASKED ' in github_runner_v1_untasked.stdout"
  when: not ansible_check_mode

- name: the retirement's receipt, one line per item
  ansible.builtin.debug:
    msg: >-
      {{ ((github_runner_v1_lines | default([]))
          + ((github_runner_v1_deleted.results | default([])) + (github_runner_v1_untasked.results | default([]))) | map(attribute='stdout_lines') | flatten | list
          + (nova_windows_retire_v1.kept | default([]) | map('regex_replace', '^', 'kept: ') | list))
         | map('regex_replace', '^', 'V1-RETIRE ' ~ inventory_hostname ~ ' ') | list }}
  when: not ansible_check_mode
