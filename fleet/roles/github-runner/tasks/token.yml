---
# The registration (or removal) token, asked of GitHub on the control node with its own gh login
# (gh api -X POST <repos|orgs>/<path>/actions/runners/<registration-token|remove-token>), never a
# pasted token, and held as a no_log fact for this host only. It is never an argument of any
# command: gh prints it on its stdout, the runner reads it from ACTIONS_RUNNER_INPUT_TOKEN on its
# stdin, and it is written nowhere. It is asked for under --check too (a token is not a change),
# so a green check is not followed by a real run that fails on the login.
- name: the token, from GitHub with the control node's gh login
  ansible.builtin.command:
    argv:
      - "{{ github_runner_gh }}"
      - api
      - -X
      - POST
      - "{{ 'orgs' if github_runner_scope == 'org' else 'repos' }}/{{ github_runner_path }}/actions/runners/{{ 'registration-token' if github_runner_need | default([]) | length > 0 else 'remove-token' }}"
      - -q
      - .token
  delegate_to: localhost
  become: false
  register: github_runner_token_read
  no_log: true
  changed_when: false
  failed_when: false
  check_mode: false

# no_log hides the whole result, the reason with it. gh prints the token only on stdout and only on
# success, so a failure shows its stderr (the HTTP status, or the login it lacks).
- name: a refused token request says why
  ansible.builtin.fail:
    msg: >-
      GITHUB RUNNER TOKEN {{ inventory_hostname }}: gh api on the control node failed, rc={{ github_runner_token_read.rc | default(-1) }}:
      {{ (github_runner_token_read.stderr | default(github_runner_token_read.msg | default(''))) | trim | truncate(400) }};
      gh needs a login with admin on {{ github_runner_path }}: gh auth login
  when: (github_runner_token_read.rc | default(1)) != 0 or (github_runner_token_read.stdout | default('') | trim | length) == 0

- name: the token is held for this host
  ansible.builtin.set_fact:
    github_runner_token: "{{ github_runner_token_read.stdout | trim }}"
  no_log: true
