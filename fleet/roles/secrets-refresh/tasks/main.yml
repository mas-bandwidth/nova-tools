---
# The secrets-refresh role (fleet/secrets-refresh.yml): a timer that pulls the machine's clone of the secrets store,
# fast-forward only. Linux: a systemd user timer (linger on), or a crontab line where the login has no user manager.
# darwin: a LaunchAgent in the login's GUI domain.
- name: the paths
  ansible.builtin.set_fact:
    sr_script: "{{ nova_bin_dir }}/nova-secrets-refresh"
    sr_label: com.nova.secrets-refresh
    sr_darwin: "{{ (nova_system | default(ansible_facts['system'])) == 'Darwin' }}"
    sr_xdg: "/run/user/{{ ansible_facts['user_uid'] }}"
    sr_user_dir: "{{ nova_home }}/.config/systemd/user"

# ---- a machine that must not pull: its timer goes, nothing else changes ----
- name: the timer removed (nova_secrets_refresh is false here)
  when: not (nova_secrets_refresh | bool)
  block:
    - name: the Linux units, stopped and removed
      ansible.builtin.shell: |
        u={{ sr_user_dir }}
        [ -f "$u/nova-secrets-refresh.timer" ] || [ -f "$u/nova-secrets-refresh.service" ] || { echo none; exit 0; }
        {% if not ansible_check_mode %}
        systemctl --user disable --now nova-secrets-refresh.timer >/dev/null 2>&1 || true
        rm -f "$u/nova-secrets-refresh.timer" "$u/nova-secrets-refresh.service"
        systemctl --user daemon-reload >/dev/null 2>&1 || true
        {% endif %}
        echo removed
      args: { executable: /bin/bash }
      environment: { XDG_RUNTIME_DIR: "{{ sr_xdg }}" }
      register: sr_off_linux
      changed_when: sr_off_linux.stdout == 'removed'
      check_mode: false
      when: not sr_darwin

    - name: the cron line removed
      ansible.builtin.cron: { name: nova-secrets-refresh, state: absent }
      when: not sr_darwin

    - name: the LaunchAgent, unloaded and removed
      ansible.builtin.shell: |
        p={{ nova_home }}/Library/LaunchAgents/{{ sr_label }}.plist
        [ -f "$p" ] || { echo none; exit 0; }
        {% if not ansible_check_mode %}
        launchctl bootout gui/{{ ansible_facts['user_uid'] }}/{{ sr_label }} 2>/dev/null || true
        rm -f "$p"
        {% endif %}
        echo removed
      register: sr_off_darwin
      changed_when: sr_off_darwin.stdout == 'removed'
      check_mode: false
      when: sr_darwin

    - name: the receipt
      ansible.builtin.debug: { msg: "SECRETS-REFRESH {{ inventory_hostname }} off (nova_secrets_refresh false)" }

    - name: nothing more here
      ansible.builtin.meta: end_host

# ---- git, which the pull needs ----
- name: git (Debian, Ubuntu)
  ansible.builtin.apt: { name: git, state: present, update_cache: true, cache_valid_time: 3600 }
  become: true
  when: ansible_facts['os_family'] == 'Debian'

- name: git is on the machine
  ansible.builtin.command: git --version
  register: sr_git
  changed_when: false
  failed_when: false
  check_mode: false

- name: git is there (the Command Line Tools on macOS, the system's package elsewhere)
  ansible.builtin.assert:
    that: sr_git.rc == 0 or (ansible_check_mode and ansible_facts['os_family'] == 'Debian')
    fail_msg: "SECRETS-REFRESH {{ inventory_hostname }} STOP: no git on the machine; install it, then run again"
    quiet: true

# ---- the store clone ----
- name: is there a store clone here
  ansible.builtin.stat: { path: "{{ nova_secrets_store }}/.git" }
  register: sr_store

- name: the store, cloned (nova_secrets_repo given, no clone yet)
  ansible.builtin.git:
    repo: "{{ nova_secrets_repo }}"
    dest: "{{ nova_secrets_store }}"
    update: false
  environment: { GIT_TERMINAL_PROMPT: "0", GIT_SSH_COMMAND: "ssh -o BatchMode=yes -o ConnectTimeout=20" }
  when: not sr_store.stat.exists and nova_secrets_repo | length > 0

- name: a clone, or a repo to clone
  ansible.builtin.assert:
    that: sr_store.stat.exists or nova_secrets_repo | length > 0
    fail_msg: >-
      SECRETS-REFRESH {{ inventory_hostname }} STOP: no clone at {{ nova_secrets_store }} (nova_secrets_store) and no
      nova_secrets_repo to clone; give -e nova_secrets_repo=<the store's git URL>, or -e nova_secrets_refresh=false for
      a machine that does not pull
    quiet: true

# ---- the script ----
- name: the directories
  ansible.builtin.file: { path: "{{ item }}", state: directory, mode: "0755" }
  loop: ["{{ nova_bin_dir }}", "{{ nova_secrets_refresh_log | dirname }}"]

- name: the refresh script
  ansible.builtin.copy: { src: nova-secrets-refresh, dest: "{{ sr_script }}", mode: "0755" }

# ---- Linux: a systemd user timer, or cron ----
- name: linger for the login (its timer runs with no session open)
  ansible.builtin.command: "loginctl enable-linger {{ ansible_facts['user_id'] }}"
  args: { creates: "/var/lib/systemd/linger/{{ ansible_facts['user_id'] }}" }
  become: true
  when: not sr_darwin

- name: does the login have a user manager
  ansible.builtin.command: systemctl --user show-environment
  environment: { XDG_RUNTIME_DIR: "{{ sr_xdg }}" }
  register: sr_userd
  changed_when: false
  failed_when: false
  check_mode: false
  when: not sr_darwin

- name: a user timer, or cron
  ansible.builtin.set_fact:
    sr_systemd: "{{ not sr_darwin and (sr_userd.rc | default(1)) == 0 }}"

- name: the user unit directory
  ansible.builtin.file: { path: "{{ sr_user_dir }}", state: directory, mode: "0755" }
  when: sr_systemd

- name: the oneshot unit and its timer
  ansible.builtin.template: { src: "nova-secrets-refresh.{{ item }}.j2", dest: "{{ sr_user_dir }}/nova-secrets-refresh.{{ item }}", mode: "0644" }
  loop: [service, timer]
  register: sr_units
  when: sr_systemd

- name: the user manager reads them
  ansible.builtin.command: systemctl --user daemon-reload
  environment: { XDG_RUNTIME_DIR: "{{ sr_xdg }}" }
  when: sr_systemd and sr_units is changed and not ansible_check_mode

# under --check a unit not written yet cannot be enabled: the file's own change is the drift
- name: the timer, enabled and started
  ansible.builtin.systemd_service: { name: nova-secrets-refresh.timer, enabled: true, state: started, scope: user }
  environment: { XDG_RUNTIME_DIR: "{{ sr_xdg }}" }
  when: sr_systemd and not (ansible_check_mode and sr_units is changed)

- name: the cron line (Linux with no user manager)
  ansible.builtin.cron:
    name: nova-secrets-refresh
    minute: "*/{{ [((nova_secrets_refresh_every | int) / 60) | int, 1] | max }}"
    job: "{{ sr_script }} {{ nova_secrets_store }} {{ nova_secrets_refresh_log }}"
  when: not sr_darwin and not sr_systemd

- name: is there a crontab binary
  ansible.builtin.command: sh -c 'command -v crontab'
  register: sr_crontab
  changed_when: false
  failed_when: false
  check_mode: false
  when: sr_systemd

- name: no cron line where the timer runs
  ansible.builtin.cron: { name: nova-secrets-refresh, state: absent }
  when: sr_systemd and sr_crontab.rc == 0

# ---- darwin: a LaunchAgent ----
- name: the login's GUI domain (darwin)
  ansible.builtin.command: "launchctl print gui/{{ ansible_facts['user_uid'] }}"
  register: sr_gui
  changed_when: false
  failed_when: false
  check_mode: false
  when: sr_darwin

- name: a darwin login with no GUI domain is refused (a LaunchDaemon is not written here)
  ansible.builtin.fail:
    msg: "SECRETS-REFRESH {{ inventory_hostname }}: the login has no GUI domain (gui/{{ ansible_facts['user_uid'] }}); log it in at the console once, or run the refresh from services.yml as a system unit"
  when: sr_darwin and sr_gui.rc != 0

- name: the LaunchAgents directory
  ansible.builtin.file: { path: "{{ nova_home }}/Library/LaunchAgents", state: directory, mode: "0755" }
  when: sr_darwin

- name: the LaunchAgent
  ansible.builtin.template: { src: nova-secrets-refresh.plist.j2, dest: "{{ nova_home }}/Library/LaunchAgents/{{ sr_label }}.plist", mode: "0644" }
  register: sr_plist
  when: sr_darwin

- name: is the agent loaded
  ansible.builtin.command: "launchctl print gui/{{ ansible_facts['user_uid'] }}/{{ sr_label }}"
  register: sr_loaded
  changed_when: false
  failed_when: false
  check_mode: false
  when: sr_darwin

- name: the agent loaded (again when the plist changed)
  ansible.builtin.shell: |
    d=gui/{{ ansible_facts['user_uid'] }}; l={{ sr_label }}
    launchctl bootout "$d/$l" 2>/dev/null || true
    launchctl bootstrap "$d" {{ nova_home }}/Library/LaunchAgents/$l.plist
  when: sr_darwin and (sr_plist is changed or sr_loaded.rc != 0) and not ansible_check_mode

# ---- one run now when there is no log yet, then the receipt ----
- name: one run now (no log yet, so the first pull does not wait for the timer)
  ansible.builtin.command: "{{ sr_script }} {{ nova_secrets_store }} {{ nova_secrets_refresh_log }}"
  args: { creates: "{{ nova_secrets_refresh_log }}" }
  failed_when: false
  when: not ansible_check_mode

- name: the last log line
  ansible.builtin.command: "tail -n 1 {{ nova_secrets_refresh_log }}"
  register: sr_last
  changed_when: false
  failed_when: false
  check_mode: false

- name: the receipt
  ansible.builtin.debug:
    msg: >-
      SECRETS-REFRESH {{ inventory_hostname }} via={{ 'launchd' if sr_darwin else ('systemd-user-timer' if sr_systemd else 'cron') }}
      every={{ nova_secrets_refresh_every }}s last: {{ (sr_last.stdout | default('') | trim) or 'no run yet' }}
