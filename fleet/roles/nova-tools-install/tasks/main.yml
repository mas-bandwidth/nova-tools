---
# Installs the nova-tools release nova_tools_version on this machine: each tool's
# asset is downloaded, checked against the release's SHA256SUMS and put in the
# bin directory. get_url with a checksum leaves a binary that already holds the
# digest alone, so a second run changes nothing. Nothing is restarted unless
# nova_tools_restart is true. When nova_tools_remove_enabled is true, the
# retired binaries named in nova_tools_remove are then moved (never deleted)
# into <bin dir>/retired-<date>/.

- name: a release is named
  ansible.builtin.assert:
    quiet: true
    that:
      - nova_tools_version is match('^v[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.]+)?$')
      - nova_tools_names | length > 0
      - nova_tools_names | reject('match', '^[a-z0-9][a-z0-9-]*$') | list | length == 0
      - nova_tools_remove | reject('match', '^[a-z0-9][a-z0-9-]*$') | list | length == 0
      - nova_tools_remove | intersect(nova_tools_names) | length == 0
    fail_msg: >-
      nova-tools-install: name the release (-e nova_tools_version=vX.Y.Z), give a non-empty nova_tools_names, and keep
      nova_tools_names and nova_tools_remove to plain tool names with nothing in both lists (a tool cannot be installed and retired)

- name: the platform
  ansible.builtin.set_fact:
    nova_tools_win: "{{ ansible_facts['os_family'] == 'Windows' }}"
    nova_tools_os: "{{ 'windows' if ansible_facts['os_family'] == 'Windows' else (ansible_facts['system'] | lower) }}"
    nova_tools_arch: "{{ {'x86_64': 'amd64', 'AMD64': 'amd64', 'amd64': 'amd64', 'aarch64': 'arm64', 'arm64': 'arm64'}[ansible_facts['architecture']] | default(ansible_facts['architecture']) }}"

- name: this platform is one the release ships
  ansible.builtin.assert:
    quiet: true
    that: (nova_tools_os ~ '-' ~ nova_tools_arch) in ['darwin-arm64', 'linux-amd64', 'linux-arm64', 'windows-amd64']
    fail_msg: "nova-tools-install: no release asset for {{ nova_tools_os }}-{{ nova_tools_arch }}"

- name: the release's checksum file, read from the release (a read, so check mode runs it too)
  ansible.builtin.uri:
    url: "{{ nova_tools_release_url }}/{{ nova_tools_version }}/SHA256SUMS"
    return_content: true
  register: nova_tools_sums
  check_mode: false
  changed_when: false

- name: each asset's digest, by the asset's name in SHA256SUMS
  ansible.builtin.set_fact:
    nova_tools_plan: >-
      {{ nova_tools_plan | default([]) + [{
           'tool': item,
           'asset': item ~ '_' ~ nova_tools_version ~ '_' ~ nova_tools_os ~ '_' ~ nova_tools_arch ~ ('.exe' if nova_tools_win else ''),
           'dest': item ~ ('.exe' if nova_tools_win else ''),
           'sha256': (nova_tools_sums.content.splitlines()
                      | select('search', ' ' ~ item ~ '_' ~ nova_tools_version ~ '_' ~ nova_tools_os ~ '_' ~ nova_tools_arch ~ ('.exe' if nova_tools_win else '') ~ '$')
                      | map('split') | map('first') | list | first | default(''))
         }] }}
  loop: "{{ nova_tools_names }}"

- name: every tool has a digest in the release
  ansible.builtin.assert:
    quiet: true
    that: item.sha256 is match('^[0-9a-f]{64}$')
    fail_msg: "nova-tools-install: {{ item.asset }} is not listed in {{ nova_tools_version }}'s SHA256SUMS"
  loop: "{{ nova_tools_plan }}"
  loop_control: { label: "{{ item.asset }}" }

- name: is there a bin directory already (its mode is then left alone)
  ansible.builtin.stat:
    path: "{{ nova_tools_bin_dir }}"
  register: nova_tools_bin_stat
  when: not nova_tools_win

- name: the bin directory
  ansible.builtin.file:
    path: "{{ nova_tools_bin_dir }}"
    state: directory
    mode: "{{ '0755' if not nova_tools_bin_stat.stat.exists else omit }}"
  register: nova_tools_unix_dir
  when: not nova_tools_win

- name: the bin directory (Windows)
  ansible.windows.win_file:
    path: "{{ nova_tools_win_bin_dir }}"
    state: directory
  register: nova_tools_win_dir
  when: nova_tools_win

# A dry run on a machine with no bin directory yet reports only the directory:
# get_url refuses a destination whose directory does not exist.
- name: the binaries, verified against SHA256SUMS
  ansible.builtin.get_url:
    url: "{{ nova_tools_release_url }}/{{ nova_tools_version }}/{{ item.asset }}"
    dest: "{{ nova_tools_bin_dir }}/{{ item.dest }}"
    checksum: "sha256:{{ item.sha256 }}"
    mode: "0755"
  loop: "{{ nova_tools_plan }}"
  loop_control: { label: "{{ item.dest }}" }
  register: nova_tools_installed
  when: not nova_tools_win and not (ansible_check_mode and nova_tools_unix_dir is changed)

- name: the binaries, verified against SHA256SUMS (Windows)
  ansible.windows.win_get_url:
    url: "{{ nova_tools_release_url }}/{{ nova_tools_version }}/{{ item.asset }}"
    dest: "{{ nova_tools_win_bin_dir }}\\{{ item.dest }}"
    checksum: "{{ item.sha256 }}"
    checksum_algorithm: sha256
  loop: "{{ nova_tools_plan }}"
  loop_control: { label: "{{ item.dest }}" }
  register: nova_tools_installed_win
  when: nova_tools_win and not (ansible_check_mode and nova_tools_win_dir is changed)

- name: the restart commands, only when asked and only when a binary changed
  ansible.builtin.command:
    argv: "{{ item }}"
  loop: "{{ nova_tools_restart_commands }}"
  when:
    - nova_tools_restart | bool
    - (nova_tools_installed.changed | default(false)) or (nova_tools_installed_win.changed | default(false))

# Retiring: only on a Unix machine, only when asked, and only after the install
# above succeeded (a failed task ends the role). A retired binary is moved into
# retired-<date> beside the others, never deleted; one not there is skipped, so
# a second run changes nothing.
- name: which retired binaries are in the bin directory
  ansible.builtin.stat:
    path: "{{ nova_tools_bin_dir }}/{{ item }}"
  loop: "{{ nova_tools_remove }}"
  register: nova_tools_retire_stat
  when: nova_tools_remove_enabled | bool and not nova_tools_win

- name: the retired directory
  ansible.builtin.file:
    path: "{{ nova_tools_bin_dir }}/retired-{{ now(fmt='%Y-%m-%d') }}"
    state: directory
    mode: "0755"
  when:
    - nova_tools_remove_enabled | bool
    - not nova_tools_win
    - nova_tools_retire_stat.results | selectattr('stat', 'defined') | selectattr('stat.exists') | list | length > 0

- name: the retired binaries, moved aside
  ansible.builtin.command:
    argv:
      - mv
      - "{{ nova_tools_bin_dir }}/{{ item.item }}"
      - "{{ nova_tools_bin_dir }}/retired-{{ now(fmt='%Y-%m-%d') }}/{{ item.item }}"
    removes: "{{ nova_tools_bin_dir }}/{{ item.item }}"
  loop: "{{ nova_tools_retire_stat.results | default([]) | selectattr('stat', 'defined') | selectattr('stat.exists') | list }}"
  loop_control: { label: "{{ item.item }}" }
  when: nova_tools_remove_enabled | bool and not nova_tools_win
