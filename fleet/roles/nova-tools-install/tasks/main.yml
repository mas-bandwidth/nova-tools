---
# Installs the release nova_tools_version of nova_tools_repo (nova-tools by default) on this machine: each tool's
# asset is downloaded, checked against the release's SHA256SUMS and put in the
# bin directory. get_url with a checksum leaves a binary that already holds the
# digest alone, so a second run changes nothing. Nothing is restarted unless
# nova_tools_restart is true. When nova_tools_remove_enabled is true, the
# retired binaries named in nova_tools_remove are then moved (never deleted)
# into <bin dir>/retired-<date>/. Last, what an older install left beside the new
# binaries is listed, one INSTALL line per host, and a host with any is refused.

- name: a release is named
  ansible.builtin.assert:
    quiet: true
    that:
      - nova_tools_version is match('^v[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.]+)?$') or (nova_tools_local_dir | length > 0 and nova_tools_version is match('^[0-9A-Za-z][0-9A-Za-z.-]*$'))
      - nova_tools_repo is match('^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$')
      - nova_tools_names | reject('match', '^[a-z0-9][a-z0-9-]*$') | list | length == 0
      - nova_tools_remove | reject('match', '^[a-z0-9][a-z0-9-]*$') | list | length == 0
    fail_msg: >-
      nova-tools-install: name the release (-e nova_tools_version=vX.Y.Z, or with nova_tools_local_dir the version its file names carry), name its
      repository as OWNER/NAME, and keep nova_tools_names and nova_tools_remove to plain tool names

- name: the platform
  ansible.builtin.set_fact:
    nova_tools_win: "{{ ansible_facts['os_family'] == 'Windows' }}"
    nova_tools_os: "{{ 'windows' if ansible_facts['os_family'] == 'Windows' else (ansible_facts['system'] | lower) }}"
    nova_tools_arch: "{{ {'x86_64': 'amd64', 'AMD64': 'amd64', 'amd64': 'amd64', 'aarch64': 'arm64', 'arm64': 'arm64'}[ansible_facts['architecture']] | default(ansible_facts['architecture']) }}"

- name: this platform is one the release ships
  ansible.builtin.assert:
    quiet: true
    that: (nova_tools_os ~ '-' ~ nova_tools_arch) in ['darwin-arm64', 'linux-amd64', 'linux-arm64', 'windows-amd64']
    fail_msg: "nova-tools-install: no release asset for {{ nova_tools_os }}-{{ nova_tools_arch }}"

- name: the release's checksum file, read from the release (a read, so check mode runs it too)
  ansible.builtin.uri:
    url: "{{ nova_tools_release_url }}/{{ nova_tools_version }}/SHA256SUMS"
    return_content: true
  register: nova_tools_sums
  check_mode: false
  changed_when: false
  when: nova_tools_local_dir | length == 0

# The local mode: binaries built on the control node, laid out as a release is (the file
# names and SHA256SUMS of fleet/README.md, "install"), copied instead of downloaded.
- name: the local build's checksum file, read on the control node
  ansible.builtin.set_fact:
    nova_tools_sums: { content: "{{ lookup('ansible.builtin.file', nova_tools_local_dir ~ '/SHA256SUMS') }}" }
  when: nova_tools_local_dir | length > 0

- name: the local mode is for Linux and macOS
  ansible.builtin.assert:
    quiet: true
    that: not nova_tools_win
    fail_msg: "nova-tools-install: nova_tools_local_dir copies to Linux and macOS only; install {{ inventory_hostname }} from a release"
  when: nova_tools_local_dir | length > 0

# An empty nova_tools_names is every asset SHA256SUMS lists for this platform, by name.
# The release's names are kept whole: the leftover check at the end allows them all,
# not only the ones --names installs.
- name: the tools to install
  ansible.builtin.set_fact:
    nova_tools_release_names: "{{ nova_tools_listed }}"
    nova_tools_install_names: "{{ nova_tools_names if nova_tools_names | length > 0 else nova_tools_listed }}"
  vars:
    nova_tools_suffix: "{{ ('_' ~ nova_tools_version ~ '_' ~ nova_tools_os ~ '_' ~ nova_tools_arch ~ ('.exe' if nova_tools_win else '')) | regex_escape }}"
    nova_tools_listed: >-
      {{ nova_tools_sums.content.splitlines() | select | map('split') | map('last')
         | select('match', '^[a-z0-9][a-z0-9-]*' ~ nova_tools_suffix ~ '$')
         | map('regex_replace', nova_tools_suffix ~ '$', '') | list }}

- name: something to install, and nothing both installed and retired
  ansible.builtin.assert:
    quiet: true
    that:
      - nova_tools_install_names | length > 0
      - nova_tools_remove | intersect(nova_tools_install_names) | length == 0
    fail_msg: >-
      nova-tools-install: install at least one tool ({{ nova_tools_repo }} {{ nova_tools_version }} lists none for {{ nova_tools_os }}-{{ nova_tools_arch }} when nova_tools_names is empty),
      and keep nova_tools_names out of nova_tools_remove (a tool cannot be installed and retired)

- name: each asset's digest, by the asset's name in SHA256SUMS
  ansible.builtin.set_fact:
    nova_tools_plan: >-
      {{ nova_tools_plan | default([]) + [{
           'tool': item,
           'asset': item ~ '_' ~ nova_tools_version ~ '_' ~ nova_tools_os ~ '_' ~ nova_tools_arch ~ ('.exe' if nova_tools_win else ''),
           'dest': item ~ ('.exe' if nova_tools_win else ''),
           'sha256': (nova_tools_sums.content.splitlines()
                      | select('search', ' ' ~ item ~ '_' ~ nova_tools_version ~ '_' ~ nova_tools_os ~ '_' ~ nova_tools_arch ~ ('.exe' if nova_tools_win else '') ~ '$')
                      | map('split') | map('first') | list | first | default(''))
         }] }}
  loop: "{{ nova_tools_install_names }}"

- name: every tool has a digest in the release
  ansible.builtin.assert:
    quiet: true
    that: item.sha256 is match('^[0-9a-f]{64}$')
    fail_msg: "nova-tools-install: {{ item.asset }} is not listed in {{ (nova_tools_local_dir ~ '/SHA256SUMS') if nova_tools_local_dir | length > 0 else (nova_tools_version ~ \"'s SHA256SUMS\") }}"
  loop: "{{ nova_tools_plan }}"
  loop_control: { label: "{{ item.asset }}" }

- name: is there a bin directory already (its mode is then left alone)
  ansible.builtin.stat:
    path: "{{ nova_tools_bin_dir }}"
  register: nova_tools_bin_stat
  when: not nova_tools_win

- name: the bin directory
  ansible.builtin.file:
    path: "{{ nova_tools_bin_dir }}"
    state: directory
    mode: "{{ '0755' if not nova_tools_bin_stat.stat.exists else omit }}"
  register: nova_tools_unix_dir
  when: not nova_tools_win

# A dry run on a machine with no bin directory yet reports only the directory:
# get_url refuses a destination whose directory does not exist.
- name: the binaries, verified against SHA256SUMS
  ansible.builtin.get_url:
    url: "{{ nova_tools_release_url }}/{{ nova_tools_version }}/{{ item.asset }}"
    dest: "{{ nova_tools_bin_dir }}/{{ item.dest }}"
    checksum: "sha256:{{ item.sha256 }}"
    mode: "0755"
  loop: "{{ nova_tools_plan }}"
  loop_control: { label: "{{ item.dest }}" }
  register: nova_tools_installed
  when: not nova_tools_win and nova_tools_local_dir | length == 0 and not (ansible_check_mode and nova_tools_unix_dir is changed)

- name: each local binary's digest, on the control node
  ansible.builtin.stat:
    path: "{{ nova_tools_local_dir }}/{{ item.asset }}"
    checksum_algorithm: sha256
  loop: "{{ nova_tools_plan }}"
  loop_control: { label: "{{ item.asset }}" }
  delegate_to: localhost
  become: false
  register: nova_tools_local_stat
  when: nova_tools_local_dir | length > 0

- name: each local binary is the one its SHA256SUMS names
  ansible.builtin.assert:
    quiet: true
    that: item.stat.exists and item.stat.checksum == item.item.sha256
    fail_msg: >-
      nova-tools-install: {{ nova_tools_local_dir }}/{{ item.item.asset }}
      {{ 'does not match its SHA256SUMS line' if item.stat.exists else 'is missing' }}; rebuild the directory (fleet/README.md, "install")
  loop: "{{ nova_tools_local_stat.results | default([]) }}"
  loop_control: { label: "{{ item.item.asset }}" }
  when: nova_tools_local_dir | length > 0

- name: the binaries, copied from the local build
  ansible.builtin.copy:
    src: "{{ nova_tools_local_dir }}/{{ item.asset }}"
    dest: "{{ nova_tools_bin_dir }}/{{ item.dest }}"
    mode: "0755"
  loop: "{{ nova_tools_plan }}"
  loop_control: { label: "{{ item.dest }}" }
  register: nova_tools_installed_local
  when: not nova_tools_win and nova_tools_local_dir | length > 0 and not (ansible_check_mode and nova_tools_unix_dir is changed)

# The Windows tasks live in windows.yml and are included only for a Windows host:
# include_tasks resolves its modules when it runs, so a Linux or macOS inventory
# needs no ansible.windows collection (fleet/requirements.yml).
- name: the bin directory and the binaries (Windows)
  ansible.builtin.include_tasks: windows.yml
  when: ansible_facts['os_family'] == 'Windows'

- name: the restart commands, only when asked and only when a binary changed
  ansible.builtin.command:
    argv: "{{ item }}"
  loop: "{{ nova_tools_restart_commands }}"
  when:
    - nova_tools_restart | bool
    - (nova_tools_installed.changed | default(false)) or (nova_tools_installed_local.changed | default(false)) or (nova_tools_installed_win.changed | default(false))

# Retiring: only on a Unix machine, only when asked, and only after the install
# above succeeded (a failed task ends the role). A retired binary is moved into
# retired-<date> beside the others, never deleted; one not there is skipped, so
# a second run changes nothing.
- name: which retired binaries are in the bin directory
  ansible.builtin.stat:
    path: "{{ nova_tools_bin_dir }}/{{ item }}"
  loop: "{{ nova_tools_remove }}"
  register: nova_tools_retire_stat
  when: nova_tools_remove_enabled | bool and not nova_tools_win

- name: the retired directory
  ansible.builtin.file:
    path: "{{ nova_tools_bin_dir }}/retired-{{ now(fmt='%Y-%m-%d') }}"
    state: directory
    mode: "0755"
  when:
    - nova_tools_remove_enabled | bool
    - not nova_tools_win
    - nova_tools_retire_stat.results | selectattr('stat', 'defined') | selectattr('stat.exists') | list | length > 0

- name: the retired binaries, moved aside
  ansible.builtin.command:
    argv:
      - mv
      - "{{ nova_tools_bin_dir }}/{{ item.item }}"
      - "{{ nova_tools_bin_dir }}/retired-{{ now(fmt='%Y-%m-%d') }}/{{ item.item }}"
    removes: "{{ nova_tools_bin_dir }}/{{ item.item }}"
  loop: "{{ nova_tools_retire_stat.results | default([]) | selectattr('stat', 'defined') | selectattr('stat.exists') | list }}"
  loop_control: { label: "{{ item.item }}" }
  when: nova_tools_remove_enabled | bool and not nova_tools_win

# Leftovers, last (the install above has happened): the bin directory, the login's
# unit directory and the system unit directory are read for the names an older
# install used; a file the release does not list, or a unit no service record of
# this machine names, fails the host with the fix. Nothing is removed here. find is
# a read, so --check runs it too; a directory that is not there holds nothing.
- name: what else is on the machine (a read; the leftovers of an older install)
  ansible.builtin.find:
    paths: "{{ item.path }}"
    patterns: "{{ item.patterns }}"
    use_regex: true
    file_type: any
  loop: "{{ nova_tools_leftover_dirs }}"
  loop_control: { label: "{{ item.path }}" }
  register: nova_tools_found
  when: not nova_tools_win and nova_tools_repo == 'mas-bandwidth/nova-tools'
  vars:
    nova_tools_records: "{{ nova_services | default([]) | map(attribute='name') | map('regex_escape') | join('|') or '-' }}"
    nova_tools_leftover_dirs: >-
      {{ [{'path': nova_tools_bin_dir,
           'patterns': ['^(nova-.*|novadog-.*|mirror-refresh|disk-guard|ci-hold-broker)$'],
           'ok': '^(' ~ ((nova_tools_release_names + nova_tools_keep) | map('regex_escape') | join('|')) ~ ')$'},
          {'path': (nova_home | default(ansible_facts['env']['HOME'])) ~ ('/.config/systemd/user' if nova_tools_os == 'linux' else '/Library/LaunchAgents'),
           'patterns': ['^(nova-.*|com[.]nova[.].*)$'],
           'ok': '^(nova-service-(' ~ nova_tools_records ~ ')[.](service|timer)|com[.]nova[.]service[.](' ~ nova_tools_records ~ ')[.]plist)$'}]
         + ([{'path': nova_tools_system_unit_dir,
              'patterns': ['^nova.*$'],
              'ok': '^nova-service-(' ~ nova_tools_records ~ ')[.](service|timer)$'}] if nova_tools_os == 'linux' else []) }}

- name: "the leftovers: binaries the release does not list, units no record names"
  ansible.builtin.set_fact:
    nova_tools_leftovers: >-
      {%- set out = [] -%}
      {%- for r in nova_tools_found.results | default([]) -%}
      {%- for f in r.files | default([]) if not f.isdir and (f.path | basename) is not match(r.item.ok) -%}
      {%- set _ = out.append(f.path | basename) -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ out | sort }}

- name: the leftovers, one line per host
  ansible.builtin.debug:
    msg: "INSTALL {{ inventory_hostname }} leftovers={{ nova_tools_leftovers | length }}{{ (': ' ~ (nova_tools_leftovers | join(', '))) if nova_tools_leftovers else '' }}"

- name: nothing an older install left behind
  ansible.builtin.assert:
    quiet: true
    that: nova_tools_leftovers | length == 0
    fail_msg: >-
      INSTALL {{ inventory_hostname }} leftovers={{ nova_tools_leftovers | length }}: {{ nova_tools_leftovers | join(', ') }};
      remove them (nova-fleet services for units of a record; by hand for the rest), then install again
