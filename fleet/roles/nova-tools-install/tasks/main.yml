---
# Installs the release nova_tools_version of nova_tools_repo (nova-tools by default) on this machine: each tool's
# asset is downloaded, checked against the release's SHA256SUMS and put in the
# bin directory. get_url with a checksum leaves a binary that already holds the
# digest alone, so a second run changes nothing. Nothing is restarted unless
# nova_tools_restart is true. When nova_tools_remove_enabled is true, the
# retired binaries named in nova_tools_remove are then moved (never deleted)
# into <bin dir>/retired-<date>/. Last, what an older install left beside the new
# binaries is listed, one INSTALL line per host, and a host with any is refused.

- name: a release is named
  ansible.builtin.assert:
    quiet: true
    that:
      - nova_tools_version is match('^v[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.]+)?$') or (nova_tools_local_dir | length > 0 and nova_tools_version is match('^[0-9A-Za-z][0-9A-Za-z.-]*$'))
      - nova_tools_repo is match('^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$')
      - nova_tools_names | reject('match', '^[a-z0-9][a-z0-9-]*$') | list | length == 0
      - nova_tools_remove | reject('match', '^[a-z0-9_][a-z0-9_-]*([.][a-z0-9_-]+)*$') | list | length == 0
      - nova_tools_remove_units | reject('match', '^[A-Za-z0-9_@-]+([.][A-Za-z0-9_@-]+)+$') | list | length == 0
    fail_msg: >-
      nova-tools-install: name the release (-e nova_tools_version=vX.Y.Z, or with nova_tools_local_dir the version its file names carry), name its
      repository as OWNER/NAME, and keep nova_tools_names, nova_tools_remove and nova_tools_remove_units to plain file names

- name: the platform
  ansible.builtin.set_fact:
    nova_tools_win: "{{ ansible_facts['os_family'] == 'Windows' }}"
    nova_tools_os: "{{ 'windows' if ansible_facts['os_family'] == 'Windows' else (ansible_facts['system'] | lower) }}"
    nova_tools_arch: "{{ {'x86_64': 'amd64', 'AMD64': 'amd64', 'amd64': 'amd64', 'aarch64': 'arm64', 'arm64': 'arm64'}[ansible_facts['architecture']] | default(ansible_facts['architecture']) }}"

- name: this platform is one the release ships
  ansible.builtin.assert:
    quiet: true
    that: (nova_tools_os ~ '-' ~ nova_tools_arch) in ['darwin-arm64', 'linux-amd64', 'linux-arm64', 'windows-amd64']
    fail_msg: "nova-tools-install: no release asset for {{ nova_tools_os }}-{{ nova_tools_arch }}"

- name: the release's checksum file, read from the release (a read, so check mode runs it too)
  ansible.builtin.uri:
    url: "{{ nova_tools_release_url }}/{{ nova_tools_version }}/SHA256SUMS"
    return_content: true
  register: nova_tools_sums
  check_mode: false
  changed_when: false
  when: nova_tools_local_dir | length == 0

# The local mode: binaries built on the control node, laid out as a release is (the file
# names and SHA256SUMS of fleet/README.md, "install"), copied instead of downloaded.
- name: the local build's checksum file, read on the control node
  ansible.builtin.set_fact:
    nova_tools_sums: { content: "{{ lookup('ansible.builtin.file', nova_tools_local_dir ~ '/SHA256SUMS') }}" }
  when: nova_tools_local_dir | length > 0

- name: the local mode is for Linux and macOS
  ansible.builtin.assert:
    quiet: true
    that: not nova_tools_win
    fail_msg: "nova-tools-install: nova_tools_local_dir copies to Linux and macOS only; install {{ inventory_hostname }} from a release"
  when: nova_tools_local_dir | length > 0

# An empty nova_tools_names is every asset SHA256SUMS lists for this platform, by name.
# The release's names are kept whole: the leftover check at the end allows them all,
# not only the ones --names installs.
- name: the tools to install
  ansible.builtin.set_fact:
    nova_tools_release_names: "{{ nova_tools_listed }}"
    nova_tools_install_names: "{{ nova_tools_names if nova_tools_names | length > 0 else nova_tools_listed }}"
  vars:
    nova_tools_suffix: "{{ ('_' ~ nova_tools_version ~ '_' ~ nova_tools_os ~ '_' ~ nova_tools_arch ~ ('.exe' if nova_tools_win else '')) | regex_escape }}"
    nova_tools_listed: >-
      {{ nova_tools_sums.content.splitlines() | select | map('split') | map('last')
         | select('match', '^[a-z0-9][a-z0-9-]*' ~ nova_tools_suffix ~ '$')
         | map('regex_replace', nova_tools_suffix ~ '$', '') | list }}

- name: something to install, and nothing both installed and retired
  ansible.builtin.assert:
    quiet: true
    that:
      - nova_tools_install_names | length > 0
      - nova_tools_remove | intersect(nova_tools_install_names) | length == 0
    fail_msg: >-
      nova-tools-install: install at least one tool ({{ nova_tools_repo }} {{ nova_tools_version }} lists none for {{ nova_tools_os }}-{{ nova_tools_arch }} when nova_tools_names is empty),
      and keep nova_tools_names out of nova_tools_remove (a tool cannot be installed and retired)

- name: each asset's digest, by the asset's name in SHA256SUMS
  ansible.builtin.set_fact:
    nova_tools_plan: >-
      {{ nova_tools_plan | default([]) + [{
           'tool': item,
           'asset': item ~ '_' ~ nova_tools_version ~ '_' ~ nova_tools_os ~ '_' ~ nova_tools_arch ~ ('.exe' if nova_tools_win else ''),
           'dest': item ~ ('.exe' if nova_tools_win else ''),
           'sha256': (nova_tools_sums.content.splitlines()
                      | select('search', ' ' ~ item ~ '_' ~ nova_tools_version ~ '_' ~ nova_tools_os ~ '_' ~ nova_tools_arch ~ ('.exe' if nova_tools_win else '') ~ '$')
                      | map('split') | map('first') | list | first | default(''))
         }] }}
  loop: "{{ nova_tools_install_names }}"

- name: every tool has a digest in the release
  ansible.builtin.assert:
    quiet: true
    that: item.sha256 is match('^[0-9a-f]{64}$')
    fail_msg: "nova-tools-install: {{ item.asset }} is not listed in {{ (nova_tools_local_dir ~ '/SHA256SUMS') if nova_tools_local_dir | length > 0 else (nova_tools_version ~ \"'s SHA256SUMS\") }}"
  loop: "{{ nova_tools_plan }}"
  loop_control: { label: "{{ item.asset }}" }

- name: is there a bin directory already (its mode is then left alone)
  ansible.builtin.stat:
    path: "{{ nova_tools_bin_dir }}"
  register: nova_tools_bin_stat
  when: not nova_tools_win

- name: the bin directory
  ansible.builtin.file:
    path: "{{ nova_tools_bin_dir }}"
    state: directory
    mode: "{{ '0755' if not nova_tools_bin_stat.stat.exists else omit }}"
  register: nova_tools_unix_dir
  when: not nova_tools_win

# A dry run on a machine with no bin directory yet reports only the directory:
# get_url refuses a destination whose directory does not exist.
- name: the binaries, verified against SHA256SUMS
  ansible.builtin.get_url:
    url: "{{ nova_tools_release_url }}/{{ nova_tools_version }}/{{ item.asset }}"
    dest: "{{ nova_tools_bin_dir }}/{{ item.dest }}"
    checksum: "sha256:{{ item.sha256 }}"
    mode: "0755"
  loop: "{{ nova_tools_plan }}"
  loop_control: { label: "{{ item.dest }}" }
  register: nova_tools_installed
  when: not nova_tools_win and nova_tools_local_dir | length == 0 and not (ansible_check_mode and nova_tools_unix_dir is changed)

- name: each local binary's digest, on the control node
  ansible.builtin.stat:
    path: "{{ nova_tools_local_dir }}/{{ item.asset }}"
    checksum_algorithm: sha256
  loop: "{{ nova_tools_plan }}"
  loop_control: { label: "{{ item.asset }}" }
  delegate_to: localhost
  become: false
  register: nova_tools_local_stat
  when: nova_tools_local_dir | length > 0

- name: each local binary is the one its SHA256SUMS names
  ansible.builtin.assert:
    quiet: true
    that: item.stat.exists and item.stat.checksum == item.item.sha256
    fail_msg: >-
      nova-tools-install: {{ nova_tools_local_dir }}/{{ item.item.asset }}
      {{ 'does not match its SHA256SUMS line' if item.stat.exists else 'is missing' }}; rebuild the directory (fleet/README.md, "install")
  loop: "{{ nova_tools_local_stat.results | default([]) }}"
  loop_control: { label: "{{ item.item.asset }}" }
  when: nova_tools_local_dir | length > 0

- name: the binaries, copied from the local build
  ansible.builtin.copy:
    src: "{{ nova_tools_local_dir }}/{{ item.asset }}"
    dest: "{{ nova_tools_bin_dir }}/{{ item.dest }}"
    mode: "0755"
  loop: "{{ nova_tools_plan }}"
  loop_control: { label: "{{ item.dest }}" }
  register: nova_tools_installed_local
  when: not nova_tools_win and nova_tools_local_dir | length > 0 and not (ansible_check_mode and nova_tools_unix_dir is changed)

# The Windows tasks live in windows.yml and are included only for a Windows host:
# include_tasks resolves its modules when it runs, so a Linux or macOS inventory
# needs no ansible.windows collection (fleet/requirements.yml).
- name: the bin directory and the binaries (Windows)
  ansible.builtin.include_tasks: windows.yml
  when: ansible_facts['os_family'] == 'Windows'

- name: the restart commands, only when asked and only when a binary changed
  ansible.builtin.command:
    argv: "{{ item }}"
  loop: "{{ nova_tools_restart_commands }}"
  when:
    - nova_tools_restart | bool
    - (nova_tools_installed.changed | default(false)) or (nova_tools_installed_local.changed | default(false)) or (nova_tools_installed_win.changed | default(false))

# Retiring: only on a Unix machine, only when asked, and only after the install
# above succeeded (a failed task ends the role). A retired binary is moved into
# retired-<date> beside the others, never deleted; one not there is skipped, so
# a second run changes nothing.
- name: which retired binaries are in the bin directory
  ansible.builtin.stat:
    path: "{{ nova_tools_bin_dir }}/{{ item }}"
  loop: "{{ nova_tools_remove }}"
  register: nova_tools_retire_stat
  when: nova_tools_remove_enabled | bool and not nova_tools_win

- name: the retired directory
  ansible.builtin.file:
    path: "{{ nova_tools_bin_dir }}/retired-{{ now(fmt='%Y-%m-%d') }}"
    state: directory
    mode: "0755"
  when:
    - nova_tools_remove_enabled | bool
    - not nova_tools_win
    - nova_tools_retire_stat.results | selectattr('stat', 'defined') | selectattr('stat.exists') | list | length > 0

- name: the retired binaries, moved aside
  ansible.builtin.command:
    argv:
      - mv
      - "{{ nova_tools_bin_dir }}/{{ item.item }}"
      - "{{ nova_tools_bin_dir }}/retired-{{ now(fmt='%Y-%m-%d') }}/{{ item.item }}"
    removes: "{{ nova_tools_bin_dir }}/{{ item.item }}"
  loop: "{{ nova_tools_retire_stat.results | default([]) | selectattr('stat', 'defined') | selectattr('stat.exists') | list }}"
  loop_control: { label: "{{ item.item }}" }
  when: nova_tools_remove_enabled | bool and not nova_tools_win

# Another repository's release (--repo) records the names its SHA256SUMS lists, one per
# line, in nova_tools_manifest_dir/<owner>_<name>.names: the leftover check of a later
# nova-tools install allows every name a manifest lists.
# nova-push-credential (retired) is named as git's credential helper in ~/.gitconfig
# (credential.helper, credential.<url>.helper): retiring the script unsets each such
# value, matched by the script's own path alone, so the other helpers stay.
- name: the git credential helpers that run nova-push-credential (a read)
  ansible.builtin.command:
    argv: [git, config, --global, --get-regexp, '^credential[.](.*[.])?helper$', "{{ nova_tools_gitcred_value }}"]
  environment: { HOME: "{{ nova_home }}" }
  register: nova_tools_gitcred
  changed_when: false
  failed_when: false
  check_mode: false
  when: not nova_tools_win

- name: the git credential helpers that run nova-push-credential, unset (retiring it)
  ansible.builtin.command:
    argv: [git, config, --global, --unset-all, "{{ item }}", "{{ nova_tools_gitcred_value }}"]
  environment: { HOME: "{{ nova_home }}" }
  loop: "{{ nova_tools_gitcred_keys }}"
  register: nova_tools_gitcred_unset
  when: nova_tools_remove_enabled | bool and not nova_tools_win and 'nova-push-credential' in nova_tools_remove

# Retired units (nova_tools_remove_units, file names the leftover refusal prints): each
# one in the login's unit directory or the system unit directory is stopped (systemd
# disable --now, launchctl bootout) and moved into retired-<date>/ beside it, never
# deleted; one not there is skipped. The system directory takes sudo. With
# nova_tools_unit_manager false (a test) nothing is asked of systemd or launchd and
# nothing takes sudo.
- name: which retired units are on the machine
  ansible.builtin.stat: { path: "{{ item.0 }}/{{ item.1 }}" }
  loop: "{{ [nova_tools_user_unit_dir, nova_tools_system_unit_dir] | product(nova_tools_remove_units) | list }}"
  loop_control: { label: "{{ item.0 }}/{{ item.1 }}" }
  register: nova_tools_unit_stat
  when: nova_tools_remove_enabled | bool and not nova_tools_win

- name: the retired units, stopped and moved aside
  ansible.builtin.shell: |
    {% if nova_tools_unit_manager | bool %}
    {% if nova_tools_os == 'linux' %}
    systemctl {{ '' if system else '--user' }} disable --now {{ name | quote }} >/dev/null 2>&1 || true
    {% else %}
    launchctl bootout {{ 'system' if system else 'gui/' ~ ansible_facts['user_uid'] }} {{ path | quote }} >/dev/null 2>&1 || true
    {% endif %}
    {% endif %}
    mkdir -p {{ aside | quote }} && mv {{ path | quote }} {{ aside | quote }}/
  args: { removes: "{{ path }}" }
  environment: { XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] | default('') }}" }
  become: "{{ system and nova_tools_unit_manager | bool }}"
  loop: "{{ nova_tools_unit_stat.results | default([]) | selectattr('stat', 'defined') | selectattr('stat.exists') | list }}"
  loop_control: { label: "{{ item.item.0 }}/{{ item.item.1 }}" }
  register: nova_tools_units_retired
  when: nova_tools_remove_enabled | bool and not nova_tools_win
  vars:
    name: "{{ item.item.1 }}"
    path: "{{ item.item.0 }}/{{ item.item.1 }}"
    aside: "{{ item.item.0 }}/retired-{{ now(fmt='%Y-%m-%d') }}"
    system: "{{ item.item.0 == nova_tools_system_unit_dir }}"

- name: systemd reads the unit directories again
  ansible.builtin.shell: |
    systemctl --user daemon-reload >/dev/null 2>&1 || true
    {% if nova_tools_unit_manager | bool %}sudo -n systemctl daemon-reload >/dev/null 2>&1 || true{% endif %}
  environment: { XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] | default('') }}" }
  when: nova_tools_unit_manager | bool and nova_tools_os == 'linux' and nova_tools_units_retired is changed

- name: this release's names, recorded for the leftover check (another repository's release)
  when: not nova_tools_win and nova_tools_repo != 'mas-bandwidth/nova-tools'
  block:
    - name: the manifest directory
      ansible.builtin.file: { path: "{{ nova_tools_manifest_dir }}", state: directory, mode: "0755" }

    - name: the manifest, one name a line
      ansible.builtin.copy:
        dest: "{{ nova_tools_manifest_dir }}/{{ nova_tools_repo | replace('/', '_') }}.names"
        content: "{{ nova_tools_release_names | sort | join('\n') }}\n"
        mode: "0644"

# Leftovers, last (the install above has happened), on Unix, for nova-tools' own release:
# the bin directory, the login's unit directory and the system unit directory are read
# for the names an older install used. Allowed: the release's names, every name a
# manifest of another repository's release lists, nova_tools_keep, what the fleet's own
# roles write there (their nova_<role>_owns and nova_redis_unit, read from their
# defaults), a friend's nova-bus hook unit, and the unit of a service record this machine
# has. Anything else fails the host with the fix. Nothing is removed here. Every task is
# a read, so --check runs them too; a directory that is not there holds nothing. With no
# nova_services in the inventory (not nova-config's) the units are not read: a NOTE says so.
- name: the leftovers of an older install (nova-tools' own release, Unix)
  when: not nova_tools_win and nova_tools_repo == 'mas-bandwidth/nova-tools'
  block:
    - name: the manifests of other repositories' releases
      ansible.builtin.find: { paths: "{{ nova_tools_manifest_dir }}", patterns: "*.names" }
      register: nova_tools_manifests

    - name: the names they list
      ansible.builtin.slurp: { src: "{{ item.path }}" }
      loop: "{{ nova_tools_manifests.files }}"
      loop_control: { label: "{{ item.path | basename }}" }
      register: nova_tools_manifest_content

    - name: what the fleet's own roles write (their defaults, read on the control node)
      ansible.builtin.set_fact:
        nova_tools_fleet_owns: >-
          {{ {'bin': nova_tools_owns | map(attribute='bin', default=[]) | flatten,
              'user': nova_tools_owns | map(attribute='user', default=[]) | flatten,
              'system': (nova_tools_owns | map(attribute='system', default=[]) | flatten)
                        + [(nova_redis_unit | default(nova_tools_redis_defaults.nova_redis_unit)) ~ '.service']} }}
        nova_tools_other_names: >-
          {{ nova_tools_manifest_content.results | default([]) | map(attribute='content') | map('b64decode')
             | map('split') | flatten | list }}
      vars:
        nova_tools_roles_dir: "{{ role_path }}/.."
        nova_tools_redis_defaults: "{{ lookup('ansible.builtin.file', nova_tools_roles_dir ~ '/redis/defaults/main.yml') | from_yaml }}"
        nova_tools_owns:
          - "{{ (lookup('ansible.builtin.file', nova_tools_roles_dir ~ '/secrets-refresh/defaults/main.yml') | from_yaml).nova_secrets_refresh_owns }}"
          - "{{ (lookup('ansible.builtin.file', nova_tools_roles_dir ~ '/health/defaults/main.yml') | from_yaml).nova_health_owns }}"
          - "{{ (lookup('ansible.builtin.file', nova_tools_roles_dir ~ '/postgres/defaults/main.yml') | from_yaml).nova_postgres_owns }}"

    - name: the retired names and units (fleet/retired-tools.txt, fleet/retired-units.txt, read on the control node)
      ansible.builtin.set_fact:
        nova_tools_own_retired: "{{ nova_tools_retired_rows | selectattr(2, 'match', '^(retired|rowan-tools)') | map(attribute=0) | list }}"
        nova_tools_retired_unit_re: >-
          {{ '^(' ~ (nova_tools_unit_globs | map('regex_replace', '[.]', '[.]') | map('regex_replace', '[*]', '.*') | join('|')) ~ ')$' }}
        # every --repo the fleet installs has its manifest here: a binary none lists is then a leftover
        nova_tools_fleet_recorded: >-
          {{ nova_tools_fleet_repos | map('replace', '/', '_') | map('regex_replace', '$', '.names')
             | difference(nova_tools_manifests.files | default([]) | map(attribute='path') | map('basename')) | length == 0 }}
        nova_tools_unrecorded_repos: >-
          {{ nova_tools_fleet_repos | reject('in', nova_tools_manifests.files | default([]) | map(attribute='path') | map('basename')
             | map('regex_replace', '[.]names$', '') | map('replace', '_', '/')) | list }}
      vars:
        nova_tools_retired_rows: "{{ lookup('ansible.builtin.file', role_path ~ '/../../retired-tools.txt').splitlines() | reject('match', '^#') | select | map('split', '\t') | list }}"
        nova_tools_unit_globs: "{{ lookup('ansible.builtin.file', role_path ~ '/../../retired-units.txt').splitlines() | reject('match', '^#') | select | map('split', '\t') | map('first') | list }}"

    - name: what else is on the machine (a read; the leftovers of an older install)
      ansible.builtin.find:
        paths: "{{ item.path }}"
        patterns: "{{ item.patterns }}"
        use_regex: true
        file_type: any
      # A loop is rendered before the block's when is read: on a skipped host the facts above are not there.
      loop: "{{ nova_tools_leftover_dirs if nova_tools_fleet_owns is defined else [] }}"
      loop_control: { label: "{{ item.path }}" }
      register: nova_tools_found
      vars:
        nova_tools_records: "{{ nova_services | default([]) | map(attribute='name') | map('regex_escape') | join('|') or '-' }}"
        nova_tools_bin_ok: "{{ nova_tools_release_names + nova_tools_keep + nova_tools_other_names + nova_tools_fleet_owns.bin + ((nova_join_owns | default({})).bin | default([])) }}"
        nova_tools_leftover_dirs: >-
          {{ [{'path': nova_tools_bin_dir, 'kind': 'bin',
               'patterns': ['^.*$'],
               'ok': '^(' ~ (nova_tools_bin_ok | map('regex_escape') | join('|')) ~ ')$'}]
             + ([{'path': nova_tools_user_unit_dir, 'kind': 'unit',
                  'patterns': ['^(nova-.*|com[.]nova[.].*)$', nova_tools_retired_unit_re],
                  'ok': '^(nova-service-(' ~ nova_tools_records ~ ')[.](service|timer)|com[.]nova[.]service[.](' ~ nova_tools_records ~ ')[.]plist'
                        ~ '|nova-bus[.]hook[.].+[.]plist|nova-bus-hook-.+[.]service|'
                        ~ (nova_tools_fleet_owns.user | map('regex_escape') | join('|')) ~ ')$'}] if nova_services is defined else [])
             + ([{'path': nova_tools_system_unit_dir, 'kind': 'unit',
                  'patterns': ['^nova.*$' if nova_tools_os == 'linux' else '^com[.]nova[.].*$', nova_tools_retired_unit_re],
                  'ok': ('^(nova-service-(' ~ nova_tools_records ~ ')[.](service|timer)|'
                         ~ (nova_tools_fleet_owns.system | map('regex_escape') | join('|')) ~ ')$') if nova_tools_os == 'linux'
                        else '^com[.]nova[.]service[.](' ~ nova_tools_records ~ ')[.]plist$'}] if nova_services is defined else []) }}

    # Each name found and allowed by none of the above is sorted by what can retire it.
    # A binary fleet/retired-tools.txt retires (retired or rowan-tools), or any other once
    # every --repo the fleet installs (nova_tools_fleet_repos) has its manifest here:
    # nova-fleet install retires it (nova_tools_remove). A unit fleet/retired-units.txt
    # names: nova-fleet install retires it (nova_tools_remove_units). A unit of the
    # services play's shapes: nova-fleet services retires it (nova_retire_units). A
    # binary while a fleet release's manifest is missing (the first rollout): a WARNING,
    # never a refusal, never advice to remove it. Anything else: no play retires it,
    # named on its own.
    - name: "the leftovers: binaries no release lists, units no role or record names"
      ansible.builtin.set_fact:
        nova_tools_sorted: >-
          {%- set r = {'bin': [], 'unit': [], 'unit_names': [], 'retired_units': [], 'noplay': [], 'unrecorded': []} -%}
          {%- for d in nova_tools_found.results | default([]) -%}
          {%- for f in d.files | default([]) if not f.isdir and (f.path | basename) is not match(d.item.ok) -%}
          {%- set n = f.path | basename -%}
          {%- if d.item.kind == 'unit' -%}
          {%- if n is match(nova_tools_retired_unit_re) -%}{%- set _ = r.retired_units.append(n) -%}
          {%- elif n is match(nova_tools_unit_shape) -%}
          {%- set _ = r.unit.append(n) -%}{%- set _ = r.unit_names.append(n | regex_replace(nova_tools_unit_shape, '\\1\\2')) -%}
          {%- else -%}{%- set _ = r.noplay.append(n) -%}{%- endif -%}
          {%- elif n is not match('^[a-z0-9_][a-z0-9_-]*([.][a-z0-9_-]+)*$') -%}{%- set _ = r.noplay.append(n) -%}
          {%- elif n in nova_tools_own_retired or nova_tools_fleet_recorded -%}{%- set _ = r.bin.append(n) -%}
          {%- else -%}{%- set _ = r.unrecorded.append(n) -%}
          {%- endif -%}
          {%- endfor -%}
          {%- endfor -%}
          {{ r }}
      vars:
        nova_tools_unit_shape: '^com[.]nova[.](?:service|loop)[.](.+)[.]plist$|^nova-(?:service|loop)-(.+)[.](?:service|timer)$'

    # A git credential helper that runs nova-push-credential is a leftover too, retired with the script.
    - name: the git credential helpers that run nova-push-credential, as they are now (a read)
      ansible.builtin.command:
        argv: [git, config, --global, --get-regexp, '^credential[.](.*[.])?helper$', "{{ nova_tools_gitcred_value }}"]
      environment: { HOME: "{{ nova_home }}" }
      register: nova_tools_gitcred_now
      changed_when: false
      failed_when: false
      check_mode: false

    - name: the leftovers, and the plays that retire them
      ansible.builtin.set_fact:
        nova_tools_leftovers: "{{ (nova_tools_sorted.bin + nova_tools_sorted.retired_units + nova_tools_sorted.unit + nova_tools_sorted.noplay + nova_tools_gitcred_left) | sort }}"
        nova_tools_retire_how: >-
          {{ ([("nova-fleet install --tag " ~ nova_tools_version ~ " -- -l " ~ inventory_hostname
                ~ " -e '" ~ (nova_tools_retire_vars | to_json(separators=(',', ':'))) ~ "'")] if nova_tools_retire_bin or nova_tools_sorted.retired_units else [])
             + ([("nova-fleet services -- -l " ~ inventory_hostname ~ " -e '" ~ ({'nova_retire_units': nova_tools_sorted.unit_names | unique | sort} | to_json(separators=(',', ':'))) ~ "'")]
                if nova_tools_sorted.unit else [])
             + ([("no play retires " ~ (nova_tools_sorted.noplay | sort | join(', ')) ~ " yet: it is owed to a play")] if nova_tools_sorted.noplay else []) }}
      vars:
        nova_tools_gitcred_left: "{{ (nova_tools_gitcred_now.stdout_lines | default([]) | map('split') | map('first') | map('regex_replace', '^', 'gitconfig ') | list) if nova_tools_gitcred_now.rc | default(1) == 0 else [] }}"
        nova_tools_retire_bin: "{{ (nova_tools_sorted.bin + (['nova-push-credential'] if nova_tools_gitcred_left else [])) | unique | sort }}"
        nova_tools_retire_vars: >-
          {{ {'nova_tools_remove_enabled': true}
             | combine({'nova_tools_remove': nova_tools_retire_bin} if nova_tools_retire_bin else {})
             | combine({'nova_tools_remove_units': nova_tools_sorted.retired_units | unique | sort} if nova_tools_sorted.retired_units else {}) }}

    - name: the leftovers, one line per host
      ansible.builtin.debug:
        msg: >-
          INSTALL {{ inventory_hostname }} leftovers={{ nova_tools_leftovers | length }}{{ (': ' ~ (nova_tools_leftovers | join(', '))) if nova_tools_leftovers else '' }}{{
          ('; ' ~ ('would unset' if ansible_check_mode else 'unset') ~ ' git ' ~ (nova_tools_gitcred_keys | join(', ')) ~ ' (nova-push-credential)')
          if nova_tools_remove_enabled | bool and 'nova-push-credential' in nova_tools_remove and nova_tools_gitcred_keys else '' }}{{
          '' if nova_services is defined else
          '; NOTE: the inventory carries no nova_services (it is not nova-config\'s), so units were not read, binaries only' }}

    # Only while a --repo the fleet installs has no manifest here (the first rollout):
    # once every one has, a binary none lists is a leftover above.
    - name: binaries no release's manifest lists yet (a warning while a fleet release has no manifest)
      ansible.builtin.debug:
        msg: >-
          INSTALL {{ inventory_hostname }} WARNING unrecorded={{ nova_tools_sorted.unrecorded | length }}: {{ nova_tools_sorted.unrecorded | sort | join(', ') }};
          reinstall {{ nova_tools_unrecorded_repos | join(', ') }} to record its names (nova-fleet install --repo OWNER/NAME --tag TAG)
      when: nova_tools_sorted.unrecorded | length > 0

    - name: nothing an older install left behind
      ansible.builtin.assert:
        quiet: true
        that: nova_tools_leftovers | length == 0
        fail_msg: >-
          INSTALL {{ inventory_hostname }} leftovers={{ nova_tools_leftovers | length }}: {{ nova_tools_leftovers | join(', ') }};
          retire them, then install again: {{ nova_tools_retire_how | join('; ') }}
