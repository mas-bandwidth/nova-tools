---
# The release to install, by tag (for example v1.0.0). Required; there is no
# default, so a run never installs "latest" by accident.
nova_tools_version: ""

# The tools to install, by name: nova_tools_names, in group_vars/all.yml (services.yml
# reads it too). Each is a release asset <tool>_<tag>_<os>_<arch>[.exe] listed in
# the release's SHA256SUMS. An empty list installs every asset SHA256SUMS lists for
# the machine's platform.

# The repository whose release is installed: nova-tools, or a dependent tool whose
# release is laid out the same way (nova-fleet install --repo OWNER/NAME).
nova_tools_repo: mas-bandwidth/nova-tools

# Where the release assets live: <base>/<tag>/<asset> and <base>/<tag>/SHA256SUMS.
nova_tools_release_url: "https://github.com/{{ nova_tools_repo }}/releases/download"

# The local mode: a directory on the control node laid out as a release is
# (<tool>_<version>_<os>_<arch> and SHA256SUMS; fleet/README.md, "install"). When set,
# the binaries are copied from it instead of downloaded, and nova_tools_version is the
# version its file names carry (any word, e.g. local). Linux and macOS hosts only.
nova_tools_local_dir: ""

# The bin directory. Unix: nova_bin_dir, default the login's ~/.local/bin.
# Windows: <profile>\.local\bin.
nova_tools_bin_dir: "{{ nova_bin_dir | default(ansible_facts['env']['HOME'] ~ '/.local/bin') }}"
nova_tools_win_bin_dir: "{{ ansible_facts['env']['USERPROFILE'] }}\\.local\\bin"

# Nothing is restarted unless asked: set nova_tools_restart true and list the
# commands in nova_tools_restart_commands (each an argv list); they run once,
# only when a binary changed.
nova_tools_restart: false
nova_tools_restart_commands: []

# Retired binaries. When nova_tools_remove_enabled is true (default false), each
# name in nova_tools_remove found in the bin directory is moved, after a
# successful install, into <bin dir>/retired-<date>/ rather than deleted. Unix
# machines only. A name also in nova_tools_names is refused. The default list is
# the rows of fleet/retired-tools.txt that say "retired" or "rowan-tools": tools
# nova-tools shipped and ships no more. Another product's binaries are not in
# it; an operator who wants more gone names them:
#   -e nova_tools_remove='["nova-sprint","nova-card"]'
nova_tools_remove_enabled: false
nova_tools_remove:
  - nova-check
  - nova-ci
  - nova-decide
  - nova-doctor
  - nova-fuse
  - nova-local
  - nova-loop
  - nova-memory
  - nova-redis
  - nova-self-talk
  - nova-slot
  - nova-table
  - nova-tokens
  - nova-up
  - nova-update
  - nova-version
  - mirror-refresh
  - disk-guard
  - ci-hold-broker
  - nova-card-push

# Leftovers. After the install the role lists what an older install left beside the
# new binaries and refuses the host when it finds any, naming the plays that retire
# them (fleet/README.md, "install", Leftovers). Allowed beside the release: what another
# repository's release (--repo) recorded in nova_tools_manifest_dir, what the fleet's
# own roles write (their nova_<role>_owns), nova_tools_hand_kept, a friend's nova-bus
# hook unit, a service record's unit, and the binaries named in nova_tools_keep. A
# binary no manifest lists that nova-tools did not retire is a warning only. Unix
# machines, nova-tools' own release only; nothing is removed.
nova_tools_keep: []
# Binaries every fleet machine keeps beside the release, allowed whatever nova_tools_keep says.
nova_tools_hand_kept:
  # the git credential helper, installed by hand before v2; owed to a role (fleet item D19)
  - nova-push-credential
# The system unit directory: systemd's on Linux, launchd's daemons on macOS (where
# services.yml puts a headless Mac's units, nova_launchd_domain auto or system).
nova_tools_system_unit_dir: "{{ '/Library/LaunchDaemons' if nova_tools_os == 'darwin' else '/etc/systemd/system' }}"
# Where another repository's release (--repo) records the names it installs, one
# <owner>_<name>.names per repository, for the leftover check to allow.
nova_tools_manifest_dir: "{{ nova_home }}/.local/share/nova/installed"
