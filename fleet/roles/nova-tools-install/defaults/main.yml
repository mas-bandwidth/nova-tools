# Leftovers. After the install the role lists what an older install left beside the
# new binaries and refuses the host when it finds any, naming the plays that retire
# them (fleet/README.md, "install", Leftovers). Allowed beside the release: what another
# repository's release (--repo) recorded in nova_tools_manifest_dir, what the fleet's
# own roles write (their nova_<role>_owns), a friend's nova-bus
# hook unit and a service record's unit. Only a retired name (fleet/retired-tools.txt)
# or a retired unit (fleet/retired-units.txt) refuses a host; any other binary nothing
# accounts for is a warning naming it. Unix machines, nova-tools' own release only;
# the check removes nothing.
# Retired units to stop and move aside (into retired-<date>/ beside them) when
# nova_tools_remove_enabled is true: file names, as the leftover refusal prints them
# (fleet/retired-units.txt). nova_tools_unit_manager false asks nothing of systemd or
# launchd and takes no sudo (a test's directories).
nova_tools_remove_units: []
# The globs of fleet/retired-units.txt, as one regex: the leftover check reads for
# them, and nova_tools_remove_units may name nothing else.
nova_tools_unit_globs: "{{ lookup('ansible.builtin.file', role_path ~ '/../../retired-units.txt').splitlines() | reject('match', '^#') | select | map('split', '\t') | map('first') | list }}"
nova_tools_retired_unit_re: "{{ '^(' ~ (nova_tools_unit_globs | map('regex_replace', '[.]', '[.]') | map('regex_replace', '[*]', '.*') | join('|')) ~ ')$' }}"
nova_tools_unit_manager: true
nova_tools_user_unit_dir: "{{ nova_home ~ ('/.config/systemd/user' if nova_tools_os == 'linux' else '/Library/LaunchAgents') }}"
# A git credential helper value that runs the retired nova-push-credential (git's
# extended regex: the script's path in the bin directory or ~/.local/bin, with git's
# leading !),
# and the global config keys that hold one (credential.helper, credential.<url>.helper).
nova_tools_gitcred_value: "^!?({{ [nova_tools_bin_dir, ansible_facts['env']['HOME'] ~ '/.local/bin'] | unique | map('regex_escape', 'posix_basic') | map('regex_replace', '$', '/nova-push-credential') | join('|') }})$"
nova_tools_gitcred_keys: "{{ (nova_tools_gitcred.stdout_lines | default([]) | map('split') | map('first') | unique | list) if (nova_tools_gitcred.rc | default(1)) == 0 else [] }}"
# The system unit directory: systemd's on Linux, launchd's daemons on macOS (where
# services.yml puts a headless Mac's units, nova_launchd_domain auto or system).
nova_tools_system_unit_dir: "{{ '/Library/LaunchDaemons' if nova_tools_os == 'darwin' else '/etc/systemd/system' }}"
# Where another repository's release (--repo) records the names it installs, one
# <owner>_<name>.names per repository, for the leftover check to allow.
nova_tools_manifest_dir: "{{ nova_home }}/.local/share/nova/installed"
