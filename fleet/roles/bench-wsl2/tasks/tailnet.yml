---
# tasks/tailnet.yml for bench-wsl2 role
# ==============================================================================
# Resolves tailnet name and IPv4 as machine identity, establishing durable
# swarm pool identity and machine environment files.
# ==============================================================================

# ---- 1. Probe Tailscale IPv4 ------------------------------------------------

- name: probe tailscale IPv4 in Linux distro
  ansible.builtin.shell: "tailscale ip -4 2>/dev/null | head -1"
  register: tailscale_ip_linux
  changed_when: false
  failed_when: false
  check_mode: false

- name: probe tailscale IPv4 via Windows host executable fallback
  ansible.builtin.shell: "/mnt/c/Program\\ Files/Tailscale/tailscale.exe ip -4 2>/dev/null | head -1"
  register: tailscale_ip_windows
  changed_when: false
  failed_when: false
  check_mode: false
  when: (tailscale_ip_linux.stdout | default('') | trim) == ''

- name: set resolved tailnet IPv4 fact
  ansible.builtin.set_fact:
    bench_wsl2_tailnet_ip: >-
      {{ (tailscale_ip_linux.stdout | default('') | trim)
         if (tailscale_ip_linux.stdout | default('') | trim) != ''
         else (tailscale_ip_windows.stdout | default('') | trim)
         if (tailscale_ip_windows.stdout | default('') | trim) != ''
         else ansible_default_ipv4.address | default('127.0.0.1') }}

# ---- 2. Probe Tailnet Machine Name (Identity) --------------------------------

- name: probe tailscale status JSON in Linux distro
  ansible.builtin.shell: "tailscale status --self --json 2>/dev/null"
  register: tailscale_status_linux
  changed_when: false
  failed_when: false
  check_mode: false

- name: probe tailscale status JSON via Windows host executable fallback
  ansible.builtin.shell: "/mnt/c/Program\\ Files/Tailscale/tailscale.exe status --self --json 2>/dev/null"
  register: tailscale_status_windows
  changed_when: false
  failed_when: false
  check_mode: false
  when: (tailscale_status_linux.stdout | default('') | trim) == ''

- name: parse tailnet status JSON
  ansible.builtin.set_fact:
    tailscale_json_data: >-
      {{ (tailscale_status_linux.stdout | from_json)
         if (tailscale_status_linux.stdout | default('') | trim) != '' and (tailscale_status_linux.stdout | default('') | trim).startswith('{')
         else (tailscale_status_windows.stdout | from_json)
         if (tailscale_status_windows.stdout | default('') | trim) != '' and (tailscale_status_windows.stdout | default('') | trim).startswith('{')
         else {} }}

- name: resolve tailnet name as machine identity
  ansible.builtin.set_fact:
    bench_wsl2_tailnet_name: >-
      {{ tailscale_json_data.Self.HostName
         if tailscale_json_data.Self is defined and tailscale_json_data.Self.HostName is defined
         else ansible_nodename | default(inventory_hostname) }}
    bench_wsl2_identity: >-
      {{ tailscale_json_data.Self.HostName
         if tailscale_json_data.Self is defined and tailscale_json_data.Self.HostName is defined
         else ansible_nodename | default(inventory_hostname) }}

# ---- 3. Persist Identity Artifacts ------------------------------------------

- name: ensure identity directory exists
  ansible.builtin.file:
    path: "{{ bench_wsl2_identity_file | dirname }}"
    state: directory
    owner: "{{ bench_wsl2_user }}"
    group: "{{ bench_wsl2_group }}"
    mode: "0755"

- name: write pool identity.tsv for swarm card execution
  ansible.builtin.copy:
    dest: "{{ bench_wsl2_identity_file }}"
    owner: "{{ bench_wsl2_user }}"
    group: "{{ bench_wsl2_group }}"
    mode: "0644"
    content: |
      owner	name	email
      swarm	{{ bench_wsl2_identity }}	{{ bench_wsl2_user }}@mas-bandwidth.com

- name: write system identity environment file
  ansible.builtin.copy:
    dest: "{{ bench_wsl2_env_file }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      # /etc/nova-bench/identity.env — Generated by bench-wsl2 ansible role
      TAILNET_NAME="{{ bench_wsl2_tailnet_name }}"
      TAILNET_IP="{{ bench_wsl2_tailnet_ip }}"
      BENCH_IDENTITY="{{ bench_wsl2_identity }}"
      BENCH_LABELS="{{ bench_wsl2_labels }}"
