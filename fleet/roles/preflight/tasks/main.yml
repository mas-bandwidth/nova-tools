---
# The preflight role: the programs a play needs on the control node, found before the play changes anything
# (docs/FLEET.md, "Prerequisites"). preflight_control is a list of {cmd, for, v2}: cmd is a name on PATH or a path,
# for says what needs it, and v2: true asks that a nova-tools program be v2.0.0-rc1 or newer, judged by its `help`
# naming a v2 verb (nova-secrets `set NAME`, nova-config `schema`, nova-bus `who`). A missing or older one stops the
# run naming it. Included once per run (run_once, on the control node).
- name: the control node's programs
  ansible.builtin.shell: |
    {% for p in preflight_control %}
    if ! command -v {{ p.cmd | quote }} >/dev/null 2>&1; then
      echo {{ (p.cmd ~ ' is missing (' ~ p.for ~ ')') | quote }}
    {% if p.v2 | default(false) %}
    elif ! {{ p.cmd | quote }} help 2>&1 | grep -Eq {{ preflight_v2_marker[p.cmd | basename] | default('.') | quote }}; then
      echo {{ (p.cmd ~ ' is older than v2.0.0-rc1 (' ~ p.for ~ '): install nova-tools v2.0.0-rc1 or newer') | quote }}
    {% endif %}
    fi
    {% endfor %}
    true
  args: { executable: /bin/bash }
  vars:
    preflight_v2_marker:
      nova-secrets: '^nova-secrets set NAME'
      nova-config: '^ *nova-config schema'
      nova-bus: '^ *nova-bus who'
  delegate_to: localhost
  become: false
  run_once: true
  register: preflight_missing
  changed_when: false
  check_mode: false
  when: preflight_control | default([]) | length > 0

- name: nothing is missing or too old
  ansible.builtin.assert:
    that: preflight_missing is skipped or preflight_missing.stdout_lines | length == 0
    fail_msg: >-
      PREFLIGHT STOP: on the control node, {{ preflight_missing.stdout_lines | default([]) | join('; ') }}
      (docs/FLEET.md, "Prerequisites"; a variable such as nova_control_secrets points at a program off PATH)
    quiet: true
  run_once: true
