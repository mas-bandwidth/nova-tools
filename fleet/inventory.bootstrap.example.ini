# An example inventory for bootstrap.yml (docs/FLEET.md, "From a fresh host").
# The hosts are placeholders (192.0.2.0/24 is reserved for documentation):
# replace them with yours, reachable by ssh as a login with sudo. One host is
# fleet_store (PostgreSQL, the fleet's Redis, the backups); a host may be in
# both groups. Each names its seat.
[fleet_store]
bench-a ansible_host=192.0.2.10 ansible_user=nova nova_seat=bench-a

[fleet_members]
bench-a ansible_host=192.0.2.10 ansible_user=nova nova_seat=bench-a
bench-b ansible_host=192.0.2.11 ansible_user=nova nova_seat=bench-b

# The owner's paths: the first two on the machine running the play, the
# third on the fleet_store host. All three are absolute.
[all:vars]
nova_bootstrap_seat_keys=/path/to/the/seat-keys
nova_bootstrap_secrets_store=/path/to/the/secrets-store
nova_bootstrap_backup_dir=/var/backups/nova
