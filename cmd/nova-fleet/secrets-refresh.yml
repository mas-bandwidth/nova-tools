# purpose: every machine's copy of the secrets store kept current: pushed by the control node
#
# secrets-refresh.yml: every machine's copy of the secrets store at nova_secrets_store, kept current, so a seat never
# opens a stale store (cmd/nova-fleet/README.md, "secrets-refresh.yml").
#
# The control node puts the store's files there over SSH (rsync, no .git, 0700 directories, 0600 files); with
# -e nova_seal_store=<the control node's clone> this play does the push, and nova-fleet up runs it. No timer runs on
# the machine: pull mode (nova_secrets_repo, a timer pulling a clone) is retired and refused, and a timer or script
# an earlier run left is removed. A machine with no store fails the run (mode=push missing).
#
#   ansible-playbook -i ./inventory cmd/nova-fleet/secrets-refresh.yml -e nova_seal_store=S --check --diff
#   ansible-playbook -i ./inventory cmd/nova-fleet/secrets-refresh.yml -e nova_seal_store=S
- name: the secrets store, kept current
  hosts: all
  gather_facts: true
  gather_subset: [min]
  pre_tasks:
    - name: the control node has what the run needs
      ansible.builtin.include_role: { name: preflight }
      vars:
        preflight_control: >-
          {{ [{'cmd': 'rsync', 'for': 'the push of the store'}] if nova_seal_store is defined else [] }}
  roles:
    - secrets-refresh
