# purpose: guards that let a Linux machine get itself out of trouble, a disk report and clean, and a Mac's Go build cache trim (bench, runner and services groups)
#
# health.yml: guards that let a Linux machine get itself out of trouble, and a disk report (cmd/nova-fleet/README.md,
# "health"): the journal kept on disk, a kernel panic that reboots, ssh sessions the OOM killer may kill, rsyslog's
# files rotated by size with an already flooded one cut down, a memory ceiling on the login's user slice with a user
# manager that comes back and may lock nova_service_memlock, older tooling's leftovers removed, a DISK line in the journal every 6 hours (DISK-WARN over nova_health_disk_warn_pct), and an
# hourly clean of what jobs leave in /tmp, the runners' TMPDIRs and the Go build cache.
# On a Mac only the Go build cache (`go env GOCACHE` of the login) is trimmed, hourly from a LaunchDaemon run as the login.
#
#   nova-fleet health --check --diff
#   nova-fleet health
- name: self-healing guards and the disk report (Linux)
  hosts: bench:runner:services   # the fleet's workers, never all: a seat-only machine (roles -) is not ours to tune (D13, 2026-11-07)
  gather_facts: true
  gather_subset: [min, hardware]
  roles:
    - health
