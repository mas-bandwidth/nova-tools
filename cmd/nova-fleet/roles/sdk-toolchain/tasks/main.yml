---
# The sdk-toolchain role (cmd/nova-fleet/sdk-toolchain.yml): every tool of nova_sdk_tools that has an entry for this
# platform, in <nova_sdk_dir>/<dir>, its commands linked into <nova_sdk_dir>/bin; the extra .NET SDKs inside the dotnet
# directory; on Linux a pinned rustup with its toolchains and the cargo tools; env.sh. A tool whose probe exists is
# adopted as it is. Runs as the login: nothing here becomes root.
- name: the platform
  ansible.builtin.set_fact:
    sdk_platform: >-
      {{ 'linux' if ansible_facts['system'] == 'Linux' and ansible_facts['architecture'] == 'x86_64' else
         ('darwin' if ansible_facts['system'] == 'Darwin' and ansible_facts['architecture'] in ['arm64', 'aarch64'] else 'other') }}

- name: a platform this play installs on
  ansible.builtin.assert:
    that: sdk_platform in ['linux', 'darwin']
    fail_msg: >-
      {{ inventory_hostname }} is {{ ansible_facts['system'] }} {{ ansible_facts['architecture'] }}: sdk-toolchain installs on
      x86_64 Linux (WSL too) and Apple-silicon macOS; leave it out with -l '!{{ inventory_hostname }}'
    quiet: true

- name: each tool for this platform, with its paths
  ansible.builtin.set_fact:
    sdk_specs: >-
      {%- set out = [] -%}
      {%- for t in nova_sdk_tools if t[sdk_platform] is defined -%}
      {%- set p = t[sdk_platform] -%}
      {%- set dest = nova_sdk_dir ~ '/' ~ t.dir -%}
      {%- set home = dest ~ (('/' ~ p.home) if p.home is defined else '') -%}
      {%- set _ = out.append({
            'name': t.name, 'version': t.version, 'kind': t.kind | default('archive'), 'src': p,
            'dest': dest, 'home': home, 'probe': home ~ '/' ~ t.probe,
            'digest': ('sha512:' ~ p.sha512) if p.sha512 is defined else (('sha256:' ~ p.sha256) if p.sha256 is defined else ''),
            'archive': nova_sdk_dir ~ '/dl/' ~ (p.file | default((p.url | default('')) | basename)),
            'build': t.build | default(''), 'links': t.links | default([]), 'alias': t.alias | default(''),
            'wrapper': t.wrapper | default('')}) -%}
      {%- endfor -%}
      {{ out }}

- name: every tool here is pinned
  ansible.builtin.assert:
    quiet: true
    that: >-
      (item.kind in ['archive', 'file'] and (item.src.url | default('')) is match('^https://') and item.digest is match('^sha(256:[0-9a-f]{64}|512:[0-9a-f]{128})$'))
      or (item.kind == 'git' and (item.src.repo | default('')) is match('^https://') and item.src.ref is defined and (item.src.commit | default('')) is match('^[0-9a-f]{40}$') and item.build != '')
      or (item.kind == 'go' and item.src.package is defined and (item.src.version | default('')) is match('^v[0-9]'))
      or (item.kind == 'npm' and item.src.package is defined and item.src.version is defined and (item.src.integrity | default('')) is match('^sha512-'))
      or (item.kind == 'script' and item.build != '')
    fail_msg: >-
      sdk-toolchain: {{ item.name }} {{ item.version }} ({{ item.kind }}) is not pinned for {{ sdk_platform }}: an archive or file needs an
      https url and a sha256 or sha512, git a repo, ref, 40-hex commit and a build, go a package and v-version, npm a package,
      version and sha512 integrity, script a build (nova_sdk_tools in roles/sdk-toolchain/defaults/main.yml)
  loop: "{{ sdk_specs }}"
  loop_control: { label: "{{ item.name }} {{ item.version }}" }

- name: every tool's directory and short name is one plain name inside the SDK
  ansible.builtin.assert:
    quiet: true
    that:
      - item.dest | basename is match('^[A-Za-z0-9][A-Za-z0-9._+-]*$')
      - item.dest | dirname == nova_sdk_dir
      - item.dest | basename not in ['bin', 'dl', 'dotnet-home', 'env.sh']
      - item.alias == '' or (item.alias is match('^[A-Za-z0-9][A-Za-z0-9._+-]*$') and item.alias not in ['bin', 'dl', 'dotnet-home', 'env.sh'])
    fail_msg: >-
      sdk-toolchain: {{ item.name }}'s dir ({{ item.dest | basename }}) or alias ({{ item.alias }}) is not one plain name inside
      {{ nova_sdk_dir }} other than bin, dl, dotnet-home and env.sh
  loop: "{{ sdk_specs }}"
  loop_control: { label: "{{ item.name }}" }

- name: the SDK directory, its bin and its download cache
  ansible.builtin.file: { path: "{{ item }}", state: directory }
  loop: ["{{ nova_sdk_dir }}", "{{ nova_sdk_dir }}/bin", "{{ nova_sdk_dir }}/dl"]

- name: each tool's probe
  ansible.builtin.stat: { path: "{{ item.probe }}", get_checksum: false }
  loop: "{{ sdk_specs }}"
  loop_control: { label: "{{ item.name }} {{ item.version }}" }
  register: sdk_probe

- name: the tools that are missing
  ansible.builtin.set_fact:
    sdk_missing: "{{ sdk_probe.results | rejectattr('stat.exists') | map(attribute='item') | list }}"
    sdk_go: "{{ nova_sdk_dir }}/{{ (nova_sdk_tools | selectattr('name', 'equalto', 'go') | first).dir }}/bin/go"
    sdk_node_bin: "{{ nova_sdk_dir }}/{{ (nova_sdk_tools | selectattr('name', 'equalto', 'node') | first).dir }}/bin"

- name: what a run would install
  ansible.builtin.debug:
    msg: "SDK-TOOLCHAIN WOULD-INSTALL host={{ inventory_hostname }} tool={{ item.name }} version={{ item.version }} into={{ item.dest }}"
  loop: "{{ sdk_missing }}"
  loop_control: { label: "{{ item.name }} {{ item.version }}" }
  when: ansible_check_mode

- name: the pinned archive of each missing tool, checked against its digest
  ansible.builtin.get_url:
    url: "{{ item.src.url }}"
    dest: "{{ item.archive }}"
    checksum: "{{ item.digest }}"
    mode: "0644"
    timeout: 300
  loop: "{{ sdk_missing | selectattr('kind', 'in', ['archive', 'file']) | list }}"
  loop_control: { label: "{{ item.name }} {{ item.version }}" }
  when: not ansible_check_mode

- name: the extra files of each missing tool, checked against their digests
  ansible.builtin.get_url:
    url: "{{ item.1.url }}"
    dest: "{{ nova_sdk_dir }}/dl/{{ item.1.url | basename }}"
    checksum: "sha256:{{ item.1.sha256 }}"
    mode: "0644"
    timeout: 300
  loop: "{{ sdk_missing | subelements('src.extras', skip_missing=True) }}"
  loop_control: { label: "{{ item.0.name }} {{ item.1.path }}" }
  when: not ansible_check_mode

# A missing tool is unpacked (or installed) in a stage beside the SDK and moved into place; a git or script tool builds
# into its directory. A directory already there without its probe is moved aside to <dir>.broken-<time>, never deleted.
- name: each missing tool installed into its directory
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      sdk={{ nova_sdk_dir | quote }}; dest={{ item.dest | quote }}
      n=$(getconf _NPROCESSORS_ONLN); jobs=$(( n / 4 > 1 ? n / 4 : 1 ))
      stage=$(mktemp -d "$sdk/.stage-{{ item.name }}-XXXXXX"); trap 'rm -rf "$stage"' EXIT
      export dest jobs stage
      mkdir "$stage/x"
      {% if item.kind == 'archive' %}
      case {{ item.archive | quote }} in
        *.zip|*.whl) unzip -q {{ item.archive | quote }} -d "$stage/x" ;;
        *) tar -xf {{ item.archive | quote }} -C "$stage/x" ;;
      esac
      {% elif item.kind == 'file' %}
      cp {{ item.archive | quote }} "$stage/x/{{ item.src.file }}"
      chmod 0755 "$stage/x/{{ item.src.file }}"
      {% elif item.kind == 'go' %}
      GOBIN="$stage/x" GOTOOLCHAIN=local GOFLAGS=-modcacherw {{ sdk_go | quote }} install {{ (item.src.package ~ '@' ~ item.src.version) | quote }}
      {% elif item.kind == 'npm' %}
      export PATH={{ sdk_node_bin | quote }}:"$PATH"
      npm install --prefix "$stage/x" --no-audit --no-fund --loglevel=error {{ (item.src.package ~ '@' ~ item.src.version) | quote }} >/dev/null
      got=$(node -e 'const l = require(process.argv[1]); console.log((l.packages["node_modules/" + process.argv[2]] || {}).integrity)' \
        "$stage/x/package-lock.json" {{ item.src.package | quote }})
      [ "$got" = {{ item.src.integrity | quote }} ] || { echo "SDK-TOOLCHAIN {{ item.name }}: npm installed integrity $got, pinned {{ item.src.integrity }}"; exit 1; }
      {% elif item.kind == 'git' %}
      git clone -q --depth 1 --branch {{ item.src.ref | quote }} {{ item.src.repo | quote }} "$stage/src"
      got=$(git -C "$stage/src" rev-parse HEAD)
      [ "$got" = {{ item.src.commit | quote }} ] || { echo "SDK-TOOLCHAIN {{ item.name }}: tag {{ item.src.ref }} is $got, pinned {{ item.src.commit }}"; exit 1; }
      {% endif %}
      if [ -e "$dest" ] || [ -L "$dest" ]; then mv "$dest" "$dest.broken-$(date -u +%Y%m%dT%H%M%SZ)"; fi
      {% if item.kind in ['git', 'script'] %}
      mkdir -p "$stage/src"
      cd "$stage/src"
      {{ item.build }}
      {% else %}
      root={{ item.src.root | default('') | quote }}
      case "$root" in
        .) src="$stage/x" ;;
        "") src="$stage/x"; one=$(ls -A "$stage/x")
            if [ "$(printf '%s\n' "$one" | wc -l)" -eq 1 ] && [ -d "$stage/x/$one" ]; then src="$stage/x/$one"; fi ;;
        *) src="$stage/x/$root" ;;
      esac
      mv "$src" "$dest"
      {% for e in item.src.extras | default([]) %}
      cp {{ (nova_sdk_dir ~ '/dl/' ~ (e.url | basename)) | quote }} "$dest/{{ e.path }}"
      {% endfor %}
      {% if item.build %}
      cd "$dest"
      {{ item.build }}
      {% endif %}
      {% endif %}
      test -e {{ item.probe | quote }} || { echo "SDK-TOOLCHAIN {{ item.name }} {{ item.version }}: installed, but {{ item.probe }} is missing"; exit 1; }
      echo "SDK-TOOLCHAIN-INSTALLED {{ item.name }} {{ item.version }}"
    executable: /bin/bash
  loop: "{{ sdk_missing }}"
  loop_control: { label: "{{ item.name }} {{ item.version }}" }
  register: sdk_installed
  changed_when: "'SDK-TOOLCHAIN-INSTALLED' in sdk_installed.stdout"
  when: not ansible_check_mode

- name: each tool's commands in the SDK's bin
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ nova_sdk_dir }}/bin/{{ item.name }}"
    state: link
    force: true
  loop: >-
    {%- set out = [] -%}
    {%- for s in sdk_specs -%}{%- for l in s.links -%}
    {%- set _ = out.append({'name': l.name if l is mapping else (l | basename), 'src': s.home ~ '/' ~ (l.path if l is mapping else l)}) -%}
    {%- endfor -%}{%- endfor -%}
    {{ out }}
  loop_control: { label: "{{ item.name }}" }

- name: each tool's short name for its directory
  ansible.builtin.file: { src: "{{ item.dest }}", dest: "{{ nova_sdk_dir }}/{{ item.alias }}", state: link, force: true }
  loop: "{{ sdk_specs | rejectattr('alias', 'equalto', '') | list }}"
  loop_control: { label: "{{ item.alias }}" }

- name: each tool's wrapper in the SDK's bin
  ansible.builtin.copy: { dest: "{{ nova_sdk_dir }}/bin/{{ item.name }}", content: "{{ item.wrapper }}", mode: "0755" }
  loop: "{{ sdk_specs | rejectattr('wrapper', 'equalto', '') | list }}"
  loop_control: { label: "{{ item.name }}" }

- name: the extra .NET SDKs
  ansible.builtin.include_tasks: dotnet.yml
  when: sdk_specs | selectattr('name', 'equalto', 'dotnet') | list | length > 0

- name: rustup, its toolchains and the cargo tools
  ansible.builtin.include_tasks: rustup.yml
  when: nova_sdk_rustup[sdk_platform] is defined

- name: env.sh, the SDK's environment
  ansible.builtin.template: { src: env.sh.j2, dest: "{{ nova_sdk_dir }}/env.sh", mode: "0644", backup: true }

- name: whether ~/.bashrc already sources env.sh (Linux)
  ansible.builtin.command: { argv: [grep, -q, sdk/env.sh, "{{ ansible_facts['user_dir'] }}/.bashrc"] }
  register: sdk_bashrc
  changed_when: false
  failed_when: false
  check_mode: false
  when: sdk_platform == 'linux' and nova_sdk_shell_rc | bool

- name: ~/.bashrc sources env.sh first (Linux)
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['user_dir'] }}/.bashrc"
    line: '[ -f "{{ nova_sdk_dir }}/env.sh" ] && . "{{ nova_sdk_dir }}/env.sh"   # the SDK toolchain PATH, before any early return'
    insertbefore: BOF
    create: true
    mode: "0644"
  when: sdk_platform == 'linux' and nova_sdk_shell_rc | bool and sdk_bashrc.rc != 0

- name: the runtimes dotnet lists
  ansible.builtin.command: { argv: ["{{ (sdk_specs | selectattr('name', 'equalto', 'dotnet') | first).home }}/dotnet", --list-runtimes] }
  register: sdk_runtimes
  changed_when: false
  when: not ansible_check_mode and sdk_specs | selectattr('name', 'equalto', 'dotnet') | list | length > 0

- name: the receipt
  ansible.builtin.debug:
    msg: >-
      SDK-TOOLCHAIN host={{ inventory_hostname }} platform={{ sdk_platform }} tools={{ sdk_specs | length }}
      present={{ sdk_specs | length - sdk_missing | length }}
      {{ ('would-install=' ~ (sdk_missing | length)) if ansible_check_mode else ('installed=' ~ (sdk_installed.results | default([]) | select('changed') | list | length)) }}
      dotnet={{ (sdk_runtimes.stdout_lines | default([]) | select('match', '^Microsoft.NETCore.App ') | map('split', ' ') | map(attribute=1) | join(',')) or '-' }}
  changed_when: false
