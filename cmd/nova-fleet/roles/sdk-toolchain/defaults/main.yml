      sha256: 1e79f51341937f84cc1563a3fcad4a91706e35dee72bda69f4e955065c0e373a
      file: dartsdk-macos-arm64-release-3.13.2.zip

  # Erlang/OTP: on Linux the hex.pm prebuilt, which relocates itself in place (its Install names the final directory).
  # hex.pm builds none for macOS, so a Mac builds the release's source from a copy of the unpacked tree set aside, as
  # sbcl's, with crypto and ssl linked statically against Homebrew's openssl@3 or openssl@4 (the host's: runner-packages'
  # postgresql@18 brings one), so a job reaches no library outside the SDK. It needs the Xcode command-line tools. bin/erl
  # falls back to the root its install named, so the run probe holds that root inside this directory's real path (an
  # install made through a symlinked SDK names a path a sandbox cannot traverse) and starts the runtime.
  - name: otp
    version: "29.0.5"
    dir: otp-29.0.5
    probe: bin/erl
    run: grep -qF "\"$dest" bin/erl && bin/erl -noshell -eval 'halt().'
    links: [bin/erl, bin/erlc, bin/escript, bin/dialyzer, bin/typer]
    build: ./Install -minimal "$dest" >/dev/null
    linux:
      url: https://builds.hex.pm/builds/otp/ubuntu-24.04/OTP-29.0.5.tar.gz
      sha256: 1ecf8a20104afa053e6701e36ec1485cbce1a2fa4aef962d5e73f9eb5c6e9fc0
      file: OTP-29.0.5-ubuntu-24.04.tar.gz
    darwin:
      url: https://github.com/erlang/otp/releases/download/OTP-29.0.5/otp_src_29.0.5.tar.gz
      sha256: 86f6f40d4638852b0383235b02a70d8450184e441e83a06a108bf8e5bf1b2e04
      build: |
        brew=$(command -v brew || ls /opt/homebrew/bin/brew /usr/local/bin/brew 2>/dev/null | head -1 || true)
        ssl=""
        for f in openssl@3 openssl@4; do
          p=$([ -z "$brew" ] || "$brew" --prefix "$f")
          if [ -e "$p/lib/libcrypto.a" ]; then ssl=$p; break; fi
        done
        [ -n "$ssl" ] || { echo "otp: no Homebrew openssl@3 or openssl@4 (libcrypto.a) to build crypto and ssl with; run: brew install openssl@3"; exit 1; }
        mv "$dest" "$stage/s"
        cd "$stage/s"
        { ./configure --prefix="$dest" --with-ssl="$ssl" --disable-dynamic-ssl-lib --without-javac --without-wx --without-odbc \
            && nice -n 15 make -j"$jobs" && make install DESTDIR="$stage/d"; } >"$stage/build.log" 2>&1 || { tail -40 "$stage/build.log"; exit 1; }
        mv "$stage/d$dest" "$dest"

