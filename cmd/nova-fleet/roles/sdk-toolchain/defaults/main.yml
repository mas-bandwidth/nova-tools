      root: .

  # moo, the deterministic fork of Luau, which publishes no binary: the CLI and the analyzer built from the tag, with the
  # commit they were built from in PIN, written last (the probe), so a Makefile can check it is its pin.
  - name: moo
    version: "1.3.0"
    dir: moo-v1.3.0
    probe: PIN
    links: [bin/moo, bin/moo-analyze]
    kind: git
    build: |
      cmake -S . -B b -DCMAKE_BUILD_TYPE=Release >/dev/null
      cmake --build b --target Luau.Repl.CLI Luau.Analyze.CLI -j"$jobs" >/dev/null
      mkdir -p "$dest/bin"
      cp -a b/moo b/moo-analyze "$dest/bin/"
      git rev-parse HEAD >"$dest/PIN"
    linux: &moo { repo: https://github.com/mas-bandwidth/moo, ref: v1.3.0, commit: f60f0239f41c6c0a827ecee44a7f9539c5798068 }
    darwin: *moo

  # The interpreter serialize.nut pins (its Makefile's dist-squirrel): the v3.2 tag's archive, built as sq64 with
  # SQUSEDOUBLE, so _intsize_ and _floatsize_ are both 8. The squirrel above is the float-32 build; this one is not
  # linked into bin and is reached through SQ (nova_sdk_env_files). Apple's clang takes the makefiles' -m64 on arm64.
  - name: squirrel-double
    version: "3.2"
    dir: squirrel-3.2-double
    probe: bin/sq
    links: []
    build: nice -n 15 make -s sq64 DEFS=-DSQUSEDOUBLE >/dev/null 2>&1
    linux: &squirrel_double
      url: https://github.com/albertodemichelis/squirrel/archive/refs/tags/v3.2.tar.gz
      file: squirrel-3.2-tag.tar.gz   # the URL's own name, v3.2.tar.gz, says nothing of what it is
      sha256: 02805414cfadd5bbb921891d3599b83375a40650abd6404a8ab407dc5e86a996
    darwin: *squirrel_double

  # CPython from the python.org source tarball, configured with its own directory as the prefix (from a copy of the
  # unpacked tree set aside, as sbcl's), with mypy installed offline from the extras: pure-Python wheels, each held to
  # PyPI's sha256 by pip --require-hashes; each wheel is py3-none-any, so the same lock serves Linux and macOS. Not linked
# as python3: a pin is named by its version.
  - name: python3.11
    version: "3.11.18"
    dir: python-3.11.18
    probe: bin/mypy
    links: [bin/python3.11]
    build: &python_build |
      mv "$dest" "$stage/s"
      mkdir -p "$dest" "$stage/w"
      mv "$stage"/s/*.whl "$stage/w/"
      cd "$stage/s"
      { ./configure --prefix="$dest" --disable-test-modules --with-ensurepip=install && nice -n 15 make -j"$jobs" && make install; } \
        >"$stage/build.log" 2>&1 || { tail -40 "$stage/build.log"; exit 1; }
      printf '%s\n' \
        'mypy==1.18.2 --hash=sha256:22a1748707dd62b58d2ae53562ffc4d7f8bcc727e8ac7cbc69c053ddc874d47e' \
        'mypy-extensions==1.1.0 --hash=sha256:1be4cccdb0f2482337c4743e60421de3a356cd97508abadd57d47403e94f5505' \
        'typing-extensions==4.15.0 --hash=sha256:f0fa19c6845758ab08074a0cfa8b7aecb71c999ca73d62883bc25cc018c4e548' \
        'pathspec==0.12.1 --hash=sha256:a0d503e138a4c123b27490a4f7beda6a01c6f288df0e4a8b79c7eb0dc7b4cc08' >"$stage/mypy.lock"
      "$dest/bin/python3" -I -m pip install --quiet --no-index --no-cache-dir --disable-pip-version-check \
        --require-hashes --find-links "$stage/w" -r "$stage/mypy.lock"
    linux: &python311
      url: https://www.python.org/ftp/python/3.11.18/Python-3.11.18.tgz
      sha256: 5f62711b12470fd435f83f1451c1b1ef4a179aebc715c716874b0967567d814e
      extras: &mypy_wheels
        - url: https://files.pythonhosted.org/packages/87/e3/be76d87158ebafa0309946c4a73831974d4d6ab4f4ef40c3b53a385a66fd/mypy-1.18.2-py3-none-any.whl
          sha256: 22a1748707dd62b58d2ae53562ffc4d7f8bcc727e8ac7cbc69c053ddc874d47e
          path: mypy-1.18.2-py3-none-any.whl
        - url: https://files.pythonhosted.org/packages/79/7b/2c79738432f5c924bef5071f933bcc9efd0473bac3b4aa584a6f7c1c8df8/mypy_extensions-1.1.0-py3-none-any.whl
          sha256: 1be4cccdb0f2482337c4743e60421de3a356cd97508abadd57d47403e94f5505
          path: mypy_extensions-1.1.0-py3-none-any.whl
        - url: https://files.pythonhosted.org/packages/18/67/36e9267722cc04a6b9f15c7f3441c2363321a3ea07da7ae0c0707beb2a9c/typing_extensions-4.15.0-py3-none-any.whl
          sha256: f0fa19c6845758ab08074a0cfa8b7aecb71c999ca73d62883bc25cc018c4e548
          path: typing_extensions-4.15.0-py3-none-any.whl
        - url: https://files.pythonhosted.org/packages/cc/20/ff623b09d963f88bfde16306a54e12ee5ea43e9b597108672ff3a408aad6/pathspec-0.12.1-py3-none-any.whl
          sha256: a0d503e138a4c123b27490a4f7beda6a01c6f288df0e4a8b79c7eb0dc7b4cc08
          path: pathspec-0.12.1-py3-none-any.whl
    darwin: *python311

  - name: python3.15
    version: "3.15.2"
    dir: python-3.15.2
    probe: bin/mypy
    links: [bin/python3.15]
    build: *python_build
    linux: &python315
      url: https://www.python.org/ftp/python/3.15.2/Python-3.15.2.tgz
      sha256: f74e1db0eabd651cd01e4e2a00201bd41866abe74869ab716f9bf33cbbaa0943
      extras: *mypy_wheels
    darwin: *python315

  # Rust on a Mac (Linux gets it through rustup, nova_sdk_rustup): the release's standalone installer for the first
  # toolchain there, with clippy and rustfmt, installed into a stage and moved into place whole, so a cut-short install
  # leaves no probe. The commands in <sdk>/bin are the ones Linux links from rustup.
  - name: rust
    version: "1.98.1"
    dir: rust-1.98.1
    probe: bin/rustc
    links: [bin/cargo, bin/rustc, bin/rustdoc, bin/rustfmt, bin/cargo-fmt, bin/cargo-clippy, bin/clippy-driver]
    build: |
      mv "$dest" "$stage/s"
      "$stage/s/install.sh" --prefix="$dest" --destdir="$stage/d" --disable-ldconfig \
        --components=rustc,rust-std-aarch64-apple-darwin,cargo,rustfmt-preview,clippy-preview \
        >"$stage/install.log" 2>&1 || { tail -20 "$stage/install.log"; exit 1; }
      mv "$stage/d$dest" "$dest"
    darwin:
      url: https://static.rust-lang.org/dist/rust-1.98.1-aarch64-apple-darwin.tar.xz
      sha256: 8f7c9de34c12c66dc55a6dbdd63b2b9645d4418775d4b975b0078a602f66e3e8

  - name: clang-format
    version: "23.1.3"
    dir: clang-format-23.1.3
    probe: clang_format/data/bin/clang-format
    links: [clang_format/data/bin/clang-format]
    linux:
      url: https://files.pythonhosted.org/packages/11/d1/658d3da4dcbca98620956868c7cf6f4ba19fccecbdfc30cc055e19c9d4a7/clang_format-23.1.3-py2.py3-none-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
      sha256: 58bf1804216501669832a39f2415e14284337438a062ff564729792adec664ac
      root: .

  # LLVM with compiler-rt and libFuzzer, for fuzzing builds; reached as <sdk>/llvm, nothing linked into <sdk>/bin.
  - name: llvm
    version: "22.1.8"
    dir: llvm-22.1.8
    probe: bin/clang
    alias: llvm
    linux:
      url: https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-Linux-X64.tar.xz
      sha256: df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384

  - name: cppcheck
    version: "2.13.0"
    dir: cppcheck-2.13.0
    probe: bin/cppcheck
    links: [bin/cppcheck]
    kind: git
    build: |
      cmake -S . -B b -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$dest" -DFILESDIR="$dest/share/cppcheck" -DBUILD_TESTS=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5 >/dev/null
      cmake --build b --target cppcheck -j"$jobs" >/dev/null   # alone: dmake can race the match compiler's sources
      cmake --install b >/dev/null
    linux: { repo: https://github.com/danmar/cppcheck, ref: "2.13.0", commit: da29903ffcbde465b6c2b47e8dc38277743f47ec }

  # AFL++: the core tools built with gcc in gnu17 (this release predates C23), the LLVM compiler wrappers against LLVM 18
  # (llvm-config-18: clang-18, llvm-18-dev and lld-18 come from runner-packages). afl-system-config and
  # afl-persistent-config, which change the machine as root, are not linked.
  - name: afl
    version: "4.21c"
    dir: afl-4.21c
    probe: bin/afl-fuzz
    links: [bin/afl-fuzz, bin/afl-showmap, bin/afl-tmin, bin/afl-gotcpu, bin/afl-analyze, bin/afl-plot, bin/afl-cmin, bin/afl-cmin.bash,
            bin/afl-whatsup, bin/afl-addseeds, bin/afl-cc, bin/afl-c++, bin/afl-clang, bin/afl-clang++, bin/afl-clang-fast,
            bin/afl-clang-fast++, bin/afl-clang-lto, bin/afl-clang-lto++, bin/afl-ld-lto, bin/afl-lto, bin/afl-lto++]
    kind: git
    build: |
      env -u CC -u CXX -u CFLAGS -u CXXFLAGS nice -n 19 make -j"$jobs" PREFIX="$dest" CC=gcc CFLAGS_OPT=-std=gnu17 \
        afl-fuzz afl-showmap afl-tmin afl-gotcpu afl-analyze >build.log 2>&1 || { tail -30 build.log; exit 1; }
      env -u CC -u CXX -u CFLAGS -u CXXFLAGS nice -n 19 make -f GNUmakefile.llvm -j"$jobs" PREFIX="$dest" LLVM_CONFIG=llvm-config-18 \
        >llvm.log 2>&1 || { tail -30 llvm.log; exit 1; }
      make -f GNUmakefile.llvm PREFIX="$dest" LLVM_CONFIG=llvm-config-18 DESTDIR="$PWD/stage" install >install.log 2>&1 || { tail -30 install.log; exit 1; }
      install -m 755 afl-fuzz afl-showmap afl-tmin afl-gotcpu afl-analyze afl-plot afl-cmin afl-cmin.bash afl-whatsup afl-addseeds "stage$dest/bin/"
      mv "stage$dest" "$dest"
    linux: { repo: https://github.com/AFLplusplus/AFLplusplus, ref: v4.21c, commit: 9f6b012fbfc8b79dda83e73a208e429aaf25e7ee }

  # Frama-C with WP, Alt-Ergo and Why3 in their own opam root (the opam command comes from runner-packages). opam checks
  # each package's archive against the checksum the opam repository publishes for it.
  - name: frama-c
    version: "33.0"
    dir: opam
    probe: default/bin/frama-c
    links: [default/bin/frama-c, default/bin/alt-ergo, default/bin/why3]
    kind: script
    build: |
      export OPAMROOT="$dest" OPAMYES=1 OPAMCONFIRMLEVEL=unsafe-yes OPAMJOBS="$jobs" OPAMASSUMEDEPEXTS=1
      opam init --disable-sandboxing --bare -n >opam.log 2>&1 || { tail -20 opam.log; exit 1; }
      opam switch create default ocaml-base-compiler.5.2.1 >>opam.log 2>&1 || { tail -20 opam.log; exit 1; }
      opam install --switch=default frama-c.33.0 alt-ergo.2.6.4 why3.1.8.2 >>opam.log 2>&1 || { tail -20 opam.log; exit 1; }
      # the login's prover list, written only where there is none: an existing one is the login's own
      [ -e "$HOME/.why3.conf" ] || opam exec --switch=default -- why3 config detect >/dev/null 2>&1 || true
    linux: {}

# More .NET SDKs, each unpacked into the dotnet tool's directory beside its own SDK (its dotnet host is kept, the newer
# one). An SDK brings its runtimes: 8.0's is what a net8.0 target runs on, rather than rolling forward to 10.0.
nova_sdk_dotnet_more:
  - version: "8.0.427"
    runtime: "8.0.33"
    linux:
      url: https://builds.dotnet.microsoft.com/dotnet/Sdk/8.0.427/dotnet-sdk-8.0.427-linux-x64.tar.gz
      sha512: 85725692f465f5024b9b42a159a29d9f73e8c57ad9e8bfe1e7028a505d18031d68931e8aa3f9de44145b08170dde897c8a78e1aa18d4219698b6891af7095d39
    darwin:
      url: https://builds.dotnet.microsoft.com/dotnet/Sdk/8.0.427/dotnet-sdk-8.0.427-osx-arm64.tar.gz
      sha512: 79786b93f249d233b15f1d6338d4798bd71c8143f267c5e84de76c9eb8a1054920e56ea5478f7bddfb74b951cc58aaca11fbd780cf134350b7cb7cdcb42a8c8c

# Rust through a pinned rustup (Linux): rustup-init at this version, checked against its .sha256, installs rustup into
# <sdk>/rustup-<version> (RUSTUP_HOME, with the proxies under cargo/bin) with the first toolchain as its default and
# self-update off; then each toolchain, with its components and targets (rustup checks every component against the channel manifest's
# digest). The first toolchain is the one on PATH: its own binaries are linked into <sdk>/bin, and <sdk>/bin/rustup is a
# wrapper that names this RUSTUP_HOME unless the caller set one. <sdk>/bin/rustc is a wrapper too: it runs the first
# toolchain's rustc with `-C linker=<linker>`, an absolute path, because rustc runs a bare `cc` through a PATH it changed,
# which Rust's std starts by fork with a SEQPACKET socketpair that a seccomp sandbox refuses ("could not exec the linker
# `cc`"); a linker given as a path is started by posix_spawn. A later -C linker (cargo's) wins. The nightly is the one
# cargo fuzz runs on.
nova_sdk_rustup:
  version: "1.29.1"
  linux:
    url: https://static.rust-lang.org/rustup/archive/1.29.1/x86_64-unknown-linux-gnu/rustup-init
    sha256: dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71
    host: x86_64-unknown-linux-gnu
    linker: /usr/bin/cc
  toolchains:
    - name: "1.98.1"
      components: [clippy, rustfmt]
      targets: []
    - name: nightly-2026-10-01
      components: []
      targets: []
  links: [cargo, rustdoc, rustfmt, cargo-fmt, cargo-clippy, clippy-driver]

# Cargo tools, each built from crates.io with --locked by the first toolchain into <sdk>/<name>-<version> and linked
# into <sdk>/bin.
nova_sdk_cargo_tools:
  - name: cargo-fuzz
    version: "0.13.1"
