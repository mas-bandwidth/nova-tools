  - name: google-java-format
    version: "1.37.0"
    dir: google-java-format-1.37.0
    probe: google-java-format-all-deps.jar
    kind: file
    wrapper: |
      #!/bin/sh
      # Written by the sdk-toolchain role: the pinned all-deps jar on the SDK's Java, else the Java on PATH. The
      # --add-exports are what the formatter needs on JDK 16 and later.
      if [ -x "{{ sdk_dir }}/bin/java" ]; then JAVA="{{ sdk_dir }}/bin/java"; else JAVA=java; fi
      exec "$JAVA" \
        --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
        --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
        --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED \
        --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
        --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED \
        --add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED \
        -jar "{{ sdk_dir }}/google-java-format-1.37.0/google-java-format-all-deps.jar" "$@"
    linux:
      url: https://github.com/google/google-java-format/releases/download/v1.37.0/google-java-format-1.37.0-all-deps.jar
      sha256: 834b2a0c38cb774953322a84b5ca3f2f40dd3156650b3cd44d3b744345962f7a
      file: google-java-format-all-deps.jar

