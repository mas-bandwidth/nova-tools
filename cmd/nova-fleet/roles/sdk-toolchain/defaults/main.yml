    links: [bin/lua, bin/luac, {name: lua5.4, path: bin/lua}]
    build: |
      if [ "$(uname -s)" = Darwin ]; then target=macosx; else target=linux; fi
      nice -n 15 make -s -j4 "$target" >/dev/null && make -s install INSTALL_TOP="$dest" >/dev/null
