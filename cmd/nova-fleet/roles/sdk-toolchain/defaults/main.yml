---
# The sdk-toolchain role (cmd/nova-fleet/sdk-toolchain.yml; cmd/nova-fleet/README.md, "sdk-toolchain"): the language
# toolchains a bench and a CI runner build and test with, each pinned, in the login's own SDK directory. Each tool lives
# in <nova_sdk_dir>/<dir>, its commands are linked into <nova_sdk_dir>/bin, and <nova_sdk_dir>/env.sh puts that first on
# PATH. A tool whose probe is already in its directory is adopted as it is (never re-downloaded); a missing one is
# fetched, checked against its digest and installed. Change a version together with its URL, digest and directory.
#
# Digests are the publisher's own: nodejs.org SHASUMS256.txt, the dart-archive .sha256sum, builds.hex.pm builds.txt, the
# elixir release .sha256sum, Adoptium's .sha256.txt, Microsoft's releases.json (SHA-512), go.dev/dl's JSON, a GitHub
# release asset's digest, PyPI's digest, python.org's release page, lua.org's download page and static.rust-lang.org's
# .sha256. A tool built from a git tag is pinned by the tag's commit; a Go tool by its module version (go install checks
# it against the checksum database); an npm package by the registry's integrity, checked in the lock file the install
# writes. sbcl and squirrel publish no digest: theirs is the archive's, recorded when it was first pinned.

# The role follows every symlink in this path before it uses it, so env.sh and every link in <sdk>/bin name the real
# directory: a sandbox that grants the SDK by its real path cannot traverse a symlink outside its grants.
nova_sdk_dir: "{{ ansible_facts['user_dir'] }}/sdk"

# Linux: the SDK in <nova_shared_dir>/sdk (group_vars/all.yml), the login's and readable by every login, with
# nova_sdk_dir a link to it, so a runner login of its own (github-runners, "The runner login") runs the same tools
# without reaching into the login's home. The shared SDK is installed fresh (its files name their own path) while
# nova_sdk_dir stays in use; once every tool is in place nova_sdk_dir becomes a link to it and the old one is deleted.
nova_sdk_shared: "{{ ansible_facts['system'] == 'Linux' and 'runner' in group_names and github_runner_user != ansible_facts['user_id'] }}"

# Linux: ~/.bashrc sources env.sh on its first line (before any early return for a non-interactive shell), unless a
# line of it already names sdk/env.sh. A Mac's shell files are left as they are.
nova_sdk_shell_rc: true

# Make variables some repositories' Makefiles read with `?=`, exported from env.sh so a make run on the machine takes
# the toolchain on PATH, as their CI passes it.
nova_sdk_env:
  DART: dart
  NODE: node
  JAVA: java
  JAVAC: javac
  ELIXIR: elixir
  MIX: mix

# Make variables naming a file under the SDK, exported from env.sh only where that file is executable. NOVA_SDK names
# the SDK itself, for a Makefile that stages a pinned toolchain from <sdk>/<tool>-<version> instead of downloading it.
nova_sdk_env_files:
  SQ: squirrel-3.2-double/bin/sq
  NOVA_SDK: "."
  LUA: lua-5.4.8/bin/lua
  LUAU: luau-0.741/bin/luau
  LUAU_ANALYZE: luau-0.741/bin/luau-analyze
  MOO: moo-v1.3.0/bin/moo
  MOO_ANALYZE: moo-v1.3.0/bin/moo-analyze
  GOOSE: goose-v2026.2/goose
  LOBSTER: lobster-v2026.8/bin/lobster

# One entry per tool. A tool is installed on a platform (linux: x86_64 Linux and WSL; darwin: Apple silicon) only when
# it has an entry for it. Keys:
#   dir     the directory under nova_sdk_dir                probe  a file under it that exists once it is installed
#   links   commands linked into <sdk>/bin: a path under the directory (linked by its basename), or {name, path}
#   alias   <sdk>/<alias> is a link to the directory        wrapper  a script written as <sdk>/bin/<name>
#   run     shell run in an installed tool's directory with $dest its real path: a failure means it is broken, and it is
#           moved aside to <dir>.broken-<time> and installed again
#   kind    archive (the default), file (one file), git (a tag at a pinned commit), go (go install), npm (npm install),
#           script (the build alone)
#   build   shell (set -euo pipefail) run with $dest (the directory), $stage (scratch) and $jobs set: in the directory after the unpack (archive, file), or
#           in the git checkout (git) or an empty directory (script), where it must create "$dest" itself
#   <platform>.build  the build on that platform, in place of build
#   <platform>.home   the subdirectory probe and links are under (the macOS JDK's Contents/Home)
#   <platform>.root   the archive's top directory (default: its one top directory, else the archive's whole content)
#   <platform>.extras more files fetched with the archive, each {url, sha256, path} placed at <dir>/<path>
nova_sdk_tools:
  - name: go
    version: "1.26.10"
    dir: go1.26.10
    probe: bin/go
    links: [bin/go, bin/gofmt]
    linux:
      url: https://go.dev/dl/go1.26.10.linux-amd64.tar.gz
      sha256: ccfe7ae822d2c2f41f4fe7c956199967a4dac22d0ee0d2b2bfdb440aab3b20c5
    darwin:
      url: https://go.dev/dl/go1.26.10.darwin-arm64.tar.gz
      sha256: 0b5183492292ada170f9b561a834863808dd02edba599e4ad0e89899330020b3

  - name: node
    version: "26.7.0"
    dir: node-v26.7.0
    probe: bin/node
    links: [bin/node, bin/npm, bin/npx]
    linux:
      url: https://nodejs.org/dist/v26.7.0/node-v26.7.0-linux-x64.tar.xz
      sha256: 982aa24dd8be4c889c6a8ab337ddff3b0896645b20f4239356e80552c16277ee
    darwin:
      url: https://nodejs.org/dist/v26.7.0/node-v26.7.0-darwin-arm64.tar.xz
      sha256: 595d2f934e081b82961d1a5fd41c6dbd0c5a952d9e8be5b4566ab754426968d2

  - name: dart
    version: "3.13.2"
    dir: dart-3.13.2
    probe: bin/dart
    links: [bin/dart]
    linux:
      url: https://storage.googleapis.com/dart-archive/channels/stable/release/3.13.2/sdk/dartsdk-linux-x64-release.zip
      sha256: 28951c9f6bcca005a73aa24cd5e11478dd6555f53e8e96a33ef4d868b6efa9eb
