  - name: luau
    version: "0.741"
    dir: luau-0.741
    probe: bin/luau
    alias: luau
    links: [bin/luau, bin/luau-analyze, bin/luau-compile, bin/luau-ast]
    kind: git
    # the command-line tools, and the libraries and headers an embedding build links
    build: |
      cmake -S . -B b -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF >/dev/null
      cmake --build b -j"$jobs" >/dev/null
      mkdir -p "$dest/include" "$dest/lib" "$dest/bin"
      for d in */include; do cp -a "$d/." "$dest/include/"; done
      find b -maxdepth 1 -name 'lib*.a' -exec cp -a {} "$dest/lib/" \;
      for c in luau luau-analyze luau-compile luau-ast; do cp -a "b/$c" "$dest/bin/"; done
    linux: &luau { repo: https://github.com/luau-lang/luau, ref: "0.741", commit: 2d88f9b5facaa9e4ec91247b39ae8251bd49a244 }
    darwin: *luau

