  - name: sbcl
    version: "2.5.8"
    dir: sbcl-2.5.8
    probe: bin/sbcl
    links: [bin/sbcl]
    # its installer writes into INSTALL_ROOT, so it runs from a copy of the unpacked tree set aside
    build: |
      mv "$dest" "$stage/s"
      mkdir -p "$dest"
      cd "$stage/s"
      unset SBCL_HOME   # install.sh refuses an SBCL_HOME that is not under INSTALL_ROOT, as another sbcl's env sets
      INSTALL_ROOT="$dest" sh install.sh >"$stage/install.log" || { cat "$stage/install.log"; exit 1; }
    linux:
      url: https://downloads.sourceforge.net/project/sbcl/sbcl/2.5.8/sbcl-2.5.8-x86-64-linux-binary.tar.bz2
      sha256: 103fa33b913341791f0f61f5d500e1723ac986125e665b584efba760006fed67

