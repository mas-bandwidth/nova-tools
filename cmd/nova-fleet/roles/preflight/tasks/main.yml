---
# The preflight role: the programs a play needs on the control node, found before the play changes anything
# (cmd/nova-fleet/README.md, "Prerequisites"). preflight_control is a list of {cmd, for}: cmd is a name on PATH or a path,
# for says what needs it. A missing one stops the run naming it. Included once per run (run_once, on the control node).
- name: the control node's programs
  ansible.builtin.shell: |
    {% for p in preflight_control %}
    if ! command -v {{ p.cmd | quote }} >/dev/null 2>&1; then
      echo {{ (p.cmd ~ ' is missing (' ~ p.for ~ ')') | quote }}
    fi
    {% endfor %}
    true
  args: { executable: /bin/bash }
  delegate_to: localhost
  become: false
  run_once: true
  register: preflight_missing
  changed_when: false
  check_mode: false
  when: preflight_control | default([]) | length > 0

- name: nothing is missing
  ansible.builtin.assert:
    that: preflight_missing is skipped or preflight_missing.stdout_lines | length == 0
    fail_msg: >-
      PREFLIGHT STOP: on the control node, {{ preflight_missing.stdout_lines | default([]) | join('; ') }}
      (cmd/nova-fleet/README.md, "Prerequisites"; a variable such as nova_control_secrets points at a program off PATH)
    quiet: true
  run_once: true
