---
# postgres.yml's defaults (cmd/nova-fleet/README.md, "postgres"). Override them beside the
# inventory (group_vars/services.yml, host_vars/<machine>.yml) or with -e.

# One major across the fleet, so a dump from one store restores on the next.
nova_pg_version: "18"
nova_pg_cluster: main

# Where postgresql-<version> comes from: distro (the release's main), pgdg (the
# PostgreSQL project's apt repository, its key pinned by fingerprint), or auto
# (distro when apt already offers the package, else pgdg).
nova_pg_source: auto
nova_pg_pgdg_key_url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
nova_pg_pgdg_key_fingerprint: B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
nova_pg_pgdg_keyring: /etc/apt/keyrings/apt.postgresql.org.asc
nova_pg_pgdg_repo: https://apt.postgresql.org/pub/repos/apt

# The addresses it listens on (empty: the machine's `tailscale ip -4`), its
# port, the one database, and the network allowed to reach it by password
# (default: the range tailscale assigns). Everything else is rejected.
nova_pg_listen: []
nova_pg_port: 5432
nova_pg_db: nova
nova_pg_allow_cidr: 100.64.0.0/10
nova_pg_shared_buffers: 1GB
nova_pg_syslog_ident: nova-pg

# The passwords (<role>.pass, root 0600) and the nightly dumps live here.
nova_pg_dir: /var/lib/nova-pg
nova_pg_dump_keep_days: 14
nova_pg_dump_on_calendar: "*-*-* 03:15:00 UTC"

# The roles this play makes, each with a password made once on the machine,
# proven by a login and set only when the proof fails. role: its name; schema:
# the schema it owns in nova_pg_db ("" none); secret: the nova-secrets name its
# password is sealed as into nova_seal_seat ("" none); seats: the seats that
# name is then granted to (nova-secrets grant). flags and want (optional,
# default "LOGIN NOCREATEDB NOCREATEROLE" and "t|f|f"): the attributes and the
# login|createdb|createrole the role must show. The default is nova-config's
# three: nova_admin owns the database (migrations), nova_config owns schema
# config (the tool), nova_read reads it. A list given with -e replaces this
# one: keep these three in it and add yours.
nova_pg_roles:
  - { role: nova_admin,  schema: "",     secret: "",               seats: [], flags: "LOGIN CREATEDB CREATEROLE", want: "t|t|t" }
  - { role: nova_config, schema: config, secret: NOVA_PG_PASSWORD, seats: [] }
  - { role: nova_read,   schema: "",     secret: "",               seats: [] }

# Load `nova-config schema` (from the control node's nova-config) into the
# database: on the first run, and again whenever its SQL changes.
nova_pg_schema: true

# What this role writes where an install's leftover check reads (nova-tools-install,
# cmd/nova-fleet/README.md "install", Leftovers): system is /etc/systemd/system.
# install_play_test.go holds it to the names the tasks write.
nova_postgres_owns:
  system: [nova-pg-dump.service, nova-pg-dump.timer]
