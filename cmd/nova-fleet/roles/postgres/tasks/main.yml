---
# The postgres role (cmd/nova-fleet/postgres.yml): nova-config's PostgreSQL. The Debian cluster <version>/<cluster> is adopted
# as it is: this role owns its conf.d/nova.conf, its pg_hba.conf, the database, the roles of nova_pg_roles and the
# schemas they own, nova-config's grants, and the nightly dump, and nothing else under /etc/postgresql. It never drops
# a role, a schema or a database.
- name: a Debian-family machine
  ansible.builtin.assert:
    that: ansible_facts['os_family'] == 'Debian'
    fail_msg: "{{ inventory_hostname }} is {{ ansible_facts['os_family'] }}: postgres.yml installs PostgreSQL with apt"
    quiet: true

- name: the roles, checked before anything changes (pg_roles)
  ansible.builtin.include_tasks: roles.yml

- name: the tailnet address (when nova_pg_listen is empty)
  ansible.builtin.command: tailscale ip -4
  register: pg_ts
  changed_when: false
  failed_when: false
  check_mode: false
  when: nova_pg_listen | length == 0

- name: the addresses to listen on, the unit, the paths
  ansible.builtin.set_fact:
    pg_listen: "{{ nova_pg_listen if nova_pg_listen | length > 0 else ((pg_ts.stdout_lines | default([]))[:1] if pg_ts.rc | default(1) == 0 else []) }}"
    pg_unit: "postgresql@{{ nova_pg_version }}-{{ nova_pg_cluster }}"
    pg_conf_dir: "/etc/postgresql/{{ nova_pg_version }}/{{ nova_pg_cluster }}"
    pg_psql: "sudo -n -u postgres psql -X -qAt -v ON_ERROR_STOP=1"   # the unix socket, peer (pg_hba: local postgres peer)
    pg_role_names_sql: "'{{ pg_roles | map(attribute='name') | join(\"','\") }}'"
    pg_schemas: "{{ pg_roles | selectattr('schema') | list }}"

- name: an address to listen on
  ansible.builtin.assert:
    that: pg_listen | length > 0
    fail_msg: "{{ inventory_hostname }}: no tailnet address (tailscale ip -4) and no nova_pg_listen; give it the addresses to listen on"
    quiet: true

- name: the server and the client, from the declared source
  ansible.builtin.include_tasks: packages.yml

# Debian's postgresql-common makes <version>/main at install; another cluster name, or a machine installed with
# create_main_cluster=false, gets it made here. Under --check without one nothing below can be asked: the run says so.
- name: the clusters on this machine
  ansible.builtin.shell: command -v pg_lsclusters >/dev/null && pg_lsclusters -h || true
  register: pg_clusters
  changed_when: false
  check_mode: false

- name: the cluster's line
  ansible.builtin.set_fact:
    pg_cluster_line: "{{ pg_clusters.stdout_lines | default([]) | select('match', '^' ~ nova_pg_version ~ '\\s+' ~ nova_pg_cluster ~ '\\s') | list }}"

- name: no cluster yet, under --check
  ansible.builtin.debug:
    msg: "PG {{ inventory_hostname }} cluster {{ nova_pg_version }}/{{ nova_pg_cluster }} WOULD-CREATE (check: nothing changed; a run creates it and configures it)"
  changed_when: true
  when: pg_cluster_line | length == 0 and ansible_check_mode

- name: the rest needs the cluster
  ansible.builtin.meta: end_host
  when: pg_cluster_line | length == 0 and ansible_check_mode

- name: "the cluster {{ nova_pg_version }}/{{ nova_pg_cluster }}"
  ansible.builtin.command: "pg_createcluster {{ nova_pg_version }} {{ nova_pg_cluster }}"
  when: pg_cluster_line | length == 0

- name: postgresql.conf includes conf.d (so nova.conf wins over every line before it)
  ansible.builtin.shell: grep -Eq "^include_dir[[:space:]]*=[[:space:]]*'conf.d'" {{ pg_conf_dir }}/postgresql.conf
  register: pg_include
  changed_when: false
  failed_when: false
  check_mode: false

- name: the include is there
  ansible.builtin.assert:
    that: pg_include.rc == 0
    fail_msg: "{{ pg_conf_dir }}/postgresql.conf has no `include_dir = 'conf.d'` line (Debian's default): conf.d/nova.conf would not be read; restore the line"
    quiet: true

- name: the play's directory (the passwords) and the dumps directory (postgres writes there)
  ansible.builtin.file: { path: "{{ item.path }}", state: directory, owner: "{{ item.owner }}", group: "{{ item.owner }}", mode: "{{ item.mode }}" }
  loop:
    - { path: "{{ nova_pg_dir }}", owner: root, mode: "0755" }
    - { path: "{{ nova_pg_dir }}/dumps", owner: postgres, mode: "0700" }

- name: a password per role, made once on this machine (it leaves only through nova-secrets)
  ansible.builtin.shell: "umask 077; openssl rand -hex 32 > {{ nova_pg_dir }}/{{ item.name }}.pass"
  args: { creates: "{{ nova_pg_dir }}/{{ item.name }}.pass" }
  loop: "{{ pg_roles }}"
  loop_control: { label: "{{ item.name }}" }
  no_log: true
  failed_when: false
  register: pg_pass

# no_log hides the whole result, the cause with it: a failure is printed with any value redacted
- name: a password file that could not be made (value redacted)
  ansible.builtin.debug:
    msg: "PG PASS {{ item.item.name }} rc={{ item.rc }} {{ (item.stderr | default('') ~ ' ' ~ item.stdout | default('')) | regex_replace('[0-9a-f]{64}', 'REDACTED') | trim | truncate(400) }}"
  loop: "{{ pg_pass.results }}"
  loop_control: { label: "{{ item.item.name }}" }
  when: item.rc | default(0) != 0

- name: every password file is there
  ansible.builtin.assert:
    that: pg_pass.results | map(attribute='rc', default=0) | select('ne', 0) | list | length == 0
    fail_msg: "{{ inventory_hostname }}: a password file could not be made; the redacted cause is above"
    quiet: true

- name: conf.d/nova.conf (a change restarts the cluster)
  ansible.builtin.template: { src: nova-postgresql.conf.j2, dest: "{{ pg_conf_dir }}/conf.d/nova.conf", owner: postgres, group: postgres, mode: "0644" }
  register: pg_conf
  notify: restart postgresql

- name: pg_hba.conf (a change reloads the cluster)
  ansible.builtin.template: { src: nova-pg-hba.conf.j2, dest: "{{ pg_conf_dir }}/pg_hba.conf", owner: postgres, group: postgres, mode: "0640" }
  register: pg_hba
  notify: reload postgresql

# the instance unit is enabled-runtime on Debian (the postgresql generator starts every `auto` cluster through the
# umbrella postgresql.service at boot), so the umbrella is what is enabled and start.conf is asserted auto
- name: running
  ansible.builtin.systemd_service: { name: "{{ pg_unit }}", state: started }

- name: the umbrella unit is enabled
  ansible.builtin.systemd_service: { name: postgresql, enabled: true }

- name: start.conf says auto
  ansible.builtin.command: grep -Ex "auto" {{ pg_conf_dir }}/start.conf
  register: pg_start_conf
  changed_when: false
  failed_when: false
  check_mode: false

- name: the cluster starts at boot
  ansible.builtin.assert:
    that: pg_start_conf.rc == 0
    fail_msg: "{{ pg_conf_dir }}/start.conf is not `auto`: the cluster would not start at boot"
    quiet: true

# the restart or reload runs here: the roles below are proven over the listen address with the new pg_hba
- name: any restart or reload, now
  ansible.builtin.meta: flush_handlers

# ---- roles, database, schema, grants: read the server, then change only what differs ----
- name: the roles the server has (name|login|createdb|createrole)
  ansible.builtin.shell: |
    {{ pg_psql }} -d postgres <<'SQL'
    select rolname || '|' || rolcanlogin::char || '|' || rolcreatedb::char || '|' || rolcreaterole::char
      from pg_roles where rolname in ({{ pg_role_names_sql }}) order by 1;
    SQL
  register: pg_roles_read
  changed_when: false
  check_mode: false

- name: plan the roles (create, alter, current)
  ansible.builtin.set_fact:
    pg_role_plan: "{{ pg_role_plan | default({}) | combine({item.name: ('create' if line | length == 0 else ('alter' if line[0] != item.name ~ '|' ~ item.want else 'current'))}) }}"
  vars:
    line: "{{ pg_roles_read.stdout_lines | select('match', '^' ~ item.name ~ '\\|') | list }}"
  loop: "{{ pg_roles }}"
  loop_control: { label: "{{ item.name }}" }

- name: create or alter the roles whose attributes differ
  ansible.builtin.command: "{{ pg_psql }} -d postgres -c \"{{ 'CREATE' if pg_role_plan[item.name] == 'create' else 'ALTER' }} ROLE {{ item.name }} WITH {{ item.flags }}\""
  loop: "{{ pg_roles }}"
  loop_control: { label: "{{ item.name }}: {{ pg_role_plan[item.name] }}" }
  when: pg_role_plan[item.name] != 'current'

- name: the database (name|owner)
  ansible.builtin.shell: |
    {{ pg_psql }} -d postgres <<'SQL'
    select datname || '|' || pg_get_userbyid(datdba) from pg_database where datname = '{{ nova_pg_db }}';
    SQL
  register: pg_db_read
  changed_when: false
  check_mode: false

- name: plan the database
  ansible.builtin.set_fact:
    pg_db_plan: "{{ 'create' if pg_db_read.stdout | length == 0 else ('owner' if pg_db_read.stdout != nova_pg_db ~ '|nova_admin' else 'current') }}"

- name: "the database {{ nova_pg_db }}, owned by nova_admin"
  ansible.builtin.command: "{{ pg_psql }} -d postgres -c \"{{ 'CREATE DATABASE ' ~ nova_pg_db ~ ' OWNER nova_admin' if pg_db_plan == 'create' else 'ALTER DATABASE ' ~ nova_pg_db ~ ' OWNER TO nova_admin' }}\""
  when: pg_db_plan != 'current'

- name: the schemas of the roles (name|owner)
  ansible.builtin.shell: |
    {{ pg_psql }} -d {{ nova_pg_db }} <<'SQL'
    select nspname || '|' || pg_get_userbyid(nspowner) from pg_namespace
      where nspname in ('{{ pg_schemas | map(attribute='schema') | join("','") }}') order by 1;
    SQL
  register: pg_schema_read
  changed_when: false
  check_mode: false
  when: pg_schemas | length > 0 and (pg_db_plan != 'create' or not ansible_check_mode)

- name: plan the schemas (create, owner, current)
  ansible.builtin.set_fact:
    pg_schema_plan: "{{ pg_schema_plan | default({}) | combine({item.schema: ('create' if line | length == 0 else ('owner' if line[0] != item.schema ~ '|' ~ item.name else 'current'))}) }}"
  vars:
    line: "{{ [] if pg_schema_read is skipped else pg_schema_read.stdout_lines | select('match', '^' ~ item.schema ~ '\\|') | list }}"
  loop: "{{ pg_schemas }}"
  loop_control: { label: "{{ item.schema }}" }

- name: each schema, owned by its role (nova-config schema fills config)
  ansible.builtin.command: "{{ pg_psql }} -d {{ nova_pg_db }} -c \"{{ ('CREATE SCHEMA ' ~ item.schema ~ ' AUTHORIZATION ' ~ item.name) if pg_schema_plan[item.schema] == 'create' else ('ALTER SCHEMA ' ~ item.schema ~ ' OWNER TO ' ~ item.name) }}\""
  loop: "{{ pg_schemas }}"
  loop_control: { label: "{{ item.schema }}: {{ pg_schema_plan[item.schema] }}" }
  when: pg_schema_plan[item.schema] != 'current'

# (a boolean is cast to char: 't' or 'f'; boolean || text would read 'true')
# four facts: nova_admin may CREATE in config, nova_read has USAGE on it, and the four default privileges that make
# future tables readable by nova_read and writable by nova_config exist (counted exactly; others do not disturb it)
- name: the grants on schema config (admin-create|read-usage|default-acl-items)
  ansible.builtin.shell: |
    {{ pg_psql }} -d {{ nova_pg_db }} <<'SQL'
    select has_schema_privilege('nova_admin', 'config', 'CREATE')::char || '|' || has_schema_privilege('nova_read', 'config', 'USAGE')::char || '|' ||
      (select count(*) from pg_default_acl d join pg_namespace n on n.oid = d.defaclnamespace, unnest(d.defaclacl) a
        where n.nspname = 'config' and (
          (d.defaclrole = 'nova_config'::regrole and d.defaclobjtype = 'r' and a::text like 'nova_read=r/%') or
          (d.defaclrole = 'nova_admin'::regrole  and d.defaclobjtype = 'r' and a::text like 'nova_read=r/%') or
          (d.defaclrole = 'nova_admin'::regrole  and d.defaclobjtype = 'r' and a::text like 'nova_config=arwdDxt%') or
          (d.defaclrole = 'nova_admin'::regrole  and d.defaclobjtype = 'S' and a::text like 'nova_config=rwU/%')));
    SQL
  register: pg_grants_read
  changed_when: false
  check_mode: false
  when: (pg_schema_plan | default({}))['config'] | default('create') != 'create' or not ansible_check_mode

- name: plan the grants
  ansible.builtin.set_fact:
    pg_grants_plan: "{{ 'current' if (pg_grants_read is not skipped and pg_grants_read.stdout == 't|t|4') else 'grant' }}"

- name: "the grants: nova_admin on schema config, nova_read usage and select now and by default, nova_config on what nova_admin creates"
  ansible.builtin.shell: |
    {{ pg_psql }} -d {{ nova_pg_db }} <<'SQL'
    GRANT CONNECT ON DATABASE {{ nova_pg_db }} TO nova_config, nova_read;
    GRANT ALL ON SCHEMA config TO nova_admin;
    GRANT USAGE ON SCHEMA config TO nova_read;
    GRANT SELECT ON ALL TABLES IN SCHEMA config TO nova_read;
    ALTER DEFAULT PRIVILEGES FOR ROLE nova_config IN SCHEMA config GRANT SELECT ON TABLES TO nova_read;
    ALTER DEFAULT PRIVILEGES FOR ROLE nova_admin  IN SCHEMA config GRANT SELECT ON TABLES TO nova_read;
    ALTER DEFAULT PRIVILEGES FOR ROLE nova_admin  IN SCHEMA config GRANT ALL ON TABLES TO nova_config;
    ALTER DEFAULT PRIVILEGES FOR ROLE nova_admin  IN SCHEMA config GRANT ALL ON SEQUENCES TO nova_config;
    SQL
  when: pg_grants_plan != 'current'

# ---- passwords: proven over the listen address; set only where the proof fails ----
# The value goes from the file to PGPASSWORD for the proof (never argv: ps shows argv) and to psql's stdin for the
# set; neither is logged.
- name: each role answers with its file's password over the listen address (scram-sha-256)
  ansible.builtin.shell: "PGPASSWORD=\"$(tr -d '\\n' < {{ nova_pg_dir }}/{{ item.name }}.pass)\" PGCONNECT_TIMEOUT=5 psql -X -w -qAt -h {{ pg_listen[0] }} -p {{ nova_pg_port }} -U {{ item.name }} -d {{ nova_pg_db }} -c 'select 1'"
  loop: "{{ pg_roles }}"
  loop_control: { label: "{{ item.name }}" }
  register: pg_pw_test
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true

- name: plan the passwords (current, set)
  ansible.builtin.set_fact:
    pg_pw_plan: "{{ pg_pw_plan | default({}) | combine({item.item.name: ('current' if item.rc == 0 else 'set')}) }}"
  loop: "{{ pg_pw_test.results }}"
  loop_control: { label: "{{ item.item.name }}" }

- name: set the password of each role whose proof failed (file to stdin, never argv, never a log)
  ansible.builtin.shell: |
    set -o pipefail
    printf "ALTER ROLE %s WITH PASSWORD '%s';\n" "{{ item.name }}" "$(tr -d '\n' < {{ nova_pg_dir }}/{{ item.name }}.pass)" | {{ pg_psql }} -d postgres
  args: { executable: /bin/bash }
  loop: "{{ pg_roles }}"
  loop_control: { label: "{{ item.name }}" }
  when: pg_pw_plan[item.name] != 'current'
  no_log: true
  failed_when: false
  register: pg_pw_set

- name: a password that could not be set (the statement and any value redacted)
  ansible.builtin.debug:
    msg: "PG PASSWORD {{ item.item.name }} rc={{ item.rc }} {{ (item.stderr | default('') ~ ' ' ~ item.stdout | default('')) | regex_replace(\"PASSWORD '[^']*'\", \"PASSWORD 'REDACTED'\") | regex_replace('[0-9a-f]{64}', 'REDACTED') | trim | truncate(400) }}"
  loop: "{{ pg_pw_set.results }}"
  loop_control: { label: "{{ item.item.name }}" }
  when: item.rc | default(0) != 0

- name: every password was set
  ansible.builtin.assert:
    that: pg_pw_set.results | map(attribute='rc', default=0) | select('ne', 0) | list | length == 0
    fail_msg: "{{ inventory_hostname }}: ALTER ROLE failed; the redacted cause is above"
    quiet: true

- name: every role answers now
  ansible.builtin.shell: "PGPASSWORD=\"$(tr -d '\\n' < {{ nova_pg_dir }}/{{ item.name }}.pass)\" PGCONNECT_TIMEOUT=5 psql -X -w -qAt -h {{ pg_listen[0] }} -p {{ nova_pg_port }} -U {{ item.name }} -d {{ nova_pg_db }} -c 'select 1'"
  loop: "{{ pg_roles }}"
  loop_control: { label: "{{ item.name }}" }
  register: pg_pw_ok
  changed_when: false
  failed_when: false
  no_log: true
  when: not ansible_check_mode

# ---- the tables: `nova-config schema`, loaded on this machine as nova_admin ----
# The SQL comes from the control node's nova-config (nova_control_config); it is idempotent, and it is loaded only
# when it differs from the one this machine loaded last (its sha256 kept in <nova_pg_dir>/schema.sha256). It runs as
# postgres over the unix socket with SET ROLE nova_admin, so the tables are nova_admin's and the default privileges
# above give nova_config and nova_read theirs. No password is used.
- name: the schema SQL (control node)
  ansible.builtin.command: { argv: ["{{ nova_control_config }}", schema] }
  delegate_to: localhost
  become: false
  register: pg_schema_sql
  changed_when: false
  check_mode: false
  when: nova_pg_schema | bool

- name: the schema this machine loaded last
  ansible.builtin.slurp: { src: "{{ nova_pg_dir }}/schema.sha256" }
  register: pg_schema_stamp
  failed_when: false
  when: nova_pg_schema | bool

- name: plan the schema load
  ansible.builtin.set_fact:
    pg_schema_sum: "{{ pg_schema_sql.stdout | hash('sha256') }}"
    pg_schema_load: >-
      {{ (pg_schema_stamp.content | default('') | b64decode | trim) != (pg_schema_sql.stdout | hash('sha256')) }}
  when: nova_pg_schema | bool

- name: "the tables of schema config (nova-config schema, as nova_admin)"
  ansible.builtin.shell: >-
    {{ pg_psql }} -d {{ nova_pg_db }} -c 'SET ROLE nova_admin' -f - &&
    echo '{{ pg_schema_sum }}' > {{ nova_pg_dir }}/schema.sha256
  args:
    stdin: "{{ pg_schema_sql.stdout }}"
  register: pg_schema_loaded
  when: nova_pg_schema | bool and pg_schema_load | bool

# ---- the nightly dump ----
- name: nova-pg-dump.service
  ansible.builtin.template: { src: nova-pg-dump.service.j2, dest: /etc/systemd/system/nova-pg-dump.service, mode: "0644" }
  register: pg_dump_unit

- name: nova-pg-dump.timer
  ansible.builtin.template: { src: nova-pg-dump.timer.j2, dest: /etc/systemd/system/nova-pg-dump.timer, mode: "0644" }
  register: pg_dump_timer

# a unit systemd has never seen cannot be asked about in check mode: there the file is the drift
- name: the timer file, as it is now
  ansible.builtin.stat: { path: /etc/systemd/system/nova-pg-dump.timer }
  register: pg_timer_file

- name: the timer, enabled and started
  ansible.builtin.systemd_service: { name: nova-pg-dump.timer, enabled: true, state: started, daemon_reload: "{{ pg_dump_unit is changed or pg_dump_timer is changed }}" }
  register: pg_timer_state
  when: pg_timer_file.stat.exists or not ansible_check_mode

# ---- the proof, read on this machine ----
- name: the port answers on the listen address
  ansible.builtin.command: "pg_isready -h {{ pg_listen[0] }} -p {{ nova_pg_port }} -t 5"
  register: pg_ready
  changed_when: false
  failed_when: false
  check_mode: false

- name: the roles, as the server has them now
  ansible.builtin.shell: |
    {{ pg_psql }} -d postgres <<'SQL'
    select rolname from pg_roles where rolname in ({{ pg_role_names_sql }}) order by 1;
    SQL
  register: pg_du
  changed_when: false
  check_mode: false

- name: the database, as the server has it now
  ansible.builtin.shell: |
    {{ pg_psql }} -d postgres <<'SQL'
    select datname || '|' || pg_get_userbyid(datdba) from pg_database where datname = '{{ nova_pg_db }}';
    SQL
  register: pg_l
  changed_when: false
  check_mode: false

- name: the timer's state and next run
  ansible.builtin.shell: "echo $(systemctl is-enabled nova-pg-dump.timer 2>/dev/null || echo absent) $(systemctl show nova-pg-dump.timer -p NextElapseUSecRealtime --value 2>/dev/null)"
  register: pg_timer
  changed_when: false
  check_mode: false

- name: the timer's state, parsed
  ansible.builtin.set_fact:
    pg_timer_enabled: "{{ pg_timer.stdout.split(' ')[0] }}"

- name: what changed, and what is wrong
  ansible.builtin.set_fact:
    pg_changed: >-
      {{ (['packages'] if (pg_pkg is changed or pg_pkg is skipped) else [])
       + (['pgdg-source'] if ((pgdg_source | default({})) is changed or (pgdg_keyring | default({})) is changed) else [])
       + (['passwords'] if pg_pass is changed else [])
       + (['nova.conf'] if pg_conf is changed else []) + (['pg_hba.conf'] if pg_hba is changed else [])
       + (['roles:' ~ (pg_role_plan | dict2items | rejectattr('value', 'equalto', 'current') | map(attribute='key') | join(','))] if (pg_role_plan.values() | reject('equalto', 'current') | list | length > 0) else [])
       + (['db:' ~ pg_db_plan] if pg_db_plan != 'current' else []) + (['schemas:' ~ (pg_schema_plan | default({}) | dict2items | rejectattr('value', 'equalto', 'current') | map(attribute='key') | join(','))] if ((pg_schema_plan | default({})).values() | reject('equalto', 'current') | list | length > 0) else [])
       + (['grants'] if pg_grants_plan != 'current' else [])
       + (['schema-sql'] if (pg_schema_load | default(false) | bool) else [])
       + (['password-set:' ~ (pg_pw_plan | dict2items | rejectattr('value', 'equalto', 'current') | map(attribute='key') | join(','))] if (pg_pw_plan.values() | reject('equalto', 'current') | list | length > 0) else [])
       + (['dump-unit'] if pg_dump_unit is changed else []) + (['dump-timer'] if (pg_dump_timer is changed or pg_timer_state is changed) else []) }}
    pg_gaps: >-
      {{ ([] if pg_ready.rc == 0 else ['pg_isready rc=' ~ pg_ready.rc ~ ' on ' ~ pg_listen[0] ~ ':' ~ nova_pg_port])
       + ([] if (pg_du.stdout_lines | length) == (pg_roles | length) else ['roles: ' ~ (pg_du.stdout_lines | join(','))])
       + ([] if pg_l.stdout == nova_pg_db ~ '|nova_admin' else ['database: ' ~ (pg_l.stdout | default('absent', true))])
       + ([] if (pg_pw_ok is skipped or (pg_pw_ok.results | rejectattr('rc', 'equalto', 0) | list | length == 0)) else ['password proof failed: ' ~ (pg_pw_ok.results | rejectattr('rc', 'equalto', 0) | map(attribute='item.name') | join(','))])
       + ([] if pg_timer_enabled == 'enabled' else ['timer ' ~ pg_timer_enabled]) }}

- name: the receipt
  ansible.builtin.debug:
    msg: >-
      {% if ansible_check_mode %}PG CHECK {{ inventory_hostname }} version={{ nova_pg_version }} db={{ nova_pg_db }}
      listen={{ pg_listen | join(',') }}:{{ nova_pg_port }} would-change={{ pg_changed | join(' ') or 'nothing' }}
      {% elif pg_gaps | length == 0 %}PG OK {{ inventory_hostname }} version={{ nova_pg_version }} db={{ nova_pg_db }}
      listen={{ pg_listen | join(',') }}:{{ nova_pg_port }} roles={{ pg_du.stdout_lines | length }} timer=enabled
      next={{ pg_timer.stdout.split(' ')[1:] | join(' ') }} changed={{ pg_changed | join(' ') or 'nothing' }}
      {% else %}PG FAIL {{ inventory_hostname }} {{ pg_gaps | join('; ') }}{% endif %}

- name: a run with a gap is red, after the receipt
  ansible.builtin.assert:
    that: pg_gaps | length == 0
    fail_msg: "PG FAIL {{ inventory_hostname }} {{ pg_gaps | join('; ') }}"
    quiet: true
  when: not ansible_check_mode
