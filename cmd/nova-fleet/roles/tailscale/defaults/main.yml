---
# tailscale.yml's defaults (cmd/nova-fleet/README.md, "tailscale").

# The tags a machine joins with: tag:nova, and tag:runner on a machine with the
# runner role. The auth key (TAILSCALE_AUTHKEY) must be allowed to apply them
# (tagOwners in cmd/nova-fleet/tailscale-acl.json).
nova_tailscale_tags: "{{ ['tag:nova'] + (['tag:runner'] if inventory_hostname in (groups['runner'] | default([])) else []) }}"

# Tailscale SSH: off. It trusts the machine, not the person, so with it on every worker on a tagged machine is let in
# by the policy. The role says --ssh=false to the daemon (Linux, and a Mac running the open-source tailscaled), so a run
# turns it off where an earlier release turned it on. ssh between machines is the owner's key, as root, with agent
# forwarding (ssh-names.yml).
nova_tailscale_ssh: false

# The machine's MagicDNS name (<machine>.<tailnet>.ts.net) is written as its
# address in nova-config, so every later play and the bus reach it there.
nova_tailscale_record_address: true

# Debian and Ubuntu install from Tailscale's own apt repository.
nova_tailscale_apt_url: https://pkgs.tailscale.com/stable

# The firewall: on Linux ufw denies incoming on every interface but
# tailscale0 (plus Tailscale's own UDP port, for direct connections); on macOS
# the application firewall is on. false leaves the firewall as it is.
nova_firewall: true
nova_firewall_allow_udp: [41641]

# The CLI per platform; on a Mac running the open-source tailscaled, the tailscale beside the daemon instead.
nova_tailscale_bin: >-
  {{ '/Applications/Tailscale.app/Contents/MacOS/Tailscale' if (nova_system | default(ansible_facts['system'] | default(''))) == 'Darwin' else 'tailscale' }}
