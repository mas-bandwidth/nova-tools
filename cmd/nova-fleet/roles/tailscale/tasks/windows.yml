---
# Tailscale on Windows (included by main.yml for a Windows host only; needs ansible.windows, cmd/nova-fleet/requirements.yml):
# winget installs it, then the join. Windows has no /dev/stdin for --auth-key=file:, so the key is written to a file
# only the login can read, in the login's temp directory, for the one command, and removed after it whatever happened.
- name: tailscale installed (winget)
  ansible.windows.win_command: >-
    winget install --id Tailscale.Tailscale --exact --silent --accept-package-agreements --accept-source-agreements
  args: { creates: "{{ nova_tailscale_win_bin }}" }

- name: the machine's tailnet state (Windows)
  ansible.windows.win_command: '"{{ nova_tailscale_win_bin }}" status --json'
  register: ts_status_win
  changed_when: false
  failed_when: false
  check_mode: false

- name: the state, parsed (Windows)
  ansible.builtin.set_fact:
    ts_self: "{{ (ts_status_win.stdout | from_json).Self | default({}) if (ts_status_win.stdout | default('') | trim).startswith('{') else {} }}"
    ts_state: "{{ (ts_status_win.stdout | from_json).BackendState | default('Absent') if (ts_status_win.stdout | default('') | trim).startswith('{') else 'Absent' }}"

- name: what the join must do (Windows)
  ansible.builtin.set_fact:
    ts_join: "{{ ts_state != 'Running' }}"

- name: a running node keeps its tags (Windows; retagging is done at its console)
  ansible.builtin.fail:
    msg: >-
      TAILNET STOP {{ inventory_hostname }}: it is Running with tags {{ ts_self.Tags | default([], true) | join(',') or 'none' }},
      and {{ ts_tags | join(',') }} is wanted. Retag it at the machine's own console (not over the tailnet), with a key
      allowed those tags in a file: tailscale up --reset --force-reauth --auth-key=file:<key file>
      --hostname={{ inventory_hostname }} --advertise-tags={{ ts_tags | join(',') }} -- or set nova_tailscale_tags
      for this machine to the tags it has.
  when: ts_state == 'Running' and (ts_self.Tags | default([], true) | sort) != ts_tags

- name: the join has its key (Windows)
  ansible.builtin.assert:
    that: lookup('ansible.builtin.env', 'TAILSCALE_AUTHKEY') | length > 0
    fail_msg: "{{ inventory_hostname }}: tailnet state {{ ts_state }} and no TAILSCALE_AUTHKEY in the environment (nova-secrets exec --only TAILSCALE_AUTHKEY)"
    quiet: true
  when: ts_join and not ansible_check_mode

- name: tailscale up (Windows; the key in a file only the login reads, removed after)
  when: ts_join and not ansible_check_mode
  block:
    - name: the key file
      ansible.windows.win_copy:
        content: "{{ lookup('ansible.builtin.env', 'TAILSCALE_AUTHKEY') }}"
        dest: "{{ ansible_facts['env']['TEMP'] }}\\nova-tailscale-authkey"
      no_log: true
      failed_when: false
      register: ts_keyfile

    - name: the key file landed (key material redacted)
      ansible.builtin.assert:
        that: not (ts_keyfile.failed | default(false))
        fail_msg: "TAILNET STOP {{ inventory_hostname }}: the key file could not be written: {{ (ts_keyfile.msg | default('')) | regex_replace('tskey-[^\\s\"]*', 'tskey-REDACTED') | truncate(400) }}"
        quiet: true

    - name: tailscale up
      ansible.windows.win_command: >-
        "{{ nova_tailscale_win_bin }}" up --reset --auth-key=file:{{ ansible_facts['env']['TEMP'] }}\nova-tailscale-authkey
        --hostname={{ inventory_hostname }} --advertise-tags={{ ts_tags | join(',') }}
      register: ts_up
      no_log: true
      failed_when: false
  always:
    - name: the key file removed
      ansible.windows.win_file: { path: "{{ ansible_facts['env']['TEMP'] }}\\nova-tailscale-authkey", state: absent }

# no_log hides the whole result, the cause with it: the outcome is printed with any key redacted
- name: the join's outcome (Windows; key material redacted)
  ansible.builtin.debug:
    msg: "TAILNET UP rc={{ ts_up.rc | default(-1) }} {{ (ts_up.stderr | default('') ~ ' ' ~ ts_up.stdout | default('')) | regex_replace('tskey-[^\\s\"]*', 'tskey-REDACTED') | trim | truncate(600) }}"
  when: ts_up is defined and ts_up is not skipped

- name: the join landed (Windows)
  ansible.builtin.assert:
    that: (ts_up.rc | default(-1)) == 0
    fail_msg: "{{ inventory_hostname }}: tailscale up failed (rc={{ ts_up.rc | default(-1) }}); the redacted cause is above"
    quiet: true
  when: ts_up is defined and ts_up is not skipped

- name: the state after the join (Windows)
  ansible.windows.win_command: '"{{ nova_tailscale_win_bin }}" status --json'
  register: ts_after_win
  changed_when: false
  check_mode: false
  when: ts_up is defined and ts_up is not skipped

- name: the node, as it is now (Windows)
  ansible.builtin.set_fact:
    ts_self: "{{ (ts_after_win.stdout | from_json).Self }}"
  when: ts_after_win is not skipped
