---
# The firewall (cmd/nova-fleet/tailscale.yml's second play, included with tasks_from: firewall). Linux: ufw denies incoming on
# every interface but tailscale0, allows Tailscale's UDP port for direct connections, allows outgoing. It is turned on
# only over a connection that already comes in on the tailnet (or the local one), so the run cannot lock itself out.
# macOS: the application firewall on. Windows is left as it is.
- name: the firewall is wanted
  ansible.builtin.meta: end_host
  when: not (nova_firewall | bool) or ansible_facts['os_family'] == 'Windows'

- name: ufw (Linux)
  when: (nova_system | default(ansible_facts['system'])) == 'Linux'
  block:
    - name: nova_firewall_allow_in is a list of ufw allow rules
      ansible.builtin.assert:
        that:
          - nova_firewall_allow_in is iterable and nova_firewall_allow_in is not string and nova_firewall_allow_in is not mapping
          - nova_firewall_allow_in | reject('match', '^[A-Za-z0-9][A-Za-z0-9 ./:_-]*$') | list | length == 0
        fail_msg: >-
          FIREWALL STOP {{ inventory_hostname }}: nova_firewall_allow_in wants a list of the words after `ufw allow`
          (letters, digits, spaces and . / : _ -), as -e '{"nova_firewall_allow_in": ["in on eno2 proto udp from 10.0.0.0/24"]}';
          got {{ nova_firewall_allow_in | to_json }}
        quiet: true

    - name: the ufw package
      ansible.builtin.apt: { name: ufw, state: present }
      become: true
      register: fw_pkg

    - name: the machine's tailnet addresses
      ansible.builtin.command: "{{ ts_bin | default(nova_tailscale_bin) }} ip"
      register: fw_ts_ips
      changed_when: false
      failed_when: false
      check_mode: false

    - name: the address this run came in on
      ansible.builtin.set_fact:
        fw_conn: >-
          {{ 'local' if (ansible_connection | default('ssh')) == 'local'
             else ((ansible_facts['env']['SSH_CONNECTION'] | default('')).split(' ') + ['', '', ''])[2] }}

    - name: what ufw has now, and what it would take
      ansible.builtin.shell: |
        s=$(ufw status verbose 2>/dev/null)
        want=()
        grep -q '^Status: active' <<< "$s" || want+=(enable)
        grep -q 'Default: deny (incoming), allow (outgoing)' <<< "$s" || want+=(defaults)
        grep -Eq '^Anywhere on tailscale0 +ALLOW IN' <<< "$s" || want+=(tailscale0)
        {% for p in nova_firewall_allow_udp %}
        grep -Eq '^{{ p }}/udp +ALLOW IN' <<< "$s" || want+=(udp{{ p }})
        {% endfor %}
        {% for r in nova_firewall_allow_in %}
        ufw --dry-run allow {{ r }} 2>&1 | grep -q 'Skipping adding existing rule' || want+=("allow-in:{{ r | replace(' ', '_') }}")
        {% endfor %}
        echo "${want[*]}"
      args: { executable: /bin/bash }
      become: true
      register: fw_plan
      changed_when: false
      check_mode: false
      when: not (ansible_check_mode and fw_pkg is changed)

    - name: the run comes in on the tailnet (the firewall cannot cut it off)
      ansible.builtin.assert:
        that: fw_conn == 'local' or fw_conn in (fw_ts_ips.stdout_lines | default([]))
        fail_msg: >-
          FIREWALL HELD {{ inventory_hostname }}: this run reaches the machine on {{ fw_conn or 'an unknown address' }},
          not on its tailnet address, and ufw would close that path. Run again once the inventory's address is the tailnet name
          (tailscale.yml records it), or with -e nova_firewall=false
        quiet: true
      when: fw_plan.stdout | default('enable') | trim | length > 0 and not ansible_check_mode

    - name: ufw, set (deny incoming but on tailscale0, allow outgoing, on)
      ansible.builtin.shell: |
        set -e
        ufw default deny incoming
        ufw default allow outgoing
        ufw allow in on tailscale0
        {% for p in nova_firewall_allow_udp %}
        ufw allow {{ p }}/udp
        {% endfor %}
        {% for r in nova_firewall_allow_in %}
        ufw allow {{ r }}
        {% endfor %}
        ufw --force enable
      become: true
      when: fw_plan.stdout | default('') | trim | length > 0 and not ansible_check_mode

    - name: the change a run would make (--check)
      ansible.builtin.debug: { msg: "WOULD-SET ufw: {{ fw_plan.stdout | default('install, then all of it') | trim }}" }
      changed_when: true
      when: ansible_check_mode and (fw_plan.stdout | default('pending') | trim | length > 0)

    - name: the firewall's receipt (Linux)
      ansible.builtin.debug:
        # fw_plan is skipped under --check while ufw is not installed yet: then the whole of it is what a run would set
        msg: "FIREWALL {{ inventory_hostname }} ufw {{ (('WOULD-SET: ' if ansible_check_mode else 'set: ') ~ fw_want) if fw_want | length > 0 else 'as declared' }}{{ ' (check: nothing changed)' if ansible_check_mode else '' }}"
      vars:
        fw_want: "{{ fw_plan.stdout | default('install, then all of it') | trim }}"

- name: the application firewall (macOS)
  when: (nova_system | default(ansible_facts['system'])) == 'Darwin'
  block:
    - name: its state
      ansible.builtin.command: /usr/libexec/ApplicationFirewall/socketfilterfw --getglobalstate
      register: fw_mac
      changed_when: false
      check_mode: false

    - name: turned on
      ansible.builtin.command: /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate on
      become: true
      when: "'enabled' not in fw_mac.stdout"

    - name: the firewall's receipt (macOS)
      ansible.builtin.debug:
        msg: "FIREWALL {{ inventory_hostname }} application firewall {{ 'on' if 'enabled' in fw_mac.stdout else ('WOULD-ENABLE' if ansible_check_mode else 'turned on') }}"
