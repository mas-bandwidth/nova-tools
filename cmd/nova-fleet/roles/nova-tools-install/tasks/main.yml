---
# Installs the release nova_tools_version of nova_tools_repo (nova-tools by default) on this machine: each tool's
# asset is downloaded, checked against the release's SHA256SUMS and put in the
# bin directory. get_url with a checksum leaves a binary that already holds the
# digest alone, so a second run changes nothing. Nothing is restarted unless
# nova_tools_restart is true.

- name: a release is named
  ansible.builtin.assert:
    quiet: true
    that:
      - nova_tools_version is match('^v[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.]+)?$') or (nova_tools_local_dir | length > 0 and nova_tools_version is match('^[0-9A-Za-z][0-9A-Za-z.-]*$'))
      - nova_tools_repo is match('^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$')
      - nova_tools_names | reject('match', '^[a-z0-9][a-z0-9-]*$') | list | length == 0
    fail_msg: >-
      nova-tools-install: name the release (--tag vX.Y.Z, or with nova_tools_local_dir the version its file names carry), name its
      repository as OWNER/NAME, and keep nova_tools_names to plain file names

- name: the platform
  ansible.builtin.set_fact:
    nova_tools_os: "{{ ansible_facts['system'] | lower }}"
    nova_tools_arch: "{{ {'x86_64': 'amd64', 'AMD64': 'amd64', 'amd64': 'amd64', 'aarch64': 'arm64', 'arm64': 'arm64'}[ansible_facts['architecture']] | default(ansible_facts['architecture']) }}"

- name: this platform is one the release ships
  ansible.builtin.assert:
    quiet: true
    that: (nova_tools_os ~ '-' ~ nova_tools_arch) in ['darwin-arm64', 'linux-amd64', 'linux-arm64']
    fail_msg: "nova-tools-install: no release asset for {{ nova_tools_os }}-{{ nova_tools_arch }}"

- name: the release's checksum file, read from the release (a read, so check mode runs it too)
  ansible.builtin.uri:
    url: "{{ nova_tools_release_url }}/{{ nova_tools_version }}/SHA256SUMS"
    return_content: true
  register: nova_tools_sums
  check_mode: false
  changed_when: false
  when: nova_tools_local_dir | length == 0

# The local mode: binaries built on the control node, laid out as a release is (the file
# names and SHA256SUMS of cmd/nova-fleet/README.md, "install"), copied instead of downloaded.
- name: the local build's checksum file, read on the control node
  ansible.builtin.set_fact:
    nova_tools_sums: { content: "{{ lookup('ansible.builtin.file', nova_tools_local_dir ~ '/SHA256SUMS') }}" }
  when: nova_tools_local_dir | length > 0

# An empty nova_tools_names is every asset SHA256SUMS lists for this platform, by name.
- name: the tools to install
  ansible.builtin.set_fact:
    nova_tools_install_names: "{{ nova_tools_names if nova_tools_names | length > 0 else nova_tools_listed }}"
  vars:
    nova_tools_suffix: "{{ ('_' ~ nova_tools_version ~ '_' ~ nova_tools_os ~ '_' ~ nova_tools_arch) | regex_escape }}"
    nova_tools_listed: >-
      {{ nova_tools_sums.content.splitlines() | select | map('split') | map('last')
         | select('match', '^[a-z0-9][a-z0-9-]*' ~ nova_tools_suffix ~ '$')
         | map('regex_replace', nova_tools_suffix ~ '$', '') | list }}

- name: something to install
  ansible.builtin.assert:
    quiet: true
    that: nova_tools_install_names | length > 0
    fail_msg: >-
      nova-tools-install: install at least one tool ({{ nova_tools_repo }} {{ nova_tools_version }} lists none for {{ nova_tools_os }}-{{ nova_tools_arch }} when nova_tools_names is empty)

- name: each asset's digest, by the asset's name in SHA256SUMS
  ansible.builtin.set_fact:
    nova_tools_plan: >-
      {{ nova_tools_plan | default([]) + [{
           'tool': item,
           'asset': item ~ '_' ~ nova_tools_version ~ '_' ~ nova_tools_os ~ '_' ~ nova_tools_arch,
           'dest': item,
           'sha256': (nova_tools_sums.content.splitlines()
                      | select('search', ' ' ~ item ~ '_' ~ nova_tools_version ~ '_' ~ nova_tools_os ~ '_' ~ nova_tools_arch ~ '$')
                      | map('split') | map('first') | list | first | default(''))
         }] }}
  loop: "{{ nova_tools_install_names }}"

- name: every tool has a digest in the release
  ansible.builtin.assert:
    quiet: true
    that: item.sha256 is match('^[0-9a-f]{64}$')
    fail_msg: "nova-tools-install: {{ item.asset }} is not listed in {{ (nova_tools_local_dir ~ '/SHA256SUMS') if nova_tools_local_dir | length > 0 else (nova_tools_version ~ \"'s SHA256SUMS\") }}"
  loop: "{{ nova_tools_plan }}"
  loop_control: { label: "{{ item.asset }}" }

- name: is there a bin directory already (its mode is then left alone)
  ansible.builtin.stat:
    path: "{{ nova_tools_bin_dir }}"
  register: nova_tools_bin_stat

- name: the bin directory
  ansible.builtin.file:
    path: "{{ nova_tools_bin_dir }}"
    state: directory
    mode: "{{ '0755' if not nova_tools_bin_stat.stat.exists else omit }}"
  register: nova_tools_unix_dir

# A dry run on a machine with no bin directory yet reports only the directory:
# get_url refuses a destination whose directory does not exist.
- name: the binaries, verified against SHA256SUMS
  ansible.builtin.get_url:
    url: "{{ nova_tools_release_url }}/{{ nova_tools_version }}/{{ item.asset }}"
    dest: "{{ nova_tools_bin_dir }}/{{ item.dest }}"
    checksum: "sha256:{{ item.sha256 }}"
    mode: "0755"
  loop: "{{ nova_tools_plan }}"
  loop_control: { label: "{{ item.dest }}" }
  register: nova_tools_installed
  when: nova_tools_local_dir | length == 0 and not (ansible_check_mode and nova_tools_unix_dir is changed)

- name: each local binary's digest, on the control node
  ansible.builtin.stat:
    path: "{{ nova_tools_local_dir }}/{{ item.asset }}"
    checksum_algorithm: sha256
  loop: "{{ nova_tools_plan }}"
  loop_control: { label: "{{ item.asset }}" }
  delegate_to: localhost
  become: false
  register: nova_tools_local_stat
  when: nova_tools_local_dir | length > 0

- name: each local binary is the one its SHA256SUMS names
  ansible.builtin.assert:
    quiet: true
    that: item.stat.exists and item.stat.checksum == item.item.sha256
    fail_msg: >-
      nova-tools-install: {{ nova_tools_local_dir }}/{{ item.item.asset }}
      {{ 'does not match its SHA256SUMS line' if item.stat.exists else 'is missing' }}; rebuild the directory (cmd/nova-fleet/README.md, "install")
  loop: "{{ nova_tools_local_stat.results | default([]) }}"
  loop_control: { label: "{{ item.item.asset }}" }
  when: nova_tools_local_dir | length > 0

- name: the binaries, copied from the local build
  ansible.builtin.copy:
    src: "{{ nova_tools_local_dir }}/{{ item.asset }}"
    dest: "{{ nova_tools_bin_dir }}/{{ item.dest }}"
    mode: "0755"
  loop: "{{ nova_tools_plan }}"
  loop_control: { label: "{{ item.dest }}" }
  register: nova_tools_installed_local
  when: nova_tools_local_dir | length > 0 and not (ansible_check_mode and nova_tools_unix_dir is changed)

- name: the restart commands, only when asked and only when a binary changed
  ansible.builtin.command:
    argv: "{{ item }}"
  loop: "{{ nova_tools_restart_commands }}"
  when:
    - nova_tools_restart | bool
    - (nova_tools_installed.changed | default(false)) or (nova_tools_installed_local.changed | default(false))
