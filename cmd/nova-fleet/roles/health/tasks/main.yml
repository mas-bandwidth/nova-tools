---
# The health role (cmd/nova-fleet/health.yml): guards that let a Linux machine recover by itself, and a disk report. Each is a
# file this role owns (a drop-in, a sysctl file, a unit); applying one restarts only the daemon it configures, never
# the user's units.
- name: Linux only
  ansible.builtin.meta: end_host
  when: (nova_system | default(ansible_facts['system'])) != 'Linux'

# ---- the journal, on disk ----
- name: the journal directory
  ansible.builtin.file: { path: /var/log/journal, state: directory, mode: "2755", owner: root, group: systemd-journal }
  become: true
  when: nova_health_journal | bool

- name: the journald drop-in directory
  ansible.builtin.file: { path: /etc/systemd/journald.conf.d, state: directory, mode: "0755" }
  become: true
  when: nova_health_journal | bool

- name: a persistent journal with room for earlier boots
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/90-nova-journal.conf
    mode: "0644"
    content: |
      # managed by Ansible (fleet/health.yml): the boots before a failure are kept to be read
      [Journal]
      Storage=persistent
      SystemMaxUse={{ nova_health_journal_max_use }}
  become: true
  notify: restart journald
  when: nova_health_journal | bool

# ---- a panic reboots the machine (tasks/panic.yml) ----
- name: the panic guard
  ansible.builtin.import_tasks: panic.yml

# ---- ssh sessions can be killed by the OOM killer ----
- name: the ssh unit exists
  ansible.builtin.command: "systemctl cat {{ nova_health_ssh_unit }}.service"
  register: health_ssh_unit
  changed_when: false
  failed_when: false
  check_mode: false
  when: nova_health_ssh_killable | bool

- name: the ssh drop-in directory
  ansible.builtin.file: { path: "/etc/systemd/system/{{ nova_health_ssh_unit }}.service.d", state: directory, mode: "0755" }
  become: true
  when: nova_health_ssh_killable | bool and health_ssh_unit.rc == 0

# Debian's ssh.service sets OOMScoreAdjust=-1000 and every session inherits it, so a runaway command over ssh leaves
# the kernel nothing it may kill. At 0, sshd still protects itself (it sets its own score) and its sessions run at 0.
# The restart keeps open sessions (KillMode=process).
- name: sessions at OOM score 0
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ nova_health_ssh_unit }}.service.d/90-nova-oom.conf"
    mode: "0644"
    content: |
      # managed by Ansible (fleet/health.yml): sessions run at 0, sshd keeps -1000 for itself
      [Service]
      OOMScoreAdjust=0
  become: true
  notify: restart ssh
  when: nova_health_ssh_killable | bool and health_ssh_unit.rc == 0

# ---- a flooded log cannot fill the disk ----
- name: rsyslog's logrotate file
  ansible.builtin.stat: { path: /etc/logrotate.d/rsyslog }
  register: health_logrotate

- name: rsyslog's files also rotate by size
  ansible.builtin.lineinfile:
    path: /etc/logrotate.d/rsyslog
    regexp: '^\s*maxsize\b'
    insertafter: '^\s*(weekly|daily)\b'
    line: "\tmaxsize {{ nova_health_log_maxsize }}"
  become: true
  when: health_logrotate.stat.exists

- name: the flooded files (over nova_health_log_trim)
  ansible.builtin.shell: |
    for f in {{ nova_health_log_files | join(' ') }}; do
      [ -f "$f" ] && [ "$(stat -c %s "$f")" -gt {{ nova_health_log_trim }} ] && echo "$f"
    done; true
  register: health_flooded
  changed_when: false
  check_mode: false
  when: (nova_health_log_trim | int) > 0

- name: a flooded file cut to its head and tail (kept as .flood) and emptied
  ansible.builtin.shell: |
    set -eu
    f={{ item | quote }}
    size=$(stat -c %s "$f")
    { head -c 33554432 "$f"; printf '\n[fleet/health.yml: %s bytes cut here]\n' "$size"; tail -c 33554432 "$f"; } > "$f.flood"
    chown --reference="$f" "$f.flood"; chmod --reference="$f" "$f.flood"
    truncate -s 0 "$f"
    echo "TRIMMED $f $size"
  args: { executable: /bin/bash }
  become: true
  loop: "{{ health_flooded.stdout_lines | default([]) }}"
  register: health_trim

# ---- the login's user slice has a memory ceiling, and its manager comes back ----
- name: the slice limit in whole MiB
  ansible.builtin.set_fact:
    health_slice_max_mib: "{{ (ansible_facts['memtotal_mb'] * (nova_health_user_memory_max_pct | int) / 100) | int }}"
  when: (nova_health_user_memory_max_pct | int) > 0

- name: the drop-in directories of the slice and the user manager
  ansible.builtin.file: { path: "{{ item }}", state: directory, mode: "0755" }
  loop: ["/etc/systemd/system/user-{{ ansible_facts['user_uid'] }}.slice.d", /etc/systemd/system/user@.service.d]
  become: true
  when: (nova_health_user_memory_max_pct | int) > 0

# MemoryMax only: a MemoryHigh below it throttles the whole slice instead of killing the runaway job
- name: the slice drop-in (MemoryMax)
  ansible.builtin.copy:
    dest: "/etc/systemd/system/user-{{ ansible_facts['user_uid'] }}.slice.d/90-nova-memory.conf"
    mode: "0644"
    content: |
      # managed by Ansible (fleet/health.yml): a runaway job is killed inside the user's slice
      [Slice]
      MemoryMax={{ health_slice_max_mib }}M
  become: true
  notify: reload the system manager
  when: (nova_health_user_memory_max_pct | int) > 0

- name: the user manager drop-in (Restart=on-failure)
  ansible.builtin.copy:
    dest: /etc/systemd/system/user@.service.d/90-nova-restart.conf
    mode: "0644"
    content: |
      # managed by Ansible (fleet/health.yml): a killed user manager comes back
      [Service]
      Restart=on-failure
      RestartSec=5
  become: true
  notify: reload the system manager
  when: (nova_health_user_memory_max_pct | int) > 0

# ---- the disk report ----
- name: the report script
  ansible.builtin.copy: { src: nova-disk-report, dest: /usr/local/sbin/nova-disk-report, mode: "0755", owner: root, group: root }
  become: true
  when: nova_health_disk_report | bool

- name: the report's unit and timer
  ansible.builtin.copy:
    dest: "/etc/systemd/system/nova-disk-report.{{ item.ext }}"
    mode: "0644"
    content: "{{ item.content }}"
  loop:
    - ext: service
      content: |
        # managed by Ansible (fleet/health.yml)
        [Unit]
        Description=one DISK line for /, the home filesystem and swap (DISK-WARN over {{ nova_health_disk_warn_pct }}%)
        [Service]
        Type=oneshot
        Nice=19
        Environment=DISK_WARN_PCT={{ nova_health_disk_warn_pct }}
        ExecStart=/usr/local/sbin/nova-disk-report {{ nova_home }}
    - ext: timer
      content: |
        # managed by Ansible (fleet/health.yml)
        [Unit]
        Description=the disk report ({{ nova_health_disk_on_calendar }})
        [Timer]
        OnCalendar={{ nova_health_disk_on_calendar }}
        RandomizedDelaySec=30m
        Persistent=true
        [Install]
        WantedBy=timers.target
  loop_control: { label: "nova-disk-report.{{ item.ext }}" }
  become: true
  register: health_disk_units
  when: nova_health_disk_report | bool

- name: the system manager reads them
  ansible.builtin.systemd_service: { daemon_reload: true }
  become: true
  when: nova_health_disk_report | bool and health_disk_units is changed and not ansible_check_mode

- name: the report's timer, enabled and started
  ansible.builtin.systemd_service: { name: nova-disk-report.timer, enabled: true, state: started }
  become: true
  when: nova_health_disk_report | bool and not (ansible_check_mode and health_disk_units is changed)

- name: the changes, applied now
  ansible.builtin.meta: flush_handlers

# ---- the receipt, read back ----
- name: what the machine reports
  ansible.builtin.shell: |
    set -u
    j=$(test -d /var/log/journal && echo persistent || echo volatile)
    p=$(sysctl -n kernel.panic 2>/dev/null || echo ?)
    s=$(systemctl show -p OOMScoreAdjust --value {{ nova_health_ssh_unit }}.service 2>/dev/null || echo ?)
    m=$(systemctl show -p MemoryMax --value user-{{ ansible_facts['user_uid'] }}.slice 2>/dev/null || echo ?)
    d=$(DISK_NO_LOG=1 DISK_WARN_PCT={{ nova_health_disk_warn_pct }} bash -s {{ nova_home }} < /usr/local/sbin/nova-disk-report 2>/dev/null || df -P / | awk 'NR==2{print "DISK root=" $5}')
    echo "journal=$j panic=$p ssh_oom=${s:-unset} slice_max=$m | $d"
  args: { executable: /bin/bash }
  become: true
  register: health_show
  changed_when: false
  check_mode: false

- name: the receipt
  vars:
    health_trimmed: "{{ health_trim.results | default([]) | selectattr('stdout', 'defined') | map(attribute='stdout') | list }}"
  ansible.builtin.debug:
    msg: >-
      HEALTH {{ inventory_hostname }} {{ health_show.stdout | trim }}
      {{- (' ' ~ health_trimmed | join(' ')) if health_trimmed else '' }}
      {{- ' (check: nothing changed)' if ansible_check_mode else '' }}

# the receipt is read by people and by programs: a machine in a bad state makes the run red, naming each one. Under
# --check only the disk counts (the guards are what a run would set).
- name: what is wrong on the machine
  vars:
    hs: "{{ health_show.stdout | trim }}"
  ansible.builtin.set_fact:
    health_wrong: >-
      {{ ([hs | regex_search('DISK-WARN.*$')] if 'DISK-WARN' in hs else [])
       + ([] if ansible_check_mode else
           ((['journal not persistent'] if (nova_health_journal | bool and 'journal=persistent' not in hs) else [])
          + (['kernel.panic is not ' ~ nova_health_panic_reboot] if ((nova_health_panic_reboot | int) > 0 and ('panic=' ~ nova_health_panic_reboot ~ ' ') not in hs) else [])
          + (['ssh sessions not killable (OOMScoreAdjust is not 0)'] if (nova_health_ssh_killable | bool and health_ssh_unit.rc | default(1) == 0 and 'ssh_oom=0 ' not in hs) else [])
          + (['the user slice has no MemoryMax'] if ((nova_health_user_memory_max_pct | int) > 0 and 'slice_max=infinity' in hs) else []))) }}

- name: the machine is healthy
  ansible.builtin.assert:
    that: health_wrong | length == 0
    fail_msg: "HEALTH FAIL {{ inventory_hostname }}: {{ health_wrong | join('; ') }}"
    quiet: true
