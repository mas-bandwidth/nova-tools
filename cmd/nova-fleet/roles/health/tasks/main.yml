---
# The health role (cmd/nova-fleet/health.yml): guards that let a Linux machine recover by itself, and a disk report. Each is a
# file this role owns (a drop-in, a sysctl file, a unit); applying one restarts only the daemon it configures, never
# the user's units.
- name: a Mac trims its Go build cache and nothing else (darwin.yml)
  ansible.builtin.include_tasks: darwin.yml
  when: (nova_system | default(ansible_facts['system'])) == 'Darwin'

- name: Linux only from here
  ansible.builtin.meta: end_host
  when: (nova_system | default(ansible_facts['system'])) != 'Linux'
  tags: [always]   # --tags memlock as well

# ---- the journal, on disk ----
- name: the journal directory
  ansible.builtin.file: { path: /var/log/journal, state: directory, mode: "2755", owner: root, group: systemd-journal }
  become: true
  when: nova_health_journal | bool

- name: the journald drop-in directory
  ansible.builtin.file: { path: /etc/systemd/journald.conf.d, state: directory, mode: "0755" }
  become: true
  when: nova_health_journal | bool

- name: a persistent journal with room for earlier boots
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/90-nova-journal.conf
    mode: "0644"
    content: |
      # managed by Ansible (fleet/health.yml): the boots before a failure are kept to be read
      [Journal]
      Storage=persistent
      SystemMaxUse={{ nova_health_journal_max_use }}
  become: true
  notify: restart journald
  when: nova_health_journal | bool

# ---- a panic reboots the machine ----
- name: a panicked machine reboots itself
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-nova-panic.conf
    mode: "0644"
    content: |
      # managed by Ansible (fleet/health.yml): a panic is past any userspace watchdog; the kernel's timer reboots
      kernel.panic = {{ nova_health_panic_reboot }}
      kernel.panic_on_oops = 1
  become: true
  notify: load the panic sysctl
  when: (nova_health_panic_reboot | int) > 0

# ---- ssh sessions can be killed by the OOM killer ----
- name: the ssh unit exists
  ansible.builtin.command: "systemctl cat {{ nova_health_ssh_unit }}.service"
  register: health_ssh_unit
  changed_when: false
  failed_when: false
  check_mode: false
  when: nova_health_ssh_killable | bool

- name: the ssh drop-in directory
  ansible.builtin.file: { path: "/etc/systemd/system/{{ nova_health_ssh_unit }}.service.d", state: directory, mode: "0755" }
  become: true
  when: nova_health_ssh_killable | bool and health_ssh_unit.rc == 0

# Debian's ssh.service sets OOMScoreAdjust=-1000 and every session inherits it, so a runaway command over ssh leaves
# the kernel nothing it may kill. At 0, sshd still protects itself (it sets its own score) and its sessions run at 0.
# The restart keeps open sessions (KillMode=process).
- name: sessions at OOM score 0
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ nova_health_ssh_unit }}.service.d/90-nova-oom.conf"
    mode: "0644"
    content: |
      # managed by Ansible (fleet/health.yml): sessions run at 0, sshd keeps -1000 for itself
      [Service]
      OOMScoreAdjust=0
  become: true
  notify: restart ssh
  when: nova_health_ssh_killable | bool and health_ssh_unit.rc == 0

# ---- a flooded log cannot fill the disk ----
- name: rsyslog's logrotate file
  ansible.builtin.stat: { path: /etc/logrotate.d/rsyslog }
  register: health_logrotate

- name: rsyslog's files also rotate by size
  ansible.builtin.lineinfile:
    path: /etc/logrotate.d/rsyslog
    regexp: '^\s*maxsize\b'
    insertafter: '^\s*(weekly|daily)\b'
    line: "\tmaxsize {{ nova_health_log_maxsize }}"
  become: true
  when: health_logrotate.stat.exists

- name: the flooded files (over nova_health_log_trim)
  ansible.builtin.shell: |
    for f in {{ nova_health_log_files | join(' ') }}; do
      [ -f "$f" ] && [ "$(stat -c %s "$f")" -gt {{ nova_health_log_trim }} ] && echo "$f"
    done; true
  register: health_flooded
  changed_when: false
  check_mode: false
  when: (nova_health_log_trim | int) > 0

- name: a flooded file cut to its head and tail (kept as .flood) and emptied
  ansible.builtin.shell: |
    set -eu
    f={{ item | quote }}
    size=$(stat -c %s "$f")
    { head -c 33554432 "$f"; printf '\n[fleet/health.yml: %s bytes cut here]\n' "$size"; tail -c 33554432 "$f"; } > "$f.flood"
    chown --reference="$f" "$f.flood"; chmod --reference="$f" "$f.flood"
    truncate -s 0 "$f"
    echo "TRIMMED $f $size"
  args: { executable: /bin/bash }
  become: true
  loop: "{{ health_flooded.stdout_lines | default([]) }}"
  register: health_trim

# ---- the login's user slice has a memory ceiling, and its manager comes back ----
- name: the slice limit in whole MiB
  ansible.builtin.set_fact:
    health_slice_max_mib: "{{ (ansible_facts['memtotal_mb'] * (nova_health_user_memory_max_pct | int) / 100) | int }}"
  when: (nova_health_user_memory_max_pct | int) > 0

- name: the drop-in directories of the slice and the user manager
  ansible.builtin.file: { path: "{{ item }}", state: directory, mode: "0755" }
  loop: ["/etc/systemd/system/user-{{ ansible_facts['user_uid'] }}.slice.d", /etc/systemd/system/user@.service.d]
  become: true
  when: (nova_health_user_memory_max_pct | int) > 0

# MemoryMax only: a MemoryHigh below it throttles the whole slice instead of killing the runaway job
- name: the slice drop-in (MemoryMax)
  ansible.builtin.copy:
    dest: "/etc/systemd/system/user-{{ ansible_facts['user_uid'] }}.slice.d/90-nova-memory.conf"
    mode: "0644"
    content: |
      # managed by Ansible (fleet/health.yml): a runaway job is killed inside the user's slice
      [Slice]
      MemoryMax={{ health_slice_max_mib }}M
  become: true
  notify: reload the system manager
  when: (nova_health_user_memory_max_pct | int) > 0

- name: the user manager drop-in (Restart=on-failure)
  ansible.builtin.copy:
    dest: /etc/systemd/system/user@.service.d/90-nova-restart.conf
    mode: "0644"
    content: |
      # managed by Ansible (fleet/health.yml): a killed user manager comes back
      [Service]
      Restart=on-failure
      RestartSec=5
  become: true
  notify: reload the system manager
  when: (nova_health_user_memory_max_pct | int) > 0

# ---- the login's user manager may lock nova_service_memlock ----
# A user unit's LimitMEMLOCK (services.yml writes nova_service_memlock) cannot go past its user manager's, and the
# manager starts with systemd's 8 MiB. The drop-in sets it from the next start; a running manager's limit is raised in
# place with prlimit, so none of its units is restarted (the services play restarts a unit whose file changed).
- name: the login's user manager drop-in directory
  ansible.builtin.file: { path: "/etc/systemd/system/user@{{ ansible_facts['user_uid'] }}.service.d", state: directory, mode: "0755" }
  become: true

- name: the login's user manager drop-in (LimitMEMLOCK)
  ansible.builtin.copy:
    dest: "/etc/systemd/system/user@{{ ansible_facts['user_uid'] }}.service.d/90-nova-memlock.conf"
    mode: "0644"
    content: |
      # managed by Ansible (fleet/health.yml): io_uring's locked pages are charged to the login; its units may lock this much
      [Service]
      LimitMEMLOCK={{ nova_service_memlock }}
  become: true
  notify: reload the system manager

- name: the running user manager may lock as much
  ansible.builtin.shell: |
    set -eu
    pid=$(systemctl show -p MainPID --value user@{{ ansible_facts['user_uid'] }}.service)
    [ "${pid:-0}" -gt 0 ] || exit 0
    have=$(prlimit --pid "$pid" --memlock --raw --noheadings --output HARD)
    [ "$have" = "{{ health_memlock_bytes }}" ] && exit 0
    prlimit --pid "$pid" --memlock={{ health_memlock_bytes }}:{{ health_memlock_bytes }}
    echo "MEMLOCK-RAISED user@{{ ansible_facts['user_uid'] }} from=$have to={{ health_memlock_bytes }}"
  args: { executable: /bin/bash }
  vars:
    health_memlock_bytes: "{{ nova_service_memlock | human_to_bytes }}"
  become: true
  register: health_memlock
  changed_when: "'MEMLOCK-RAISED' in health_memlock.stdout"

# ---- the login's ssh sessions may lock nova_login_memlock ----
# sshd opens each session through PAM, and pam_limits gives it the limits.d lines for its login; a session starts at
# the kernel's 8 MiB without one, which refuses an io_uring replay the runners (LimitMEMLOCK=infinity) run. What a
# session starts, nova-reserve's commands among them, inherits it. Open sessions keep theirs; the next one has it.
- name: the login's ssh sessions may lock nova_login_memlock (pam_limits)
  ansible.builtin.copy:
    dest: /etc/security/limits.d/90-nova-memlock.conf
    mode: "0644"
    content: |
      # managed by Ansible (fleet/health.yml): the fleet login's sessions lock what its runners may (soft and hard, KiB)
      {{ ansible_facts['user_id'] }} - memlock {{ 'unlimited' if (nova_login_memlock | string) in ['unlimited', 'infinity'] else ((nova_login_memlock | human_to_bytes) // 1024) }}
  become: true
  tags: [memlock]

# ---- leftovers of older tooling ----
# Files that tools this play replaced wrote, removed where found (a unit is stopped and disabled first):
# - rowan-tools host-memory.yml: ssh's OOMScoreAdjust=-1000 undoes "sessions at OOM score 0" above, and its
#   user.slice MemoryMax stands beside the login's slice limit; tailscaled's floor is netwatch's to recover.
# - rowan-tools member-memory.yml: drop-ins of v1's member and reader units, which are gone.
# - rowan-tools postgres.yml: a nova-pg-dump.timer with no nova-pg-dump.service (the postgres play writes both).
# - the hand drop-in that set LimitMEMLOCK on every user unit (2026-10-23): the user manager's limit above replaces it.
# - v1's svc.sh nova-sprint runner units (actions.runner.mas-bandwidth-nova-sprint.*), and the install directory of
#   one that is no longer registered (no .runner file); this play's runners are github-runner-* units.
- name: the leftovers of older tooling on this machine
  ansible.builtin.shell: |
    shopt -s nullglob
    for f in /etc/systemd/system/{ssh.service.d,tailscaled.service.d,user.slice.d}/90-nova-host-memory.conf \
             {{ nova_home }}/.config/systemd/user/service.d/90-nova-memlock.conf \
             {{ nova_home }}/.config/systemd/user/nova-{loop,service}-{member,reader}-*.service.d \
             /etc/systemd/system/actions.runner.mas-bandwidth-nova-sprint.*; do
      [ -e "$f" ] && echo "$f"
    done
    if [ -e /etc/systemd/system/nova-pg-dump.timer ] && [ ! -e /etc/systemd/system/nova-pg-dump.service ]; then
      echo /etc/systemd/system/nova-pg-dump.timer
    fi
    for d in {{ nova_home }}/actions-runner-nova-sprint-*; do
      [ -e "$d/.runner" ] || echo "$d"
    done
    true
  args: { executable: /bin/bash }
  register: health_leftovers
  changed_when: false
  check_mode: false

- name: a leftover unit, stopped and disabled
  ansible.builtin.systemd_service: { name: "{{ item | basename }}", state: stopped, enabled: false }
  loop: "{{ health_leftovers.stdout_lines | select('match', '^/etc/systemd/system/[^/]+[.](service|timer)$') | list }}"
  become: true

- name: a leftover, removed
  ansible.builtin.file: { path: "{{ item }}", state: absent }
  loop: "{{ health_leftovers.stdout_lines }}"
  become: true
  register: health_removed
  notify: reload the system manager

- name: the login's manager reads its units again
  ansible.builtin.systemd_service: { daemon_reload: true, scope: user }
  environment: { XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] }}" }
  when: health_removed is changed and not ansible_check_mode and (health_removed.results | map(attribute='item') | select('match', '^' ~ nova_home ~ '/') | list | length > 0)

# ---- the disk report ----
- name: the report script
  ansible.builtin.copy: { src: nova-disk-report, dest: /usr/local/sbin/nova-disk-report, mode: "0755", owner: root, group: root }
  become: true
  when: nova_health_disk_report | bool

- name: the report's unit and timer
  ansible.builtin.copy:
    dest: "/etc/systemd/system/nova-disk-report.{{ item.ext }}"
    mode: "0644"
    content: "{{ item.content }}"
  loop:
    - ext: service
      content: |
        # managed by Ansible (fleet/health.yml)
        [Unit]
        Description=one DISK line for /, the home filesystem and swap (DISK-WARN over {{ nova_health_disk_warn_pct }}%)
        [Service]
        Type=oneshot
        Nice=19
        Environment=DISK_WARN_PCT={{ nova_health_disk_warn_pct }}
        ExecStart=/usr/local/sbin/nova-disk-report {{ nova_home }}
    - ext: timer
      content: |
        # managed by Ansible (fleet/health.yml)
        [Unit]
        Description=the disk report ({{ nova_health_disk_on_calendar }})
        [Timer]
        OnCalendar={{ nova_health_disk_on_calendar }}
        RandomizedDelaySec=30m
        Persistent=true
        [Install]
        WantedBy=timers.target
  loop_control: { label: "nova-disk-report.{{ item.ext }}" }
  become: true
  register: health_disk_units
  when: nova_health_disk_report | bool

- name: the system manager reads them
  ansible.builtin.systemd_service: { daemon_reload: true }
  become: true
  when: nova_health_disk_report | bool and health_disk_units is changed and not ansible_check_mode

- name: the report's timer, enabled and started
  ansible.builtin.systemd_service: { name: nova-disk-report.timer, enabled: true, state: started }
  become: true
  when: nova_health_disk_report | bool and not (ansible_check_mode and health_disk_units is changed)

# ---- the disk clean ----
- name: the clean script
  ansible.builtin.copy: { src: nova-disk-clean, dest: /usr/local/sbin/nova-disk-clean, mode: "0755", owner: root, group: root }
  become: true
  when: nova_health_disk_clean | bool

# github-runners.yml writes a runner's login and TMPDIR into its unit; its jobs' leftovers land there, not in /tmp. One
# line per runner: login, its home, TMPDIR.
- name: the runners' logins and TMPDIRs
  ansible.builtin.shell: |
    for f in /etc/systemd/system/github-runner-*.service; do
      [ -f "$f" ] || continue
      u=$(sed -n 's/^User=//p' "$f"); t=$(sed -n 's/^Environment=TMPDIR=//p' "$f")
      [ -n "$u" ] && [ -n "$t" ] && echo "$u $(getent passwd "$u" | cut -d: -f6) $t"
    done | sort -u
  register: health_runner_tmp
  changed_when: false
  check_mode: false
  when: nova_health_disk_clean | bool

# nova-disk-clean removes only what its user owns, so each login gets a clean run as it: the fleet login's
# (nova-disk-clean) with /tmp, its runners' TMPDIRs and its Go cache, and each other runner login's
# (nova-disk-clean-<login>) with /tmp, its runners' TMPDIRs and its own Go cache.
- name: the cleans, one per login
  ansible.builtin.set_fact:
    health_cleans: >-
      {%- set rows = health_runner_tmp.stdout_lines | default([]) | map('split', ' ') | list -%}
      {%- set out = [{'unit': 'nova-disk-clean', 'user': ansible_facts['user_id'],
            'dirs': nova_health_disk_clean_dirs + (rows | selectattr(0, 'equalto', ansible_facts['user_id']) | map(attribute=2) | list),
            'caches': nova_health_disk_clean_caches}] -%}
      {%- for u in rows | map(attribute=0) | unique | reject('equalto', ansible_facts['user_id']) -%}
      {%- set mine = rows | selectattr(0, 'equalto', u) | list -%}
      {%- set _ = out.append({'unit': 'nova-disk-clean-' ~ u, 'user': u,
            'dirs': nova_health_disk_clean_dirs + (mine | map(attribute=2) | list),
            'caches': [mine[0][1] ~ '/.cache/go-build']}) -%}
      {%- endfor -%}
      {{ out }}
  when: nova_health_disk_clean | bool

- name: the cleans' units and timers
  vars:
    clean_dirs: "{{ item.0.dirs | unique | join(':') }}"
    health_clean_service: |
      # managed by Ansible (fleet/health.yml)
      [Unit]
      Description=what jobs leave in {{ clean_dirs }} and the Go build cache, unchanged {{ nova_health_disk_clean_age_min }}m ({{ nova_health_disk_clean_pressed_min }}m over {{ nova_health_disk_warn_pct }}%)
      [Service]
      Type=oneshot
      User={{ item.0.user }}
      Nice=19
      IOSchedulingClass=idle
      Environment=DISK_WARN_PCT={{ nova_health_disk_warn_pct }}
      Environment=DISK_CLEAN_AGE_MIN={{ nova_health_disk_clean_age_min }}
      Environment=DISK_CLEAN_PRESSED_MIN={{ nova_health_disk_clean_pressed_min }}
      Environment="DISK_CLEAN_DIRS={{ clean_dirs }}"
      Environment="DISK_CLEAN_CACHES={{ item.0.caches | join(':') }}"
      ExecStart=/usr/local/sbin/nova-disk-clean
    health_clean_timer: |
      # managed by Ansible (fleet/health.yml)
      [Unit]
      Description=the disk clean ({{ nova_health_disk_clean_on_calendar }})
      [Timer]
      OnCalendar={{ nova_health_disk_clean_on_calendar }}
      RandomizedDelaySec=10m
      Persistent=true
      [Install]
      WantedBy=timers.target
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.0.unit }}.{{ item.1 }}"
    mode: "0644"
    content: "{{ health_clean_service if item.1 == 'service' else health_clean_timer }}"
  loop: "{{ health_cleans | default([]) | product(['service', 'timer']) | list }}"
  loop_control: { label: "{{ item.0.unit }}.{{ item.1 }}" }
  become: true
  register: health_clean_units
  when: nova_health_disk_clean | bool

- name: the system manager reads them
  ansible.builtin.systemd_service: { daemon_reload: true }
  become: true
  when: nova_health_disk_clean | bool and health_clean_units is changed and not ansible_check_mode

- name: the cleans' timers, enabled and started
  ansible.builtin.systemd_service: { name: "{{ item.unit }}.timer", enabled: true, state: started }
  loop: "{{ health_cleans | default([]) }}"
  loop_control: { label: "{{ item.unit }}.timer" }
  become: true
  when: >-
    nova_health_disk_clean | bool and not (ansible_check_mode
    and health_clean_units.results | default([]) | selectattr('item.0.unit', 'equalto', item.unit) | select('changed') | list | length > 0)

- name: the changes, applied now
  ansible.builtin.meta: flush_handlers

# ---- the receipt, read back ----
- name: what the machine reports
  ansible.builtin.shell: |
    set -u
    j=$(test -d /var/log/journal && echo persistent || echo volatile)
    p=$(sysctl -n kernel.panic 2>/dev/null || echo ?)
    s=$(systemctl show -p OOMScoreAdjust --value {{ nova_health_ssh_unit }}.service 2>/dev/null || echo ?)
    m=$(systemctl show -p MemoryMax --value user-{{ ansible_facts['user_uid'] }}.slice 2>/dev/null || echo ?)
    l=$(prlimit --pid "$(systemctl show -p MainPID --value user@{{ ansible_facts['user_uid'] }}.service)" --memlock --raw --noheadings --output HARD 2>/dev/null || echo ?)
    d=$(DISK_NO_LOG=1 DISK_WARN_PCT={{ nova_health_disk_warn_pct }} bash -s {{ nova_home }} < /usr/local/sbin/nova-disk-report 2>/dev/null || df -P / | awk 'NR==2{print "DISK root=" $5}')
    echo "journal=$j panic=$p ssh_oom=${s:-unset} slice_max=$m user_memlock=$l | $d"
  args: { executable: /bin/bash }
  become: true
  register: health_show
  changed_when: false
  check_mode: false

# An Intel 700-series NIC (X710, XL710, XXV710, X722) runs the in-tree i40e: AF_XDP zero copy is the mode, and Intel's
# out-of-tree driver compiles it out (its src/i40e.h undefines HAVE_AF_XDP_ZC_SUPPORT for SUSE, Ubuntu and every kernel
# >= 5.2; the fork mas-bandwidth/ethernet-linux-i40e is upstream 2.30.18 unchanged). Reported, never changed: each i40e
# port's driver build (in-tree when modinfo's path is under kernel/, else out-of-tree) and its version, and zc=yes when
# the loaded module carries the zero-copy path (i40e_xsk_wakeup in /proc/kallsyms). Nothing printed without such a NIC.
- name: the i40e driver of an Intel 700-series NIC, and whether AF_XDP zero copy is there
  ansible.builtin.shell: |
    set -u
    out=""
    for n in /sys/class/net/*; do
      [ "$(basename "$(readlink -f "$n/device/driver" 2>/dev/null)")" = i40e ] || continue
      i=$(basename "$n")
      v=$(ethtool -i "$i" 2>/dev/null | sed -n 's/^version: //p')
      out="$out $i=${v:-?}"
    done
    [ -n "$out" ] || exit 0
    case "$(modinfo -n i40e 2>/dev/null)" in */kernel/drivers/*) b=in-tree ;; "") b=? ;; *) b=out-of-tree ;; esac
    grep -q ' i40e_xsk_wakeup' /proc/kallsyms && zc=yes || zc=no
    echo "i40e=$b zc=$zc ports=$(echo $out | tr ' ' ',')"
  args: { executable: /bin/bash }
  become: true
  register: health_i40e
  changed_when: false
  check_mode: false

- name: the receipt
  vars:
    health_trimmed: "{{ health_trim.results | default([]) | selectattr('stdout', 'defined') | map(attribute='stdout') | list }}"
  ansible.builtin.debug:
    msg: >-
      HEALTH {{ inventory_hostname }} {{ health_show.stdout | trim }}
      {{- (' ' ~ health_i40e.stdout | trim) if health_i40e.stdout | default('') | trim else '' }}
      {{- (' ' ~ health_trimmed | join(' ')) if health_trimmed else '' }}
      {{- ' (check: nothing changed)' if ansible_check_mode else '' }}

# the receipt is read by people and by programs: a machine in a bad state makes the run red, naming each one. Under
# --check only the disk counts (the guards are what a run would set).
- name: what is wrong on the machine
  vars:
    hs: "{{ health_show.stdout | trim }}"
  ansible.builtin.set_fact:
    health_wrong: >-
      {{ ([hs | regex_search('DISK-WARN.*$')] if 'DISK-WARN' in hs else [])
       + ([] if ansible_check_mode else
           ((['journal not persistent'] if (nova_health_journal | bool and 'journal=persistent' not in hs) else [])
          + (['kernel.panic is not ' ~ nova_health_panic_reboot] if ((nova_health_panic_reboot | int) > 0 and ('panic=' ~ nova_health_panic_reboot ~ ' ') not in hs) else [])
          + (['ssh sessions not killable (OOMScoreAdjust is not 0)'] if (nova_health_ssh_killable | bool and health_ssh_unit.rc | default(1) == 0 and 'ssh_oom=0 ' not in hs) else [])
          + (['the user slice has no MemoryMax'] if ((nova_health_user_memory_max_pct | int) > 0 and 'slice_max=infinity' in hs) else []))) }}

- name: the machine is healthy
  ansible.builtin.assert:
    that: health_wrong | length == 0
    fail_msg: "HEALTH FAIL {{ inventory_hostname }}: {{ health_wrong | join('; ') }}"
    quiet: true
