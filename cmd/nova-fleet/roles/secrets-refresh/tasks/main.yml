# The secrets-refresh role (cmd/nova-fleet/secrets-refresh.yml): the machine's copy of the secrets store, kept current.
# The control node puts the store's files at nova_secrets_store over the SSH the play already has (rsync, no .git,
# 0700 directories and 0600 files); this role pushes them when it is given the control node's clone (nova_seal_store),
# and fails when the store is not there. Nothing on the machine fetches the store on a clock: pull mode (a timer
# pulling a git clone) is retired (D8c), nova_secrets_repo is refused, and a timer an earlier run left is removed.
- name: pull mode is retired (nova_secrets_repo)
  ansible.builtin.fail:
    msg: >-
      SECRETS-REFRESH {{ inventory_hostname }} STOP: pull mode (nova_secrets_repo) is retired, since nothing fetches the
      store on a clock; unset nova_secrets_repo: the control node pushes the store (nova-fleet secrets-refresh -- -e
      nova_seal_store=<its clone>, which nova-fleet up runs)
  when: nova_secrets_repo | default('') | length > 0

# without the control node's clone the run would push nothing and pass, which reads as a delivery
- name: a refreshed machine needs the control node's clone (nova_seal_store)
  ansible.builtin.fail:
    msg: >-
      SECRETS-REFRESH {{ inventory_hostname }} STOP: no nova_seal_store, so nothing would be pushed; give the control
      node's clone of the store, run: nova-fleet secrets-refresh -- -e nova_seal_store=<the control node's clone>
  when: nova_seal_store is not defined and (nova_secrets_refresh | bool)

- name: the paths
  ansible.builtin.set_fact:
    sr_script: "{{ nova_bin_dir }}/nova-secrets-refresh"
    sr_label: com.nova.secrets-refresh
    sr_darwin: "{{ (nova_system | default(ansible_facts['system'])) == 'Darwin' }}"
    sr_xdg: "/run/user/{{ ansible_facts['user_uid'] }}"
    sr_user_dir: "{{ nova_home }}/.config/systemd/user"

# ---- no timer on any machine: one left by the retired pull mode is removed ----
- name: the pull timer removed (left by the retired pull mode)
  block:
    - name: the Linux units, stopped and removed
      ansible.builtin.shell: |
        u={{ sr_user_dir }}
        [ -f "$u/nova-secrets-refresh.timer" ] || [ -f "$u/nova-secrets-refresh.service" ] || { echo none; exit 0; }
        {% if not ansible_check_mode %}
        systemctl --user disable --now nova-secrets-refresh.timer >/dev/null 2>&1 || true
        rm -f "$u/nova-secrets-refresh.timer" "$u/nova-secrets-refresh.service"
        systemctl --user daemon-reload >/dev/null 2>&1 || true
        {% endif %}
        echo removed
      args: { executable: /bin/bash }
      environment: { XDG_RUNTIME_DIR: "{{ sr_xdg }}" }
      register: sr_off_linux
      changed_when: sr_off_linux.stdout == 'removed'
      check_mode: false
      when: not sr_darwin

    - name: is there a crontab binary (off)
      ansible.builtin.command: sh -c 'command -v crontab'
      register: sr_off_crontab
      changed_when: false
      failed_when: false
      check_mode: false
      when: not sr_darwin

    - name: the cron line removed
      ansible.builtin.cron: { name: nova-secrets-refresh, state: absent }
      when: not sr_darwin and sr_off_crontab.rc == 0

    - name: the LaunchAgent, unloaded and removed
      ansible.builtin.shell: |
        p={{ nova_home }}/Library/LaunchAgents/{{ sr_label }}.plist
        [ -f "$p" ] || { echo none; exit 0; }
        {% if not ansible_check_mode %}
        launchctl bootout gui/{{ ansible_facts['user_uid'] }}/{{ sr_label }} 2>/dev/null || true
        rm -f "$p"
        {% endif %}
        echo removed
      register: sr_off_darwin
      changed_when: sr_off_darwin.stdout == 'removed'
      check_mode: false
      when: sr_darwin

    - name: the pull script removed
      ansible.builtin.file: { path: "{{ sr_script }}", state: absent }

    - name: the receipt (off)
      ansible.builtin.debug: { msg: "SECRETS-REFRESH {{ inventory_hostname }} off (nova_secrets_refresh false)" }
      when: not (nova_secrets_refresh | bool)

    - name: nothing more here (off)
      ansible.builtin.meta: end_host
      when: not (nova_secrets_refresh | bool)

# ---- push mode: the control node's files, put here; no timer ----
- name: push mode
  block:
    # ---- the refusals, before anything changes ----
    - name: rsync on the machine
      ansible.builtin.command: rsync --version
      register: sr_rsync
      changed_when: false
      failed_when: false
      check_mode: false
      when: nova_seal_store is defined

    - name: rsync is there (join.yml installs it; here it is only checked)
      ansible.builtin.assert:
        that: sr_rsync.rc == 0
        fail_msg: >-
          SECRETS-REFRESH {{ inventory_hostname }} STOP: no rsync on the machine, which the push needs; install it
          (Debian, Ubuntu: sudo apt-get install -y rsync), then run again
        quiet: true
      when: nova_seal_store is defined

    - name: the store path on the machine, as it is
      ansible.builtin.stat: { path: "{{ nova_secrets_store }}" }
      register: sr_dest

    # a symlink here would make the push write through it, somewhere else on the machine
    - name: the store path is a directory, never a symlink
      ansible.builtin.assert:
        that: not (sr_dest.stat.exists and sr_dest.stat.islnk)
        fail_msg: "SECRETS-REFRESH {{ inventory_hostname }} STOP: {{ nova_secrets_store }} is a symlink (to {{ sr_dest.stat.lnk_target | default('?') }}); the store must be a directory of its own: remove the link, then run again"
        quiet: true

    # a symlink in the store would land on every machine pointing wherever it says: the store holds files only
    - name: symlinks in the control node's clone (outside .git)
      ansible.builtin.command:
        argv: [find, "{{ nova_seal_store }}", -path, "{{ nova_seal_store | regex_replace('/*$', '') }}/.git", -prune, -o, -type, l, -print]
      delegate_to: localhost
      become: false
      register: sr_links
      changed_when: false
      check_mode: false
      when: nova_seal_store is defined

    - name: the clone holds no symlink
      ansible.builtin.assert:
        that: sr_links is skipped or sr_links.stdout_lines | length == 0
        fail_msg: "SECRETS-REFRESH STOP: the store clone {{ nova_seal_store | default('') }} holds symlinks, which are never pushed: {{ sr_links.stdout_lines | default([]) | join(', ') }}; remove them, then run again"
        quiet: true

    # the push deletes what the clone lacks: a directory that is not a store would empty every machine's store
    - name: the clone is a secrets store (nova-secrets init writes .sops.yaml and recovery.pub)
      ansible.builtin.stat: { path: "{{ nova_seal_store | regex_replace('/*$', '') }}/{{ item }}" }
      loop: [.sops.yaml, recovery.pub]
      delegate_to: localhost
      become: false
      register: sr_store_files
      when: nova_seal_store is defined

    - name: the clone holds what a store has
      ansible.builtin.assert:
        that: sr_store_files is skipped or sr_store_files.results | rejectattr('stat.exists') | list | length == 0
        fail_msg: >-
          SECRETS-REFRESH STOP: {{ nova_seal_store | default('') }} is not a secrets store (no
          {{ sr_store_files.results | default([]) | rejectattr('stat.exists') | map(attribute='item') | join(', ') }}), and
          pushing it would delete every machine's store; run: nova-fleet secrets-refresh -- -e nova_seal_store=<the
          control node's clone of the store>
        quiet: true

    - name: the store directory (0700)
      ansible.builtin.file: { path: "{{ nova_secrets_store }}", state: directory, mode: "0700" }
      when: nova_seal_store is defined
      register: sr_push_dir

    # the same settings nova-fleet up uses: no .git (one left from pull mode is removed), deletes what the control
    # node's copy lacks, 0700/0600; symlinks are never copied. verify_host keeps ssh's host key check on (synchronize
    # turns it off by default, which no play here ever does). Changed only for a file sent, removed or re-moded, read
    # from rsync's itemized lines (stdout_lines): a directory whose only difference is its time is not a change.
    - name: the store pushed from the control node's clone (nova_seal_store)
      ansible.posix.synchronize:
        src: "{{ nova_seal_store | regex_replace('/*$', '') }}/"
        dest: "{{ nova_secrets_store }}/"
        mode: push
        archive: false
        recursive: true
        links: false
        copy_links: false
        times: true
        perms: true
        delete: true
        verify_host: true
        rsync_opts: ["--exclude=.git", "--delete-excluded", "--chmod=Du=rwx,Dgo=,Fu=rw,Fgo="]
      register: sr_push
      changed_when: >-
        sr_push.stdout_lines | default([]) | select('match', '^(\\*deleting|[<>ch.][fdLDS])') | reject('match', '^\\.d\\.\\.t\\.{6} ') | list | length > 0
      when: nova_seal_store is defined and not (ansible_check_mode and sr_push_dir is changed)

    - name: the files the store holds here
      ansible.builtin.shell: |
        [ -d {{ nova_secrets_store | quote }} ] || { echo missing; exit 0; }
        find {{ nova_secrets_store | quote }} -path '*/.git' -prune -o -type f -print | wc -l | tr -d ' '
      register: sr_files
      changed_when: false
      check_mode: false

    - name: the receipt (push)
      ansible.builtin.debug:
        msg: >-
          SECRETS-REFRESH {{ inventory_hostname }} mode=push
          {{- ' missing' if sr_files.stdout == 'missing' else (' files=' ~ sr_files.stdout) }}
          {{- (' pushed' if (sr_push is changed) else ' same') if nova_seal_store is defined and sr_push is not skipped else '' }}
          {{- ' WOULD-PUSH' if (ansible_check_mode and sr_push_dir is changed) else '' }}
          {{- ' (check: nothing changed)' if ansible_check_mode else '' }}

    - name: the store is here (pushed by the control node; -e nova_seal_store=<its clone> pushes it from this play)
      ansible.builtin.assert:
        that: sr_files.stdout not in ['missing', '0'] or (ansible_check_mode and (sr_push_dir is changed or sr_push is changed))
        fail_msg: >-
          SECRETS-REFRESH {{ inventory_hostname }} mode=push {{ 'missing' if sr_files.stdout == 'missing' else 'empty' }}: no
          store files at {{ nova_secrets_store }}; push them from the control node (-e nova_seal_store=<its clone>)
        quiet: true

