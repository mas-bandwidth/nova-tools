---
# One wanted runner, number runner_index.
- name: this runner's names
  ansible.builtin.set_fact:
    github_runner_dir: "{{ github_runner_base_dir }}/{{ github_runner_slug }}-{{ runner_index }}"
    github_runner_name: "{{ inventory_hostname }}-{{ runner_index }}"
    github_runner_unit: "github-runner-{{ github_runner_slug }}-{{ runner_index }}"
    github_runner_label_id: "github-runner.{{ github_runner_slug }}-{{ runner_index }}"

- name: nothing registered yet for this runner
  ansible.builtin.set_fact:
    github_runner_registration: { changed: false }

- name: the directory
  ansible.builtin.file:
    path: "{{ github_runner_dir }}"
    state: directory
    owner: "{{ github_runner_user if github_runner_other else omit }}"
    group: "{{ github_runner_user if github_runner_other else omit }}"
  become: "{{ github_runner_other }}"
  register: github_runner_made

# a dry run cannot unpack a release the dry run did not download: get_url above reports "would download" and this waits
- name: is the release in the cache
  ansible.builtin.stat:
    path: "{{ github_runner_base_dir }}/.cache/actions-runner-{{ github_runner_os }}-{{ github_runner_arch }}-{{ github_runner_version }}.tar.gz"
  become: "{{ github_runner_other }}"
  register: github_runner_cached

- name: is config.sh there
  ansible.builtin.stat: { path: "{{ github_runner_dir }}/config.sh" }
  become: "{{ github_runner_other }}"
  register: github_runner_config

- name: unpack the runner where config.sh is missing
  ansible.builtin.unarchive:
    src: "{{ github_runner_base_dir }}/.cache/actions-runner-{{ github_runner_os }}-{{ github_runner_arch }}-{{ github_runner_version }}.tar.gz"
    dest: "{{ github_runner_dir }}"
    remote_src: true
    creates: "{{ github_runner_dir }}/config.sh"
    owner: "{{ github_runner_user if github_runner_other else omit }}"
    group: "{{ github_runner_user if github_runner_other else omit }}"
  become: "{{ github_runner_other }}"
  register: github_runner_unpacked
  when: >-
    ansible_facts['system'] != 'Darwin'
    and not github_runner_config.stat.exists
    and not (ansible_check_mode and (github_runner_made is changed or not github_runner_cached.stat.exists))

# macOS ships bsdtar, which the unarchive module has no handler for ("Failed to find handler", mini-m5, 2026-11-07);
# the system tar unpacks the release as it is.
- name: unpack the runner where config.sh is missing (macOS)
  ansible.builtin.command:
    argv:
      - /usr/bin/tar
      - -xzf
      - "{{ github_runner_base_dir }}/.cache/actions-runner-{{ github_runner_os }}-{{ github_runner_arch }}-{{ github_runner_version }}.tar.gz"
      - -C
      - "{{ github_runner_dir }}"
    creates: "{{ github_runner_dir }}/config.sh"
  when: >-
    ansible_facts['system'] == 'Darwin'
    and not github_runner_config.stat.exists
    and not (ansible_check_mode and (github_runner_made is changed or not github_runner_cached.stat.exists))

# the runner's own installer of the system libraries it needs (libicu and the like); once per release on the host
- name: the runner's system dependencies (Linux)
  ansible.builtin.shell: |
    set -eu
    cd "{{ github_runner_dir }}"
    ./bin/installdependencies.sh
    touch "{{ github_runner_base_dir }}/.cache/dependencies-{{ github_runner_version }}"
  args: { executable: /bin/sh, creates: "{{ github_runner_base_dir }}/.cache/dependencies-{{ github_runner_version }}" }
  become: true
  when: >-
    ansible_facts['system'] == 'Linux' and github_runner_install_dependencies | bool
    and not (ansible_check_mode and (github_runner_unpacked is changed or not github_runner_config.stat.exists))

# A runner whose unit runs it from another directory (another login's home: github_runner_user changed) moves here: once
# its job ends its unit is stopped, it registers here under the same name (config.sh --replace), and its old directory
# is deleted once the new unit runs it. A held runner is not moved.
- name: the directory its unit runs it from (Linux)
  ansible.builtin.command: { argv: [systemctl, show, -P, WorkingDirectory, "{{ github_runner_unit }}.service"] }
  register: github_runner_from
  changed_when: false
  failed_when: false
  check_mode: false
  when: ansible_facts['system'] == 'Linux'

- name: where it moves from
  ansible.builtin.set_fact:
    github_runner_old_dir: >-
      {{ github_runner_from.stdout | default('') | trim
         if (github_runner_from.stdout | default('') | trim) != github_runner_dir
            and (github_runner_from.stdout | default('') | trim) is match('^/.+/actions-runner/' ~ (github_runner_dir | basename | regex_escape) ~ '$')
         else '' }}

- name: a moving runner is not held
  ansible.builtin.assert:
    quiet: true
    that: github_runner_old_dir == '' or (github_runner_dir | basename) not in github_runner_hold
    fail_msg: >-
      RUNNER-HELD {{ inventory_hostname }} {{ github_runner_dir | basename }}: it runs from {{ github_runner_old_dir }} and
      moves to {{ github_runner_dir }} (another login), which stops it; run again without it in github_runner_hold

- name: the move, planned
  ansible.builtin.debug:
    msg: >-
      RUNNER-MOVE {{ github_runner_name }} from={{ github_runner_old_dir }} to={{ github_runner_dir }} user={{ github_runner_user }}
      {{ '(check: nothing changed)' if ansible_check_mode else '' }}
  when: github_runner_old_dir != ''

- name: the moving runner's job ends first
  ansible.builtin.include_tasks: wait-idle.yml
  vars: { github_runner_idle_dir: "{{ github_runner_old_dir }}" }
  when: github_runner_old_dir != '' and not ansible_check_mode

- name: the moving runner is stopped where it runs
  ansible.builtin.systemd: { name: "{{ github_runner_unit }}.service", state: stopped }
  become: true
  when: github_runner_old_dir != '' and not ansible_check_mode

- name: register with GitHub
  ansible.builtin.include_tasks: unix-register.yml
  when: runner_index in github_runner_need and not ansible_check_mode

- name: the labels it was registered with
  ansible.builtin.copy:
    content: "{{ github_runner_label_string }}\n"
    dest: "{{ github_runner_dir }}/.labels"
    mode: "0644"
    force: false
    owner: "{{ github_runner_user if github_runner_other else omit }}"
    group: "{{ github_runner_user if github_runner_other else omit }}"
  become: "{{ github_runner_other }}"
  when: github_runner_registration is changed

- name: the labels it holds now
  ansible.builtin.command: cat "{{ github_runner_dir }}/.labels"
  become: "{{ github_runner_other }}"
  register: github_runner_held
  changed_when: false
  failed_when: false
  check_mode: false

# A registered runner keeps its registration: a wanted label it lacks is added in GitHub (no config.sh, so it keeps its
# session and the jobs queued for it), and a label it holds beyond the wanted is reported and kept. With no record of
# its labels (no .labels: registered before the file, or the file lost), GitHub's list is the record. Labels compare
# without case, as GitHub matches them: its own Linux, X64 and ARM64 are the wanted linux and arm64.
- name: the labels it lacks, by its record
  ansible.builtin.set_fact:
    github_runner_lacks: >-
      {{ github_runner_wanted | difference(github_runner_recorded) if github_runner_held.rc == 0 else github_runner_wanted }}
    github_runner_extra: >-
      {{ github_runner_recorded | difference(github_runner_wanted) if github_runner_held.rc == 0 else [] }}
  vars:
    github_runner_wanted: "{{ github_runner_label_string | lower | split(',') | select | list }}"
    github_runner_recorded: "{{ github_runner_held.stdout | default('') | trim | lower | split(',') | select | list }}"

- name: the labels it lacks, planned
  ansible.builtin.debug:
    msg: >-
      LABEL-PLAN {{ github_runner_name }}: {{ ('lacks ' ~ (github_runner_lacks | join(','))) if github_runner_held.rc == 0
      else ('no record of its labels (no ' ~ github_runner_dir ~ '/.labels); a run reads them from GitHub') }};
      a run adds what it lacks in GitHub, without re-registering (check: nothing changed)
  when: ansible_check_mode and github_runner_lacks | length > 0 and runner_index not in github_runner_need

- name: a registered runner that lacks a wanted label gets it in GitHub
  when: github_runner_lacks | length > 0 and runner_index not in github_runner_need and not ansible_check_mode
  block:
    - name: the runner as GitHub lists it
      ansible.builtin.command:
        argv:
          - "{{ github_runner_gh }}"
          - api
          - "{{ 'orgs' if github_runner_scope == 'org' else 'repos' }}/{{ github_runner_path }}/actions/runners?name={{ github_runner_name | urlencode }}"
      delegate_to: localhost
      become: false
      register: github_runner_entry
      changed_when: false
      failed_when: false

    - name: the runner's id and labels in GitHub
      ansible.builtin.set_fact:
        github_runner_gh_entry: >-
          {{ ((github_runner_entry.stdout | from_json).runners | default([]) | selectattr('name', 'equalto', github_runner_name) | list)
             if github_runner_entry.rc | default(1) == 0 else [] }}

    - name: GitHub's entry for it was read
      ansible.builtin.assert:
        quiet: true
        that: github_runner_entry.rc | default(1) == 0 and github_runner_gh_entry | length == 1
        fail_msg: >-
          {{ github_runner_name }}: {{ ('gh api on the control node failed, rc=' ~ (github_runner_entry.rc | default('-')) ~ ': '
          ~ (github_runner_entry.stderr | default(github_runner_entry.msg | default('')) | trim))
          if github_runner_entry.rc | default(1) != 0 else 'GitHub lists no runner of that name' }}; its labels were not changed;
          check: {{ github_runner_gh }} api {{ 'orgs' if github_runner_scope == 'org' else 'repos' }}/{{ github_runner_path }}/actions/runners

    - name: the labels it lacks, added in GitHub
      ansible.builtin.command:
        argv:
          - "{{ github_runner_gh }}"
          - api
          - -X
          - POST
          - "{{ 'orgs' if github_runner_scope == 'org' else 'repos' }}/{{ github_runner_path }}/actions/runners/{{ github_runner_gh_entry[0].id }}/labels"
          - --input
          - "-"
        stdin: "{{ {'labels': github_runner_gh_adds} | to_json }}"
      delegate_to: localhost
      become: false
      register: github_runner_relabel
      when: github_runner_gh_adds | length > 0

    - name: the labels it holds now, recorded
      ansible.builtin.copy:
        content: "{{ github_runner_gh_holds | join(',') }}\n"
        dest: "{{ github_runner_dir }}/.labels"
        mode: "0644"
        owner: "{{ github_runner_user if github_runner_other else omit }}"
        group: "{{ github_runner_user if github_runner_other else omit }}"
      become: "{{ github_runner_other }}"

    - name: the labels it was given
      ansible.builtin.debug:
        msg: LABEL-ADD {{ github_runner_name }} added={{ github_runner_gh_adds | join(',') or '-' }} labels={{ github_runner_gh_holds | join(',') }}
  vars:
    github_runner_wanted: "{{ github_runner_label_string | lower | split(',') | select | list }}"
    # every label GitHub gives it (its own self-hosted, Linux, X64 too), lower-cased; the record keeps the custom ones
    github_runner_gh_all: >-
      {{ github_runner_gh_entry[0].labels | default([]) | map(attribute='name') | map('lower') | list
         if github_runner_gh_entry | default([]) | length == 1 else [] }}
    github_runner_gh_custom: >-
      {{ github_runner_gh_entry[0].labels | default([]) | selectattr('type', 'equalto', 'custom') | map(attribute='name') | map('lower') | list
         if github_runner_gh_entry | default([]) | length == 1 else [] }}
    github_runner_gh_adds: "{{ github_runner_wanted | difference(github_runner_gh_all) }}"
    github_runner_gh_holds: "{{ (github_runner_gh_custom + github_runner_wanted) | unique | sort }}"

- name: labels it holds beyond the wanted are reported, and kept
  ansible.builtin.debug:
    msg: >-
      LABEL-EXTRA {{ github_runner_name }}: holds {{ github_runner_extra | join(',') }} beyond the wanted
      {{ github_runner_label_string }}; kept (pass them in github_runner_labels, or retire it with
      -e github_runner_state=absent and converge again to drop them)
  when: github_runner_extra | length > 0

# ---- Linux: a systemd system unit run as the login, enabled at boot ----
- name: the unit (Linux)
  ansible.builtin.template:
    src: runner.service.j2
    dest: "/etc/systemd/system/{{ github_runner_unit }}.service"
    owner: root
    group: root
    mode: "0644"
  become: "{{ not ansible_check_mode }}"
  register: github_runner_unit_file
  when: ansible_facts['system'] == 'Linux'

# The unit is the whole of the service: a drop-in beside it (a hand-made <unit>.service.d) would override the record's
# environment, so it is removed and the unit read again.
- name: no drop-in beside the unit (Linux)
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ github_runner_unit }}.service.d"
    state: absent
  become: "{{ not ansible_check_mode }}"
  register: github_runner_dropins
  when: ansible_facts['system'] == 'Linux'

# A held runner (github_runner_hold names its directory) keeps running what it runs: its changed unit or daemon file is
# written, and nothing waits on it or restarts it; the run says RUNNER-HELD and the restart is owed to a later run.
- name: a held runner is not waited on or restarted (Linux)
  ansible.builtin.debug:
    msg: "RUNNER-HELD {{ inventory_hostname }} {{ github_runner_dir | basename }}: its file changed; the restart is owed to a later run"
  when: >-
    ansible_facts['system'] == 'Linux' and not ansible_check_mode and (github_runner_dir | basename) in github_runner_hold
    and (github_runner_unit_file is changed or github_runner_dropins is changed)

- name: the job it is running ends before the changed unit restarts it (Linux)
  ansible.builtin.include_tasks: wait-idle.yml
  when: >-
    ansible_facts['system'] == 'Linux' and not ansible_check_mode
    and (github_runner_unit_file is changed or github_runner_dropins is changed) and runner_index not in github_runner_need
    and (github_runner_dir | basename) not in github_runner_hold

- name: systemd reads the unit (Linux)
  ansible.builtin.systemd: { daemon_reload: true }
  become: true
  when: >-
    ansible_facts['system'] == 'Linux' and not ansible_check_mode
    and (github_runner_unit_file is changed or github_runner_dropins is changed)

- name: the service is enabled at boot and running (Linux)
  ansible.builtin.systemd:
    name: "{{ github_runner_unit }}.service"
    enabled: true
    state: >-
      {{ 'restarted' if ((github_runner_unit_file is changed or github_runner_dropins is changed)
      and (github_runner_dir | basename) not in github_runner_hold) else 'started' }}
  become: true
  when: ansible_facts['system'] == 'Linux' and not (ansible_check_mode and github_runner_unit_file is changed)

# its registration there was replaced by the one here; root, as the CI rules leave <dir>/.nova-ci-rules owned by root
- name: the moved runner's old directory is deleted (Linux)
  ansible.builtin.file: { path: "{{ github_runner_old_dir }}", state: absent }
  become: true
  when: github_runner_old_dir != '' and not ansible_check_mode

# ---- macOS: a system LaunchDaemon dropped to the login, started at boot with nobody logged in (a LaunchAgent would
# run only inside a logged-in GUI session, and a CI machine comes back from a reboot with none). Only a run needs
# sudo: /Library/LaunchDaemons is world-readable, so --check reads and diffs the file as the login. ----
- name: the daemon file (macOS)
  ansible.builtin.template:
    src: runner.plist.j2
    dest: "/Library/LaunchDaemons/{{ github_runner_label_id }}.plist"
    owner: root
    group: wheel
    mode: "0644"
  become: "{{ not ansible_check_mode }}"
  register: github_runner_unit_file
  when: ansible_facts['system'] == 'Darwin'

- name: the log directory (macOS)
  ansible.builtin.file: { path: "{{ github_runner_dir }}/_diag", state: directory }
  when: ansible_facts['system'] == 'Darwin' and not (ansible_check_mode and github_runner_made is changed)

- name: is the daemon loaded (macOS)
  ansible.builtin.command: "launchctl print system/{{ github_runner_label_id }}"
  become: "{{ not ansible_check_mode }}"
  register: github_runner_loaded
  changed_when: false
  failed_when: false
  check_mode: false
  when: ansible_facts['system'] == 'Darwin'

- name: a held runner is not waited on or reloaded (macOS)
  ansible.builtin.debug:
    msg: "RUNNER-HELD {{ inventory_hostname }} {{ github_runner_dir | basename }}: its file changed; the reload is owed to a later run"
  when: >-
    ansible_facts['system'] == 'Darwin' and not ansible_check_mode and github_runner_loaded.rc == 0
    and github_runner_unit_file is changed and (github_runner_dir | basename) in github_runner_hold

- name: the job it is running ends before the changed daemon reloads it (macOS)
  ansible.builtin.include_tasks: wait-idle.yml
  when: >-
    ansible_facts['system'] == 'Darwin' and not ansible_check_mode
    and github_runner_loaded.rc == 0 and github_runner_unit_file is changed
    and (github_runner_dir | basename) not in github_runner_hold

- name: load the daemon, or reload it where its file changed (macOS)
  ansible.builtin.shell: |
    set -eu
    l=system/{{ github_runner_label_id }}
    if launchctl print "$l" >/dev/null 2>&1; then
      launchctl bootout "$l"
      for n in $(seq 1 50); do launchctl print "$l" >/dev/null 2>&1 || break; sleep 0.2; done
    fi
    launchctl bootstrap system "/Library/LaunchDaemons/{{ github_runner_label_id }}.plist"
    echo BOOTSTRAPPED
  args: { executable: /bin/sh }
  become: "{{ not ansible_check_mode }}"
  register: github_runner_boot
  changed_when: "'BOOTSTRAPPED' in github_runner_boot.stdout"
  when: >-
    ansible_facts['system'] == 'Darwin' and (github_runner_loaded.rc != 0
    or (github_runner_unit_file is changed and (github_runner_dir | basename) not in github_runner_hold))
