---
# One wanted runner, number runner_index.
- name: this runner's names
  ansible.builtin.set_fact:
    github_runner_dir: "{{ github_runner_base_dir }}/{{ github_runner_slug }}-{{ runner_index }}"
    github_runner_name: "{{ inventory_hostname }}-{{ runner_index }}"
    github_runner_unit: "github-runner-{{ github_runner_slug }}-{{ runner_index }}"
    github_runner_label_id: "github-runner.{{ github_runner_slug }}-{{ runner_index }}"

- name: nothing registered yet for this runner
  ansible.builtin.set_fact:
    github_runner_registration: { changed: false }

- name: the directory
  ansible.builtin.file: { path: "{{ github_runner_dir }}", state: directory }
  register: github_runner_made

# a dry run cannot unpack a release the dry run did not download: get_url above reports "would download" and this waits
- name: is the release in the cache
  ansible.builtin.stat:
    path: "{{ github_runner_base_dir }}/.cache/actions-runner-{{ github_runner_os }}-{{ github_runner_arch }}-{{ github_runner_version }}.tar.gz"
  register: github_runner_cached

- name: is config.sh there
  ansible.builtin.stat: { path: "{{ github_runner_dir }}/config.sh" }
  register: github_runner_config

- name: unpack the runner where config.sh is missing
  ansible.builtin.unarchive:
    src: "{{ github_runner_base_dir }}/.cache/actions-runner-{{ github_runner_os }}-{{ github_runner_arch }}-{{ github_runner_version }}.tar.gz"
    dest: "{{ github_runner_dir }}"
    remote_src: true
    creates: "{{ github_runner_dir }}/config.sh"
  register: github_runner_unpacked
  when: >-
    ansible_facts['system'] != 'Darwin'
    and not github_runner_config.stat.exists
    and not (ansible_check_mode and (github_runner_made is changed or not github_runner_cached.stat.exists))

# macOS ships bsdtar, which the unarchive module has no handler for ("Failed to find handler", mini-m5, 2026-11-07);
# the system tar unpacks the release as it is.
- name: unpack the runner where config.sh is missing (macOS)
  ansible.builtin.command:
    argv:
      - /usr/bin/tar
      - -xzf
      - "{{ github_runner_base_dir }}/.cache/actions-runner-{{ github_runner_os }}-{{ github_runner_arch }}-{{ github_runner_version }}.tar.gz"
      - -C
      - "{{ github_runner_dir }}"
    creates: "{{ github_runner_dir }}/config.sh"
  when: >-
    ansible_facts['system'] == 'Darwin'
    and not github_runner_config.stat.exists
    and not (ansible_check_mode and (github_runner_made is changed or not github_runner_cached.stat.exists))

# the runner's own installer of the system libraries it needs (libicu and the like); once per release on the host
- name: the runner's system dependencies (Linux)
  ansible.builtin.shell: |
    set -eu
    cd "{{ github_runner_dir }}"
    ./bin/installdependencies.sh
    touch "{{ github_runner_base_dir }}/.cache/dependencies-{{ github_runner_version }}"
  args: { executable: /bin/sh, creates: "{{ github_runner_base_dir }}/.cache/dependencies-{{ github_runner_version }}" }
  become: true
  when: >-
    ansible_facts['system'] == 'Linux' and github_runner_install_dependencies | bool
    and not (ansible_check_mode and (github_runner_unpacked is changed or not github_runner_config.stat.exists))

- name: register with GitHub
  ansible.builtin.include_tasks: unix-register.yml
  when: runner_index in github_runner_need and not ansible_check_mode

- name: the labels it was registered with
  ansible.builtin.copy:
    content: "{{ github_runner_label_string }}\n"
    dest: "{{ github_runner_dir }}/.labels"
    mode: "0644"
    force: false
  when: github_runner_registration is changed

- name: the labels it holds now
  ansible.builtin.command: cat "{{ github_runner_dir }}/.labels"
  register: github_runner_held
  changed_when: false
  failed_when: false
  check_mode: false

# A registered runner keeps its registration: a wanted label it lacks is added in GitHub (no config.sh, so it keeps its
# session and the jobs queued for it), and a label it holds beyond the wanted is reported and kept. With no record of
# its labels (no .labels: registered before the file, or the file lost), GitHub's list is the record.
- name: the labels it lacks, by its record
  ansible.builtin.set_fact:
    github_runner_lacks: >-
      {{ github_runner_label_string.split(',') | difference((github_runner_held.stdout | trim).split(','))
         if github_runner_held.rc == 0 else github_runner_label_string.split(',') }}
    github_runner_extra: >-
      {{ (github_runner_held.stdout | trim).split(',') | difference(github_runner_label_string.split(','))
         if github_runner_held.rc == 0 else [] }}

- name: the labels it lacks, planned
  ansible.builtin.debug:
    msg: >-
      LABEL-PLAN {{ github_runner_name }}: {{ ('lacks ' ~ (github_runner_lacks | join(','))) if github_runner_held.rc == 0
      else ('no record of its labels (no ' ~ github_runner_dir ~ '/.labels); a run reads them from GitHub') }};
      a run adds what it lacks in GitHub, without re-registering (check: nothing changed)
  when: ansible_check_mode and github_runner_lacks | length > 0 and runner_index not in github_runner_need

- name: a registered runner that lacks a wanted label gets it in GitHub
  when: github_runner_lacks | length > 0 and runner_index not in github_runner_need and not ansible_check_mode
  block:
    - name: the runner as GitHub lists it
      ansible.builtin.command:
        argv:
          - "{{ github_runner_gh }}"
          - api
          - "{{ 'orgs' if github_runner_scope == 'org' else 'repos' }}/{{ github_runner_path }}/actions/runners?name={{ github_runner_name | urlencode }}"
      delegate_to: localhost
      become: false
      register: github_runner_entry
      changed_when: false
      failed_when: false

    - name: the runner's id and custom labels in GitHub
      ansible.builtin.set_fact:
        github_runner_gh_entry: >-
          {{ ((github_runner_entry.stdout | from_json).runners | default([]) | selectattr('name', 'equalto', github_runner_name) | list)
             if github_runner_entry.rc == 0 else [] }}

    - name: GitHub's entry for it was read
      ansible.builtin.assert:
        quiet: true
        that: github_runner_entry.rc == 0 and github_runner_gh_entry | length == 1
        fail_msg: >-
          {{ github_runner_name }}: {{ ('gh api on the control node failed, rc=' ~ github_runner_entry.rc ~ ': ' ~ (github_runner_entry.stderr | trim))
          if github_runner_entry.rc != 0 else 'GitHub lists no runner of that name' }}; its labels were not changed;
          check: {{ github_runner_gh }} api {{ 'orgs' if github_runner_scope == 'org' else 'repos' }}/{{ github_runner_path }}/actions/runners

    - name: the labels it lacks, added in GitHub
      ansible.builtin.command:
        argv:
          - "{{ github_runner_gh }}"
          - api
          - -X
          - POST
          - "{{ 'orgs' if github_runner_scope == 'org' else 'repos' }}/{{ github_runner_path }}/actions/runners/{{ github_runner_gh_entry[0].id }}/labels"
          - --input
          - "-"
        stdin: "{{ {'labels': github_runner_label_string.split(',') | difference(github_runner_gh_labels)} | to_json }}"
      delegate_to: localhost
      become: false
      register: github_runner_relabel
      when: github_runner_label_string.split(',') | difference(github_runner_gh_labels) | length > 0

    - name: the labels it holds now, recorded
      ansible.builtin.copy:
        content: "{{ (github_runner_gh_labels + github_runner_label_string.split(',')) | unique | sort | join(',') }}\n"
        dest: "{{ github_runner_dir }}/.labels"
        mode: "0644"

    - name: the labels it was given
      ansible.builtin.debug:
        msg: >-
          LABEL-ADD {{ github_runner_name }} added={{ github_runner_label_string.split(',') | difference(github_runner_gh_labels) | join(',') or '-' }}
          labels={{ (github_runner_gh_labels + github_runner_label_string.split(',')) | unique | sort | join(',') }}
  vars:
    github_runner_gh_labels: >-
      {{ github_runner_gh_entry[0].labels | default([]) | selectattr('type', 'equalto', 'custom') | map(attribute='name') | list
         if github_runner_gh_entry | default([]) | length == 1 else [] }}

- name: labels it holds beyond the wanted are reported, and kept
  ansible.builtin.debug:
    msg: >-
      LABEL-EXTRA {{ github_runner_name }}: holds {{ github_runner_extra | join(',') }} beyond the wanted
      {{ github_runner_label_string }}; kept (pass them in github_runner_labels, or retire it with
      -e github_runner_state=absent and converge again to drop them)
  when: github_runner_extra | length > 0

# ---- Linux: a systemd system unit run as the login, enabled at boot ----
- name: the unit (Linux)
  ansible.builtin.template:
    src: runner.service.j2
    dest: "/etc/systemd/system/{{ github_runner_unit }}.service"
    owner: root
    group: root
    mode: "0644"
  become: "{{ not ansible_check_mode }}"
  register: github_runner_unit_file
  when: ansible_facts['system'] == 'Linux'

- name: systemd reads the unit (Linux)
  ansible.builtin.systemd: { daemon_reload: true }
  become: true
  when: ansible_facts['system'] == 'Linux' and github_runner_unit_file is changed and not ansible_check_mode

- name: the service is enabled at boot and running (Linux)
  ansible.builtin.systemd:
    name: "{{ github_runner_unit }}.service"
    enabled: true
    state: "{{ 'restarted' if github_runner_unit_file is changed else 'started' }}"
  become: true
  when: ansible_facts['system'] == 'Linux' and not (ansible_check_mode and github_runner_unit_file is changed)

# ---- macOS: a system LaunchDaemon dropped to the login, started at boot with nobody logged in (a LaunchAgent would
# run only inside a logged-in GUI session, and a CI machine comes back from a reboot with none). Only a run needs
# sudo: /Library/LaunchDaemons is world-readable, so --check reads and diffs the file as the login. ----
- name: the daemon file (macOS)
  ansible.builtin.template:
    src: runner.plist.j2
    dest: "/Library/LaunchDaemons/{{ github_runner_label_id }}.plist"
    owner: root
    group: wheel
    mode: "0644"
  become: "{{ not ansible_check_mode }}"
  register: github_runner_unit_file
  when: ansible_facts['system'] == 'Darwin'

- name: the log directory (macOS)
  ansible.builtin.file: { path: "{{ github_runner_dir }}/_diag", state: directory }
  when: ansible_facts['system'] == 'Darwin' and not (ansible_check_mode and github_runner_made is changed)

- name: is the daemon loaded (macOS)
  ansible.builtin.command: "launchctl print system/{{ github_runner_label_id }}"
  become: "{{ not ansible_check_mode }}"
  register: github_runner_loaded
  changed_when: false
  failed_when: false
  check_mode: false
  when: ansible_facts['system'] == 'Darwin'

- name: load the daemon, or reload it where its file changed (macOS)
  ansible.builtin.shell: |
    set -eu
    l=system/{{ github_runner_label_id }}
    if launchctl print "$l" >/dev/null 2>&1; then
      launchctl bootout "$l"
      for n in $(seq 1 50); do launchctl print "$l" >/dev/null 2>&1 || break; sleep 0.2; done
    fi
    launchctl bootstrap system "/Library/LaunchDaemons/{{ github_runner_label_id }}.plist"
    echo BOOTSTRAPPED
  args: { executable: /bin/sh }
  become: "{{ not ansible_check_mode }}"
  register: github_runner_boot
  changed_when: "'BOOTSTRAPPED' in github_runner_boot.stdout"
  when: ansible_facts['system'] == 'Darwin' and (github_runner_loaded.rc != 0 or github_runner_unit_file is changed)
