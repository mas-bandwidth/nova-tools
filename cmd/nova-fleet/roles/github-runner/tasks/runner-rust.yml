---
# Rust for one runner of a runner login of its own: its own RUSTUP_HOME and CARGO_HOME (github_runner_rustup_home,
# github_runner_cargo_home: <login home>/.rust-homes/<runner>/rustup and .../cargo; its unit sets both, whatever the
# record's runner_env names), because a job's `rustup toolchain install` (dtolnay/rust-toolchain on a self-hosted
# runner) writes into the rustup home it is given, and two runners of one login writing one home at once race (rustup
# has no lock: schema rust-strict, 2026-11-14). One runner runs one job at a time, so its home has one writer.
#
# The pinned toolchains stay on the shared path: each is a link in the runner's toolchains/ to the shared one, with its
# update hash copied, so an install of a pinned name finds it current and writes nothing there; the runner's settings
# are the shared ones (the pinned default, self-update off) while its default names no toolchain it holds; and its
# cargo/bin holds a link to each of the shared cargo/bin's entries (the rustup proxies, which read RUSTUP_HOME, and the
# cargo tools). A link naming another target is pointed at the current one, a dangling one is removed, and a real file
# or directory a job put there is left as it is. The shared home is the one <shared>/sdk/bin/rustup names
# (`rustup show home`).
- name: this runner's rustup home names the shared toolchains
  ansible.builtin.shell: |
    set -eu
    shared_rustup={{ (nova_shared_dir ~ '/sdk/bin/rustup') | quote }}
    [ -x "$shared_rustup" ] || { echo NONE; exit 0; }
    src=$(env -u RUSTUP_HOME -u CARGO_HOME "$shared_rustup" show home)
    [ -d "$src/toolchains" ] && [ -d "$src/cargo/bin" ] || { echo "the shared rustup home $src has no toolchains/ or cargo/bin/" >&2; exit 1; }
    rh={{ github_runner_rustup_home | quote }}
    ch={{ github_runner_cargo_home | quote }}
    mkdir -p "$rh/toolchains" "$rh/update-hashes" "$ch/bin"
    set=
    for t in "$src"/toolchains/*; do
      [ -d "$t" ] || continue
      n=${t##*/}
      l="$rh/toolchains/$n"
      if [ -e "$l" ] && [ ! -L "$l" ]; then continue; fi
      if [ "$(readlink "$l")" != "$t" ]; then ln -sfn "$t" "$l"; set=1; fi
      if [ -f "$src/update-hashes/$n" ] && ! cmp -s "$src/update-hashes/$n" "$rh/update-hashes/$n"; then
        cp "$src/update-hashes/$n" "$rh/update-hashes/$n"; set=1
      fi
    done
    for l in "$rh"/toolchains/* "$ch"/bin/*; do
      if [ -L "$l" ] && [ ! -e "$l" ]; then rm -f "$l"; set=1; fi
    done
    d=; found=
    [ ! -f "$rh/settings.toml" ] || d=$(sed -n 's/^default_toolchain = "\(.*\)"$/\1/p' "$rh/settings.toml")
    if [ -n "$d" ]; then
      for x in "$rh/toolchains/$d" "$rh/toolchains/$d"-*; do
        if [ -e "$x" ]; then found=1; fi
      done
    fi
    if [ -f "$src/settings.toml" ] && [ -z "$found" ]; then cp "$src/settings.toml" "$rh/settings.toml"; set=1; fi
    for f in "$src"/cargo/bin/*; do
      [ -e "$f" ] || continue
      b="$ch/bin/${f##*/}"
      if [ -e "$b" ] && [ ! -L "$b" ]; then continue; fi
      if [ "$(readlink "$b")" != "$f" ]; then ln -sfn "$f" "$b"; set=1; fi
    done
    [ -z "$set" ] || echo SET
  args: { executable: /bin/sh }
  become: true
  become_user: "{{ github_runner_user }}"
  vars: { ansible_pipelining: true }
  register: github_runner_rustup
  changed_when: "'SET' in github_runner_rustup.stdout"

# A job's dtolnay/rust-toolchain installs the stable channel with the minimal profile (no clippy, no rustfmt) and makes
# it the default, so every later job on this runner resolves cargo to it and `cargo clippy` / `cargo fmt` fail. The
# channel (github_runner_rust_channel) is kept whole in the runner's home: installed with its components when absent,
# given the ones it lacks when a job installed it. The default is not touched (the pinned one stays until a job names
# another), and a later job's install of the channel is an update, which keeps them.
- name: this runner's {{ github_runner_rust_channel }} toolchain carries {{ github_runner_rust_channel_components | join(' and ') }}
  ansible.builtin.shell: |
    set -eu
    PATH={{ (nova_shared_dir ~ '/sdk/bin') | quote }}:$PATH
    RUSTUP_HOME={{ github_runner_rustup_home | quote }}
    CARGO_HOME={{ github_runner_cargo_home | quote }}
    export PATH RUSTUP_HOME CARGO_HOME
    command -v rustup >/dev/null || { echo NONE; exit 0; }
    cd "$RUSTUP_HOME"
    ch={{ github_runner_rust_channel | quote }}
    if ! rustup toolchain list | grep -q "^$ch-"; then
      rustup toolchain install "$ch" --profile minimal --no-self-update{% for c in github_runner_rust_channel_components %} --component {{ c | quote }}{% endfor %}

      echo SET; exit 0
    fi
    have=$(rustup component list --installed --toolchain "$ch")
    want=
    for c in {{ github_runner_rust_channel_components | map('quote') | join(' ') }}; do
      echo "$have" | grep -q "^$c-" || want="$want $c"
    done
    [ -z "$want" ] && exit 0
    rustup component add --toolchain "$ch" $want
    echo SET
  args: { executable: /bin/sh }
  become: true
  become_user: "{{ github_runner_user }}"
  vars: { ansible_pipelining: true }
  register: github_runner_rust_channel_whole
  changed_when: "'SET' in github_runner_rust_channel_whole.stdout"
