---
# The stage directory on a plain Windows host (github_runner_win_native: its record's os is windows, reached over its
# OpenSSH as an administrator): what tasks/wsl-stage.yml does on a WSL machine, with ansible.windows modules in place of
# interop. The same files/stage-check.ps1, handed to powershell.exe as -EncodedCommand (never staged itself), makes
# github_runner_wsl_stage_dir sealed where it is missing, and proves it and each staged script's sha256 (the role's own
# files on the control node). The scripts are staged with win_copy. win_command cannot join two programs with &&, so
# each elevated call on such a host is the task straight after a task that runs github_runner_win_stage_check_argv
# (a refusal fails that task and the call never runs); the directory it proved is one only SYSTEM and Administrators
# can change, so nothing an ordinary account runs between the two can change what it proved. Staged once per run;
# --check skips it, as it skips every elevated call.

- name: the scripts, staged once per run (plain Windows host)
  when: not (github_runner_win_staged | default(false))
  block:
    - name: the staged scripts' sha256, from the role's own files (plain Windows host)
      ansible.builtin.stat:
        path: "{{ role_path }}/files/{{ item }}"
        checksum_algorithm: sha256
        get_checksum: true
      delegate_to: localhost
      become: false
      loop: [runner-windows.ps1, ci-rules/nova-ci-rules.ps1, ci-rules/job-started.ps1, ci-rules/job-completed.ps1]
      register: github_runner_win_stage_stat

    - name: the stage check, made once for this run (plain Windows host)
      ansible.builtin.set_fact:
        github_runner_win_stage_body: "{{ lookup('ansible.builtin.file', 'stage-check.ps1') }}"
        github_runner_win_stage_names: "{{ github_runner_win_stage_stat.results | map(attribute='item') | map('basename') | list }}"
        github_runner_win_stage_shas: "{{ github_runner_win_stage_stat.results | map(attribute='stat.checksum') | list }}"

    - name: the stage check, as argument lists (plain Windows host)
      ansible.builtin.set_fact:
        # create the directory sealed where it is missing, then prove it (no file named yet)
        github_runner_win_stage_make_argv: >-
          {{ ['powershell.exe', '-NoProfile', '-NonInteractive', '-NoLogo', '-EncodedCommand',
              ("$Make = $true; $Stage = '" ~ github_runner_wsl_stage_dir ~ "'; $Names = @(); $Shas = @(); " ~ github_runner_win_stage_body)
              | b64encode(encoding='utf-16-le')] }}
        # prove it and every staged script, before each elevated call
        github_runner_win_stage_check_argv: >-
          {{ ['powershell.exe', '-NoProfile', '-NonInteractive', '-NoLogo', '-EncodedCommand',
              ("$Make = $false; $Stage = '" ~ github_runner_wsl_stage_dir ~ "'; $Names = @('" ~ (github_runner_win_stage_names | join("', '"))
               ~ "'); $Shas = @('" ~ (github_runner_win_stage_shas | join("', '")) ~ "'); " ~ github_runner_win_stage_body)
              | b64encode(encoding='utf-16-le')] }}

    - name: the stage directory, made sealed and proved (plain Windows host)
      ansible.windows.win_command: { argv: "{{ github_runner_win_stage_make_argv }}" }
      register: github_runner_win_stage_made
      changed_when: github_runner_win_stage_made.stdout is search(' made')
      when: not ansible_check_mode

    - name: the scripts, staged (plain Windows host)
      ansible.windows.win_copy: { src: "{{ item }}", dest: "{{ github_runner_wsl_stage_dir }}\\{{ item | basename }}" }
      loop: [runner-windows.ps1, ci-rules/nova-ci-rules.ps1, ci-rules/job-started.ps1, ci-rules/job-completed.ps1]
      when: not ansible_check_mode

    - name: the staged scripts, proved (plain Windows host)
      ansible.windows.win_command: { argv: "{{ github_runner_win_stage_check_argv }}" }
      changed_when: false
      when: not ansible_check_mode

    - name: staged for this run (plain Windows host)
      ansible.builtin.set_fact: { github_runner_win_staged: true }
      when: not ansible_check_mode
