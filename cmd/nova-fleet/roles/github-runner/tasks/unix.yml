---
# Linux (WSL2 too) and macOS. Everything under the runner login's home runs as the login when the runners are the
# login's; the service files and the dependency install are the only things done with become. A runner login of its
# own (github_runner_other, Linux) has its home read and written as that login (become_user), never as root: root
# follows the links a runner login can plant there. Root only deletes there, by name (remove-dir.yml).

- name: is there a runner base directory yet
  ansible.builtin.stat: { path: "{{ github_runner_base_dir }}" }
  become: "{{ github_runner_other }}"
  become_user: "{{ github_runner_user }}"
  vars: { ansible_pipelining: true }
  register: github_runner_base

- name: the runner directories that exist for this url
  when: github_runner_base.stat.isdir | default(false)
  ansible.builtin.find:
    paths: "{{ github_runner_base_dir }}"
    patterns: "^{{ github_runner_slug | regex_escape }}-[0-9]+$"
    use_regex: true
    file_type: directory
    recurse: false
  become: "{{ github_runner_other }}"
  become_user: "{{ github_runner_user }}"
  vars: { ansible_pipelining: true }
  register: github_runner_found

# A unit can run a runner from another login's home (before a move to github_runner_user), where the find above does
# not look: the units count too, so a runner above the count is retired wherever it runs.
- name: the runner units for this url (Linux)
  ansible.builtin.command:
    argv: [systemctl, list-unit-files, --no-legend, --plain, "github-runner-{{ github_runner_slug }}-*.service"]
  register: github_runner_units
  changed_when: false
  failed_when: false
  check_mode: false
  when: ansible_facts['system'] == 'Linux'

- name: the runners to retire (above the count, or all of them when absent)
  ansible.builtin.set_fact:
    github_runner_retire: >-
      {{ ((github_runner_found.files | default([])) | map(attribute='path') | map('basename')
          | map('regex_replace', '^.*-([0-9]+)$', '\1') | list
          + (github_runner_units.stdout_lines | default([]) | map('split') | map('first')
          | select('match', '^github-runner-' ~ (github_runner_slug | regex_escape) ~ '-[0-9]+\.service$')
          | map('regex_replace', '^.*-([0-9]+)\.service$', '\1') | list))
         | map('int') | unique | difference(github_runner_want) | sort | reverse | list }}

- name: which of the wanted runners are registered
  ansible.builtin.stat:
    path: "{{ github_runner_base_dir }}/{{ github_runner_slug }}-{{ item }}/.runner"
  loop: "{{ github_runner_want }}"
  become: "{{ github_runner_other }}"
  become_user: "{{ github_runner_user }}"
  vars: { ansible_pipelining: true }
  register: github_runner_registered

# A wanted runner not registered here whose unit runs it from another login's directory (github_runner_user changed)
# keeps its registration: the files that hold it (.runner, .credentials, .credentials_rsaparams) move here with it,
# root copying them for the login (unix-runner.yml), so it needs no registration token and keeps its name, id and
# labels in GitHub. Root reads them: the other login's home is closed to this one.
- name: the runners moving here with their registration (Linux)
  ansible.builtin.shell: |
    set -eu
    for i in {{ github_runner_unregistered | map('string') | join(' ') }}; do
      d=$(systemctl show -P WorkingDirectory "github-runner-{{ github_runner_slug }}-$i.service" 2>/dev/null) || continue
      case "$d" in
        {{ github_runner_base_dir | quote }}/*) continue ;;
        /*/actions-runner/{{ github_runner_slug }}-"$i") ;;
        *) continue ;;
      esac
      if [ -f "$d/.runner" ] && [ -f "$d/.credentials" ] && [ -f "$d/.credentials_rsaparams" ]; then echo "$i"; fi
    done
  args: { executable: /bin/sh }
  become: true
  register: github_runner_carried
  changed_when: false
  check_mode: false
  vars:
    github_runner_unregistered: "{{ github_runner_registered.results | rejectattr('stat.exists') | map(attribute='item') | list }}"
  when: ansible_facts['system'] == 'Linux' and github_runner_other | bool and github_runner_unregistered | length > 0

- name: the runners that need registering
  ansible.builtin.set_fact:
    github_runner_carry: "{{ github_runner_carried.stdout_lines | default([]) | map('int') | list }}"
    github_runner_need: >-
      {{ github_runner_registered.results | rejectattr('stat.exists') | map(attribute='item') | list
         | difference(github_runner_carried.stdout_lines | default([]) | map('int') | list) }}

- name: a token is needed (registering, or removing from GitHub)
  ansible.builtin.include_tasks: token.yml
  when: (github_runner_need | length > 0 or (github_runner_retire | length > 0 and github_runner_deregister | bool))

- name: the plan
  ansible.builtin.debug:
    msg: >-
      RUNNER-PLAN {{ inventory_hostname }} want={{ github_runner_want | length }}
      register={{ github_runner_need | map('regex_replace', '^', inventory_hostname ~ '-') | join(',') or '-' }}
      move-registered={{ github_runner_carry | map('regex_replace', '^', inventory_hostname ~ '-') | join(',') or '-' }}
      retire={{ github_runner_retire | map('regex_replace', '^', inventory_hostname ~ '-') | join(',') or '-' }}
      labels={{ github_runner_label_string }} (check: nothing changed)
  when: ansible_check_mode and (github_runner_need | length > 0 or github_runner_carry | length > 0 or github_runner_retire | length > 0)

- name: retire the runners above the count
  ansible.builtin.include_tasks: unix-retire.yml
  loop: "{{ github_runner_retire }}"
  loop_control: { loop_var: runner_index }

- name: the cache directory
  ansible.builtin.file:
    path: "{{ github_runner_base_dir }}/.cache"
    state: directory
  become: "{{ github_runner_other }}"
  become_user: "{{ github_runner_user }}"
  vars: { ansible_pipelining: true }
  register: github_runner_cache
  when: github_runner_want | length > 0

# The TMPDIR the units name, made as the login before any unit starts: a runner whose TMPDIR is missing fails its jobs'
# first mktemp. On macOS only when github_runner_env names one (the daemon otherwise has none and uses /tmp).
- name: the runners' TMPDIR
  ansible.builtin.file:
    path: "{{ github_runner_env.get('TMPDIR', github_runner_tmpdir) }}"
    state: directory
    owner: "{{ github_runner_user }}"
    mode: "0700"
  become: "{{ github_runner_other }}"
  become_user: "{{ github_runner_user }}"
  vars: { ansible_pipelining: true }
  when: github_runner_want | length > 0 and (ansible_facts['system'] == 'Linux' or 'TMPDIR' in github_runner_env)

- name: the pinned runner release, checked against its digest
  ansible.builtin.get_url:
    url: "{{ github_runner_release_url }}/v{{ github_runner_version }}/actions-runner-{{ github_runner_os }}-{{ github_runner_arch }}-{{ github_runner_version }}.tar.gz"
    dest: "{{ github_runner_base_dir }}/.cache/actions-runner-{{ github_runner_os }}-{{ github_runner_arch }}-{{ github_runner_version }}.tar.gz"
    checksum: "sha256:{{ github_runner_sha256[github_runner_os ~ '-' ~ github_runner_arch] }}"
    mode: "0644"
  become: "{{ github_runner_other }}"
  become_user: "{{ github_runner_user }}"
  vars: { ansible_pipelining: true }
  when: >-
    ansible_facts['system'] != 'Darwin'
    and github_runner_want | length > 0 and not (ansible_check_mode and github_runner_cache is changed)

# macOS: the python ansible runs its modules with on a Mac has no CA bundle, so get_url ends in
# CERTIFICATE_VERIFY_FAILED (studio, 2026-11-07); curl and shasum are on every Mac and trust the system keychain.
# The digest is checked the same way, before and after the download, and a file that fails it is removed.
- name: the pinned runner release, checked against its digest (macOS)
  ansible.builtin.shell: |
    set -eu
    f='{{ github_runner_base_dir }}/.cache/actions-runner-{{ github_runner_os }}-{{ github_runner_arch }}-{{ github_runner_version }}.tar.gz'
    want='{{ github_runner_sha256[github_runner_os ~ '-' ~ github_runner_arch] }}'
    have() { [ -f "$f" ] && [ "$(shasum -a 256 "$f" | cut -d' ' -f1)" = "$want" ]; }
    if have; then echo unchanged; exit 0; fi
    curl -fsSL -o "$f.part" '{{ github_runner_release_url }}/v{{ github_runner_version }}/actions-runner-{{ github_runner_os }}-{{ github_runner_arch }}-{{ github_runner_version }}.tar.gz'
    mv "$f.part" "$f"
    chmod 0644 "$f"
    if ! have; then rm -f "$f"; echo "digest mismatch on $f" >&2; exit 1; fi
    echo downloaded
  args: { executable: /bin/sh }
  register: github_runner_fetched
  changed_when: "'downloaded' in github_runner_fetched.stdout"
  when: >-
    ansible_facts['system'] == 'Darwin'
    and github_runner_want | length > 0 and not (ansible_check_mode and github_runner_cache is changed)

- name: each wanted runner
  ansible.builtin.include_tasks: unix-runner.yml
  loop: "{{ github_runner_want }}"
  loop_control: { loop_var: runner_index }

# The CI rules, by default on every runner this role sets up: the job hooks, the .env pointing at them, and an idle
# runner restarted to read it (tasks/ci-rules.yml).
- name: the CI rules on these runners
  ansible.builtin.include_tasks: ci-rules.yml
  vars:
    ci_rules_become: true
    ci_rules_dirs: "{{ [github_runner_base_dir ~ '/' ~ github_runner_slug ~ '-'] | product(github_runner_want | map('string')) | map('join') | list }}"
  when: github_runner_want | length > 0
