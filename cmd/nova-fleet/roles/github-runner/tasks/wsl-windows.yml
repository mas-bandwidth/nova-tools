---
# A WSL machine's Windows-side runners (cmd/nova-fleet/README.md, "Windows runners of a WSL machine"): what its machine record's
# windows_runners names (the inventory's nova_windows_runners, a list of {url, scope, count, labels}), set up from the
# WSL login through interop: powershell.exe by its full path runs files/runner-windows.ps1, staged to
# C:\ProgramData\nova-runner-stage, as the Windows account that started WSL (elevated). No Windows login, password or
# key is involved. Each runner is <host>-win-<slug>-<i> in C:\actions-runner\<slug>-<i>, a Windows service run as
# NETWORK SERVICE (config.cmd --runasservice), registered with a token from token.yml on its stdin. An existing
# registered runner is left alone. --check reads, asks for the tokens it would need, and prints the plan.
#
# The record's windows_admin_runners (nova_windows_admin_runners, a list of {url, account, labels, secret}) adds one
# runner per entry, <host>-win-<slug>-<account> in C:\actions-runner\<slug>-<account>, carrying only the entry's labels,
# whose service logs on as the local account <account> in Administrators. Its password is the nova-secrets value
# <secret> in this machine's seat: a run where the seat lacks it stops before changing anything and prints how to mint
# it. The value reaches powershell.exe only in its environment (nova-secrets exec, then WSLENV through interop).

- name: is this a WSL machine with interop
  ansible.builtin.stat: { path: "{{ github_runner_wsl_interop }}" }
  register: github_runner_wsl_interop_stat

- name: is powershell.exe reachable
  ansible.builtin.stat: { path: "{{ github_runner_wsl_powershell }}" }
  register: github_runner_wsl_ps

- name: windows_runners is for a WSL machine
  ansible.builtin.assert:
    quiet: true
    that:
      - github_runner_wsl_interop_stat.stat.exists
      - github_runner_wsl_ps.stat.exists
      - nova_windows_runners | default([]) is sequence and nova_windows_runners | default([]) is not string
      - nova_windows_admin_runners | default([]) is sequence and nova_windows_admin_runners | default([]) is not string
    fail_msg: >-
      GITHUB-RUNNERS {{ inventory_hostname }}: its record names windows_runners or windows_admin_runners, but this is not
      a WSL machine with interop ({{ github_runner_wsl_powershell }}); clear the fields:
      nova-config machine set {{ inventory_hostname }} --windows_runners '' --windows_admin_runners ''

# An admin runner registers to one repository, never an organization: every repository of an organization could send
# it jobs, and they run as an administrator. nova-config refuses such a record; this holds a hand-made inventory to it.
- name: every admin runner is a repository's
  ansible.builtin.assert:
    quiet: true
    that: nova_windows_admin_runners | default([]) | map(attribute='url') | reject('match', '^https://github[.]com/[^/]+/[^/]+$') | list | length == 0
    fail_msg: >-
      GITHUB-RUNNERS {{ inventory_hostname }}: windows_admin_runners names an organization; give each a repository:
      nova-config machine set {{ inventory_hostname }} --windows_admin_runners 'https://github.com/<owner>/<repo>=<account>:<label>'

# An admin runner's label is its own: one that any other runner of the machine carries (the role's Windows labels,
# windows_runners' or runner_scopes'), or one GitHub gives runners for their OS and kind, would let a job meant for an
# ordinary runner land on it and run as an administrator. Compared without case, as GitHub matches labels.
- name: no admin runner shares a label
  ansible.builtin.assert:
    quiet: true
    that: github_runner_win_label_clash | length == 0
    fail_msg: >-
      GITHUB-RUNNERS {{ inventory_hostname }}: an admin runner's label is not its own: {{ github_runner_win_label_clash | join(', ') }};
      nothing was changed; give it a label no other runner carries:
      nova-config machine set {{ inventory_hostname }} --windows_admin_runners 'https://github.com/<owner>/<repo>=<account>:<label>'
  vars:
    github_runner_win_label_clash: >-
      {%- set taken = {} -%}
      {%- for l in ['self-hosted', 'windows', 'x64', 'linux', 'macos'] -%}{%- set _ = taken.update({l: 'a label GitHub gives runners'}) -%}{%- endfor -%}
      {%- for l in github_runner_wsl_labels -%}{%- set _ = taken.update({l | lower: 'github_runner_wsl_labels'}) -%}{%- endfor -%}
      {%- for f, ts in [('windows_runners', nova_windows_runners | default([])), ('runner_scopes', nova_runner_scopes | default([]))] -%}{%- for t in ts -%}
      {%- for l in t.labels | default([]) -%}{%- set _ = taken.update({l | lower: f ~ ' of ' ~ t.url}) -%}{%- endfor -%}{%- endfor -%}{%- endfor -%}
      {%- set out = [] -%}
      {%- for t in nova_windows_admin_runners | default([]) -%}{%- for l in t.labels | default([]) -%}
      {%- if (l | lower) in taken -%}{%- set _ = out.append(t.account ~ ' label ' ~ l ~ ' is ' ~ taken[l | lower]) -%}{%- endif -%}
      {%- endfor -%}{%- endfor -%}
      {{ out }}

# Every wanted runner, one entry each: its target, name, directory and labels. The labels are the role's own for the
# Windows side (github_runner_wsl_labels: fleet and the machine's name; GitHub adds self-hosted, X64 and Windows) and the
# record's extras for the target. The slug says the kind, so an organization a-b (org-a-b) and a repository a/b (a-b)
# never share a name or a directory. An admin runner is named by its account instead of a count (an account starts with
# a letter, so it never meets an ordinary runner's name), carries only its entry's labels (never the role's, so a job
# selecting fleet or the machine's name never lands on it), and keeps its account and secret name; an ordinary runner's
# account is ''.
- name: the wanted Windows runners
  ansible.builtin.set_fact:
    github_runner_win_want: >-
      {%- set out = [] -%}
      {%- for t in nova_windows_runners | default([]) -%}
      {%- set path = t.url | regex_replace('^https://[^/]+/', '') -%}
      {%- set scope = 'repo' if '/' in path else 'org' -%}
      {%- set slug = path | replace('/', '-') if scope == 'repo' else 'org-' ~ path -%}
      {%- for i in range(1, (t.count | int) + 1) -%}
      {%- set _ = out.append({'url': t.url, 'scope': scope, 'path': path, 'index': i,
            'name': inventory_hostname ~ '-win-' ~ slug ~ '-' ~ i,
            'dir': github_runner_wsl_base_dir ~ '\\' ~ slug ~ '-' ~ i,
            'labels': (github_runner_wsl_labels + (t.labels | default([]))) | unique | sort | join(','),
            'account': '', 'secret': ''}) -%}
      {%- endfor -%}
      {%- endfor -%}
      {%- for t in nova_windows_admin_runners | default([]) -%}
      {%- set path = t.url | regex_replace('^https://[^/]+/', '') -%}
      {%- set slug = path | replace('/', '-') -%}
      {%- set _ = out.append({'url': t.url, 'scope': 'repo', 'path': path, 'index': t.account,
            'name': inventory_hostname ~ '-win-' ~ slug ~ '-' ~ t.account,
            'dir': github_runner_wsl_admin_dir ~ '\\' ~ slug ~ '-' ~ t.account,
            'labels': t.labels | unique | sort | join(','),
            'account': t.account, 'secret': t.secret}) -%}
      {%- endfor -%}
      {{ out }}

- name: the admin runners among them
  ansible.builtin.set_fact:
    github_runner_win_admin: "{{ github_runner_win_want | selectattr('account') | list }}"

- name: the Windows runners as the machine has them
  ansible.builtin.include_tasks: wsl-windows-state.yml

# Without GitHub's list a whole runner cannot be told from a half one, and a whole one would be registered again.
- name: GitHub's list was read for every target
  ansible.builtin.assert:
    quiet: true
    that: github_runner_win_unread | length == 0
    fail_msg: >-
      GITHUB-RUNNERS {{ inventory_hostname }}: gh on the control node could not list the runners of
      {{ github_runner_win_unread | join(', ') }}; gh needs a login with admin there: gh auth login

# A runner not whole is registered; one with .runner but no service or no GitHub entry is a half registration, which
# runner-windows.ps1 register repairs (its .runner and credentials moved aside, then --replace).
- name: the runners that need registering, and which of them are repairs
  ansible.builtin.set_fact:
    github_runner_win_need: "{{ github_runner_win_want | rejectattr('dir', 'in', github_runner_win_whole) | list }}"
    github_runner_win_repair: "{{ github_runner_win_want | rejectattr('dir', 'in', github_runner_win_whole) | selectattr('dir', 'in', github_runner_win_half) | map(attribute='name') | list }}"

# The names in this machine's own seat (no value is read): each admin runner's password must be there before anything
# changes. Read only, so it runs under --check too.
- name: the names in this machine's seat, for the admin runners' passwords
  ansible.builtin.command:
    argv: ["{{ github_runner_nova_secrets }}", names, --store, "{{ nova_secrets_store }}", --as, "{{ nova_seat }}"]
  register: github_runner_win_names
  changed_when: false
  failed_when: false
  check_mode: false
  when: github_runner_win_admin | length > 0

- name: the admin runners' passwords the seat lacks
  ansible.builtin.set_fact:
    github_runner_win_unsealed: >-
      {{ github_runner_win_admin | map(attribute='secret') | difference(github_runner_win_names.stdout_lines | default([])) | list }}

- name: the plan
  ansible.builtin.debug:
    msg: >-
      RUNNER-PLAN {{ inventory_hostname }} windows={{ github_runner_win_want | length }}
      register={{ github_runner_win_need | map(attribute='name') | join(',') or '-' }}
      repair={{ github_runner_win_repair | join(',') or '-' }}
      admin={{ github_runner_win_admin | map(attribute='name') | zip(github_runner_win_admin | map(attribute='account')) | map('join', '@') | join(',') or '-' }}
      unsealed={{ github_runner_win_unsealed | join(',') or '-' }}
      labels={{ github_runner_win_want | map(attribute='labels') | unique | join(' ') }} (check: nothing changed)
  when: ansible_check_mode

# The value is made on the control node, never typed or shown: a generated line piped into nova-secrets set (Nw1- keeps
# Windows' complexity rule: upper case, lower case, a digit and a symbol), granted to this machine's seat, the store
# pushed, and every machine's copy refreshed.
- name: every admin runner's password is in this machine's seat
  ansible.builtin.fail:
    msg: >-
      GITHUB-RUNNERS {{ inventory_hostname }}: seat {{ nova_seat }} holds no {{ github_runner_win_unsealed | join(', ') }}
      ({{ (github_runner_win_names.stderr_lines | default([]) | last | default('nova-secrets names rc=' ~ github_runner_win_names.rc | default('-')))
          if github_runner_win_names.rc | default(0) != 0 else 'nova-secrets names does not list it' }}); nothing was changed.
      On the control node, run:
      {% for n in github_runner_win_unsealed %}{ printf 'Nw1-'; openssl rand -hex 24; } | nova-secrets set {{ n }}
      --store {{ nova_seal_store | default('<store>') }} --key {{ nova_seal_key | default('<key>') }} --pins {{ nova_seal_pins }}
      --as {{ nova_seal_seat | default('<seat>') }} &&
      nova-secrets grant {{ n }} --to {{ nova_seat }} --pins {{ nova_seal_pins }} --store {{ nova_seal_store | default('<store>') }}
      --key {{ nova_seal_key | default('<key>') }} --as {{ nova_seal_seat | default('<seat>') }} &&
      {% endfor %}git -C {{ nova_seal_store | default('<store>') }} push &&
      nova-fleet secrets-refresh -- -e nova_seal_store={{ nova_seal_store | default('<store>') }}
  when: github_runner_win_unsealed | length > 0

- name: the script, staged on the Windows side
  when: not ansible_check_mode
  block:
    - name: the staging directory
      ansible.builtin.file: { path: "{{ github_runner_wsl_stage_unix }}", state: directory, mode: "0755" }
    - name: runner-windows.ps1
      ansible.builtin.copy: { src: runner-windows.ps1, dest: "{{ github_runner_wsl_stage_unix }}/runner-windows.ps1", mode: "0644" }

# Each admin runner's local account: created, or its password set to the seat's where they differ; in Administrators
# (by SID); allowed to log on as a service and denied interactive and remote-interactive logon. The password reaches
# powershell.exe only in its environment: nova-secrets exec adds it to env's, and WSLENV hands that one variable through
# interop. no_log keeps the whole result out of the output; the receipt prints the script's own lines, which never
# carry the value.
- name: each admin runner's local account
  ansible.builtin.shell: >-
    {{ github_runner_win_secrets_exec }} {{ item.secret | quote }} -- env WSLENV={{ item.secret | quote }}
    "{{ github_runner_wsl_powershell }}" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {{ github_runner_wsl_script | quote }}
    -Action account -Account {{ item.account | quote }} -SecretEnv {{ item.secret | quote }} </dev/null
  args: { executable: /bin/sh }
  loop: "{{ github_runner_win_admin }}"
  loop_control: { label: "{{ item.account }}" }
  no_log: true
  failed_when: false
  register: github_runner_win_account
  changed_when: github_runner_win_account.stdout is search('account=(created|updated)|rights=[+]|admin=added')
  when: not ansible_check_mode

- name: the accounts' receipt
  ansible.builtin.debug:
    msg: >-
      {{ (item.stdout_lines | default([]) | select('match', '^(ACCOUNT|ACCOUNT-NOT-OURS|NO-SECRET|NEEDS-ELEVATION|BAD-ARGS) ') | list
          + (item.stderr_lines | default([]) | select('match', '^(SECRETS |nova-secrets)') | list)) | join(' ')
         | default('rc=' ~ item.rc | default('-'), true) | regex_replace('^ACCOUNT ', 'ACCOUNT ' ~ inventory_hostname ~ ' ') }}
  loop: "{{ github_runner_win_account.results | default([]) }}"
  loop_control: { label: "{{ item.item.account | default('-') }}" }
  when: not ansible_check_mode

- name: every admin runner's account is set
  ansible.builtin.assert:
    quiet: true
    that: github_runner_win_account.results | default([]) | rejectattr('rc', 'equalto', 0) | list | length == 0
    fail_msg: "GITHUB-RUNNERS {{ inventory_hostname }}: an admin runner's account could not be set; its receipt is above"
  when: not ansible_check_mode

# An admin runner (-Account) is unpacked into a directory made sealed before anything is in it, from a copy of the zip
# hashed inside it, its files checked against that copy on every run, its PATH checked writable by no ordinary runner,
# and its .env the role's whole, CCACHE_DISABLE=1 among it (runner-windows.ps1, install).
- name: each wanted runner unpacked, with the .env lines the role owns
  ansible.builtin.shell: >-
    "{{ github_runner_wsl_powershell }}" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {{ github_runner_wsl_script | quote }}
    -Action install -Dir {{ item.dir | quote }} -Cache {{ github_runner_wsl_cache | quote }}
    -Version {{ github_runner_version | quote }} -Sha {{ github_runner_sha256['win-x64'] | quote }}
    {{ ('-PathList ' ~ (github_runner_win_path | join(';') | quote)) if github_runner_win_path | length > 0 else '' }}
    {{ ('-Account ' ~ (item.account | quote)) if item.account else '' }} </dev/null
  args: { executable: /bin/sh }
  vars:
    github_runner_win_path: "{{ github_runner_win_admin_path if item.account else github_runner_windows_path }}"
  loop: "{{ github_runner_win_want }}"
  loop_control: { label: "{{ item.name }}" }
  register: github_runner_win_installed
  changed_when: github_runner_win_installed.stdout is search('DOWNLOADED|EXTRACTED|ENV-CHANGED')
  when: not ansible_check_mode

- name: register, one target at a time (each target's own token)
  ansible.builtin.include_tasks: wsl-windows-register.yml
  loop: "{{ github_runner_win_need | map(attribute='url') | unique | list }}"
  loop_control: { loop_var: github_runner_win_url }

# register gives an admin runner no service (--runasservice would grant NETWORK SERVICE its directory and run the
# listener as NETWORK SERVICE; --windowslogonpassword would put the password in an argument). On every run this first
# proves the admin root and the runner's whole directory sealed (acl=protected; nothing repaired, an unsealed one
# refused), then makes the service logging on as .\<account> or sets that logon (CreateService or ChangeServiceConfig
# inside powershell, the password from its environment as above), so a run cut off after the account step never leaves
# the old password. The service restarts while idle when the account step set a new password (-Relogon) or it ran as
# another account.
- name: each admin runner's service logs on as its account
  ansible.builtin.shell: >-
    {{ github_runner_win_secrets_exec }} {{ item.secret | quote }} -- env WSLENV={{ item.secret | quote }}
    "{{ github_runner_wsl_powershell }}" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {{ github_runner_wsl_script | quote }}
    -Action logon -Dir {{ item.dir | quote }} -Url {{ item.url | quote }} -Name {{ item.name | quote }}
    -Account {{ item.account | quote }} -SecretEnv {{ item.secret | quote }}
    {{ '-Relogon' if (github_runner_win_account.results | selectattr('item.account', 'equalto', item.account) | map(attribute='stdout')
       | first | default('')) is search('account=updated') else '' }} </dev/null
  args: { executable: /bin/sh }
  loop: "{{ github_runner_win_admin }}"
  loop_control: { label: "{{ item.name }}" }
  no_log: true
  failed_when: false
  register: github_runner_win_logon
  changed_when: github_runner_win_logon.stdout is search(' (set|created) account=|restart=done')
  when: not ansible_check_mode

- name: the services' logon receipt
  ansible.builtin.debug:
    msg: >-
      {{ (item.stdout_lines | default([]) | select('match', '^(LOGON|NO-SECRET|LOGON-FAILED|ACL-OPEN|ACCOUNT-NOT-OURS|NEEDS-ELEVATION|BAD-ARGS) ') | list
          + (item.stderr_lines | default([]) | select('match', '^(SECRETS |nova-secrets)') | list)) | join(' ')
         | default('rc=' ~ item.rc | default('-'), true) | regex_replace('^LOGON ', 'LOGON ' ~ inventory_hostname ~ ' ') }}
  loop: "{{ github_runner_win_logon.results | default([]) }}"
  loop_control: { label: "{{ item.item.name | default('-') }}" }
  when: not ansible_check_mode

- name: every admin runner's service logs on as its account
  ansible.builtin.assert:
    quiet: true
    that:
      - github_runner_win_logon.results | default([]) | rejectattr('rc', 'equalto', 0) | list | length == 0
      - github_runner_win_logon.results | default([]) | rejectattr('stdout', 'search', ' acl=protected ') | list | length == 0
    fail_msg: >-
      GITHUB-RUNNERS {{ inventory_hostname }}: an admin runner's service could not be set to its account, or its directory
      is not protected; its receipt is above
  when: not ansible_check_mode

- name: each wanted runner's service starts at boot and is running
  ansible.builtin.shell: >-
    "{{ github_runner_wsl_powershell }}" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {{ github_runner_wsl_script | quote }}
    -Action ensure -Dir {{ item.dir | quote }} </dev/null
  args: { executable: /bin/sh }
  loop: "{{ github_runner_win_want }}"
  loop_control: { label: "{{ item.name }}" }
  register: github_runner_win_service
  changed_when: "' started ' in github_runner_win_service.stdout"
  when: not ansible_check_mode

# The CI rules on these runners: nova-ci-rules.ps1 apply with their directories (tasks/ci-rules.yml does every runner
# on the machine; this does the ones set up here). An idle runner whose .env changed is restarted to read it.
- name: the CI rules on these runners
  when: not ansible_check_mode
  block:
    - name: the hooks' staging directory
      ansible.builtin.file: { path: "{{ github_runner_wsl_ci_stage_unix }}", state: directory, mode: "0755" }
    - name: the hooks, staged
      ansible.builtin.copy: { src: "ci-rules/{{ item }}", dest: "{{ github_runner_wsl_ci_stage_unix }}/{{ item }}", mode: "0644" }
      loop: [nova-ci-rules.ps1, job-started.ps1, job-completed.ps1]
    - name: apply them
      ansible.builtin.shell: >-
        "{{ github_runner_wsl_powershell }}" -NoProfile -NonInteractive -ExecutionPolicy Bypass
        -File {{ github_runner_wsl_ci_script | quote }} apply {{ github_runner_ci_limit_seconds }}
        {{ github_runner_ci_push_branches | join(' ') | quote }} {{ github_runner_win_want | map(attribute='dir') | map('quote') | join(' ') }}
        </dev/null
      args: { executable: /bin/sh }
      register: github_runner_win_ci
      failed_when: github_runner_win_ci.rc != 0 or 'restart=failed' in github_runner_win_ci.stdout or 'denied=' in github_runner_win_ci.stdout
      changed_when: "'hooks=set' in github_runner_win_ci.stdout or 'restart=done' in github_runner_win_ci.stdout"

- name: the CI rules' receipt
  ansible.builtin.debug:
    msg: "{{ github_runner_win_ci.stdout_lines | map('regex_replace', '^CI-RULES ', 'CI-RULES ' ~ inventory_hostname ~ ' ') | join('\n') }}"
  when: not ansible_check_mode

- name: the Windows runners as the machine and GitHub have them now (a new runner is given a minute to come online)
  ansible.builtin.include_tasks: wsl-windows-state.yml
  vars:
    github_runner_win_gh_wait: >-
      {%- set d = {} -%}
      {%- for u in github_runner_win_want | map(attribute='url') | unique -%}
      {%- set _ = d.update({u: github_runner_win_want | selectattr('url', 'equalto', u) | map(attribute='name') | list}) -%}
      {%- endfor -%}
      {{ d }}
  when: not ansible_check_mode

- name: the counts
  ansible.builtin.set_fact:
    github_runner_win_registered_n: "{{ github_runner_win_whole | length }}"
    github_runner_win_online_n: "{{ github_runner_win_want | map(attribute='name') | intersect(github_runner_win_online) | length }}"

- name: the Windows runners' receipt
  ansible.builtin.debug:
    msg: >-
      GITHUB-RUNNERS host={{ inventory_hostname }} windows={{ github_runner_win_want | length }}
      registered={{ github_runner_win_registered_n }} online={{ github_runner_win_online_n }}
      {{- (' unread=' ~ github_runner_win_unread | join(',')) if github_runner_win_unread | length > 0 else '' }}
      {{- ' (check: nothing changed)' if ansible_check_mode else '' }}

- name: every wanted Windows runner is registered and online in GitHub
  ansible.builtin.assert:
    quiet: true
    that:
      - github_runner_win_unread | length == 0
      - github_runner_win_registered_n | int == github_runner_win_want | length
      - github_runner_win_online_n | int == github_runner_win_want | length
    fail_msg: >-
      GITHUB-RUNNERS {{ inventory_hostname }}: not every Windows runner is registered and online (see the GITHUB-RUNNERS
      line); check: {{ github_runner_gh }} api repos/<owner>/<repo>/actions/runners (orgs/<org> for an organization)
  when: not ansible_check_mode
