---
# The CI rules on runners (cmd/nova-fleet/README.md, "CI rules"): nova-ci-rules apply puts the job hooks into
# <runner dir>/.nova-ci-rules/, points the runner's .env at them (a hook the .env held before is chained, not lost) and
# restarts an idle runner whose .env changed. ci_rules_dirs names the runner directories; empty means every runner
# running on the machine (the ci-rules play). A busy runner is left running and says restart=busy: run again.
# Linux and macOS: nova-ci-rules.sh, as root on Linux (runners of other logins) and wherever ci_rules_become is true (the
# github-runners play, whose macOS runners are LaunchDaemons); otherwise macOS applies as the login, which reaches the
# login's own runners only (a daemon says restart=needs-root). A WSL machine also applies nova-ci-rules.ps1 to the Windows side.

- name: the CI rules, staged (Linux and macOS)
  when: not ansible_check_mode
  block:
    - name: a staging directory
      ansible.builtin.tempfile: { state: directory, suffix: .nova-ci-rules }
      register: ci_rules_stage
    - name: the hooks, staged
      ansible.builtin.copy:
        src: ci-rules/
        dest: "{{ ci_rules_stage.path }}/"
        mode: "0755"
    - name: apply them to the runners
      ansible.builtin.command:
        argv: "{{ ['sh', ci_rules_stage.path ~ '/nova-ci-rules.sh', 'apply', github_runner_ci_limit_seconds | string, github_runner_ci_push_branches | join(' ')] + (ci_rules_dirs | default([])) }}"
      become: "{{ ci_rules_become | default(ansible_facts['system'] == 'Linux') | bool }}"
      register: ci_rules_applied
      changed_when: "'hooks=set' in ci_rules_applied.stdout or 'restart=done' in ci_rules_applied.stdout"
      failed_when: ci_rules_applied.rc != 0
  always:
    - name: the staging directory is removed
      ansible.builtin.file: { path: "{{ ci_rules_stage.path }}", state: absent }
      when: ci_rules_stage.path is defined

# A WSL machine's Windows runners: the hooks are staged where only Administrators can change them and proved before
# the elevated apply (tasks/wsl-stage.yml), never in C:\ProgramData.
- name: is this a WSL machine with interop (CI rules)
  ansible.builtin.stat: { path: "{{ github_runner_wsl_interop }}" }
  register: ci_rules_wsl
  when: ci_rules_dirs | default([]) | length == 0 and ansible_facts['system'] == 'Linux'

- name: is powershell.exe reachable (CI rules)
  ansible.builtin.stat: { path: "{{ github_runner_wsl_powershell }}" }
  register: ci_rules_wsl_ps
  when: ci_rules_wsl.stat.exists | default(false)

- name: the WSL machine's Windows runners
  when: not ansible_check_mode and ci_rules_wsl.stat.exists | default(false) and ci_rules_wsl_ps.stat.exists | default(false)
  block:
    - name: the scripts, staged (CI rules)
      ansible.builtin.include_tasks: wsl-stage.yml
    - name: apply them to the Windows runners
      ansible.builtin.shell: >-
        set -eu -o pipefail;
        {{ github_runner_win_stage_check }} &&
        "{{ github_runner_wsl_powershell }}" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {{ github_runner_wsl_ci_script | quote }}
        apply {{ github_runner_ci_limit_seconds }} {{ github_runner_ci_push_branches | join(' ') | quote }} </dev/null | tr -d '\r'
      args: { executable: /bin/bash }
      register: ci_rules_windows
      failed_when: ci_rules_windows.rc != 0 or 'restart=failed' in ci_rules_windows.stdout or 'denied=' in ci_rules_windows.stdout
      changed_when: "'hooks=set' in ci_rules_windows.stdout or 'restart=done' in ci_rules_windows.stdout"

- name: the CI rules' receipt
  ansible.builtin.debug:
    msg: >-
      {% if ansible_check_mode %}CI-RULES {{ inventory_hostname }} (check: not checked; --check does not run nova-ci-rules, a run applies the rules){% else %}{{
      ((ci_rules_applied.stdout_lines | default([])) + (ci_rules_windows.stdout_lines | default([]) | reject('equalto', 'NO-WSL') | list))
      | map('regex_replace', '^CI-RULES ', 'CI-RULES ' ~ inventory_hostname ~ ' ') | join('\n') or
      'CI-RULES ' ~ inventory_hostname ~ ' no runners' }}{% endif %}
