---
# Retire runner number runner_index: after the job it is running ends, stop and remove its service (and any drop-in
# beside it), remove it from GitHub, delete its directory. On Linux its unit may run it from another directory (another
# login's home, before a move to github_runner_user): the job there is waited on, and that directory is deleted too.
- name: the retiring runner's names
  ansible.builtin.set_fact:
    github_runner_dir: "{{ github_runner_base_dir }}/{{ github_runner_slug }}-{{ runner_index }}"
    github_runner_unit: "github-runner-{{ github_runner_slug }}-{{ runner_index }}"
    github_runner_label_id: "github-runner.{{ github_runner_slug }}-{{ runner_index }}"

- name: the directory its unit runs it from (Linux)
  ansible.builtin.command: { argv: [systemctl, show, -P, WorkingDirectory, "{{ github_runner_unit }}.service"] }
  register: github_runner_retire_from
  changed_when: false
  failed_when: false
  check_mode: false
  when: ansible_facts['system'] == 'Linux'

- name: the job it is running ends first
  ansible.builtin.include_tasks: wait-idle.yml
  vars: { github_runner_idle_dir: "{{ github_runner_retire_from.stdout | default('') | trim or github_runner_dir }}" }

- name: stop and remove the service
  ansible.builtin.shell: |
    set -eu
    if [ "$(uname -s)" = Darwin ]; then
      f=/Library/LaunchDaemons/{{ github_runner_label_id }}.plist
      [ -e "$f" ] || { echo ABSENT; exit 0; }
      launchctl bootout system/{{ github_runner_label_id }} 2>/dev/null || true
      rm -f "$f"
    else
      f=/etc/systemd/system/{{ github_runner_unit }}.service
      [ -e "$f" ] || { echo ABSENT; exit 0; }
      systemctl disable --now {{ github_runner_unit }}.service
      rm -f "$f"
      rm -rf "$f.d"
      systemctl daemon-reload
    fi
    echo REMOVED
  args: { executable: /bin/sh }
  become: true
  register: github_runner_stopped
  changed_when: "'REMOVED' in github_runner_stopped.stdout"

# the token on stdin, as in unix-register.yml: never in an argument or an environment `ps` can show
- name: remove the runner from GitHub (the token reaches the runner on its stdin)
  ansible.builtin.shell: |
    IFS= read -r ACTIONS_RUNNER_INPUT_TOKEN
    export ACTIONS_RUNNER_INPUT_TOKEN
    exec ./config.sh remove
  args:
    executable: /bin/sh
    chdir: "{{ github_runner_dir }}"
    removes: "{{ github_runner_dir }}/.runner"
    stdin: "{{ github_runner_token | default('') }}"
  vars: { ansible_pipelining: true }
  become: "{{ github_runner_other }}"
  become_user: "{{ github_runner_user }}"
  no_log: true
  register: github_runner_removal
  failed_when: false
  when: github_runner_deregister | bool and not ansible_check_mode

- name: a failed removal says why (the token, if it ever appeared, redacted)
  ansible.builtin.fail:
    msg: >-
      GITHUB RUNNER REMOVE {{ inventory_hostname }} rc={{ github_runner_removal.rc }}:
      {%- set s = (github_runner_removal.stderr | default('') ~ ' ' ~ github_runner_removal.stdout | default('')) | trim | truncate(600) %}
      {{ s | regex_replace(github_runner_token | regex_escape, 'REDACTED') if github_runner_token | default('') | length > 0 else s }}
  when: github_runner_removal is not skipped and github_runner_removal.rc | default(0) != 0

- name: delete the directory
  ansible.builtin.include_tasks: remove-dir.yml
  loop: >-
    {{ ([github_runner_dir] + ([github_runner_retire_from.stdout | default('') | trim]
        | select('match', '^/.+/actions-runner/' ~ (github_runner_dir | basename | regex_escape) ~ '$') | list)) | unique }}
  loop_control: { loop_var: github_runner_rm }
