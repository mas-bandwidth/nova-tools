---
# Register the wanted Windows runners of one target, github_runner_win_url, that are not registered yet (an admin runner
# is registered only: its service is made by the logon step in wsl-windows.yml). The token
# (token.yml, gh on the control node) reaches runner-windows.ps1 on its stdin and config.cmd in its environment only:
# never an argument, a file or a line of output. The task is pipelined (ansible_pipelining), so the module that carries
# it runs from the ssh pipe and is never a file on the machine's disk. Under --check the token is still asked for.
- name: this target's runners to register
  ansible.builtin.set_fact:
    github_runner_win_target_need: "{{ github_runner_win_need | selectattr('url', 'equalto', github_runner_win_url) | list }}"

- name: a registration token for this target
  ansible.builtin.include_tasks: token.yml
  vars:
    github_runner_scope: "{{ github_runner_win_target_need[0].scope }}"
    github_runner_path: "{{ github_runner_win_target_need[0].path }}"
    github_runner_need: "{{ github_runner_win_target_need }}"

- name: register with GitHub as a Windows service (the token reaches the runner on its stdin)
  ansible.builtin.shell: >-
    {{ github_runner_win_stage_check }} &&
    "{{ github_runner_wsl_powershell }}" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {{ github_runner_wsl_script | quote }}
    -Action register -Dir {{ item.dir | quote }} -Url {{ item.url | quote }} -Name {{ item.name | quote }} -Labels {{ item.labels | quote }}
    {{ ('-Account ' ~ (item.account | quote)) if item.account else '' }}
  args:
    executable: /bin/sh
    stdin: "{{ github_runner_token }}"
  vars: { ansible_pipelining: true }
  loop: "{{ github_runner_win_target_need }}"
  loop_control: { label: "{{ item.name }}" }
  no_log: true
  failed_when: false
  register: github_runner_win_registration
  when: not ansible_check_mode and not github_runner_win_native | bool

- name: the stage, proved (plain Windows host; before the registration)
  ansible.windows.win_command: { argv: "{{ github_runner_win_stage_check_argv }}" }
  changed_when: false
  when: not ansible_check_mode and github_runner_win_native | bool

# The same on a plain Windows host. win_command hands the token to powershell.exe's stdin; the module and its arguments
# travel in the ssh session's pipe, never a file on the disk. Its own register name: a skipped task still registers.
- name: register with GitHub as a Windows service (plain Windows host; the token reaches the runner on its stdin)
  ansible.windows.win_command:
    argv: ['powershell.exe', '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-File', "{{ github_runner_wsl_script }}", '-Action', 'register', '-Dir', "{{ item.dir }}", '-Url', "{{ item.url }}", '-Name', "{{ item.name }}", '-Labels', "{{ item.labels }}"]
  args:
    stdin: "{{ github_runner_token }}"
  vars: { ansible_pipelining: true }
  loop: "{{ github_runner_win_target_need }}"
  loop_control: { label: "{{ item.name }}" }
  no_log: true
  failed_when: false
  register: github_runner_win_registration_native
  when: not ansible_check_mode and github_runner_win_native | bool

# no_log hides the whole result, the cause with it: each outcome is printed with the token redacted. The results are
# whichever registration ran (the other was skipped), read in place and never copied into a fact.
- name: the registrations' outcome (token redacted)
  ansible.builtin.debug:
    msg: >-
      RUNNER REGISTER {{ item.item.name }} rc={{ item.rc | default(-1) }}
      {{ ((item.stdout_lines | default([])) + (item.stderr_lines | default([]))) | join(' ') | replace(github_runner_token, 'REDACTED')
         | regex_replace('[A-Z0-9]{20,}', 'REDACTED') | trim | truncate(600) }}
  loop: "{{ github_runner_win_registration_results }}"
  loop_control: { label: "{{ item.item.name | default('-') }}" }
  vars:
    github_runner_win_registration_results: >-
      {{ (github_runner_win_registration_native.results if github_runner_win_native | bool
          else github_runner_win_registration.results) | default([]) }}
  when: not ansible_check_mode and item.rc | default(0) != 0

- name: every registration landed
  ansible.builtin.assert:
    quiet: true
    that: github_runner_win_registration_results | rejectattr('rc', 'equalto', 0) | list | length == 0
  vars:
    github_runner_win_registration_results: >-
      {{ (github_runner_win_registration_native.results if github_runner_win_native | bool
          else github_runner_win_registration.results) | default([]) }}
    fail_msg: "GITHUB-RUNNERS {{ inventory_hostname }}: a Windows runner of {{ github_runner_win_url }} failed to register; the redacted cause is above"
  when: not ansible_check_mode
