---
# Detection only, asked for with -e nova_runner_git_probe=true (cmd/nova-fleet/README.md, "github-runners", "A workspace
# clone git cannot fetch into"). A runner's persistent workspace clone (<runner dir>/_work/<repo>/<repo>) that is shallow
# and a promisor (partial clone) can make git abort in actions/checkout's fetch: "BUG: builtin/pack-objects.c ...
# should_include_obj should only be called on existing objects", exit 128. git 2.53.0 and 2.56.1 both do it, and a
# repack first does not help. Each such clone of an idle runner is copied under the login's home and the checkout's
# fetch run on the copy, the token given to git by the env-reading helper of `nova-secrets help exec`; the copy is
# deleted and the fetch's output is only searched, never printed. The workspace is never written, moved or deleted; a
# clone that aborts fails the run, naming the step that moves it aside. Linux only: a macOS or Windows runner is not
# probed.

- name: the git probe is for Linux runners
  ansible.builtin.debug:
    msg: "GIT-PROBE {{ inventory_hostname }} skipped: the probe is for Linux runners, this is {{ ansible_facts['system'] }}"
  when: ansible_facts['system'] != 'Linux'

- name: the runners' workspace clones, probed on a copy (Linux)
  when: ansible_facts['system'] == 'Linux'
  block:
    # One line per clone: GIT-PROBE <machine> <runner> <workspace> BUG | clean | skipped=busy | not-probed | error=<why>.
    # A runner is idle when no Runner.Worker runs from its bin (tasks/wait-idle.yml), checked before and after the copy.
    - name: each idle runner's shallow promisor clones, the checkout's fetch run on a copy
      ansible.builtin.shell: |
        set -u
        host={{ inventory_hostname | quote }}
        scratch={{ github_runner_git_probe_scratch | quote }}
        secrets={{ (nova_bin_dir ~ '/nova-secrets') | quote }}
        copy=
        trap 'if [ -n "$copy" ]; then rm -rf "$copy"; fi' EXIT
        busy() { pgrep -f "$1/bin/[R]unner.Worker" >/dev/null; }
        say() { echo "GIT-PROBE $host $r $w $1"; }
        drop() { rm -rf "$copy"; copy=; }
        for g in {{ github_runner_base_dir | quote }}/*/_work/*/*/.git; do
          [ -d "$g" ] || continue
          w=${g%/.git}
          d=${w%%/_work/*}
          r=${d##*/}
          if [ ! -f "$g/shallow" ] || [ "$(git config --file "$g/config" --get remote.origin.promisor)" != true ]; then
            say not-probed
            continue
          fi
          if busy "$d"; then say skipped=busy; continue; fi
          if ! mkdir -p "$scratch" || ! copy=$(mktemp -d "$scratch/probe.XXXXXX"); then copy=; say error=scratch; continue; fi
          if ! cp -a "$g" "$copy/.git"; then drop; say error=copy; continue; fi
          if busy "$d"; then drop; say skipped=busy; continue; fi
          git config --file "$copy/.git/config" --unset-all http.https://github.com/.extraheader
          out=$(cd "$copy" && "$secrets" exec --only GH_GATE_TOKEN -- git -c credential.helper= -c credential.helper='!f() { test "$1" = get && echo username=x-access-token && echo "password=$GH_GATE_TOKEN"; }; f' -c protocol.version=2 fetch --prune --no-recurse-submodules --filter=tree:0 --unshallow origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' 2>&1)
          rc=$?
          drop
          case $out in
            *should_include_obj*)
              say BUG
              echo "GIT-PROBE-FIX $host $r: pgrep -f '$d/bin/[R]unner.Worker' || mv '$w' '$w.git-bug'" ;;
            *) if [ "$rc" = 0 ]; then say clean; else say "error=fetch-rc-$rc"; fi ;;
          esac
        done
      args: { executable: /bin/sh }
      register: github_runner_git_probe
      changed_when: false
      failed_when: false
      check_mode: false

    - name: the probe's receipt
      ansible.builtin.debug:
        msg: "{{ github_runner_git_probe.stdout_lines or ['GIT-PROBE ' ~ inventory_hostname ~ ' no workspace clones'] }}"

    - name: no workspace clone makes git abort in the checkout's fetch
      ansible.builtin.assert:
        quiet: true
        that:
          - github_runner_git_probe.rc == 0
          - github_runner_git_probe.stdout_lines | select('search', ' (BUG|error=[^ ]*)$') | list | length == 0
        fail_msg: >-
          GIT-PROBE {{ inventory_hostname }}:
          {% if github_runner_git_probe.stdout_lines | select('search', ' BUG$') | list %}a runner's workspace clone makes git
          abort in actions/checkout's fetch (pack-objects BUG; a newer git has it too). On {{ inventory_hostname }},
          move each aside while its runner is idle, and the next job clones again:
          {{ github_runner_git_probe.stdout_lines | select('match', '^GIT-PROBE(-FIX)? .* (BUG$|pgrep )') | join(' ; ') }}.
          {% endif %}{% if github_runner_git_probe.stdout_lines | select('search', ' error=[^ ]*$') | list or github_runner_git_probe.rc != 0 %}the probe
          could not run on: {{ github_runner_git_probe.stdout_lines | select('search', ' error=[^ ]*$') | join(' ; ') or 'rc=' ~ github_runner_git_probe.rc ~ ' ' ~ (github_runner_git_probe.stderr | default('') | trim) }};
          run: {{ nova_bin_dir }}/nova-secrets exec --only GH_GATE_TOKEN -- true{% endif %}
