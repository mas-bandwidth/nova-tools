---
# Installs, registers and supervises GitHub Actions runners on this host (cmd/nova-fleet/README.md, "github-runners").
#
# Without -e github_runner_url (the usual run): the machine record's runner_scopes (the inventory's nova_runner_scopes)
# are the host's runners, every scope's made as scope.yml makes one url's, and every other runner on the host is retired
# (record.yml). With -e github_runner_url: that one url's runners only (scope.yml); the host's other runners are left.

# The runners run as github_runner_user: the fleet login, or on Linux a login of its own (unix-login.yml). Then what is in
# its home is read and written as root and owned by it, and config.sh runs as it.
- name: whose runners these are
  ansible.builtin.set_fact:
    github_runner_other: "{{ github_runner_user != ansible_facts['user_id'] }}"

# The runner login cannot enter the fleet login's home, so an environment naming a path there (a record written for
# the fleet login's runners) would fail every job: refused before the machine or any runner is changed.
- name: the runner login's environment names nothing in the fleet login's home
  ansible.builtin.assert:
    quiet: true
    that: github_runner_env_theirs | length == 0
    fail_msg: >-
      github-runner: {{ inventory_hostname }}'s runner environment names {{ github_runner_env_theirs | join(', ') }}, in
      {{ ansible_facts['user_dir'] }}, which {{ github_runner_user }} cannot read; give paths it can, run: nova-config machine
      set {{ inventory_hostname }} --runner_env '<json-object>'
  vars:
    github_runner_env_theirs: >-
      {{ github_runner_env | dict2items | selectattr('value', 'string')
         | selectattr('value', 'search', '(^|:)' ~ (ansible_facts['user_dir'] | regex_escape) ~ '(/|:|$)')
         | map(attribute='key') | list }}
  when: github_runner_other | bool

- name: the runner login of its own (Linux)
  ansible.builtin.include_tasks: unix-login.yml
  when: github_runner_other | bool

# --check cannot plan files owned by a login that does not exist yet: it says so and stops for this host.
- name: the runner login, planned
  ansible.builtin.debug:
    msg: >-
      RUNNER-LOGIN {{ inventory_hostname }} {{ github_runner_user }} home={{ github_runner_home }}: a run makes it, then its
      runners; plan them once it exists (check: nothing changed)
  when: github_runner_other | bool and ansible_check_mode and 'ABSENT' in github_runner_existing.stdout

- name: nothing more to plan here until the runner login exists
  ansible.builtin.meta: end_host
  when: github_runner_other | bool and ansible_check_mode and 'ABSENT' in github_runner_existing.stdout

# The case-folding scratch volume (casefold.yml), for the runner login once it exists.
- name: the case-folding scratch volume (Linux)
  ansible.builtin.include_tasks: casefold.yml
  when: ansible_facts['system'] == 'Linux' and github_runner_casefold_dir | length > 0 and github_runner_state == 'present'

# The read-only deploy keys the runner login fetches private repositories with (deploy-keys.yml), before any runner
# takes a job. --tags deploy-keys runs them alone, leaving the runners as they are.
- name: the runner login's deploy keys
  ansible.builtin.include_tasks:
    file: deploy-keys.yml
    apply: { tags: [deploy-keys] }
  tags: [deploy-keys]
  when: github_runner_deploy_keys | length > 0

# The CPUs each Linux unit names (github_runner_cpus): the online ones less the kernel's isolated ones. A kernel without
# the isolated file isolates none. Read in --check too, so a plan shows the affinity it would write.
- name: the online and isolated CPUs (Linux)
  ansible.builtin.slurp: { src: "/sys/devices/system/cpu/{{ item }}" }
  loop: [online, isolated]
  register: github_runner_cpu_files
  # ignored: a missing isolated file is read as none (below); a missing online file leaves no CPU, refused below
  failed_when: false
  when: ansible_facts['system'] == 'Linux'

- name: the CPUs the runners may use (Linux)
  ansible.builtin.set_fact:
    github_runner_cpus_online: "{{ (github_runner_cpu_files.results[0].content | default('') | b64decode) | trim }}"
    github_runner_cpus_isolated: "{{ (github_runner_cpu_files.results[1].content | default('') | b64decode) | trim }}"
  when: ansible_facts['system'] == 'Linux'

- name: some CPU is left to the runners (Linux)
  ansible.builtin.assert:
    quiet: true
    that: github_runner_cpus_isolated == '' or github_runner_cpus | string | length > 0
    fail_msg: >-
      github-runner: {{ inventory_hostname }} isolates CPUs {{ github_runner_cpus_isolated }} of its online
      {{ github_runner_cpus_online or 'none' }}, which leaves its runners no CPU the scheduler balances; run: cat
      /proc/cmdline (on {{ inventory_hostname }}), then leave CPUs outside isolcpus
  when: ansible_facts['system'] == 'Linux'

- name: one url, named with -e github_runner_url
  ansible.builtin.include_tasks: scope.yml
  when: github_runner_url is defined

- name: every runner of the machine record
  ansible.builtin.include_tasks: record.yml
  when: github_runner_url is not defined
