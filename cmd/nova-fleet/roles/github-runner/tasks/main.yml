---
# Installs, registers and supervises GitHub Actions runners on this host (cmd/nova-fleet/README.md, "github-runners").
#
# Without -e github_runner_url (the usual run): the machine record's runner_scopes (the inventory's nova_runner_scopes)
# are the host's runners, every scope's made as scope.yml makes one url's, and every other runner on the host is retired
# (record.yml). With -e github_runner_url: that one url's runners only (scope.yml); the host's other runners are left.

- name: one url, named with -e github_runner_url
  ansible.builtin.include_tasks: scope.yml
  when: github_runner_url is defined

- name: every runner of the machine record
  ansible.builtin.include_tasks: record.yml
  when: github_runner_url is not defined
