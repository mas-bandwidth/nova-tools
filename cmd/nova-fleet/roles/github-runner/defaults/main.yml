---
# Defaults of the github-runner role (cmd/nova-fleet/github-runners.yml). Where the runners register is the machine
# record's runner_scopes (the inventory's nova_runner_scopes: url, count and extra labels per scope); a run for one url
# gives github_runner_url and github_runner_scope instead, with github_runner_labels for the extra labels (may be empty).

# One url (a run with -e): https://github.com/<owner>/<repo> (scope repo) or https://github.com/<org> (scope org).
# No default: without it the run is the record's (tasks/record.yml).
# github_runner_url:
# github_runner_scope: repo | org
github_runner_labels: []
# The labels every runner gets: on Linux and macOS before the machine's roles, os and arch, on the Windows side of a WSL
# machine before its name (github_runner_wsl_labels). A job selects any fleet runner of its os with
# runs-on: [self-hosted, Linux, fleet].
github_runner_base_labels: [fleet]

# present converges the runners; absent retires every runner of this url on the host.
github_runner_state: present

# Runners a host carries: runner_count if given (-e), else the machine row's `runners`.
# No default: a host with neither is refused, so a missing value never reads as 0 and retires
# the runners. 0 is an explicit choice. A host above n has its extra runners (highest numbers
# first) retired.
# runner_count=cores (nova-fleet up's default) sizes each host to its cores: one runner per this
# many (the row's `cores`, else the host's own count), at least 1. A starting value, not measured.
github_runner_cores_per_runner: 4

# The actions/runner release and the digests GitHub publishes for its assets.
github_runner_version: "2.338.2"
github_runner_sha256:
  linux-x64: "baebf204307bac6193480852732f0aba2ae97b6c5597c244f4d5558390147c40"
  linux-arm64: "670adb2f268fe21dcbb58b3db0e0aa9d5b3bddfe2c651481336e561ff86de945"
  osx-x64: "109fff505a34014a7e8d1acb850c33d404811102f572b8fb9788e2fff013cc49"
  osx-arm64: "25a065af409ffa317ab4d5a3b614dd15fc9c40f2172bc1b35a1b1258e919a388"
  win-x64: "a1f17aa987fc8158bc7521d284912267a0d01b7c2c4684b33c86783b5e8221cc"
github_runner_release_url: "https://github.com/actions/runner/releases/download"

# Where a host keeps them: <base>/<owner>-<repo>-<i> (or <org>-<i>), in the runner login's home (github_runner_home).
github_runner_base_dir: "{{ github_runner_home ~ '/actions-runner' }}"
# Where a host keeps the runners' services, read by a run of the record (tasks/record.yml) to find the ones it does not want.
github_runner_unit_dir: "{{ '/Library/LaunchDaemons' if ansible_facts['system'] == 'Darwin' else '/etc/systemd/system' }}"

# The service's environment (Linux and macOS), name: value: the machine record's runner_env (nova-config machine set
# <machine> --runner_env '<json-object>'), which the inventory gives as nova_runner_env; -e github_runner_env replaces
# it for one run.
github_runner_env: "{{ nova_runner_env | default({}) }}"

# A Linux runner's TMPDIR when github_runner_env has none: one directory of the runner login (0700) for all its runners, made
# before the units start. Its jobs' temporary files land there and not in /tmp, and the health play's disk clean reads
# it from the units and removes what is left. A macOS daemon gets none (its jobs use /tmp, which macOS cleans).
github_runner_tmpdir: "{{ github_runner_home }}/.cache/runner-tmp"

# A Linux runner login of its own: its rustup and cargo homes when github_runner_env names none, with the shared SDK's
# pinned toolchains and cargo/bin linked in (tasks/unix-login.yml), so a job's toolchain install writes here.
github_runner_rustup_home: "{{ github_runner_home }}/.rustup"
github_runner_cargo_home: "{{ github_runner_home }}/.cargo"

# The PATH the service starts with when github_runner_env has none; its jobs inherit it, so a step finds the nova
# tools (`nova-reserve run ...`): github_runner_bin_dir first, then the
# system's. Linux: systemd's list and the Debian/Ubuntu login tail runners had before; macOS: Homebrew's prefix
# (/opt/homebrew on Apple silicon, /usr/local on Intel) before the system's, as nova_service_path has it.
# github_runner_bin_dir: nova_bin_dir (group_vars/all.yml, where install.yml puts the tools) for the fleet login's
# runners; a runner login of its own gets root's copies in nova_shared_dir/bin, never a directory of the fleet login's.
github_runner_bin_dir: "{{ nova_bin_dir if github_runner_user == ansible_facts['user_id'] else nova_shared_dir ~ '/bin' }}"
github_runner_default_path_linux: "{{ github_runner_bin_dir }}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin"
github_runner_default_path_darwin: "{{ nova_bin_dir }}:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

# Linux only: run the runner's bin/installdependencies.sh (system packages) once per
# release on the host.
github_runner_install_dependencies: true

# Retiring a runner also removes it from GitHub, with a removal token asked of GitHub by gh on the
# control node; false skips that and leaves the entry for you to delete.
github_runner_deregister: true

# Before a runner is stopped (retired) or restarted onto a changed unit, the job it is running ends (tasks/wait-idle.yml):
# checked every github_runner_idle_delay seconds, this many times (an hour), then the run fails and the runner is left
# running. A job is never cancelled by a run.
github_runner_idle_retries: 240
github_runner_idle_delay: 15

# Runner directories (basenames, e.g. mas-bandwidth-2) held this run: a runner busy with a job nothing can resume
# (a multi-hour model check) is neither waited on nor restarted; its changed file is written and the run says
# RUNNER-HELD, so the restart is owed to a later run. -e '{"github_runner_hold": ["mas-bandwidth-2"]}'
github_runner_hold: []

# gh on the control node, logged in (gh auth login) with admin on the repository or organization:
# it asks GitHub for the registration and removal tokens (tasks/token.yml), and after a run reads
# GitHub's list of runners, every wanted runner online (the RUNNERS receipt); false skips that
# check (the receipt is then not printed).
github_runner_verify: true
github_runner_gh: gh

# The CI rules every runner enforces (cmd/nova-fleet/README.md, "CI rules"): a push, pull_request or merge_group job is stopped
# after this many seconds of job wall time and fails with the rule's line; schedule and workflow_dispatch jobs have no
# limit. One value for the fleet; override it in group_vars or with -e, never per repository.
github_runner_ci_limit_seconds: 120
# The branches a push may run CI on, as globs (tags always may): * and ? stop at a /, so sprint/* is one segment. Any
# other branch gets CI through its pull request. One list for the fleet, like the limit.
github_runner_ci_push_branches: [main, sprint/*]

# ---- The Windows side of a WSL machine (tasks/wsl-windows.yml, the windows-runners play; cmd/nova-fleet/README.md, "Windows
# runners of a WSL machine"). Its runners are the machine record's windows_runners and windows_admin_runners (the
# inventory's nova_windows_runners and nova_windows_admin_runners); these are how they are reached and laid out.
github_runner_wsl_interop: /proc/sys/fs/binfmt_misc/WSLInterop
github_runner_wsl_powershell: /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe
# The scripts the role runs elevated are staged in one directory directly under C:\, made sealed by the role (owned by
# Administrators, nothing inherited, only SYSTEM and Administrators) and proved before every elevated call
# (tasks/wsl-stage.yml, files/stage-check.ps1). Never under C:\ProgramData, where every user may add files to a folder.
# The old stage folders, C:\ProgramData\nova-runner-stage and C:\ProgramData\nova-ci-rules-stage, are never read again.
github_runner_wsl_stage_dir: 'C:\nova-stage'
github_runner_wsl_stage_unix: /mnt/c/nova-stage
github_runner_wsl_script: '{{ github_runner_wsl_stage_dir }}\runner-windows.ps1'
github_runner_wsl_ci_script: '{{ github_runner_wsl_stage_dir }}\nova-ci-rules.ps1'
# A plain Windows host (its record's os is windows; no WSL): the play reaches it over its OpenSSH as an administrator,
# PowerShell as the shell (nova-config's inventory sets ansible_shell_type), stages the same scripts in the same
# directory with tasks/windows-stage.yml and runs them with ansible.windows instead of interop.
github_runner_win_native: "{{ (nova_os | default('') | lower) == 'windows' }}"
github_runner_wsl_base_dir: 'C:\actions-runner'
github_runner_wsl_cache: 'C:\actions-runner\.cache'
# Where admin runners live (windows_admin_runners): <dir>\<owner>-<repo>-<account>, the directory and each runner's made
# sealed by runner-windows.ps1 (SYSTEM and Administrators, and the runner's account on its own). Directly under C:\, not
# under C:\actions-runner or C:\ProgramData, where every user may add a file to a folder (a Directory.Build.targets or
# NuGet.Config there is read by every build below it); C:\ lets them make a folder only, and install refuses a folder
# above this one that any of them may add a file to (ABOVE-OPEN).
github_runner_wsl_admin_dir: 'C:\nova-admin-runners'
# An admin runner's job PATH: the ordinary one without the ccache directory (its jobs run with CCACHE_DISABLE=1).
# runner-windows.ps1 install refuses any entry, or file in one, that NETWORK SERVICE, SERVICE, LOCAL, Authenticated
# Users, Users or Everyone owns or may write.
github_runner_win_admin_path: >-
  {{ github_runner_windows_path | reject('match', '(?i)' ~ (nova_runner_windows_ccache_dir | default('C:\ProgramData\nova\ccache') | regex_escape))
     | list }}
# The folders of the tools an admin runner's build may run outside its PATH, checked as its PATH is: ccache's, and its
# msvc folder, whose cl.exe MSBuild runs when a build sets CLToolPath there (runner-packages seals them).
github_runner_win_admin_tools: '{{ [nova_runner_windows_ccache_dir, nova_runner_windows_ccache_dir ~ ''\msvc''] }}'
# An admin runner's password is opened from this machine's own seat (as services.yml opens a service's keys): the
# machine's nova-secrets, and the exec that hands one --only name to the command after it (the name follows).
github_runner_nova_secrets: "{{ nova_bin_dir }}/nova-secrets"
github_runner_win_secrets_exec: >-
  {{ [github_runner_nova_secrets, 'exec', '--store', nova_secrets_store, '--as', nova_seat,
      '--key', nova_secrets_key_dir ~ '/' ~ nova_seat ~ '.key', '--sops', nova_sops, '--only'] | map('quote') | join(' ') }}
# The keepalive (tasks/wsl-keepalive.yml) finds this distro on the Windows side by its machine-id.
github_runner_wsl_machine_id_file: /etc/machine-id
# The labels every Windows-side runner gets, before the record's extras (GitHub adds self-hosted, X64 and Windows): the
# base labels and the machine's name. Not the machine's roles, os and arch as on Linux: a job that selects [self-hosted, bench] or [self-hosted, amd64]
# must never land on Windows.
github_runner_wsl_labels: "{{ github_runner_base_labels + [inventory_hostname] }}"
# The job PATH each Windows runner's .env and .path carry, so a job sees these and nothing of the machine PATH (console
# SDKs, a second Visual Studio, WSL's System32\bash.exe ahead of Git's). Empty leaves PATH to the service.
github_runner_windows_path:
  - 'C:\Program Files\Git\bin'
  - 'C:\Program Files\Git\cmd'
  - 'C:\Program Files\Python39'
  - 'C:\Program Files\Python39\Scripts'
  - 'C:\Program Files\CMake\bin'
  - 'C:\Program Files\PowerShell\7'
  - 'C:\Program Files\dotnet'
  - 'C:\Program Files\Go\bin'
  - 'C:\Windows\System32'
  - 'C:\Windows'
  - 'C:\Windows\System32\Wbem'
  - 'C:\Windows\System32\WindowsPowerShell\v1.0'
  - 'C:\Windows\System32\OpenSSH'
