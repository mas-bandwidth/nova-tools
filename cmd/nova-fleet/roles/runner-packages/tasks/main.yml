---
# The runner-packages role (cmd/nova-fleet/runner-packages.yml): nova_runner_packages[<os>] on the machine, packages only. Each
# OS's file registers what is present (rp_present) and what is missing (rp_missing) first, and installs only
# rp_missing; nothing is started, enabled or upgraded. On Debian/Ubuntu, debian-arch.yml enables the foreign
# architectures that list may name packages of first, and debian-vm-kernel.yml keeps the VM tier's kernel image after.
- name: the platform and the packages it wants
  ansible.builtin.set_fact:
    rp_os: "{{ 'windows' if ansible_facts['os_family'] == 'Windows' else ('darwin' if (nova_system | default(ansible_facts['system'])) == 'Darwin' else ('debian' if ansible_facts['os_family'] == 'Debian' else 'other')) }}"

- name: the wanted list
  ansible.builtin.set_fact:
    rp_wanted: "{{ nova_runner_packages[rp_os] | default([]) }}"
    rp_present: []
    rp_missing: []
    rp_installed: 0

- name: a platform this play installs on
  ansible.builtin.assert:
    that: rp_os in ['darwin', 'debian'] or rp_wanted | length == 0
    fail_msg: "{{ inventory_hostname }} is {{ ansible_facts['os_family'] }}: runner-packages installs on macOS (brew) and Debian/Ubuntu (apt); nova_runner_packages.{{ rp_os }} lists {{ rp_wanted | join(', ') }}"
    quiet: true

- name: the packages (macOS)
  ansible.builtin.include_tasks: darwin.yml
  when: rp_os == 'darwin' and rp_wanted | length > 0

- name: the foreign architectures (Ubuntu)
  ansible.builtin.include_tasks: debian-arch.yml
  when: rp_os == 'debian' and nova_runner_foreign_architectures | length > 0

- name: the packages (Debian, Ubuntu)
  ansible.builtin.include_tasks: debian.yml
  when: rp_os == 'debian' and rp_wanted | length > 0

- name: a WSL machine (no /boot kernel image, no kvm)
  ansible.builtin.stat: { path: /proc/sys/fs/binfmt_misc/WSLInterop, get_checksum: false }
  register: rp_wsl
  when: rp_os == 'debian' and nova_runner_vm_kernel | bool

- name: the kernel image a VM of the host's own kernel boots (Debian, Ubuntu; not WSL)
  ansible.builtin.include_tasks: debian-vm-kernel.yml
  when: rp_os == 'debian' and nova_runner_vm_kernel | bool and not rp_wsl.stat.exists

- name: the Windows side of a WSL machine with Windows runners (ccache for MSVC)
  ansible.builtin.include_tasks: windows-ccache.yml
  vars:
    rp_win_ccache_unix: "{{ nova_runner_windows_ccache_unix }}"
    # icacls from the WSL login (the elevated Windows account): owner Administrators throughout; on the directory nothing
    # inherited, the grants below and nothing for the accounts jobs run as (NETWORK SERVICE, SERVICE, LOCAL, Everyone,
    # CREATOR OWNER); everything in it reset to inherit only that. SEAL ok|changed, compared on icacls' own listing.
    rp_win_ccache_seal: |
      set -eu -o pipefail
      ic=/mnt/c/Windows/System32/icacls.exe
      d={{ nova_runner_windows_ccache_dir | quote }}
      before=$("$ic" "$d" /T /C /Q 2>&1 | tr -d '\r' | md5sum)
      "$ic" "$d" /setowner '*S-1-5-32-544' /T /C /Q >/dev/null
      "$ic" "$d" /inheritance:r /grant:r '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F' '*S-1-5-11:(OI)(CI)RX' '*S-1-5-32-545:(OI)(CI)RX' /Q >/dev/null
      "$ic" "$d" /remove:g '*S-1-5-20' '*S-1-5-6' '*S-1-2-0' '*S-1-1-0' '*S-1-3-0' /Q >/dev/null
      if [ -n "$(ls -A {{ nova_runner_windows_ccache_unix | quote }})" ]; then "$ic" "$d\\*" /reset /T /C /Q >/dev/null; fi
      after=$("$ic" "$d" /T /C /Q 2>&1 | tr -d '\r' | md5sum)
      if [ "$before" = "$after" ]; then echo 'SEAL ok'; else echo 'SEAL changed'; fi
  when: rp_os == 'debian' and ((nova_windows_runners | default([]) + nova_windows_admin_runners | default([])) | length > 0) and nova_runner_windows_ccache.version | default('') | length > 0

- name: the receipt
  ansible.builtin.debug:
    msg: "RUNNER-PACKAGES host={{ inventory_hostname }} wanted={{ rp_wanted | length }} present={{ rp_present | length }} installed={{ rp_installed }}"
  changed_when: false
