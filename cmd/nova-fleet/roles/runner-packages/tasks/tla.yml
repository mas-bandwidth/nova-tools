---
# Debian, Ubuntu: TLC's jar at nova_runner_tla_jar (root's, 0644, in a root 0755 directory, so the fleet login and a
# runner login of its own both read it), run by the Java runtime of the debian list. The jar is checked against
# nova_runner_tla_jar_sha256 by its sha256. A jar already there and matching is left as it is; one that differs is
# refused by name, never replaced. A missing one is downloaded from nova_runner_tla_jar_url, the TLA+ release,
# and get_url refuses a download whose sha256 is not the pin before it is moved into place.
- name: the TLC jar on the machine
  ansible.builtin.stat:
    path: "{{ nova_runner_tla_jar }}"
    follow: true   # a link to the pinned jar is the pinned jar
    get_checksum: true
    checksum_algorithm: sha256
  register: rp_tla
  check_mode: false

- name: a jar that differs from the pin is refused, never replaced
  ansible.builtin.fail:
    msg: >-
      TLA-JAR-MISMATCH host={{ inventory_hostname }} path={{ nova_runner_tla_jar }} want={{ nova_runner_tla_jar_sha256 }}
      got={{ rp_tla.stat.checksum | default('unreadable-or-not-a-file') }}; nothing was written. Check which jar it is, remove it,
      run: nova-fleet runner-packages -- -l {{ inventory_hostname }}
  when: rp_tla.stat.exists and (not rp_tla.stat.isreg or rp_tla.stat.checksum | default('') != nova_runner_tla_jar_sha256)

- name: would download the jar
  ansible.builtin.debug:
    msg: "TLA-JAR WOULD-DOWNLOAD host={{ inventory_hostname }} from={{ nova_runner_tla_jar_url }} {{ nova_runner_tla_jar }} sha256={{ nova_runner_tla_jar_sha256 }}"
  changed_when: true
  when: ansible_check_mode and not rp_tla.stat.exists

- name: the jar, from the TLA+ release
  when: not ansible_check_mode and not rp_tla.stat.exists
  block:
    - name: the jar's directory (root's, readable by every login)
      ansible.builtin.file:
        path: "{{ nova_runner_tla_jar | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      become: true

    # beside the jar, so the copy below is a move on one file system; get_url refuses a download that is not the pin
    - name: the jar downloaded beside its place, checked against the pin
      ansible.builtin.get_url:
        url: "{{ nova_runner_tla_jar_url }}"
        dest: "{{ nova_runner_tla_jar }}.download"
        checksum: "sha256:{{ nova_runner_tla_jar_sha256 }}"
        owner: root
        group: root
        mode: "0644"
      become: true

    - name: the jar (root's, readable by every login), never over a file that appeared since the check
      ansible.builtin.copy:
        src: "{{ nova_runner_tla_jar }}.download"
        dest: "{{ nova_runner_tla_jar }}"
        remote_src: true
        force: false
        owner: root
        group: root
        mode: "0644"
      become: true
  always:
    - name: the download removed
      ansible.builtin.file: { path: "{{ nova_runner_tla_jar }}.download", state: absent }
      become: true

- name: the jar's receipt
  ansible.builtin.debug:
    msg: >-
      TLA-JAR host={{ inventory_hostname }} {{ 'present' if rp_tla.stat.exists else ('WOULD-DOWNLOAD' if ansible_check_mode else 'downloaded') }}
      {{ nova_runner_tla_jar }} sha256={{ nova_runner_tla_jar_sha256 }}
  changed_when: false
