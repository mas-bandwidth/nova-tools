# purpose: each machine's seat in the secrets store
#
# seat.yml: each machine's seat in the secrets store (cmd/nova-fleet/README.md, "seat.yml"). The seat is nova_seat (the machine's
# inventory name unless a host variable says otherwise), the name nova-secrets --as and services.yml open it by.
#
#   1. on the machine: the seat key <nova_secrets_key_dir>/<seat>.key made by age-keygen where it is missing, never over
#      an existing file and never copied; only its public half leaves the machine.
#   2. on the control node, in the store clone nova_seal_store (each machine's task delegated there, one at a time):
#      where .sops.yaml has no rule for the seat,
#      `nova-secrets seat add <seat> <public half> --store <clone>`, which writes the rule and commits it. A rule that
#      names another key (a rebuilt machine's old seat) stops the run by name: replacing a seat is a person's call.
#      The public half is also pinned outside the store, nova_seal_pins/<seat>.pub, the key `nova-secrets grant`
#      seals to, checked before the rule is committed; a pin that names another key stops the run the same way.
#      Pushing the commit, and setting the seat's values with nova-secrets set, are the operator's; join.yml grants
#      the fleet values into the seat and pushes the store to the machine.
#
#   nova-fleet seat --check --diff -- -l <machine> -e nova_seal_store=<store clone>
#   nova-fleet seat -- -l <machine> -e nova_seal_store=<store clone>
- name: the seat key, made on the machine, and its rule in the store
  hosts: "{{ nova_join_host | default('all') }}"
  gather_facts: true
  gather_subset: [min]
  tasks:
    - name: the store clone is given
      ansible.builtin.assert:
        that: nova_seal_store is defined and nova_seal_store | length > 0
        fail_msg: "SEAT STOP: -e nova_seal_store=<the control node's clone of the secrets store> (cmd/nova-fleet/README.md, \"seat.yml\")"
        quiet: true

    - name: the control node has what the run needs
      ansible.builtin.include_role: { name: preflight }
      vars:
        preflight_control: "{{ [{'cmd': nova_control_secrets, 'for': 'the seat rule: nova-secrets seat add', 'v2': true}, {'cmd': 'git', 'for': 'nova-secrets commits the store'}] }}"

    - name: an age-keygen on the machine
      ansible.builtin.command: "{{ nova_age_keygen }} --version"
      register: seat_keygen_version
      changed_when: false
      failed_when: false
      check_mode: false

    - name: age-keygen is there (join.yml installs it on Linux, brew install age on macOS)
      ansible.builtin.assert:
        that: seat_keygen_version.rc == 0 or ansible_check_mode
        fail_msg: "SEAT STOP {{ inventory_hostname }}: no {{ nova_age_keygen }} on the machine (nova_age_keygen); install age, then run again"
        quiet: true

    - name: the key directory (private)
      ansible.builtin.file: { path: "{{ nova_secrets_key_dir }}", state: directory, mode: "0700" }

    - name: "the seat key {{ nova_seat }}, made here where it is missing (the private half never leaves this machine)"
      ansible.builtin.command:
        argv: ["{{ nova_age_keygen }}", -o, "{{ nova_secrets_key_dir }}/{{ nova_seat }}.key"]
        creates: "{{ nova_secrets_key_dir }}/{{ nova_seat }}.key"
      register: seat_keygen

    - name: the key is private
      ansible.builtin.file: { path: "{{ nova_secrets_key_dir }}/{{ nova_seat }}.key", mode: "0600" }
      when: not (ansible_check_mode and seat_keygen is changed)

    - name: the seat's public half (age-keygen -y; public only)
      ansible.builtin.shell: |
        k="{{ nova_secrets_key_dir }}/{{ nova_seat }}.key"
        [ -e "$k" ] || exit 0   # only in --check, where the key is not made yet; the next task refuses it otherwise
        "{{ nova_age_keygen }}" -y "$k"
      args: { executable: /bin/bash }
      register: seat_pub_read
      changed_when: false
      failed_when: false
      check_mode: false

    - name: the seat key is an age key age-keygen can read
      ansible.builtin.fail:
        msg: >-
          SEAT STOP {{ inventory_hostname }}: `{{ nova_age_keygen }} -y {{ nova_secrets_key_dir }}/{{ nova_seat }}.key` gave no
          public key{{ (': ' ~ (seat_pub_read.stderr_lines | first)) if seat_pub_read.stderr_lines else ' (no key file)' }}.
          An empty or cut-off key file is never replaced by the play; check it on the machine, move it aside if it is not
          a seat key, and run again (a new key is made where none is).
      when: >-
        seat_pub_read.rc != 0 or (not (seat_pub_read.stdout | trim) is match('^age1') and not ansible_check_mode)

    - name: the public half
      ansible.builtin.set_fact:
        seat_pub: "{{ seat_pub_read.stdout | trim }}"

    - name: the key's receipt
      ansible.builtin.debug:
        msg: "SEAT PUB {{ nova_seat }} {{ seat_pub if seat_pub is match('^age1') else ('WOULD-MAKE (check: nothing changed)' if ansible_check_mode else 'none') }}"

    # ---- the rule, on the control node, for this machine (so -l <machine> adds it too) ----
    - name: the store's rules (control node)
      ansible.builtin.slurp: { src: "{{ nova_seal_store }}/.sops.yaml" }
      delegate_to: localhost
      become: false
      register: seat_sops_yaml

    # nova-secrets seat add writes one rule per seat: path_regex ^<seat>\.yaml$, age "<seat key>,<recovery key>"
    - name: this seat's rule, and what it would take
      ansible.builtin.set_fact:
        seat_state: >-
          {%- set rules = ((seat_sops_yaml.content | b64decode | from_yaml) or {}).get('creation_rules') or [] -%}
          {%- set rule = rules | selectattr('path_regex', 'defined') | selectattr('path_regex', 'equalto', '^' ~ nova_seat ~ '\\.yaml$') | list -%}
          {%- set have = ((rule | first).get('age', '') | string).split(',') | first | trim if rule else '' -%}
          {{ 'present' if (rule and have == seat_pub) else ('differs' if rule else ('add' if seat_pub is match('^age1') else 'no-key')) }}

    - name: a rule that names another key is a person's to replace
      ansible.builtin.fail:
        msg: >-
          SEAT STOP {{ inventory_hostname }}: .sops.yaml in {{ nova_seal_store }} has a rule for {{ nova_seat }} with another
          key (a rebuilt machine?); this machine's key is {{ seat_pub }}. Remove the old rule by hand, commit, and run again.
      when: seat_state == 'differs'

    # ---- the pin, on the control node: the key grant seals to, outside the store ----
    - name: the pin directory (control node, private to its user)
      ansible.builtin.file: { path: "{{ nova_seal_pins }}", state: directory, mode: "0700" }
      delegate_to: localhost
      become: false
      when: seat_pub is match('^age1')

    - name: is this seat pinned (control node)
      ansible.builtin.stat: { path: "{{ nova_seal_pins }}/{{ nova_seat }}.pub" }
      delegate_to: localhost
      become: false
      register: seat_pin_file
      when: seat_pub is match('^age1')

    - name: this seat's pin now (control node)
      ansible.builtin.slurp: { src: "{{ nova_seal_pins }}/{{ nova_seat }}.pub" }
      delegate_to: localhost
      become: false
      register: seat_pin
      when: seat_pub is match('^age1') and seat_pin_file.stat.exists

    - name: a pin that names another key is a person's to replace
      ansible.builtin.fail:
        msg: >-
          SEAT STOP {{ inventory_hostname }}: {{ nova_seal_pins }}/{{ nova_seat }}.pub pins another key (a rebuilt machine?);
          this machine's key is {{ seat_pub }}. Check the machine, remove the pin by hand, and run again.
      when: seat_pin.content is defined and (seat_pin.content | b64decode | trim) != seat_pub

    - name: the seat's key, pinned (control node)
      ansible.builtin.copy:
        content: "{{ seat_pub }}\n"
        dest: "{{ nova_seal_pins }}/{{ nova_seat }}.pub"
        mode: "0600"
      delegate_to: localhost
      become: false
      when: seat_pub is match('^age1') and seat_pin.content is not defined

    - name: the seat's rule, added and committed (control node, one machine at a time)
      ansible.builtin.command:
        argv: ["{{ nova_control_secrets }}", seat, add, "{{ nova_seat }}", "{{ seat_pub }}", --store, "{{ nova_seal_store }}"]
      delegate_to: localhost
      become: false
      throttle: 1
      when: seat_state == 'add'

    - name: the seat's receipt
      ansible.builtin.debug:
        msg: >-
          SEAT {{ nova_seat }} host={{ inventory_hostname }} rule={{ {'present': 'present', 'add': ('WOULD-ADD' if ansible_check_mode else 'ADDED'),
          'no-key': 'none (no key on the machine yet)'}[seat_state] }}
          pin={{ 'none' if not seat_pub is match('^age1') else ('present' if seat_pin.content is defined else ('WOULD-ADD' if ansible_check_mode else 'ADDED')) }}{{ (' (check: nothing written)' if ansible_check_mode else
          '; next: nova-secrets grant NAME --to ' ~ nova_seat ~ ' --pins ' ~ nova_seal_pins ~ ' from the control seat (join.yml does it), then the push')
          if seat_state == 'add' else '' }}
