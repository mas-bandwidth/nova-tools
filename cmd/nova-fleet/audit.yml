# purpose: checks every Linux bench and runner against runner-requirements.tsv, as the runner login; read-only, fails by name on a gap
#
# audit.yml: each requirement of runner-requirements.tsv (cmd/nova-fleet/README.md, "audit") checked on each Linux
# machine of the bench and runner groups, as the login CI jobs run as: github_runner_user where that login exists
# (ghrunner), else the fleet login, with the PATH a runner's jobs start with and that login's HOME. Read-only: it writes
# nothing but the nova-reserve probe's temporary directory, removed after, under --check or not. Per machine, one line per requirement missing:
#   FLEET-AUDIT MISSING host=<machine> item=<name> install=<play> check=<command>
# one per requirement declared for another architecture (FLEET-AUDIT NOT-APPLICABLE), one where the locked-memory limit
# of the fleet login's ssh session, of a nova-reserve command and of the runners differ or are below nova_login_memlock
#   FLEET-AUDIT MISSING host=<machine> item=memlock ssh=<v> reserve=<v> runner=<v> need=<v> install=<plays>
# then
#   FLEET-AUDIT host=<machine> login=<login> arch=<arch> ok=<n> missing=<n> not-applicable=<n>
# and a machine with anything missing fails: FLEET-AUDIT FAILED host=<machine> missing=<names>. A machine that is not
# Linux prints FLEET-AUDIT SKIPPED and is not failed (the file covers Linux).
#
#   nova-fleet audit -- -l <machine>
- name: the fleet's runner requirements, checked as the runner login
  hosts: "{{ ('bench:runner:&' ~ nova_join_host) if nova_join_host is defined else 'bench:runner' }}"   # join: the machine joining, when it is a bench or runner
  gather_facts: true
  gather_subset: [min]
  vars:
    # the requirements file: the one beside this play, unless -e nova_audit_requirements=<file> names another
    nova_audit_requirements: "{{ playbook_dir }}/runner-requirements.tsv"
    audit_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64', 'arm64': 'arm64'}.get(ansible_facts['architecture'], ansible_facts['architecture']) }}"
    audit_wsl: "{{ 'microsoft' in (ansible_facts['kernel'] | lower) }}"
    audit_lines: "{{ lookup('ansible.builtin.file', nova_audit_requirements).splitlines() | reject('match', '^(#|\\s*$)') | list }}"
  tasks:
    # a fresh connection, so groups a play just gave the login (kvm) count, as they do for a runner started after it
    - name: a fresh connection to the machine
      ansible.builtin.meta: reset_connection

    - name: a machine that is not Linux
      ansible.builtin.debug:
        msg: "FLEET-AUDIT SKIPPED host={{ inventory_hostname }} os={{ ansible_facts['system'] }} (runner-requirements.tsv covers Linux)"
      when: ansible_facts['system'] != 'Linux'

    - name: only Linux is audited
      ansible.builtin.meta: end_host
      when: ansible_facts['system'] != 'Linux'

    - name: every requirement has its four fields, and an arch of any, amd64 or arm64 (with not-wsl, vm-tier)
      ansible.builtin.assert:
        that:
          - (item.split('\t') | length) == 4 and (item.split('\t') | map('trim') | select | list | length) == 4
          - item.split('\t')[1].split(',') | difference(['any', 'amd64', 'arm64', 'not-wsl', 'vm-tier']) | length == 0
          - item.split('\t')[1].split(',') | intersect(['any', 'amd64', 'arm64']) | length > 0
        fail_msg: >-
          FLEET-AUDIT BAD-LINE {{ item }}: runner-requirements.tsv takes name, arch, install and check, tab-separated, the arch
          any, amd64 or arm64 or a comma list of them, with not-wsl and vm-tier
        quiet: true
      loop: "{{ audit_lines }}"
      run_once: true

    - name: the requirements
      ansible.builtin.set_fact:
        audit_items: >-
          {%- set out = [] -%}
          {%- for l in audit_lines -%}
          {%- set f = l.split('\t') -%}
          {%- set a = f[1].split(',') -%}
          {%- set applies = ('any' in a or audit_arch in a) and not ('not-wsl' in a and audit_wsl)
                      and not ('vm-tier' in a and not (nova_runner_vm_kernel | bool)) -%}
          {%- set _ = out.append({'name': f[0], 'arch': a, 'install': f[2], 'check': f[3], 'applies': applies}) -%}
          {%- endfor -%}
          {{ out }}

    - name: the login CI jobs run as
      ansible.builtin.getent: { database: passwd, key: "{{ github_runner_user }}", fail_key: false }
      check_mode: false

    - name: the login, and its home
      ansible.builtin.set_fact:
        audit_login: "{{ github_runner_user if ansible_facts['getent_passwd'][github_runner_user] else ansible_facts['user_id'] }}"
        audit_home: "{{ ansible_facts['getent_passwd'][github_runner_user][4] if ansible_facts['getent_passwd'][github_runner_user] else ansible_facts['user_dir'] }}"

    # the PATH a runner unit starts its jobs with (roles/github-runner): the machine record's own, or the bin directory
    # of that login's tools (the fleet login's, or root's shared copies for a login of its own) before the system's
    - name: the runner's PATH
      ansible.builtin.set_fact:
        audit_path: >-
          {{ (nova_runner_env | default({})).get('PATH')
             or ((nova_bin_dir if audit_login == ansible_facts['user_id'] else nova_shared_dir ~ '/bin')
                 ~ ':/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin') }}

    - name: the requirements that apply here, and those declared for elsewhere
      ansible.builtin.set_fact:
        audit_here: "{{ audit_items | selectattr('applies') | list }}"
        audit_elsewhere: "{{ audit_items | rejectattr('applies') | list }}"

    # each check in its own bash, with no input, bounded; the lines name the requirement by its place in audit_here
    - name: every requirement for this architecture, checked as the login
      ansible.builtin.command:
        argv: >-
          {{ ([] if audit_login == ansible_facts['user_id'] else ['sudo', '-n', '-u', audit_login])
             + ['/usr/bin/env', '-i', 'PATH=' ~ audit_path, 'HOME=' ~ audit_home, 'USER=' ~ audit_login, 'LANG=C.UTF-8', 'bash', '-s'] }}
        stdin: |
          cd "$HOME" || cd /
          {% for r in audit_here %}
          if timeout 120 bash -c {{ r.check | quote }} >/dev/null 2>&1 </dev/null; then echo "OK {{ loop.index0 }}"; else echo "MISSING {{ loop.index0 }}"; fi
          {% endfor %}
      register: audit_run
      changed_when: false
      failed_when: false   # a run that could not start (sudo refused) is named by the answer count below
      check_mode: false

    - name: what is missing
      ansible.builtin.set_fact:
        audit_missing: >-
          {{ audit_run.stdout_lines | select('match', '^MISSING [0-9]+$') | map('regex_replace', '^MISSING ', '') | map('int')
             | map('extract', audit_here) | list }}
        audit_ok: "{{ audit_run.stdout_lines | select('match', '^OK [0-9]+$') | list | length }}"

    - name: every requirement has an answer
      ansible.builtin.assert:
        that: (audit_ok | int) + (audit_missing | length) == (audit_here | length)
        fail_msg: "FLEET-AUDIT FAILED host={{ inventory_hostname }}: {{ audit_here | length }} checks, {{ (audit_ok | int) + (audit_missing | length) }} answered (rc={{ audit_run.rc }}: {{ audit_run.stderr | default('') | trim }})"
        quiet: true

    - name: each requirement missing
      ansible.builtin.debug:
        msg: "FLEET-AUDIT MISSING host={{ inventory_hostname }} item={{ item.name }} install={{ item.install }} check={{ item.check }}"
      loop: "{{ audit_missing }}"
      loop_control: { label: "{{ item.name }}" }

    - name: each requirement declared for another architecture
      ansible.builtin.debug:
        msg: "FLEET-AUDIT NOT-APPLICABLE host={{ inventory_hostname }} item={{ item.name }} arch={{ audit_arch }}{{ ',wsl' if audit_wsl else '' }} declared={{ item.arch | join(',') }}"
      loop: "{{ audit_elsewhere }}"
      loop_control: { label: "{{ item.name }}" }

    # ---- memlock: an io_uring step locks the same in CI, on a bench over ssh and under nova-reserve ----
    # Read as the fleet login over this play's own ssh session (sshd's PAM session gives it pam_limits' lines, as any
    # ssh login): the session's limit, that of a command nova-reserve starts (in a directory of its own, so it takes
    # none of the machine's slots and waits for none), and the runners': each github-runner unit's LimitMEMLOCK and each
    # running Runner.Listener's /proc/<pid>/limits. Read only; soft/hard in bytes, or unlimited.
    - name: the locked-memory limits of ssh, nova-reserve and the runners
      ansible.builtin.command:
        argv: [bash, -s]
        stdin: |
          norm() { case "$1" in unlimited|infinity) echo unlimited ;; ''|*[!0-9]*) echo "unreadable" ;; *) echo $(( $1 * ${2:-1} )) ;; esac; }
          echo "SSH $(norm "$(ulimit -Sl)" 1024)/$(norm "$(ulimit -Hl)" 1024)"
          r={{ nova_bin_dir | quote }}/nova-reserve
          if [ -x "$r" ]; then
            d=$(mktemp -d)
            out=$("$r" run --dir "$d" --wait 60s --why fleet-audit-memlock -- sh -c 'echo "$(ulimit -Sl) $(ulimit -Hl)"' 2>/dev/null </dev/null) || out=
            rm -rf "$d"
            set -- $out
            if [ $# -eq 2 ]; then echo "RESERVE $(norm "$1" 1024)/$(norm "$2" 1024)"; else echo "RESERVE failed"; fi
          else
            echo "RESERVE absent"
          fi
          for u in $(systemctl list-units --type=service --all --plain --no-legend 'github-runner-*' 2>/dev/null | awk '$2 == "loaded" {print $1}'); do
            echo "RUNNER $(norm "$(systemctl show -p LimitMEMLOCKSoft --value "$u")")/$(norm "$(systemctl show -p LimitMEMLOCK --value "$u")") unit=$u"
          done
          for p in $(pgrep -f '/bin/Runner\.Listener( |$)'); do
            l=$(awk '/^Max locked memory/ {print $4, $5}' "/proc/$p/limits" 2>/dev/null)
            set -- $l
            [ $# -eq 2 ] && echo "RUNNER $(norm "$1")/$(norm "$2") pid=$p"
          done
          true
      register: audit_memlock_run
      changed_when: false
      check_mode: false
      when: nova_audit_memlock | default(true) | bool

    - name: the limits, against nova_login_memlock
      ansible.builtin.set_fact:
        audit_memlock: >-
          {%- set need = 'unlimited' if (nova_login_memlock | string) in ['unlimited', 'infinity'] else (nova_login_memlock | human_to_bytes | string) -%}
          {%- set lines = audit_memlock_run.stdout_lines -%}
          {%- set ssh = lines | select('match', '^SSH ') | map('regex_replace', '^SSH ', '') | first | default('unreadable') -%}
          {%- set reserve = lines | select('match', '^RESERVE ') | map('regex_replace', '^RESERVE ', '') | first | default('failed') -%}
          {%- set runner = lines | select('match', '^RUNNER ') | map('regex_replace', '^RUNNER (\\S+).*$', '\\1') | unique | list -%}
          {%- set ns = namespace(pairs=[['ssh', ssh], ['reserve', reserve]], low=[]) -%}
          {%- for v in runner -%}{%- set ns.pairs = ns.pairs + [['runner', v]] -%}{%- endfor -%}
          {%- for p in ns.pairs -%}
          {%- for half in (p[1].split('/') if '/' in p[1] else [p[1], p[1]]) -%}
          {%- if half != 'unlimited' and (need == 'unlimited' or not (half is match('^[0-9]+$')) or (half | int) < (need | int)) -%}
          {%- set ns.low = ns.low + [p[0]] -%}
          {%- endif -%}
          {%- endfor -%}
          {%- endfor -%}
          {%- set values = ([ssh, reserve] + runner) | unique | list -%}
          {{ {'need': need ~ '/' ~ need, 'ssh': ssh, 'reserve': reserve, 'runner': (runner | join(',')) or 'none',
              'low': ns.low | unique | list, 'differ': values | length > 1,
              'gap': (ns.low | length > 0) or (values | length > 1)} }}
      when: nova_audit_memlock | default(true) | bool

    - name: memlock missing
      ansible.builtin.debug:
        msg: >-
          FLEET-AUDIT MISSING host={{ inventory_hostname }} item=memlock ssh={{ audit_memlock.ssh }}
          reserve={{ audit_memlock.reserve }} runner={{ audit_memlock.runner }} need={{ audit_memlock.need }}
          install={{ ((['health'] if (audit_memlock.low | intersect(['ssh', 'reserve']) or audit_memlock.differ) else [])
                     + (['github-runners'] if 'runner' in audit_memlock.low else [])) | join(',') }}
      when: audit_memlock is defined and audit_memlock.gap

    - name: every gap, by name
      ansible.builtin.set_fact:
        audit_gaps: "{{ audit_missing | map(attribute='name') | list + (['memlock'] if (audit_memlock is defined and audit_memlock.gap) else []) }}"
        audit_ok_all: "{{ (audit_ok | int) + (1 if (audit_memlock is defined and not audit_memlock.gap) else 0) }}"

    - name: the machine's line
      ansible.builtin.debug:
        msg: >-
          FLEET-AUDIT host={{ inventory_hostname }} login={{ audit_login }} arch={{ audit_arch }} ok={{ audit_ok_all }}
          missing={{ audit_gaps | length }} not-applicable={{ audit_elsewhere | length }}

    # join --check installs nothing before the audit, so there a gap is what the real join would have to install
    - name: a gap a join under --check would install first
      ansible.builtin.debug:
        msg: "FLEET-AUDIT WOULD-FAIL host={{ inventory_hostname }} missing={{ audit_gaps | join(',') }} (join --check installed nothing)"
      when: audit_gaps | length > 0 and ansible_check_mode and nova_join_host is defined

    - name: a machine with a gap fails by name
      ansible.builtin.fail:
        msg: "FLEET-AUDIT FAILED host={{ inventory_hostname }} missing={{ audit_gaps | join(',') }}"
      when: audit_gaps | length > 0 and not (ansible_check_mode and nova_join_host is defined)
