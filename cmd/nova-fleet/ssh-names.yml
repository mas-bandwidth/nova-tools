# purpose: the owner's ssh <machine> by tailnet name from every machine, as root with his agent forwarded, the control node's key (the argument, a .pub) added to each Linux root's authorized_keys; workers locked out (all machines; one asleep or away is reported offline)
# argument: ssh_names_control_key
#
# ssh-names.yml (cmd/nova-fleet/README.md, "ssh-names"). The model: ssh between fleet machines by name is the owner's,
# for his own interactive use. He lands on a Linux machine as root (on a Mac as its login, which is his) with his own
# key, his agent forwarded, and goes on from there by name: the next hop authenticates with the same forwarded agent,
# so his key never leaves his machine. Tailscale SSH is off (the tailscale play): it trusts the machine, not the
# person, so with it on every worker on a tagged machine would get in. Fleet workers (the fleet login on a Linux
# machine) get none of this: no names, no pins, and no key any machine's root accepts.
#
# On each machine, the home it writes to is root's on Linux (/root, by sudo) and the fleet login's on a Mac:
#
#   ~/.ssh/config.d/nova-fleet      one Host block per machine of the inventory: `Host <name> <address>`, HostName the
#                                   record's address (its MagicDNS name), User root (a Mac: its login), ForwardAgent
#                                   yes, and the fleet's known hosts file; on a Mac also AddKeysToAgent yes and
#                                   UseKeychain yes, so the owner's key is in his agent when he forwards it
#   ~/.ssh/nova-fleet.known_hosts   each machine's sshd ed25519 host key (/etc/ssh/ssh_host_ed25519_key.pub), read
#                                   over the play's own host-key-checked connection; a machine offline in this run
#                                   keeps the line the file held
#   ~/.ssh/config                   `Include ~/.ssh/config.d/nova-fleet` as its first line (moved there from elsewhere
#                                   at the top level; through a symlink, the file it names); an Include of it inside a
#                                   Host or Match block is left alone and reported
#
# On a Linux machine the fleet login's home is the workers': what an earlier release wrote there (its
# config.d/nova-fleet, the known hosts file, the Include line) is removed, and none of the files above is written.
#
# The control node's key. The play's argument names the control node's interactive public key file (a .pub, read on
# the control node; the private key is never read). On each Linux machine its line is added to root's
# ~/.ssh/authorized_keys, so the control node and the owner reach root, and to the fleet login's, so the play keeps its
# own way in with Tailscale SSH off (root's access already covers the login's). A line is only ever added, and only
# where no line holds that key already; no line is changed or removed. A new ~/.ssh is made 0700 and a new
# authorized_keys 0600; existing ones keep their modes. A Mac's are left alone.
#
# Before anything is written, the run is refused (nothing written anywhere) on: no control key, a control key file that
# is not a .pub, or one that is not a single public key line (<type> <base64> [comment], no options); a record whose address is not a
# tailnet name (<label>.<tailnet>.ts.net) or an IP, whose user is not a login name, whose os is neither linux nor
# darwin, or whose name nova-config would not take; a machine that answers with no sshd ed25519 key; a write limited
# with -l (every machine's file holds every machine's key; --check takes -l). No private key is ever read.
#
# Then three checks (none under --check; none forwards an agent):
#   CONTROL  from the control node, `ssh -o BatchMode=yes -l <root|the Mac's login> <address> true` to every machine,
#            with the control node's own key and its pinned host keys: each ok or failed
#   WORKERS  on each Linux machine, as the fleet login, the same as root to every other machine: each must be DENIED
#            (sshd's "Permission denied"); one that gets in, or that cannot be told, fails the run; so does an agent
#            reaching the fleet login (SSH_AUTH_SOCK set in the play's own session), which any worker there could use
#   CONFIG   on each machine, as root (a Mac: its login), `ssh -G <name>` for every machine: the user, address and
#            ForwardAgent the file says
# A machine that does not answer the play (a laptop asleep) is reported OFFLINE and skipped, never a failure.
#
#   nova-fleet ssh-names ~/.ssh/<the control node's key>.pub --check --diff
#   nova-fleet ssh-names ~/.ssh/<the control node's key>.pub
- name: the owner's ssh by name, as root with his agent forwarded; workers locked out
  hosts: all
  gather_facts: true
  gather_subset: [min]
  ignore_unreachable: true   # a machine asleep or away is reported offline, not failed
  become: false
  vars:
    ssh_names_include: "Include ~/.ssh/config.d/nova-fleet"
    ssh_names_host_key_default: /etc/ssh/ssh_host_ed25519_key.pub   # a machine's ssh_names_host_key overrides it
    # the machines of the inventory, and those that answered this run's fact gathering
    ssh_names_hosts: "{{ groups['all'] | sort }}"
    ssh_names_online: "{{ ansible_play_hosts_all | map('extract', hostvars) | selectattr('ansible_facts.env', 'defined') | map(attribute='inventory_hostname') | sort }}"
    ssh_names_offline: "{{ ssh_names_hosts | reject('in', ssh_names_online) | list }}"
    ssh_names_macs: "{{ ssh_names_hosts | map('extract', hostvars) | selectattr('nova_os', 'defined') | selectattr('nova_os', 'equalto', 'darwin') | map(attribute='inventory_hostname') | list }}"
    # this machine: a Mac writes its login's home; Linux writes root's, by sudo (ssh_names_root_home and
    # ssh_names_root_sudo are the test's seams)
    ssh_names_mac: "{{ inventory_hostname in ssh_names_macs }}"
    ssh_names_home: "{{ nova_home if ssh_names_mac else (ssh_names_root_home | default('/root')) }}"
    ssh_names_sudo: "{{ not ssh_names_mac and (ssh_names_root_sudo | default(true) | bool) }}"
    ssh_names_known_file: "{{ ssh_names_home }}/.ssh/nova-fleet.known_hosts"
    # the control node's key (the play's argument): read on the control node, and only from a .pub
    ssh_names_control_path: "{{ ssh_names_control_key | default('') | string | expanduser }}"
    ssh_names_control_pub: "{{ ssh_names_control_path is match('.*\\.pub\\Z') }}"
    ssh_names_control_line: "{{ (lookup('file', ssh_names_control_path) | trim) if (ssh_names_control_pub | bool) and ssh_names_control_path is file else '' }}"
    ssh_names_control_blob: "{{ ssh_names_control_line.split(' ')[1] if ssh_names_control_line is match(ssh_names_pubkey_re) else '' }}"
    ssh_names_pubkey_re: '^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp(256|384|521)|sk-ssh-ed25519@openssh\.com|sk-ecdsa-sha2-nistp256@openssh\.com) [A-Za-z0-9+/]+=*( [^\n]*)?\Z'
    # where it goes: root's authorized_keys on Linux, and the fleet login's; nowhere on a Mac
    ssh_names_key_homes: >-
      {{ [] if ssh_names_mac else ([{'who': 'root', 'home': ssh_names_home, 'sudo': ssh_names_sudo | bool}]
         + ([{'who': 'login', 'home': nova_home, 'sudo': false}] if nova_home != ssh_names_home else [])) }}
  tasks:
    - name: a write runs on every machine (each machine's file holds every machine's key)
      ansible.builtin.assert:
        that: ansible_check_mode or (ansible_play_hosts_all | length) == (ssh_names_hosts | length)
        fail_msg: >-
          SSH-NAMES REFUSED -l limits this run to {{ ansible_play_hosts_all | length }} of {{ ssh_names_hosts | length }} machines;
          every machine's known hosts file holds every machine's key, so a write runs on all of them (one asleep is
          skipped on its own); --check takes -l
        quiet: true

    - name: a machine that did not answer is offline in this run
      ansible.builtin.debug:
        msg: "SSH-NAMES {{ inventory_hostname }} OFFLINE (did not answer the play; asleep, away or down) - skipped"
      when: ansible_facts.env is not defined

    - name: an offline machine ends here
      ansible.builtin.meta: end_host
      when: ansible_facts.env is not defined

    - name: the sshd host key this machine presents (its public key; no private key is read)
      ansible.builtin.slurp: { src: "{{ ssh_names_host_key | default(ssh_names_host_key_default) }}" }
      register: ssh_names_key_read
      failed_when: false

    - name: this machine's key as a known hosts entry
      ansible.builtin.set_fact:
        ssh_names_key: "{{ (ssh_names_key_read.content | default('') | b64decode).split()[:2] | join(' ') }}"

    - name: the record and every host key read, checked before anything is written
      ansible.builtin.assert:
        that: ssh_names_refused | length == 0
        fail_msg: "SSH-NAMES REFUSED {{ ssh_names_refused | join('; ') }}"
        quiet: true
      vars:
        ssh_names_refused: >-
          {%- set bad = [] -%}
          {%- set name_re = '^[a-z0-9][a-z0-9-]*\Z' -%}
          {%- set address_re = '^[a-z0-9-]+\.[a-z0-9-]+\.ts\.net\Z' -%}
          {%- set ipv4_re = '^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\Z' -%}
          {%- set ipv6_re = '^[0-9a-f]*:[0-9a-f:]*\Z' -%}
          {%- set user_re = '^[a-z_][a-z0-9_-]*\Z' -%}
          {%- if ssh_names_control_path == '' -%}
          {%-   set _ = bad.append("control key: none given (nova-fleet ssh-names <the control node's public key file, ~/.ssh/<key>.pub>)") -%}
          {%- elif not (ssh_names_control_pub | bool) -%}
          {%-   set _ = bad.append('control key ' ~ ssh_names_control_path ~ ': not a .pub file (give the public key; a private key is never read)') -%}
          {%- elif ssh_names_control_blob == '' -%}
          {%-   set _ = bad.append('control key ' ~ ssh_names_control_path ~ ': not one public key line (<type> <base64> [comment], no options)') -%}
          {%- endif -%}
          {%- for h in ssh_names_hosts -%}
          {%-   set a = hostvars[h].ansible_host | default('') | string -%}
          {%-   set u = hostvars[h].ansible_user | default('') | string -%}
          {%-   set o = hostvars[h].nova_os | default('') | string -%}
          {%-   if h is not match(name_re) -%}
          {%-     set _ = bad.append('machine ' ~ (h | to_json) ~ ' name: not [a-z0-9][a-z0-9-]*, as nova-config takes') -%}
          {%-   endif -%}
          {%-   if a is not match(address_re) and a is not match(ipv4_re) and a is not match(ipv6_re) -%}
          {%-     set _ = bad.append('machine ' ~ h ~ ' address ' ~ (a | to_json) ~ ': not <label>.<tailnet>.ts.net or an IP (nova-config machine set ' ~ h ~ ' --address <its MagicDNS name>)') -%}
          {%-   endif -%}
          {%-   if u is not match(user_re) -%}
          {%-     set _ = bad.append('machine ' ~ h ~ ' user ' ~ (u | to_json) ~ ': not a login name [a-z_][a-z0-9_-]* (nova-config machine set ' ~ h ~ ' --user <login>)') -%}
          {%-   endif -%}
          {%-   if o not in ['linux', 'darwin'] -%}
          {%-     set _ = bad.append('machine ' ~ h ~ ' os ' ~ (o | to_json) ~ ': not linux or darwin (nova-config machine set ' ~ h ~ ' --os <linux|darwin>)') -%}
          {%-   endif -%}
          {%-   if h in ssh_names_online and hostvars[h].ssh_names_key | default('') is not match('^ssh-ed25519 [A-Za-z0-9+/=]+\Z') -%}
          {%-     set _ = bad.append('machine ' ~ h ~ ' host key: none read from ' ~ (hostvars[h].ssh_names_host_key | default(ssh_names_host_key_default))) -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ bad }}

    - name: the files, in root's home (Linux) or the login's (a Mac)
      become: "{{ ssh_names_sudo }}"
      block:
        - name: the .ssh directory as it is
          ansible.builtin.stat: { path: "{{ ssh_names_home }}/.ssh" }
          register: ssh_names_dot_ssh

        - name: a .ssh directory, made 0700 where there is none (an existing one keeps its mode)
          ansible.builtin.file: { path: "{{ ssh_names_home }}/.ssh", state: directory, mode: "0700" }
          when: not ssh_names_dot_ssh.stat.exists

        - name: the directory the play owns
          ansible.builtin.file: { path: "{{ ssh_names_home }}/.ssh/config.d", state: directory, mode: "0700" }

        - name: the fleet's known hosts as this machine holds them
          ansible.builtin.slurp: { src: "{{ ssh_names_known_file }}" }
          register: ssh_names_known_was
          failed_when: false

        - name: the lines kept for machines that did not answer this run
          ansible.builtin.set_fact:
            ssh_names_kept: >-
              {%- set kept = {} -%}
              {%- for line in (ssh_names_known_was.content | default('') | b64decode).splitlines() if line | trim | length > 0 -%}
              {%- set _ = kept.update({line.split(' ')[0].split(',')[0]: line}) -%}
              {%- endfor -%}
              {{ kept }}

        - name: the ssh config of the fleet
          ansible.builtin.template: { src: templates/ssh-names.config.j2, dest: "{{ ssh_names_home }}/.ssh/config.d/nova-fleet", mode: "0600" }
          register: ssh_names_config

        - name: the fleet's host keys
          ansible.builtin.template: { src: templates/ssh-names.known_hosts.j2, dest: "{{ ssh_names_known_file }}", mode: "0600" }
          register: ssh_names_known

        - name: the ssh config of root (Linux) or the login (a Mac)
          ansible.builtin.slurp: { src: "{{ ssh_names_home }}/.ssh/config" }
          register: ssh_names_config_was
          failed_when: false

        - name: where it includes the fleet's (inside a Host or Match block it applies to that block only)
          ansible.builtin.set_fact:
            ssh_names_include_inside: >-
              {%- set ns = namespace(block=false, line=0) -%}
              {%- for line in (ssh_names_config_was.content | default('') | b64decode).split('\n') -%}
              {%-   if line is match('(?i)[ \t]*(host|match)([ \t=]|\Z)') %}{% set ns.block = true %}{% endif -%}
              {%-   if ns.block and not ns.line and line is match('[ \t]*' ~ (ssh_names_include | regex_escape) ~ '[ \t]*\r?\Z') -%}
              {%-     set ns.line = loop.index -%}
              {%-   endif -%}
              {%- endfor -%}
              {{ ns.line }}

        - name: an Include inside a block is left alone
          ansible.builtin.debug:
            msg: >-
              SSH-NAMES {{ inventory_hostname }} INCLUDE LEFT ALONE: line {{ ssh_names_include_inside }} of {{ ssh_names_home }}/.ssh/config
              includes the fleet's file inside a Host or Match block, where it applies to that block only; move it to the
              first line by hand for every fleet name to resolve
          when: ssh_names_include_inside | int > 0

        - name: the Include, first in the ssh config (a Host block above it would swallow it)
          ansible.builtin.copy:
            dest: "{{ ssh_names_home }}/.ssh/config"
            content: "{{ ssh_names_include }}\n{{ ssh_names_rest }}"
            mode: "{{ omit if ssh_names_config_was.content is defined else '0600' }}"
            follow: true   # a ~/.ssh/config that is a symlink (dotfiles) stays one; the file it names is written
          vars:
            ssh_names_rest: "{{ ssh_names_config_was.content | default('') | b64decode | regex_replace('(?m)^[ \\t]*' ~ (ssh_names_include | regex_escape) ~ '[ \\t]*\\r?(\\n|$)', '') }}"
          register: ssh_names_config_include
          when: ssh_names_include_inside | int == 0

    # Linux: the fleet login is the workers'. What an earlier release wrote into its home goes; nothing is written there.
    - name: the workers' home holds none of it (Linux)
      when: not ssh_names_mac and nova_home != ssh_names_home
      block:
        - name: an earlier release's files, removed from the fleet login's home
          ansible.builtin.file: { path: "{{ item }}", state: absent }
          loop:
            - "{{ nova_home }}/.ssh/config.d/nova-fleet"
            - "{{ nova_home }}/.ssh/config.d/nova-fleet.known_hosts"
            - "{{ nova_home }}/.ssh/nova-fleet.known_hosts"
          register: ssh_names_removed_files

        - name: an earlier release's Include, removed from the fleet login's ssh config
          ansible.builtin.lineinfile:
            path: "{{ nova_home }}/.ssh/config"
            regexp: '^[ \t]*{{ ssh_names_include | regex_escape }}[ \t]*\r?$'
            state: absent
          register: ssh_names_removed_include
          failed_when: false   # no ssh config at all is fine

    # Linux: the control node's key in root's authorized_keys and the fleet login's. Added only; nothing else touched.
    - name: the authorized keys each holds now (root's, and the fleet login's)
      ansible.builtin.slurp: { src: "{{ item.home }}/.ssh/authorized_keys" }
      become: "{{ item.sudo }}"
      loop: "{{ ssh_names_key_homes }}"
      loop_control: { label: "{{ item.who }}" }
      register: ssh_names_keys_was
      failed_when: false   # none yet is fine

    - name: the control node's key, added where no line holds it (0600 when the file is new)
      ansible.builtin.lineinfile:
        path: "{{ item.item.home }}/.ssh/authorized_keys"
        line: "{{ ssh_names_control_line }}"
        create: true
        mode: "{{ omit if item.content is defined else '0600' }}"
      become: "{{ item.item.sudo }}"
      loop: "{{ ssh_names_keys_was.results }}"
      loop_control: { label: "{{ item.item.who }}" }
      when: ssh_names_control_blob not in (item.content | default('') | b64decode).split()
      register: ssh_names_key_added

    - name: the receipt
      ansible.builtin.debug:
        msg: >-
          SSH-NAMES {{ inventory_hostname }} as={{ ansible_user if ssh_names_mac else 'root' }} machines={{ ssh_names_hosts | length }}
          online={{ ssh_names_online | length }}
          config={{ (w ~ 'written') if ssh_names_config is changed else 'same' }}
          known_hosts={{ (w ~ 'written') if ssh_names_known is changed else 'same' }}
          include={{ 'inside-a-block' if ssh_names_include_inside | int > 0 else (w ~ 'set') if ssh_names_config_include is changed else 'first' }}
          removed={{ ((ssh_names_removed_files.results | default([]) | select('changed') | list | length) + (1 if ssh_names_removed_include is changed else 0)) or '-' }}
          key-added={{ (w ~ added) if added else '-' }}
          {%- if ansible_check_mode %} (check: nothing changed){% endif %}
      vars:
        w: "{{ 'would-be-' if ansible_check_mode else '' }}"
        added: "{{ ssh_names_key_added.results | default([]) | select('changed') | map(attribute='item.item.who') | join(',') }}"

    # ---- CONFIG: each machine's own ssh reads the names as the file says (no network) ----
    - name: CONFIG, ssh -G for every machine as root (a Mac, its login)
      ansible.builtin.shell: |
        check() {
          g=$(ssh -G "$1" 2>&1) || { echo "wrong $1: $(echo "$g" | tail -n 1)"; return; }
          u=$(echo "$g" | awk '$1 == "user" { print $2 }')
          n=$(echo "$g" | awk '$1 == "hostname" { print $2 }')
          f=$(echo "$g" | awk '$1 == "forwardagent" { print $2 }')
          if [ "$u" = "$2" ] && [ "$n" = "$3" ] && [ "$f" = yes ]; then echo "ok $1"
          else echo "wrong $1: user=$u hostname=$n forwardagent=$f"; fi
        }
        {% for h in ssh_names_hosts %}
        check {{ h | quote }} {{ (hostvars[h].ansible_user if h in ssh_names_macs else 'root') | quote }} {{ hostvars[h].ansible_host | quote }}
        {% endfor %}
      environment: { HOME: "{{ ssh_names_home }}" }
      become: "{{ ssh_names_sudo }}"
      register: ssh_names_config_check
      changed_when: false
      when: not ansible_check_mode

    - name: CONFIG receipt
      ansible.builtin.debug:
        msg: >-
          SSH-NAMES CONFIG {{ inventory_hostname }} ok={{ ssh_names_config_check.stdout_lines | select('match', '^ok ') | list | length }}
          wrong={{ ssh_names_config_check.stdout_lines | select('match', '^wrong ') | map('regex_replace', '^wrong ([^:]*):.*$', '\1') | sort | join(',') or '-' }}
      when: ssh_names_config_check is not skipped

    # ---- WORKERS: the fleet login on a Linux machine gets in as root nowhere ----
    - name: WORKERS, ssh as root to every other machine as the fleet login (each must be denied)
      ansible.builtin.shell: |
        [ -n "$SSH_AUTH_SOCK" ] && echo "agent forwarded to the fleet login: any worker here could use it"
        d=$(mktemp -d)
        {% for h in ssh_names_online | reject('equalto', inventory_hostname) %}
        ( if ssh -n -o BatchMode=yes -o ForwardAgent=no -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -l root {{ hostvars[h].ansible_host | quote }} true >/dev/null 2>"$d/{{ h }}"; then echo "in {{ h }}"
          elif grep -q 'Permission denied' "$d/{{ h }}"; then echo "denied {{ h }}"
          else echo "unproven {{ h }}: $(tail -n 1 "$d/{{ h }}" | tr -s ' \t' '  ')"; fi ) &
        {% endfor %}
        wait
        rm -rf "$d"
      register: ssh_names_workers
      changed_when: false
      when: not ansible_check_mode and not ssh_names_mac

    - name: WORKERS receipt
      ansible.builtin.debug:
        msg: >-
          SSH-NAMES WORKERS {{ inventory_hostname }} denied={{ ssh_names_workers.stdout_lines | select('match', '^denied ') | list | length }}
          got-in={{ ssh_names_workers.stdout_lines | select('match', '^in ') | map('regex_replace', '^in ', '') | sort | join(',') or '-' }}
          unproven={{ ssh_names_workers.stdout_lines | select('match', '^unproven ') | map('regex_replace', '^unproven ([^:]*):.*$', '\1') | sort | join(',') or '-' }}
          agent={{ 'forwarded' if ssh_names_workers.stdout_lines | select('match', '^agent ') | list else '-' }}
      when: ssh_names_workers is not skipped

    # ---- CONTROL: the control node reaches every machine with its own key ----
    - name: CONTROL, ssh from the control node to every machine as root (a Mac, its login)
      ansible.builtin.shell: |
        d=$(mktemp -d)
        {% for h in ssh_names_online %}
        ( if ssh -n -o BatchMode=yes -o ForwardAgent=no -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -l {{ (hostvars[h].ansible_user if h in ssh_names_macs else 'root') | quote }} {{ hostvars[h].ansible_host | quote }} true >/dev/null 2>"$d/{{ h }}"; then echo "ok {{ h }}"
          else echo "failed {{ h }}: $(tail -n 1 "$d/{{ h }}" | tr -s ' \t' '  ')"; fi ) &
        {% endfor %}
        wait
        rm -rf "$d"
      delegate_to: localhost
      run_once: true
      register: ssh_names_control
      changed_when: false
      when: not ansible_check_mode   # ConnectTimeout 10 s is a guess, unmeasured: a tailnet peer answers in well under 1 s

    - name: CONTROL receipt
      ansible.builtin.debug:
        msg: >-
          SSH-NAMES CONTROL ok={{ ssh_names_control.stdout_lines | select('match', '^ok ') | list | length }}
          failed={{ ssh_names_control.stdout_lines | select('match', '^failed ') | map('regex_replace', '^failed ([^:]*):.*$', '\1') | sort | join(',') or '-' }}
          offline={{ ssh_names_offline | join(',') or '-' }}
      run_once: true
      when: ssh_names_control is not skipped

    - name: every check holds
      ansible.builtin.assert:
        that:
          - ssh_names_config_check.stdout_lines | default([]) | select('match', '^wrong ') | list | length == 0
          - ssh_names_workers.stdout_lines | default([]) | reject('match', '^denied ') | list | length == 0
          - ssh_names_control.stdout_lines | default([]) | select('match', '^failed ') | list | length == 0
        fail_msg: >-
          {% set wrong = ssh_names_config_check.stdout_lines | default([]) | select('match', '^wrong ') | list %}
          {% set workers = ssh_names_workers.stdout_lines | default([]) | reject('match', '^denied ') | list %}
          {% set control = ssh_names_control.stdout_lines | default([]) | select('match', '^failed ') | list %}
          {% if wrong %}SSH-NAMES CONFIG {{ inventory_hostname }} FAILED {{ wrong | sort | join('; ') }} (root's ssh does not read the names as written: is the Include first?) {% endif %}
          {% if workers %}SSH-NAMES WORKERS {{ inventory_hostname }} FAILED {{ workers | sort | join('; ') }} (the fleet login must be denied as root everywhere and hold no agent: find the key that let it in, in that machine's /root/.ssh/authorized_keys; an agent comes from an ssh config forwarding one to the play's connection) {% endif %}
          {% if control %}SSH-NAMES CONTROL FAILED {{ control | sort | join('; ') }} (this run put the control key into each Linux root's authorized_keys: is the argument the key this control node uses, and does sshd permit root by key? A Mac: its login's authorized_keys) {% endif %}
        quiet: true
      when: not ansible_check_mode
