# purpose: ssh <machine> by its tailnet name: each login's ssh config and the fleet's host keys from the record, then every machine-to-machine login checked refused and the control node's checked open (all machines; one asleep or away is reported offline)
#
# ssh-names.yml (cmd/nova-fleet/README.md, "ssh-names"). On each machine, as its login and never root:
#
#   ~/.ssh/config.d/nova-fleet      one Host block per machine of the inventory: `Host <name> <address>`, HostName the
#                                   record's address (its MagicDNS name, so the name resolves through MagicDNS and the
#                                   connection travels over the tailnet whatever /etc/hosts maps the short name to),
#                                   User the record's login, and the fleet's known hosts file
#   ~/.ssh/nova-fleet.known_hosts   each machine's ed25519 host key, read from the machine itself over the play's own
#                                   (host-key checked) connection; a machine offline in this run keeps the line the
#                                   file held. Outside config.d, so a login that includes ~/.ssh/config.d/* never
#                                   reads it as config.
#   ~/.ssh/config                   `Include ~/.ssh/config.d/nova-fleet` as its first line (moved there from elsewhere
#                                   at the top level; through a symlink to the file it names); nothing else in the
#                                   file is touched. An Include of it inside a Host or Match block is left alone and
#                                   reported: it applies to that block only, and moving it is the login's call.
#
# Before anything is written, every machine checks the whole record and the keys, and the run is refused (nothing
# written anywhere) on: an address that is not <label>.<the tailnet's MagicDNS suffix> or an IP; a user that is not a
# login name; a host key that differs from every key the tailnet publishes for that machine (`tailscale status` on the
# control node; a machine that does not serve Tailscale SSH publishes none and is reported unchecked); a tailnet that
# cannot be read; a write limited with -l (every machine's file holds every machine's key, so a write runs on all;
# --check takes -l).
#
# ssh takes the first value it reads for each option, so for a fleet name the HostName and User here win over a
# hand-written Host block of the same name below; that block's other options (IdentityFile, HostKeyAlias,
# ControlMaster) still apply. The names say where a machine is; they let no one in. A login from one machine to
# another is refused by design: CI jobs run as a machine's login, which sudoes with no password, so a machine that
# could log in to another would give a job root there. Transfers between machines go through the control node.
#
# Then the checks, never under --check:
#   the mesh       from each machine but the control node (tag:control), `ssh -o BatchMode=yes -o ConnectTimeout=10
#                  -o StrictHostKeyChecking=yes -o UserKnownHostsFile=<the fleet's known hosts> <name> true` to every
#                  other machine online in this run. Each pair must be refused by the far side (sshd's "Permission
#                  denied (publickey...", or Tailscale SSH's "tailnet policy does not permit"); a login that succeeds
#                  fails the run, naming the pair, and so does a host key that does not match the fleet's known hosts
#                  (that refusal is the client's, and says nothing about the far side). A pair that times out, or
#                  fails another way (a local error is no refusal), is reported and does not fail the run.
#   the control    from the control node, `ssh -o BatchMode=yes ... -l <the record's login> <address> true` to every
#                  machine online in this run but itself: each must log in by key, or the run fails naming it. A
#                  machine whose node still publishes host keys still serves Tailscale SSH, which lets in a node and
#                  not a key: it is reported tailscale-ssh and fails the run (run: nova-fleet tailscale).
# A machine that does not answer the play (a laptop asleep or away) is reported OFFLINE and skipped, never a failure.
#
#   nova-fleet ssh-names --check --diff
#   nova-fleet ssh-names
- name: ssh by tailnet name from every machine of the fleet
  hosts: all:!windows   # a plain Windows host (group windows) runs only windows-runners
  gather_facts: true
  gather_subset: [min]
  ignore_unreachable: true   # a machine asleep or away is reported offline, not failed
  become: false
  vars:
    ssh_names_dir: "{{ nova_home }}/.ssh/config.d"
    ssh_names_known_file: "{{ nova_home }}/.ssh/nova-fleet.known_hosts"
    ssh_names_include: "Include ~/.ssh/config.d/nova-fleet"
    ssh_names_host_key_default: /etc/ssh/ssh_host_ed25519_key.pub   # a machine's ssh_names_host_key overrides it
    # the machines of the inventory, those in this run, and those that answered this run's fact gathering
    ssh_names_hosts: "{{ groups['all'] | difference(groups['windows'] | default([])) | sort }}"   # not a plain Windows host (group windows)
    ssh_names_online: "{{ ansible_play_hosts_all | map('extract', hostvars) | selectattr('ansible_facts.env', 'defined') | map(attribute='inventory_hostname') | sort }}"
    ssh_names_offline: "{{ ssh_names_hosts | reject('in', ssh_names_online) | list }}"
    # by the tailnet's node for each machine online: the control node (tag:control: no mesh from it, no control check
    # into it), and the machines that publish no host key (no Tailscale SSH), whose key is written unchecked
    ssh_names_control: >-
      {%- set c = [] -%}
      {%- for h in ssh_names_online if 'tag:control' in (ssh_names_tailnet[hostvars[h].ansible_host] | default({})).tags | default([]) -%}
      {%-   set _ = c.append(h) -%}
      {%- endfor -%}
      {{ c }}
    ssh_names_unchecked: >-
      {%- set c = [] -%}
      {%- for h in ssh_names_online if not (ssh_names_tailnet[hostvars[h].ansible_host] | default({})).hostkeys | default([]) -%}
      {%-   set _ = c.append(h) -%}
      {%- endfor -%}
      {{ c }}
    ssh_names_targets: "{{ ssh_names_online | reject('equalto', inventory_hostname) | list }}"
  tasks:
    - name: a write runs on every machine (each machine's file holds every machine's key)
      ansible.builtin.assert:
        that: ansible_check_mode or (ansible_play_hosts_all | length) == (ssh_names_hosts | length)
        fail_msg: >-
          SSH-NAMES REFUSED -l limits this run to {{ ansible_play_hosts_all | length }} of {{ ssh_names_hosts | length }} machines;
          every machine's known hosts file holds every machine's key, so a write runs on all of them (one asleep is
          skipped on its own); --check takes -l
        quiet: true

    - name: a machine that did not answer is offline in this run
      ansible.builtin.debug:
        msg: "SSH-NAMES {{ inventory_hostname }} OFFLINE (did not answer the play; asleep, away or down) - skipped"
      when: ansible_facts.env is not defined

    - name: an offline machine ends here
      ansible.builtin.meta: end_host
      when: ansible_facts.env is not defined

    - name: the tailnet as the control node sees it (names, tags, published host keys)
      ansible.builtin.command: tailscale status --json
      delegate_to: localhost
      run_once: true
      register: ssh_names_status
      changed_when: false
      failed_when: false
      check_mode: false

    - name: the tailnet can be read
      ansible.builtin.assert:
        that: ssh_names_status.rc == 0 and (ssh_names_status.stdout | from_json).MagicDNSSuffix | default('') | length > 0
        fail_msg: >-
          SSH-NAMES REFUSED the tailnet cannot be read on the control node: `tailscale status --json` said
          {{ ssh_names_status.stderr_lines | default([]) | last | default(ssh_names_status.msg | default('nothing')) }}
          (the record and the host keys are checked against it before anything is written)
        quiet: true

    - name: the host key this machine presents
      ansible.builtin.slurp: { src: "{{ ssh_names_host_key | default(ssh_names_host_key_default) }}" }
      register: ssh_names_key_read
      failed_when: false

    - name: the tailnet's nodes by address, and this machine's key as a known hosts entry
      ansible.builtin.set_fact:
        ssh_names_key: "{{ (ssh_names_key_read.content | default('') | b64decode).split()[:2] | join(' ') }}"
        ssh_names_suffix: "{{ (ssh_names_status.stdout | from_json).MagicDNSSuffix }}"
        ssh_names_tailnet: >-
          {%- set st = ssh_names_status.stdout | from_json -%}
          {%- set nodes = {} -%}
          {%- for n in [st.Self | default({}, true)] + ((st.Peer | default({}, true)).values() | list) -%}
          {%-   for a in [(n.DNSName | default('')).rstrip('.')] + (n.TailscaleIPs | default([], true)) if a -%}
          {%-     set _ = nodes.update({a: {'hostkeys': n.sshHostKeys | default([], true), 'tags': n.Tags | default([], true)}}) -%}
          {%-   endfor -%}
          {%- endfor -%}
          {{ nodes }}

    - name: the record and every host key read, checked before anything is written
      ansible.builtin.assert:
        that: ssh_names_refused | length == 0
        fail_msg: "SSH-NAMES REFUSED {{ ssh_names_refused | join('; ') }}"
        quiet: true
      vars:
        ssh_names_refused: >-
          {%- set bad = [] -%}
          {%- set name_re = '^[a-z0-9][a-z0-9-]*\Z' -%}
          {%- set address_re = '^[a-z0-9-]+\.' ~ (ssh_names_suffix | regex_escape) ~ '\Z' -%}
          {%- set ipv4_re = '^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\Z' -%}
          {%- set ipv6_re = '^[0-9a-f]*:[0-9a-f:]*\Z' -%}
          {%- set user_re = '^[a-z_][a-z0-9_-]*\Z' -%}
          {%- for h in ssh_names_hosts -%}
          {%-   set a = hostvars[h].ansible_host | default('') | string -%}
          {%-   set u = hostvars[h].ansible_user | default('') | string -%}
          {%-   if h is not match(name_re) -%}
          {%-     set _ = bad.append('machine ' ~ (h | to_json) ~ ' name: not [a-z0-9][a-z0-9-]*, as nova-config takes') -%}
          {%-   endif -%}
          {%-   if a is not match(address_re) and a is not match(ipv4_re) and a is not match(ipv6_re) -%}
          {%-     set _ = bad.append('machine ' ~ h ~ ' address ' ~ (a | to_json) ~ ': not <label>.' ~ ssh_names_suffix ~ ' or an IP (nova-config machine set ' ~ h ~ ' --address ' ~ h ~ '.' ~ ssh_names_suffix ~ ')') -%}
          {%-   endif -%}
          {%-   if u is not match(user_re) -%}
          {%-     set _ = bad.append('machine ' ~ h ~ ' user ' ~ (u | to_json) ~ ': not a login name [a-z_][a-z0-9_-]* (nova-config machine set ' ~ h ~ ' --user <login>)') -%}
          {%-   endif -%}
          {%-   if h in ssh_names_online -%}
          {%-     set key = hostvars[h].ssh_names_key | default('') -%}
          {%-     set node = ssh_names_tailnet[a] | default(none) -%}
          {%-     if key is not match('^ssh-ed25519 [A-Za-z0-9+/=]+\Z') -%}
          {%-       set _ = bad.append('machine ' ~ h ~ ' host key: none read from ' ~ (hostvars[h].ssh_names_host_key | default(ssh_names_host_key_default))) -%}
          {%-     elif node is none -%}
          {%-       set _ = bad.append('machine ' ~ h ~ ' address ' ~ a ~ ': no node of the tailnet has it') -%}
          {%-     elif node.hostkeys | length > 0 and key not in node.hostkeys -%}
          {%-       set _ = bad.append('machine ' ~ h ~ ' host key ' ~ key ~ ' is not one the tailnet publishes for ' ~ a ~ ' (' ~ (node.hostkeys | join(', ')) ~ '): not trusted') -%}
          {%-     endif -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ bad }}

    - name: the directory the play owns
      ansible.builtin.file: { path: "{{ ssh_names_dir }}", state: directory, mode: "0700" }

    - name: the fleet's known hosts as this machine holds them
      ansible.builtin.slurp: { src: "{{ ssh_names_known_file }}" }
      register: ssh_names_known_was
      failed_when: false

    - name: the lines kept for machines that did not answer this run
      ansible.builtin.set_fact:
        ssh_names_kept: >-
          {%- set kept = {} -%}
          {%- for line in (ssh_names_known_was.content | default('') | b64decode).splitlines() if line | trim | length > 0 -%}
          {%- set _ = kept.update({line.split(' ')[0].split(',')[0]: line}) -%}
          {%- endfor -%}
          {{ kept }}

    - name: the ssh config of the fleet
      ansible.builtin.template: { src: templates/ssh-names.config.j2, dest: "{{ ssh_names_dir }}/nova-fleet", mode: "0600" }
      register: ssh_names_config

    - name: the fleet's host keys
      ansible.builtin.template: { src: templates/ssh-names.known_hosts.j2, dest: "{{ ssh_names_known_file }}", mode: "0600" }
      register: ssh_names_known

    - name: the login's ssh config
      ansible.builtin.slurp: { src: "{{ nova_home }}/.ssh/config" }
      register: ssh_names_config_was
      failed_when: false

    - name: where the login's ssh config includes the fleet's (inside a Host or Match block it applies to that block only)
      ansible.builtin.set_fact:
        ssh_names_include_inside: >-
          {%- set ns = namespace(block=false, line=0) -%}
          {%- for line in (ssh_names_config_was.content | default('') | b64decode).split('\n') -%}
          {%-   if line is match('(?i)[ \t]*(host|match)([ \t=]|\Z)') %}{% set ns.block = true %}{% endif -%}
          {%-   if ns.block and not ns.line and line is match('[ \t]*' ~ (ssh_names_include | regex_escape) ~ '[ \t]*\r?\Z') -%}
          {%-     set ns.line = loop.index -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ ns.line }}

    - name: an Include inside a block is left alone
      ansible.builtin.debug:
        msg: >-
          SSH-NAMES {{ inventory_hostname }} INCLUDE LEFT ALONE: line {{ ssh_names_include_inside }} of ~/.ssh/config
          includes the fleet's file inside a Host or Match block, where it applies to that block only; move it to the
          first line by hand for every fleet name to resolve
      when: ssh_names_include_inside | int > 0

    - name: the Include, first in the login's ssh config (a Host block above it would swallow it)
      ansible.builtin.copy:
        dest: "{{ nova_home }}/.ssh/config"
        content: "{{ ssh_names_include }}\n{{ ssh_names_rest }}"
        mode: "{{ omit if ssh_names_config_was.content is defined else '0600' }}"
        follow: true   # a ~/.ssh/config that is a symlink (dotfiles) stays one; the file it names is written
      vars:
        ssh_names_rest: "{{ ssh_names_config_was.content | default('') | b64decode | regex_replace('(?m)^[ \\t]*' ~ (ssh_names_include | regex_escape) ~ '[ \\t]*\\r?(\\n|$)', '') }}"
      register: ssh_names_config_include
      when: ssh_names_include_inside | int == 0

    # Every pair must be refused: a login from one machine to another is a CI job's way to root there. Each line is
    # "<outcome> <target>: <ssh's last line>": open (logged in), hostkey (the target's host key is not the fleet's
    # record: a failure, as a machine answering under another's name is), refused (the remote said so: sshd's
    # "Permission denied (publickey...", or Tailscale SSH's "tailnet policy does not permit"; a local "Permission
    # denied", on a file, is not a refusal), timeout, or unreached (any other failure: no route, no sshd, a local error).
    - name: the mesh from this machine (ssh <name> true to every other machine online in this run, each to be refused)
      ansible.builtin.shell: |
        d=$(mktemp -d)
        for h in {{ ssh_names_targets | map('quote') | join(' ') }}; do
          ( if ssh -n -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -o UserKnownHostsFile={{ ssh_names_known_file | quote }} "$h" true >/dev/null 2>"$d/$h"; then o=open
            elif grep -q -e 'Host key verification failed' -e 'REMOTE HOST IDENTIFICATION HAS CHANGED' "$d/$h"; then o=hostkey
            elif grep -q -E -e 'Permission denied \([a-z,-]*publickey' -e 'tailnet policy does not permit' "$d/$h"; then o=refused
            elif grep -q -i 'timed out' "$d/$h"; then o=timeout
            else o=unreached; fi
            echo "$o $h: $(tail -n 1 "$d/$h" | tr -s ' \t' '  ')" ) &
        done
        wait
        rm -rf "$d"
      register: ssh_names_mesh
      changed_when: false
      when: not ansible_check_mode and inventory_hostname not in ssh_names_control   # ConnectTimeout 10 s is a guess, unmeasured: a tailnet peer answers in well under 1 s

    # The way in that stays: the control node logs in to every machine as the record's login, by key (BatchMode: no
    # password, no prompt), with its own known_hosts, where join pinned each machine's key. A machine that publishes
    # host keys on the tailnet still serves Tailscale SSH, which lets the control node in as a node, not by key: its
    # login proves nothing about the key, so it is reported tailscale-ssh and fails.
    - name: the control node logs in to every machine online in this run (ssh -l <login> <address> true)
      ansible.builtin.shell: |
        d=$(mktemp -d)
        {% for h in ssh_names_online | reject('in', ssh_names_control) %}
        {% if h not in ssh_names_unchecked %}
        echo "tailscale-ssh {{ h }}: Tailscale SSH still on (it lets in a node, not a key)"
        {% else %}
        ( if ssh -n -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -l {{ hostvars[h].ansible_user | quote }} {{ hostvars[h].ansible_host | quote }} true >/dev/null 2>"$d/{{ h }}"; then echo "ok {{ h }}"
          else echo "failed {{ h }}: $(tail -n 1 "$d/{{ h }}" | tr -s ' \t' '  ')"; fi ) &
        {% endif %}
        {% endfor %}
        wait
        rm -rf "$d"
      delegate_to: localhost
      run_once: true
      register: ssh_names_control_login
      changed_when: false
      when: not ansible_check_mode

    - name: the receipt
      ansible.builtin.debug:
        msg: >-
          SSH-NAMES {{ inventory_hostname }} machines={{ ssh_names_hosts | length }} online={{ ssh_names_online | length }}
          config={{ (w ~ 'written') if ssh_names_config is changed else 'same' }}
          known_hosts={{ (w ~ 'written') if ssh_names_known is changed else 'same' }}
          include={{ 'inside-a-block' if ssh_names_include_inside | int > 0 else (w ~ 'set') if ssh_names_config_include is changed else 'first' }}
          unchecked={{ ssh_names_online | select('in', ssh_names_unchecked) | join(',') or '-' }}
          {%- if ansible_check_mode %} (check: nothing changed){% endif %}
      vars:
        w: "{{ 'would-be-' if ansible_check_mode else '' }}"

    - name: the mesh receipt
      ansible.builtin.debug:
        msg: >-
          SSH-NAMES MESH {{ inventory_hostname }} refused={{ ssh_names_mesh.stdout_lines | select('match', '^refused ') | list | length }}
          open={{ ssh_names_mesh.stdout_lines | select('match', '^open ') | map('regex_replace', '^open ([^:]*):.*$', inventory_hostname ~ '->\1') | sort | join(',') or '-' }}
          hostkey={{ ssh_names_mesh.stdout_lines | select('match', '^hostkey ') | map('regex_replace', '^hostkey ([^:]*):.*$', '\1') | sort | join(',') or '-' }}
          timeout={{ ssh_names_mesh.stdout_lines | select('match', '^timeout ') | map('regex_replace', '^timeout ([^:]*):.*$', '\1') | sort | join(',') or '-' }}
          unreached={{ ssh_names_mesh.stdout_lines | select('match', '^unreached ') | map('regex_replace', '^unreached ([^:]*):.*$', '\1') | sort | join(',') or '-' }}
          offline={{ ssh_names_offline | join(',') or '-' }}
      when: ssh_names_mesh is not skipped

    - name: no machine logs in to another
      ansible.builtin.assert:
        that: ssh_names_mesh.stdout_lines | select('match', '^open ') | list | length == 0
        fail_msg: >-
          SSH-NAMES MESH {{ inventory_hostname }} OPEN {{ ssh_names_mesh.stdout_lines | select('match', '^open ') | map('regex_replace', '^open ([^:]*):.*$', inventory_hostname ~ '->\1') | sort | join(',') }}:
          this machine's login logged in there, so a CI job here has root there. Remove this login's keys from the
          target's ~/.ssh/authorized_keys, then turn Tailscale SSH off and retire the tailnet's machine-to-machine ssh
          rule; run: nova-fleet tailscale, then nova-fleet up
        quiet: true
      when: ssh_names_mesh is not skipped

    - name: every machine this one reached presented the host key the fleet recorded
      ansible.builtin.assert:
        that: ssh_names_mesh.stdout_lines | select('match', '^hostkey ') | list | length == 0
        fail_msg: >-
          SSH-NAMES MESH {{ inventory_hostname }} HOSTKEY {{ ssh_names_mesh.stdout_lines | select('match', '^hostkey ') | sort | join('; ') }}:
          the host key answering under that name is not the fleet's record of it (a machine answering for another, or a
          key changed); check which machine it is, then run: nova-fleet ssh-names
        quiet: true
      when: ssh_names_mesh is not skipped

    - name: the control node's receipt
      ansible.builtin.debug:
        msg: >-
          SSH-NAMES CONTROL ok={{ ssh_names_control_login.stdout_lines | select('match', '^ok ') | list | length }}
          failed={{ ssh_names_control_login.stdout_lines | select('match', '^failed ') | map('regex_replace', '^failed ([^:]*):.*$', '\1') | sort | join(',') or '-' }}
          tailscale-ssh={{ ssh_names_control_login.stdout_lines | select('match', '^tailscale-ssh ') | map('regex_replace', '^tailscale-ssh ([^:]*):.*$', '\1') | sort | join(',') or '-' }}
          offline={{ ssh_names_offline | join(',') or '-' }}
      run_once: true
      when: ssh_names_control_login is not skipped

    - name: the control node logs in to every machine online, by key
      ansible.builtin.assert:
        that: ssh_names_control_login.stdout_lines | select('match', '^(failed|tailscale-ssh) ') | list | length == 0
        fail_msg: >-
          SSH-NAMES CONTROL FAILED {{ ssh_names_control_login.stdout_lines | select('match', '^(failed|tailscale-ssh) ') | sort | join('; ') }}
          (the control node reaches a machine by its key in the login's ~/.ssh/authorized_keys, over sshd: add the key
          nova_control_ssh_pubkey names, or the agent's one key, there, and turn Tailscale SSH off; run: nova-fleet tailscale)
        quiet: true
      run_once: true
      when: ssh_names_control_login is not skipped
