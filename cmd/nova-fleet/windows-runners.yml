# purpose: a WSL machine held running from boot, and its Windows-side GitHub Actions runners from its record's windows_runners, through WSL interop
#
# Every WSL machine with interop gets the keepalive: a scheduled task that holds its distro running from boot, with
# nobody logged in, and starts it again within a minute when WSL stops (cmd/nova-fleet/README.md, "WSL held running from
# boot"); a machine that is not WSL is skipped. The machines whose record names windows_runners (nova-config machine set
# <m> --windows_runners '<url>=<count>[:<label>+<label>],...') also get their runners; every other machine has none.
# Each runner is <machine>-win-<slug>-<i> in C:\actions-runner\<slug>-<i>, a Windows service, with the CI rules. A record
# naming windows_admin_runners ('<url>=<account>:<label>[+<label>],...') adds one runner per entry,
# <machine>-win-<slug>-<account>, whose service runs as that local administrator account (its password in the
# machine's seat). A plain Windows host (record os windows, reached over its OpenSSH) gets the ordinary runners without
# interop, no admin runners, and no keepalive or page file step (it has no WSL).
# cmd/nova-fleet/README.md, "Windows runners of a WSL machine".
#
#   nova-fleet windows-runners --check -- -l <machine>
#   nova-fleet windows-runners -- -l <machine>
#
# gh on the control node, logged in with admin on each repository or organization, asks GitHub for the tokens.
- name: the Windows side of WSL machines
  hosts: bench:runner:services:windows   # the fleet's workers, as ci-rules, and plain Windows hosts
  gather_facts: true
  gather_subset: [min]
  tasks:
    - name: WSL held running from boot
      ansible.builtin.include_role:
        name: github-runner
        tasks_from: wsl-keepalive.yml
      when: (nova_os | default('') | lower) != 'windows'

    - name: the Windows page file at a fixed size (-e nova_windows_pagefile_mb=<n>; none by default)
      ansible.builtin.include_role:
        name: github-runner
        tasks_from: wsl-pagefile.yml
      when: (nova_os | default('') | lower) != 'windows'

    - name: the Windows-side runners
      ansible.builtin.include_role:
        name: github-runner
        tasks_from: wsl-windows.yml
      when: (nova_windows_runners | default([]) | length > 0) or (nova_windows_admin_runners | default([]) | length > 0)
