# purpose: GitHub Actions runners on every machine of the runner group, as its record's runner_scopes name them
#
# Each machine's runners are its record's runner_scopes (nova-config machine set <m> --runner_scopes
# '<url>=<count>[:<label>+<label>],...'), each a service that starts at boot with the record's runner_env, labelled with
# fleet, the machine's roles, os and arch and the scope's labels. A runner on the machine that the record does not name is
# retired, and an offline GitHub entry of the machine's that it does not name is deleted. cmd/nova-fleet/README.md,
# "github-runners".
#
#   nova-fleet github-runners --check --diff -- -l <machine>
#   nova-fleet github-runners -- -l <machine>
#
# One url only, leaving the machine's other runners as they are (nova-fleet up does this for a new machine):
#   nova-fleet github-runners -- -e github_runner_url=https://github.com/<owner>/<repo> -e github_runner_scope=repo
#
# Linux runners' workspace clones that make git abort in actions/checkout's fetch, found and reported, never moved:
#   nova-fleet github-runners --check -- -l <machine> -e nova_runner_git_probe=true
#
# The registration token is asked of GitHub on the control node with its own gh login
# (`gh api -X POST .../actions/runners/registration-token`); it is not an argument, a variable of the inventory or a file.
# For one url, a host's count is its machine row's `runners`; a host with none is refused, not read as 0.
# -e runner_count=<n> sets it for a one-url run (0 retires every runner; cores sizes each host to its cores, nova-fleet up's default). Variables: roles/github-runner/defaults/main.yml. Linux and macOS write the service files with sudo, so the login needs passwordless sudo (join.yml sets it on Linux; on macOS set it at the console), never a password prompt;
- name: GitHub Actions runners
  hosts: runner
  gather_facts: true
  gather_subset: [min]
  roles:
    - github-runner
