# purpose: the Redis nova-bus talks to, on each machine of the services group
#
# redis.yml: the Redis nova-bus talks to, on each machine of the `services` group (cmd/nova-fleet/README.md, "redis"): the
# distribution's redis-server (7.0 or newer) run by its own unit on nova_redis_port, listening on the
# tailnet address only, AOF on. ACL users bus, viewer and admin each get a password made once on the machine
# (<nova_redis_dir>/<user>.pass, 0600); `default` is off, so every client names its user. An ACL change is applied live
# with ACL LOAD; a config or unit change restarts the server only after a SAVE and a finished AOF rewrite. With
# nova_seal_store, nova_seal_seat and nova_seal_key given, the bus password is set into that seat as NOVA_BUS_PASSWORD
# (the seal role); a client then runs with NOVA_BUS_REDIS=<host>:<port>, NOVA_BUS_USER=bus and NOVA_BUS_PASSWORD.
#
# The machines are the `services` group, or the hosts -e nova_store_hosts names (the first store, from a one-machine
# inventory: cmd/nova-fleet/README.md, "The first machine").
#
#   nova-fleet redis --check --diff
#   nova-fleet redis -- -e nova_seal_store=S -e nova_seal_seat=SEAT -e nova_seal_key=K
- name: the fleet's Redis
  hosts: "{{ nova_store_hosts | default('services') }}"
  become: true
  gather_facts: true
  gather_subset: [min]
  pre_tasks:
    - name: the seal's refusals, before anything changes
      ansible.builtin.include_role: { name: seal, tasks_from: check }

    - name: the control node has what the run needs
      ansible.builtin.include_role: { name: preflight }
      vars:
        preflight_control: "{{ ([{'cmd': nova_control_secrets, 'for': 'the seal'}, {'cmd': nova_control_sops, 'for': 'the seal'}] if nova_seal_store is defined else []) }}"
  roles:
    - redis
  tasks:
    - name: the bus password, sealed into a seat
      ansible.builtin.include_role:
        name: seal
      vars:
        seal_file: "{{ nova_redis_dir }}/{{ nova_redis_seal_user }}.pass"
        seal_name: "{{ nova_redis_seal_name }}"
