# The defaults the fleet plays share (every cmd/nova-fleet/*.yml; a role keeps its own in roles/<role>/defaults). Override
# any of them from the inventory: a host variable from `nova-config inventory`,
# or a group_vars/<group>.yml or host_vars/<machine>.yml beside it (cmd/nova-fleet/README.md,
# "Overriding the defaults"). A group_vars/all.yml beside the inventory does not
# override these: this file is read after it.

# The tools nova-tools ships, by name: install.yml installs them and
# services.yml prefixes argv[0] with nova_bin_dir when it is one of them.
nova_tools_names: [nova-bus, nova-cairn, nova-config, nova-sandbox, nova-secrets, nova-reserve, nova-fleet]

# Where a machine keeps the tools: its login's home.
nova_home: "{{ ansible_facts['env']['HOME'] }}"
nova_bin_dir: "{{ nova_home }}/.local/bin"
# What the fleet login shares with a runner login of its own (Linux), outside its home: root's copies of the tools in
# <dir>/bin (roles/nova-tools-install/tasks/shared.yml) and the SDK in <dir>/sdk (sdk-toolchain with nova_sdk_shared).
nova_shared_dir: /opt/nova
# The login a machine's GitHub runners run as (github-runners.yml; cmd/nova-fleet/README.md, "The runner login"), and its
# home. On Linux a login of its own, ghrunner, that the play makes, with no sudo, no ssh and no way into the fleet
# login's home, so a CI job has no root; -e github_runner_user=<the fleet login> keeps the old way. WSL keeps the fleet login: its
# interop runs wsl.exe -u root for any login (unix-login.yml refuses a login of its own there). macOS runs its runners as the login.
github_runner_user: "{{ 'ghrunner' if ansible_facts['system'] == 'Linux' and 'microsoft' not in (ansible_facts['kernel'] | lower) else ansible_facts['user_id'] }}"
github_runner_home: "{{ ansible_facts['user_dir'] if github_runner_user == ansible_facts['user_id'] else '/home/' ~ github_runner_user }}"

# The PATH a service unit runs with; a service row's env may set its own.
nova_service_path: "{{ nova_bin_dir }}:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

# A darwin machine's services are LaunchAgents in the login's GUI domain (gui) or
# LaunchDaemons dropped to the login (system, which needs sudo); auto asks
# launchd whether the login has a GUI domain and takes system when it has not.
# A linux machine's are systemd user units (user, with linger) or system units
# dropped to the login (system).
nova_launchd_domain: auto
nova_systemd_scope: user

# A linux service unit's locked-memory limit (LimitMEMLOCK, a size such as 1G). The kernel
# charges io_uring's locked pages to the login across all its processes, and systemd's
# 8 MiB default refuses concurrent rings; 1G is rocketnet's measured figure for a host
# whose kernel is after 6.8 (its docs/LINUX.md). A user unit cannot go past its user
# manager's limit, so the health play sets the manager's to this size too.
nova_service_memlock: 1G

# Units of another tool's (com.nova.service.<name>.plist, nova-service-<name>.service
# not written by services.yml) to retire by name; every other such unit is left
# alone and listed.
nova_retire_units: []

# The service records services.yml renders and restarts, by name (a list, or one
# comma-separated word); empty is every record of the machine. Under it every
# other unit is left as it is and nothing is retired.
nova_service_only: []

# The service records a run restarts even when their unit file did not change, by
# name (a list, or one comma-separated word). Empty restarts nothing extra.
nova_service_restart: []

# A host with no service rows retires the units this play wrote only when asked:
# otherwise the run refuses and names them (-e nova_service_retire_all=true).
nova_service_retire_all: false

# The nova-secrets layout a service with keys opens its secrets through: the
# store, the directory of seat keys (<seat>.key) and the sops binary
# (nova-secrets exec requires --store and --key and takes --sops).
nova_secrets_store: "{{ nova_home }}/.local/share/nova/secrets"
nova_secrets_key_dir: "{{ nova_home }}/.config/nova-secrets"
# The pins nova-secrets set seals to on a machine: <dir>/recovery.pub, put there by join.yml from the control node's.
nova_secrets_pins: "{{ nova_home }}/.config/nova-secrets/pins"
nova_sops: "{{ '/opt/homebrew/bin/sops' if (nova_system | default(ansible_facts['system'] | default(''))) == 'Darwin' else nova_bin_dir ~ '/sops' }}"

# The seat a machine opens its secrets as (nova-secrets --as, services.yml's
# <seat>.key): its inventory name, the short hostname nova-secrets defaults to.
nova_seat: "{{ inventory_hostname }}"
nova_age_keygen: "{{ '/opt/homebrew/bin/age-keygen' if (nova_system | default(ansible_facts['system'] | default(''))) == 'Darwin' else nova_bin_dir ~ '/age-keygen' }}"

# The packages a CI runner's tests need, per OS (runner-packages.yml; cmd/nova-fleet/README.md, "runner-packages"): Homebrew
# formulae on darwin, apt packages on debian. Installed when missing, never upgraded, never started: the functional
# tier runs its own initdb and pg_ctl. The debian list is the toolchain of a fleet whose repositories build C, C++, Go,
# .NET, Java, OCaml and Python, prove with SMT and bounded model checkers, and test in containers, VMs and under
# emulation, big-endian builds included: the s390x libraries those link are `<name>:s390x`, which apt fetches because
# s390x is in nova_runner_foreign_architectures below. Every name resolves on Ubuntu 26.04; a Debian release or an
# older Ubuntu lacks some of the versioned ones (clang-18, postgresql-client-18, dotnet-sdk-10.0), and Debian has no
# Ubuntu ports archive. A list given with -e replaces this one whole (no merge): copy it and edit, and drop the
# `:s390x` names when the architecture is turned off.
# The Windows side of a WSL machine with Windows runners (its record's windows_runners): ccache for MSVC, from ccache's own
# release zip, checked against its sha256 (read from the GitHub release 2026-11-12), unpacked to the directory below
# with msvc\cl.exe beside it (runner-packages, "Windows ccache"). An empty version skips it.
nova_runner_windows_ccache:
  version: "4.14.3"
  sha256: "c845c3d65be81954c75659145a522a793a27586bf940c5dcfe18af33fa1a67dd"
nova_runner_windows_ccache_dir: 'C:\ProgramData\nova\ccache'
nova_runner_windows_ccache_unix: /mnt/c/ProgramData/nova/ccache

nova_runner_packages:
  darwin: ["postgresql@18", cmake, libsodium, pkgconf, ccache]
  debian:
    # compilers, assemblers, build systems and the tools a build calls
    - build-essential
    - clang
    - clang-18
    - clang-format-18
    - clang-tidy-18
    - lld
    - lld-18
    - llvm
    - llvm-18-dev
    - libclang-rt-dev
    - cmake
    - ninja-build
    - ccache
    - m4
    - nasm
    - patch
    - pkg-config
    - file
    - xxd
    - jq
    - graphviz
    # libraries the tests link
    - libbpf-dev
    - libcurl4-openssl-dev
    - libmpfr-dev
    - libsodium-dev
    - liburing-dev
    - libxdp-dev
    - zlib1g-dev
    - libopengl0
    - libglx0
    # the same libraries built for s390x, for the big-endian build (nova_runner_foreign_architectures)
    - "libsodium-dev:s390x"
    - "libbpf-dev:s390x"
    - "libxdp-dev:s390x"
    - "libstdc++6:s390x"
    # languages and runtimes
    - golang-go
    - dotnet-sdk-10.0
    - mono-runtime
    - mono-devel
    - openjdk-21-jre-headless
    - opam
    - python3-pip
    - python3-venv
    # analysis, proof and dynamic checking
    - cppcheck
    - valgrind
    - strace
    - time
    - cbmc
    - cadical
    - z3
    - gappa
    - sollya
    # clients of the stores the functional tier talks to (the tests start their own servers)
    - postgresql-client-18
    - redis-tools
    - sqlite3
    # containers, VMs and emulation; the s390x cross compilers for a big-endian build
    - podman
    - uidmap
    - bubblewrap
    - virtme-ng
    - qemu-system-x86
    - qemu-utils
    - virtiofsd
    - qemu-user
    - qemu-system-s390x
    - gcc-s390x-linux-gnu
    - g++-s390x-linux-gnu
    # shells, archives and packet capture
    - bats
    - bzip2
    - xz-utils
    - unzip
    # the base tools CI steps call, listed so a minimal image gets them too, and cloud-localds (a VM's seed image)
    - curl
    - git
    - gnupg
    - iproute2
    - openssh-client
    - python3
    - cloud-image-utils
    - tcpdump
# Foreign dpkg architectures the debian list may name packages of (`libfoo-dev:s390x`), Ubuntu only: each is enabled in
# dpkg and fetched from nova_runner_ports_uri, and the native sources are restricted to the native architecture.
nova_runner_foreign_architectures: [s390x]
nova_runner_ports_uri: "http://ports.ubuntu.com/ubuntu-ports/"
# Debian/Ubuntu: keep a copy of each kernel image the host installs in nova_runner_vm_kernel_dir, readable by the
# login, and the login in kvm, for a CI job that boots a VM of the host's own kernel. On for every bench and runner
# (the plays that read it run on no other); a runner login of its own gets root's copies (github-runners, vm-tier.yml)
# and a run that fails while its VM tier lacks anything.
nova_runner_vm_kernel: true
nova_runner_vm_kernel_dir: "{{ ansible_facts['user_dir'] }}/vm-kernels"
# Debian/Ubuntu: TLC's jar (TLA+ tools v1.7.4), root's at this path and readable by every login, pinned by its sha256.
# A missing one is downloaded from the TLA+ release and checked against the pin before it lands; a jar that differs
# from the pin is refused, never replaced. An empty sha256 skips it.
nova_runner_tla_jar: /opt/tla/tla2tools.jar
nova_runner_tla_jar_sha256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
nova_runner_tla_jar_url: https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
# Debian/Ubuntu x86_64: the MemorySanitizer-instrumented libc++ and libc++abi a MSan build links, for the clang on the
# runner's PATH, in <prefix><clang version> (root's, readable by every login). Built on each machine from the
# llvm-project release of that clang, pinned by sha256 here; a clang with no pin is refused. Built under nova-reserve
# with one slot's share of the machine's CPUs.
nova_runner_msan_libcxx_prefix: /opt/msan-libcxx-
nova_runner_msan_libcxx_sha256:
  "18.1.3": 2929f62d69dec0379e529eb632c40e15191e36f3bd58c2cb2df0413a0dc48651
  "21.1.8": 4633a23617fa31a3ea51242586ea7fb1da7140e426bd62fc164261fe036aa142

# The age and sops a Linux machine gets from join.yml, pinned by the digest
# GitHub publishes for each release asset. A darwin machine takes Homebrew's.
nova_age_version: "1.3.2"
nova_age_sha256:
  linux-amd64: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
  linux-arm64: 6b8dc4333c53a5a57c9e5834e3a48f92605d7154014cd07269ff3327db5d37f4
nova_sops_version: "3.13.3"
nova_sops_sha256:
  linux-amd64: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
  linux-arm64: 53b0abacd38ef1b12a66d6c100956691b9cefce018d91f81e73ddf7438b94d77

# join.yml (cmd/nova-fleet/README.md, "join"). The machine and its row's fields
# (nova_join_host, nova_join_user, nova_join_address, nova_join_os,
# nova_join_arch, nova_join_cores) have no default: they are the run's.
nova_join_roles: bench
nova_join_actor: "{{ lookup('ansible.builtin.env', 'USER') or 'fleet' }}"
nova_join_root_user: root
nova_join_sudo_group: sudo
nova_join_hostname: true
# nova_join_host_key ("ssh-ed25519 AAAA...", from the provider's console) has no default: given, it is the host key
# pinned for the row's address; else the key the address answers with at the first connection is.

# The names join.yml grants into a new machine's seat from the control seat
# (nova_seal_seat, opened with nova_seal_key).
nova_join_grant: [NOVA_BUS_PASSWORD]

# The control node's side of the secrets store: nova_seal_store (its clone of
# the store) has no default. seat.yml adds seat rules there; redis.yml and
# postgres.yml seal a password into the seat nova_seal_seat names, opened with
# the key nova_seal_key, when both are given. The three binaries are the
# control node's (on its PATH unless given as paths).
nova_control_secrets: nova-secrets
nova_control_config: nova-config
nova_control_sops: sops
# The control node's pins, outside the store: recovery.pub (nova-secrets init --pins writes it) and one <seat>.pub
# per machine, written by seat.yml from the key read on the machine; set and grant seal to these, whatever the
# store says.
nova_seal_pins: "{{ lookup('ansible.builtin.env', 'HOME') }}/.config/nova-secrets/pins"
