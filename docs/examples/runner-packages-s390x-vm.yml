# A vars file for the runner-packages play (cmd/nova-fleet/README.md, "runner-packages"), read from the directory you
# run in:
#
#   nova-fleet runner-packages --check -- -e @runner-packages-s390x-vm.yml -l bench
#   nova-fleet runner-packages -- -e @runner-packages-s390x-vm.yml -l bench
#
# It is the default list of cmd/nova-fleet/group_vars/all.yml with two things on that the defaults leave off, because
# each changes more than a package list: a foreign dpkg architecture (s390x, for a big-endian build and its tests under
# qemu-user) and the kernel copies for a CI job that boots a VM of the host's own kernel with virtme-ng. A value given
# with -e replaces the default whole, so the list is repeated here in full; a package of a foreign architecture is
# `<name>:<arch>`, and apt can fetch it only once its architecture is in nova_runner_foreign_architectures. Every name
# resolves on Ubuntu 26.04; a Debian release or an older Ubuntu lacks some of the versioned ones.
nova_runner_foreign_architectures: [s390x]
nova_runner_vm_kernel: true
nova_runner_packages:
  darwin: ["postgresql@18", cmake, libsodium, pkgconf, ccache]
  debian:
    # compilers, assemblers, build systems and the tools a build calls
    - build-essential
    - clang
    - clang-18
    - clang-format-18
    - clang-tidy-18
    - lld
    - lld-18
    - llvm
    - llvm-18-dev
    - libclang-rt-dev
    - cmake
    - ninja-build
    - ccache
    - m4
    - nasm
    - patch
    - pkg-config
    - file
    - xxd
    - jq
    - graphviz
    # libraries the tests link
    - libbpf-dev
    - libcurl4-openssl-dev
    - libmpfr-dev
    - libsodium-dev
    - liburing-dev
    - libxdp-dev
    - zlib1g-dev
    - libopengl0
    - libglx0
    # the same libraries built for s390x, for the big-endian build (nova_runner_foreign_architectures)
    - "libsodium-dev:s390x"
    - "libbpf-dev:s390x"
    - "libxdp-dev:s390x"
    - "libstdc++6:s390x"
    # languages and runtimes
    - golang-go
    - dotnet-sdk-10.0
    - mono-runtime
    - mono-devel
    - openjdk-21-jre-headless
    - opam
    - python3-pip
    - python3-venv
    # analysis, proof and dynamic checking
    - cppcheck
    - valgrind
    - cbmc
    - cadical
    - z3
    - gappa
    - sollya
    # clients of the stores the functional tier talks to (the tests start their own servers)
    - postgresql-client-18
    - redis-tools
    - sqlite3
    # containers, VMs and emulation; the s390x cross compilers for a big-endian build
    - podman
    - uidmap
    - bubblewrap
    - virtme-ng
    - qemu-system-x86
    - qemu-utils
    - virtiofsd
    - qemu-user
    - qemu-system-s390x
    - gcc-s390x-linux-gnu
    - g++-s390x-linux-gnu
    # shells, archives and packet capture
    - bats
    - bzip2
    - xz-utils
    - unzip
    - tcpdump
