# allowed_routes for the nova-sprint router (#2895).
#
# Source: rowan-new reports/model-efficiency-2026-09-22.md, "Interim ranking,
# 12:16 AM Eastern" (1151 run cards, 731 scored) and its "Pattern read at the
# 8+ bar". Numbers per route are that table's row for the route's model:
# run, scored, u8 (cards scored 8+), u9, usd_per_8 ($ of ALL run cards / u8),
# efficiency (($/U) x sqrt((T/U)/median) x (W/W_med)^0.25, lower is better),
# q (mean of (score-7.5)/2.5 over scored cards), tok_per_8 (millions of
# tokens of all run cards per 8+ card), wall_s (median wall seconds).
#
# The state of every row is the rule below applied to these numbers, first
# match wins; TestTheTableFollowsItsRule recomputes it and fails on any
# disagreement, so the rule line and the table cannot drift apart.
#   n = scored, U = u8, useful = U/n, reliability = U/run. The rung's measured
#   routes are its rows with numbers and U >= 5, counted once per model.
#   1. flag dead -> dropped (dead route).
#   2. no numbers -> held (not in the ranking).
#   3. Q <= 0 and n >= 8 and useful < 3/4 of the median useful of the rung's
#      measured routes -> dropped (quality rule: Q <= 0 AND useful far below).
#   4. a measured route not dropped by 3 whose efficiency is within a rounding
#      (+0.01) of the rung's best third (the ceil(k/3)-th best efficiency of
#      the k measured routes that survive 3) -> allowed, or held if flag
#      benched.
#   5. Pareto-dominated with Q <= 0 -> dropped. Dominated = another row of the
#      rung with U >= 1 is no worse on $ per 8+, tokens per 8+, median wall and
#      reliability and better on one (the report's Pareto view).
#   6. U < 5 -> held (too few).
#   7. otherwise -> held (second tier: dominated with Q > 0, or outside the
#      best third).
#
# state: allowed = in the rung's list; held = kept out of the rung's list
# (second tier, too few, unranked or route-benched) unless a types row adds it
# for one work type; dropped = refused everywhere. A dropped route re-enters
# only by a measured A/B written here, never mid-push (memory:
# continual-refinement-loop). Re-run from the fold every sprint.
source: "reports/model-efficiency-2026-09-22.md interim ranking 2026-09-23 12:16 AM Eastern"
rule: "useful = 8+; drop = dead, or Q <= 0 with n >= 8 and useful < 3/4 of the rung median, or Pareto-dominated with Q <= 0; allow = measured (U >= 5) and efficiency within +0.01 of the rung's best third, unless benched; hold = the rest (too few, second tier, unranked, benched)"

