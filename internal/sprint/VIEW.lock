# THE NOVA SPRINT VIEW IS LOCKED.
# Glenn, 2026-10-01: "i dislike this drift from the design of nova sprint tables that is
# *complete and locked*" / "strike everything that shows to my sprint table" / "This drift
# (visually) and logically away from the design is a real problem."
#
# Below is every byte `nova-sprint where` and `nova-sprint where --watch` print for one
# fixed store: whereFixture in cmd/nova-sprint/watch_test.go. Its sprint: one stream s1 with
# three cards (two working, one merging), a second stream s2 whose only card was dropped (a
# row at zero), readers reader-a and reader-b (one accepted card each), members m1 and m2
# (width 64, load 0). The first section is the plain frame; the next three are the watch's
# writes in order (cursor hidden, the frame drawn in place, cursor shown).
#
# How to read it: a `$` ends each piece of text between newlines, so blank lines and
# trailing spaces show, and a final `$` alone means the text ends in a newline. `\e` is the
# escape byte (0x1b), `\\` a backslash, `\xNN` any other control byte.
#
# internal/ci cannot import package main, so the class test `TestSprintViewIsLocked`
# (cmd/nova-sprint/view_lock_test.go) renders the fixture through the real renderer and is
# red on any difference, printing the first differing line with both texts. Nothing
# regenerates this file. Change what the view shows only when Glenn asks for it, and then
# change this file by hand in the same PR so a read sees it.
