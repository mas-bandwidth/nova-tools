# Change, 2026-10-05, a cell's word, not a column (card presence-from-session-only): the
# owner, ~9:30 AM ET, "there is no value in things that are answered just by the daemon".
# friends.status is up only on her session's evidence, a wake ping her session answered
# within 10 minutes or a card of hers finished within 30 (sprint.FriendPongWindow,
# sprint.FriendFinishWindow, sprint.FriendStatus), else down; a beat is never evidence,
# and the 15 s beat rule above is gone. No column changed, so the lines below are unchanged.
# Change, 2026-10-07, asked by the owner's card friends-tokens-column: each friend
# card's RESULT.md carries `usage: in=<n> out=<n> cache=<n>`. The store sums it
# per friend, and the friends table gets a "tokens" column in a compact form
# (1.2M), after active. A friend whose nova-config row bills per call (the billing
# field the cost card is adding) shows dollars to the cent, rounded up; until that
# field is set, every friend is a subscription. Held by TestSprintTablesAreLocked
# and TestFriendTokensSumPerFriendFromTheResultUsage.
#
# Change, 2026-10-05, a hidden fleet column, asked by Glenn in words: "trust but VERIFY"; "I
# want to trust the ok%"; "Mechanical. You know the drill."; "Are they actually doing the
# work that is shown in the friend table? Really?"; "i don't want dollar amounts for friends.
# token counts are fine." fleet.defect (hidden, after failed) holds a member's or a friend's
# work cards that ended on a brief defect (docs/SPEC-SPRINT.md section 1, a brief defect): a
# HOLD naming the brief, which no worker could do, counted in neither done nor ok%, so ok% on
# the fleet and friends tables counts only work the worker could do. No shown column changes.
# The live store takes it before the build that writes it is installed: nova-table col add
# fleet defect --after failed, then nova-table set fleet --hide defect. Held by
# TestSprintTablesAreLocked and
# TestAHoldNamingABriefDefectCountsAgainstTheStreamNotTheWorker.
# Change, 2026-10-06, two hidden fleet columns, asked by Glenn in words: "I want the ok% to
# be the actual amount of good work produced. if it is artificially low for some reason,
# then that is a BUG". fleet.refused and fleet.provider (hidden, after withdrawn) hold a
# member's or a friend's work cards whose launch the member refused before a lane began
# (refused) and whose take the provider failed (provider): each counted in neither done nor
# ok%, in its own column so the reason is not hidden and a recount re-derives it. The friends
# table carries the same two hidden columns. The live store takes them before the build that
# writes them is installed: nova-table col add fleet refused --after withdrawn, nova-table col
# add fleet provider --after refused, nova-table set fleet --hide refused --hide provider (and
# nova-table col add friends refused --after failed, nova-table col add friends provider
# --after refused, nova-table set friends --hide refused --hide provider). Held by
# TestSprintTablesAreLocked.
# Note, 2026-10-04, the friend row's work restriction, not a display column: her
# nova-config row's `streams` and `kinds` (docs/SPEC-CONFIG.md, friend) are carried into
# her friends record by friend sync and applied by the dealer, which hands her no card
# outside them; nothing the where view draws changes, so no column, fold or row below is
# added and the friends table's shape stands. Held by
# TestDealerNeverDealsAFriendOutsideHerStreams and
# TestAddAndBriefRefuseNamedFriendOutsideRestrictions.
