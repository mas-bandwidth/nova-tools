#
# Change, 2026-10-01, asked by Glenn in words: "can you please add a final column to the
# work stream table, which is "cost". This is the sum of each landed card's total cost
# for that work stream, and then a total at the bottom." work.cost is that column: a text
# cell (the stream's landed cost, "$" and four places, "-" when none was priced) and the
# footer the exact sum over the streams. Held by TestSprintTablesAreLocked.
#
# Change, 2026-10-02, asked by Glenn in words, at a fleet footer of 132 over members of
# which 52 could take a card: "width 132?!". The fleet table's footer in the view's text
# (nova-sprint where) folds ready, working, width, done and ok% over the members whose
# status is up only; a held or down member's numbers show on its own row and not in the
# total. No column, fold or row changes here: the shape below is the same. Held by
# TestTheFleetFooterSumsOnlyTheMembersUp (cmd/nova-sprint).
