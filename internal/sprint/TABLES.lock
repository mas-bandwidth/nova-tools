# Change, 2026-10-02, asked by Glenn in words: "please give friends in the friends
# table the same ready, working, width, done, ok%, status that we have for machines,
# but no load, since they don't correspond to a machine (at the moment...)" and "you
# can even use the inbox/outbox standard in friend's working dirs". The friends table
# takes the fleet table's columns but load: ready and working count a friend's job
# cards (friend sync reads each friend's working directory, inbox/<job> and
# outbox/<job>/REPORT.md, and writes the cards into the store; the view never reads
# the directories), width is her width as text (1, one job at a time), ok and failed
# (hidden) count her jobs done, done and ok% are the same formulas as the fleet's with
# the footer pooling ok%, and status stays up, down or held by the fleet's rule. Held by
# TestSprintTablesAreLocked.
#
