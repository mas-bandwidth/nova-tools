# showed whether a friend's daemon answers, not whether her session moves: one friend idle
# from 2:40 to 4:34 PM read up with 8 working). friends.active is the new column: a text
# cell with no fold, how long ago her session last wrote a file under her working directory
# and outbox ("4m ago", "-" when her beat reported none), after status. Held by
# TestSprintTablesAreLocked; the rule is docs/SPEC-SPRINT.md, last session activity.
