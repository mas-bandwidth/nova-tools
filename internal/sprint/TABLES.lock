#
# One line per column: table.column projection fold hidden [label=...], in the order the
# table has them, then the order the sprint view shows the tables in. internal/ci
# (TestSprintTablesAreLocked) renders the same text from schema.go and is red on any
# difference. Change a table's shape only when Glenn asks for it, and then change this
# file in the same PR so a read sees it.
#
# Change, 2026-10-01, asked by Glenn in words: "can you please add a final column to the
# work stream table, which is "cost". This is the sum of each landed card's total cost
# for that work stream, and then a total at the bottom." work.cost is that column: a text
# cell (the stream's landed cost, "$" and four places, "-" when none was priced) and the
# footer the exact sum over the streams. Held by TestSprintTablesAreLocked.
#
# Change, 2026-10-02, asked by Glenn in words: "I like these sentinels. I think it would
# be a good idea for you to add a friends table, above fleet and below merge. friends |
# status for now. up/down/held :)" friends.status is that table's one column: a row per
# friend of nova-config's friend rows, its status up, down or held by the fleet's rule,
# drawn by where after merge and before fleet and never stored as a table. Held by
# TestSprintTablesAreLocked.
#
# Change, 2026-10-02, asked by Glenn in words: "please give friends in the friends
# table the same ready, working, width, done, ok%, status that we have for machines,
# but no load, since they don't correspond to a machine (at the moment...)" and "you
# can even use the inbox/outbox standard in friend's working dirs". The friends table
# takes the fleet table's columns but load: ready and working count a friend's job
# cards (friend sync reads each friend's working directory, inbox/<job> and
# outbox/<job>/REPORT.md, and writes the cards into the store; the view never reads
# the directories), width is her width as text (1, one job at a time), ok and failed
# (hidden) count her jobs done, done and ok% are the same formulas as the fleet's with
# the footer pooling ok%, and status stays up, down or held by the fleet's rule. Held by
# TestSprintTablesAreLocked.
#
