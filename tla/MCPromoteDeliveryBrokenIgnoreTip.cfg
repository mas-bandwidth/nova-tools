\* Reversed witness: the --branch fallback ignores --tip, so a card landed after
\* the frozen tip was cut is verified in dev: VerifiedInDev fails.
SPECIFICATION Spec
CONSTANTS
 Cards = {c1, c2, c3}
 Targets = {t1, t2}
 VerifyAllLanded = FALSE
 IgnoreTip = TRUE
 ForgetFailure = FALSE
INVARIANTS TypeOK VerifiedInDev VerifiedStaged InstalledVerified InstalledOnTarget FailureVisible CountsApart
