\* The design: every reader asked reads the card's tier, a return is re-asked in place only of a reader of the tier, the level moves a read only to a reader of the tier. Every invariant holds.
SPECIFICATION Spec
CONSTANTS
 Readers <- MCReaders
 Tiers <- MCTiers
 Cards <- MCCards
 Tier <- MCTier
 Need <- MCNeed
 InitTiers <- MCInitTiers
 Broken = "none"
INVARIANTS TypeOK AskedWithinTier OneAtATime AcceptedOnEnough
