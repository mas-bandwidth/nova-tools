\* The design: the gap tested where the card is chosen, the refusers skipped, a
\* moved card never queued again. Every invariant, the potential and the
\* termination hold.
SPECIFICATION Spec
CONSTANTS
 Order <- MCOrder3
 Cards <- MCCards3
 Width <- MCWidth3
 Works <- MCWorks3
 UpOrders <- MCUpAll3
 MaxRefusers = 1
 Rule = "gap"
 Requeue = FALSE
INVARIANTS TypeOK NeverOnARefuser MovesBounded SelectionComplete
PROPERTIES PotentialFalls Terminates
