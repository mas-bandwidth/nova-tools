\* The known gap: an acted stamp that failed (Broken = "losestamp") with a
\* crash and a lost ack together. The daemon remembers the turn but the
\* receipt stays read; the crash forgets the memory, the lost ack leaves the
\* message pending, and the claim hands it in again: the message is acted
\* twice, so NoIdActedTwice fails.
SPECIFICATION ReceiptSpec
CONSTANTS
 Recipients = {r1}
 Messages = {m1, m2}
 Consumers = {c1, c2}
 MaxCrashes = 1
 Broken = "losestamp"
INVARIANTS TypeOK RTypeOK OnEveryStreamOrNone OnStreamWasSent NothingLost ActedImpliesDelivered NoIdActedTwice
PROPERTIES ReceiptNeverMovesBack PendingBeforeNew HeldStaysHeld AckOnlyDelivered AckedStaysAcked
