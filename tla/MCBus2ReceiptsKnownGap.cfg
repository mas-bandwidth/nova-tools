\* the known gap, not a fix: a failed acted stamp (LoseStamp) and a crash that
\* loses the ack and the memory together act one message twice, so
\* NoIdActedTwice fails with a crash and holds without one
SPECIFICATION ReceiptSpec
CONSTANTS
 Recipients = {r1}
 Messages = {m1, m2}
 Consumers = {c1, c2}
 MaxCrashes = 1
 Broken = "none"
INVARIANTS TypeOK RTypeOK OnEveryStreamOrNone OnStreamWasSent NothingLost ActedImpliesDelivered NoIdActedTwice
PROPERTIES ReceiptNeverMovesBack PendingBeforeNew HeldStaysHeld AckOnlyDelivered AckedStaysAcked
