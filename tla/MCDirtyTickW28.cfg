\* W28: a read once returned is judged only when every reader is in seen of it: r1 returns it, is asked it again in place, then its machine lapses and the read waits with no reader up, silently
SPECIFICATION Spec
CONSTANTS
 Streams = {"s1", "s2"}
 Cards = {"c1"}
 StreamOf <- MCStreamOf
 Pos <- MCPos
 Sents = {}
 COrder <- MCCardOrder
 Machines = {"m1"}
 Width <- MCWidth
 MOrder <- MCMOrder
 Readers = {"r1"}
 ROrder <- MCROrder
 Host <- MCHost
 SOrder <- MCSOrder
 MaxAttempts = 2
 MaxRedeals = 1
 Takes = FALSE
 Coord = FALSE
 MaxActs = 3
 MaxSub = 12
 CtrMod = 2
 Addable = {}
 Scn <- ScnHandBackLapse
 Fixes = {"seefleet", "pendingroom", "readerup"}
 Broken = "seenonly"
INVARIANTS TypeOK StrandingIsJudged
