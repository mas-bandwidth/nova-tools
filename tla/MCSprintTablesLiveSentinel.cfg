\* Liveness under fairness with a sentinel.
SPECIFICATION FairSpec
CONSTANTS
 Streams <- MCStreams
 Primaries <- MCPrimariesG
 Members = {m1, m2}
 Readers = {r1, r2, r3}
 StreamOf <- MCStreamOf
 Needs <- MCNeedsG
 Score0 <- MCScore0
 Admitted0 <- MCAllAdmitted
 Sentinels <- MCSentinels
 MaxAttempt = 2
 MaxBad = 0
 MaxReturns = 1
 MaxRanks = 0
 MaxStops = 1
 MaxEpoch = 0
 MaxAcks = 1
 FreeCoordinator = FALSE
 Broken = "none"
INVARIANTS TypeOK OnePlace WorkingIsDelegated ReadsOnlyInReview MergeMatchesWork MergedIsLanded AcceptedHadTwoReaders NoCardLostOrTwice StoppedIsNotified FinishIsLive LandsAfterNeed ReadsExhaustedIsNotified StreamStateIsTrue NeedsMetOutsideWaiting NoNeedCycle SentinelHolds ReachedIsNotified SentinelLandsByRelease SentinelNeverDealt NoOldEpochWrite OwnersRule
PROPERTIES ScoreOnlyByRank MergeInWorkOrder EveryPrimaryEnds StoppedStreamMoves CutRepaired NoMemberIsJudged
