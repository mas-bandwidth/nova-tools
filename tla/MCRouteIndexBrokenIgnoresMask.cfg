\* witness: a deal that ignores the applies mask takes the entry at the place
\* whatever the card's executor class, so RouteHonoursMask fails on the pro
\* route "d" (friends only) drawn for a fleet-class pro card
SPECIFICATION Spec
CONSTANTS
 Tiers = {"flash", "pro"}
 Arr <- MCArr
 Cards = {c1, c2, c3, c4, c5, c6, c7}
 ProCards = {c5, c6}
 TierOf <- MCTierOf
 Pinned = {c7}
 Reads = {}
 MaxRedeals = 1
 Broken = "ignore_mask"
 Executors = {"fleet", "friends", "local"}
 ClassOf <- MCClassOf
 Mask <- MCMask
SYMMETRY MCSym
INVARIANTS TypeOK RouteHonoursMask
