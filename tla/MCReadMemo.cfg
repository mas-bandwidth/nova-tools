\* The design: kept verdicts inherited at their own head and base before any read is asked. Every invariant holds.
SPECIFICATION Spec
CONSTANTS
 Heads <- MCHeads
 Bases <- MCBases
 Readers <- MCReaders
 Need = 2
 MaxAttempts = 3
 Broken = "none"
INVARIANTS TypeOK NoReadTwiceAtAKeptHead InheritedAtItsKey InheritedOneKind
