\* Reversed witness: a daemon that never reads her row's session, so a service
\* reinstalled elsewhere from an old command line hands messages into the old
\* id after the row names another: NeverIntoSuperseded fails.
SPECIFICATION Spec
CONSTANTS
 Targets = {"t1", "t2", "t3"}
 Msgs = {"m1", "m2"}
 Broken = "rowignored"
INVARIANTS TypeOK NeverIntoGone RunsOnItsOwnProof AckedOnlyDelivered RetiredNeverBound NeverIntoSuperseded
PROPERTIES InvalidIsTold
