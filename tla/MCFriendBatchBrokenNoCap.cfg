\* Reversed witness: no cap. A turn in the session holds an unanswered check's
\* bound off with no BehindCap, so a deaf friend (a turn read then not answered,
\* back-to-back turns) is held up past BehindCap + Bound. TLC must find it up
\* with heldAge at the bound.
SPECIFICATION Spec
CONSTANTS
 Bound = 2
 BehindCap = 4
 MaxTurns = 2
 Broken = "nocap"
INVARIANTS DeafSessionShownDownWithinBoundPlusCap
