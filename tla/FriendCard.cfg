\* Two friends, three cards; two tiers and one lane per friend.
SPECIFICATION SpecLive
CONSTANTS
  Friends = {f1, f2}
  Cards = {c1, c2, c3}
  Tiers = {flash, pro}
  CardTier = [c1 |-> flash, c2 |-> pro, c3 |-> flash]
  FriendTiers = [f1 |-> {flash, pro}, f2 |-> {flash}]
  Width = [f1 |-> 1, f2 |-> 1]
  Bound = 3
  PingEvery = 1
  DeliveryBound = 2
  StartBound = 2
  ProgressBound = 2
  DeadRunBound = 1
  ReturnBound = 2
  MaxEvents = 6
INVARIANTS
  TypeOK
  WorkingOnlyAfterStart
  FinishedHasEvidenceAndNotice
  NoCardOffUp
  TierHeld
  WidthRespected
  DeadRunFinishedWithinBound
  DashboardIsDerived
  DeliveryFailureVisible
PROPERTIES
  EveryDealtSettles
  EveryFinishedReturns
  EveryAbleFriendUp
