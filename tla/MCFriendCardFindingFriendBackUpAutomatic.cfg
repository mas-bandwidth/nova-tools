\* Reversed witness for friend-back-up-automatic: Broken = nobringup, on the
\* two-friend, one-card instance so the temporal check fits the record budget.
SPECIFICATION SpecLive
CONSTANTS
  Friends <- MCFriends
  Cards <- MCCards1
  Tiers <- MCTiers
  CardTier <- MCCardTier1
  FriendTiers <- MCFriendTiers
  Width <- MCWidth
  Bound = 1
  PingEvery = 1
  DeliveryBound = 1
  StartBound = 1
  ProgressBound = 1
  DeadRunBound = 1
  ReturnBound = 1
  MaxEvents = 1
  Broken = "nobringup"
INVARIANTS
  TypeOK
PROPERTIES
  EveryAbleFriendUp
