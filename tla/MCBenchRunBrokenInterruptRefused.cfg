\* Reversed witness: an exec interrupt reports Refused while the command ran
\* (ranCmd TRUE). The verb must exit with the command's own code, never
\* Refused, so InterruptedExecRan must fail.
SPECIFICATION Spec
CONSTANTS
 NHosts = 2
 Codes = {0, 1}
 RemoveBuggy = FALSE
 InterruptRefused = TRUE
INVARIANTS TypeOK OnlyTheMadeDirIsRemoved AtMostOneHostAnswers FallbackOnlyOnNoAnswer ExitIsTheCommands InterruptedExecRan NothingLeftBehind
PROPERTIES Terminates
CHECK_DEADLOCK FALSE
