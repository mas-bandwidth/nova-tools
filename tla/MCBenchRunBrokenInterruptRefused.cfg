\* The reversed witness: an interrupt during the exec refuses a run whose
\* command ran; the code's sshLine returns ExitCode -1 (Killed) there, so the
\* command did run and the verb exits Killed, never Refused. InterruptedExecRan
\* must fail.
SPECIFICATION Spec
CONSTANTS
  NHosts = 2
  Codes = {0, 1}
  RemoveBuggy = FALSE
  InterruptRefused = TRUE
INVARIANTS TypeOK OnlyTheMadeDirIsRemoved AtMostOneHostAnswers FallbackOnlyOnNoAnswer ExitIsTheCommands InterruptedExecRan NothingLeftBehind
PROPERTIES Terminates
CHECK_DEADLOCK FALSE
