\* Reversed witness: a failed job never staged again, so a card whose remedy
\* landed waits forever: EveryCardIsHanded fails.
SPECIFICATION Spec
CONSTANTS
 Cards = {"c1", "c2", "c3"}
 Repos = {"r1", "r2"}
 RepoOf <- MCRepoOf
 MaxOutside = 2
 Broken = "noretry"
INVARIANTS TypeOK HandedOnlyStaged StagedHasMirror OneJudgmentWhileItStands SaidIsTold
PROPERTIES EveryCardIsHanded
