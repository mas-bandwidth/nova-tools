\* Reversed witness: the pair asked at once (as ask --another asks a second read beside the first). TLC must find an attempt with two broken reads, where the finder needs an order among readers (the engine's and the reference model's: reader row order).
SPECIFICATION Spec
CONSTANTS
 Readers <- MCReaders
 Width <- MCWidth
 Cards <- MCCards
 Need <- MCNeed
 MaxAttempts = 2
 Broken = "pair"
INVARIANTS TypeOK OneBroken
