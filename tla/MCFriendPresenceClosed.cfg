\* The design, liveness on the clock alone (SpecClosed): a closed harness is shown down, whatever else never recovers.
\* One card and one disruption: the batch turn's exemption multiplies the liveness state space, so these constants keep the full check inside the 110-second budget.
SPECIFICATION SpecClosed
CONSTANTS
 Friends = {f1, f2}
 Cards = {c1}
 Bound = 1
 BehindCap = 2
 MaxEvents = 2
 Broken = "none"
 Watched = {}
INVARIANTS TypeOK
PROPERTIES ClosedShownDown
