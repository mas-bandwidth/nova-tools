\* The design, liveness on the clock alone (SpecClosed): a closed harness is shown down, whatever else never recovers.
\* One card: ClosedShownDown reads no card, and the take (taken) doubled two cards' liveness check past a minute.
SPECIFICATION SpecClosed
CONSTANTS
 Friends = {f1, f2}
 Cards = {c1}
 Bound = 2
 MaxEvents = 3
 Broken = "none"
INVARIANTS TypeOK
PROPERTIES ClosedShownDown
