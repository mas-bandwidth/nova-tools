\* The fix: a lane runs only a card the server has working on her row (take first), and a
\* set-aside card the server still has ready is taken again. Two cards, two lanes, two stops.
SPECIFICATION Spec
CONSTANTS
 Cards = {c1, c2}
 Lanes = {l1, l2}
 MaxStops = 2
 RunReady = FALSE
 ReclaimOn = TRUE
INVARIANTS TypeOK NoLaneWithoutTake OneLanePerCard
PROPERTIES NothingStrandedAcrossStopStart RefusedTakeIsEventuallyRetaken
