\* Reversed witness: the pair asked at once. TLC must find a card that landed on more reads than it needs plus one per attempt found broken (four where three do).
SPECIFICATION Spec
CONSTANTS
 Readers <- MCReaders
 Width <- MCWidth
 Cards <- MCCards
 Need <- MCNeed
 MaxAttempts = 2
 Broken = "pair"
INVARIANTS TypeOK WidthRespected ReadsPerLanding

