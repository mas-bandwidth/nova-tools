\* A failed friend cards read under working lanes: the client renews the lanes its last round found held (within the width), so no live hold is lost and nothing is taken blind. Every invariant and property holds. A restart under a failed read is the bound, MCFriendLaneClientBlindRestartLapses.cfg.
SPECIFICATION Spec
CONSTANTS
 Cards = {c1, c2}
 Lanes = {1, 2}
 Bound = 2
 RenewTicks = 1
 MaxRestarts = 0
 MaxDeaths = 0
 TrustCache = FALSE
 RenewUnproven = FALSE
 TickUnstarts = FALSE
 Widths = {1, 2}
 InitWidth = 2
 MaxResizes = 0
 MaxLosses = 0
 ShrinkStopsRenew = FALSE
 ShrinkMoves = FALSE
 TakeOverWidth = FALSE
 NoGrow = FALSE
 MaxCardFails = 1
 BlindTakes = FALSE
 LostDrops = FALSE
INVARIANTS TypeOK OneLanePerCard HeldIsTheServersRecord FinishedOnce TakenStaysTaken LiveHoldNeverExpires
PROPERTIES RestartResumes DeadClientReleases DeadModelReleases
