\* Reversed witness: a replacement drops the old card without repointing its
\* dependents, so ReplacedNeedTwin fails (twins.go Relink would repoint them).
SPECIFICATION Spec
CONSTANTS
 Cards <- MCCards
 Needs <- MCNeeds
 Waived <- MCWaived
 Twin <- MCTwin
 Broken <- MCNoTwin
INVARIANTS ReplacedNeedTwin
CHECK_DEADLOCK FALSE
