\* liveness: every batch ends; the land lane is off here (MaxLands = 0): its line is a safety
\* property, LandHoldsTheLineOnlyForStoreSteps, checked in MCServerLanes.cfg, and with it on
\* the liveness search does not fit its 110 s budget
SPECIFICATION Spec
CONSTANTS
 Callers <- MCCallersLive
 KindOf <- MCKindOfLive
 MaxTicks = 1
 MaxLands = 0
 Broken = {}
INVARIANTS TypeOK WriteHoldsTheLine BeatNeverWaitsForTheLine ReadWaitsOnlyForReads GoneNeverRuns LanesHoldNoLine
PROPERTIES EveryBatchEnds
