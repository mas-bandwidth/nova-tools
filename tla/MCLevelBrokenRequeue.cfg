 Order <- MCOrder3
 Cards <- MCCards3
 Width <- MCWidth3
 Works <- MCWorks3
 UpOrders <- MCUpAll3
 MaxRefusers = 1
 Rule = "gap"
 Requeue = TRUE
INVARIANTS TypeOK MovesBounded
PROPERTIES Terminates
