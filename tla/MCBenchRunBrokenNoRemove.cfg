\* The reversed witness: a run that returns on a failed copy without its
\* deferred remove leaves the made directory behind; NothingLeftBehind must fail.
SPECIFICATION Spec
CONSTANTS
 NHosts = 2
 Codes = {0, 1}
 RemoveBuggy = TRUE
 InterruptRefused = FALSE
INVARIANTS TypeOK OnlyTheMadeDirIsRemoved AtMostOneHostAnswers FallbackOnlyOnNoAnswer ExitIsTheCommands InterruptedExecRan NothingLeftBehind
PROPERTIES Terminates
CHECK_DEADLOCK FALSE
