# tailnet-acl.yml: the tailnet policy of this node, applied by Tailscale's own GitOps action.
#
# GENERATED by `nova-pulse fleet net init`. The policy is fleet/tailnet-policy.hujson, and the
# admin console is not the source of truth: a change made there is overwritten by the next
# apply, on purpose.
#
# On a pull request the action runs `tailscale acl test`, which runs the policy's own
# `tests` section -- the invariants -- against the proposed policy. On a push to the
# default branch it applies. The action does the etag check itself: an apply over a
# policy that was edited outside this repository fails rather than clobbering it.
#
# The one secret: TAILSCALE_API_KEY, a Tailscale API key for THIS node's tailnet, in the
# repository's secrets. Per-node tailnets mean per-node keys; no other node's key is here,
# and no key is ever in a flag, a file in the tree, or a line this workflow prints.
#
# Actions are pinned by sha (internal/ci's TestEveryActionIsPinnedBySHA is the rule).

name: tailnet-acl

on:
  push:
    branches: [dev]
    paths:
      - 'fleet/tailnet-policy.hujson'
      - '.github/workflows/tailnet-acl.yml'
  pull_request:
    paths:
      - 'fleet/tailnet-policy.hujson'
      - '.github/workflows/tailnet-acl.yml'

permissions:
  contents: read

concurrency:
  group: tailnet-acl-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acl-test:
    # The invariants, on every pull request that touches the policy. This is the gate: a
    # policy whose tests fail never reaches the tailnet.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # The secret reaches the job as an environment value so the armed check below can
      # SEE whether it is there. The `secrets` context is not readable in a job-level
      # `if:`, and a workflow that fails red because a node has not armed it yet would
      # stop that node's queue for a reason that has nothing to do with its code.
      TAILNET_API_KEY: ${{ secrets.TAILSCALE_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: is this node armed
        id: armed
        shell: bash
        run: |
          if [ -n "$TAILNET_API_KEY" ]; then
            echo 'armed=yes' >> "$GITHUB_OUTPUT"
          else
            echo 'armed=no' >> "$GITHUB_OUTPUT"
            echo "::notice title=tailnet-acl::TAILSCALE_API_KEY is not set, so the policy is not tested. Add the secret to arm this workflow (docs/TAILNET.md)."
          fi
      - name: tailscale acl test
        if: steps.armed.outputs.armed == 'yes'
        uses: tailscale/gitops-acl-action@5a4a17f5708e9bf96f4ee915a95e9f83c2eebe1a # v1.5.2
        with:
          tailnet: mas-bandwidth.com
          api-key: ${{ secrets.TAILSCALE_API_KEY }}
          policy-file: fleet/tailnet-policy.hujson
          action: test

  acl-apply:
    # The apply, on the default branch only. Nothing applies from a pull request: a fork's
    # pull request must never reach a tailnet, and a policy lands the way every other
    # change lands -- reviewed, merged, then applied.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # The secret reaches the job as an environment value so the armed check below can
      # SEE whether it is there. The `secrets` context is not readable in a job-level
      # `if:`, and a workflow that fails red because a node has not armed it yet would
      # stop that node's queue for a reason that has nothing to do with its code.
      TAILNET_API_KEY: ${{ secrets.TAILSCALE_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: is this node armed
        id: armed
        shell: bash
        run: |
          if [ -n "$TAILNET_API_KEY" ]; then
            echo 'armed=yes' >> "$GITHUB_OUTPUT"
          else
            echo 'armed=no' >> "$GITHUB_OUTPUT"
            echo "::notice title=tailnet-acl::TAILSCALE_API_KEY is not set, so the policy is not applied. Add the secret to arm this workflow (docs/TAILNET.md)."
          fi
      - name: tailscale acl apply
        if: steps.armed.outputs.armed == 'yes'
        uses: tailscale/gitops-acl-action@5a4a17f5708e9bf96f4ee915a95e9f83c2eebe1a # v1.5.2
        with:
          tailnet: mas-bandwidth.com
          api-key: ${{ secrets.TAILSCALE_API_KEY }}
          policy-file: fleet/tailnet-policy.hujson
          action: apply
