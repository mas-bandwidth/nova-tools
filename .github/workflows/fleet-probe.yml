# fleet-probe: prove a bench's runners before the loop trusts them (Glenn, 2026-09-16:
# "run some tests to make sure that hulk and vision actually work, before trusting them";
# the pattern was new things thrown into the work loop and trusted, and they were not
# working). One job per runner slot, targeted by the bench label, doing what a CI job does:
# find Go and sbcl the way ci.yml does, build, run one real package, write beside the repo.
# Read the result by runner_name from the wire; a bench is trusted when every name is green.
name: fleet-probe
on:
  workflow_dispatch:
    inputs:
      bench:
        description: "bench label: hulk, vision, mini or space"
        required: true
        default: "hulk"
      slots:
        description: "how many parallel jobs (one per runner slot, so every runner takes one)"
        required: true
        default: "8"
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      slots: ${{ steps.mk.outputs.slots }}
    steps:
      - id: mk
        run: |
          n=${{ inputs.slots }}; s="["; for i in $(seq 1 "$n"); do s="$s$i,"; done; s="${s%,}]"
          echo "slots=$s" >> "$GITHUB_OUTPUT"
  probe:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        slot: ${{ fromJSON(needs.plan.outputs.slots) }}
    runs-on: [self-hosted, "${{ inputs.bench }}"]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: toolchains the way ci.yml finds them
        run: |
          if ! command -v go >/dev/null 2>&1; then
            for d in /usr/local/go/bin /opt/homebrew/bin "$HOME/go/bin"; do
              [ -x "$d/go" ] && { echo "$d" >> "$GITHUB_PATH"; export PATH="$d:$PATH"; }
            done
          fi
          for d in "$HOME/.local/bin"; do [ -x "$d/sbcl" ] && { echo "$d" >> "$GITHUB_PATH"; export PATH="$d:$PATH"; }; done
          echo "PROBE runner=$RUNNER_NAME slot=${{ matrix.slot }} go=$(command -v go || echo -) sbcl=$(command -v sbcl || echo -) home=$HOME"
          command -v go >/dev/null 2>&1 || { echo "PROBE FAIL runner=$RUNNER_NAME no Go on PATH"; exit 1; }
          command -v sbcl >/dev/null 2>&1 || { echo "PROBE FAIL runner=$RUNNER_NAME no sbcl on PATH"; exit 1; }
          go version; sbcl --version
      - name: build and one real package
        run: |
          go build ./... && go test -count=1 ./internal/oneline/
      - name: write beside the repo
        run: |
          t="$(dirname "$GITHUB_WORKSPACE")/fleet-probe-$RUNNER_NAME.txt"; echo ok > "$t" && rm -f "$t"
          echo "PROBE OK runner=$RUNNER_NAME slot=${{ matrix.slot }}"
