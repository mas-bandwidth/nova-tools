# Releases for nova-tools: a tag becomes binaries somebody else can run.
#
# Why this exists: `go install` is a fine way to get these tools and it is the first way
# the README offers, but it needs a Go toolchain, and the people most likely to be handed
# `nova-check` or `nova-bus` are being handed them to run against their own repository
# rather than to build. Until now there was nothing to hand them: the only artifact of a
# release was a tag, and a tag is a claim about source.
#
# A GREEN CERTIFICATION RUN ON THE TAGGED COMMIT COMES FIRST AND THE RELEASE JOB NEEDS IT. A
# tag can be pushed to any commit, including one no CI run ever saw and one that never passed
# on Windows -- and ci.yml's own opening argument is that a claim of tested is what stops
# anyone checking. So the first job asks whether certification.yml (the whole-tree race run,
# the per-package Windows tests, the three-OS smoke, the release dry-run) has completed on this
# exact commit and whether its NEWEST completed run is green, and refuses the release
# otherwise: no release at all rather than a release nobody vouched for, and no release on a
# red either. Nothing certifies a commit on its own (certification.yml runs daily and on
# dispatch), so cutting a release means dispatching certification on the tag's ref first; the
# refusal says exactly that. Until v0.15.0 this file ran its own copy of those tests, serially,
# and the Windows leg outgrew its cap; the certified job below says why it stopped.
#
# ONE RUNNER BUILDS EVERYTHING, rather than a matrix of five. Go cross-compiles from any
# host with no toolchain to install, so the only thing a matrix would buy is parallelism,
# and it would cost the property that matters here: SHA256SUMS is computed on the one
# machine that holds every artifact, over the whole shipped set, in the same step that
# uploads it. Assembling that file from five uploads would mean five artifact round-trips
# and a merge step, each of which is a place for the checksum file and the binaries to
# disagree about what shipped.
#
# The dry run of this same cross-build is a job in certification.yml (it left the two-minute
# CL tier), so a target that stops compiling is a red certification rather than a red tag -- a
# tag being the one thing here that cannot be quietly amended and pushed again.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # NOT cancel-in-progress: a cancelled release leaves a tag with a partial set of binaries
  # attached, which is the one state worse than no release. Two tags are two groups.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certified:
    # THE RELEASE NEEDS A GREEN CERTIFICATION RUN ON THIS EXACT COMMIT, AND ASKS FOR ONE
    # rather than running the tests again here. Until v0.15.0 this file ran its own
    # `go test -race ./...` on three operating systems, serially, inside a 15-minute job;
    # certification.yml runs the same tests fanned out per package, and the Windows leg
    # here outgrew its cap (run 34775563018: cancelled with packages still to run, the
    # release job skipped, no release object, while certification had passed the same
    # commit in six minutes). Two copies of one test set drift, and the copy that ran here
    # was the slower and the older one. So this job is one question to the API, answered from
    # one snapshot: of every certification.yml run on the commit this run is building, is any
    # still unfinished (then wait), and did the most recently updated one succeed (then
    # release)? A commit no certification run vouches for, or whose latest evidence is red,
    # gets no release, and the refusal names the remedy.
    # It is the tag-only-a-certified-commit practice made into something that can say no.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Listing workflow runs is an Actions read; the file-level grant is contents only, and a
      # job that asks the API with a token that cannot read Actions would refuse every
      # release with a 403 that looks like "no certification run". Scoped to this job.
      actions: read
    steps:
      - name: certification.yml passed on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          # ONE ASKER, AND IT READS THE STATUS RATHER THAN THE EXIT CODE, for the reason the
          # release job's `ask` below states: `gh api` exits 1 on an empty answer and on no
          # answer alike. `-i` puts the status line first and the body after the blank line.
          # ONE SNAPSHOT, NO STATUS FILTER. Two asks (completed, then in flight) are two
          # snapshots, and a run that finishes red between them is in neither answer. So every
          # run on this commit is fetched once, and the decision is made from that one list:
          # anything not yet completed (queued, waiting, in progress) refuses with a wait line;
          # otherwise the run with the LATEST UPDATE decides, not the newest by creation or by
          # array position, because a rerun of an older run id is newer evidence than a later
          # run that was never rerun. The perf wall clock lives in certification, so a commit
          # green once and red on a rerun is a commit the newest evidence says not to release.
          set +e
          out=$(gh api -i "repos/${GITHUB_REPOSITORY}/actions/workflows/certification.yml/runs?head_sha=${SHA}&per_page=100" 2>&1); rc=$?
          set -e
          case "$(printf '%s\n' "$out" | head -n 1)" in
            HTTP/*" 200 "*) ;;
            *)
              echo "asking GitHub for certification runs on $SHA did not answer 200 (gh exit $rc):"
              printf '%s\n' "$out"
              exit 1
              ;;
          esac
          body=$(printf '%s\n' "$out" | sed -e '1,/^[[:space:]]*$/d')
          total=$(printf '%s' "$body" | jq -r '.total_count')
          listed=$(printf '%s' "$body" | jq -r '.workflow_runs | length')
          if [ "$total" != "$listed" ]; then
            echo "refusing: $total certification runs on $SHA but only $listed listed; the selection would be ambiguous"
            exit 1
          fi
          printf '%s' "$body" | jq -r '.workflow_runs[] | "  run \(.id) attempt \(.run_attempt) \(.status) \(.conclusion // "-") updated \(.updated_at) \(.html_url)"'
          inflight=$(printf '%s' "$body" | jq -r '[.workflow_runs[] | select(.status != "completed")] | length')
          if [ "$inflight" != 0 ]; then
            echo "refusing: $inflight certification run(s) on $SHA not yet completed; wait for certification-ok, then re-run this workflow: gh run rerun $GITHUB_RUN_ID -R $GITHUB_REPOSITORY"
            exit 1
          fi
          newest=$(printf '%s' "$body" | jq -r '(.workflow_runs | sort_by(.updated_at) | last) // {} | "\(.id // "none") \(.run_attempt // 0) \(.conclusion // "none") \(.updated_at // "-")"')
          set -- $newest
          echo "certification runs on $SHA: $total completed; latest update is run $1 attempt $2, concluded $3 at $4"
          if [ "$3" != success ]; then
            echo "refusing: the latest certification evidence on $SHA is $3, so nothing vouches for this tree"
            echo "certify it first (a run still in progress does not count; wait for certification-ok):"
            echo "  gh workflow run certification.yml -R $GITHUB_REPOSITORY --ref $REF"
            echo "then re-run this workflow: gh run rerun $GITHUB_RUN_ID -R $GITHUB_REPOSITORY"
            exit 1
          fi

  release:
    needs: certified
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # The only job in this repository that writes anything. It is scoped to this job
      # rather than the file, so the certified job above, which asks the API and runs none
      # of the tagged tree's code, has read only.
      contents: write
    env:
      # Read once, from the ref that triggered the run, and passed to every step as an
      # environment variable rather than interpolated into a shell line: a `${{ }}` inside
      # a run block is pasted into the script before bash sees it, so a ref carrying shell
      # syntax would be executed rather than quoted.
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: the tag has the shape the version stamp assumes
        shell: bash
        run: |
          case "$TAG" in
            v*) ;;
            *) echo "refusing: $TAG is not a v-prefixed tag"; exit 1 ;;
          esac

      - name: build every shipped tool for every shipped platform
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # cmd/*/ rather than a list, so a tool added to this repository ships without
          # anyone remembering this file, and a tool that must NOT ship is excluded here
          # in one visible place rather than by omission from a list nobody rereads.
          # THE LDFLAGS ARE COMPOSED BY A SCRIPT THAT CAN REFUSE, and composed ONCE, before
          # the first target is built. `-X main.version=` with an empty value is a legal
          # linker flag: it stamps the empty string, every binary falls back to `devel`,
          # and nothing in this job noticed -- release.yml:119 in #118. Since #107 that
          # release's nova-wake would refuse every nova-bus the same release shipped.
          # A failed substitution here aborts the step under `set -e` rather than building
          # 55 unstamped artifacts. ci.yml's release-dry-run asserts the refusal.
          LDFLAGS=$(.github/scripts/release-ldflags.sh "$TAG")
          echo "ldflags: $LDFLAGS"
          built=0
          for target in "linux amd64" "linux arm64" "darwin arm64" "darwin amd64" "windows amd64"; do
            set -- $target
            goos=$1; goarch=$2; ext=""
            [ "$goos" = windows ] && ext=".exe"
            for dir in cmd/*/; do
              name=$(basename "$dir")
              # -trimpath so the binary holds no path from this runner; -s -w because a
              # symbol table nobody has the source layout for is only size. -X stamps the
              # tag into main.version, which the version verbs read; the linker ignores it
              # silently for a tool that has no such var, which is why the assertion below
              # runs the binaries rather than trusting the flag.
              GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build \
                -trimpath -ldflags "$LDFLAGS" \
                -o "dist/${name}_${TAG}_${goos}_${goarch}${ext}" "./${dir%/}"
              built=$((built + 1))
            done
          done
          [ "$built" -gt 0 ] || { echo "cmd/ matched nothing: this release would ship an empty set"; exit 1; }
          [ -f "dist/nova-bus_${TAG}_linux_amd64" ] || { echo "nova-bus is not in the shipped set"; exit 1; }
          ls -l dist

      - name: every shipped binary reports the tag it was built from
        shell: bash
        run: |
          set -euo pipefail
          # The runner is linux/amd64, so one artifact per tool is directly runnable here.
          # This is the whole check on the -X stamp: the flag is silently ignored when the
          # symbol is missing or renamed, so a release could otherwise carry binaries that
          # answer `devel` while the release page says v1.2.3 -- and the one question this
          # verb exists to answer is which build somebody is running.
          #
          # EVERY tool in the build loop above, not the two this step used to name. A stamp
          # read by two binaries says nothing about the other nine, and since #107 it is
          # nova-wake's stamp that decides which nova-bus it accepts: an unstamped nova-wake
          # in a release refuses every nova-bus in that same release (#118).
          #
          # The script walks cmd/*/ the way the build loop does and REQUIRES the tag from
          # every tool it finds. The only exceptions are the six legacy tools named in the
          # script itself, which have no version verb until #121 lands; they print a NOTE
          # naming themselves and #121 rather than being passed over in silence, and each
          # name comes off that list the day its verb lands. Nothing about a tool's source
          # decides whether it is required -- a renamed or deleted `version` symbol is the
          # failure this step exists to catch, so it cannot also be what excuses a tool
          # from the check. It is exercised by ci.yml's release-dry-run, which proves both
          # outcomes and the rename on every pull request.
          .github/scripts/assert-version-stamp.sh "$TAG" "dist/%s_${TAG}_linux_amd64"

      - name: SHA256SUMS over the whole shipped set
        shell: bash
        run: |
          set -euo pipefail
          # Written outside dist/ and moved in, so the file cannot list itself, and
          # verified immediately: a checksum file nobody has ever checked is a file whose
          # first reader is the person it was supposed to reassure.
          (cd dist && sha256sum -- *) > SHA256SUMS
          mv SHA256SUMS dist/
          (cd dist && sha256sum -c SHA256SUMS)
          cat dist/SHA256SUMS

      - name: attach every artifact to the release, creating it if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # ONE ASKER, AND IT READS THE STATUS RATHER THAN THE EXIT CODE. `gh api` exits
          # 1 on a 404 and exits 1 exactly the same way on a dropped connection, an
          # expired token or a secondary rate limit, so its exit code cannot tell an
          # answer of "no" from no answer at all -- and a step that reads a transient
          # failure as absence is a step that walks down the create path knowing nothing
          # about what is on the release page. `gh api -i` prints the status line first.
          # 200 and 404 are answers; anything else is not, and this stops the job with
          # the whole response pasted rather than choosing a branch on a guess.
          ask() {
            local out rc
            set +e
            out=$(gh api -i "$1" 2>&1); rc=$?
            set -e
            case "$(printf '%s\n' "$out" | head -n 1)" in
              HTTP/*" 200 "*) CODE=200 ;;
              HTTP/*" 404 "*) CODE=404 ;;
              *)
                echo "asking GitHub about $1 answered neither 200 nor 404 (gh exit $rc):"
                printf '%s\n' "$out"
                exit 1
                ;;
            esac
          }

          # THE TAG IS VERIFIED ON BOTH PATHS, not only the create one. `--verify-tag`
          # below is gh refusing to invent a tag that does not exist, and the upload path
          # takes no such flag -- so the guarantee has to come from somewhere else. It
          # cannot come from the trigger: this file also has `workflow_dispatch`, which
          # runs against whatever ref the person picked and may be a branch, and the shape
          # check above only asks that the ref begin with v. So the tag's existence is
          # established here, once, for both paths.
          ask "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}"
          if [ "$CODE" = 404 ]; then
            echo "refusing: $TAG is not a tag in this repository"
            exit 1
          fi

          # AND IT IS THIS TREE'S TAG. Existence is not enough, and this is the check that
          # actually carries --verify-tag's guarantee onto the upload path. Under
          # `push: tags: v*` the ref that triggered the run IS the tag, so the two are the
          # same fact; under workflow_dispatch they are not, and a tag can be force-moved
          # after its release was published. A dispatch on a BRANCH named like a tag passes
          # the shape check above, and if a real tag of that name exists the upload path
          # would then --clobber a published release's binaries AND its SHA256SUMS with a
          # build from an unrelated tree -- assets whose checksum file agrees with itself
          # and with nothing anybody tagged. Before this step learned to upload, the
          # duplicate-name refusal stopped that by accident; it is stopped on purpose here.
          # The tag is fetched rather than assumed present: checkout is shallow and carries
          # no tags, and a stale local tag is overwritten by the leading +.
          git fetch --depth=1 origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          tagged=$(git rev-parse "refs/tags/${TAG}^{commit}")
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "refusing: $TAG is the tag for $tagged, but this run built $GITHUB_SHA"
            echo "attaching here would replace $TAG's published artifacts with a build from another tree"
            exit 1
          fi

          # The release may already exist: v0.11.0 was published by hand before its tag's
          # run reached this step, `gh release create` refused the duplicate tag name, and
          # the release kept its notes and got none of its binaries. An existing release is
          # therefore the case this branch handles rather than the case that fails -- the
          # artifacts are the thing this job is for, and the notes are already right.
          ask "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}"
          if [ "$CODE" = 200 ]; then
            # --clobber so a rerun replaces what a partial upload left, rather than erroring
            # on the names already attached.
            gh release upload "$TAG" --clobber dist/*
          else
            # --verify-tag: gh will otherwise CREATE a tag that does not exist, which on a
            # rerun with a typo'd ref would publish a release for a commit nobody tagged.
            # Kept even though the check above has already answered the same question: a
            # flag that makes gh refuse is worth more than a flag this file's own reasoning
            # says is redundant.
            gh release create "$TAG" \
              --verify-tag \
              --title "$TAG" \
              --generate-notes \
              dist/*
          fi
