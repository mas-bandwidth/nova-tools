# Certification: the slower tier that cannot fit the two-minute per-CL budget.
#
# Every job that leaves ci.yml's CL tier appears here under the same name, so a
# change's ordinary feedback path stays under two minutes while nothing is
# deleted: the whole-tree `-race` run, Windows build/vet and per-package tests,
# the three-OS smoke of the shipped binary, the release dry-run, and the nightly
# perf wall clock all still run — on a daily schedule and on demand.
#
# A RED run here is a blocker for the next release, never for a CL. See
# docs/CONTRIBUTING.md, "Two tiers of CI".

name: certification

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
  push:
    branches: [dev]


permissions:
  contents: read

env:
  # #3113: the same fail-closed switch as ci.yml. The test and perf jobs
  # install redis-server before they run the suite.
  NOVA_CI: "1"

concurrency:
  group: certification-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    # THE WHOLE-TREE RACE RUN, on a clean GitHub-hosted image, linux/amd64 and darwin/arm64:
    # every live package under `go test -race`, full (no -short), and the one place either of
    # those runs. ci.yml's CL tier runs the same tests without -race (test-race-queue races
    # internal/redisq only), and its hosted legs run -short.
    #
    # SHARDED BY PACKAGE (2026-09-27). Unsharded, this job ran `go build ./...`, `go vet ./...`
    # and `go test -race ./...` on one runner under the two-minute cap and was cancelled by the
    # cap on every dev push since the cap landed (27c9ffc66, 2026-09-26): runs 36355661583,
    # 36356115183, 36357522017, 36357749379 and 36360296846. ubuntu-latest reached the test step
    # 97-119 s into the job (setup-go 8-10 s, build 52-67 s cold, vet 16-22 s, redis 11-18 s) and
    # was cancelled in it every time, at most two packages reported; macos-latest reached it at
    # 78-128 s in three runs and was cancelled in build or vet in the other two.
    # The last green whole-tree race run (dev push 36137551959, 2026-09-25, 15-minute cap) took
    # 421 s of test step on ubuntu-latest and 497 s on macos-latest. The cap stays two minutes;
    # the legs meet it by shard count, with the deal of ci.yml's test-hosted (heavy packages
    # first, one per shard, then round-robin) over the live packages only (deprecated/PACKAGES:
    # deprecated packages are never tested).
    #
    # THE HEAVY LIST is measured, not named: the per-package times this job's own legs report
    # (`ok <pkg> <seconds>`), the larger of ubuntu-latest and macos-latest, in the cold run
    # 36375296705 at 3314df055 plus this change: internal/ci 49.3 s, internal/gh 47.3,
    # cmd/nova-tokens 46.4, cmd/nova-sandbox 34.2, cmd/nova-self-talk 21.3, internal/update 19.1,
    # cmd/nova-secrets 16.7, internal/bus 16.6, every other live package under 13 (cmd/nova-bus
    # 1.2). Eight heavy packages, eight shards: each heavy package has a shard of its own and
    # the rest are about twelve packages a shard.
    #
    # BUILD AND VET ARE NOT HERE ANY MORE. They are ci.yml's: its lint job runs `make build` and
    # `make vet` on every event (Linux), and its test-hosted legs run `make build` and
    # `make vet PKGS=<shard>` on ubuntu-latest and macos-latest on every push to dev and main.
    # Each shard's `go test -race` still compiles every package it tests, so the union of the
    # shards compiles the whole live tree for both platforms. gofmt stays, on one leg.
    #
    # THE RACE BUILD CACHE, the shape of ci.yml's test-hosted (#4482): Go's own cache path per
    # OS, restored first and SAVED BEFORE THE TESTS, because actions/cache's post-step save
    # never runs in a job the cap cancels, and this job was never green to save one (setup-go's
    # own cache logged "Cache is not found" on all ten legs of the runs above). What is saved is the
    # race-instrumented build of every external module package the live tree's tests import
    # (139 packages at 82429246b): measured cold on the Studio at -p 4, 18.3 s and 384 MB, then
    # 0.2 s warm. Every shard builds the same list, so whichever shard saves first saves the
    # entry every shard needs; the tree's own packages compile per shard in the test step
    # (the whole live tree's race test binaries, compiled and linked with warm dependencies:
    # 24.1 s at -p 4 on the Studio, about an eighth of that a shard). The key says `gorace`, so
    # it is never ci.yml's non-race entry (whose restore prefix is `<os>-go-`, which this key
    # does not start with).
    name: test (${{ matrix.os }}, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
        include:
          - os: ubuntu-latest
            shards: 8
          - os: macos-latest
            shards: 8
    runs-on: ${{ matrix.os }}
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2  # the classtests rule reads what HEAD deleted from its first parent
      - name: name the Go toolchain's tool-cache directory
        # The toolchain rides in the race cache entry below. setup-go downloads, extracts and
        # then copies it into the runner's tool cache: 26-27 s on macos-latest, 16 s of it the
        # copy (run 36376038363). Restored into the tool cache first, setup-go finds it there
        # and does neither. The version is go.mod's, which the cache key already hashes.
        shell: bash
        run: echo "GO_TOOL_DIR=${RUNNER_TOOL_CACHE}/go/$(sed -n 's/^go \([0-9.]*\)$/\1/p' go.mod)" >> "$GITHUB_ENV"

      - name: restore the race build cache
        id: gocache
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ runner.os == 'macOS' && '~/Library/Caches/go-build' || '~/.cache/go-build' }}
            ~/go/pkg/mod
            ${{ env.GO_TOOL_DIR }}
          key: ${{ runner.os }}-gorace-${{ hashFiles('go.mod') }}
          restore-keys: |
            ${{ runner.os }}-gorace-

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # This job manages its cache above and below; setup-go's own saves in a post step,
          # which a cancelled job never reaches.
          cache: false

      - name: gofmt
        # gofmt -l prints unformatted files and exits 0 either way, so the exit
        # code is not the product here — the output is. Checked on one leg:
        # formatting is a property of the source, not of the platform or the shard.
        if: matrix.os == 'ubuntu-latest' && matrix.shard == 1
        shell: bash
        run: |
          # deprecated/ is out of scope of the testing drive (Glenn 2026-09-27); see deprecated/README.md
          unformatted=$(gofmt -l . | grep -v '^deprecated/' || true)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: deal this shard's packages
        # ci.yml test-hosted's deal, with this job's measured heavy list (above): the heavy
        # packages first, one per shard, then every other live package round-robin in go list
        # order. One line of space-separated packages. internal/ci:
        # TestCertificationRaceShardsPartitionTheLiveTree (certRaceHeavy).
        shell: bash
        run: |
          heavy="internal/ci internal/gh cmd/nova-tokens cmd/nova-sandbox cmd/nova-self-talk internal/update cmd/nova-secrets internal/bus"
          deal='
            BEGIN { h = split(heavy, hv, " ") }
            {
              k = 0
              for (j = 1; j <= h; j++) if ($0 ~ ("/" hv[j] "$")) k = j
              if (k) s = (k - 1) % n; else { s = (h + r) % n; r++ }
              if (s == i - 1) print
            }'
          pkgs=$(go list ./... | bash .github/scripts/live-packages.sh | awk -v n=${{ matrix.shards }} -v i=${{ matrix.shard }} -v heavy="$heavy" "$deal" | tr '\n' ' ')
          echo "$pkgs"
          echo "HOSTED_PKGS=$pkgs" >> "$GITHUB_ENV"

      - name: fetch origin/dev for the deprecated-imports ratchet
        # internal/ci's TestDeprecatedImportsAllowlistOnlyShrinksAgainstMergeBase compares the
        # allowlist against the merge base with refs/remotes/origin/dev and refuses when that
        # ref is missing. actions/checkout creates it only on a run of dev itself; a dispatch
        # on a tag, on main or on a branch has no such ref. One commit is enough: with no
        # shared history in the shallow clone the test compares against HEAD's first parent.
        if: contains(format(' {0} ', env.HOSTED_PKGS), '/internal/ci ')
        shell: bash
        run: git fetch --no-tags --depth=1 origin +dev:refs/remotes/origin/dev

      - name: build the race-instrumented dependencies
        # Every external package the live tree's tests import, -race, whatever this shard
        # holds: the same list on every shard, so the entry saved next serves them all.
        shell: bash
        run: |
          set -euo pipefail
          deps=$(go list -deps -test -f '{{if not .Standard}}{{if not .Module.Main}}{{.ImportPath}}{{end}}{{end}}' $(go list ./... | bash .github/scripts/live-packages.sh) | sort -u)
          echo "$(printf '%s\n' "$deps" | grep -c .) external packages"
          go build -race $deps

      - name: save the race build cache
        # On a miss or a restore-keys fallback only: an exact hit is already the entry. Shards
        # race for the key; the first reserves it and the rest log a warning and go on.
        if: runner.environment == 'github-hosted' && steps.gocache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ runner.os == 'macOS' && '~/Library/Caches/go-build' || '~/.cache/go-build' }}
            ~/go/pkg/mod
            ${{ env.GO_TOOL_DIR }}
          key: ${{ steps.gocache.outputs.cache-primary-key }}

      - name: install redis-server
        # #3113. This job is the hosted full suite, ubuntu-latest and
        # macos-latest. The controls spawn redis-server; they do not dial a bench.
        run: bash .github/scripts/install-redis-server.sh

      - name: test (shard ${{ matrix.shard }} of ${{ matrix.shards }})
        # -count=1: the restored cache must never answer for a test. -timeout 75s: this step
        # starts 35-50 s into the job, so a package still running at 75 s would be cancelled
        # by the cap anyway; Go's timeout fires first and names the test with a stack.
        shell: bash
        run: go test -race -count=1 -timeout 75s $HOSTED_PKGS

  smoke:
    needs: release-dry-run
    # Exercises the BUILT BINARY. `go test` covers the packages; nothing else
    # covered the executable a user actually runs, and what a release ships is
    # the executable.
    #
    # HONEST SCOPE, because this job's own argument is that unstated coverage
    # is a lie — and an enumerating sentence that omits items reads worse than
    # a general one, so this says what IS smoked and stops.
    #
    # Smoked here: `nova-check nocode`, plus one property of `nova-check links`
    # — that a symlinked `--dir` is resolved rather than passed over — and only
    # the properties asserted in the steps below. Everything else in this
    # repository — every other `nocode` flag and refusal path, every other
    # `links` property, every other `nova-check` subcommand, and the
    # `nova-fuse`, `nova-memory`, `nova-self-talk` and `nova-bus`
    # commands — is covered by package tests and by nothing else.
    #
    # WINDOWS. The portable steps run there too. An earlier revision excluded
    # the whole job on the grounds that its fixtures need an executable bit,
    # chmod refusing a read, mkfifo or symlinks — true of four steps and false
    # of the other three, which meant the binary was never smoked on the one
    # platform whose defects this branch exists to have found. The steps that
    # genuinely cannot run there are marked individually.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 2
    env:
      # Go appends .exe on Windows, so the name has to carry it or every step
      # below looks for a binary that is not there. Keyed off matrix.os and NOT
      # runner.os: the runner context is not available to a job-level env, and
      # using it there does not warn — it invalidates the whole workflow file,
      # which fails the run before a single step executes.
      BIN: ${{ github.workspace }}/nova-check${{ startsWith(matrix.os, 'windows') && '.exe' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2  # the classtests rule reads what HEAD deleted from its first parent

      - name: download this runner's platform from the release build
        id: download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ startsWith(matrix.os, 'ubuntu') && 'release-linux-amd64' || startsWith(matrix.os, 'macos') && 'release-darwin-arm64' || 'release-windows-amd64' }}
          path: dist

      - name: take this runner's shipped binary
        id: take_binary
        # THE BINARY THAT WOULD SHIP, not one built here. This step used to be `go build -o
        # "$BIN" ./cmd/nova-check`, which is a different binary from the released one --
        # different flags, no -trimpath, CGO as the host has it -- so the job whose whole
        # argument is "what a release ships is the executable" was smoking an executable no
        # release ships. There is no Go toolchain in this job any more: if the binary is not
        # in the artifact, this job cannot paper over it by compiling one.
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.os }}" in
            ubuntu-latest)  target=linux_amd64 ;;
            macos-latest)   target=darwin_arm64 ;;
            windows-latest) target=windows_amd64 ;;
            *) echo "no shipped target mapped for ${{ matrix.os }}"; exit 1 ;;
          esac
          # The release name, <tool>_<stamp>_<goos>_<goarch>[.exe] (release-build.sh).
          src="dist/nova-check_v0.0.0-dry-run_$target"
          [ "$target" = "windows_amd64" ] && src="$src.exe"
          [ -f "$src" ] || { echo "$src is not in the artifact: ls -R dist"; ls -R dist; exit 1; }
          mkdir -p "$(dirname "$BIN")"
          cp "$src" "$BIN"
          chmod +x "$BIN"
          "$BIN" version || true

      - name: a clean prose tree passes, and is actually walked
        id: clean_tree
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          tree="$(mktemp -d)"
          printf '# notes\n' > "$tree/NOTES.md"
          printf 'plain text\n' > "$tree/plain.txt"
          set +e; out=$("$BIN" nocode --dir "$tree" 2>&1); rc=$?; set -e
          [ "$rc" -eq 0 ] || { echo "want exit 0, got $rc: $out"; exit 1; }
          # files=2 is the load-bearing half. `nocode` prints NOCODE OK and
          # exits 0 for a tree it never opened, so exit 0 alone cannot tell a
          # pass from a walk that scanned nothing.
          case "$out" in
            *"files=2 clean"*) ;;
            *) echo "want files=2 clean, got: $out"; exit 1 ;;
          esac

      - name: a symlinked --dir is resolved, not passed over
        id: symlink_nocode
        # POSIX only: needs an executable bit, chmod refusing a read, mkfifo or symlinks.
        if: ${{ !cancelled() && (runner.os != 'Windows') }}
        shell: bash
        run: |
          # The fail-open the assertion above was WRONGLY credited with
          # catching. os.Stat follows a link, so --dir naming a symlink to the
          # tree was seen as a single non-directory entry and returned
          # NOCODE OK files=0, exit 0: a clean pass over a tree never opened.
          # A reviewer removed filepath.EvalSymlinks and every other step here
          # stayed green, because none of their fixtures is itself a link.
          # This one is.
          real="$(mktemp -d)"; printf '# n\n' > "$real/NOTES.md"; printf 'print(1)\n' > "$real/tool.py"
          link="$(mktemp -d)/link"; ln -s "$real" "$link"
          set +e; out=$("$BIN" nocode --dir "$link" 2>&1); rc=$?; set -e
          [ "$rc" -eq 1 ] || { echo "symlinked --dir: want exit 1, got $rc: $out"; exit 1; }
          case "$out" in
            *"tool.py"*) echo "ok: a symlinked --dir is walked" ;;
            *) echo "symlinked --dir: the tree was not walked: $out"; exit 1 ;;
          esac

      - name: a symlinked --dir is resolved, not passed over (links)
        id: symlink_links
        # POSIX only: needs an executable bit, chmod refusing a read, mkfifo or symlinks.
        if: ${{ !cancelled() && (runner.os != 'Windows') }}
        shell: bash
        run: |
          # The same fail-open, in the other checker. os.Stat follows a link,
          # so --dir naming a symlink to the tree was seen as a single
          # non-directory entry and returned LINKS OK files=0 links=0, exit 0
          # — a clean pass over a tree never walked, while the same tree by its
          # real path reported the broken link and exited 1. No other step in
          # this job hands `links` a --dir that is itself a link, so nothing
          # else here would catch it coming back.
          real="$(mktemp -d)"; printf 'fine\n\n[gone](gone.md)\n' > "$real/a.md"
          link="$(mktemp -d)/link"; ln -s "$real" "$link"
          set +e; out=$("$BIN" links --dir "$link" 2>&1); rc=$?; set -e
          [ "$rc" -eq 1 ] || { echo "symlinked --dir: want exit 1, got $rc: $out"; exit 1; }
          case "$out" in
            *"a.md:3: gone.md (does not exist)"*) echo "ok: a symlinked --dir is walked" ;;
            *) echo "symlinked --dir: the tree was not walked: $out"; exit 1 ;;
          esac

      - name: a tree that classified nothing says so
        id: classified_nothing
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          # The scanned==0 warning is the only remaining backstop for the
          # fail-open above in a real repository, and deleting it left every
          # other step green. Exit 0 is correct here: an empty tree genuinely
          # holds no machinery. What must not vanish is the sentence telling
          # an operator that nothing was classified.
          empty="$(mktemp -d)"
          set +e; out=$("$BIN" nocode --dir "$empty" 2>&1); rc=$?; set -e
          [ "$rc" -eq 0 ] || { echo "empty tree: want exit 0, got $rc: $out"; exit 1; }
          case "$out" in
            *"classified NOTHING"*) echo "ok: an unwalked tree is reported" ;;
            *) echo "empty tree: the scanned==0 warning is gone: $out"; exit 1 ;;
          esac

      - name: each condition refuses separately, with the right code and reason
        id: each_condition
        # POSIX only: needs an executable bit, chmod refusing a read, mkfifo or symlinks.
        if: ${{ !cancelled() && (runner.os != 'Windows') }}
        shell: bash
        run: |
          # One fixture per condition AND an assertion on which reason fired.
          # One fixture per condition alone would still go green if a
          # regression collapsed every case into one spurious finding.
          check() {
            desc="$1"; tree="$2"; want_reason="$3"
            set +e; out=$("$BIN" nocode --dir "$tree" 2>&1); rc=$?; set -e
            [ "$rc" -eq 1 ] || { echo "$desc: want exit 1, got $rc: $out"; exit 1; }
            case "$out" in
              *"$want_reason"*) echo "ok: $desc" ;;
              *) echo "$desc: want reason '$want_reason', got: $out"; exit 1 ;;
            esac
          }

          t="$(mktemp -d)"; printf '# n\n' > "$t/NOTES.md"; printf 'print(1)\n' > "$t/tool.py"
          check "extension" "$t" "code extension .py (floor list)"

          t="$(mktemp -d)"; printf '# n\n' > "$t/NOTES.md"; printf 'not a script\n' > "$t/thing"; chmod +x "$t/thing"
          check "executable bit" "$t" "executable (mode"

          t="$(mktemp -d)"; printf '# n\n' > "$t/NOTES.md"; printf '#!/bin/sh\necho hi\n' > "$t/thing"
          check "shebang" "$t" "executable script (shebang)"

      - name: the fail-opens this CI exists for stay closed
        id: fail_opens
        # POSIX only: needs an executable bit, chmod refusing a read, mkfifo or symlinks.
        if: ${{ !cancelled() && (runner.os != 'Windows') }}
        shell: bash
        run: |
          # These are the regressions that motivated the file. Each was a real
          # fail-open in a released check: a file nobody can open, and a file
          # that is not a regular file at all, must be FINDINGS rather than
          # passes. Making a file less readable must never make this gate
          # greener.
          if [ "$(id -u)" = "0" ]; then
            # FAIL rather than skip. The hosted runners are non-root, so this
            # branch firing means the environment changed under us — and a
            # silent skip would turn this job's headline fail-open assertion
            # into a no-op behind a green check.
            echo "running as root: chmod cannot refuse a read, so this assertion cannot run"
            exit 1
          else
            t="$(mktemp -d)"; printf '# n\n' > "$t/NOTES.md"; printf 'x\n' > "$t/secret"; chmod 000 "$t/secret"
            set +e; out=$("$BIN" nocode --dir "$t" 2>&1); rc=$?; set -e
            chmod 644 "$t/secret" || true
            [ "$rc" -eq 1 ] || { echo "unreadable: want exit 1, got $rc: $out"; exit 1; }
            case "$out" in
              *"cannot rule out machinery"*) echo "ok: unreadable file is a finding" ;;
              *) echo "unreadable: wrong reason: $out"; exit 1 ;;
            esac
          fi

          t="$(mktemp -d)"; printf '# n\n' > "$t/NOTES.md"; mkfifo "$t/pipe.sh"
          set +e; out=$("$BIN" nocode --dir "$t" 2>&1); rc=$?; set -e
          [ "$rc" -eq 1 ] || { echo "fifo: want exit 1, got $rc: $out"; exit 1; }
          case "$out" in
            *"not a regular file"*) echo "ok: non-regular file is a finding" ;;
            *) echo "fifo: wrong reason: $out"; exit 1 ;;
          esac

      - name: a guard that cannot read its own list refuses, and says so
        id: unreadable_list
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          # Exit 2, not merely non-zero: `flag` also exits non-zero on an
          # unknown flag, so "non-zero" would pass with --deny-ext misspelled
          # and the flag under test never exercised. The message is asserted
          # for the same reason.
          # The @path is RELATIVE on purpose. An absolute POSIX path here is
          # rewritten by git-bash on Windows — "@/nonexistent/list.txt" reached
          # the binary as "C:/Program Files/Git/nonexistent/list.txt" — so the
          # exit code held and the message assertion failed on a spelling this
          # step never chose. A relative name is passed through unchanged by
          # every shell in the matrix.
          t="$(mktemp -d)"; printf '# n\n' > "$t/NOTES.md"
          set +e; out=$("$BIN" nocode --dir "$t" --deny-ext "@no-such-deny-list.txt" 2>&1); rc=$?; set -e
          [ "$rc" -eq 2 ] || { echo "want exit 2, got $rc: $out"; exit 1; }
          case "$out" in
            *"deny-list file: open no-such-deny-list.txt"*) echo "ok: unreadable deny-list refused" ;;
            *) echo "wrong message: $out"; exit 1 ;;
          esac

      - name: every assertion above reported
        # THE GATE, and the reason every step above carries `if: ${{ !cancelled() }}`.
        #
        # A step that fails stops the ones after it from running by default, so a broken
        # second assertion used to hide assertions three to seven: the job went red,
        # somebody fixed the one failure it named, and the next run found the next one.
        # Seven red steps in one run is seven facts; one red step and six skipped is one
        # fact and a queue.
        # `!cancelled()` runs them all anyway -- and keeps honouring a real cancellation --
        # and this step is where the job's verdict is stated in one place, naming every
        # outcome rather than only the first bad one.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -uo pipefail
          bad=0
          # The two PREREQUISITE steps are in this list as well as the seven assertions: a
          # gate that claims to state every outcome and silently omits the two steps that
          # produce the binary is a gate with a blind spot exactly where a green would be
          # most misleading.
          for pair in \
            "download the shipped binaries:${{ steps.download.outcome }}" \
            "take this runner's binary:${{ steps.take_binary.outcome }}" \
            "a clean prose tree passes:${{ steps.clean_tree.outcome }}" \
            "a symlinked --dir (nocode):${{ steps.symlink_nocode.outcome }}" \
            "a symlinked --dir (links):${{ steps.symlink_links.outcome }}" \
            "a tree that classified nothing:${{ steps.classified_nothing.outcome }}" \
            "each condition refuses separately:${{ steps.each_condition.outcome }}" \
            "the fail-opens stay closed:${{ steps.fail_opens.outcome }}" \
            "an unreadable deny-list refuses:${{ steps.unreadable_list.outcome }}"
          do
            what="${pair%:*}"; outcome="${pair##*:}"
            echo "$outcome	$what"
            case "$outcome" in success|skipped) ;; *) bad=$((bad + 1)) ;; esac
          done
          [ "$bad" -eq 0 ] || { echo "$bad smoke assertion(s) failed"; exit 1; }

  release-build:
    # THE RELEASE BUILD, run on every certification with nothing attached to a release. It
    # exists because release.yml's first run is triggered by a TAG, and a tag is the one thing
    # in this repository that cannot be quietly amended: a target that stopped compiling would
    # be found by the release itself, with the tag already pushed. Here it is a red run
    # before a release, not after a tag.
    #
    # THE SAME BUILD AS release.yml's `build` job, step for step: one leg per shipped
    # platform, each running .github/scripts/release-build.sh (every cmd/*/ tool, -trimpath,
    # CGO_ENABLED=0, the ldflags release-ldflags.sh composes) and uploading its binaries as
    # the artifact `release-<goos>-<goarch>`. The matrix is the list in
    # .github/scripts/release-targets, written out because a matrix cannot read a file;
    # internal/ci's TestReleaseMatricesAreTheTargetsFile holds this matrix, release.yml's
    # and the file equal. The one difference from the release is the stamp, v0.0.0-dry-run.
    #
    # ONE LEG PER PLATFORM, in parallel, under the two-minute cap. One runner cross-building
    # all five platforms cold was cancelled by the cap inside the build (run 36357749379,
    # about 146 s into the step). A leg compiles one platform: 45 s of CPU for the fifteen
    # tools and their dependencies cold on the Studio, 1.2 s warm.
    #
    # THE GO BUILD CACHE, per platform, restored first and SAVED right after the build,
    # before the upload, for the reason the test job gives: a post-step save never runs in a
    # job the cap cancels. The key is the platform and go.mod/go.sum, so the entry holds the
    # standard library and every module package compiled for that platform, and the tree's
    # own packages compile in the leg. release-checks restores the linux-amd64 entry.
    #
    # Every action in this file is pinned by SHA. A mutable tag cannot change the action
    # implementation underneath a previously reviewed workflow.
    name: release-build (${{ matrix.goos }}, ${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: windows, goarch: amd64}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2  # the classtests rule reads what HEAD deleted from its first parent
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # This job manages its cache below; setup-go's own saves in a post step.
          cache: false

      - name: restore the release build cache
        id: gocache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: release-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            release-${{ matrix.goos }}-${{ matrix.goarch }}-

      - name: every shipped tool compiles for ${{ matrix.goos }}/${{ matrix.goarch }}
        shell: bash
        run: .github/scripts/release-build.sh v0.0.0-dry-run "${{ matrix.goos }}" "${{ matrix.goarch }}" dist

      - name: save the release build cache
        # On a miss or a restore-keys fallback only: an exact hit is already the entry.
        if: steps.gocache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.gocache.outputs.cache-primary-key }}

      - name: upload this platform's binaries
        # So that release-dry-run sums the set this would ship and the smoke job runs THE
        # BINARY THIS WOULD SHIP rather than one it builds itself with different flags.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 1
          if-no-files-found: error

  release-dry-run:
    # release.yml's final job over the dry-run set, on one machine: every platform's
    # artifact downloaded into one directory, every linux/amd64 binary asked for the stamp it
    # was built from (.github/scripts/assert-version-stamp.sh, the runner is linux/amd64),
    # then .github/scripts/release-sums.sh, which refuses a directory that is not exactly the
    # shipped set (every cmd/*/ tool for every platform in release-targets, nothing else) and
    # writes and verifies SHA256SUMS over the whole of it. The release runs the same two
    # scripts in the same order before it attaches the set. No toolchain: nothing is built
    # here, so nothing here can paper over a leg that did not build.
    needs: release-build
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2  # the classtests rule reads what HEAD deleted from its first parent

      - name: download every platform's binaries into one directory
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: every shipped binary reports the tag it was built from
        shell: bash
        run: |
          set -euo pipefail
          # An artifact does not keep the executable bit.
          chmod +x dist/*_v0.0.0-dry-run_linux_amd64
          .github/scripts/assert-version-stamp.sh v0.0.0-dry-run "dist/%s_v0.0.0-dry-run_linux_amd64"

      - name: SHA256SUMS over the whole shipped set
        shell: bash
        run: .github/scripts/release-sums.sh v0.0.0-dry-run dist

  release-checks:
    # THE NEGATIVE CONTROLS OF THE RELEASE SCRIPTS: the stamp refusals, a tool that loses its
    # stamp, the tag alphabet, the certified gate and the draft/publication boundary. A tag
    # is the one thing here that cannot be quietly amended, so each refusal release.yml
    # relies on is seen to fire here, on every certification, rather than first on a tag.
    #
    # The fixtures build the tools for this runner, linux/amd64, with the release's
    # -trimpath and CGO_ENABLED=0, so the compiles are the ones release-build's linux-amd64
    # leg saved to its cache; it needs that leg for the entry, and each fixture build here is
    # a link. The binaries built here are fixtures and are never shipped or summed.
    needs: release-build
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GOFLAGS: -trimpath
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2  # the classtests rule reads what HEAD deleted from its first parent
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: restore the linux-amd64 release build cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: release-linux-amd64-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            release-linux-amd64-
      - name: the release stamp refuses a missing ldflag, and the assertion catches it
        shell: bash
        run: |
          set -euo pipefail
          # THIS IS THE TEST OF THE ASSERTION, which is the half of #118 that is easy to
          # leave out: a release job that asserts the stamp is worth nothing if the
          # assertion itself has never been seen to fail. A tag is the one thing here that
          # cannot be quietly amended, so both outcomes are proved here rather than on the
          # tag itself.
          #
          # It runs the same two scripts release.yml runs, over the same cmd/*/ tree, so a
          # tool added tomorrow is in this check too.
          stamp=v0.0.0-dry-run

          # ONE: the ldflags helper refuses an empty stamp instead of composing
          # `-X main.version=` and letting the build stamp the empty string.
          if .github/scripts/release-ldflags.sh "" >/dev/null 2>&1; then
            echo "release-ldflags.sh accepted an empty stamp: a release could ship binaries that answer devel"
            exit 1
          fi
          echo "ok: an empty stamp is refused"
          ldflags=$(.github/scripts/release-ldflags.sh "$stamp")
          case "$ldflags" in
            *"-X main.version=$stamp"*) echo "ok: $ldflags" ;;
            *) echo "release-ldflags.sh composed something else: $ldflags"; exit 1 ;;
          esac

          # TWO: binaries built with NO stamp fail the assertion, by name. This is the
          # release that #118 describes -- every tool answering its vcs pseudo-version or
          # devel while the release page names a tag -- and it must be red.
          rm -rf "${RUNNER_TEMP}/unstamped" "${RUNNER_TEMP}/stamped"
          go build -o "${RUNNER_TEMP}/unstamped/" ./cmd/...
          set +e
          out=$(.github/scripts/assert-version-stamp.sh "$stamp" "${RUNNER_TEMP}/unstamped/%s" 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          if [ "$rc" -eq 0 ]; then
            echo "the assertion PASSED a set of binaries nothing stamped; it would pass a broken release"
            exit 1
          fi
          case "$out" in
            *"does not report the tag it was built from"*) echo "ok: unstamped binaries are refused by name" ;;
            *) echo "the assertion failed, but not for the missing stamp; that is a different defect"; exit 1 ;;
          esac

          # THREE: the same binaries, stamped the way release.yml stamps them, pass -- so
          # the red above is the stamp and not the harness.
          go build -ldflags "$ldflags" -o "${RUNNER_TEMP}/stamped/" ./cmd/...
          .github/scripts/assert-version-stamp.sh "$stamp" "${RUNNER_TEMP}/stamped/%s"

      - name: a required tool that loses its stamp fails the assertion, and the rest still pass
        shell: bash
        run: |
          set -euo pipefail
          # STELLA'S NEGATIVE CONTROL (#125 review). The step above builds the whole tree
          # unstamped, which is red at the FIRST tool and therefore says nothing about the
          # tool-by-tool rule: one binary losing its stamp while the other ten keep theirs
          # is the failure mode #118 names -- a rename or a removal the linker ignores in
          # silence -- and until this job it was the case nothing exercised. Under the
          # declaration-based eligibility this file carried until #125 it was worse than
          # unexercised: renaming `version` made the tool exempt from the check, so the
          # broken binary passed AS A NOTE and the job went green. The required set is the
          # shipped set now, so both mutations must be red, and red BY NAME.
          stamp=v0.0.0-dry-run
          ldflags=$(.github/scripts/release-ldflags.sh "$stamp")
          cp cmd/nova-tokens/version.go "${RUNNER_TEMP}/nova-tokens-version.go.orig"
          restore() { cp "${RUNNER_TEMP}/nova-tokens-version.go.orig" cmd/nova-tokens/version.go; }
          trap restore EXIT

          # The mutation is asserted to have LANDED before the binaries are built. A sed
          # that matched nothing would rebuild the unmutated tree, the assertion would go
          # red for no reason at all, and this step would be green while proving nothing.
          mutate() {
            restore
            case "$1" in
            rename)
              sed -i 's/^var version string$/var Version string/; s/resolveVersion(version, info, ok)/resolveVersion(Version, info, ok)/' cmd/nova-tokens/version.go
              if ! grep -q '^var Version string$' cmd/nova-tokens/version.go; then
                echo "the rename fixture did not apply; this step would prove nothing"; exit 1
              fi
              ;;
            remove)
              sed -i '/^var version string$/d; s/resolveVersion(version, info, ok)/resolveVersion("", info, ok)/' cmd/nova-tokens/version.go
              if grep -q '^var version string$' cmd/nova-tokens/version.go; then
                echo "the removal fixture did not apply; this step would prove nothing"; exit 1
              fi
              ;;
            esac
            rm -rf "${RUNNER_TEMP}/mutated"
            go build -ldflags "$ldflags" -o "${RUNNER_TEMP}/mutated/" ./cmd/...
          }

          for how in rename remove; do
            mutate "$how"
            set +e
            out=$(.github/scripts/assert-version-stamp.sh "$stamp" "${RUNNER_TEMP}/mutated/%s" 2>&1)
            rc=$?
            set -e
            printf '%s\n' "$out"
            if [ "$rc" -eq 0 ]; then
              echo "the assertion PASSED a release whose nova-tokens answers a pseudo-version ($how)"
              exit 1
            fi
            case "$out" in
              *"FAIL: nova-tokens does not report the tag it was built from"*) ;;
              *) echo "the assertion failed, but not for nova-tokens' missing stamp ($how); that is a different defect"; exit 1 ;;
            esac
            case "$out" in
              *"NOTE: nova-tokens"*) echo "nova-tokens was demoted to a NOTE ($how); a required tool cannot become exempt by losing a symbol"; exit 1 ;;
            esac
            # The other tools are untouched, so the red above is this tool and not the harness.
            case "$out" in
              *"ok: nova-bus $stamp"*) ;;
              *) echo "nova-bus stopped reporting the tag while only nova-tokens was mutated ($how)"; exit 1 ;;
            esac
            echo "ok: a $how of the stamp is refused by name, with nova-bus still asserted"
          done
          restore

          # AND A STALE EXEMPTION IS ITSELF RED. The six names were a debt against #121;
          # #121's version verb has landed on all six, so the shipped list is EMPTY and the
          # fixture has to bring its own name: the stale check is injected into a COPY of
          # the script rather than shipped in it, because the shipped list must stay a line
          # a person edits and nothing else can write. A list that has drifted from the
          # tree has stopped saying what it claims to say, and this is the check that says
          # so.
          rm -rf "${RUNNER_TEMP}/one-tool"
          mkdir -p "${RUNNER_TEMP}/one-tool/cmd/nova-bus"
          stale="${RUNNER_TEMP}/assert-with-a-stale-exemption.sh"
          cp .github/scripts/assert-version-stamp.sh "$stale"
          sed -i 's/^LEGACY_NO_VERSION_VERB=.*/LEGACY_NO_VERSION_VERB="nova-departed"/' "$stale"
          grep -q '^LEGACY_NO_VERSION_VERB="nova-departed"$' "$stale" || {
            echo "the stale-exemption fixture did not apply; this step would prove nothing"; exit 1; }
          set +e
          out=$("$stale" "$stamp" "${RUNNER_TEMP}/mutated/%s" "${RUNNER_TEMP}/one-tool/cmd" 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          [ "$rc" -ne 0 ] || { echo "an exemption naming a tool that does not exist was accepted"; exit 1; }
          case "$out" in
            *"is exempted from the stamp assertion but"*) echo "ok: a stale exemption is refused by name" ;;
            *) echo "the run failed, but not for the stale exemption; that is a different defect"; exit 1 ;;
          esac

      - name: a tag the release could not check is refused before anything is built
        shell: bash
        run: |
          set -euo pipefail
          # THE TAG ALPHABET -- the half of this job that was left owed. From the fourth
          # read of #125, the last open low of #118: "ci.yml's release-dry-run exercises
          # the empty-stamp refusal only; the `%` and `=` (and whitespace) refusals in
          # release-ldflags.sh and in the assertion have no negative control."
          #
          # WHAT A TAG CAN ACTUALLY CARRY, measured rather than assumed:
          # `git check-ref-format refs/tags/'v1.0%s-rc1'` and `…/'v1.0=rc1'` are ACCEPTED,
          # so `%` and `=` are tags a person can really push; `…/'v0.13.0 rc1'` is REFUSED,
          # so whitespace is not a legal refname, and release.yml:83 takes `TAG` from
          # `github.ref_name`, which no trigger can hand in with a space. The whitespace
          # cases below therefore prove the scripts' own refusal fires -- defence in depth
          # for a stamp arriving by some other path, a future input or a future caller --
          # and not a tag anyone can push today. Said plainly because a comment that calls
          # whitespace a legal refname is a comment a reader would have to check.
          #
          # These refusals exist because the failure each one replaces is LATE and
          # unreadable. A `%` tag travels into the assertion's printf FORMAT -- release.yml
          # hands it "dist/%s_${TAG}_linux_amd64" -- so printf reads a directive nobody
          # supplied, the script dies under `set -e` before printing a line, and the
          # release is red with no FAIL naming a cause. An `=` tag is read by the whole-
          # token match as a separator, so every stamped tool fails in turn AFTER the whole
          # matrix has been built. An assertion nothing exercises is a belief; and one that
          # fired on a legal tag would stop the next release for nothing, so both
          # directions are proved here -- each refusal by its own reason, and legal tags
          # through both scripts to the assertion's `ok:` lines.
          #
          # THE COUNT, read off the two scripts. Twelve refusals fire before any binary is
          # run: release-ldflags.sh six -- its usage (:19), the empty stamp (:29),
          # whitespace (:38), `%` (:53), `=` (:69), and a belt-and-braces check on the
          # composed string (:81) that cannot fire while the empty-stamp refusal stands;
          # assert-version-stamp.sh six -- its usage (:42), an empty expected tag (:51), a
          # template with no `%s` (:57), a `%` beyond the single `%s` (:74), whitespace in
          # the tag (:86), `=` in the tag (:91). This step exercises ten of them and the
          # step above exercises the eleventh (the empty stamp); the twelfth is the
          # composed-string check, which no argument can reach, and it is named here rather
          # than pretended about. The FAIL class further down the assertion -- a missing
          # binary, a verb that exited, a tool not reporting the tag, a stale exemption --
          # is what the two steps above exercise.
          stamp=v0.0.0-dry-run

          # The usage refusals first, because they are the cheapest thing in either script
          # to break: an argument added to one of these calls and not to the other end
          # would otherwise be a release that skipped its own check.
          refuse_usage() {
            local what=$1 out rc
            shift
            set +e
            out=$("$@" 2>&1)
            rc=$?
            set -e
            printf '%s\n' "$out"
            [ "$rc" -eq 2 ] || { echo "$what did not refuse $(($# - 1)) argument(s) as a usage error: rc=$rc"; exit 1; }
            case "$out" in
              *"usage:"*) echo "ok: $what refuses $(($# - 1)) argument(s) with its usage" ;;
              *) echo "$what exited 2 without printing its usage; a caller has nothing to read"; exit 1 ;;
            esac
          }
          refuse_usage release-ldflags.sh .github/scripts/release-ldflags.sh
          refuse_usage release-ldflags.sh .github/scripts/release-ldflags.sh "$stamp" extra
          refuse_usage assert-version-stamp.sh .github/scripts/assert-version-stamp.sh "$stamp"
          refuse_usage assert-version-stamp.sh .github/scripts/assert-version-stamp.sh "$stamp" 'dist/%s' cmd extra

          # ONE: the ldflags helper, called the way release.yml calls it -- a command
          # substitution under `set -euo pipefail`. The proof is that the line after it
          # never runs: in a release that is the difference between zero artifacts and 55.
          refuse_ldflags() {
            local tag=$1 phrase=$2 late=$3 out rc
            set +e
            out=$(TAG="$tag" bash -c 'set -euo pipefail; LDFLAGS=$(.github/scripts/release-ldflags.sh "$TAG"); echo "BUILT ldflags=$LDFLAGS"' 2>&1)
            rc=$?
            set -e
            printf '%s\n' "$out"
            [ "$rc" -ne 0 ] || { echo "release-ldflags.sh ACCEPTED the tag <$tag>: $late"; exit 1; }
            case "$out" in
              *"$phrase"*) ;;
              *) echo "<$tag> was refused, but not for $phrase; that is a different defect"; exit 1 ;;
            esac
            case "$out" in
              *BUILT*) echo "the release ran on past a refused stamp <$tag>; 55 artifacts would have been built"; exit 1 ;;
            esac
            echo "ok: <$tag> is refused with the build never starting"
          }
          refuse_ldflags 'v1.0%s-rc1' 'contains %' 'the assertion would die inside printf with no FAIL line naming a cause'
          refuse_ldflags 'v1.0=rc1' 'contains =' 'every stamped tool would fail the assertion after the matrix was built'
          refuse_ldflags 'v0.13.0 rc1' 'carries whitespace' 'the linker flag would split and the binaries would be stamped with the first word'

          # And a legal tag is not refused by any of the three: a check that says no to
          # everything is not a check. These are the shapes this repository actually tags.
          for legal in v0.13.0 v0.13.0-rc1 "$stamp"; do
            ldflags=$(.github/scripts/release-ldflags.sh "$legal")
            case "$ldflags" in
              *"-X main.version=$legal") echo "ok: <$legal> composes $ldflags" ;;
              *) echo "release-ldflags.sh composed something else for the legal tag <$legal>: $ldflags"; exit 1 ;;
            esac
          done

          # TWO: the same three at the OTHER end of the workflow, where the tag arrives
          # inside the path template. The fixture is named the way release.yml names its
          # artifacts (`<tool>_<tag>_linux_amd64`, accurate on this ubuntu runner) and the
          # template is composed the same way, so what is exercised is the real call shape
          # of release.yml's assertion step and not a shape invented here.
          dist="${RUNNER_TEMP}/alphabet"
          rm -rf "$dist"
          go build -ldflags "$(.github/scripts/release-ldflags.sh "$stamp")" -o "$dist/" ./cmd/...
          for bin in "$dist"/*; do
            mv "$bin" "${bin}_${stamp}_linux_amd64"
          done
          # The positive control first: a legal tag inside the template asserts every
          # shipped tool, so the refusals below are the tag alphabet and not this fixture.
          .github/scripts/assert-version-stamp.sh "$stamp" "$dist/%s_${stamp}_linux_amd64"

          # refuse_assertion_args is the same three assertions with the arguments handed in
          # raw, for the refusals whose fixture is not a tag inside release.yml's template.
          refuse_assertion_args() {
            local phrase=$1 out rc
            shift
            set +e
            out=$(.github/scripts/assert-version-stamp.sh "$@" 2>&1)
            rc=$?
            set -e
            printf '%s\n' "$out"
            [ "$rc" -eq 2 ] || { echo "the assertion did not refuse <$*> as a usage error: rc=$rc"; exit 1; }
            case "$out" in
              *"$phrase"*) ;;
              *) echo "<$*> was refused by the assertion, but not for $phrase; that is a different defect"; exit 1 ;;
            esac
            case "$out" in
              *"ok: "* | *"FAIL: "*) echo "the assertion ran the tools before refusing <$*>; this refusal is meant to precede them"; exit 1 ;;
            esac
            echo "ok: the assertion refuses a call it cannot check ($phrase) before it runs a binary"
          }

          refuse_assertion() {
            local tag=$1 phrase=$2 out rc
            set +e
            out=$(.github/scripts/assert-version-stamp.sh "$tag" "$dist/%s_${tag}_linux_amd64" 2>&1)
            rc=$?
            set -e
            printf '%s\n' "$out"
            [ "$rc" -eq 2 ] || { echo "the assertion did not refuse the tag <$tag> as a usage error: rc=$rc"; exit 1; }
            case "$out" in
              *"$phrase"*) ;;
              *) echo "<$tag> was refused by the assertion, but not for $phrase; that is a different defect"; exit 1 ;;
            esac
            # And it refuses BY NAMING ITSELF, before a single binary is run -- the whole
            # point of holding the refusal at this end too, rather than reporting a tag the
            # check can never match as eleven failing tools.
            case "$out" in
              *"ok: "* | *"FAIL: "*) echo "the assertion ran the tools before refusing <$tag>; this refusal is meant to precede them"; exit 1 ;;
            esac
            echo "ok: the assertion refuses <$tag> before it runs a binary"
          }
          refuse_assertion 'v1.0%s-rc1' 'beyond its single %s'
          refuse_assertion 'v1.0=rc1' 'contains ='
          refuse_assertion 'v0.13.0 rc1' 'carries whitespace'

          # And the two refusals that are not about the tag's alphabet at all: an empty
          # expected tag, and a template that names one path for every tool. Neither can
          # come from a release.yml that is written correctly, which is exactly why they
          # are worth a control -- they are the refusals that catch this workflow being
          # edited, and both say in the script that they exist because the alternative is a
          # check that asserts nothing and passes.
          refuse_assertion_args 'no expected tag given' "" "$dist/%s_${stamp}_linux_amd64"
          refuse_assertion_args 'holds no %s' "$stamp" "$dist/nova-bus_${stamp}_linux_amd64"

      - name: the certified gate refuses newer-failure-after-older-success and in-flight, and passes one green
        shell: bash
        run: |
          set -euo pipefail
          # THE CERTIFIED GATE'S NEGATIVE CONTROLS (#253). release-certified.sh is now the
          # whole `certified` job of release.yml, but until this step nothing in CI proved
          # the script can say NO -- a break in its shell would refuse nothing, and the
          # first sign of it would be a release built on a commit no green certification
          # vouched for. So the gate is driven here, the same way the two steps above drive
          # the ldflags helper and the assertion: through a fake `gh` on PATH, against the
          # three outcomes the script has to decide. A newer FAILURE after an older SUCCESS
          # must refuse (that is the fixture that fails a naive gate counting any green --
          # "a run succeeded somewhere" is not a voucher), a run still in flight must refuse
          # (an unfinished run vouches for nothing and its result is unknowable), and one
          # green must PASS, or no release is ever possible.
          #
          # The fixtures live in .github/testdata/release-certified/ rather than in this
          # heredoc because they are whole API bodies: the script reads total_count and a
          # workflow_runs list, and a list hand-typed in the run block is a list that
          # drifts from the shape the API actually returns.

          # A fake `gh` on PATH. release-certified.sh calls `gh api -i` once and reads the
          # STATUS LINE rather than the exit code (gh exits 1 on both a non-200 and an
          # empty answer alike), so the fake reproduces exactly what -i promises: one
          # HTTP status line, then the body after a blank line. The body is whatever
          # fixture RELEASE_CERT_RESPONSE names.
          mkdir -p "${RUNNER_TEMP}/fake-gh"
          cat > "${RUNNER_TEMP}/fake-gh/gh" <<'GH'
          #!/usr/bin/env bash
          set -euo pipefail
          printf 'HTTP/2 200 OK\r\n'
          printf 'date: a-fake-gh-does-not-have-dates\r\n\r\n'
          cat "$RELEASE_CERT_RESPONSE"
          GH
          chmod +x "${RUNNER_TEMP}/fake-gh/gh"

          # The script's input guard demands the whole environment release.yml provides,
          # so gate_env exports it before each run.
          gate_env() {
            export GITHUB_REPOSITORY=mas-bandwidth/nova-tools
            export SHA=dr-y-run-sha
            export REF=v9.9.9-dry-run
            export GITHUB_RUN_ID=0000000000
            export GH_TOKEN=fake-gh-needs-a-token-to-be-set
            export PATH="${RUNNER_TEMP}/fake-gh:$PATH"
          }

          # ONE: newer failure after older success must refuse, BY NAMING the red. This is
          # the fixture a gate that "counts any green" would pass, so its refusal is the
          # proof the refusal is not merely "something went wrong".
          gate_env
          set +e
          out=$(RELEASE_CERT_RESPONSE=".github/testdata/release-certified/old-green-new-red.json" \
            .github/scripts/release-certified.sh 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          [ "$rc" -ne 0 ] || { echo "the certified gate VOUCHED for a commit whose latest evidence is a failure"; exit 1; }
          case "$out" in
            *"not uniformly green"*) echo "ok: a newer failure after an older success is refused, by naming the red" ;;
            *) echo "the gate refused the old-green/new-red fixture, but not for the red; that is a different defect"; exit 1 ;;
          esac

          # TWO: a run in flight must refuse with the wait line, whatever a completed green
          # beside it would say -- one snapshot sees the unfinished run and refuses before
          # any conclusion is read.
          gate_env
          set +e
          out=$(RELEASE_CERT_RESPONSE=".github/testdata/release-certified/in-flight.json" \
            .github/scripts/release-certified.sh 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          [ "$rc" -ne 0 ] || { echo "the certified gate VOUCHED while a certification run was still in flight"; exit 1; }
          case "$out" in
            *"not yet completed"*) echo "ok: a run in flight is refused, and the remedy says wait" ;;
            *) echo "the gate refused the in-flight fixture, but not for the unfinished run; that is a different defect"; exit 1 ;;
          esac

          # THREE: one green must PASS, and print a receipt -- the negative controls above
          # are worth nothing if the gate says no to everything, which is as much a
          # blocked release as saying yes to everything.
          gate_env
          set +e
          out=$(RELEASE_CERT_RESPONSE=".github/testdata/release-certified/single-green.json" \
            .github/scripts/release-certified.sh 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          [ "$rc" -eq 0 ] || { echo "the certified gate REFUSED a commit one green certification vouches for; no release would be possible"; exit 1; }
          case "$out" in
            *"receipt run 3001"*) echo "ok: one green vouches, and the receipt names the run" ;;
            *) echo "the certified gate did not print a receipt for the one green run; a release would have nothing to show"; exit 1 ;;
          esac

      - name: the upload respects the draft/publication boundary and refuses a published release
        shell: bash
        run: |
          set -euo pipefail
          # THE DRAFT/PUBLICATION BOUNDARY'S CONTROLS (#199). release-upload.sh is the tail
          # of the `release` job, but until this step nothing in CI proved it cannot touch a
          # published release -- the first sign of the draft/public mix-up would be a
          # published release silently extended with a second set of artifacts. So the script
          # is driven here, the way the certified gate above is driven, through a fake `gh`,
          # against the four answers the release lookup can give: 200 whose body is a draft,
          # 200 whose body is published, 404 (nothing yet), and a non-answer (403).
          #
          # A fake `gh` on PATH. The script asks `gh api -i releases/tags/<tag>` once and
          # reads the STATUS LINE and the `draft` field rather than the exit code, so the
          # fake reproduces `-i`: an HTTP status line, then the body after a blank line. The
          # body is whatever fixture RELEASE_UPLOAD_RESPONSE names. A `release create` or
          # `release upload` is ECHOED the way gh would print it, so the test can assert
          # which command the script chose -- and never actually uploads anything.
          mkdir -p "${RUNNER_TEMP}/fake-gh-release"
          cat > "${RUNNER_TEMP}/fake-gh-release/gh" <<'GH'
          #!/usr/bin/env bash
          set -euo pipefail
          case "${1:-}" in
            api)
              case "${RELEASE_UPLOAD_STATUS:-200}" in
                404) printf 'HTTP/2 404 Not Found\r\n\r\n' ;;
                403) printf 'HTTP/2 403 Forbidden\r\n\r\n'; exit 1 ;;
                *) printf 'HTTP/2 200 OK\r\ndate: fake\r\n\r\n'; cat "${RELEASE_UPLOAD_RESPONSE:?}" ;;
              esac
              ;;
            release) echo "gh $*" ;;
            *) echo "unexpected fake gh invocation: $*" >&2; exit 1 ;;
          esac
          GH
          chmod +x "${RUNNER_TEMP}/fake-gh-release/gh"

          upload_env() {
            export GITHUB_REPOSITORY=mas-bandwidth/nova-tools
            export TAG=v0.14.0
            export GH_TOKEN=fake-gh-needs-a-token-to-be-set
            export PATH="${RUNNER_TEMP}/fake-gh-release:$PATH"
          }
          mkdir -p dist && : > dist/nova-bus_v0.14.0_linux_amd64

          # ONE: a release that does not exist is CREATED AS A DRAFT, not published -- the
          # artifact lands on a draft a later step publishes, and `--draft` is on the command.
          upload_env
          set +e
          out=$(RELEASE_UPLOAD_STATUS=404 .github/scripts/release-upload.sh 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          [ "$rc" -eq 0 ] || { echo "the upload REFUSED to create the missing release at all"; exit 1; }
          case "$out" in
            *"gh release create"*"--draft"*) echo "ok: a missing release is created as a draft" ;;
            *) echo "the script did not create a draft for the missing release: $out"; exit 1 ;;
          esac

          # TWO: an existing DRAFT is uploaded to, with --clobber so a rerun replaces a
          # partial upload -- the draft stays a draft, nothing is published.
          upload_env
          set +e
          out=$(RELEASE_UPLOAD_STATUS=200 RELEASE_UPLOAD_RESPONSE=.github/testdata/release-upload/draft.json \
            .github/scripts/release-upload.sh 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          [ "$rc" -eq 0 ] || { echo "the upload REFUSED an existing draft it should have filled"; exit 1; }
          case "$out" in
            *"gh release upload"*"--clobber"*) echo "ok: an existing draft receives the artifacts" ;;
            *) echo "the script did not upload to the draft: $out"; exit 1 ;;
          esac

          # THREE: an existing PUBLISHED release is refused in one line, and no upload or
          # create command runs -- the release already crossed the boundary and must not be
          # extended, so the draft/publish sequence is not silently skipped.
          upload_env
          set +e
          out=$(RELEASE_UPLOAD_STATUS=200 RELEASE_UPLOAD_RESPONSE=.github/testdata/release-upload/published.json \
            .github/scripts/release-upload.sh 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          [ "$rc" -ne 0 ] || { echo "the upload PUBLISHED into a release that is already published"; exit 1; }
          case "$out" in
            *"already has a published release"*) echo "ok: a published release is refused in one line" ;;
            *) echo "the script refused the published release, but not for the publication boundary: $out"; exit 1 ;;
          esac
          case "$out" in
            *"gh release"*) echo "the script reached a gh release command after refusing a published release"; exit 1 ;;
          esac

          # FOUR: a non-answer (403, permissions) is refused rather than read as absence --
          # the same ask-guard release.yaml relied on, reproduced over the script.
          upload_env
          set +e
          out=$(RELEASE_UPLOAD_STATUS=403 .github/scripts/release-upload.sh 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          [ "$rc" -ne 0 ] || { echo "the upload READ a 403 as 'no release' and walked down the create path"; exit 1; }
          case "$out" in
            *"neither 200 nor 404"*) echo "ok: a non-answer is refused, not read as absence" ;;
            *) echo "the 403 was treated as a decision rather than a refusal: $out"; exit 1 ;;
          esac

  perf:
    # THE WALL CLOCK, nightly, because a wall clock is not a per-commit test.
    #
    # cmd/nova-bus/timing_test.go runs every verb over a ten-thousand-note bus and holds
    # each to a bound in SECONDS. That bound is the only assertion in this repository whose
    # answer depends on what else the machine is doing, and on 2026-09-11 it was exactly
    # that: eleven seconds alone, one minute fifty-one under the load of `go test ./...`,
    # and the package hitting Go's ten-minute timeout with it in (#63). The house rule is
    # that a per-commit test finishes in a minute, two at most, or it becomes nightly.
    #
    # The property it guards did NOT move: the cost of a read is the size of the change, and
    # that is proved by COUNTING PARSES in TestInboxParsesOnlyWhatIsNewSinceTheCursor, which
    # runs in the CL tier on every commit. This job is the crude second net under
    # it, for a regression that is not a parse.
    #
    # One runner, no race detector, no matrix: the file skips itself under `-race` because
    # the instrumentation is what a wall clock would then be measuring, and a bound measured
    # on three different runner classes is three different bounds. Linux is the one the
    # number in that file was written against.
    #
    # It is NOT gated on the test job. A red perf job is a thing to go and read in the
    # morning, and making it wait on three operating systems' worth of tests would mean a
    # night where an unrelated flake means no perf evidence at all.
    #
    # THE PERF TESTS ONLY, discovered, never named. This job used to run every test of `./...`
    # under the tag one at a time (`-p 1 -parallel 1`); green in 175 s (36303146135) and 644 s
    # (36137551959), then cancelled by the two-minute cap on every run, still inside
    # cmd/nova-bus. Every other test in that run is run by the test job above and by ci.yml;
    # what only this job runs is the tests the `perf` tag adds. So the job finds them: the live
    # packages holding a file whose build constraint names `perf`, and in each, the tests
    # `go test -tags perf -list` names and `go test -list` does not. A perf test added in any
    # live package tomorrow is in that difference without anyone editing this file, and a test
    # that is not behind the tag is not re-run here. Today that is the two tests of
    # cmd/nova-bus/timing_test.go, 8.3 s together on the Studio.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2  # the classtests rule reads what HEAD deleted from its first parent
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # This job manages its cache below; setup-go's own saves in a post step.
          cache: false

      - name: restore the perf build cache
        id: gocache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: perf-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            perf-

      - name: find the perf-tagged tests
        # Writes `<import path> <run regexp>`, one line per package, to $RUNNER_TEMP/perf-runs.
        # A perf-tagged package with no test behind the tag is reported and skipped; a tree
        # with no perf-tagged test at all is red, because then this job asserts nothing.
        shell: bash
        run: |
          set -euo pipefail
          : > "${RUNNER_TEMP}/perf-runs"
          go list -tags perf -f '{{.ImportPath}} {{.Dir}}' ./... > "${RUNNER_TEMP}/perf-list"
          while read -r pkg dir; do
            grep -lqE '^//go:build .*\bperf\b' "$dir"/*.go 2>/dev/null || continue
            [ -n "$(echo "$pkg" | bash .github/scripts/live-packages.sh)" ] || continue
            extra=$(comm -13 \
              <(go test -list . "$pkg" | grep -E '^(Test|Benchmark|Example|Fuzz)' | LC_ALL=C sort) \
              <(go test -tags perf -list . "$pkg" | grep -E '^(Test|Benchmark|Example|Fuzz)' | LC_ALL=C sort))
            if [ -z "$extra" ]; then
              echo "$pkg carries a perf constraint and no test behind it"
              continue
            fi
            echo "$pkg: $(echo $extra)"
            echo "$pkg ^($(echo $extra | tr ' ' '|'))\$" >> "${RUNNER_TEMP}/perf-runs"
          done < "${RUNNER_TEMP}/perf-list"
          [ -s "${RUNNER_TEMP}/perf-runs" ] || { echo "no live package holds a perf-tagged test: this job would assert nothing"; exit 1; }
          echo "PERF_PKGS=$(cut -d' ' -f1 "${RUNNER_TEMP}/perf-runs" | tr '\n' ' ')" >> "$GITHUB_ENV"

      - name: vet the perf-tagged tests
        # `go vet` without the tag cannot see a file behind it, so the one place a perf file is
        # vetted is here: every package that holds one. Vet before test, so a perf file that
        # stopped compiling says that rather than failing as a bound.
        run: go vet -tags perf $PERF_PKGS

      - name: save the perf build cache
        # On a miss or a restore-keys fallback only; before the tests, for the reason the test
        # job gives.
        if: steps.gocache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.gocache.outputs.cache-primary-key }}

      - name: install redis-server
        # #3113: NOVA_CI fails a control that wants redis-server and cannot find it. The
        # binary is not the fleet store.
        run: bash .github/scripts/install-redis-server.sh

      - name: the wall-clock tests, one at a time
        # `-p 1 -parallel 1` because these are wall clocks: a bound in seconds measured while
        # siblings spawn git processes measures the siblings. One at a time on an otherwise
        # idle runner is the condition the numbers in timing_test.go were written against.
        #
        # `-timeout 60s`: a perf test that gets stuck fails as a TEST timeout, which names the
        # test and dumps every goroutine, before the job cap cancels it naming nothing.
        shell: bash
        run: |
          set -euo pipefail
          while read -r pkg run; do
            go test -tags perf -count=1 -v -p 1 -parallel 1 -timeout 60s -run "$run" "$pkg"
          done < "${RUNNER_TEMP}/perf-runs"

  certification-ok:
    # THE ONE CHECK THAT SAYS A RELEASE IS READY, and the reason it exists rather than a
    # list of check names in a branch ruleset. It aggregates EXACTLY the jobs of this file
    # — the certification tier — and `needs` on a matrix job is success only when EVERY leg
    # succeeded, so a leg renamed out of existence shows up here as a missing success and
    # not as silence. A red certification is a blocker for the next release, never for a
    # CL, whose gate is ci-ok in ci.yml.
    needs: [test, smoke, release-build, release-dry-run, release-checks, perf]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: every job succeeded
        shell: bash
        run: |
          set -uo pipefail
          bad=0
          for pair in \
            "test:${{ needs.test.result }}" \
            "smoke:${{ needs.smoke.result }}" \
            "release-build:${{ needs.release-build.result }}" \
            "release-dry-run:${{ needs.release-dry-run.result }}" \
            "release-checks:${{ needs.release-checks.result }}" \
            "perf:${{ needs.perf.result }}"
          do
            job="${pair%:*}"; result="${pair##*:}"
            echo "$result	$job"
            [ "$result" = "success" ] || bad=$((bad + 1))
          done
          [ "$bad" -eq 0 ] || { echo "$bad job(s) did not succeed"; exit 1; }
