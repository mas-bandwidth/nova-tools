# Certification: the slower tier that cannot fit the two-minute per-CL budget.
#
# Every job that leaves ci.yml's CL tier appears here under the same name, so a
# change's ordinary feedback path stays under two minutes while nothing is
# deleted: the whole-tree `-race` run, Windows build/vet and per-package tests,
# the three-OS smoke of the shipped binary, the release dry-run, and the nightly
# perf wall clock all still run — on a daily schedule and on demand.
#
# A RED run here is a blocker for the next release, never for a CL. See
# docs/CONTRIBUTING.md, "Two tiers of CI".

name: certification

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: certification-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    # TWO operating systems in this job and the third fanned out below. The platforms
    # genuinely differ -- Windows has no executable bit, so `nocode`'s executable condition
    # cannot fire there and only the extension and shebang conditions carry it, and the
    # tests that assert the mode-bit behaviour SKIP on Windows with that reason named, so
    # the difference is declared rather than silently untested. What changed is where
    # Windows runs, not whether it does: see test-windows.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: gofmt
        # gofmt -l prints unformatted files and exits 0 either way, so the exit
        # code is not the product here — the output is. Checked on one runner:
        # formatting is a property of the source, not of the platform.
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

  build-windows:
    # `go build ./...` and `go vet ./...` ON WINDOWS, which the fan-out would otherwise have
    # dropped: the `test` job carries them and the `test` job is ubuntu and macOS now, while
    # `test-windows` runs `go test -race` per package and nothing else. docs/CONTRIBUTING.md
    # promises all three on all three platforms, and two of them had quietly become a
    # two-platform promise -- `internal/onboarding` and `internal/oneline/audit` have no
    # test files, so nothing would have compiled them on Windows at all, and `go test`'s
    # built-in vet is the high-confidence subset rather than `go vet`.
    #
    # Its own job rather than a step in one of the shards: a shard is a matrix leg, so a
    # step added to "the first one" runs in all of them or in none, and this is work that
    # should happen once, beside them, not before them.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...

  windows-packages:
    # The list the Windows fan-out runs on, READ OUT OF THE SOURCE rather than written
    # down. It is `go list` filtered to packages that have tests, printed as JSON for the
    # matrix below.
    #
    # This job exists so that there is no second list to keep in step with the first. This
    # file already carries one hand-copied list -- the release targets in release-dry-run,
    # which says of itself that it is worth nothing the moment the two lists disagree -- and
    # that one has a reason (a workflow cannot read another workflow's matrix). This one
    # does not: a package added tomorrow would quietly never run on Windows, and nothing
    # would say so. Here, it is in the fan-out the moment it has a test file.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - id: list
        shell: bash
        run: |
          set -euo pipefail
          # GOOS=windows, because this list is what WINDOWS will run and `go list` answers
          # for the platform it is asked about: a package whose test files are all
          # windows-tagged would be missing from a Linux answer and would never run on the
          # platform it is written for, and one whose tests are all `!windows` would be a
          # vacuous green. It needs no Windows runner -- listing is not building.
          #
          # SPLITS is the only hand-written number here, and it is a TUNING number rather
          # than a coverage one: a package absent from it runs as one job, which costs
          # speed and never coverage. cmd/nova-bus measured 6m33s as a single Windows job
          # against under 90 seconds for everything else, because its tests are almost
          # entirely git subprocesses and Windows pays the most per process.
          declare -A SPLITS=( ["cmd/nova-bus"]=4 )
          entries=()
          while read -r pkg; do
            [ -n "$pkg" ] || continue
            n=${SPLITS[$pkg]:-1}
            for g in $(seq 1 "$n"); do
              entries+=("{\"package\":\"$pkg\",\"group\":\"$g\",\"groups\":\"$n\"}")
            done
          done < <(GOOS=windows go list -f '{{if or .TestGoFiles .XTestGoFiles}}{{.ImportPath}}{{end}}' ./... |
            sed 's#^github.com/mas-bandwidth/nova-tools/##')
          packages=$(printf '%s\n' "${entries[@]}" | jq -s -c '.')
          echo "$packages"
          [ "$(echo "$packages" | jq 'length')" -gt 0 ] || { echo "no packages with tests: the fan-out would be empty and green"; exit 1; }
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  test-windows:
    # WINDOWS, ONE RUNNER PER PACKAGE -- and per GROUP of a package that is big enough to
    # want more than one -- all launched at once.
    #
    # The shape is mirrored from networknext/next's `.semaphore/functional-tests.yml`,
    # where every functional test is its own job inside a block and the whole block is what
    # has to be green, so a run takes as long as its slowest single job rather than as long
    # as their sum.
    #
    # Why Windows and not the others: this repository's tests are mostly git subprocesses,
    # and Windows pays the most per process. Making the tests inside a package parallel
    # sped ubuntu and macOS up and slowed Windows DOWN -- 7m58s to 10m41s -- because
    # `go test` already runs packages in parallel, so a four-core runner was suddenly
    # asked for four packages times four tests at once. More cores is the answer that does
    # not trade one platform against another: the packages go to separate machines instead
    # of competing for one. One job per package took the leg to 6m33s; splitting the one
    # package that was all of that 6m33s is the second cut.
    #
    # A group takes every Nth test of its package, by name, from `go test -list` -- so the
    # split needs no list of test names anywhere and a test added tomorrow lands in a group
    # by arithmetic. Groups are separate PROCESSES, which is also why the parse-count tests
    # are safe here: bus.NoteParses is per process.
    name: test-windows (${{ matrix.entry.package }}${{ matrix.entry.groups != '1' && format(' {0}/{1}', matrix.entry.group, matrix.entry.groups) || '' }})
    needs: windows-packages
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.windows-packages.outputs.packages) }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: test
        shell: bash
        run: |
          set -euo pipefail
          pkg="./${{ matrix.entry.package }}"
          group="${{ matrix.entry.group }}"
          groups="${{ matrix.entry.groups }}"
          if [ "$groups" = "1" ]; then
            go test -race "$pkg"
            exit 0
          fi
          # Test, Fuzz AND Example: `go test` runs examples with an output comment, and a
          # function kind missing from this filter is in no group and therefore runs nowhere.
          names=$(go test -list '.*' "$pkg" | grep -E '^(Test|Fuzz|Example)' | sort |
            awk -v g="$group" -v n="$groups" 'NR % n == g % n')
          if [ -z "$names" ]; then
            echo "group $group of $groups over $pkg selected no tests; the split is wrong, not green"
            exit 1
          fi
          echo "$names"
          run="^($(printf '%s\n' "$names" | paste -sd'|' -))$"
          go test -race -run "$run" "$pkg"

  smoke:
    needs: release-dry-run
    # Exercises the BUILT BINARY. `go test` covers the packages; nothing else
    # covered the executable a user actually runs, and what a release ships is
    # the executable.
    #
    # HONEST SCOPE, because this job's own argument is that unstated coverage
    # is a lie — and an enumerating sentence that omits items reads worse than
    # a general one, so this says what IS smoked and stops.
    #
    # Smoked here: `nova-check nocode`, plus one property of `nova-check links`
    # — that a symlinked `--dir` is resolved rather than passed over — and only
    # the properties asserted in the steps below. Everything else in this
    # repository — every other `nocode` flag and refusal path, every other
    # `links` property, every other `nova-check` subcommand, and the
    # `nova-fuse`, `nova-memory`, `nova-self-talk` and `nova-bus`
    # commands — is covered by package tests and by nothing else.
    #
    # WINDOWS. The portable steps run there too. An earlier revision excluded
    # the whole job on the grounds that its fixtures need an executable bit,
    # chmod refusing a read, mkfifo or symlinks — true of four steps and false
    # of the other three, which meant the binary was never smoked on the one
    # platform whose defects this branch exists to have found. The steps that
    # genuinely cannot run there are marked individually.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      # Go appends .exe on Windows, so the name has to carry it or every step
      # below looks for a binary that is not there. Keyed off matrix.os and NOT
      # runner.os: the runner context is not available to a job-level env, and
      # using it there does not warn — it invalidates the whole workflow file,
      # which fails the run before a single step executes.
      BIN: ${{ github.workspace }}/nova-check${{ startsWith(matrix.os, 'windows') && '.exe' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: download the cross-built binaries
        id: download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cross-built-binaries
          path: dist

      - name: take this runner's shipped binary
        id: take_binary
        # THE BINARY THAT WOULD SHIP, not one built here. This step used to be `go build -o
        # "$BIN" ./cmd/nova-check`, which is a different binary from the released one --
        # different flags, no -trimpath, CGO as the host has it -- so the job whose whole
        # argument is "what a release ships is the executable" was smoking an executable no
        # release ships. There is no Go toolchain in this job any more: if the binary is not
        # in the artifact, this job cannot paper over it by compiling one.
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.os }}" in
            ubuntu-latest)  target=linux-amd64 ;;
            macos-latest)   target=darwin-arm64 ;;
            windows-latest) target=windows-amd64 ;;
            *) echo "no shipped target mapped for ${{ matrix.os }}"; exit 1 ;;
          esac
          src="dist/$target/nova-check"
          [ "$target" = "windows-amd64" ] && src="$src.exe"
          [ -f "$src" ] || { echo "$src is not in the artifact: ls -R dist"; ls -R dist; exit 1; }
          mkdir -p "$(dirname "$BIN")"
          cp "$src" "$BIN"
          chmod +x "$BIN"
          "$BIN" version || true

      - name: a clean prose tree passes, and is actually walked
        id: clean_tree
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          tree="$(mktemp -d)"
          printf '# notes\n' > "$tree/NOTES.md"
          printf 'plain text\n' > "$tree/plain.txt"
          set +e; out=$("$BIN" nocode --dir "$tree" 2>&1); rc=$?; set -e
          [ "$rc" -eq 0 ] || { echo "want exit 0, got $rc: $out"; exit 1; }
          # files=2 is the load-bearing half. `nocode` prints NOCODE OK and
          # exits 0 for a tree it never opened, so exit 0 alone cannot tell a
          # pass from a walk that scanned nothing.
          case "$out" in
            *"files=2 clean"*) ;;
            *) echo "want files=2 clean, got: $out"; exit 1 ;;
          esac

      - name: a symlinked --dir is resolved, not passed over
        id: symlink_nocode
        # POSIX only: needs an executable bit, chmod refusing a read, mkfifo or symlinks.
        if: ${{ !cancelled() && (runner.os != 'Windows') }}
        shell: bash
        run: |
          # The fail-open the assertion above was WRONGLY credited with
          # catching. os.Stat follows a link, so --dir naming a symlink to the
          # tree was seen as a single non-directory entry and returned
          # NOCODE OK files=0, exit 0: a clean pass over a tree never opened.
          # A reviewer removed filepath.EvalSymlinks and every other step here
          # stayed green, because none of their fixtures is itself a link.
          # This one is.
          real="$(mktemp -d)"; printf '# n\n' > "$real/NOTES.md"; printf 'print(1)\n' > "$real/tool.py"
          link="$(mktemp -d)/link"; ln -s "$real" "$link"
          set +e; out=$("$BIN" nocode --dir "$link" 2>&1); rc=$?; set -e
          [ "$rc" -eq 1 ] || { echo "symlinked --dir: want exit 1, got $rc: $out"; exit 1; }
          case "$out" in
            *"tool.py"*) echo "ok: a symlinked --dir is walked" ;;
            *) echo "symlinked --dir: the tree was not walked: $out"; exit 1 ;;
          esac

      - name: a symlinked --dir is resolved, not passed over (links)
        id: symlink_links
        # POSIX only: needs an executable bit, chmod refusing a read, mkfifo or symlinks.
        if: ${{ !cancelled() && (runner.os != 'Windows') }}
        shell: bash
        run: |
          # The same fail-open, in the other checker. os.Stat follows a link,
          # so --dir naming a symlink to the tree was seen as a single
          # non-directory entry and returned LINKS OK files=0 links=0, exit 0
          # — a clean pass over a tree never walked, while the same tree by its
          # real path reported the broken link and exited 1. No other step in
          # this job hands `links` a --dir that is itself a link, so nothing
          # else here would catch it coming back.
          real="$(mktemp -d)"; printf 'fine\n\n[gone](gone.md)\n' > "$real/a.md"
          link="$(mktemp -d)/link"; ln -s "$real" "$link"
          set +e; out=$("$BIN" links --dir "$link" 2>&1); rc=$?; set -e
          [ "$rc" -eq 1 ] || { echo "symlinked --dir: want exit 1, got $rc: $out"; exit 1; }
          case "$out" in
            *"a.md:3: gone.md (does not exist)"*) echo "ok: a symlinked --dir is walked" ;;
            *) echo "symlinked --dir: the tree was not walked: $out"; exit 1 ;;
          esac

      - name: a tree that classified nothing says so
        id: classified_nothing
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          # The scanned==0 warning is the only remaining backstop for the
          # fail-open above in a real repository, and deleting it left every
          # other step green. Exit 0 is correct here: an empty tree genuinely
          # holds no machinery. What must not vanish is the sentence telling
          # an operator that nothing was classified.
          empty="$(mktemp -d)"
          set +e; out=$("$BIN" nocode --dir "$empty" 2>&1); rc=$?; set -e
          [ "$rc" -eq 0 ] || { echo "empty tree: want exit 0, got $rc: $out"; exit 1; }
          case "$out" in
            *"classified NOTHING"*) echo "ok: an unwalked tree is reported" ;;
            *) echo "empty tree: the scanned==0 warning is gone: $out"; exit 1 ;;
          esac

      - name: each condition refuses separately, with the right code and reason
        id: each_condition
        # POSIX only: needs an executable bit, chmod refusing a read, mkfifo or symlinks.
        if: ${{ !cancelled() && (runner.os != 'Windows') }}
        shell: bash
        run: |
          # One fixture per condition AND an assertion on which reason fired.
          # One fixture per condition alone would still go green if a
          # regression collapsed every case into one spurious finding.
          check() {
            desc="$1"; tree="$2"; want_reason="$3"
            set +e; out=$("$BIN" nocode --dir "$tree" 2>&1); rc=$?; set -e
            [ "$rc" -eq 1 ] || { echo "$desc: want exit 1, got $rc: $out"; exit 1; }
            case "$out" in
              *"$want_reason"*) echo "ok: $desc" ;;
              *) echo "$desc: want reason '$want_reason', got: $out"; exit 1 ;;
            esac
          }

          t="$(mktemp -d)"; printf '# n\n' > "$t/NOTES.md"; printf 'print(1)\n' > "$t/tool.py"
          check "extension" "$t" "code extension .py (floor list)"

          t="$(mktemp -d)"; printf '# n\n' > "$t/NOTES.md"; printf 'not a script\n' > "$t/thing"; chmod +x "$t/thing"
          check "executable bit" "$t" "executable (mode"

          t="$(mktemp -d)"; printf '# n\n' > "$t/NOTES.md"; printf '#!/bin/sh\necho hi\n' > "$t/thing"
          check "shebang" "$t" "executable script (shebang)"

      - name: the fail-opens this CI exists for stay closed
        id: fail_opens
        # POSIX only: needs an executable bit, chmod refusing a read, mkfifo or symlinks.
        if: ${{ !cancelled() && (runner.os != 'Windows') }}
        shell: bash
        run: |
          # These are the regressions that motivated the file. Each was a real
          # fail-open in a released check: a file nobody can open, and a file
          # that is not a regular file at all, must be FINDINGS rather than
          # passes. Making a file less readable must never make this gate
          # greener.
          if [ "$(id -u)" = "0" ]; then
            # FAIL rather than skip. The hosted runners are non-root, so this
            # branch firing means the environment changed under us — and a
            # silent skip would turn this job's headline fail-open assertion
            # into a no-op behind a green check.
            echo "running as root: chmod cannot refuse a read, so this assertion cannot run"
            exit 1
          else
            t="$(mktemp -d)"; printf '# n\n' > "$t/NOTES.md"; printf 'x\n' > "$t/secret"; chmod 000 "$t/secret"
            set +e; out=$("$BIN" nocode --dir "$t" 2>&1); rc=$?; set -e
            chmod 644 "$t/secret" || true
            [ "$rc" -eq 1 ] || { echo "unreadable: want exit 1, got $rc: $out"; exit 1; }
            case "$out" in
              *"cannot rule out machinery"*) echo "ok: unreadable file is a finding" ;;
              *) echo "unreadable: wrong reason: $out"; exit 1 ;;
            esac
          fi

          t="$(mktemp -d)"; printf '# n\n' > "$t/NOTES.md"; mkfifo "$t/pipe.sh"
          set +e; out=$("$BIN" nocode --dir "$t" 2>&1); rc=$?; set -e
          [ "$rc" -eq 1 ] || { echo "fifo: want exit 1, got $rc: $out"; exit 1; }
          case "$out" in
            *"not a regular file"*) echo "ok: non-regular file is a finding" ;;
            *) echo "fifo: wrong reason: $out"; exit 1 ;;
          esac

      - name: a guard that cannot read its own list refuses, and says so
        id: unreadable_list
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          # Exit 2, not merely non-zero: `flag` also exits non-zero on an
          # unknown flag, so "non-zero" would pass with --deny-ext misspelled
          # and the flag under test never exercised. The message is asserted
          # for the same reason.
          # The @path is RELATIVE on purpose. An absolute POSIX path here is
          # rewritten by git-bash on Windows — "@/nonexistent/list.txt" reached
          # the binary as "C:/Program Files/Git/nonexistent/list.txt" — so the
          # exit code held and the message assertion failed on a spelling this
          # step never chose. A relative name is passed through unchanged by
          # every shell in the matrix.
          t="$(mktemp -d)"; printf '# n\n' > "$t/NOTES.md"
          set +e; out=$("$BIN" nocode --dir "$t" --deny-ext "@no-such-deny-list.txt" 2>&1); rc=$?; set -e
          [ "$rc" -eq 2 ] || { echo "want exit 2, got $rc: $out"; exit 1; }
          case "$out" in
            *"deny-list file: open no-such-deny-list.txt"*) echo "ok: unreadable deny-list refused" ;;
            *) echo "wrong message: $out"; exit 1 ;;
          esac

      - name: every assertion above reported
        # THE GATE, and the reason every step above carries `if: ${{ !cancelled() }}`.
        #
        # A step that fails stops the ones after it from running by default, so a broken
        # second assertion used to hide assertions three to seven: the job went red,
        # somebody fixed the one failure it named, and the next run found the next one.
        # Seven red steps in one run is seven facts; one red step and six skipped is one
        # fact and a queue.
        # `!cancelled()` runs them all anyway -- and keeps honouring a real cancellation --
        # and this step is where the job's verdict is stated in one place, naming every
        # outcome rather than only the first bad one.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -uo pipefail
          bad=0
          # The two PREREQUISITE steps are in this list as well as the seven assertions: a
          # gate that claims to state every outcome and silently omits the two steps that
          # produce the binary is a gate with a blind spot exactly where a green would be
          # most misleading.
          for pair in \
            "download the shipped binaries:${{ steps.download.outcome }}" \
            "take this runner's binary:${{ steps.take_binary.outcome }}" \
            "a clean prose tree passes:${{ steps.clean_tree.outcome }}" \
            "a symlinked --dir (nocode):${{ steps.symlink_nocode.outcome }}" \
            "a symlinked --dir (links):${{ steps.symlink_links.outcome }}" \
            "a tree that classified nothing:${{ steps.classified_nothing.outcome }}" \
            "each condition refuses separately:${{ steps.each_condition.outcome }}" \
            "the fail-opens stay closed:${{ steps.fail_opens.outcome }}" \
            "an unreadable deny-list refuses:${{ steps.unreadable_list.outcome }}"
          do
            what="${pair%:*}"; outcome="${pair##*:}"
            echo "$outcome	$what"
            case "$outcome" in success|skipped) ;; *) bad=$((bad + 1)) ;; esac
          done
          [ "$bad" -eq 0 ] || { echo "$bad smoke assertion(s) failed"; exit 1; }

  release-dry-run:
    # The cross-build in .github/workflows/release.yml, run on every certification with
    # nothing uploaded. It exists because that workflow's first run is triggered by a TAG,
    # and a tag is the one thing in this repository that cannot be quietly amended: a
    # target that stopped compiling would be found by the release itself, with the tag
    # already pushed and half a set of binaries built. Here it is a red run before a
    # release, not after a tag.
    #
    # The target list is duplicated from release.yml on purpose -- a workflow cannot read
    # another workflow's matrix -- so a platform added or dropped there belongs here in the
    # same commit, and this job is worth nothing the moment the two lists disagree.
    #
    # One runner and a loop rather than a matrix of five, because Go cross-compiles from
    # any host: five runners would each pay a checkout and a toolchain setup to save a few
    # seconds of compiling. Build only, no tests -- the test job above is the tests, and
    # this job's whole question is whether the compiler can reach each target.
    #
    # Every action in this file is pinned by SHA. A mutable tag cannot change the
    # action implementation underneath a previously reviewed workflow.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # -trimpath here for the same reason the release passes it: build the way the shipped
      # artifact is built, or this job is checking a configuration nobody ships.
      GOFLAGS: -trimpath
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: every shipped tool compiles for every shipped platform
        shell: bash
        run: |
          set -euo pipefail
          # One directory PER TARGET, where an earlier revision built every target over the
          # top of the last one in a single mktemp dir. The compile was the whole product
          # then; now the binaries are the product too -- the smoke job below runs them --
          # and five targets sharing one path means four of them are deleted by the fifth.
          for target in "linux amd64" "linux arm64" "darwin arm64" "darwin amd64" "windows amd64"; do
            set -- $target
            GOOS="$1" GOARCH="$2" CGO_ENABLED=0 go build -o "dist/$1-$2/" ./cmd/...
            echo "ok $1/$2"
          done
          ls -R dist

      - name: the release stamp refuses a missing ldflag, and the assertion catches it
        shell: bash
        run: |
          set -euo pipefail
          # THIS IS THE TEST OF THE ASSERTION, which is the half of #118 that is easy to
          # leave out: a release job that asserts the stamp is worth nothing if the
          # assertion itself has never been seen to fail. A tag is the one thing here that
          # cannot be quietly amended, so both outcomes are proved here rather than on the
          # tag itself.
          #
          # It runs the same two scripts release.yml runs, over the same cmd/*/ tree, so a
          # tool added tomorrow is in this check too.
          stamp=v0.0.0-dry-run

          # ONE: the ldflags helper refuses an empty stamp instead of composing
          # `-X main.version=` and letting the build stamp the empty string.
          if .github/scripts/release-ldflags.sh "" >/dev/null 2>&1; then
            echo "release-ldflags.sh accepted an empty stamp: a release could ship binaries that answer devel"
            exit 1
          fi
          echo "ok: an empty stamp is refused"
          ldflags=$(.github/scripts/release-ldflags.sh "$stamp")
          case "$ldflags" in
            *"-X main.version=$stamp"*) echo "ok: $ldflags" ;;
            *) echo "release-ldflags.sh composed something else: $ldflags"; exit 1 ;;
          esac

          # TWO: binaries built with NO stamp fail the assertion, by name. This is the
          # release that #118 describes -- every tool answering its vcs pseudo-version or
          # devel while the release page names a tag -- and it must be red.
          rm -rf "${RUNNER_TEMP}/unstamped" "${RUNNER_TEMP}/stamped"
          go build -o "${RUNNER_TEMP}/unstamped/" ./cmd/...
          set +e
          out=$(.github/scripts/assert-version-stamp.sh "$stamp" "${RUNNER_TEMP}/unstamped/%s" 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          if [ "$rc" -eq 0 ]; then
            echo "the assertion PASSED a set of binaries nothing stamped; it would pass a broken release"
            exit 1
          fi
          case "$out" in
            *"does not report the tag it was built from"*) echo "ok: unstamped binaries are refused by name" ;;
            *) echo "the assertion failed, but not for the missing stamp; that is a different defect"; exit 1 ;;
          esac

          # THREE: the same binaries, stamped the way release.yml stamps them, pass -- so
          # the red above is the stamp and not the harness.
          go build -ldflags "$ldflags" -o "${RUNNER_TEMP}/stamped/" ./cmd/...
          .github/scripts/assert-version-stamp.sh "$stamp" "${RUNNER_TEMP}/stamped/%s"

      - name: a required tool that loses its stamp fails the assertion, and the rest still pass
        shell: bash
        run: |
          set -euo pipefail
          # STELLA'S NEGATIVE CONTROL (#125 review). The step above builds the whole tree
          # unstamped, which is red at the FIRST tool and therefore says nothing about the
          # tool-by-tool rule: one binary losing its stamp while the other ten keep theirs
          # is the failure mode #118 names -- a rename or a removal the linker ignores in
          # silence -- and until this job it was the case nothing exercised. Under the
          # declaration-based eligibility this file carried until #125 it was worse than
          # unexercised: renaming `version` made the tool exempt from the check, so the
          # broken binary passed AS A NOTE and the job went green. The required set is the
          # shipped set now, so both mutations must be red, and red BY NAME.
          stamp=v0.0.0-dry-run
          ldflags=$(.github/scripts/release-ldflags.sh "$stamp")
          cp cmd/nova-tokens/version.go "${RUNNER_TEMP}/nova-tokens-version.go.orig"
          restore() { cp "${RUNNER_TEMP}/nova-tokens-version.go.orig" cmd/nova-tokens/version.go; }
          trap restore EXIT

          # The mutation is asserted to have LANDED before the binaries are built. A sed
          # that matched nothing would rebuild the unmutated tree, the assertion would go
          # red for no reason at all, and this step would be green while proving nothing.
          mutate() {
            restore
            case "$1" in
            rename)
              sed -i 's/^var version string$/var Version string/; s/resolveVersion(version, info, ok)/resolveVersion(Version, info, ok)/' cmd/nova-tokens/version.go
              if ! grep -q '^var Version string$' cmd/nova-tokens/version.go; then
                echo "the rename fixture did not apply; this step would prove nothing"; exit 1
              fi
              ;;
            remove)
              sed -i '/^var version string$/d; s/resolveVersion(version, info, ok)/resolveVersion("", info, ok)/' cmd/nova-tokens/version.go
              if grep -q '^var version string$' cmd/nova-tokens/version.go; then
                echo "the removal fixture did not apply; this step would prove nothing"; exit 1
              fi
              ;;
            esac
            rm -rf "${RUNNER_TEMP}/mutated"
            go build -ldflags "$ldflags" -o "${RUNNER_TEMP}/mutated/" ./cmd/...
          }

          for how in rename remove; do
            mutate "$how"
            set +e
            out=$(.github/scripts/assert-version-stamp.sh "$stamp" "${RUNNER_TEMP}/mutated/%s" 2>&1)
            rc=$?
            set -e
            printf '%s\n' "$out"
            if [ "$rc" -eq 0 ]; then
              echo "the assertion PASSED a release whose nova-tokens answers a pseudo-version ($how)"
              exit 1
            fi
            case "$out" in
              *"FAIL: nova-tokens does not report the tag it was built from"*) ;;
              *) echo "the assertion failed, but not for nova-tokens' missing stamp ($how); that is a different defect"; exit 1 ;;
            esac
            case "$out" in
              *"NOTE: nova-tokens"*) echo "nova-tokens was demoted to a NOTE ($how); a required tool cannot become exempt by losing a symbol"; exit 1 ;;
            esac
            # The other tools are untouched, so the red above is this tool and not the harness.
            case "$out" in
              *"ok: nova-board $stamp"*) ;;
              *) echo "nova-board stopped reporting the tag while only nova-tokens was mutated ($how)"; exit 1 ;;
            esac
            echo "ok: a $how of the stamp is refused by name, with nova-board still asserted"
          done
          restore

          # AND A STALE EXEMPTION IS ITSELF RED. The six names were a debt against #121;
          # #121's version verb has landed on all six, so the shipped list is EMPTY and the
          # fixture has to bring its own name: the stale check is injected into a COPY of
          # the script rather than shipped in it, because the shipped list must stay a line
          # a person edits and nothing else can write. A list that has drifted from the
          # tree has stopped saying what it claims to say, and this is the check that says
          # so.
          rm -rf "${RUNNER_TEMP}/one-tool"
          mkdir -p "${RUNNER_TEMP}/one-tool/cmd/nova-board"
          stale="${RUNNER_TEMP}/assert-with-a-stale-exemption.sh"
          cp .github/scripts/assert-version-stamp.sh "$stale"
          sed -i 's/^LEGACY_NO_VERSION_VERB=.*/LEGACY_NO_VERSION_VERB="nova-departed"/' "$stale"
          grep -q '^LEGACY_NO_VERSION_VERB="nova-departed"$' "$stale" || {
            echo "the stale-exemption fixture did not apply; this step would prove nothing"; exit 1; }
          set +e
          out=$("$stale" "$stamp" "${RUNNER_TEMP}/mutated/%s" "${RUNNER_TEMP}/one-tool/cmd" 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          [ "$rc" -ne 0 ] || { echo "an exemption naming a tool that does not exist was accepted"; exit 1; }
          case "$out" in
            *"is exempted from the stamp assertion but"*) echo "ok: a stale exemption is refused by name" ;;
            *) echo "the run failed, but not for the stale exemption; that is a different defect"; exit 1 ;;
          esac

      - name: a tag the release could not check is refused before anything is built
        shell: bash
        run: |
          set -euo pipefail
          # THE TAG ALPHABET -- the half of this job that was left owed. From the fourth
          # read of #125, the last open low of #118: "ci.yml's release-dry-run exercises
          # the empty-stamp refusal only; the `%` and `=` (and whitespace) refusals in
          # release-ldflags.sh and in the assertion have no negative control."
          #
          # WHAT A TAG CAN ACTUALLY CARRY, measured rather than assumed:
          # `git check-ref-format refs/tags/'v1.0%s-rc1'` and `…/'v1.0=rc1'` are ACCEPTED,
          # so `%` and `=` are tags a person can really push; `…/'v0.13.0 rc1'` is REFUSED,
          # so whitespace is not a legal refname, and release.yml:83 takes `TAG` from
          # `github.ref_name`, which no trigger can hand in with a space. The whitespace
          # cases below therefore prove the scripts' own refusal fires -- defence in depth
          # for a stamp arriving by some other path, a future input or a future caller --
          # and not a tag anyone can push today. Said plainly because a comment that calls
          # whitespace a legal refname is a comment a reader would have to check.
          #
          # These refusals exist because the failure each one replaces is LATE and
          # unreadable. A `%` tag travels into the assertion's printf FORMAT -- release.yml
          # hands it "dist/%s_${TAG}_linux_amd64" -- so printf reads a directive nobody
          # supplied, the script dies under `set -e` before printing a line, and the
          # release is red with no FAIL naming a cause. An `=` tag is read by the whole-
          # token match as a separator, so every stamped tool fails in turn AFTER the whole
          # matrix has been built. An assertion nothing exercises is a belief; and one that
          # fired on a legal tag would stop the next release for nothing, so both
          # directions are proved here -- each refusal by its own reason, and legal tags
          # through both scripts to the assertion's `ok:` lines.
          #
          # THE COUNT, read off the two scripts. Twelve refusals fire before any binary is
          # run: release-ldflags.sh six -- its usage (:19), the empty stamp (:29),
          # whitespace (:38), `%` (:53), `=` (:69), and a belt-and-braces check on the
          # composed string (:81) that cannot fire while the empty-stamp refusal stands;
          # assert-version-stamp.sh six -- its usage (:42), an empty expected tag (:51), a
          # template with no `%s` (:57), a `%` beyond the single `%s` (:74), whitespace in
          # the tag (:86), `=` in the tag (:91). This step exercises ten of them and the
          # step above exercises the eleventh (the empty stamp); the twelfth is the
          # composed-string check, which no argument can reach, and it is named here rather
          # than pretended about. The FAIL class further down the assertion -- a missing
          # binary, a verb that exited, a tool not reporting the tag, a stale exemption --
          # is what the two steps above exercise.
          stamp=v0.0.0-dry-run

          # The usage refusals first, because they are the cheapest thing in either script
          # to break: an argument added to one of these calls and not to the other end
          # would otherwise be a release that skipped its own check.
          refuse_usage() {
            local what=$1 out rc
            shift
            set +e
            out=$("$@" 2>&1)
            rc=$?
            set -e
            printf '%s\n' "$out"
            [ "$rc" -eq 2 ] || { echo "$what did not refuse $(($# - 1)) argument(s) as a usage error: rc=$rc"; exit 1; }
            case "$out" in
              *"usage:"*) echo "ok: $what refuses $(($# - 1)) argument(s) with its usage" ;;
              *) echo "$what exited 2 without printing its usage; a caller has nothing to read"; exit 1 ;;
            esac
          }
          refuse_usage release-ldflags.sh .github/scripts/release-ldflags.sh
          refuse_usage release-ldflags.sh .github/scripts/release-ldflags.sh "$stamp" extra
          refuse_usage assert-version-stamp.sh .github/scripts/assert-version-stamp.sh "$stamp"
          refuse_usage assert-version-stamp.sh .github/scripts/assert-version-stamp.sh "$stamp" 'dist/%s' cmd extra

          # ONE: the ldflags helper, called the way release.yml calls it -- a command
          # substitution under `set -euo pipefail`. The proof is that the line after it
          # never runs: in a release that is the difference between zero artifacts and 55.
          refuse_ldflags() {
            local tag=$1 phrase=$2 late=$3 out rc
            set +e
            out=$(TAG="$tag" bash -c 'set -euo pipefail; LDFLAGS=$(.github/scripts/release-ldflags.sh "$TAG"); echo "BUILT ldflags=$LDFLAGS"' 2>&1)
            rc=$?
            set -e
            printf '%s\n' "$out"
            [ "$rc" -ne 0 ] || { echo "release-ldflags.sh ACCEPTED the tag <$tag>: $late"; exit 1; }
            case "$out" in
              *"$phrase"*) ;;
              *) echo "<$tag> was refused, but not for $phrase; that is a different defect"; exit 1 ;;
            esac
            case "$out" in
              *BUILT*) echo "the release ran on past a refused stamp <$tag>; 55 artifacts would have been built"; exit 1 ;;
            esac
            echo "ok: <$tag> is refused with the build never starting"
          }
          refuse_ldflags 'v1.0%s-rc1' 'contains %' 'the assertion would die inside printf with no FAIL line naming a cause'
          refuse_ldflags 'v1.0=rc1' 'contains =' 'every stamped tool would fail the assertion after the matrix was built'
          refuse_ldflags 'v0.13.0 rc1' 'carries whitespace' 'the linker flag would split and the binaries would be stamped with the first word'

          # And a legal tag is not refused by any of the three: a check that says no to
          # everything is not a check. These are the shapes this repository actually tags.
          for legal in v0.13.0 v0.13.0-rc1 "$stamp"; do
            ldflags=$(.github/scripts/release-ldflags.sh "$legal")
            case "$ldflags" in
              *"-X main.version=$legal") echo "ok: <$legal> composes $ldflags" ;;
              *) echo "release-ldflags.sh composed something else for the legal tag <$legal>: $ldflags"; exit 1 ;;
            esac
          done

          # TWO: the same three at the OTHER end of the workflow, where the tag arrives
          # inside the path template. The fixture is named the way release.yml names its
          # artifacts (`<tool>_<tag>_linux_amd64`, accurate on this ubuntu runner) and the
          # template is composed the same way, so what is exercised is the real call shape
          # of release.yml's assertion step and not a shape invented here.
          dist="${RUNNER_TEMP}/alphabet"
          rm -rf "$dist"
          go build -ldflags "$(.github/scripts/release-ldflags.sh "$stamp")" -o "$dist/" ./cmd/...
          for bin in "$dist"/*; do
            mv "$bin" "${bin}_${stamp}_linux_amd64"
          done
          # The positive control first: a legal tag inside the template asserts every
          # shipped tool, so the refusals below are the tag alphabet and not this fixture.
          .github/scripts/assert-version-stamp.sh "$stamp" "$dist/%s_${stamp}_linux_amd64"

          # refuse_assertion_args is the same three assertions with the arguments handed in
          # raw, for the refusals whose fixture is not a tag inside release.yml's template.
          refuse_assertion_args() {
            local phrase=$1 out rc
            shift
            set +e
            out=$(.github/scripts/assert-version-stamp.sh "$@" 2>&1)
            rc=$?
            set -e
            printf '%s\n' "$out"
            [ "$rc" -eq 2 ] || { echo "the assertion did not refuse <$*> as a usage error: rc=$rc"; exit 1; }
            case "$out" in
              *"$phrase"*) ;;
              *) echo "<$*> was refused by the assertion, but not for $phrase; that is a different defect"; exit 1 ;;
            esac
            case "$out" in
              *"ok: "* | *"FAIL: "*) echo "the assertion ran the tools before refusing <$*>; this refusal is meant to precede them"; exit 1 ;;
            esac
            echo "ok: the assertion refuses a call it cannot check ($phrase) before it runs a binary"
          }

          refuse_assertion() {
            local tag=$1 phrase=$2 out rc
            set +e
            out=$(.github/scripts/assert-version-stamp.sh "$tag" "$dist/%s_${tag}_linux_amd64" 2>&1)
            rc=$?
            set -e
            printf '%s\n' "$out"
            [ "$rc" -eq 2 ] || { echo "the assertion did not refuse the tag <$tag> as a usage error: rc=$rc"; exit 1; }
            case "$out" in
              *"$phrase"*) ;;
              *) echo "<$tag> was refused by the assertion, but not for $phrase; that is a different defect"; exit 1 ;;
            esac
            # And it refuses BY NAMING ITSELF, before a single binary is run -- the whole
            # point of holding the refusal at this end too, rather than reporting a tag the
            # check can never match as eleven failing tools.
            case "$out" in
              *"ok: "* | *"FAIL: "*) echo "the assertion ran the tools before refusing <$tag>; this refusal is meant to precede them"; exit 1 ;;
            esac
            echo "ok: the assertion refuses <$tag> before it runs a binary"
          }
          refuse_assertion 'v1.0%s-rc1' 'beyond its single %s'
          refuse_assertion 'v1.0=rc1' 'contains ='
          refuse_assertion 'v0.13.0 rc1' 'carries whitespace'

          # And the two refusals that are not about the tag's alphabet at all: an empty
          # expected tag, and a template that names one path for every tool. Neither can
          # come from a release.yml that is written correctly, which is exactly why they
          # are worth a control -- they are the refusals that catch this workflow being
          # edited, and both say in the script that they exist because the alternative is a
          # check that asserts nothing and passes.
          refuse_assertion_args 'no expected tag given' "" "$dist/%s_${stamp}_linux_amd64"
          refuse_assertion_args 'holds no %s' "$stamp" "$dist/nova-board_${stamp}_linux_amd64"

      - name: upload the cross-built binaries
        # So that the smoke job runs THE BINARY THIS WOULD SHIP rather than one it builds
        # itself with different flags. The job above already builds with -trimpath and
        # CGO_ENABLED=0 for the reason stated at the top of it -- build the way the shipped
        # artifact is built, or the check is checking a configuration nobody ships -- and a
        # smoke job compiling its own copy was quietly exempt from that.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cross-built-binaries
          path: dist/
          retention-days: 1
          if-no-files-found: error

  perf:
    # THE WALL CLOCK, nightly, because a wall clock is not a per-commit test.
    #
    # cmd/nova-bus/timing_test.go runs every verb over a ten-thousand-note bus and holds
    # each to a bound in SECONDS. That bound is the only assertion in this repository whose
    # answer depends on what else the machine is doing, and on 2026-09-11 it was exactly
    # that: eleven seconds alone, one minute fifty-one under the load of `go test ./...`,
    # and the package hitting Go's ten-minute timeout with it in (#63). The house rule is
    # that a per-commit test finishes in a minute, two at most, or it becomes nightly.
    #
    # The property it guards did NOT move: the cost of a read is the size of the change, and
    # that is proved by COUNTING PARSES in TestInboxParsesOnlyWhatIsNewSinceTheCursor, which
    # runs in the CL tier on every commit. This job is the crude second net under
    # it, for a regression that is not a parse.
    #
    # One runner, no race detector, no matrix: the file skips itself under `-race` because
    # the instrumentation is what a wall clock would then be measuring, and a bound measured
    # on three different runner classes is three different bounds. Linux is the one the
    # number in that file was written against.
    #
    # It is NOT gated on the test job. A red perf job is a thing to go and read in the
    # morning, and making it wait on three operating systems' worth of tests would mean a
    # night where an unrelated flake means no perf evidence at all.
    runs-on: ubuntu-latest
    # Thirty rather than twenty: `-p 1 -parallel 1` over every package is the whole suite
    # run one test at a time, which is the point and is not fast.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: vet the perf-tagged tests
        # `go vet ./...` in the test job cannot see a file behind a build tag, so the one
        # place this file is compiled at all is here. Vet before test, so a perf file that
        # stopped compiling says that rather than failing as a bound.
        run: go vet -tags perf ./...

      - name: the wall-clock tests, one at a time
        # EVERY PACKAGE `./...` REACHES, under the tag -- not a -run naming one test and not
        # one package named here. This step used to name
        # TestEveryVerbIsUnderASecondOnTenThousandNotes, and the second wall-clock test
        # added in the same pull request -- TestAWaitPollsMoreThanOnceBeforeItsDeadline --
        # therefore ran NOWHERE: behind a tag the per-commit jobs do not build, and behind a
        # -run the nightly did not match. A list of test names in a workflow is a list that
        # goes stale silently, and so is a list of packages: the TAG decides what is extra,
        # and `./...` decides where it may live.
        #
        # THE SCOPE IS `./...` AND NOT "WHEREVER IT LIVES", which is the honest version of a
        # sentence this file carried for three commits. `./...` is this module's packages:
        # it does not descend into a nested module and it does not reach a package under a
        # testdata directory, both of which the go command excludes by design. A perf-tagged
        # test in either of those places would run nowhere and nothing here would say so.
        # There is no such package today; if one is ever added, this line is what has to
        # change, and this paragraph is why.
        #
        # `-p 1 -parallel 1` because these are wall clocks. The packages now run their tests
        # in parallel, and a bound in seconds measured while twelve siblings are spawning
        # git processes measures the siblings. One at a time on an idle nightly runner is
        # the condition the numbers in timing_test.go were written against.
        #
        # `-timeout 25m` under the job's 30: a serial run of the whole suite that gets stuck
        # should fail as a TEST timeout, which names the test it was in and dumps every
        # goroutine, rather than as a job cancellation, which names nothing. The gap is five
        # minutes so the panic has room to print.
        run: go test -tags perf -count=1 -v -p 1 -parallel 1 -timeout 25m ./...
