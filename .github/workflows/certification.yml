# Certification: the slower tier that cannot fit the two-minute per-CL budget.
#
# Every job that leaves ci.yml's CL tier appears here under the same name, so a
# change's ordinary feedback path stays under two minutes while nothing is
# deleted: the whole-tree `-race` run, Windows build/vet and per-package tests,
# the three-OS smoke of the shipped binary, the release dry-run, and the nightly
# perf wall clock all still run — on a daily schedule and on demand.
#
# A RED run here is a blocker for the next release, never for a CL. See
# docs/CONTRIBUTING.md, "Two tiers of CI".

name: certification

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
  push:
    branches: [dev]


permissions:
  contents: read

env:
  # #3113: the same fail-closed switch as ci.yml. The test and perf jobs
  # install redis-server before they run the suite.
  NOVA_CI: "1"

concurrency:
  group: certification-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  race-cache:
    # PRIMES THE RACE CACHE ONCE PER OS, before the sixteen test legs start. Every test leg
    # restores the `<os>-gorace-` entry, and on a miss every leg builds the same race
    # dependencies itself: 31-54 s each on ubuntu-latest in run 36377073595, which put two
    # cold legs over the cap. This job asks for the exact entry without downloading it
    # (lookup-only) and, only on a miss, builds and saves it, so a cold run's test legs start
    # warm. On a hit it does nothing else. The paths and key are the test job's, byte for byte.
    name: race-cache (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2  # the classtests rule reads what HEAD deleted from its first parent
      - name: name the Go toolchain's tool-cache directory
        shell: bash
        run: echo "GO_TOOL_DIR=${RUNNER_TOOL_CACHE}/go/$(sed -n 's/^go \([0-9.]*\)$/\1/p' go.mod)" >> "$GITHUB_ENV"

      - name: is the race cache entry there
        id: probe
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          lookup-only: true
          path: |
            ${{ runner.os == 'macOS' && '~/Library/Caches/go-build' || '~/.cache/go-build' }}
            ~/go/pkg/mod
            ${{ env.GO_TOOL_DIR }}
          key: ${{ runner.os }}-gorace-${{ hashFiles('go.mod') }}

      - name: restore the nearest race cache entry
        if: steps.probe.outputs.cache-hit != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ runner.os == 'macOS' && '~/Library/Caches/go-build' || '~/.cache/go-build' }}
            ~/go/pkg/mod
            ${{ env.GO_TOOL_DIR }}
          key: ${{ runner.os }}-gorace-${{ hashFiles('go.mod') }}
          restore-keys: |
            ${{ runner.os }}-gorace-

      - if: steps.probe.outputs.cache-hit != 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: build the ci runner
        if: steps.probe.outputs.cache-hit != 'true'
        # tools/ci is built once in this job and every later step runs the binary; `go run` would
        # compile it again in each step. (`go run ./tools/ci help` lists its verbs.)
        shell: bash
        run: go build -o "$RUNNER_TEMP/ci" ./tools/ci

      - name: build the race-instrumented dependencies
        if: steps.probe.outputs.cache-hit != 'true'
        shell: bash
        run: |
          "$RUNNER_TEMP/ci" race-deps

      - name: save the race build cache
        if: steps.probe.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ runner.os == 'macOS' && '~/Library/Caches/go-build' || '~/.cache/go-build' }}
            ~/go/pkg/mod
            ${{ env.GO_TOOL_DIR }}
          key: ${{ runner.os }}-gorace-${{ hashFiles('go.mod') }}

  test:
    # THE WHOLE-TREE RACE RUN, on a clean GitHub-hosted image, linux/amd64 and darwin/arm64:
    # every live package under `go test -race`, full (no -short), and the one place either of
    # those runs. ci.yml's CL tier runs the same tests without -race, and its hosted legs run
    # -short.
    #
    # SHARDED BY PACKAGE (2026-09-27). Unsharded, this job ran `go build ./...`, `go vet ./...`
    # and `go test -race ./...` on one runner under the two-minute cap and was cancelled by the
    # cap on every dev push since the cap landed (27c9ffc66, 2026-09-26): runs 36355661583,
    # 36356115183, 36357522017, 36357749379 and 36360296846. ubuntu-latest reached the test step
    # 97-119 s into the job (setup-go 8-10 s, build 52-67 s cold, vet 16-22 s, redis 11-18 s) and
    # was cancelled in it every time, at most two packages reported; macos-latest reached it at
    # 78-128 s in three runs and was cancelled in build or vet in the other two.
    # The last green whole-tree race run (dev push 36137551959, 2026-09-25, 15-minute cap) took
    # 421 s of test step on ubuntu-latest and 497 s on macos-latest. The cap stays two minutes;
    # the legs meet it by shard count, with the deal of ci.yml's test-hosted (heavy packages
    # first, one per shard, then round-robin) over the live packages only (deprecated/PACKAGES:
    # deprecated packages are never tested).
    #
    # THE HEAVY LIST is measured, not named: the per-package times this job's own legs report
    # (`ok <pkg> <seconds>`), the larger of ubuntu-latest and macos-latest, in the cold run
    # 36375296705 at 3314df055 plus this change: internal/ci 49.3 s, cmd/nova-tokens 46.4,
    # cmd/nova-sandbox 34.2, cmd/nova-self-talk 21.3, internal/update 19.1, cmd/nova-secrets 16.7,
    # internal/bus 16.6, every other live package under 13 (cmd/nova-bus 1.2). Seven heavy
    # packages, eight shards: each heavy package has a shard of its own and the rest are about
    # twelve packages a shard.
    #
    # BUILD AND VET ARE NOT HERE ANY MORE. They are ci.yml's: its lint job runs `make build` and
    # `make vet` on every event (Linux), and its test-hosted legs run `make build` and
    # `make vet PKGS=<shard>` on ubuntu-latest and macos-latest on every push to dev and main.
    # Each shard's `go test -race` still compiles every package it tests, so the union of the
    # shards compiles the whole live tree for both platforms. gofmt stays, on one leg.
    #
    # THE RACE BUILD CACHE, the shape of ci.yml's test-hosted (#4482): Go's own cache path per
    # OS, restored first and SAVED BEFORE THE TESTS, because actions/cache's post-step save
    # never runs in a job the cap cancels, and this job was never green to save one (setup-go's
    # own cache logged "Cache is not found" on all ten legs of the runs above). What is saved is the
    # race-instrumented build of every external module package the live tree's tests import
    # (139 packages at 82429246b): measured cold on the Studio at -p 4, 18.3 s and 384 MB, then
    # 0.2 s warm. Every shard builds the same list, so whichever shard saves first saves the
    # entry every shard needs; the tree's own packages compile per shard in the test step
    # (the whole live tree's race test binaries, compiled and linked with warm dependencies:
    # 24.1 s at -p 4 on the Studio, about an eighth of that a shard). The key says `gorace`, so
    # it is never ci.yml's non-race entry (whose restore prefix is `<os>-go-`, which this key
    # does not start with).
    name: test (${{ matrix.os }}, ${{ matrix.shard }})
    needs: race-cache
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
        include:
          - os: ubuntu-latest
            shards: 8
          - os: macos-latest
            shards: 8
    runs-on: ${{ matrix.os }}
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2  # the classtests rule reads what HEAD deleted from its first parent
      - name: start installing redis-server in the background
        # The install is 3-45 s of apt or brew on a hosted runner (45 s on ubuntu-latest shard 3
        # of run 36377703562, the leg's longest step). Started here, it overlaps the cache
        # restore, the toolchain and the deal; the `install redis-server` step below runs the
        # same script, which waits on the first one's lock, finds the binary and publishes its
        # directory to PATH for the steps after it. The runner reaps the process at job end.
        shell: bash
        run: nohup bash .github/scripts/install-redis-server.sh > "${RUNNER_TEMP}/redis-install.log" 2>&1 &

      - name: name the Go toolchain's tool-cache directory
        # The toolchain rides in the race cache entry below. setup-go downloads, extracts and
        # then copies it into the runner's tool cache: 26-27 s on macos-latest, 16 s of it the
        # copy (run 36376038363). Restored into the tool cache first, setup-go finds it there
        # and does neither. The version is go.mod's, which the cache key already hashes.
        shell: bash
        run: echo "GO_TOOL_DIR=${RUNNER_TOOL_CACHE}/go/$(sed -n 's/^go \([0-9.]*\)$/\1/p' go.mod)" >> "$GITHUB_ENV"

      - name: restore the race build cache
        id: gocache
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ runner.os == 'macOS' && '~/Library/Caches/go-build' || '~/.cache/go-build' }}
            ~/go/pkg/mod
            ${{ env.GO_TOOL_DIR }}
          key: ${{ runner.os }}-gorace-${{ hashFiles('go.mod') }}
          restore-keys: |
            ${{ runner.os }}-gorace-

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # This job manages its cache above and below; setup-go's own saves in a post step,
          # which a cancelled job never reaches.
          cache: false

      - name: build the ci runner
        # tools/ci is built once in this job and every later step runs the binary; `go run` would
        # compile it again in each step. (`go run ./tools/ci help` lists its verbs.)
        shell: bash
        run: go build -o "$RUNNER_TEMP/ci" ./tools/ci

      - name: gofmt
        # gofmt -l prints unformatted files and exits 0 either way, so the exit
        # code is not the product here — the output is, and `ci gofmt` turns it
        # into the exit. Checked on one leg: formatting is a property of the
        # source, not of the platform or the shard. deprecated/ is out of scope
        # of the testing drive; see deprecated/README.md.
        if: matrix.os == 'ubuntu-latest' && matrix.shard == 1
        shell: bash
        run: |
          "$RUNNER_TEMP/ci" gofmt

      - name: deal this shard's packages
        # ci.yml test-hosted's deal, with this job's measured heavy list: the heavy
        # packages first, one per shard, then every other live package round-robin in go list
        # order. One line of space-separated packages. `go run ./tools/ci help deal`;
        # internal/ci: TestCertificationRaceShardsPartitionTheLiveTree (certRaceHeavy).
        shell: bash
        run: |
          "$RUNNER_TEMP/ci" deal --shards ${{ matrix.shards }} --shard ${{ matrix.shard }} --heavy "internal/ci cmd/nova-tokens cmd/nova-sandbox cmd/nova-self-talk internal/update cmd/nova-secrets internal/bus"

      - name: fetch origin/dev for the deprecated-imports ratchet
        # internal/ci's TestDeprecatedImportsAllowlistOnlyShrinksAgainstMergeBase compares the
        # allowlist against the merge base with refs/remotes/origin/dev and refuses when that
        # ref is missing. actions/checkout creates it only on a run of dev itself; a dispatch
        # on a tag, on main or on a branch has no such ref. One commit is enough: with no
        # shared history in the shallow clone the test compares against HEAD's first parent.
        if: contains(format(' {0} ', env.HOSTED_PKGS), '/internal/ci ')
        shell: bash
        run: git fetch --no-tags --depth=1 origin +dev:refs/remotes/origin/dev

      - name: fetch dev's ancestry for a main run
        # On main (the default branch) at a merge commit, the landed promotion,
        # the classtests rule excuses a deletion only when the second parent's
        # ancestry shows dev deleting it; a shallow ancestry is a red run naming
        # this fetch. blob:none brings commits and trees only; --unshallow
        # completes them, after the depth-1 fetch above as well as instead of it
        # (`go run ./tools/ci help fetch-ancestry`).
        if: github.ref_name == github.event.repository.default_branch
        shell: bash
        run: |
          "$RUNNER_TEMP/ci" fetch-ancestry dev
      - name: fetch sprint/foundation's ancestry for a promotion
        # The classtests rule reads a promotion from git: on the promotion pull request
        # (sprint/foundation into dev) dev's tip must be an ancestor of the head, and on a
        # dev run at a merge commit (a merge-queue group, a push to dev) the second parent
        # must be sprint/foundation's and its history excuses what it deleted. A shallow
        # ancestry is a red run naming this fetch (internal/ci foundationHistoryFetch).
        # A one-parent commit on a dev run has no promotion to read, so nothing is fetched.
        if: (github.event_name == 'push' && github.ref_name == 'dev')
        shell: bash
        run: |
          "$RUNNER_TEMP/ci" fetch-ancestry --promotion sprint/foundation

      - name: build the race-instrumented dependencies
        # Every external package the live tree's tests import, -race, whatever this shard
        # holds: the same list on every shard, so the entry saved next serves them all.
        shell: bash
        run: |
          "$RUNNER_TEMP/ci" race-deps

      - name: save the race build cache
        # On a miss or a restore-keys fallback only: an exact hit is already the entry. Shards
        # race for the key; the first reserves it and the rest log a warning and go on.
        if: runner.environment == 'github-hosted' && steps.gocache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ runner.os == 'macOS' && '~/Library/Caches/go-build' || '~/.cache/go-build' }}
            ~/go/pkg/mod
            ${{ env.GO_TOOL_DIR }}
          key: ${{ steps.gocache.outputs.cache-primary-key }}

      - name: install redis-server
        # #3113. This job is the hosted full suite, ubuntu-latest and
        # macos-latest. The controls spawn redis-server; they do not dial a bench.
        # Finishes (or waits on) the background install started at the top of the job.
        shell: bash
        run: |
          bash .github/scripts/install-redis-server.sh || { cat "${RUNNER_TEMP}/redis-install.log"; exit 1; }

      - name: test (shard ${{ matrix.shard }} of ${{ matrix.shards }})
        # -count=1: the restored cache must never answer for a test. -timeout 75s: this step
        # starts 35-50 s into the job, so a package still running at 75 s would be cancelled
        # by the cap anyway; Go's timeout fires first and names the test with a stack.
        shell: bash
        run: go test -race -count=1 -timeout 75s $HOSTED_PKGS

  smoke:
    needs: release-dry-run
    # Exercises the BUILT BINARY. `go test` covers the packages; nothing else
    # covered the executable a user actually runs, and what a release ships is
    # the executable.
    #
    # HONEST SCOPE, because this job's own argument is that unstated coverage
    # is a lie — and an enumerating sentence that omits items reads worse than
    # a general one, so this says what IS smoked and stops.
    #
    # Smoked here: `nova-check nocode`, plus one property of `nova-check links`
    # — that a symlinked `--dir` is resolved rather than passed over — and only
    # the properties asserted in the steps below. Everything else in this
    # repository — every other `nocode` flag and refusal path, every other
    # `links` property, every other `nova-check` subcommand, and the
    # `nova-fuse`, `nova-memory`, `nova-self-talk` and `nova-bus`
    # commands — is covered by package tests and by nothing else.
    #
    # WINDOWS. The portable steps run there too. An earlier revision excluded
    # the whole job on the grounds that its fixtures need an executable bit,
    # chmod refusing a read, mkfifo or symlinks — true of four steps and false
    # of the other three, which meant the binary was never smoked on the one
    # platform whose defects this branch exists to have found. The steps that
    # genuinely cannot run there are marked individually.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 2
    env:
      # Go appends .exe on Windows, so the name has to carry it or every step
      # below looks for a binary that is not there. Keyed off matrix.os and NOT
      # runner.os: the runner context is not available to a job-level env, and
      # using it there does not warn — it invalidates the whole workflow file,
      # which fails the run before a single step executes.
      BIN: ${{ github.workspace }}/nova-check${{ startsWith(matrix.os, 'windows') && '.exe' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2  # the classtests rule reads what HEAD deleted from its first parent

      - name: download this runner's platform from the release build
        id: download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ startsWith(matrix.os, 'ubuntu') && 'release-linux-amd64' || startsWith(matrix.os, 'macos') && 'release-darwin-arm64' || 'release-windows-amd64' }}
          path: dist

      - name: take this runner's shipped binary
        id: take_binary
        # THE BINARY THAT WOULD SHIP, not one built here. This step used to be `go build -o
        # "$BIN" ./cmd/nova-check`, which is a different binary from the released one --
        # different flags, no -trimpath, CGO as the host has it -- so the job whose whole
        # argument is "what a release ships is the executable" was smoking an executable no
        # release ships. There is no Go toolchain in this job any more: if the binary is not
        # in the artifact, this job cannot paper over it by compiling one.
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.os }}" in
            ubuntu-latest)  target=linux_amd64 ;;
            macos-latest)   target=darwin_arm64 ;;
            windows-latest) target=windows_amd64 ;;
            *) echo "no shipped target mapped for ${{ matrix.os }}"; exit 1 ;;
          esac
          # The release name, <tool>_<stamp>_<goos>_<goarch>[.exe] (`ghrelease build`).
          src="dist/nova-check_v0.0.0-dry-run_$target"
          [ "$target" = "windows_amd64" ] && src="$src.exe"
          [ -f "$src" ] || { echo "$src is not in the artifact: ls -R dist"; ls -R dist; exit 1; }
          mkdir -p "$(dirname "$BIN")"
          cp "$src" "$BIN"
          chmod +x "$BIN"
          "$BIN" version || true

      - name: a clean prose tree passes, and is actually walked
        id: clean_tree
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          tree="$(mktemp -d)"
          printf '# notes\n' > "$tree/NOTES.md"
          printf 'plain text\n' > "$tree/plain.txt"
          set +e; out=$("$BIN" nocode --dir "$tree" 2>&1); rc=$?; set -e
          [ "$rc" -eq 0 ] || { echo "want exit 0, got $rc: $out"; exit 1; }
          # files=2 is the load-bearing half. `nocode` prints NOCODE OK and
          # exits 0 for a tree it never opened, so exit 0 alone cannot tell a
          # pass from a walk that scanned nothing.
          case "$out" in
            *"files=2 clean"*) ;;
            *) echo "want files=2 clean, got: $out"; exit 1 ;;
          esac

      - name: a symlinked --dir is resolved, not passed over
        id: symlink_nocode
        # POSIX only: needs an executable bit, chmod refusing a read, mkfifo or symlinks.
        if: ${{ !cancelled() && (runner.os != 'Windows') }}
        shell: bash
        run: |
          # The fail-open the assertion above was WRONGLY credited with
          # catching. os.Stat follows a link, so --dir naming a symlink to the
          # tree was seen as a single non-directory entry and returned
          # NOCODE OK files=0, exit 0: a clean pass over a tree never opened.
          # A reviewer removed filepath.EvalSymlinks and every other step here
          # stayed green, because none of their fixtures is itself a link.
          # This one is.
          real="$(mktemp -d)"; printf '# n\n' > "$real/NOTES.md"; printf 'print(1)\n' > "$real/tool.py"
          link="$(mktemp -d)/link"; ln -s "$real" "$link"
          set +e; out=$("$BIN" nocode --dir "$link" 2>&1); rc=$?; set -e
          [ "$rc" -eq 1 ] || { echo "symlinked --dir: want exit 1, got $rc: $out"; exit 1; }
          case "$out" in
            *"tool.py"*) echo "ok: a symlinked --dir is walked" ;;
            *) echo "symlinked --dir: the tree was not walked: $out"; exit 1 ;;
          esac

      - name: a symlinked --dir is resolved, not passed over (links)
        id: symlink_links
        # POSIX only: needs an executable bit, chmod refusing a read, mkfifo or symlinks.
        if: ${{ !cancelled() && (runner.os != 'Windows') }}
        shell: bash
        run: |
          # The same fail-open, in the other checker. os.Stat follows a link,
          # so --dir naming a symlink to the tree was seen as a single
          # non-directory entry and returned LINKS OK files=0 links=0, exit 0
          # — a clean pass over a tree never walked, while the same tree by its
          # real path reported the broken link and exited 1. No other step in
          # this job hands `links` a --dir that is itself a link, so nothing
          # else here would catch it coming back.
          real="$(mktemp -d)"; printf 'fine\n\n[gone](gone.md)\n' > "$real/a.md"
          link="$(mktemp -d)/link"; ln -s "$real" "$link"
          set +e; out=$("$BIN" links --dir "$link" 2>&1); rc=$?; set -e
          [ "$rc" -eq 1 ] || { echo "symlinked --dir: want exit 1, got $rc: $out"; exit 1; }
          case "$out" in
            *"a.md:3: gone.md (does not exist)"*) echo "ok: a symlinked --dir is walked" ;;
            *) echo "symlinked --dir: the tree was not walked: $out"; exit 1 ;;
          esac

      - name: a tree that classified nothing says so
        id: classified_nothing
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          # The scanned==0 warning is the only remaining backstop for the
          # fail-open above in a real repository, and deleting it left every
          # other step green. Exit 0 is correct here: an empty tree genuinely
          # holds no machinery. What must not vanish is the sentence telling
          # an operator that nothing was classified.
          empty="$(mktemp -d)"
          set +e; out=$("$BIN" nocode --dir "$empty" 2>&1); rc=$?; set -e
          [ "$rc" -eq 0 ] || { echo "empty tree: want exit 0, got $rc: $out"; exit 1; }
          case "$out" in
            *"classified NOTHING"*) echo "ok: an unwalked tree is reported" ;;
            *) echo "empty tree: the scanned==0 warning is gone: $out"; exit 1 ;;
          esac

      - name: each condition refuses separately, with the right code and reason
        id: each_condition
        # POSIX only: needs an executable bit, chmod refusing a read, mkfifo or symlinks.
        if: ${{ !cancelled() && (runner.os != 'Windows') }}
        shell: bash
        run: |
          # One fixture per condition AND an assertion on which reason fired.
          # One fixture per condition alone would still go green if a
          # regression collapsed every case into one spurious finding.
          check() {
            desc="$1"; tree="$2"; want_reason="$3"
            set +e; out=$("$BIN" nocode --dir "$tree" 2>&1); rc=$?; set -e
            [ "$rc" -eq 1 ] || { echo "$desc: want exit 1, got $rc: $out"; exit 1; }
            case "$out" in
              *"$want_reason"*) echo "ok: $desc" ;;
              *) echo "$desc: want reason '$want_reason', got: $out"; exit 1 ;;
            esac
          }

          t="$(mktemp -d)"; printf '# n\n' > "$t/NOTES.md"; printf 'print(1)\n' > "$t/tool.py"
          check "extension" "$t" "code extension .py (floor-list)"

          t="$(mktemp -d)"; printf '# n\n' > "$t/NOTES.md"; printf 'not a script\n' > "$t/thing"; chmod +x "$t/thing"
          check "executable bit" "$t" "executable (mode"

          t="$(mktemp -d)"; printf '# n\n' > "$t/NOTES.md"; printf '#!/bin/sh\necho hi\n' > "$t/thing"
          check "shebang" "$t" "executable script (shebang)"

      - name: the fail-opens this CI exists for stay closed
        id: fail_opens
        # POSIX only: needs an executable bit, chmod refusing a read, mkfifo or symlinks.
        if: ${{ !cancelled() && (runner.os != 'Windows') }}
        shell: bash
        run: |
          # These are the regressions that motivated the file. Each was a real
          # fail-open in a released check: a file nobody can open, and a file
          # that is not a regular file at all, must be FINDINGS rather than
          # passes. Making a file less readable must never make this gate
          # greener.
          if [ "$(id -u)" = "0" ]; then
            # FAIL rather than skip. The hosted runners are non-root, so this
            # branch firing means the environment changed under us — and a
            # silent skip would turn this job's headline fail-open assertion
            # into a no-op behind a green check.
            echo "running as root: chmod cannot refuse a read, so this assertion cannot run"
            exit 1
          else
            t="$(mktemp -d)"; printf '# n\n' > "$t/NOTES.md"; printf 'x\n' > "$t/secret"; chmod 000 "$t/secret"
            set +e; out=$("$BIN" nocode --dir "$t" 2>&1); rc=$?; set -e
            chmod 644 "$t/secret" || true
            [ "$rc" -eq 1 ] || { echo "unreadable: want exit 1, got $rc: $out"; exit 1; }
            case "$out" in
              *"cannot rule out machinery"*) echo "ok: unreadable file is a finding" ;;
              *) echo "unreadable: wrong reason: $out"; exit 1 ;;
            esac
          fi

          t="$(mktemp -d)"; printf '# n\n' > "$t/NOTES.md"; mkfifo "$t/pipe.sh"
          set +e; out=$("$BIN" nocode --dir "$t" 2>&1); rc=$?; set -e
          [ "$rc" -eq 1 ] || { echo "fifo: want exit 1, got $rc: $out"; exit 1; }
          case "$out" in
            *"not a regular file"*) echo "ok: non-regular file is a finding" ;;
            *) echo "fifo: wrong reason: $out"; exit 1 ;;
          esac

      - name: a guard that cannot read its own list refuses, and says so
        id: unreadable_list
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          # Exit 2, not merely non-zero: `flag` also exits non-zero on an
          # unknown flag, so "non-zero" would pass with --deny-ext misspelled
          # and the flag under test never exercised. The message is asserted
          # for the same reason.
          # The @path is RELATIVE on purpose. An absolute POSIX path here is
          # rewritten by git-bash on Windows — "@/nonexistent/list.txt" reached
          # the binary as "C:/Program Files/Git/nonexistent/list.txt" — so the
          # exit code held and the message assertion failed on a spelling this
          # step never chose. A relative name is passed through unchanged by
          # every shell in the matrix.
          t="$(mktemp -d)"; printf '# n\n' > "$t/NOTES.md"
          set +e; out=$("$BIN" nocode --dir "$t" --deny-ext "@no-such-deny-list.txt" 2>&1); rc=$?; set -e
          [ "$rc" -eq 2 ] || { echo "want exit 2, got $rc: $out"; exit 1; }
          case "$out" in
            *"deny-list file: open no-such-deny-list.txt"*) echo "ok: unreadable deny-list refused" ;;
            *) echo "wrong message: $out"; exit 1 ;;
          esac

      - name: every assertion above reported
        # THE GATE, and the reason every step above carries `if: ${{ !cancelled() }}`.
        #
        # A step that fails stops the ones after it from running by default, so a broken
        # second assertion used to hide assertions three to seven: the job went red,
        # somebody fixed the one failure it named, and the next run found the next one.
        # Seven red steps in one run is seven facts; one red step and six skipped is one
        # fact and a queue.
        # `!cancelled()` runs them all anyway -- and keeps honouring a real cancellation --
        # and this step is where the job's verdict is stated in one place, naming every
        # outcome rather than only the first bad one.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -uo pipefail
          bad=0
          # The two PREREQUISITE steps are in this list as well as the seven assertions: a
          # gate that claims to state every outcome and silently omits the two steps that
          # produce the binary is a gate with a blind spot exactly where a green would be
          # most misleading.
          for pair in \
            "download the shipped binaries:${{ steps.download.outcome }}" \
            "take this runner's binary:${{ steps.take_binary.outcome }}" \
            "a clean prose tree passes:${{ steps.clean_tree.outcome }}" \
            "a symlinked --dir (nocode):${{ steps.symlink_nocode.outcome }}" \
            "a symlinked --dir (links):${{ steps.symlink_links.outcome }}" \
            "a tree that classified nothing:${{ steps.classified_nothing.outcome }}" \
            "each condition refuses separately:${{ steps.each_condition.outcome }}" \
            "the fail-opens stay closed:${{ steps.fail_opens.outcome }}" \
            "an unreadable deny-list refuses:${{ steps.unreadable_list.outcome }}"
          do
            what="${pair%:*}"; outcome="${pair##*:}"
            echo "$outcome	$what"
            case "$outcome" in success|skipped) ;; *) bad=$((bad + 1)) ;; esac
          done
          [ "$bad" -eq 0 ] || { echo "$bad smoke assertion(s) failed"; exit 1; }

  release-build:
    # THE RELEASE BUILD, run on every certification with nothing attached to a release. It
    # exists because release.yml's first run is triggered by a TAG, and a tag is the one thing
    # in this repository that cannot be quietly amended: a target that stopped compiling would
    # be found by the release itself, with the tag already pushed. Here it is a red run
    # before a release, not after a tag.
    #
    # THE SAME BUILD AS release.yml's `build` job, step for step: one leg per shipped
    # platform, each running `go run ./tools/ghrelease build` (every cmd/*/ tool, -trimpath,
    # CGO_ENABLED=0, the ldflags `ghrelease ldflags` composes) and uploading its binaries as
    # the artifact `release-<goos>-<goarch>`. The matrix is the list in
    # tools/ghrelease/release-targets, written out because a matrix cannot read a file;
    # internal/ci's TestReleaseMatricesAreTheTargetsFile holds this matrix, release.yml's
    # and the file equal. The one difference from the release is the stamp, v0.0.0-dry-run.
    #
    # ONE LEG PER PLATFORM, in parallel, under the two-minute cap. One runner cross-building
    # all five platforms cold was cancelled by the cap inside the build (run 36357749379,
    # about 146 s into the step). A leg compiles one platform: 45 s of CPU for the fifteen
    # tools and their dependencies cold on the Studio, 1.2 s warm.
    #
    # THE GO BUILD CACHE, per platform, restored first and SAVED right after the build,
    # before the upload, for the reason the test job gives: a post-step save never runs in a
    # job the cap cancels. The key is the platform and go.mod/go.sum, so the entry holds the
    # standard library and every module package compiled for that platform, and the tree's
    # own packages compile in the leg. release-checks restores the linux-amd64 entry.
    #
    # Every action in this file is pinned by SHA. A mutable tag cannot change the action
    # implementation underneath a previously reviewed workflow.
    name: release-build (${{ matrix.goos }}, ${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: windows, goarch: amd64}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2  # the classtests rule reads what HEAD deleted from its first parent
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # This job manages its cache below; setup-go's own saves in a post step.
          cache: false

      - name: restore the release build cache
        id: gocache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: release-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            release-${{ matrix.goos }}-${{ matrix.goarch }}-

      - name: every shipped tool compiles for ${{ matrix.goos }}/${{ matrix.goarch }}
        shell: bash
        run: go run ./tools/ghrelease build --require-v-tag v0.0.0-dry-run "${{ matrix.goos }}" "${{ matrix.goarch }}" dist

      - name: save the release build cache
        # On a miss or a restore-keys fallback only: an exact hit is already the entry.
        if: steps.gocache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.gocache.outputs.cache-primary-key }}

      - name: upload this platform's binaries
        # So that release-dry-run sums the set this would ship and the smoke job runs THE
        # BINARY THIS WOULD SHIP rather than one it builds itself with different flags.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 1
          if-no-files-found: error

  release-dry-run:
    # release.yml's final job over the dry-run set, on one machine: every platform's
    # artifact downloaded into one directory, every linux/amd64 binary asked for the stamp it
    # was built from (`ghrelease stamp`, the runner is linux/amd64), then `ghrelease sums`,
    # which refuses a directory that is not exactly the shipped set (every cmd/*/ tool for
    # every platform in release-targets, nothing else) and writes and verifies SHA256SUMS over
    # the whole of it. The release runs the same two verbs in the same order before it
    # attaches the set. Nothing is built here, so nothing here can paper over a leg that did
    # not build; the Go toolchain only runs the two verbs.
    needs: release-build
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2  # the classtests rule reads what HEAD deleted from its first parent
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: download every platform's binaries into one directory
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: every shipped binary reports the tag it was built from
        shell: bash
        run: |
          # An artifact does not keep the executable bit.
          chmod +x dist/*_v0.0.0-dry-run_linux_amd64
          go run ./tools/ghrelease stamp v0.0.0-dry-run "dist/%s_v0.0.0-dry-run_linux_amd64"

      - name: SHA256SUMS over the whole shipped set
        shell: bash
        run: go run ./tools/ghrelease sums v0.0.0-dry-run dist

  release-checks:
    # THE NEGATIVE CONTROLS OF THE STAMP ASSERTION, on this tree's real binaries: binaries
    # built with no stamp fail it by name, the same tree stamped the way release.yml stamps
    # passes, and one required tool that loses its stamp (the version symbol renamed, then
    # removed) fails by name while the others are still asserted. A tag is the one thing here
    # that cannot be quietly amended, and an assertion nothing has seen fail is a belief, so
    # both outcomes are shown on every certification rather than first on a tag.
    #
    # What needs no binary is a unit test of tools/ghrelease and runs on every commit: the
    # stamp refusals and the tag alphabet (`%`, `=`, white space), the usage errors, the stale
    # exemption, the certified gate (newer failure after older success, a run in flight, one
    # green) and the draft/publication boundary of the upload, each through a fake gh.
    #
    # The controls build the tools for this runner, linux/amd64, with the release's -trimpath
    # and CGO_ENABLED=0, so the compiles are the ones release-build's linux-amd64 leg saved to
    # its cache; it needs that leg for the entry, and each build here is a link. The binaries
    # built here are fixtures and are never shipped or summed.
    needs: release-build
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GOFLAGS: -trimpath
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2  # the classtests rule reads what HEAD deleted from its first parent
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: restore the linux-amd64 release build cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: release-linux-amd64-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            release-linux-amd64-

      - name: the stamp assertion is red on an unstamped or mutated tool and green on the release's stamp
        shell: bash
        run: go run ./tools/ghrelease controls

  perf:
    # THE WALL CLOCK, nightly, because a wall clock is not a per-commit test.
    #
    # cmd/nova-bus/timing_test.go runs every verb over a ten-thousand-note bus and holds
    # each to a bound in SECONDS. That bound is the only assertion in this repository whose
    # answer depends on what else the machine is doing, and on 2026-09-11 it was exactly
    # that: eleven seconds alone, one minute fifty-one under the load of `go test ./...`,
    # and the package hitting Go's ten-minute timeout with it in (#63). The house rule is
    # that a per-commit test finishes in a minute, two at most, or it becomes nightly.
    #
    # The property it guards did NOT move: the cost of a read is the size of the change, and
    # that is proved by COUNTING PARSES in TestInboxParsesOnlyWhatIsNewSinceTheCursor, which
    # runs in the CL tier on every commit. This job is the crude second net under
    # it, for a regression that is not a parse.
    #
    # One runner, no race detector, no matrix: the file skips itself under `-race` because
    # the instrumentation is what a wall clock would then be measuring, and a bound measured
    # on three different runner classes is three different bounds. Linux is the one the
    # number in that file was written against.
    #
    # It is NOT gated on the test job. A red perf job is a thing to go and read in the
    # morning, and making it wait on three operating systems' worth of tests would mean a
    # night where an unrelated flake means no perf evidence at all.
    #
    # THE PERF TESTS ONLY, discovered, never named. This job used to run every test of `./...`
    # under the tag one at a time (`-p 1 -parallel 1`); green in 175 s (36303146135) and 644 s
    # (36137551959), then cancelled by the two-minute cap on every run, still inside
    # cmd/nova-bus. Every other test in that run is run by the test job above and by ci.yml;
    # what only this job runs is the tests the `perf` tag adds. So the job finds them: the live
    # packages holding a file whose build constraint names `perf`, and in each, the tests
    # `go test -tags perf -list` names and `go test -list` does not. A perf test added in any
    # live package tomorrow is in that difference without anyone editing this file, and a test
    # that is not behind the tag is not re-run here. Today that is the two tests of
    # cmd/nova-bus/timing_test.go, 8.3 s together on the Studio.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2  # the classtests rule reads what HEAD deleted from its first parent
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # This job manages its cache below; setup-go's own saves in a post step.
          cache: false

      - name: restore the perf build cache
        id: gocache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: perf-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            perf-

      - name: build the ci runner
        # tools/ci is built once in this job and every later step runs the binary; `go run` would
        # compile it again in each step. (`go run ./tools/ci help` lists its verbs.)
        shell: bash
        run: go build -o "$RUNNER_TEMP/ci" ./tools/ci

      - name: find the perf-tagged tests
        # Writes `<import path> <run regexp>`, one line per package, to $RUNNER_TEMP/perf-runs.
        # A perf-tagged package with no test behind the tag is reported and skipped; a tree
        # with no perf-tagged test at all is red, because then this job asserts nothing
        # (`go run ./tools/ci help perf-tests`).
        shell: bash
        run: |
          "$RUNNER_TEMP/ci" perf-tests

      - name: vet the perf-tagged tests
        # `go vet` without the tag cannot see a file behind it, so the one place a perf file is
        # vetted is here: every package that holds one. Vet before test, so a perf file that
        # stopped compiling says that rather than failing as a bound.
        run: go vet -tags perf $PERF_PKGS

      - name: save the perf build cache
        # On a miss or a restore-keys fallback only; before the tests, for the reason the test
        # job gives.
        if: steps.gocache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.gocache.outputs.cache-primary-key }}

      - name: install redis-server
        # #3113: NOVA_CI fails a control that wants redis-server and cannot find it. The
        # binary is not the fleet store.
        run: bash .github/scripts/install-redis-server.sh

      - name: the wall-clock tests, one at a time
        # `-p 1 -parallel 1` because these are wall clocks: a bound in seconds measured while
        # siblings spawn git processes measures the siblings. One at a time on an otherwise
        # idle runner is the condition the numbers in timing_test.go were written against.
        #
        # `-timeout 60s`: a perf test that gets stuck fails as a TEST timeout, which names the
        # test and dumps every goroutine, before the job cap cancels it naming nothing.
        shell: bash
        run: |
          set -euo pipefail
          while read -r pkg run; do
            go test -tags perf -count=1 -v -p 1 -parallel 1 -timeout 60s -run "$run" "$pkg"
          done < "${RUNNER_TEMP}/perf-runs"

  certification-ok:
    # THE ONE CHECK THAT SAYS A RELEASE IS READY, and the reason it exists rather than a
    # list of check names in a branch ruleset. It aggregates EXACTLY the jobs of this file
    # — the certification tier — and `needs` on a matrix job is success only when EVERY leg
    # succeeded, so a leg renamed out of existence shows up here as a missing success and
    # not as silence. A red certification is a blocker for the next release, never for a
    # CL, whose gate is ci-ok in ci.yml.
    needs: [race-cache, test, smoke, release-build, release-dry-run, release-checks, perf]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: every job succeeded
        shell: bash
        run: |
          set -uo pipefail
          bad=0
          for pair in \
            "race-cache:${{ needs.race-cache.result }}" \
            "test:${{ needs.test.result }}" \
            "smoke:${{ needs.smoke.result }}" \
            "release-build:${{ needs.release-build.result }}" \
            "release-dry-run:${{ needs.release-dry-run.result }}" \
            "release-checks:${{ needs.release-checks.result }}" \
            "perf:${{ needs.perf.result }}"
          do
            job="${pair%:*}"; result="${pair##*:}"
            echo "$result	$job"
            [ "$result" = "success" ] || bad=$((bad + 1))
          done
          [ "$bad" -eq 0 ] || { echo "$bad job(s) did not succeed"; exit 1; }
