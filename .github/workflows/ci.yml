          seed() {
            tip=$(git --git-dir="$m" rev-parse --verify -q 'HEAD^{commit}') || return 1
            git init -q "$w" &&
              git -C "$w" remote add origin "${{ github.server_url }}/${{ github.repository }}" &&
              echo "$m/objects" > "$w/.git/objects/info/alternates" &&
              git -C "$w" -c advice.detachedHead=false checkout -q --detach "$tip" &&
