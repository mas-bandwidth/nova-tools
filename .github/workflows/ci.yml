# CI for nova-tools.
#
# Why this exists: until now, local `go test` on one machine was the whole
# evidence behind a release — including for four rounds of fail-open fixes in a
# check other people are told to run against their own repos. A claim that a
# released tool is tested is exactly what stops anyone checking whether it was
# tested anywhere but the releasing machine.
#
# The build/vet/test matrix runs on three operating systems on purpose: the
# executable-bit condition in `nocode` cannot fire on Windows, so only the
# extension and shebang conditions carry the check there, and that difference
# should be exercised rather than assumed.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        # gofmt -l prints unformatted files and exits 0 either way, so the exit
        # code is not the product here — the output is. Checked on one OS only:
        # formatting is a property of the source, not of the runner.
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

  smoke:
    # Exercises the BUILT BINARY against a tree with known findings. `go test`
    # covers the packages; nothing else covers the executable a user actually
    # runs, and the release being defended is a binary rather than a library.
    #
    # Not run on Windows: the dirty fixture below depends on the executable bit,
    # which that platform cannot set. The matrix above still builds and tests
    # there, so the gap is in this smoke test only, and it is here in writing
    # rather than left for a reader to infer from a missing row.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build nova-check
        run: go build -o "${{ runner.temp }}/nova-check" ./cmd/nova-check

      - name: nocode passes a clean prose tree
        shell: bash
        run: |
          tree="$(mktemp -d)"
          printf '# notes\n\nprose only.\n' > "$tree/NOTES.md"
          printf 'plain text\n' > "$tree/plain.txt"
          "${{ runner.temp }}/nova-check" nocode --dir "$tree"

      - name: nocode refuses each of its three conditions
        shell: bash
        run: |
          # One file per condition, so a pass here cannot come from one
          # condition covering for another going quietly blind.
          for case in extension exec shebang; do
            tree="$(mktemp -d)"
            printf '# notes\n' > "$tree/NOTES.md"
            case "$case" in
              extension) printf 'print(1)\n' > "$tree/tool.py" ;;
              exec)      printf 'not a script\n' > "$tree/thing"; chmod +x "$tree/thing" ;;
              shebang)   printf '#!/bin/sh\necho hi\n' > "$tree/thing" ;;
            esac
            if "${{ runner.temp }}/nova-check" nocode --dir "$tree"; then
              echo "FAIL: nocode passed a tree that violates the $case condition"
              exit 1
            fi
            echo "ok: $case refused"
          done

      - name: a guard that cannot read its own list refuses
        shell: bash
        run: |
          # --deny-ext pointed at a missing file must fail, not fall back to a
          # silent default. A gate that cannot determine what it forbids has to
          # refuse; passing here would be the exact fail-open shape this tool
          # was released to close.
          tree="$(mktemp -d)"
          printf '# notes\n' > "$tree/NOTES.md"
          if "${{ runner.temp }}/nova-check" nocode --dir "$tree" --deny-ext "@/nonexistent/list.txt"; then
            echo "FAIL: nocode passed with an unreadable deny-list"
            exit 1
          fi
          echo "ok: unreadable deny-list refused"
