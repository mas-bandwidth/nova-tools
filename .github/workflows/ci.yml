# CI for nova-tools: the CL tier.
#
# Where CI runs changed (2026-09-15). The rules, in one sentence each:
#
#   * Pull requests run ONLY on the self-hosted runners -- the Linux x64 `space`
#     box and the macOS arm64 `studio` box, four each -- in a package matrix
#     fanned out in parallel so all eight runners stay busy, never serial.
#   * The self-hosted jobs carry a fork guard (`head.repo.full_name ==
#     github.repository`): we never run fork code on our own machines.
#   * The GitHub-hosted runners (ubuntu/macos/windows) run ONLY on push to main
#     and on the nightly schedule, with the full (race) suite. Hosted compute is
#     expensive; it is not spent on branch work, because branch work is checked
#     locally and is re-checked when it merges to main.
#   * `ci-ok` stays the single required check: it aggregates the self-hosted
#     matrix on a pull request, and adds the hosted matrix on push to main.
#   * `lint` (gofmt, whole-tree build and vet) and `lisp` stay on a
#     self-hosted Linux job.
#
# See docs/TESTS.md, "Who runs CI", for the statement this file encodes.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per pull request (or branch), so a new push cancels the still-running
  # previous attempt rather than queueing behind it.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    # The self-hosted matrix's group list, READ OUT OF THE SOURCE rather than written
    # down. `go list ./...` names every package; the four packages whose tests are
    # mostly git subprocesses -- timed locally, no race detector -- get a group each so
    # no shared group serializes behind them, and the rest are spread round-robin across
    # the remaining groups. There are at most eight groups so the 4+4 self-hosted runners
    # stay busy in parallel rather than queueing in one long tail.
    runs-on: [self-hosted, linux, space]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 2
    outputs:
      groups: ${{ steps.list.outputs.groups }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # This workflow manages caching explicitly; do not probe for a missing go.sum.
          cache: false

      - id: list
        shell: bash
        run: |
          set -euo pipefail
          # SLOW is the only hand-written map, and it is a TUNING number rather than a
          # coverage one. These four packages' tests are mostly git subprocesses, so a
          # shared group would serialize behind them.
          declare -A SLOW=(
            [cmd/nova-wake]=1
            [cmd/nova-merge]=1
            [cmd/nova-swarm]=1
            [cmd/nova-bus]=1
          )

          slow=()
          rest=()
          while read -r pkg; do
            [ -n "$pkg" ] || continue
            if [ "${SLOW[$pkg]:-0}" = "1" ]; then slow+=("$pkg"); else rest+=("$pkg"); fi
          done < <(go list ./... | sed 's#^github.com/mas-bandwidth/nova-tools/##')

          NGROUPS=8
          entries=()
          g=1
          for p in "${slow[@]}"; do
            entries+=("{\"name\":\"$p\",\"packages\":\"./$p\"}")
            g=$((g + 1))
          done
          remaining=$(( NGROUPS - g + 1 ))
          if [ "$remaining" -gt 0 ]; then
            for ((i=0; i<remaining; i++)); do
              acc=()
              for ((j=i; j<${#rest[@]}; j+=remaining)); do
                acc+=("./${rest[j]}")
              done
              if [ "${#acc[@]}" -gt 0 ]; then
                entries+=("{\"name\":\"shared $((g-4))\",\"packages\":\"${acc[*]}\"}")
                g=$((g + 1))
              fi
            done
          fi

          groups=$(printf '%s\n' "${entries[@]}" | jq -s -c '.')
          echo "$groups"
          [ "$(echo "$groups" | jq 'length')" -gt 0 ] || { echo "no packages: the fan-out would be empty and green"; exit 1; }
          echo "groups=$groups" >> "$GITHUB_OUTPUT"

  lint:
    # gofmt, `go build ./...`, `go vet ./...` on one self-hosted Linux job. Formatting is a
    # property of the source, not of the platform, so gofmt is checked once; build and vet
    # run here on the whole tree (their per-package coverage is the `test` matrix below, and
    # macOS/Windows coverage is the hosted suite on main).
    runs-on: [self-hosted, linux, space]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # This workflow manages caching explicitly; do not probe for a missing go.sum.
          cache: false

      - name: gofmt
        # gofmt -l prints unformatted files and exits 0 either way, so the exit
        # code is not the product here — the output is.
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

  test:
    # The unit tests, split into the `plan` groups and run on BOTH self-hosted platforms in
    # parallel -- no race detector (that is the hosted `test-hosted` suite's `-race` run on
    # main). Each leg builds, vets and tests its own group only, so the slowest single group
    # -- not the sum -- is what a change waits on.
    name: test (${{ matrix.entry.name }}, ${{ matrix.runner[1] }})
    needs: plan
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        runner:
          - [self-hosted, linux, space]
          - [self-hosted, macos, studio]
        entry: ${{ fromJSON(needs.plan.outputs.groups) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # This workflow manages caching explicitly; do not probe for a missing go.sum.
          cache: false

      - name: build
        run: go build ${{ matrix.entry.packages }}

      - name: vet
        run: go vet ${{ matrix.entry.packages }}

      - name: test
        run: go test -count=1 ${{ matrix.entry.packages }}

  lisp:
    # THE LISP TIER, one job because it is one system. `lisp/nova-work` is the engine's own
    # tree; its acceptance suite runs under SBCL non-interactively and exits non-zero on any
    # failing case, so the exit code is the product here. It stays on self-hosted Linux.
    runs-on: [self-hosted, linux, space]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: install sbcl
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sbcl

      - name: nova-work acceptance
        run: ./lisp/nova-work/run-tests.sh

  test-hosted:
    # THE FULL HOSTED SUITE, only on push to main and the nightly schedule. GitHub-hosted
    # compute is the expensive tier, so it is not spent on branch work: a branch is checked
    # locally and re-checked here when it merges. This is the whole-tree `-race` run on all
    # three hosted platforms -- Ubuntu, macOS, Windows -- standing in for certification's
    # `test`/`build-windows` jobs at the main gate.
    name: test-hosted (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # This workflow manages caching explicitly; do not probe for a missing go.sum.
          cache: false

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

  ci-ok:
    # THE ONE CHECK TO REQUIRE, and the reason it exists rather than a list of check names
    # in a branch ruleset. It aggregates EXACTLY the jobs of this file and nothing else.
    # `needs` on a matrix job is success only when EVERY leg succeeded, so a leg renamed out
    # of existence shows up here as a missing success and not as silence.
    #
    # On a pull request it needs the self-hosted matrix (lint, lisp, test); `test-hosted`
    # is legitimately skipped there. On push to main (and the schedule) it needs the hosted
    # matrix too.
    needs: [lint, test, lisp, test-hosted]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: every CL-tier job succeeded
        shell: bash
        run: |
          set -uo pipefail
          bad=0
          for pair in \
            "lint:${{ needs.lint.result }}" \
            "test:${{ needs.test.result }}" \
            "lisp:${{ needs.lisp.result }}" \
            "test-hosted:${{ needs.test-hosted.result }}"
          do
            job="${pair%:*}"; result="${pair##*:}"
            echo "$result	$job"
            case "$result" in
              success) ;;
              skipped) [ "$job" = "test-hosted" ] || bad=$((bad + 1)) ;;
              *) bad=$((bad + 1)) ;;
            esac
          done
          [ "$bad" -eq 0 ] || { echo "$bad job(s) did not succeed"; exit 1; }
