# CI for nova-tools: gofmt, vet, the unit tier, the functional tier and TLC.
# Each job runs one plain command; AGENTS.md lists the same commands to run
# by hand. Pull requests run on the self-hosted runners, and only for branches
# of this repository: a fork's code never runs on them.

name: ci

on:
  push:
    branches: [main, 'sprint/**']
  pull_request:
  merge_group:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  NOVA_TEST_NO_HOST: "1"

jobs:
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, bench]
    timeout-minutes: 10
    steps:
      - &clean
        name: clean the reused workspace
        shell: bash
        run: |
          [ -d "${GITHUB_WORKSPACE:?}/.git" ] || exit 0
          git -C "$GITHUB_WORKSPACE" reset -q --hard && git -C "$GITHUB_WORKSPACE" clean -ffdxq ||
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
      - &checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - &go
        name: use the installed Go toolchain
        shell: bash
        run: |
          want=go$(sed -n 's/^go \([0-9.]*\)$/\1/p' go.mod)
          newest=$(ls -d "$HOME"/sdk/go*/bin 2>/dev/null | sort -V | tail -1 || true)
          onpath=$(dirname "$(command -v go 2>/dev/null || echo /none/go)")
          for d in "$HOME/sdk/$want/bin" "$newest" "$HOME/go/bin" /usr/local/go/bin /opt/homebrew/bin "$onpath"; do
            [ -n "$d" ] && [ -x "$d/go" ] && { echo "$d" >> "$GITHUB_PATH"; "$d/go" version; exit 0; }
          done
          echo "no Go toolchain on this runner" >&2; exit 1
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: vet tagged test files
        run: go vet -tags functional,slow ./...
      - name: vet for Windows
        run: GOOS=windows go vet ./...

  unit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: x64, group: bench }
          - { os: macOS, arch: ARM64, group: mini-m5 }
    runs-on: [self-hosted, "${{ matrix.os }}", "${{ matrix.arch }}", "${{ matrix.group }}"]
    timeout-minutes: 20
    steps:
      - *clean
      - *checkout
      - *go
      - name: unit tests
        run: go test -p 4 ./...

  functional:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, bench]
    timeout-minutes: 30
    steps:
      - *clean
      - *checkout
      - *go
      - name: redis-server, postgres, sops and age on PATH
        shell: bash
        run: |
          [ -d "$HOME/.local/bin" ] && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          need=()
          command -v redis-server >/dev/null || need+=(redis-server)
          command -v postgres >/dev/null || ls /usr/lib/postgresql/*/bin/postgres >/dev/null 2>&1 || need+=(postgresql)
          [ ${#need[@]} -eq 0 ] || { sudo -n apt-get update -qq && sudo -n apt-get install -y -qq "${need[@]}"; }
          for d in /usr/lib/postgresql/*/bin; do [ -x "$d/postgres" ] && echo "$d" >> "$GITHUB_PATH"; done
          true
      - name: functional tests
        env:
          NOVA_CONTRACT_STRICT: "1" # a missing dependency fails the fault contract rows instead of skipping them
        run: go test -p 4 -tags functional,slow ./...

  tlc:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 60
    steps:
      - *clean
      - *checkout
      - name: TLC over every model case
        run: tests/tla/check.sh "${{ vars.TLC_JAR }}"

  fleet:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, bench]
    timeout-minutes: 5
    steps:
      - *clean
      - *checkout
      - name: ansible-core in a fresh venv, and the collections
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/ansible"
          "$RUNNER_TEMP/ansible/bin/pip" install --quiet ansible-core
          "$RUNNER_TEMP/ansible/bin/ansible-galaxy" collection install -r fleet/requirements.yml
      - name: syntax-check every play
        shell: bash
        run: |
          export PATH="$RUNNER_TEMP/ansible/bin:$PATH"
          for play in fleet/*.yml; do
            [ "$play" = fleet/requirements.yml ] && continue
            ansible-playbook -i fleet/ci/inventory --syntax-check "$play"
          done
      - name: services.yml --check against the stub inventory
        shell: bash
        run: |
          export PATH="$RUNNER_TEMP/ansible/bin:$PATH"
          ansible-playbook -i fleet/ci/inventory fleet/services.yml --check --diff </dev/null

  ci-ok:
    if: always()
    needs: [lint, unit, functional, tlc, fleet]
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: every job succeeded
        shell: bash
        run: |
          case "${{ join(needs.*.result, ' ') }}" in
            *failure*|*cancelled*|*skipped*) echo "a job did not succeed: ${{ join(needs.*.result, ' ') }}" >&2; exit 1 ;;
          esac
