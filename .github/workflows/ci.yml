    # is the engine's own tree (docs/SPEC-WORK.md:290 fixes the language); its
    # acceptance suite runs under SBCL non-interactively and exits non-zero on
    # any failing case, so the exit code is the product here. It is in the CL
    # tier, but no longer inside two minutes: the 579-case suite alone takes
    # 62-110 s, and the cap is lispCeiling in internal/ci/ci_budget_test.go.
    # It runs on the Linux space runners because a failure that is really
    # about SBCL or the platform (journal fsync differs between Darwin and
    # Linux) must be caught somewhere that is not just Linux — but the macOS
    # leg does not come back as darwin-x64 (nova-tools#3634 moved it off the
    # Studio onto the Intel Macs batman/superman, 47992e058, and every run
    # since has failed there: TestE02F06PinCommonLispImplementationGo
    # requires the platform to be in the pinned table, docs/SPEC-WORK.md:312-321,
    # which is darwin-arm64 and linux-x64 only — darwin-x64 is not pinned and
    # per Glenn stays unpinned — and a-flooding-resolver-is-refused-and-its-
    # output-is-never-drained's 3 s bound is missed on a loaded Intel iMac).
