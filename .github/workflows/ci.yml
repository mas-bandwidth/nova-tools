# CI for nova-tools: the CL tier.
#
# Why this exists: until now, local `go test` on one machine was the whole
# evidence behind a release — including for four rounds of fail-open fixes in a
# check other people are told to run against their own repos. A claim that a
# released tool is tested is exactly what stops anyone checking whether it was
# tested anywhere but the releasing machine.
#
# This file is the FAST TIER: the checks a change is required to pass in two
# minutes, ideally one. It runs gofmt, build, vet, and the unit tests sharded
# across parallel jobs, without the race detector. Everything that cannot fit
# that budget — the whole-tree `-race` run, Windows build/vet and per-package
# tests, the three-OS smoke, the release dry-run, and the nightly perf wall
# clock — lives in .github/workflows/certification.yml, under the same job
# names, so a red certification is a blocker for the next release and never for
# a CL. Nothing is deleted by splitting; the slow tier still runs every test.
#
# The race detector is the one trade-off that matters to name: it stays, in the
# certification tier's `test` and `test-windows` jobs. The CL tier's sharded
# tests are the same tests without `-race`, so a data race on a CL is caught by
# certification rather than by the CL itself. That is the budget, not a skip.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  lint:
    # gofmt, `go build ./...`, `go vet ./...` on one runner. Formatting is a
    # property of the source, not of the platform, so gofmt is checked once;
    # build and vet run here on Linux, and their macOS/Windows coverage is the
    # certification tier's `test` and `build-windows` jobs.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: cache go build and module cache
        # go.mod carries no dependencies today, so the module cache is nearly
        # empty; the build cache is what pays for itself across the shards
        # below, which compile the same tree.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: gofmt
        # gofmt -l prints unformatted files and exits 0 either way, so the exit
        # code is not the product here — the output is.
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

  test-packages:
    # The list the CL tier's test shards run on, READ OUT OF THE SOURCE rather
    # than written down. It is `go list` filtered to packages that have tests,
    # printed as JSON for the matrix below.
    #
    # This job exists so that there is no second list to keep in step with the
    # certification tier's. The four slow packages -- timed locally with
    # `go test -count=1` and no race detector -- get a runner each, and the rest
    # are spread across shared shards. A package added tomorrow lands in a shard
    # the moment it has a test file.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - id: list
        shell: bash
        run: |
          set -euo pipefail
          # SLOW is the only hand-written map here, and it is a TUNING number rather than a
          # coverage one: a package absent from it runs in a shared shard, which costs speed
          # and never coverage. These four were timed locally with `go test -count=1` and no
          # race detector (see RESULT.md of the change that split the tiers):
          # cmd/nova-wake 62s, cmd/nova-merge 39s, cmd/nova-swarm 38s, cmd/nova-bus 36s.
          # They are the packages whose tests are mostly git subprocesses, so a shared shard
          # would serialize behind them.
          declare -A SLOW=(
            [cmd/nova-wake]=1
            [cmd/nova-merge]=1
            [cmd/nova-swarm]=1
            [cmd/nova-bus]=1
          )
          # The remaining packages are spread across this many shared shards. `go test` runs
          # a shard's packages in parallel, so a shard costs its slowest package, not their
          # sum. Also a tuning number.
          REST_SHARDS=2

          slow=()
          rest=()
          while read -r pkg; do
            [ -n "$pkg" ] || continue
            short=${pkg#github.com/mas-bandwidth/nova-tools/}
            if [ "${SLOW[$short]:-0}" = "1" ]; then slow+=("$short"); else rest+=("$short"); fi
          done < <(go list -f '{{if or .TestGoFiles .XTestGoFiles}}{{.ImportPath}}{{end}}' ./...)

          entries=()
          for pkg in "${slow[@]}"; do
            entries+=("{\"name\":\"$pkg\",\"packages\":\"./$pkg\"}")
          done
          for ((g=1; g<=REST_SHARDS; g++)); do
            pkgs=()
            for ((i=g-1; i<${#rest[@]}; i+=REST_SHARDS)); do
              pkgs+=("./${rest[i]}")
            done
            if [ "${#pkgs[@]}" -gt 0 ]; then
              joined=$(printf '%s ' "${pkgs[@]}")
              entries+=("{\"name\":\"rest $g/$REST_SHARDS\",\"packages\":\"${joined% }\"}")
            fi
          done

          packages=$(printf '%s\n' "${entries[@]}" | jq -s -c '.')
          echo "$packages"
          [ "$(echo "$packages" | jq 'length')" -gt 0 ] || { echo "no packages with tests: the fan-out would be empty and green"; exit 1; }
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  test:
    # THE UNIT TESTS, SHARDED, no race detector. The whole-tree `-race` run is the
    # certification tier's `test` job; these are the same tests split across runners so the
    # slowest single shard — not the sum — is what a change waits on.
    name: test (${{ matrix.entry.name }})
    needs: test-packages
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.test-packages.outputs.packages) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: cache go build and module cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: test
        run: go test -count=1 ${{ matrix.entry.packages }}

  ci-ok:
    # THE ONE CHECK TO REQUIRE, and the reason it exists rather than a list of check names
    # in a branch ruleset. It aggregates EXACTLY the jobs of this file and nothing else —
    # the CL tier: what a change is required to pass in two minutes, ideally one. `needs`
    # on a matrix job is success only when EVERY leg succeeded, so a leg renamed out of
    # existence shows up here as a missing success and not as silence. The certification
    # tier has its own aggregate, certification-ok; a red certification is a blocker for
    # the next release, never for a CL.
    needs: [lint, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: every CL-tier job succeeded
        shell: bash
        run: |
          set -uo pipefail
          bad=0
          for pair in \
            "lint:${{ needs.lint.result }}" \
            "test:${{ needs.test.result }}"
          do
            job="${pair%:*}"; result="${pair##*:}"
            echo "$result	$job"
            [ "$result" = "success" ] || bad=$((bad + 1))
          done
          [ "$bad" -eq 0 ] || { echo "$bad job(s) did not succeed"; exit 1; }
