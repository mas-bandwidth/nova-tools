# CI for nova-tools: the CL tier.
#
# Why this exists: until now, local `go test` on one machine was the whole
# evidence behind a release — including for four rounds of fail-open fixes in a
# check other people are told to run against their own repos. A claim that a
# released tool is tested is exactly what stops anyone checking whether it was
# tested anywhere but the releasing machine.
#
# This file is the FAST TIER: the checks a change is required to pass in two
# minutes, ideally one. It runs gofmt, build, vet, and the unit tests sharded
# across parallel jobs, without the race detector — with ONE exception,
# test-race-queue below. Everything that cannot fit
# that budget — the whole-tree `-race` run, Windows build/vet and per-package
# tests, the three-OS smoke, the release dry-run, and the nightly perf wall
# clock — lives in .github/workflows/certification.yml, under the same job
# names, so a red certification is a blocker for the next release and never for
# a CL. Nothing is deleted by splitting; the slow tier still runs every test.
#
# WHERE THINGS RUN. Pull requests run on the self-hosted runners ONLY: a
# per-package matrix — ./cmd/<tool> and ./internal/... dealt into twelve
# shards on the four Linux space runners and four on the Intel macOS runners
# (batman, superman: self-hosted,macOS,X64; the Studio left CI 2026-09-24,
# nova-tools#3634) — fanned out in parallel, fail-fast off, so a change's feedback path is a
# fan-out over the 4+4 machines and never a serial queue, and never
# GitHub-hosted compute. The GitHub-hosted runners (ubuntu-latest, macos-latest)
# run only on push to main and on the nightly schedule, with the full suite.
# There is ONE exception, for the one platform the self-hosted runners cannot
# see: test-hosted-pr runs internal/sandbox on ubuntu-latest when the sandbox or
# a *_linux.go moves, because the sandbox is darwin-only in the self-hosted
# matrix. Every self-hosted job is guarded by the head-repo check, so a
# pull_request from a fork skips CI rather than running untrusted code on our
# machines.
#
# NO NATIVE WINDOWS LEG, since 2026-09-18. Glenn's ruling: "drop the native
# windows CI runners. WSL only from now on." Every windows-latest leg this file
# carried — test-windows-pr's four shards, test-hosted-merge's windows leg and
# test-hosted's windows entry — is gone, and so are the measured Windows size
# table and the Windows per-package ceiling that fed them. What stays is ONE
# cheap compile guard in the lint job: `make vet-windows`
# (`GOOS=windows go vet ./...`), which type-checks the whole tree for Windows on
# a Linux runner in seconds and needs no Windows machine at all. It is the same
# step the merge gate already runs (nova-merge's `vet-windows`), so a
# GOOS=windows compile break is refused twice before it can land. The four class
# tests that held the old legs shut are PARKED in docs/SPEC-CI.md, rules kept for
# the record. Windows as a place for a bench is the Threadripper under WSL2,
# which is a LINUX bench with Linux runners: see docs/BENCH-STANDARD-WINDOWS.md.
#
# The race detector is the one trade-off that matters to name: it stays, in the
# certification tier's `test` and `test-windows` jobs. The CL tier's sharded
# tests are the same tests without `-race`, so a data race on a CL is caught by
# certification rather than by the CL itself. That is the budget, not a skip.
# THE ONE EXCEPTION is test-race-queue below: the queue and lease package
# (internal/redisq) runs under `-race` as a required check on every CL event.
# Its tests are the concurrent shape a data race hides in — 200 admissions
# through one Lua script, a card pulled by one bench and reclaimed by another —
# and a data race seeded there is invisible to the no-race shards (measured
# 2026-09-22: a seeded increment in Queue.Admit passed `make test` green), while
# the -race detector names it at once. Waiting a day for certification to name
# it is not the budget for the one package the merge gate lands cards through;
# one small -race leg on the CL path is.

name: ci

on:
  push:
    # dev is the integration branch (Glenn 2026-09-16): every merge lands there and the
    # push run, hosted legs included, is the evidence a promotion to main waits for.
    # THE SAME BRANCHES as the concurrency list below, and the one place that
    # cannot read it: `on:` takes no expressions. internal/ci's
    # TestIntegrationBranchesAreOneList holds the two spellings equal.
    branches: [main, dev]
  pull_request:
  # merge_group: the merge queue builds a group commit of the PRs about to land and
  # runs this workflow on it; ci-ok on the group is the merge gate, so every PR is
  # proved against the main it actually lands on (2026-09-16: with the up-to-date
  # rule and no queue, every merge invalidated every other PR's evidence).
  merge_group:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      bench:
        description: "fleet-probe: bench label to prove (hulk, vision, mini); empty runs no probe"
        required: false
        default: ""
      slots:
        description: "fleet-probe: parallel jobs, one per runner slot"
        required: false
        default: "0"

permissions:
  contents: read

env:
  # #3113: nova-sprint controls that need redis-server fail instead of skipping.
  # The install step puts the binary on PATH; a green run executed the store.
  NOVA_CI: "1"

concurrency:
  # THE INTEGRATION BRANCHES ARE ONE LIST, and this `fromJSON` is it. Adding a
  # branch is this edit; internal/ci's TestIntegrationBranchesAreOneList fails
  # on any other copy of the names, and names the two spellings GitHub will not
  # let read the list (the `on: push: branches:` lines here and in
  # certification.yml, which take no expression at all). The list cannot be a
  # workflow-level `env:` either: `concurrency` is the one key whose
  # expressions cannot see the env context — github, inputs and vars only — so
  # it lives here, where every other rule can be made to do without it.
  #
  # A pending run is evicted by a newly queued run in the same group before it
  # ever starts. So a push to an integration branch keys on the commit SHA: no
  # two of its runs share a group, so none can evict or cancel another, and the
  # mechanical red gate always has a completed run to read (2026-09-16 04:41Z
  # and 04:53Z on main; 16:35Z on dev, whose rerun was cancelled by the next
  # merge and read as red, freezing the bench — row 8 of #828, and the reason
  # the branch names are not written twice any more). A PR keys on its number so
  # its newest head supersedes older runs; every other branch keys on its ref.
  group: ci-${{ github.event.pull_request.number || (contains(fromJSON('["refs/heads/main","refs/heads/dev"]'), github.ref) && github.sha) || github.ref }}-${{ github.event_name }}-${{ inputs.bench }}
  # A CONSTANT, not the second copy of the branch list it used to be. The
  # sha-keyed group above is what protects an integration branch's verdict: its
  # group holds that one run and nothing else, so there is never a sibling for
  # cancel-in-progress to cancel. Everywhere else — a PR's newest head, a
  # branch push — only the newest run matters, which is what true means.
  cancel-in-progress: true

jobs:
  lint:
    # gofmt, `go build ./...`, `go vet ./...` and the Windows cross-vet on one
    # runner. Formatting is a property of the source, not of the platform, so
    # gofmt is checked once; build and vet run here on Linux, and their macOS
    # coverage is the certification tier's `test` job. On a pull_request this is
    # a self-hosted Linux job, guarded so fork code never runs here.
    #
    # THE WINDOWS COMPILE GUARD LIVES HERE, and since 2026-09-18 it is the only
    # Windows this file runs (Glenn: "drop the native windows CI runners. WSL
    # only from now on."). `make vet-windows` is `GOOS=windows go vet ./...`: it
    # builds the Windows standard library into this runner's cache once and then
    # type-checks every package and every _test.go for Windows, on Linux, in
    # seconds. It catches the class that a cross-platform Go tree actually
    # breaks — a *_windows.go that stopped compiling, a syscall used without a
    # build tag, a fixture path literal in a Windows-only file — without a
    # windows-latest minute. What it cannot catch is RUNTIME behaviour, and that
    # is the deliberate trade: the certification tier still runs the real
    # Windows suite, and nothing on the CL path waits for it.
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, space]
    timeout-minutes: 2
    steps:
      - name: remove stale build dirs from the shared runner
        # The self-hosted runners reuse the _work directory across jobs; a tree left
        # by an aborted or overlapping run makes checkout fail. Start from clean.
        # The sweep below is `rm -rf` over whatever the workspace holds, so it only
        # ever runs on a directory this repository has checked out: an empty
        # variable is refused, a workspace that does not exist yet is the normal
        # first-run state (#1751), and a workspace with no `.git` is not ours to
        # empty — actions/checkout clears a non-repository workspace itself.
        shell: bash
        run: |
          [ -n "${GITHUB_WORKSPACE}" ] || exit 1
          [ -d "${GITHUB_WORKSPACE}" ] || exit 0
          [ -d "${GITHUB_WORKSPACE}/.git" ] || exit 0
          # Clean in place, keep the tree (Glenn 2026-09-26 10:20 AM ET, fs_usage
          # on the Studio: four `find ... rm -rf` sweeps and the re-seeds behind
          # them were the file-event storm fseventsd digested at 100% CPU;
          # "lots of tiny files is a really slow way to work"). A checkout of
          # ours is reset to its HEAD and every untracked or ignored file is
          # removed: the same hygiene as emptying it, a few hundred operations
          # instead of a hundred thousand, and the next checkout fetches only
          # the new commit. A tree git cannot reset is emptied as before.
          if git -C "${GITHUB_WORKSPACE}" reset -q --hard && git -C "${GITHUB_WORKSPACE}" clean -ffdxq; then
            echo "workspace cleaned in place: $(git -C "${GITHUB_WORKSPACE}" rev-parse --short HEAD 2>/dev/null || echo '-')"
            exit 0
          fi
          find "${GITHUB_WORKSPACE}" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} + 2>/dev/null || true

      - name: borrow objects from the bench mirror
        # THE CHECKOUT FETCH WAS THE HANG. Every self-hosted job empties its
        # workspace above, so actions/checkout fetched the whole commit from
        # GitHub (11 MB at --depth=1) on every job, and on the house benches
        # that fetch stalled: 17 of the cancelled jobs in the last 25 PR runs
        # (2026-09-23 02:00Z) died at `git fetch --depth=1 origin +<merge
        # sha>` at the two-minute job cap (hulk 9, vision 5, studio 3, #2795),
        # the same stall that failed 566 staged cards (#2882). Every bench
        # already keeps $HOME/nova-bench/mirror/nova-tools.git fresh, so the
        # workspace borrows its objects (objects/info/alternates) and starts
        # detached at the mirror's HEAD: the fetch then carries only what the
        # mirror lacks. Measured on hulk: 11 MB and 3.1 s -> 24 KB and 1.1 s.
        # actions/checkout keeps a workspace whose origin URL matches and whose
        # HEAD is a commit (it cleans and resets it, both no-ops here), so the
        # checkout step itself is unchanged.
        # A bench with no mirror, or a workspace that is not empty, is left to
        # actions/checkout exactly as before, and this step never fails a job.
        shell: bash
        run: |
          m="$HOME/nova-bench/mirror/nova-tools.git"
          w="${GITHUB_WORKSPACE:?}"
          [ -d "$m/objects" ] || { echo "no bench mirror at $m: checkout fetches from GitHub"; exit 0; }
          mkdir -p "$w"
          [ -z "$(ls -A "$w")" ] || { echo "workspace not empty: left to actions/checkout"; exit 0; }
          seed() {
            tip=$(git --git-dir="$m" rev-parse --verify -q 'HEAD^{commit}') || return 1
            git init -q "$w" &&
              git -C "$w" remote add origin "${{ github.server_url }}/${{ github.repository }}" &&
              echo "$m/objects" > "$w/.git/objects/info/alternates" &&
              git -C "$w" -c advice.detachedHead=false checkout -q --detach "$tip" &&
              echo "workspace borrows $m, detached at its HEAD $tip"
          }
          seed || { echo "seeding from $m failed: left to actions/checkout"; rm -rf -- "$w/.git"; }

      # RESILIENT CHECKOUT (ideas #793): a transient first-fetch failure must
      # not redden a job. Attempt one tolerates its own failure ONLY so the
      # retry below runs; the retry itself is not tolerated, so a checkout
      # that fails twice still fails the job: fail-closed, not fail-open.
      - name: checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: checkout retry
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: use the installed Go toolchain
        # The self-hosted runners carry Go (1.26 at /usr/bin/go on Linux, under
        # /opt/homebrew or ~/go on macOS). Prefer it over a setup-go download.
        shell: bash
        run: |
          set -euo pipefail
          # the bench's own Go wins over a distro Go on the system path (hulk: /usr/bin/go 1.22
          # shadowed ~/go/bin 1.26.5 and every PR job died downloading a toolchain, 2026-09-17)
          # newest Go under ~/sdk first (the Mac benches: batman and superman keep 1.27 there, and
          # batman also carries a stale root-owned /usr/local/go 1.22 that won this loop, 2026-09-18)
          # the toolchain go.mod names wins when ~/sdk holds it (#4080: space's runner took the newest sdk Go
          # while the release build beside it switched toolchains in the same caches): the toolchain line,
          # else the go line, which is the toolchain a go.mod without that line implies; else as before
          want=$(sed -n 's/^toolchain \(go[0-9][0-9a-z.]*\)$/\1/p' go.mod 2>/dev/null | head -1 || true)
          [ -n "$want" ] || want=$(sed -n 's/^go \([0-9][0-9a-z.]*\)$/go\1/p' go.mod 2>/dev/null | head -1 || true)
          sdk=
          if [ -n "$want" ] && [ -x "$HOME/sdk/$want/bin/go" ]; then sdk="$HOME/sdk/$want/bin"; fi
          [ -n "$sdk" ] || sdk=$(ls -d "$HOME"/sdk/go*/bin 2>/dev/null | sort -V | tail -1 || true) # empty on the Linux benches; under pipefail the failed ls would abort the step
          for d in "$sdk" "$HOME/go/bin" /usr/local/go/bin /opt/homebrew/bin; do
            [ -n "$d" ] && [ -x "$d/go" ] && { echo "$d" >> "$GITHUB_PATH"; export PATH="$d:$PATH"; break; }
          done
          command -v go >/dev/null 2>&1 || { echo "no Go toolchain on PATH"; exit 1; }
          go version
          echo "GO SETUP want=${want:-none} go=$(command -v go) gomodcache=$(go env GOMODCACHE) gocache=$(go env GOCACHE)"

      - name: cache go build and module cache
        if: runner.environment == 'github-hosted'
        # Only on GitHub-hosted runners. A self-hosted runner is PERSISTENT: its Go build cache is
        # already on disk, and this step's save phase tars the whole multi-GB cache on every job,
        # outlives the job's timeout, and is orphaned still compressing (82 of them put the Studio
        # at load 147 on 2026-09-17). internal/ci holds the class test.
        # go.mod carries no dependencies today, so the module cache is nearly
        # empty; the build cache is what pays for itself across the shards
        # below, which compile the same tree.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: roadmap parity
        # ROADMAP.md states progress; docs/roadmaps/nova-work.sexp holds the data.
        # The class test runs first so a broken check cannot pass the page.
        shell: bash
        run: |
          bash tools/roadmap-parity_test.sh
          bash tools/roadmap-parity.sh

      - name: gofmt
        # gofmt -l prints unformatted files and exits 0 either way, so the exit
        # code is not the product here — the output is.
        shell: bash
        run: make fmt

      - name: build
        run: make build

      - name: vet
        run: make vet

      - name: vet-functional
        # nova-tools #4328: the redis-backed tests are behind `//go:build
        # functional` and a pull request does not run them, but every change
        # still COMPILES them here, once for the whole tree, so a PR that
        # breaks one is red now rather than at the stream's landing.
        run: make vet-functional

      - name: vet-laws
        # tools/analyzers/cmd/vetlaw as a go vet -vettool= analyzer over
        # ./cmd/..., enforcing verb laws #2573 (exit-zero-with-zero-bytes),
        # #2575 (help-answers-refused) and #2583 (task-text-in-argv). Its own
        # step, not folded into `vet`, because this job is the only one that
        # runs `make vet` unsharded and un-PKGS-scoped (nova-tools #2724).
        run: make vet-laws

      - name: vet-windows
        # `GOOS=windows go vet ./...`, the one Windows guard on the CL path.
        # It is last in this job on purpose: it is the only step that has to
        # build a second standard library, so a plain Linux break is reported
        # before this one starts paying for it.
        run: make vet-windows

  test-packages:
    # The list the CL tier's test shards run on, READ OUT OF THE SOURCE rather
    # than written down: ./cmd/* and ./internal/... dealt round-robin into
    # twelve shards on the Linux space runners and four on the macOS darwin-x64
    # runners (batman, superman; off the Studio since nova-tools#3634). The split is a measurement: the Studio also carried the swarm,
    # and at 02:48Z 2026-09-16 its legs waited forty minutes for a runner while
    # the space legs took two, so weight moved off it — 8/4 with eight space runners since 03:10Z, not 8/8. A
    # package that builds on both platforms runs once per OS; the darwin-only
    # packages run on the darwin-x64 shards only. On pull_request and merge_group it
    # selects only the packages the change touches and their in-module
    # importers; the push to dev and the nightly run keep the whole tree.
    if: vars.NOVA_CI_CARDS != 'on' && (github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: [self-hosted, linux, x64, space]
    timeout-minutes: 2
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - name: remove stale build dirs from the shared runner
        # The self-hosted runners reuse the _work directory across jobs; a tree left
        # by an aborted or overlapping run makes checkout fail. Start from clean.
        # The sweep below is `rm -rf` over whatever the workspace holds, so it only
        # ever runs on a directory this repository has checked out: an empty
        # variable is refused, a workspace that does not exist yet is the normal
        # first-run state (#1751), and a workspace with no `.git` is not ours to
        # empty — actions/checkout clears a non-repository workspace itself.
        shell: bash
        run: |
          [ -n "${GITHUB_WORKSPACE}" ] || exit 1
          [ -d "${GITHUB_WORKSPACE}" ] || exit 0
          [ -d "${GITHUB_WORKSPACE}/.git" ] || exit 0
          # Clean in place, keep the tree (Glenn 2026-09-26 10:20 AM ET, fs_usage
          # on the Studio: four `find ... rm -rf` sweeps and the re-seeds behind
          # them were the file-event storm fseventsd digested at 100% CPU;
          # "lots of tiny files is a really slow way to work"). A checkout of
          # ours is reset to its HEAD and every untracked or ignored file is
          # removed: the same hygiene as emptying it, a few hundred operations
          # instead of a hundred thousand, and the next checkout fetches only
          # the new commit. A tree git cannot reset is emptied as before.
          if git -C "${GITHUB_WORKSPACE}" reset -q --hard && git -C "${GITHUB_WORKSPACE}" clean -ffdxq; then
            echo "workspace cleaned in place: $(git -C "${GITHUB_WORKSPACE}" rev-parse --short HEAD 2>/dev/null || echo '-')"
            exit 0
          fi
          find "${GITHUB_WORKSPACE}" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} + 2>/dev/null || true

      - name: borrow objects from the bench mirror
        # THE CHECKOUT FETCH WAS THE HANG. Every self-hosted job empties its
        # workspace above, so actions/checkout fetched the whole commit from
        # GitHub (11 MB at --depth=1) on every job, and on the house benches
        # that fetch stalled: 17 of the cancelled jobs in the last 25 PR runs
        # (2026-09-23 02:00Z) died at `git fetch --depth=1 origin +<merge
        # sha>` at the two-minute job cap (hulk 9, vision 5, studio 3, #2795),
        # the same stall that failed 566 staged cards (#2882). Every bench
        # already keeps $HOME/nova-bench/mirror/nova-tools.git fresh, so the
        # workspace borrows its objects (objects/info/alternates) and starts
        # detached at the mirror's HEAD: the fetch then carries only what the
        # mirror lacks. Measured on hulk: 11 MB and 3.1 s -> 24 KB and 1.1 s.
        # actions/checkout keeps a workspace whose origin URL matches and whose
        # HEAD is a commit (it cleans and resets it, both no-ops here), so the
        # checkout step itself is unchanged.
        # A bench with no mirror, or a workspace that is not empty, is left to
        # actions/checkout exactly as before, and this step never fails a job.
        shell: bash
        run: |
          m="$HOME/nova-bench/mirror/nova-tools.git"
          w="${GITHUB_WORKSPACE:?}"
          [ -d "$m/objects" ] || { echo "no bench mirror at $m: checkout fetches from GitHub"; exit 0; }
          mkdir -p "$w"
          [ -z "$(ls -A "$w")" ] || { echo "workspace not empty: left to actions/checkout"; exit 0; }
          seed() {
            tip=$(git --git-dir="$m" rev-parse --verify -q 'HEAD^{commit}') || return 1
            git init -q "$w" &&
              git -C "$w" remote add origin "${{ github.server_url }}/${{ github.repository }}" &&
              echo "$m/objects" > "$w/.git/objects/info/alternates" &&
              git -C "$w" -c advice.detachedHead=false checkout -q --detach "$tip" &&
              echo "workspace borrows $m, detached at its HEAD $tip"
          }
          seed || { echo "seeding from $m failed: left to actions/checkout"; rm -rf -- "$w/.git"; }

      # RESILIENT CHECKOUT (ideas #793): a transient first-fetch failure must
      # not redden a job. Attempt one tolerates its own failure ONLY so the
      # retry below runs; the retry itself is not tolerated, so a checkout
      # that fails twice still fails the job: fail-closed, not fail-open.
      - name: checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: checkout retry
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: use the installed Go toolchain
        # The self-hosted runners carry Go (1.26 at /usr/bin/go on Linux, under
        # /opt/homebrew or ~/go on macOS). Prefer it over a setup-go download.
        shell: bash
        run: |
          set -euo pipefail
          # the bench's own Go wins over a distro Go on the system path (hulk: /usr/bin/go 1.22
          # shadowed ~/go/bin 1.26.5 and every PR job died downloading a toolchain, 2026-09-17)
          # newest Go under ~/sdk first (the Mac benches: batman and superman keep 1.27 there, and
          # batman also carries a stale root-owned /usr/local/go 1.22 that won this loop, 2026-09-18)
          # the toolchain go.mod names wins when ~/sdk holds it (#4080: space's runner took the newest sdk Go
          # while the release build beside it switched toolchains in the same caches): the toolchain line,
          # else the go line, which is the toolchain a go.mod without that line implies; else as before
          want=$(sed -n 's/^toolchain \(go[0-9][0-9a-z.]*\)$/\1/p' go.mod 2>/dev/null | head -1 || true)
          [ -n "$want" ] || want=$(sed -n 's/^go \([0-9][0-9a-z.]*\)$/go\1/p' go.mod 2>/dev/null | head -1 || true)
          sdk=
          if [ -n "$want" ] && [ -x "$HOME/sdk/$want/bin/go" ]; then sdk="$HOME/sdk/$want/bin"; fi
          [ -n "$sdk" ] || sdk=$(ls -d "$HOME"/sdk/go*/bin 2>/dev/null | sort -V | tail -1 || true) # empty on the Linux benches; under pipefail the failed ls would abort the step
          for d in "$sdk" "$HOME/go/bin" /usr/local/go/bin /opt/homebrew/bin; do
            [ -n "$d" ] && [ -x "$d/go" ] && { echo "$d" >> "$GITHUB_PATH"; export PATH="$d:$PATH"; break; }
          done
          command -v go >/dev/null 2>&1 || { echo "no Go toolchain on PATH"; exit 1; }
          go version
          echo "GO SETUP want=${want:-none} go=$(command -v go) gomodcache=$(go env GOMODCACHE) gocache=$(go env GOCACHE)"

      - id: list
        shell: bash
        run: |
          set -euo pipefail
          # Runner labels are carried as single-string fields (os/arch/group), not
          # as a label array: a runs-on expression must resolve to a string, so the
          # test job composes its label list per leg.

          # EIGHT on space, FOUR on the darwin-x64 Macs (batman, superman; the Studio
          # left CI 2026-09-24, nova-tools#3634), and the split is a measurement,
          # not a preference. The Studio also carries the swarm, and at 02:48Z
          # 2026-09-16 its legs waited forty minutes for a runner while the space
          # legs finished in two: eight and eight was the wrong shape once the two
          # fleets were no longer symmetric. ./cmd/* and ./internal/... go into one
          # list; the packages that build on both platforms are dealt round-robin
          # into 8 space shards and 4 darwin-x64 shards, so each is covered exactly
          # once per OS; the darwin-only packages — cmd/nova-sandbox and
          # internal/sandbox, whose sandbox backend is macOS-only today
          # (docs/USAGE.md) — go to the darwin-x64 shards only. A leg per package
          # instead reads like more parallelism and is not: 38 packages is 76 legs
          # queueing on 8 machines, a serial queue wearing a matrix's clothes,
          # measured at over eleven minutes in run 35018437149 for a tier whose
          # budget is two.
          SPACE_SHARDS=8
          STUDIO_SHARDS=8 # push to dev: ONE wave on eight of the 24 darwin-x64 runners (batman 10, superman 14; the Studio left CI 2026-09-24, nova-tools#3634); was on the eight studio runners, each shard under the test job's 20-minute push cap; 2026-09-24 run 35950929169 (attempt 2, Studio load 3.5, 16 runners registered) ran all sixteen shards at once and every one was cancelled at the 12-minute cap, 1/16 still testing at 12:06 after 6,252 passes in 75 packages (139 test binaries built under 16-way contention), while 1/8 space finished its 14 packages in under two minutes; was 16 (two waves on eight runners, each inside the old 6-minute cap)
          darwin_only=("./cmd/nova-sandbox" "./internal/sandbox")

          is_darwin_only() {
            local p="$1" d
            for d in "${darwin_only[@]}"; do
              [ "$p" = "$d" ] && return 0
            done
            return 1
          }

          # THE FAN-OUT TESTS WHAT THE CHANGE TOUCHED. Measured 15:56Z
          # 2026-09-16: eight PRs opened in twelve minutes, each fanning 16
          # studio shards over the whole tree onto 8 studio runners, put 128
          # studio legs in the queue and held the merge group's own run behind
          # them; a run that needs no runner time of its own waited sixteen
          # minutes (35117977336). So on pull_request and merge_group the
          # shards carry only the Go packages whose files the change touched
          # plus every in-repo package that imports them, read from the diff
          # against the event's own base by .github/scripts/select-packages.sh
          # (a go.mod or go.sum change selects the whole tree). A change that
          # touches no Go package — docs or lisp only — selects nothing and
          # collapses to ONE leg that prints "nothing to test for this change"
          # and exits 0, instead of the whole tree on every runner. The push to
          # dev and the nightly schedule keep the whole tree: the full matrix
          # is still the evidence, it is just no longer the default feedback
          # path.
          all=()
          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            SPACE_SHARDS=4
            # FOUR since 2026-09-25 (the two-minute cap, every job): at two darwin
            # shards, shard 2/2 of PR run 36206229467 held cmd/nova-sprint,
            # cmd/nova-wake and cmd/nova-review together and crossed the cap on
            # the Studio; at eight, sixteen darwin jobs of one queue run shared
            # eight runners and the merge legs crossed it. Glenn: "we cannot run
            # CI as parallel as we are used to, and still get reliable < 2m";
            # "reduce the number of runners". The Studio carries four runners
            # (fleet/runners.tsv), one wave per PR. The 2026-09-24 note below is history.
            STUDIO_SHARDS=4 # 14:55Z 2026-09-24: 16/16 Studio ARM64 runners busy, 12 runs queued, six PR runs at 4 studio shards each (24 jobs for 16 runners) held dev's push runs 10+ min; a shard's tests run 0.7-4.0 min since #3492 (run 36003142070); was 4
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            base="${{ github.event.merge_group.base_sha }}"
            STUDIO_SHARDS=4
          fi
          # A GO LIST FAILURE NEVER YIELDS `test (nothing)`. Measured 2026-09-26
          # ~1:00 PM ET: on PR #4370's final head the shards reported `test
          # (nothing)` because select-packages.sh hit a shared-GOCACHE race on a
          # space runner ("open /home/ubuntu/.cache/go-build/...: no such file or
          # directory") inside `done < <(bash select-packages.sh ...)`, which
          # throws the script's exit status away, and "0 package(s) touched: none"
          # was green. The script's answer is now read by command substitution,
          # so its exit status stops this step, and the script itself judges a
          # go list failure: on pull_request it FAILS the job with the go list
          # error printed (fast and cheap; the runner is broken, re-run it); on
          # merge_group, push and schedule it prints `WARN select-packages: go
          # list failed (...); testing the whole tree` and selects the whole tree
          # (the landing must not stall on one runner's cache).
          on_go_list_error=--on-go-list-error=whole-tree
          [ "${{ github.event_name }}" = "pull_request" ] && on_go_list_error=--on-go-list-error=fail
          if [ -n "$base" ]; then
            selected=$(bash .github/scripts/select-packages.sh "$on_go_list_error" "$base") || { echo "select-packages.sh failed; see its error above"; exit 1; }
          else
            selected=$(bash .github/scripts/select-packages.sh "$on_go_list_error" --all) || { echo "select-packages.sh failed; see its error above"; exit 1; }
          fi
          while IFS= read -r pkg; do
            [ -n "$pkg" ] || continue
            all+=("$pkg")
          done <<<"$selected"
          if [ -n "$base" ]; then
            echo "${{ github.event_name }}: ${#all[@]} package(s) touched: ${all[*]:-none}"
          else
            [ "${#all[@]}" -gt 0 ] || { echo "no packages: the fan-out would be empty and green"; exit 1; }
          fi

          # THE TWO HEAVIEST PACKAGES NEVER SHARE A SHARD. Dealt round-robin from the
          # sorted list, cmd/nova-bus and cmd/nova-merge sat eight apart and so shared
          # 2/8 studio on every push: dev run 36012558540 (studio-nova-15, Studio load
          # 51) ran nova-bus for 773 s beside nova-merge, which hit the 18m go test
          # timeout with 287 PASS and 0 FAIL. Dealt first, they take shards 1 and 2
          # (and space shards 1 and 2); every package is still covered once per OS.
          heavy=" ./cmd/nova-merge ./cmd/nova-bus "
          front=()
          rest=()
          for pkg in ${all[@]+"${all[@]}"}; do
            case "$heavy" in *" $pkg "*) front+=("$pkg") ;; *) rest+=("$pkg") ;; esac
          done
          all=(${front[@]+"${front[@]}"} ${rest[@]+"${rest[@]}"})

          if [ "${#all[@]}" -eq 0 ]; then
            echo "nothing to test for this change"
            packages='[{"name":"nothing","packages":"","os":"linux","arch":"x64","group":"space"}]'
            echo "$packages"
            echo "packages=$packages" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A PULL REQUEST'S macOS LEGS ARE FOR THE CODE THAT IS DIFFERENT ON macOS.
          # Measured 2026-09-23 02:40Z (#2795): 52 PR runs queued, and every one of
          # their 141 waiting jobs needed `self-hosted,macOS` while 46 Linux runners
          # sat idle; the macOS legs of the last 25 PR runs waited a median 39 min
          # (max 51) for one of the 36-40 Mac runners the swarm also loads, the
          # Linux legs 2 s. Yet 73 of the 78 packages compile the SAME files on
          # darwin as on linux, and 58 of them import nothing that does not: their
          # macOS leg ran the Go source their Linux leg had already run. So on a
          # pull_request a touched package gets a macOS leg only when it, or a
          # package it (or its tests) imports from this module, compiles a
          # different file set under GOOS=darwin (today cmd/nova-sandbox,
          # internal/bus, internal/sandbox, internal/swarm, internal/wake and the
          # 15 packages that import them); every other package runs on Linux
          # only, the shape the merge_group run below has used since 2026-09-16.
          # The whole tree still runs on macOS on every push to dev (8 darwin-x64
          # shards) and in certification's `test` job, so nothing leaves the
          # macOS evidence; it leaves the PR feedback path. If `go list` fails,
          # every touched package keeps its macOS leg (the old shape).
          darwin_sensitive=" "
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${#all[@]}" -gt 0 ]; then
            mod=$(go list -m)
            files='{{.ImportPath}} {{.GoFiles}} {{.CgoFiles}} {{.TestGoFiles}} {{.XTestGoFiles}}'
            if GOOS=linux go list -f "$files" ./cmd/... ./internal/... > "$RUNNER_TEMP/files-linux" &&
              GOOS=darwin go list -f "$files" ./cmd/... ./internal/... > "$RUNNER_TEMP/files-darwin" &&
              GOOS=darwin go list -test -f '{{.ImportPath}} {{join .Deps " "}}' ./cmd/... ./internal/... > "$RUNNER_TEMP/deps-darwin"; then
              differ=$(diff "$RUNNER_TEMP/files-linux" "$RUNNER_TEMP/files-darwin" | awk '/^[<>]/ {print $2}' | sort -u || true)
              while read -r p deps; do
                p="${p%.test}"
                p="${p%_test}"
                for d in $differ; do
                  case " $p $deps " in *" $d "*) darwin_sensitive+="./${p#"$mod"/} "; break ;; esac
                done
              done < "$RUNNER_TEMP/deps-darwin"
              echo "darwin-specific (own files or an import differ under GOOS=darwin): $(echo $darwin_sensitive | tr ' ' '\n' | sort -u | tr '\n' ' ')"
            else
              darwin_sensitive="ALL"
              echo "go list failed: every touched package keeps its macOS leg"
            fi
          fi
          needs_darwin() {
            [ "$darwin_sensitive" = "ALL" ] && return 0
            case "$darwin_sensitive" in *" $1 "*) return 0 ;; esac
            return 1
          }

          declare -a space_grp studio_grp
          s=0
          st=0
          for pkg in "${all[@]}"; do
            if { [ "${{ github.event_name }}" = "merge_group" ] || { [ "${{ github.event_name }}" = "pull_request" ] && ! needs_darwin "$pkg"; }; } && ! is_darwin_only "$pkg"; then
              space_grp[$((s % SPACE_SHARDS))]+=" $pkg"; s=$((s + 1)); continue
            fi
            studio_grp[$((st % STUDIO_SHARDS))]+=" $pkg"
            st=$((st + 1))
            is_darwin_only "$pkg" && continue
            space_grp[$((s % SPACE_SHARDS))]+=" $pkg"
            s=$((s + 1))
          done

          # The leg name carries its platform. Two legs sharing one name is two
          # checks GitHub reports under the same title, which is a green and a
          # red that cannot be told apart on the PR.
          entries=()
          for ((g=0; g<SPACE_SHARDS; g++)); do
            [ -n "${space_grp[$g]:-}" ] || continue
            packages="${space_grp[$g]# }"
            n=$((g + 1))
            entries+=("{\"name\":\"$n/$SPACE_SHARDS space\",\"packages\":\"$packages\",\"os\":\"linux\",\"arch\":\"x64\",\"group\":\"space\"}")
          done
          for ((g=0; g<STUDIO_SHARDS; g++)); do
            [ -n "${studio_grp[$g]:-}" ] || continue
            packages="${studio_grp[$g]# }"
            n=$((g + 1))
            # X64, OFF THE STUDIO (Glenn 2026-09-24 7:25 PM ET, nova-tools#3634: "No CI, and no swarm on the studio. It's for friends."): the macOS shards run on the Intel Macs, batman and superman (self-hosted,macOS,X64). Dev push run 35999520176's 7/8 Intel cancellations predate #3492, when GNU make 3.81 made every shard run the whole tree; since #3492 a shard's tests take 0.7-4.0 min on the Studio (run 36003142070), about 3x that per core on Intel, inside the 20-minute push cap. internal/ci: TestMacOSShardsLeaveTheStudio.
            # ARM64, ON THE STUDIO FOR NOW (Glenn 2026-09-25 8:40 PM ET: "let's have the darwin tests run on studio, so we can move forward"; the x64 iMac Pros took nine minutes for the merge group's darwin leg, and "running tests in under 2 minutes will require modern machines"). Temporary until an M-series machine joins the fleet for darwin CI; #3634's rule stands otherwise.
            entries+=("{\"name\":\"$n/$STUDIO_SHARDS darwin-arm64\",\"packages\":\"$packages\",\"os\":\"macOS\",\"arch\":\"ARM64\",\"group\":\"studio\"}")
          done

          [ "${#entries[@]}" -gt 0 ] || { echo "no packages with tests: the fan-out would be empty and green"; exit 1; }
          packages="[$(IFS=,; echo "${entries[*]}")]"
          echo "$packages"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  test:
    # THE UNIT TESTS, SHARDED, no race detector: ./cmd/* and ./internal/... in
    # twelve shards on the self-hosted Linux space runners and four on the
    # self-hosted Intel macOS runners (batman, superman; nova-tools#3634), in parallel with fail-fast off, so a red
    # leg does not cancel its siblings. Each leg vets and tests only its own
    # shard. Measured green end to end in run 35021822106: sixteen legs from
    # 14 s to 251 s, whole run 5 m 57 s. The whole-tree `-race` run is the
    # certification tier's `test` job. On pull_request and merge_group the legs
    # carry the packages the change touched, not the whole tree; a change that
    # touched no Go package gets one leg with an empty package list that prints
    # and exits 0.
    name: test (${{ matrix.entry.name }})
    needs: test-packages
    if: vars.NOVA_CI_CARDS != 'on' && (github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository))
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.test-packages.outputs.packages) }}
    # Labels are carried per entry as single-string variables: runs-on expressions
    # must resolve to a string, not to an array, so the matrix cannot hand over a
    # label list as one value.
    runs-on: [self-hosted, "${{ matrix.entry.os }}", "${{ matrix.entry.arch }}", "${{ matrix.entry.group }}"]
    # SIX, and the two minutes did not move — what a ceiling MEANS moved. The
    # two-minute law is about the CL feedback path: how long a change waits.
    # Until now that path ran on GitHub-hosted runners, where 48 legs start at
    # once and a per-job ceiling and the run's wall clock are the same number.
    # On 4+4 fixed machines they stop being the same number: the legs queue, so
    # the run is the sum over the waves and no per-job ceiling can see it.
    # Measured in run 35019905236 with the eight-and-eight fan-out: every studio leg and
    # three space legs were CANCELLED at 2:00 having done nothing wrong, while
    # five space legs passed at 80-118 s. The cause was oversubscription, since
    # fixed: several runners share each machine (15 cores on space, 32 on the
    # studio M3 Ultra) and each leg sized itself to the whole of it. A leg now
    # takes its share, the machine's own NOVA_RUNNERS_PER_MACHINE deciding how
    # many ways to split it. A ceiling that cancels honest work is not a
    # budget, it is a coin flip. Six is a hang detector for a leg measured at
    # one to two minutes; the budget itself is the run, and the run is what to
    # hold to the law. The fast jobs — lint, test-packages, lisp at 32, 11 and
    # 12 s — keep the 2 they always had.
    # The Studio at load 55 ran a double-size shard in 6-7 min (2026-09-16 05:16Z);
    # the cap stayed 6 by the two-minute law (internal/ci) and the shards got
    # smaller instead. On 2026-09-19 six started cancelling honest work again:
    # #1700 (2/4 studio, superman-nova-1) and #1714 (3/4 studio, superman-nova-2)
    # were CANCELLED at 6:23 and 6:07 with every test PASS and
    # `ok cmd/nova-merge 342.360s` in the log. Twelve is TWICE the slowest GREEN
    # shard of the last twenty green runs (348 s, superman-nova-7, run
    # 35457289611) — three seconds under the old cap. `studio` is a GROUP over
    # air, batman, studio and superman, and superman is an Intel Xeon W-2191B
    # carrying ten runners while the Studio is an M3 Ultra: one ceiling over a
    # 2x spread censors the slower machine. The reason lives beside the number
    # in internal/ci/ci_budget_test.go.
    # PUSH STUDIO SHARDS get 20 (2026-09-24, run 35950929169: all sixteen whole-tree studio shards cancelled at 12); PR, merge-group and space legs keep 12.
    timeout-minutes: 2
    steps:
      - name: nothing to test for this change
        # test-packages emits one leg with an empty package list when the change
        # touches no Go package (docs or lisp only). It prints this and exits 0
        # in seconds; every real step below is gated off, so the leg never
        # checks out or compiles anything and a docs-only change costs one
        # runner instead of the whole fan-out.
        if: matrix.entry.packages == ''
        shell: bash
        run: echo "nothing to test for this change"

      - name: remove stale build dirs from the shared runner
        if: matrix.entry.packages != ''
        # The self-hosted runners reuse the _work directory across jobs; a tree left
        # by an aborted or overlapping run makes checkout fail. Start from clean.
        # The sweep below is `rm -rf` over whatever the workspace holds, so it only
        # ever runs on a directory this repository has checked out: an empty
        # variable is refused, a workspace that does not exist yet is the normal
        # first-run state (#1751), and a workspace with no `.git` is not ours to
        # empty — actions/checkout clears a non-repository workspace itself.
        shell: bash
        run: |
          [ -n "${GITHUB_WORKSPACE}" ] || exit 1
          [ -d "${GITHUB_WORKSPACE}" ] || exit 0
          [ -d "${GITHUB_WORKSPACE}/.git" ] || exit 0
          # Clean in place, keep the tree (Glenn 2026-09-26 10:20 AM ET, fs_usage
          # on the Studio: four `find ... rm -rf` sweeps and the re-seeds behind
          # them were the file-event storm fseventsd digested at 100% CPU;
          # "lots of tiny files is a really slow way to work"). A checkout of
          # ours is reset to its HEAD and every untracked or ignored file is
          # removed: the same hygiene as emptying it, a few hundred operations
          # instead of a hundred thousand, and the next checkout fetches only
          # the new commit. A tree git cannot reset is emptied as before.
          if git -C "${GITHUB_WORKSPACE}" reset -q --hard && git -C "${GITHUB_WORKSPACE}" clean -ffdxq; then
            echo "workspace cleaned in place: $(git -C "${GITHUB_WORKSPACE}" rev-parse --short HEAD 2>/dev/null || echo '-')"
            exit 0
          fi
          find "${GITHUB_WORKSPACE}" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} + 2>/dev/null || true

      - name: borrow objects from the bench mirror
        if: matrix.entry.packages != ''
        # THE CHECKOUT FETCH WAS THE HANG. Every self-hosted job empties its
        # workspace above, so actions/checkout fetched the whole commit from
        # GitHub (11 MB at --depth=1) on every job, and on the house benches
        # that fetch stalled: 17 of the cancelled jobs in the last 25 PR runs
        # (2026-09-23 02:00Z) died at `git fetch --depth=1 origin +<merge
        # sha>` at the two-minute job cap (hulk 9, vision 5, studio 3, #2795),
        # the same stall that failed 566 staged cards (#2882). Every bench
        # already keeps $HOME/nova-bench/mirror/nova-tools.git fresh, so the
        # workspace borrows its objects (objects/info/alternates) and starts
        # detached at the mirror's HEAD: the fetch then carries only what the
        # mirror lacks. Measured on hulk: 11 MB and 3.1 s -> 24 KB and 1.1 s.
        # actions/checkout keeps a workspace whose origin URL matches and whose
        # HEAD is a commit (it cleans and resets it, both no-ops here), so the
        # checkout step itself is unchanged.
        # A bench with no mirror, or a workspace that is not empty, is left to
        # actions/checkout exactly as before, and this step never fails a job.
        shell: bash
        run: |
          m="$HOME/nova-bench/mirror/nova-tools.git"
          w="${GITHUB_WORKSPACE:?}"
          [ -d "$m/objects" ] || { echo "no bench mirror at $m: checkout fetches from GitHub"; exit 0; }
          mkdir -p "$w"
          [ -z "$(ls -A "$w")" ] || { echo "workspace not empty: left to actions/checkout"; exit 0; }
          seed() {
            tip=$(git --git-dir="$m" rev-parse --verify -q 'HEAD^{commit}') || return 1
            git init -q "$w" &&
              git -C "$w" remote add origin "${{ github.server_url }}/${{ github.repository }}" &&
              echo "$m/objects" > "$w/.git/objects/info/alternates" &&
              git -C "$w" -c advice.detachedHead=false checkout -q --detach "$tip" &&
              echo "workspace borrows $m, detached at its HEAD $tip"
          }
          seed || { echo "seeding from $m failed: left to actions/checkout"; rm -rf -- "$w/.git"; }

      # RESILIENT CHECKOUT (ideas #793): a transient first-fetch failure must
      # not redden a job. Attempt one tolerates its own failure ONLY so the
      # retry below runs; the retry itself is not tolerated, so a checkout
      # that fails twice still fails the job: fail-closed, not fail-open.
      - name: checkout
        id: checkout
        if: matrix.entry.packages != ''
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: checkout retry
        if: matrix.entry.packages != '' && steps.checkout.outcome == 'failure'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: use the installed Go toolchain
        if: matrix.entry.packages != ''
        # The self-hosted runners carry Go (1.26 at /usr/bin/go on Linux, under
        # /opt/homebrew or ~/go on macOS). Prefer it over a setup-go download.
        shell: bash
        run: |
          set -euo pipefail
          # the bench's own Go wins over a distro Go on the system path (hulk: /usr/bin/go 1.22
          # shadowed ~/go/bin 1.26.5 and every PR job died downloading a toolchain, 2026-09-17)
          # newest Go under ~/sdk first (the Mac benches: batman and superman keep 1.27 there, and
          # batman also carries a stale root-owned /usr/local/go 1.22 that won this loop, 2026-09-18)
          # the toolchain go.mod names wins when ~/sdk holds it (#4080: space's runner took the newest sdk Go
          # while the release build beside it switched toolchains in the same caches): the toolchain line,
          # else the go line, which is the toolchain a go.mod without that line implies; else as before
          want=$(sed -n 's/^toolchain \(go[0-9][0-9a-z.]*\)$/\1/p' go.mod 2>/dev/null | head -1 || true)
          [ -n "$want" ] || want=$(sed -n 's/^go \([0-9][0-9a-z.]*\)$/go\1/p' go.mod 2>/dev/null | head -1 || true)
          sdk=
          if [ -n "$want" ] && [ -x "$HOME/sdk/$want/bin/go" ]; then sdk="$HOME/sdk/$want/bin"; fi
          [ -n "$sdk" ] || sdk=$(ls -d "$HOME"/sdk/go*/bin 2>/dev/null | sort -V | tail -1 || true) # empty on the Linux benches; under pipefail the failed ls would abort the step
          for d in "$sdk" "$HOME/go/bin" /usr/local/go/bin /opt/homebrew/bin; do
            [ -n "$d" ] && [ -x "$d/go" ] && { echo "$d" >> "$GITHUB_PATH"; export PATH="$d:$PATH"; break; }
          done
          command -v go >/dev/null 2>&1 || { echo "no Go toolchain on PATH"; exit 1; }
          go version
          echo "GO SETUP want=${want:-none} go=$(command -v go) gomodcache=$(go env GOMODCACHE) gocache=$(go env GOCACHE)"

      - name: take this runner's share of the machine, not all of it
        if: matrix.entry.packages != ''
        # SEVERAL runners share each of these machines, and `go test` defaults
        # GOMAXPROCS to every core it can see -- so concurrent legs each ask for
        # the whole machine and spend the difference context-switching.
        # Measured: the same studio legs ran 208 and 251 s in run 35021822106
        # and 386 and 379 s in run 35023183602, the second pair cancelled at the
        # ceiling, on identical work. A leg takes its FAIR SHARE instead: cores
        # divided by the runners on the machine, never below 1. `go test -p`
        # follows GOMAXPROCS, so this bounds both the package-level and the
        # in-package parallelism with one number.
        #
        # HOW MANY RUNNERS is the MACHINE's fact, not this file's: the runner
        # service exports NOVA_RUNNERS_PER_MACHINE and the leg reads it. Written
        # here it goes stale, and did -- the divisor stayed 4 when the fleet went
        # to 8 runners a machine and CI alone put Space at load 39 on 15 cores
        # (row 9 of #828, PR799). The default is today's fleet (8) for a machine
        # that says nothing, and the number used is printed, so a leg's own log
        # answers what it divided by. internal/ci: TestRunnersPerMachineIsOneNumber.
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(uname -s)" = "Darwin" ]; then
            cores=$(sysctl -n hw.ncpu)
          else
            cores=$(nproc)
          fi
          runners="${NOVA_RUNNERS_PER_MACHINE:-8}"
          case "$runners" in ''|*[!0-9]*|0) runners=8 ;; esac
          share=$(( cores / runners ))
          [ "$share" -ge 1 ] || share=1
          echo "$cores cores on this machine, $runners runners per machine (NOVA_RUNNERS_PER_MACHINE), this leg takes $share"
          echo "GOMAXPROCS=$share" >> "$GITHUB_ENV"

      # No actions/cache here. These runners are PERSISTENT: ~/.cache/go-build
      # survives between jobs on the machine itself, so the action spends 6 s
      # restoring and 4 s re-uploading a cache the disk already had — a tenth of
      # the leg's budget, to move a cache one hop it never left.
      # test-hosted keeps it: a GitHub-hosted runner is a fresh machine.

      # No separate `build` step either: `go vet` and `go test` both compile
      # what they are given, so building first was a third compile of the same
      # packages. The whole-tree `go build ./...` still runs once, in lint.
      # A push to dev is the merge queue's own merge commit almost every time,
      # and the queue already ran this workflow on that exact sha as a
      # merge_group (its head_sha is the commit that lands). Running the shards
      # a third time on the same tree proves nothing and costs a full run on
      # every machine (Glenn 2026-09-26 9:42 AM ET: "We aren't doing anything
      # that should be this heavy in CPU use"). The step asks the API for a
      # successful merge_group run of this sha; when one exists, vet and test
      # are skipped and the job passes on that evidence. A direct push to dev
      # has no such run and runs in full. Any API trouble reads as "not
      # proved", never as a skip.
      - name: proved by the merge-group run of this sha
        id: proved
        if: matrix.entry.packages != '' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(curl -sS --max-time 20 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/actions/runs?event=merge_group&head_sha=${{ github.sha }}&status=success&per_page=1" \
              | grep -o '"total_count": *[0-9]*' | grep -o '[0-9]*$' || echo 0)
          proved=false
          [ "${n:-0}" -gt 0 ] 2>/dev/null && proved=true
          echo "proved=$proved" >> "$GITHUB_OUTPUT"
          echo "PROVED sha=${{ github.sha }} merge_group_runs=${n:-0} proved=$proved"

      - name: vet
        if: matrix.entry.packages != '' && steps.proved.outputs.proved != 'true'
        run: make vet PKGS="${{ matrix.entry.packages }}"

      - name: install redis-server
        if: matrix.entry.packages != '' && steps.proved.outputs.proved != 'true'
        # #3113. The controls spawn a throwaway redis-server. Self-hosted rows
        # (Studio, hulk) also get the binary from rowan-tools fleet/bench.yml;
        # this step is what a runner has before that playbook has converged,
        # and what the hosted rows run below. It does not dial the fleet store.
        run: bash .github/scripts/install-redis-server.sh

      - name: test
        if: matrix.entry.packages != '' && steps.proved.outputs.proved != 'true'
        # The default bash flags on a `run:` step are `-eo pipefail`, so a
        # failing `go test` already stops the step at the pipe, before
        # slowtests runs; the budget check only ever sees a green stream. The
        # raw `-json` is teed so a slow package's finding is read once, by
        # cmd/nova-ci, and the same bytes are on disk if a reader wants them.
        # DATED EXCEPTION 2026-09-18 (remove with cards 9352 to 9359): the budget is 60 s by the two-minute law, but on
        # 2026-09-18 the first night of this check found eight packages between 77 s and 272 s on a Studio at load 60
        # and an Intel Mac at load 2; the cards make those packages fast. Until they land the budget is 300 s here so
        # a mechanical red does not hold dev, and every CI-SLOW line is still printed for the coordinator. This covers
        # the Intel Mac benches too (about 3x slower per core than the Studio) that cards 9352 to 9354 make fast.
        # The budget is 60 s (the two-minute law) except, until cards 9352 to 9354 make cmd/nova-swarm and
        # internal/swarm fast, on the Intel Mac benches (about 3x slower per core than the Studio), where the alert still
        # prints every CI-SLOW line but the budget is 300 s. Dated exception, 2026-09-18; remove with those cards.
        # All of it now lives in the Makefile's `test` target: the Makefile is the
        # one entry for the CL test, and the shard travels in PKGS; the target tees
        # the -json stream to $RUNNER_TEMP/test.json and runs cmd/nova-ci slowtests
        # exactly as the inline command here did.
        # GOTEST_TIMEOUT: run 35999520176's studio-nova-13 shard failed only on Go's default 10m (cmd/nova-bus 600.3 s, cmd/nova-merge 600.5 s, 9,916 passes, 0 failing tests), so studio legs get 18m under the 20-minute push cap and 11m under the 12-minute PR/merge-group cap; space keeps Go's default 10m. internal/ci: TestShardGoTestTimeoutFitsTheJobCap.
        # NOVA_CI_PR_STUDIO (2026-09-24, #3497 run 36010839171 and #3547 run 36014606764): a PR's Studio leg sets it,
        # and cmd/nova-merge's git-lab tests skip there (cmd/nova-merge/helpers_test.go, skipLabOnPRStudioLeg). The
        # package has no darwin-specific file; it rode onto the Studio as an importer of internal/bus, and its 240
        # parallel lab tests ran 660 s at GOMAXPROCS=4 (Go's 11m timeout) and 12 min (the cap) on a loaded Studio.
        # They run in full on the same PR's Linux leg, on every push to dev (8 Studio shards) and in the merge group.
        # Not a global -short: that would also skip internal/bus's multi-process tests, the darwin evidence this leg is for.
        # GOTEST_TAGS (nova-tools #4328, Glenn 2026-09-26 11:20 AM ET: functional
        # tests run "not on every small PR being merged or worked on, but only as we
        # merge whole work streams"): a pull request's legs build without the
        # `functional` tag, so no redis-server starts; the merge group and an
        # unproved push to dev are the landing, and they run the functional tier.
        env:
          NOVA_CI_PR_STUDIO: ${{ matrix.entry.group == 'macOS' && github.event_name == 'pull_request' && '1' || '' }}
          GOTEST_TAGS: ${{ github.event_name != 'pull_request' && 'functional' || '' }}
        # GOTEST_COUNT_FLAG= turns Go's test cache on (Makefile): a shard whose
        # packages did not change since the last run on this machine is
        # served from the cache instead of recompiled and re-executed.
        # GOTEST_LDFLAGS=-ldflags=-w links test binaries without DWARF: no
        # dsymutil per binary on darwin, less to scan.
        run: make test PKGS="${{ matrix.entry.packages }}" GOTEST_TIMEOUT="110s" GOTEST_COUNT_FLAG= GOTEST_LDFLAGS=-ldflags=-w

  test-race-queue:
    # THE QUEUE AND LEASE PACKAGE UNDER -race, and the one place the race
    # detector is required on the CL path (see the header's THE ONE EXCEPTION).
    # internal/redisq is the card queue and the slot leases both: the DirQueue
    # whose pull is an atomic rename two pullers race for, the Redis queue whose
    # card reaches exactly one consumer, the fenced lease whose renew and
    # release are a Lua compare-and-release, and the cap admission 200 callers
    # run through one script. Those are the shapes a data race hides in, and the
    # sharded `test` job cannot see one — it runs the same tests without -race.
    # The whole-tree -race run stays in the certification tier, a release
    # blocker and never a CL one; this job is the narrow leg that IS a CL one,
    # aggregated by ci-ok, so a seeded data race fails the merge gate instead of
    # landing on dev green. One package, one runner, inside the two-minute
    # budget (measured 2026-09-22: `make test-race PKGS=./internal/redisq`
    # passes in seconds warm and 54 s cold, cap 2 min).
    if: vars.NOVA_CI_CARDS != 'on' && (github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: [self-hosted, linux, x64, space]
    timeout-minutes: 2
    steps:
      - name: remove stale build dirs from the shared runner
        # The self-hosted runners reuse the _work directory across jobs; a tree left
        # by an aborted or overlapping run makes checkout fail. Start from clean.
        # The sweep below is `rm -rf` over whatever the workspace holds, so it only
        # ever runs on a directory this repository has checked out: an empty
        # variable is refused, a workspace that does not exist yet is the normal
        # first-run state (#1751), and a workspace with no `.git` is not ours to
        # empty — actions/checkout clears a non-repository workspace itself.
        shell: bash
        run: |
          [ -n "${GITHUB_WORKSPACE}" ] || exit 1
          [ -d "${GITHUB_WORKSPACE}" ] || exit 0
          [ -d "${GITHUB_WORKSPACE}/.git" ] || exit 0
          # Clean in place, keep the tree (Glenn 2026-09-26 10:20 AM ET, fs_usage
          # on the Studio: four `find ... rm -rf` sweeps and the re-seeds behind
          # them were the file-event storm fseventsd digested at 100% CPU;
          # "lots of tiny files is a really slow way to work"). A checkout of
          # ours is reset to its HEAD and every untracked or ignored file is
          # removed: the same hygiene as emptying it, a few hundred operations
          # instead of a hundred thousand, and the next checkout fetches only
          # the new commit. A tree git cannot reset is emptied as before.
          if git -C "${GITHUB_WORKSPACE}" reset -q --hard && git -C "${GITHUB_WORKSPACE}" clean -ffdxq; then
            echo "workspace cleaned in place: $(git -C "${GITHUB_WORKSPACE}" rev-parse --short HEAD 2>/dev/null || echo '-')"
            exit 0
          fi
          find "${GITHUB_WORKSPACE}" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} + 2>/dev/null || true

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: use the installed Go toolchain
        # The self-hosted runners carry Go (1.26 at /usr/bin/go on Linux, under
        # /opt/homebrew or ~/go on macOS). Prefer it over a setup-go download.
        shell: bash
        run: |
          set -euo pipefail
          # the bench's own Go wins over a distro Go on the system path (hulk: /usr/bin/go 1.22
          # shadowed ~/go/bin 1.26.5 and every PR job died downloading a toolchain, 2026-09-17)
          # newest Go under ~/sdk first (the Mac benches: batman and superman keep 1.27 there, and
          # batman also carries a stale root-owned /usr/local/go 1.22 that won this loop, 2026-09-18)
          # the toolchain go.mod names wins when ~/sdk holds it (#4080: space's runner took the newest sdk Go
          # while the release build beside it switched toolchains in the same caches): the toolchain line,
          # else the go line, which is the toolchain a go.mod without that line implies; else as before
          want=$(sed -n 's/^toolchain \(go[0-9][0-9a-z.]*\)$/\1/p' go.mod 2>/dev/null | head -1 || true)
          [ -n "$want" ] || want=$(sed -n 's/^go \([0-9][0-9a-z.]*\)$/go\1/p' go.mod 2>/dev/null | head -1 || true)
          sdk=
          if [ -n "$want" ] && [ -x "$HOME/sdk/$want/bin/go" ]; then sdk="$HOME/sdk/$want/bin"; fi
          [ -n "$sdk" ] || sdk=$(ls -d "$HOME"/sdk/go*/bin 2>/dev/null | sort -V | tail -1 || true) # empty on the Linux benches; under pipefail the failed ls would abort the step
          for d in "$sdk" "$HOME/go/bin" /usr/local/go/bin /opt/homebrew/bin; do
            [ -n "$d" ] && [ -x "$d/go" ] && { echo "$d" >> "$GITHUB_PATH"; export PATH="$d:$PATH"; break; }
          done
          command -v go >/dev/null 2>&1 || { echo "no Go toolchain on PATH"; exit 1; }
          go version
          echo "GO SETUP want=${want:-none} go=$(command -v go) gomodcache=$(go env GOMODCACHE) gocache=$(go env GOCACHE)"

      - name: the queue and lease package, with -race
        # make test-race carries the -race flag (Makefile: the one entry); PKGS
        # narrows it to the queue and lease package, so the leg stays inside the
        # two-minute budget the whole-tree run cannot.
        run: make test-race PKGS="./internal/redisq"

  test-hosted:
    # THE FULL SUITE on the GitHub-hosted runners — ubuntu-latest and
    # macos-latest — but ONLY on push to main and on the nightly schedule.
    # GitHub-hosted compute is the expensive tier, so a pull request never
    # touches it: a change's feedback path is the self-hosted matrix above.
    #
    # THE WINDOWS ENTRY IS GONE (2026-09-18, Glenn: "drop the native windows CI
    # runners. WSL only from now on."). This matrix ran windows-latest on every
    # push to main and every night; it does not any more. The CL tier's Windows
    # coverage is the lint job's `make vet-windows` cross-vet, and the real
    # Windows suite is the certification tier's, which is a release blocker and
    # never a CL one.
    #
    # workflow_dispatch stays in the list: a hosted-only breakage on macOS or
    # Linux still cannot be reproduced or proved fixed anywhere but here, and
    # without it the only way to see a hosted leg go green is to merge the fix
    # to main and find out, which is exactly the "prove the tip before any
    # merge" rule inverted. A manual run on a branch is a deliberate, named
    # spend of hosted compute; it is not on the pull_request path, so the
    # default feedback path is still the self-hosted matrix and costs nothing
    # here. ci-ok does not gate on it for a dispatch: the run is evidence to
    # read, not an automatic merge gate.
    if: vars.NOVA_CI_CARDS != 'on' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 2
    steps:
      # RESILIENT CHECKOUT (ideas #793): a transient first-fetch failure must
      # not redden a job. Attempt one tolerates its own failure ONLY so the
      # retry below runs; the retry itself is not tolerated, so a checkout
      # that fails twice still fails the job: fail-closed, not fail-open.
      - name: checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: checkout retry
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # This workflow manages caching explicitly; do not probe for a missing go.sum.
          cache: false

      - name: cache go build and module cache
        if: runner.environment == 'github-hosted'
        # Only on GitHub-hosted runners. A self-hosted runner is PERSISTENT: its Go build cache is
        # already on disk, and this step's save phase tars the whole multi-GB cache on every job,
        # outlives the job's timeout, and is orphaned still compressing (82 of them put the Studio
        # at load 147 on 2026-09-17). internal/ci holds the class test.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: build
        run: make build

      - name: vet
        run: make vet

      - name: install redis-server
        # #3113, the hosted row. ubuntu-latest has no redis-server until apt
        # installs it; macos-latest uses Homebrew. A service container would
        # not put the binary on PATH, and the controls spawn their own server.
        run: bash .github/scripts/install-redis-server.sh

      - name: test (shard ${{ matrix.shard }} of 4)
        # Four shards per OS, dealt by package order (stable: go list sorts), so a
        # hosted leg is a quarter of the suite: the whole suite on one hosted
        # runner took ten minutes (run 35045469738) for a tier whose budget is two.
        # Same billed minutes, a quarter of the wall clock. The hosted legs still
        # run only on main and nightly; the shard count is the whole tuning.
        shell: bash
        run: |
          pkgs=$(go list ./... | awk -v n=4 -v i=${{ matrix.shard }} 'NR % n == i - 1')
          echo "$pkgs"
          # The hosted legs run -short: the multi-process and thousand-note fixture tests
          # in cmd/nova-bus, cmd/nova-wake, cmd/nova-merge and internal/bus are gated
          # behind testing.Short() and skip here, so a hosted leg answers inside the
          # two-minute budget instead of hitting Go's 10 m default on main (run
          # 35052889521, panic: test timed out after 10m0s). The self-hosted shards keep
          # running everything; the nightly certification runs the hosted legs full.
          # -timeout 12m stays above Go's 10 m default (cmd/nova-bus hit it on main,
          # run 35052889521, panic: test timed out after 10m0s) and fires before the
          # 15-minute job ceiling, so Go names the hung package instead of the runner
          # killing the job silently. The two-minute rule is met by gating the
          # multi-process bus tests behind -short on hosted legs (issue filed); until
          # that lands, a slow package must not panic the leg. It is the ceiling, not
          # the target. The Makefile's test-short carries the same 12m ceiling, and
          # the shard travels in PKGS.
          make test-short PKGS="$(echo $pkgs)"

  # THERE IS NO HOSTED MERGE LEG SINCE 2026-09-26. The merge group's gate is the
  # same sharded `test` legs the pull request ran, on our own benches, on the
  # group commit (space and the Studio, under a minute each). The hosted legs
  # (plan-merge + test-hosted-merge, Rule T of 2026-09-16) re-ran the changed
  # packages on two-core hosted runners and crossed the two-minute cap on four
  # of the last five queue runs (36207910988, 36208535525, 36209991791,
  # 36211233173), each one a full PR-plus-queue round lost. Glenn 2026-09-26:
  # "We have to speed this shit up. Less dependency on github is my bet." The
  # clean-image property they carried moves to certification.yml (#4219).

  test-hosted-pr:
    # THE SANDBOX LEG, and since 2026-09-18 that is all it is. A PR that touches
    # a platform-specific path the self-hosted matrix cannot see runs THAT
    # platform here, on the hosted runner it belongs to, so the feedback comes
    # back on the PR and not on main. The sandbox is darwin-only in the
    # self-hosted matrix, so a Linux sandbox break would otherwise only surface
    # on main: that is this job's remaining reason to exist, gated by a path
    # filter over the PR diff (internal/sandbox/**, any *_linux.go or
    # *_linux_test.go).
    #
    # THE WINDOWS ENTRY IS GONE, twice over. It was retired into test-windows-pr
    # on 2026-09-18 morning, because integration-4 ran both on one commit: the
    # sharded leg passed all three shards at 13:37-13:43Z while this one was
    # CANCELLED by its own six-minute timeout at 13:43:39, running the same heavy
    # packages unsharded and failing the whole run. Later the same day Glenn
    # dropped the native windows runners altogether ("WSL only from now on."),
    # so test-windows-pr went too. A pull request now meets Windows once, in the
    # lint job's `make vet-windows` cross-vet, which type-checks the whole tree
    # for GOOS=windows on a Linux runner. The paths the retired leg watched
    # (cmd/nova-bus/**, internal/bus/**, **/*_windows.go) no longer select a
    # runner of their own: a *_windows.go that stops compiling is caught by the
    # cross-vet, and what only a real Windows machine can answer is answered by
    # the certification tier.
    #
    # A leg runs ONLY the packages its filter names, under the two-minute rule;
    # when the diff matches nothing the test step is skipped, and ci-ok counts a
    # skip as ok. Same head-repo guard as every other PR job: a fork PR skips
    # the leg rather than running untrusted code on hosted compute. The
    # concurrency group is the workflow's. The matrix keeps one entry rather
    # than being flattened away: the shape is "a hosted leg per platform the
    # self-hosted runners cannot see", and the next such platform is an entry
    # rather than a rewrite.
    name: test-hosted-pr (${{ matrix.leg.name }})
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        leg:
          - name: linux
            os: ubuntu-latest
            packages: ./internal/sandbox
            filters: |
              changed:
                - 'internal/sandbox/**'
                - '**/*_linux.go'
                - '**/*_linux_test.go'
    runs-on: ${{ matrix.leg.os }}
    # 6 is the CL cap the two-minute law allows; 2 killed the windows leg by the clock
    # (cmd/nova-bus measured 439 s there). The legs run -short (#682).
    timeout-minutes: 2
    steps:
      # RESILIENT CHECKOUT (ideas #793): a transient first-fetch failure must
      # not redden a job. Attempt one tolerates its own failure ONLY so the
      # retry below runs; the retry itself is not tolerated, so a checkout
      # that fails twice still fails the job: fail-closed, not fail-open.
      - name: checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: checkout retry
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: filter the PR diff for this platform's paths
        # No path filter exists elsewhere in this file to reuse, so
        # dorny/paths-filter is pinned by sha. On a pull_request it reads the
        # diff via the REST API and reports whether any changed file matches
        # this leg's patterns.
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: ${{ matrix.leg.filters }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: steps.filter.outputs.changed == 'true'
        with:
          go-version-file: go.mod
          # This workflow manages caching explicitly; do not probe for a missing go.sum.
          cache: false

      - name: cache go build and module cache
        if: runner.environment == 'github-hosted' && (steps.filter.outputs.changed == 'true')
        # Only on GitHub-hosted runners. A self-hosted runner is PERSISTENT: its Go build cache is
        # already on disk, and this step's save phase tars the whole multi-GB cache on every job,
        # outlives the job's timeout, and is orphaned still compressing (82 of them put the Studio
        # at load 147 on 2026-09-17). internal/ci holds the class test.
        # A GitHub-hosted runner is a fresh machine, so the cache pays for itself
        # here exactly as it does in test-hosted.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: test the packages this leg filters
        if: steps.filter.outputs.changed == 'true'
        run: make test-short PKGS="${{ matrix.leg.packages }}"

  e2e:
    # THE SEQUENCES A FRIEND RUNS, end to end, one job. The sharded `test` job above runs
    # these too -- they are ordinary Go tests in ordinary packages -- and this job exists
    # so that the class has a name on the checks list: every breakage of 2026-09-15 was a
    # verb passing its own tests and leaving state the NEXT verb refused, which no
    # single-verb test looks at. A red here says the tools do not compose, not that one of
    # them is wrong.
    #
    # `-run TestFriendSequence` is the whole selector, and docs/WORKER-CARDS.md practice 21
    # is what keeps it populated: a card that changes a verb names the sequence a friend
    # runs through it and adds the test. On a pull_request this is a self-hosted Linux job
    # using the machine's own Go, guarded as every self-hosted job is.
    if: vars.NOVA_CI_CARDS != 'on' && (github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: [self-hosted, linux, x64, space]
    timeout-minutes: 2
    steps:
      - name: remove stale build dirs from the shared runner
        # The self-hosted runners reuse the _work directory across jobs; a tree left
        # by an aborted or overlapping run makes checkout fail. Start from clean.
        # The sweep below is `rm -rf` over whatever the workspace holds, so it only
        # ever runs on a directory this repository has checked out: an empty
        # variable is refused, a workspace that does not exist yet is the normal
        # first-run state (#1751), and a workspace with no `.git` is not ours to
        # empty — actions/checkout clears a non-repository workspace itself.
        shell: bash
        run: |
          [ -n "${GITHUB_WORKSPACE}" ] || exit 1
          [ -d "${GITHUB_WORKSPACE}" ] || exit 0
          [ -d "${GITHUB_WORKSPACE}/.git" ] || exit 0
          # Clean in place, keep the tree (Glenn 2026-09-26 10:20 AM ET, fs_usage
          # on the Studio: four `find ... rm -rf` sweeps and the re-seeds behind
          # them were the file-event storm fseventsd digested at 100% CPU;
          # "lots of tiny files is a really slow way to work"). A checkout of
          # ours is reset to its HEAD and every untracked or ignored file is
          # removed: the same hygiene as emptying it, a few hundred operations
          # instead of a hundred thousand, and the next checkout fetches only
          # the new commit. A tree git cannot reset is emptied as before.
          if git -C "${GITHUB_WORKSPACE}" reset -q --hard && git -C "${GITHUB_WORKSPACE}" clean -ffdxq; then
            echo "workspace cleaned in place: $(git -C "${GITHUB_WORKSPACE}" rev-parse --short HEAD 2>/dev/null || echo '-')"
            exit 0
          fi
          find "${GITHUB_WORKSPACE}" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} + 2>/dev/null || true

      - name: borrow objects from the bench mirror
        # THE CHECKOUT FETCH WAS THE HANG. Every self-hosted job empties its
        # workspace above, so actions/checkout fetched the whole commit from
        # GitHub (11 MB at --depth=1) on every job, and on the house benches
        # that fetch stalled: 17 of the cancelled jobs in the last 25 PR runs
        # (2026-09-23 02:00Z) died at `git fetch --depth=1 origin +<merge
        # sha>` at the two-minute job cap (hulk 9, vision 5, studio 3, #2795),
        # the same stall that failed 566 staged cards (#2882). Every bench
        # already keeps $HOME/nova-bench/mirror/nova-tools.git fresh, so the
        # workspace borrows its objects (objects/info/alternates) and starts
        # detached at the mirror's HEAD: the fetch then carries only what the
        # mirror lacks. Measured on hulk: 11 MB and 3.1 s -> 24 KB and 1.1 s.
        # actions/checkout keeps a workspace whose origin URL matches and whose
        # HEAD is a commit (it cleans and resets it, both no-ops here), so the
        # checkout step itself is unchanged.
        # A bench with no mirror, or a workspace that is not empty, is left to
