          seed || { echo "seeding from $m failed: left to actions/checkout"; rm -rf -- "$w/.git"; }

      # RESILIENT CHECKOUT (ideas #793): a transient first-fetch failure must
      # not redden a job. Attempt one tolerates its own failure ONLY so the
      # retry below runs; the retry itself is not tolerated, so a checkout
      # that fails twice still fails the job: fail-closed, not fail-open.
      - name: checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: checkout retry
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

