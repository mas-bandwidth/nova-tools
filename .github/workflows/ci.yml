# CI for nova-tools: the CL tier.
#
# Why this exists: until now, local `go test` on one machine was the whole
# evidence behind a release — including for four rounds of fail-open fixes in a
# check other people are told to run against their own repos. A claim that a
# released tool is tested is exactly what stops anyone checking whether it was
# tested anywhere but the releasing machine.
#
# This file is the FAST TIER: the checks a change is required to pass in two
# minutes, ideally one. It runs gofmt, build, vet, and the unit tests sharded
# across parallel jobs, without the race detector. Everything that cannot fit
# that budget — the whole-tree `-race` run, Windows build/vet and per-package
# tests, the three-OS smoke, the release dry-run, and the nightly perf wall
# clock — lives in .github/workflows/certification.yml, under the same job
# names, so a red certification is a blocker for the next release and never for
# a CL. Nothing is deleted by splitting; the slow tier still runs every test.
#
# WHERE THINGS RUN. Pull requests run on the self-hosted runners ONLY: a
# per-package matrix — ./cmd/<tool> and ./internal/... dealt into twelve
# shards on the four Linux space runners and four on the four macOS studio
# runners — fanned out in parallel, fail-fast off, so a change's feedback path is a
# fan-out over the 4+4 machines and never a serial queue, and never
# GitHub-hosted compute. The GitHub-hosted runners (ubuntu-latest, macos-latest,
# windows-latest) run only on push to main and on the nightly schedule, with the
# full suite. The ONE exception is test-hosted-pr: a PR that touches a
# platform-specific path — internal/sandbox or *_linux.go, cmd/nova-bus or
# internal/bus or *_windows.go — runs that one hosted leg on the PR, so a
# platform the self-hosted runners cannot see gets its feedback before main.
# Every self-hosted job is guarded by the head-repo check, so a
# pull_request from a fork skips CI rather than running untrusted code on our
# machines.
#
# The race detector is the one trade-off that matters to name: it stays, in the
# certification tier's `test` and `test-windows` jobs. The CL tier's sharded
# tests are the same tests without `-race`, so a data race on a CL is caught by
# certification rather than by the CL itself. That is the budget, not a skip.

name: ci

on:
  push:
    # dev is the integration branch (Glenn 2026-09-16): every merge lands there and the
    # push run, hosted legs included, is the evidence a promotion to main waits for.
    branches: [main, dev]
  pull_request:
  # merge_group: the merge queue builds a group commit of the PRs about to land and
  # runs this workflow on it; ci-ok on the group is the merge gate, so every PR is
  # proved against the main it actually lands on (2026-09-16: with the up-to-date
  # rule and no queue, every merge invalidated every other PR's evidence).
  merge_group:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      bench:
        description: "fleet-probe: bench label to prove (hulk, vision, mini); empty runs no probe"
        required: false
        default: ""
      slots:
        description: "fleet-probe: parallel jobs, one per runner slot"
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  # A pending run is evicted by a newly queued run in the same group before it
  # ever starts. So a push to main keys on the commit sha (no two main runs
  # share a group, none can evict another); a PR still keys on its number so its
  # newest head supersedes older runs; a non-main branch with no PR keys on ref.
  # dev is an integration branch with the same steady merge stream (2026-09-16
  # 16:35Z: dev's rerun was cancelled by the next merge and the mechanical gate
  # read the cancellation as red), so dev keys on the sha like main does.
  group: ci-${{ github.event.pull_request.number || ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.sha) || github.ref }}-${{ github.event_name }}-${{ inputs.bench }}
  # A push to main never cancels main's running verdict: with a steady merge
  # stream every main run was cancelled by the next merge (2026-09-16 04:41Z and
  # 04:53Z), so main had no completed run for the mechanical red gate to read.
  # Branch runs still cancel each other (only the newest head matters there).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

jobs:
  lint:
    # gofmt, `go build ./...`, `go vet ./...` on one runner. Formatting is a
    # property of the source, not of the platform, so gofmt is checked once;
    # build and vet run here on Linux, and their macOS/Windows coverage is the
    # certification tier's `test` and `build-windows` jobs. On a pull_request
    # this is a self-hosted Linux job, guarded so fork code never runs here.
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, space]
    timeout-minutes: 2
    steps:
      - name: remove stale build dirs from the shared runner
        # The self-hosted runners reuse the _work directory across jobs; a tree left
        # by an aborted or overlapping run makes checkout fail. Start from clean.
        shell: bash
        run: |
          find "${GITHUB_WORKSPACE}" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} + 2>/dev/null || true

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: use the installed Go toolchain
        # The self-hosted runners carry Go (1.26 at /usr/bin/go on Linux, under
        # /opt/homebrew or ~/go on macOS). Prefer it over a setup-go download.
        shell: bash
        run: |
          set -euo pipefail
          # the bench's own Go wins over a distro Go on the system path (hulk: /usr/bin/go 1.22
          # shadowed ~/go/bin 1.26.5 and every PR job died downloading a toolchain, 2026-09-17)
          for d in "$HOME/go/bin" /usr/local/go/bin /opt/homebrew/bin; do
            [ -x "$d/go" ] && { echo "$d" >> "$GITHUB_PATH"; export PATH="$d:$PATH"; break; }
          done
          command -v go >/dev/null 2>&1 || { echo "no Go toolchain on PATH"; exit 1; }
          go version

      - name: cache go build and module cache
        if: runner.environment == 'github-hosted'
        # Only on GitHub-hosted runners. A self-hosted runner is PERSISTENT: its Go build cache is
        # already on disk, and this step's save phase tars the whole multi-GB cache on every job,
        # outlives the job's timeout, and is orphaned still compressing (82 of them put the Studio
        # at load 147 on 2026-09-17). internal/ci holds the class test.
        # go.mod carries no dependencies today, so the module cache is nearly
        # empty; the build cache is what pays for itself across the shards
        # below, which compile the same tree.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: gofmt
        # gofmt -l prints unformatted files and exits 0 either way, so the exit
        # code is not the product here — the output is.
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

  test-packages:
    # The list the CL tier's test shards run on, READ OUT OF THE SOURCE rather
    # than written down: ./cmd/* and ./internal/... dealt round-robin into
    # twelve shards on the Linux space runners and four on the macOS studio
    # runners. The split is a measurement: the Studio also carries the swarm,
    # and at 02:48Z 2026-09-16 its legs waited forty minutes for a runner while
    # the space legs took two, so weight moved off it — 8/4 with eight space runners since 03:10Z, not 8/8. A
    # package that builds on both platforms runs once per OS; the darwin-only
    # packages run on the studio only. On pull_request and merge_group it
    # selects only the packages the change touches and their in-module
    # importers; the push to dev and the nightly run keep the whole tree.
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, space]
    timeout-minutes: 2
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - name: remove stale build dirs from the shared runner
        # The self-hosted runners reuse the _work directory across jobs; a tree left
        # by an aborted or overlapping run makes checkout fail. Start from clean.
        shell: bash
        run: |
          find "${GITHUB_WORKSPACE}" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} + 2>/dev/null || true

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: use the installed Go toolchain
        # The self-hosted runners carry Go (1.26 at /usr/bin/go on Linux, under
        # /opt/homebrew or ~/go on macOS). Prefer it over a setup-go download.
        shell: bash
        run: |
          set -euo pipefail
          # the bench's own Go wins over a distro Go on the system path (hulk: /usr/bin/go 1.22
          # shadowed ~/go/bin 1.26.5 and every PR job died downloading a toolchain, 2026-09-17)
          for d in "$HOME/go/bin" /usr/local/go/bin /opt/homebrew/bin; do
            [ -x "$d/go" ] && { echo "$d" >> "$GITHUB_PATH"; export PATH="$d:$PATH"; break; }
          done
          command -v go >/dev/null 2>&1 || { echo "no Go toolchain on PATH"; exit 1; }
          go version

      - id: list
        shell: bash
        run: |
          set -euo pipefail
          # Runner labels are carried as single-string fields (os/arch/group), not
          # as a label array: a runs-on expression must resolve to a string, so the
          # test job composes its label list per leg.

          # EIGHT on space, FOUR on the studio, and the split is a measurement,
          # not a preference. The Studio also carries the swarm, and at 02:48Z
          # 2026-09-16 its legs waited forty minutes for a runner while the space
          # legs finished in two: eight and eight was the wrong shape once the two
          # fleets were no longer symmetric. ./cmd/* and ./internal/... go into one
          # list; the packages that build on both platforms are dealt round-robin
          # into 8 space shards and 4 studio shards, so each is covered exactly
          # once per OS; the darwin-only packages — cmd/nova-sandbox and
          # internal/sandbox, whose sandbox backend is macOS-only today
          # (docs/USAGE.md) — go to the studio shards only. A leg per package
          # instead reads like more parallelism and is not: 38 packages is 76 legs
          # queueing on 8 machines, a serial queue wearing a matrix's clothes,
          # measured at over eleven minutes in run 35018437149 for a tier whose
          # budget is two.
          SPACE_SHARDS=8
          STUDIO_SHARDS=16 # two waves on eight studio runners, each shard inside the 6-minute cap on a loaded Studio; eight studio runners since 05:0xZ 2026-09-16; four shards of double size hit the 6-minute job timeout on a loaded Studio (main runs 35055138586, 35057357169: test (2/4 studio) and (4/4 studio) cancelled at 6 min, twice each)
          darwin_only=("./cmd/nova-sandbox" "./internal/sandbox")

          is_darwin_only() {
            local p="$1" d
            for d in "${darwin_only[@]}"; do
              [ "$p" = "$d" ] && return 0
            done
            return 1
          }

          # THE FAN-OUT TESTS WHAT THE CHANGE TOUCHED. Measured 15:56Z
          # 2026-09-16: eight PRs opened in twelve minutes, each fanning 16
          # studio shards over the whole tree onto 8 studio runners, put 128
          # studio legs in the queue and held the merge group's own run behind
          # them; a run that needs no runner time of its own waited sixteen
          # minutes (35117977336). So on pull_request and merge_group the
          # shards carry only the Go packages whose files the change touched
          # plus every in-repo package that imports them, read from the diff
          # against the event's own base by .github/scripts/select-packages.sh
          # (a go.mod or go.sum change selects the whole tree). A change that
          # touches no Go package — docs or lisp only — selects nothing and
          # collapses to ONE leg that prints "nothing to test for this change"
          # and exits 0, instead of the whole tree on every runner. The push to
          # dev and the nightly schedule keep the whole tree: the full matrix
          # is still the evidence, it is just no longer the default feedback
          # path.
          all=()
          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            SPACE_SHARDS=4
            STUDIO_SHARDS=4
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            base="${{ github.event.merge_group.base_sha }}"
            STUDIO_SHARDS=2
          fi
          if [ -n "$base" ]; then
            while IFS= read -r pkg; do
              [ -n "$pkg" ] || continue
              all+=("$pkg")
            done < <(bash .github/scripts/select-packages.sh "$base")
            echo "${{ github.event_name }}: ${#all[@]} package(s) touched: ${all[*]:-none}"
          else
            while IFS= read -r pkg; do
              [ -n "$pkg" ] || continue
              all+=("$pkg")
            done < <(bash .github/scripts/select-packages.sh --all)
            [ "${#all[@]}" -gt 0 ] || { echo "no packages: the fan-out would be empty and green"; exit 1; }
          fi

          if [ "${#all[@]}" -eq 0 ]; then
            echo "nothing to test for this change"
            packages='[{"name":"nothing","packages":"","os":"linux","arch":"x64","group":"space"}]'
            echo "$packages"
            echo "packages=$packages" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          declare -a space_grp studio_grp
          s=0
          st=0
          for pkg in "${all[@]}"; do
            if [ "${{ github.event_name }}" = "merge_group" ] && ! is_darwin_only "$pkg"; then
              space_grp[$((s % SPACE_SHARDS))]+=" $pkg"; s=$((s + 1)); continue
            fi
            studio_grp[$((st % STUDIO_SHARDS))]+=" $pkg"
            st=$((st + 1))
            is_darwin_only "$pkg" && continue
            space_grp[$((s % SPACE_SHARDS))]+=" $pkg"
            s=$((s + 1))
          done

          # The leg name carries its platform. Two legs sharing one name is two
          # checks GitHub reports under the same title, which is a green and a
          # red that cannot be told apart on the PR.
          entries=()
          for ((g=0; g<SPACE_SHARDS; g++)); do
            [ -n "${space_grp[$g]:-}" ] || continue
            packages="${space_grp[$g]# }"
            n=$((g + 1))
            entries+=("{\"name\":\"$n/$SPACE_SHARDS space\",\"packages\":\"$packages\",\"os\":\"linux\",\"arch\":\"x64\",\"group\":\"space\"}")
          done
          for ((g=0; g<STUDIO_SHARDS; g++)); do
            [ -n "${studio_grp[$g]:-}" ] || continue
            packages="${studio_grp[$g]# }"
            n=$((g + 1))
            entries+=("{\"name\":\"$n/$STUDIO_SHARDS studio\",\"packages\":\"$packages\",\"os\":\"macos\",\"arch\":\"arm64\",\"group\":\"studio\"}")
          done

          [ "${#entries[@]}" -gt 0 ] || { echo "no packages with tests: the fan-out would be empty and green"; exit 1; }
          packages="[$(IFS=,; echo "${entries[*]}")]"
          echo "$packages"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  test:
    # THE UNIT TESTS, SHARDED, no race detector: ./cmd/* and ./internal/... in
    # twelve shards on the self-hosted Linux space runners and four on the
    # self-hosted macOS studio runners, in parallel with fail-fast off, so a red
    # leg does not cancel its siblings. Each leg vets and tests only its own
    # shard. Measured green end to end in run 35021822106: sixteen legs from
    # 14 s to 251 s, whole run 5 m 57 s. The whole-tree `-race` run is the
    # certification tier's `test` job. On pull_request and merge_group the legs
    # carry the packages the change touched, not the whole tree; a change that
    # touched no Go package gets one leg with an empty package list that prints
    # and exits 0.
    name: test (${{ matrix.entry.name }})
    needs: test-packages
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.test-packages.outputs.packages) }}
    # Labels are carried per entry as single-string variables: runs-on expressions
    # must resolve to a string, not to an array, so the matrix cannot hand over a
    # label list as one value.
    runs-on: [self-hosted, "${{ matrix.entry.os }}", "${{ matrix.entry.arch }}", "${{ matrix.entry.group }}"]
    # SIX, and the two minutes did not move — what a ceiling MEANS moved. The
    # two-minute law is about the CL feedback path: how long a change waits.
    # Until now that path ran on GitHub-hosted runners, where 48 legs start at
    # once and a per-job ceiling and the run's wall clock are the same number.
    # On 4+4 fixed machines they stop being the same number: the legs queue, so
    # the run is the sum over the waves and no per-job ceiling can see it.
    # Measured in run 35019905236 with the eight-and-eight fan-out: every studio leg and
    # three space legs were CANCELLED at 2:00 having done nothing wrong, while
    # five space legs passed at 80-118 s. The cause was oversubscription, since
    # fixed: four runners share each machine (15 cores on space, 32 on the studio
    # M3 Ultra) and each leg sized itself to the whole of it. A leg now takes a
    # quarter. A ceiling that cancels honest work is not a
    # budget, it is a coin flip. Six is a hang detector for a leg measured at
    # one to two minutes; the budget itself is the run, and the run is what to
    # hold to the law. The fast jobs — lint, test-packages, lisp at 32, 11 and
    # 12 s — keep the 2 they always had.
    # The Studio at load 55 ran a double-size shard in 6-7 min (2026-09-16 05:16Z);
    # the cap stays 6 by the two-minute law (internal/ci); the shards got smaller instead.
    timeout-minutes: 6
    steps:
      - name: nothing to test for this change
        # test-packages emits one leg with an empty package list when the change
        # touches no Go package (docs or lisp only). It prints this and exits 0
        # in seconds; every real step below is gated off, so the leg never
        # checks out or compiles anything and a docs-only change costs one
        # runner instead of the whole fan-out.
        if: matrix.entry.packages == ''
        shell: bash
        run: echo "nothing to test for this change"

      - name: remove stale build dirs from the shared runner
        if: matrix.entry.packages != ''
        # The self-hosted runners reuse the _work directory across jobs; a tree left
        # by an aborted or overlapping run makes checkout fail. Start from clean.
        shell: bash
        run: |
          find "${GITHUB_WORKSPACE}" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} + 2>/dev/null || true

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: matrix.entry.packages != ''

      - name: use the installed Go toolchain
        if: matrix.entry.packages != ''
        # The self-hosted runners carry Go (1.26 at /usr/bin/go on Linux, under
        # /opt/homebrew or ~/go on macOS). Prefer it over a setup-go download.
        shell: bash
        run: |
          set -euo pipefail
          # the bench's own Go wins over a distro Go on the system path (hulk: /usr/bin/go 1.22
          # shadowed ~/go/bin 1.26.5 and every PR job died downloading a toolchain, 2026-09-17)
          for d in "$HOME/go/bin" /usr/local/go/bin /opt/homebrew/bin; do
            [ -x "$d/go" ] && { echo "$d" >> "$GITHUB_PATH"; export PATH="$d:$PATH"; break; }
          done
          command -v go >/dev/null 2>&1 || { echo "no Go toolchain on PATH"; exit 1; }
          go version

      - name: take a quarter of the machine, not all of it
        if: matrix.entry.packages != ''
        # FOUR runners share each of these machines, and `go test` defaults
        # GOMAXPROCS to every core it can see -- so four concurrent legs ask for
        # four times the machine and spend the difference context-switching.
        # Measured: the same studio legs ran 208 and 251 s in run 35021822106
        # and 386 and 379 s in run 35023183602, the second pair cancelled at the
        # ceiling, on identical work. A leg takes its FAIR SHARE instead: cores
        # divided by the four runners, never below 1. `go test -p` follows
        # GOMAXPROCS, so this bounds both the package-level and the in-package
        # parallelism with one number.
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(uname -s)" = "Darwin" ]; then
            cores=$(sysctl -n hw.ncpu)
          else
            cores=$(nproc)
          fi
          share=$(( cores / 4 ))
          [ "$share" -ge 1 ] || share=1
          echo "$cores cores on this machine, 4 runners, this leg takes $share"
          echo "GOMAXPROCS=$share" >> "$GITHUB_ENV"

      # No actions/cache here. These runners are PERSISTENT: ~/.cache/go-build
      # survives between jobs on the machine itself, so the action spends 6 s
      # restoring and 4 s re-uploading a cache the disk already had — a tenth of
      # the leg's budget, to move a cache one hop it never left.
      # test-hosted keeps it: a GitHub-hosted runner is a fresh machine.

      # No separate `build` step either: `go vet` and `go test` both compile
      # what they are given, so building first was a third compile of the same
      # packages. The whole-tree `go build ./...` still runs once, in lint.
      - name: vet
        if: matrix.entry.packages != ''
        run: go vet ${{ matrix.entry.packages }}

      - name: test
        if: matrix.entry.packages != ''
        run: go test -count=1 ${{ matrix.entry.packages }}

  test-hosted:
    # THE FULL SUITE on the GitHub-hosted runners — ubuntu-latest, macos-latest,
    # windows-latest — but ONLY on push to main and on the nightly schedule.
    # GitHub-hosted compute is the expensive tier, so a pull request never
    # touches it: a change's feedback path is the self-hosted matrix above.
    # Windows has no self-hosted runner, so its coverage lives here and in the
    # certification tier.
    #
    # workflow_dispatch is in the list for ONE reason: a Windows-only breakage
    # cannot be reproduced or proved fixed anywhere else. Without it the only
    # way to see the Windows leg go green is to merge the fix to main and find
    # out, which is exactly the "prove the tip before any merge" rule inverted.
    # A manual run on a branch is a deliberate, named spend of hosted compute;
    # it is not on the pull_request path, so the default feedback path is still
    # the self-hosted matrix and costs nothing here. ci-ok does not gate on it
    # for a dispatch: the run is evidence to read, not an automatic merge gate.
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # This workflow manages caching explicitly; do not probe for a missing go.sum.
          cache: false

      - name: cache go build and module cache
        if: runner.environment == 'github-hosted'
        # Only on GitHub-hosted runners. A self-hosted runner is PERSISTENT: its Go build cache is
        # already on disk, and this step's save phase tars the whole multi-GB cache on every job,
        # outlives the job's timeout, and is orphaned still compressing (82 of them put the Studio
        # at load 147 on 2026-09-17). internal/ci holds the class test.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test (shard ${{ matrix.shard }} of 4)
        # Four shards per OS, dealt by package order (stable: go list sorts), so a
        # hosted leg is a quarter of the suite: the whole suite on one windows
        # runner took ten minutes (run 35045469738) for a tier whose budget is two.
        # Same billed minutes, a quarter of the wall clock. The hosted legs still
        # run only on main and nightly; the shard count is the whole tuning.
        shell: bash
        run: |
          pkgs=$(go list ./... | awk -v n=4 -v i=${{ matrix.shard }} 'NR % n == i - 1')
          echo "$pkgs"
          # The hosted legs run -short: the multi-process and thousand-note fixture tests
          # in cmd/nova-bus, cmd/nova-wake, cmd/nova-merge and internal/bus are gated
          # behind testing.Short() and skip here, so a Windows leg answers inside the
          # two-minute budget instead of hitting Go's 10 m default on main (run
          # 35052889521, panic: test timed out after 10m0s). The self-hosted shards keep
          # running everything; the nightly certification runs the hosted legs full.
          # -timeout 20m stays as the ceiling, not the target.
          go test -short -count=1 -timeout 20m $pkgs

  plan-merge:
    # How many shard slots this merge group needs, decided before any leg starts.
    # The matrix used to carry six slots per leg for every group: a group that
    # changed one small package, or no Go at all (a spec PR), still took six
    # runners per leg for checkout and Go setup, five of them to print "no
    # tests". On the darwin leg that is the Studio: eight entries times six slots
    # is forty-eight jobs a round on ten runners, and on 2026-09-17 the whole
    # queue waited on it while sixty-one Linux runners sat idle. Slots: 6 when
    # go.mod moves or a changed package is over 40 s in package-sizes.tsv, 1 when
    # the changed packages sum under 20 s (or no Go changed), else 3. No Go
    # toolchain needed: the table is keyed by import path, module path + dir.
    name: plan-merge
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      slots: ${{ steps.plan.outputs.slots }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: plan the shard slots
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.merge_group.base_sha }}"
          git fetch -q --depth=1 origin "$base" 2>/dev/null || true
          slots=$(bash .github/scripts/plan-merge-slots.sh "$base" HEAD)
          case "$slots" in 1) shards='[0]';; 3) shards='[0,1,2]';; *) slots=6; shards='[0,1,2,3,4,5]';; esac
          echo "plan-merge: slots=$slots"
          echo "slots=$slots" >> "$GITHUB_OUTPUT"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

  test-hosted-merge:
    # RULE T (pit stop 4, 2026-09-16): the gate that lands a PR must run what
    # the dev push runs. The -short hosted-pr leg passed #858 while the full
    # Windows leg on the dev push failed three of its new tests (dev runs
    # 35142587149, 35143418489), and a package with hosted-only tests cannot
    # land on the -short result alone. So the merge queue's group commit runs
    # the hosted legs FULL — no -short — for the packages the group changes,
    # package-selected to stay inside the two-minute budget. test-hosted still
    # runs the whole tree on push and nightly; this is the one hosted leg the
    # merge group runs, and it runs only on the group's own commit. The darwin
    # leg is the Studio (the same darwin arm64 as macos-latest, without the
    # hosted concurrency wait): one hosted macOS job serialized every merge
    # group while the sixteen Studio runners sat idle. Only the runner changes;
    # the steps, timeout and package selection are the hosted ones. The matrix
    # carries six shard slots, and each package's shard count comes from its
    # measured idle-Linux size in testdata/ci/package-sizes.tsv: over 40 s gets
    # six shards, everything else three. A package that a given slot has no
    # tests for prints and exits 0, so six slots do not run a fast package six
    # times. cmd/nova-swarm is the package that forced this: its full suite is
    # 51 s idle and over three times that on a loaded Studio, where three
    # shards each crossed the two-minute cap.
    name: test-hosted-merge (${{ matrix.leg.name }}, ${{ matrix.shard }})
    if: github.event_name == 'merge_group'
    needs: plan-merge
    strategy:
      fail-fast: false
      matrix:
        leg:
          - name: linux
            runner: ubuntu-latest
          - name: darwin
            # A label array, carried as a JSON string: a runs-on expression must
            # resolve to a single string, so the job parses this one with fromJSON.
            labels: '["self-hosted","macOS","ARM64","studio"]'
          - name: windows
            runner: windows-latest
        # Only the slots plan-merge says this group needs (1, 3 or 6).
        shard: ${{ fromJSON(needs.plan-merge.outputs.shards) }}
    # A runs-on expression must resolve to one value, so the darwin leg's label
    # array is carried as a JSON string and parsed with fromJSON; the hosted legs
    # carry their runner image as a plain string and are quoted as a JSON string
    # in the same expression. Same steps, timeout and package selection below.
    runs-on: ${{ fromJSON(matrix.leg.labels || format('"{0}"', matrix.leg.runner)) }}
    # FIVE: the one allowed exception to the two-minute law. Every other job on
    # the CL path stays at TWO, but this gate is not a small check — it runs the
    # FULL hosted suite (no -short) of the packages a group changes, on three
    # platforms, sharded by size. Under load (the Studio running sixteen
    # self-hosted legs plus three friends, windows-latest cold) its darwin shards
    # were cancelled at 2:44 and its windows shards at 2:40 on 2026-09-17, and a
    # cancelled shard drops the whole group and restarts every group behind it,
    # so the two-minute cap on this one job was the throughput limit of the whole
    # fleet. Scoping to the group's changed packages plus the shard-by-size
    # matrix was already in place; five minutes is the allowance the budget test
    # (internal/ci) records, and the comment there carries the reason.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # This workflow manages caching explicitly; do not probe for a missing go.sum.
          cache: false

      - name: cache go build and module cache
        if: runner.environment == 'github-hosted'
        # Only on GitHub-hosted runners. A self-hosted runner is PERSISTENT: its Go build cache is
        # already on disk, and this step's save phase tars the whole multi-GB cache on every job,
        # outlives the job's timeout, and is orphaned still compressing (82 of them put the Studio
        # at load 147 on 2026-09-17). internal/ci holds the class test.
        # A GitHub-hosted runner is a fresh machine, so the cache pays for itself
        # exactly as it does in test-hosted.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: select the packages this group changes
        id: pkgs
        shell: bash
        run: |
          set -euo pipefail
          # base_sha is the target branch the queue built the group on and HEAD
          # is the group commit, so their diff is the group's whole change. A
          # go.mod or go.sum change puts every package in scope.
          base="${{ github.event.merge_group.base_sha }}"
          git fetch -q --depth=1 origin "$base" 2>/dev/null || true
          if git diff --name-only "$base" HEAD | grep -q -E '^(go\.mod|go\.sum)$'; then
            pkgs=$(go list ./...)
          else
            pkgs=""
            for d in $(git diff --name-only "$base" HEAD -- '*.go' | xargs -r -n1 dirname | sort -u); do
              p=$(go list "./${d#./}" 2>/dev/null) || continue
              pkgs="$pkgs $p"
            done
          fi
          # The package that holds this file's own law is never named by the
          # *.go diff: internal/ci scans the tree rather than importing what it
          # guards, so a cmd/nova-swarm edit (PR #1073) selected no shard to run
          # it. Always append it, so the leg is never green by doing nothing and
          # never blind to the workflow's own law.
          pkgs="$pkgs ./internal/ci"
          echo "merge_group: full hosted on:${pkgs}"
          echo "pkgs=$pkgs" >> "$GITHUB_OUTPUT"

      - name: test (full, the packages this group changes, shard ${{ matrix.shard }} of ${{ needs.plan-merge.outputs.slots }})
        # NOT -short: the group commit must answer the hosted-only tests the
        # -short PR leg skips. Each shard runs the tests whose zero-based index
        # in its package's sorted test list is congruent to the shard, so a
        # loaded Studio or windows-latest answers inside the two-minute cap;
        # -timeout 100s is the per-package ceiling, not the target. How many
        # shards a package gets is not fixed: testdata/ci/package-sizes.tsv
        # records its measured idle-Linux size, and a package over 40 s gets
        # six shards where the rest get three. cmd/nova-swarm is the one that
        # needed six; on the six-slot matrix the extra slots have no tests for
        # a fast package and say so rather than run it again.
        shell: bash
        run: |
          set -euo pipefail
          shard=${{ matrix.shard }}
          slots=${{ needs.plan-merge.outputs.slots }}
          sizes=$(cat testdata/ci/package-sizes.tsv)
          for pkg in ${{ steps.pkgs.outputs.pkgs }}; do
            secs=$(printf '%s\n' "$sizes" | awk -F '\t' -v p="$pkg" '$1 == p { print $2; exit }')
            if [ -n "$secs" ] && awk -v s="$secs" 'BEGIN { exit !(s > 40) }'; then
              n=6
            else
              n=3
            fi
            # Never deal over more slots than the plan opened, or tests would
            # land in a slot that does not exist and never run.
            if [ "$n" -gt "$slots" ]; then n=$slots; fi
            list=$(go test -list '.*' "$pkg") || exit 1
            tests=$(printf '%s\n' "$list" | grep '^Test' | sort || true)
            if [ -z "$tests" ]; then
              if [ "$shard" -eq 0 ]; then
                go test -count=1 -timeout 100s "$pkg"
              fi
              continue
            fi
            names=""
            i=0
            for name in $tests; do
              if [ $((i % n)) -eq "$shard" ]; then
                if [ -n "$names" ]; then names="$names|$name"; else names="$name"; fi
              fi
              i=$((i + 1))
            done
            if [ -z "$names" ]; then
              echo "shard $shard of $n: no tests from $pkg"
              continue
            fi
            go test -count=1 -timeout 100s -run "^(${names})$" "$pkg"
          done

  test-hosted-pr:
    # THE ONE EXCEPTION to "a pull request never touches GitHub-hosted
    # compute": a PR that touches a platform-specific path runs THAT leg here,
    # on the hosted runner that platform belongs to, so the platform's feedback
    # comes back on the PR and not on main. Two legs, each gated by a path
    # filter over the PR diff: ubuntu-latest when the sandbox changed
    # (internal/sandbox/**, any *_linux.go or *_linux_test.go), windows-latest
    # when the bus changed (cmd/nova-bus/**, internal/bus/**, any *_windows.go).
    # There is no Windows self-hosted runner, and the sandbox is darwin-only in
    # the self-hosted matrix, so without this a platform break the self-hosted
    # runners cannot see would only surface on main. A leg runs ONLY the packages
    # its filter names, under the two-minute rule; when the diff matches nothing
    # the test step is skipped, and ci-ok counts a skip as ok. Same head-repo
    # guard as every other PR job: a fork PR skips the leg rather than running
    # untrusted code on hosted compute. The concurrency group is the workflow's.
    name: test-hosted-pr (${{ matrix.leg.name }})
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        leg:
          - name: linux
            os: ubuntu-latest
            packages: ./internal/sandbox
            filters: |
              changed:
                - 'internal/sandbox/**'
                - '**/*_linux.go'
                - '**/*_linux_test.go'
          - name: windows
            os: windows-latest
            packages: ./cmd/nova-bus ./internal/bus
            filters: |
              changed:
                - 'cmd/nova-bus/**'
                - 'internal/bus/**'
                - '**/*_windows.go'
    runs-on: ${{ matrix.leg.os }}
    # 6 is the CL cap the two-minute law allows; 2 killed the windows leg by the clock
    # (cmd/nova-bus measured 439 s there). The legs run -short (#682).
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: filter the PR diff for this platform's paths
        # No path filter exists elsewhere in this file to reuse, so
        # dorny/paths-filter is pinned by sha. On a pull_request it reads the
        # diff via the REST API and reports whether any changed file matches
        # this leg's patterns.
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: ${{ matrix.leg.filters }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: steps.filter.outputs.changed == 'true'
        with:
          go-version-file: go.mod
          # This workflow manages caching explicitly; do not probe for a missing go.sum.
          cache: false

      - name: cache go build and module cache
        if: runner.environment == 'github-hosted' && (steps.filter.outputs.changed == 'true')
        # Only on GitHub-hosted runners. A self-hosted runner is PERSISTENT: its Go build cache is
        # already on disk, and this step's save phase tars the whole multi-GB cache on every job,
        # outlives the job's timeout, and is orphaned still compressing (82 of them put the Studio
        # at load 147 on 2026-09-17). internal/ci holds the class test.
        # A GitHub-hosted runner is a fresh machine, so the cache pays for itself
        # here exactly as it does in test-hosted.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: test the packages this leg filters
        if: steps.filter.outputs.changed == 'true'
        run: go test -short -count=1 ${{ matrix.leg.packages }}

  e2e:
    # THE SEQUENCES A FRIEND RUNS, end to end, one job. The sharded `test` job above runs
    # these too -- they are ordinary Go tests in ordinary packages -- and this job exists
    # so that the class has a name on the checks list: every breakage of 2026-09-15 was a
    # verb passing its own tests and leaving state the NEXT verb refused, which no
    # single-verb test looks at. A red here says the tools do not compose, not that one of
    # them is wrong.
    #
    # `-run TestFriendSequence` is the whole selector, and docs/WORKER-CARDS.md practice 21
    # is what keeps it populated: a card that changes a verb names the sequence a friend
    # runs through it and adds the test. On a pull_request this is a self-hosted Linux job
    # using the machine's own Go, guarded as every self-hosted job is.
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, space]
    timeout-minutes: 2
    steps:
      - name: remove stale build dirs from the shared runner
        # The self-hosted runners reuse the _work directory across jobs; a tree left
        # by an aborted or overlapping run makes checkout fail. Start from clean.
        shell: bash
        run: |
          find "${GITHUB_WORKSPACE}" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} + 2>/dev/null || true

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: use the installed Go toolchain
        # The self-hosted runners carry Go (1.26 at /usr/bin/go on Linux, under
        # /opt/homebrew or ~/go on macOS). Prefer it over a setup-go download.
        shell: bash
        run: |
          set -euo pipefail
          # the bench's own Go wins over a distro Go on the system path (hulk: /usr/bin/go 1.22
          # shadowed ~/go/bin 1.26.5 and every PR job died downloading a toolchain, 2026-09-17)
          for d in "$HOME/go/bin" /usr/local/go/bin /opt/homebrew/bin; do
            [ -x "$d/go" ] && { echo "$d" >> "$GITHUB_PATH"; export PATH="$d:$PATH"; break; }
          done
          command -v go >/dev/null 2>&1 || { echo "no Go toolchain on PATH"; exit 1; }
          go version

      - name: friend sequences
        run: go test -count=1 -run TestFriendSequence ./cmd/...

  lisp-changes:
    # THE PATH FILTER for the lisp tier, and it exists because the lisp job must
    # not occupy a self-hosted runner — let alone one on each platform — for a
    # change that cannot move nova-work. Only lisp/ and docs/SPEC-WORK.md
    # (docs/SPEC-WORK.md:290 fixes the language) can do that, so this job answers
    # "did either move?" and the lisp job reads the answer and skips otherwise.
    # On a change that touches neither, the lisp job is skipped and ci-ok counts
    # that as a pass. It runs on one Linux runner; it is a gate, not a check.
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, space]
    timeout-minutes: 2
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - name: remove stale build dirs from the shared runner
        # The self-hosted runners reuse the _work directory across jobs; a tree left
        # by an aborted or overlapping run makes checkout fail. Start from clean.
        shell: bash
        run: |
          find "${GITHUB_WORKSPACE}" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} + 2>/dev/null || true

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            changed:
              - 'lisp/**'
              - 'docs/SPEC-WORK.md'

  lisp:
    # THE LISP TIER, and it is one job because it is one system. `lisp/nova-work`
    # is the engine's own tree (docs/SPEC-WORK.md:290 fixes the language); its
    # acceptance suite runs under SBCL non-interactively and exits non-zero on
    # any failing case, so the exit code is the product here. It is in the CL
    # tier because it finishes in seconds, well inside the two-minute budget.
    # It runs on BOTH self-hosted platforms — the Linux space runners and the
    # macOS studio runners — because a failure that is really about SBCL or the
    # platform (journal fsync differs between Darwin and Linux) must be caught
    # on each. It only starts when the path filter above saw lisp/ or
    # docs/SPEC-WORK.md move, so a Go-only change never waits on the SBCL
    # runners, and it is fork-guarded transitively: the filter job above is the
    # guarded entry point, so a fork never reaches the SBCL machines.
    needs: lisp-changes
    if: needs.lisp-changes.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        entry:
          - {os: linux, arch: x64, group: space}
          - {os: macos, arch: arm64, group: studio}
    name: lisp (${{ matrix.entry.group }})
    # Labels are carried per entry as single-string variables: runs-on expressions
    # must resolve to a string, not to an array.
    runs-on: [self-hosted, "${{ matrix.entry.os }}", "${{ matrix.entry.arch }}", "${{ matrix.entry.group }}"]
    timeout-minutes: 2
    steps:
      - name: remove stale build dirs from the shared runner
        # The self-hosted runners reuse the _work directory across jobs; a tree left
        # by an aborted or overlapping run makes checkout fail. Start from clean.
        shell: bash
        run: |
          find "${GITHUB_WORKSPACE}" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} + 2>/dev/null || true

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: install sbcl if missing
        # The self-hosted runners need no sudo; install directly when sbcl is absent.
        run: |
          # A runner user keeps sbcl in its own ~/.local/bin (hulk, vision); a listener started
          # before its .path file saw none of it (2026-09-16), so the step finds it itself.
          for d in "$HOME/.local/bin"; do [ -x "$d/sbcl" ] && { echo "$d" >> "$GITHUB_PATH"; export PATH="$d:$PATH"; }; done
          if ! command -v sbcl >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y --no-install-recommends sbcl
          fi
          sbcl --version

      - name: sbcl version
        # The runners carry SBCL already (2.2.9 on Linux, 2.6.8 on macOS); the
        # suite is written to the older of the two, so nothing newer than 2.2.9
        # is used. No install step: apt-get does not exist on macOS.
        run: sbcl --version

      - name: nova-work acceptance
        # Loads the system from the checkout with the ASDF SBCL bundles — no
        # quicklisp, no download — and runs every acceptance case; the script
        # exits non-zero on any failure. The 120 s budget is the job's
        # timeout-minutes above.
        run: ./tools/ci/lisp-test.sh

  # fleet-probe: prove a bench's runners BEFORE the loop trusts them (Glenn, 2026-09-16:
  # "run some tests to make sure that hulk and vision actually work, before trusting them";
  # the pattern was new things thrown into the work loop and trusted while not working).
  # One job per runner slot, targeted by the bench label, doing what a CI job does. Read the
  # result by runner_name from the wire; a bench is trusted when every name is green. Runs
  # only on a workflow_dispatch that names a bench; lives here because a new workflow file
  # cannot be dispatched until it is on the default branch.
  fleet-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.bench != ''
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: [self-hosted, "${{ inputs.bench }}"]
    timeout-minutes: 2
    steps:
      - name: this slot is in the ask
        id: want
        run: |
          [ "${{ matrix.slot }}" -le "${{ inputs.slots }}" ] && echo "run=yes" >> "$GITHUB_OUTPUT" || echo "run=no" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.want.outputs.run == 'yes'
      - name: toolchains the way ci.yml finds them
        if: steps.want.outputs.run == 'yes'
        run: |
          # the bench's own Go wins over a distro Go on the system path (hulk: /usr/bin/go 1.22
          # shadowed ~/go/bin 1.26.5 and every PR job died downloading a toolchain, 2026-09-17)
          for d in "$HOME/go/bin" /usr/local/go/bin /opt/homebrew/bin; do
            [ -x "$d/go" ] && { echo "$d" >> "$GITHUB_PATH"; export PATH="$d:$PATH"; break; }
          done
          for d in "$HOME/.local/bin"; do [ -x "$d/sbcl" ] && { echo "$d" >> "$GITHUB_PATH"; export PATH="$d:$PATH"; }; done
          echo "PROBE runner=$RUNNER_NAME slot=${{ matrix.slot }} go=$(command -v go || echo -) sbcl=$(command -v sbcl || echo -) home=$HOME"
          command -v go >/dev/null 2>&1 || { echo "PROBE FAIL runner=$RUNNER_NAME no Go on PATH"; exit 1; }
          command -v sbcl >/dev/null 2>&1 || { echo "PROBE FAIL runner=$RUNNER_NAME no sbcl on PATH"; exit 1; }
          go version; sbcl --version
      - name: the network probe, inside nova-sandbox
        # rule R: nothing enters the loop untested, and the probe itself is no
        # exception. #893 is the cost of forgetting it — a probe on the host
        # passed while every sandboxed card died. Prove the bench the way a card
        # sees it: build the sandbox from this checkout and fetch inside it, so a
        # bench enters the loop only after the SANDBOXED probe is green. Linux
        # only, because the fleet-probe job runs on the Linux benches (the
        # sandbox backend is landlock there, seatbelt on the studio).
        if: steps.want.outputs.run == 'yes' && runner.os == 'Linux'
        run: |
          set -euo pipefail
          go build ./cmd/nova-sandbox
          mkdir -p "$RUNNER_TEMP/np/home"
          code="$(HOME="$RUNNER_TEMP/np/home" ./nova-sandbox --read "$PWD" --write "$RUNNER_TEMP/np" --cwd "$RUNNER_TEMP/np" -- curl -s -o /dev/null -w '%{http_code}' https://models.opencode.ai/api.json)"
          if [ "$code" != "200" ]; then
            echo "PROBE FAIL runner=$RUNNER_NAME slot=${{ matrix.slot }} sandboxed-net=$code"
            exit 1
          fi
          echo "PROBE OK runner=$RUNNER_NAME slot=${{ matrix.slot }} sandboxed-net=$code"
      - name: build, one real package, write beside the repo
        if: steps.want.outputs.run == 'yes'
        run: |
          go build ./... && go test -count=1 ./internal/oneline/
          t="$(dirname "$GITHUB_WORKSPACE")/fleet-probe-$RUNNER_NAME.txt"; echo ok > "$t" && rm -f "$t"
          echo "PROBE OK runner=$RUNNER_NAME slot=${{ matrix.slot }}"

  ci-ok:
    # THE ONE CHECK TO REQUIRE, and the reason it exists rather than a list of check names
    # in a branch ruleset. It aggregates EXACTLY the jobs of this file and nothing else —
    # the CL tier: what a change is required to pass. On a pull_request that is the
    # self-hosted matrix (lint, test, e2e, lisp) plus test-hosted-pr on the
    # platform leg whose paths the PR touches; on push to main the hosted full
    # suite joins it, so ci-ok on main needs the hosted matrix too. `needs` on a
    # matrix job is success
    # only when EVERY leg succeeded, so a leg renamed out of existence shows up here as a
    # missing success and not as silence. The certification tier has its own aggregate,
    # certification-ok; a red certification is a blocker for the next release, never for a
    # CL. The nightly schedule fires test-hosted only, so ci-ok does not run on schedule:
    # the nightly run is evidence to read, not a gate to merge against.
    if: always() && github.event_name != 'schedule'
    # A STATIC needs list. GitHub does not evaluate expressions in `needs`, so the
    # conditional array the previous revision used was refused as an invalid job
    # reference and the run was never created. test-hosted is skipped on a pull
    # request and ci-ok's `always()` still runs; the per-event steps below check
    # exactly the jobs that event actually ran.
    needs: [lint, test, e2e, lisp, test-hosted, test-hosted-pr, test-hosted-merge]
    # PRs are self-hosted only; hosted runners are reserved for push to main and
    # the nightly schedule. ci-ok aggregates on the Linux space runner either way.
    runs-on: [self-hosted, linux, x64, space]
    timeout-minutes: 1
    steps:
      - name: every CL-tier job succeeded (pull request, merge group or manual)
        # merge_group is the queue's group commit: ci-ok on it is THE merge gate,
        # so this step must run there too; a guard that names no event lets ci-ok
        # report success over red needs (read of #766).
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -uo pipefail
          bad=0
          for pair in \
            "lint:${{ needs.lint.result }}" \
            "test:${{ needs.test.result }}" \
            "lisp:${{ needs.lisp.result }}" \
            "e2e:${{ needs.e2e.result }}" \
            "test-hosted-pr:${{ needs.test-hosted-pr.result }}" \
            "test-hosted-merge:${{ needs.test-hosted-merge.result }}"
          do
            job="${pair%:*}"; result="${pair##*:}"
            echo "$result	$job"
            # A skip is ok for the legs that do not run on this event:
            # test-hosted-pr is skipped on a fork PR (the head-repo guard) and
            # on a manual run; its test step is skipped when the diff matches no
            # platform path. A skip is ok — the check is that it is not red.
            # lisp is gated on the path filter and is skipped when lisp/ and
            # docs/SPEC-WORK.md did not move; a skipped lisp is a pass. A red
            # lisp still blocks the merge.
            # test-hosted-merge runs only on the merge group's own commit, so a
            # skip is ok elsewhere — but on a merge_group it is NOT skipped: it
            # is the full hosted evidence the queue's gate must see (Rule T).
            [ "$result" = "success" ] && continue
            [ "$job" = "lisp" ] && [ "$result" = "skipped" ] && continue
            [ "$job" = "test-hosted-pr" ] && [ "$result" = "skipped" ] && continue
            [ "$job" = "test-hosted-merge" ] && [ "$result" = "skipped" ] && [ "${{ github.event_name }}" != "merge_group" ] && continue
            bad=$((bad + 1))
          done
          [ "$bad" -eq 0 ] || { echo "$bad job(s) did not succeed"; exit 1; }
      - name: every CL-tier job succeeded (push to main)
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -uo pipefail
          bad=0
          for pair in \
            "lint:${{ needs.lint.result }}" \
            "test:${{ needs.test.result }}" \
            "e2e:${{ needs.e2e.result }}" \
            "lisp:${{ needs.lisp.result }}" \
            "test-hosted:${{ needs.test-hosted.result }}"
          do
            job="${pair%:*}"; result="${pair##*:}"
            echo "$result	$job"
            # lisp is gated on the path filter and is skipped when lisp/ and
            # docs/SPEC-WORK.md did not move; a skipped lisp is a pass. A red
            # lisp still blocks the merge.
            if [ "$job" = "lisp" ] && [ "$result" = "skipped" ]; then continue; fi
            [ "$result" = "success" ] || bad=$((bad + 1))
          done
          [ "$bad" -eq 0 ] || { echo "$bad job(s) did not succeed"; exit 1; }