# Nightly tagged suites: the tests behind an opt-in build tag.
#
# Issue #516 splits tests by BUILD TAG rather than by schedule-of-record. The PR
# test jobs in ci.yml run `go test` without any tag, so a test moved behind one
# simply stops costing per-change time; it still has to run SOMEWHERE, and this
# file is that somewhere. One leg per tag, `./...` inside the leg, on the same
# operating-system matrix as certification.yml's `test` job — nightly, and on
# demand — so a tagged test is compiled and run against the whole tree, nothing
# listed by hand inside a leg and nothing able to fall out silently.
#
# THE MATRIX IS THE CONTRACT. internal/ci/nightlytags_class_test.go reads the
# `tag:` entries below, reads every tag any _test.go opts into, and refuses the
# difference: a tag with no leg here (and no `-tags` line in another scheduled
# workflow) fails the fast suite on the change that introduces it. An opt-in tag
# nobody runs is not a slower tier, it is a deleted test that still looks like a
# test in the tree.
#
# The legs, and why each one is where it is:
#
#   slow      ubuntu + macos  #516's tier: correct tests too slow for the CL budget.
#   soak      ubuntu          CheckNet exempts these two, so a test carrying one may
#   nightly   ubuntu          touch the real network (Glenn's rule: unit tests never
#                             do). They have a leg before they have a file, so the
#                             first such test that lands runs the same night rather
#                             than never.
#   novadisk  macos           cmd/nova-sandbox's one real end-to-end run: a real APFS
#                             volume made and destroyed. It is tagged off because
#                             EIGHT CI runners share the Mac this tree is built on —
#                             a hosted runner is a throwaway VM, which is exactly the
#                             machine that test wants.
#   postgres  ubuntu          internal/decide's decision log against a REAL Postgres,
#                             which keeps the in-memory fake the unit suite runs on
#                             honest. It is a job of its own rather than a row of the
#                             matrix above for one mechanical reason: it needs a
#                             `services:` container, and service containers run on
#                             Linux runners only — a `services:` block on the shared
#                             job would be inherited by its macos legs and fail them.
#                             The leg is still `tag: postgres` in a matrix, so the
#                             class test reads it the same way it reads the others.
#
# A RED run here does not block anything: it opens (or updates) a single issue
# titled "nightly tagged suite red <date>" for the morning. No aggregate gate, no
# release blocker — this tier is evidence to read, not a check to merge against.

name: nightly-slow

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-slow-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    # ONE LEG PER TAG. The tag, not a package list and not a `-run`, decides what
    # is extra — `./...` decides where it may live, so a tagged test added
    # tomorrow lands in its leg the moment it has a test file.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tag: slow
          - os: macos-latest
            tag: slow
          - os: ubuntu-latest
            tag: soak
          - os: ubuntu-latest
            tag: nightly
          - os: macos-latest
            tag: novadisk
    name: ${{ matrix.tag }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: tagged suite
        run: go test -tags ${{ matrix.tag }} -count=1 ./...

  postgres:
    # THE SAME LEG SHAPE, in its own job because it carries a service container.
    # internal/decide's log has two halves: an in-memory fake the unit suite runs
    # against, and the real-Postgres contract behind `//go:build postgres` that
    # keeps the fake honest. The test is also behind a DSN in the environment, so
    # it is pointed at a database deliberately and never inherits one; the service
    # below is that database, made and thrown away with the runner.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tag: postgres
    name: ${{ matrix.tag }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: nova
          POSTGRES_DB: nova_decide_test
        ports:
          - 5432:5432
        # Without the health check the steps start before the server accepts a
        # connection, and the leg is red for a reason that is not the code.
        options: >-
          --health-cmd "pg_isready -U nova"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: tagged suite
        # DECIDE_TEST_PG is internal/decide's own name for the DSN, separate from
        # the LogDSNEnv a tool writes through on purpose. Unset, the test skips;
        # this is the one place it is set.
        env:
          DECIDE_TEST_PG: postgres://nova:nova@127.0.0.1:5432/nova_decide_test?sslmode=disable
        run: go test -tags ${{ matrix.tag }} -count=1 ./...

  report:
    # ONE ISSUE PER DAY, not one per leg. The matrix jobs above are `failure()`
    # if ANY leg failed, and this job then makes sure there is exactly one open
    # issue whose title names today: create it if absent, add a comment pointing
    # at this run if it is already there. EVERY leg job is a `needs:` here — a
    # leg missing from this list is a leg whose red night nobody reads.
    needs: [test, postgres]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: open or update one "nightly tagged suite red" issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          title="nightly tagged suite red $(date -u +%Y-%m-%d)"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          numbers=$(gh issue list --state open --limit 200 --json number,title \
            | jq -r --arg t "$title" '.[] | select(.title == $t) | .number')
          if [ -n "$numbers" ]; then
            n=$(printf '%s\n' "$numbers" | head -n 1)
            echo "issue #$n already open for today; adding a comment"
            gh issue comment "$n" --body "A nightly tagged suite is still red: $run_url"
          else
            gh issue create --title "$title" \
              --body "A leg of the nightly tagged suites failed.\n\nRun: $run_url"
          fi
