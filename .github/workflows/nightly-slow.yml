# Nightly tagged suites: the tests behind an opt-in build tag.
#
# This file splits tests by BUILD TAG rather than by schedule-of-record. The PR
# test jobs in ci.yml run `go test` without any tag, so a test moved behind one
# simply stops costing per-change time; it still has to run SOMEWHERE, and this
# file is that somewhere. One leg per tag, dealt over the tag's own shards, on
# the same operating-system matrix as certification.yml's `test` job — nightly,
# and on demand — so a tagged test is compiled and run, nothing listed by hand
# inside a leg and nothing able to fall out silently.
#
# THE DEAL IS `ci deal --tags`: it reads every _test.go's //go:build expression
# and deals ONLY the live packages the tag newly includes (a file the tag turns
# on, not the untagged tree). `go test -tags <tag> -count=1 -timeout 75s $PKGS`
# then compiles that shard's packages alone. A leg dealt no package — soak and
# nightly have no file yet — prints one line and passes. The tag, not a package
# list, decides what is extra, so a tagged test added tomorrow lands in its leg
# the moment it has a test file. internal/pkgselect: TestDealTags*.
#
# THE MATRIX IS THE CONTRACT. internal/ci/nightlytags_class_test.go reads the
# `tag:` entries below, reads every tag any _test.go opts into, and refuses the
# difference: a tag with no leg here (and no `-tags` line in another scheduled
# workflow) fails the fast suite on the change that introduces it. An opt-in tag
# nobody runs is not a slower tier, it is a deleted test that still looks like a
# test in the tree.
#
# The legs, and why each one is where it is:
#
#   slow      ubuntu + macos  correct tests too slow for the CL budget.
#   soak      ubuntu          CheckNet exempts these two, so a test carrying one may
#   nightly   ubuntu          touch the real network (unit tests never
#                             do). They have a leg before they have a file, so the
#                             first such test that lands runs the same night rather
#                             than never.
#   functional ubuntu         the tests that start a redis-server: run as
#                             whole streams land, and here every night. Its leg
#                             installs redis-server and sets NOVA_CI=1 so a missing
#                             binary fails instead of skipping, and passes `slow`
#                             too for the four files that are both.
#   novadisk  macos           cmd/nova-sandbox's one real end-to-end run: a real APFS
#                             volume made and destroyed. It is tagged off because
#                             EIGHT CI runners share the Mac this tree is built on —
#                             a hosted runner is a throwaway VM, which is exactly the
#                             machine that test wants.
#
# A RED run here does not block anything: it opens (or updates) a single issue
# titled "nightly tagged suite red <date>" for the morning. No aggregate gate, no
# release blocker — this tier is evidence to read, not a check to merge against.

name: nightly-slow

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-slow-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    # ONE LEG PER TAG AND SHARD. The tag, not a package list and not a `-run`,
    # decides what is extra: `ci deal --tags` selects the packages, so a tagged
    # test added tomorrow lands in its leg the moment it has a test file. One
    # `timeout-minutes: 2` runner cannot compile a whole tagged tree AND run it
    # inside the cap, so each leg is dealt over its own shard count the way
    # certification.yml's `test` job is: slow's nine packages over three shards
    # on each OS, the functional leg's forty-six over ten, and one shard for
    # each of soak, nightly and novadisk. A shard dealt nothing prints one line
    # and passes.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tag: slow
            shards: 3
            shard: 1
          - os: ubuntu-latest
            tag: slow
            shards: 3
            shard: 2
          - os: ubuntu-latest
            tag: slow
            shards: 3
            shard: 3
          - os: macos-latest
            tag: slow
            shards: 3
            shard: 1
          - os: macos-latest
            tag: slow
            shards: 3
            shard: 2
          - os: macos-latest
            tag: slow
            shards: 3
            shard: 3
          - os: ubuntu-latest
            tag: soak
            shards: 1
            shard: 1
          - os: ubuntu-latest
            tag: nightly
            shards: 1
            shard: 1
          - os: ubuntu-latest
            tag: functional
            tags: functional,slow
            shards: 10
            shard: 1
          - os: ubuntu-latest
            tag: functional
            tags: functional,slow
            shards: 10
            shard: 2
          - os: ubuntu-latest
            tag: functional
            tags: functional,slow
            shards: 10
            shard: 3
          - os: ubuntu-latest
            tag: functional
            tags: functional,slow
            shards: 10
            shard: 4
          - os: ubuntu-latest
            tag: functional
            tags: functional,slow
            shards: 10
            shard: 5
          - os: ubuntu-latest
            tag: functional
            tags: functional,slow
            shards: 10
            shard: 6
          - os: ubuntu-latest
            tag: functional
            tags: functional,slow
            shards: 10
            shard: 7
          - os: ubuntu-latest
            tag: functional
            tags: functional,slow
            shards: 10
            shard: 8
          - os: ubuntu-latest
            tag: functional
            tags: functional,slow
            shards: 10
            shard: 9
          - os: ubuntu-latest
            tag: functional
            tags: functional,slow
            shards: 10
            shard: 10
          - os: macos-latest
            tag: novadisk
            shards: 1
            shard: 1
    name: ${{ matrix.tag }} (${{ matrix.os }}, ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2  # the classtests rule reads what HEAD deleted from its first parent
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: build tools/ci once
        # The verbs are built ONCE here and every later step calls the binary: `go run` compiles
        # and links the tool again on every step that names it. internal/ci: TestToolsCIIsBuiltOnceAndNeverRun.
        shell: bash
        run: go build -o "$RUNNER_TEMP/ci" ./tools/ci

      - name: install redis-server
        if: matrix.tag == 'functional'
        run: |
          "$RUNNER_TEMP/ci" install-redis-server

      - name: install postgres
        if: matrix.tag == 'functional'
        # nova-config's functional tests spawn a throwaway Postgres
        # (internal/nsprint/testutil/pg); a missing binary fails them.
        run: |
          "$RUNNER_TEMP/ci" install-postgres

      - name: deal this shard's tagged packages
        # `ci deal --tags` reads every _test.go's build constraint and deals only
        # the live packages this tag reaches, nothing listed by hand. It prints
        # one line of space-separated packages and writes them to $GITHUB_ENV as
        # HOSTED_PKGS for the test step. `go run ./tools/ci help deal`;
        # internal/pkgselect: TestDealTags*.
        shell: bash
        run: |
          "$RUNNER_TEMP/ci" deal --shards ${{ matrix.shards }} --shard ${{ matrix.shard }} --tags "${{ matrix.tags || matrix.tag }}"

      - name: tagged suite
        # -count=1: a restored cache must never answer for a test. -timeout 75s:
        # the step starts tens of seconds into the two-minute job, so Go's own
        # timeout names the package with a stack before the cap cancels the leg.
        # A shard dealt no package prints one line and passes.
        env:
          NOVA_CI: ${{ matrix.tag == 'functional' && '1' || '' }}
        run: |
          if [ -z "$HOSTED_PKGS" ]; then
            echo "nightly-slow: no package carries ${{ matrix.tag }} on shard ${{ matrix.shard }}/${{ matrix.shards }}"
          else
            go test -tags ${{ matrix.tags || matrix.tag }} -count=1 -timeout 75s $HOSTED_PKGS
          fi

  report:
    # ONE ISSUE PER DAY, not one per leg. The matrix jobs above are `failure()`
    # if ANY leg failed, and this job then makes sure there is exactly one open
    # issue whose title names today: create it if absent, add a comment pointing
    # at this run if it is already there. EVERY leg job is a `needs:` here — a
    # leg missing from this list is a leg whose red night nobody reads.
    needs: [test]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      # contents: read, because a job-level permissions block replaces the workflow's and
      # the checkout below needs it; issues: write for the one issue.
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: restore the go build and module cache
        id: gocache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-gotools-${{ hashFiles('go.mod') }}
          restore-keys: |
            ${{ runner.os }}-gotools-

      - name: build tools/ci once
        # The verbs are built ONCE here and every later step calls the binary: `go run` compiles
        # and links the tool again on every step that names it. internal/ci: TestToolsCIIsBuiltOnceAndNeverRun.
        shell: bash
        run: go build -o "$RUNNER_TEMP/ci" ./tools/ci

      - name: save the go build and module cache
        if: steps.gocache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.gocache.outputs.cache-primary-key }}

      - name: open or update one "nightly tagged suite red" issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          "$RUNNER_TEMP/ci" nightly-report
