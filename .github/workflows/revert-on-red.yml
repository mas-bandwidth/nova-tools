# revert-on-red.yml: the mechanical revert of the push that turned main red.
#
# No person in the loop. When `ci` concludes FAILURE on a push to main whose
# parent ci run on main was green, this workflow re-runs the failed jobs once
# (flake guard) and waits for that rerun. Only if the rerun is red too does it
# revert that push -- `git revert -m 1` for a merge commit, a plain revert
# otherwise -- push the revert to main, and post ONE comment on the merged
# pull request naming the revert. If the repository ruleset refuses the direct
# push by the github-actions app, it opens a `revert/<sha>` pull request with
# opened and LEFT OPEN instead, with a notice naming it; the comment is posted
# either way. This workflow enables no auto-merge and lands nothing itself
# (Glenn, 2026-09-18: nothing reaches the dev merge queue but a batch).
#
# The guards that keep it from ever fighting itself, all a skip with a notice
# and exit 0 rather than a failure:
#   * the first red is only a rerun trigger    -> the flake guard re-runs once
#   * the head commit is itself a revert      -> no revert loops
#   * the parent commit's ci run was not green -> the red predates this push
#   * main has moved past this commit          -> the newer run decides
#
# Everything else is the plain "stop the red" path. The repository ruleset is
# the one manual step this may need: it must let the github-actions app push
# to main or open a revert/<sha> pull request (see docs/CONTRIBUTING.md).
#
# Actions are pinned by sha, and the script is one file so the workflow stays
# a list of steps rather than a program.

name: revert-on-red

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  # One revert at a time, and a queued run waits rather than cancels: two red
  # pushes must never race each other's push to main.
  group: revert-on-red
  cancel-in-progress: false

jobs:
  revert-on-red:
    # The trigger fires on every completed ci run on main; only a FAILURE of a
    # PUSH run (not schedule, not dispatch) is a push that turned main red.
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 50

      - name: re-run the failed jobs once on the first red (flake guard)
        shell: bash
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          if [ "$RUN_ATTEMPT" = "1" ]; then
            gh run rerun "$RUN_ID" --failed
            echo "::notice::run $RUN_ID failed on attempt 1; re-ran its failed jobs once (flake guard). The rerun's own workflow_run completion re-enters this workflow with run_attempt 2, and only a rerun that is red too is reverted."
            exit 0
          fi
          echo "run $RUN_ID is red on attempt $RUN_ATTEMPT; the rerun is red too, proceeding to the revert."

      - name: revert the push that turned main red
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: .github/scripts/revert-on-red.sh