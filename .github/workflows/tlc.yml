# Model checking is a bounded Linux bench job. It never runs on a desktop.
name: tlc
on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tlc-${{ github.ref }}
  cancel-in-progress: true
jobs:
  groups:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 2
    outputs:
      groups: ${{ steps.plan.outputs.groups }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: use the installed Go toolchain
        # The self-hosted runners carry Go; the runner and the checkers are Go
        # (tools/tlacheck). The toolchain go.mod names wins when ~/sdk holds it,
        # else the newest under ~/sdk, else the bench's own Go on the path.
        shell: bash
        run: |
          set -euo pipefail
          want=$(sed -n 's/^toolchain \(go[0-9][0-9a-z.]*\)$/\1/p' go.mod 2>/dev/null | head -1 || true)
          [ -n "$want" ] || want=$(sed -n 's/^go \([0-9][0-9a-z.]*\)$/go\1/p' go.mod 2>/dev/null | head -1 || true)
          sdk=
          if [ -n "$want" ] && [ -x "$HOME/sdk/$want/bin/go" ]; then sdk="$HOME/sdk/$want/bin"; fi
          [ -n "$sdk" ] || sdk=$(ls -d "$HOME"/sdk/go*/bin 2>/dev/null | sort -V | tail -1 || true)
          for d in "$sdk" "$HOME/go/bin" /usr/local/go/bin /opt/homebrew/bin; do
            [ -n "$d" ] && [ -x "$d/go" ] && { echo "$d" >> "$GITHUB_PATH"; export PATH="$d:$PATH"; break; }
          done
          command -v go >/dev/null 2>&1 || { echo "no Go toolchain on PATH"; exit 1; }
          go version
      - name: Check runner controls without starting Java
        run: make tlc-test
      - id: plan
        shell: bash
        run: echo "groups=$(make tlc-groups)" >> "$GITHUB_OUTPUT"
  models:
    needs: groups
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 2
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        group: ${{ fromJSON(needs.groups.outputs.groups) }}
    env:
      NOVA_CI: '1'
      TLC_JAR: ${{ vars.TLC_JAR }}
      TLC_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: use the installed Go toolchain
        # The self-hosted runners carry Go; the runner and the checkers are Go
        # (tools/tlacheck). The toolchain go.mod names wins when ~/sdk holds it,
        # else the newest under ~/sdk, else the bench's own Go on the path.
        shell: bash
        run: |
          set -euo pipefail
          want=$(sed -n 's/^toolchain \(go[0-9][0-9a-z.]*\)$/\1/p' go.mod 2>/dev/null | head -1 || true)
          [ -n "$want" ] || want=$(sed -n 's/^go \([0-9][0-9a-z.]*\)$/go\1/p' go.mod 2>/dev/null | head -1 || true)
          sdk=
          if [ -n "$want" ] && [ -x "$HOME/sdk/$want/bin/go" ]; then sdk="$HOME/sdk/$want/bin"; fi
          [ -n "$sdk" ] || sdk=$(ls -d "$HOME"/sdk/go*/bin 2>/dev/null | sort -V | tail -1 || true)
          for d in "$sdk" "$HOME/go/bin" /usr/local/go/bin /opt/homebrew/bin; do
            [ -n "$d" ] && [ -x "$d/go" ] && { echo "$d" >> "$GITHUB_PATH"; export PATH="$d:$PATH"; break; }
          done
          command -v go >/dev/null 2>&1 || { echo "no Go toolchain on PATH"; exit 1; }
          go version
      - name: Check the required model group
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TLC_JAR" && test -f "$TLC_JAR" || {
            echo 'TLC_JAR must name an installed TLC jar on the Linux runner; configure the repository variable' >&2
            exit 2
          }
          make tlc TLC_JAR="$TLC_JAR" TLC_GROUP="$TLC_GROUP" TLC_OUT="$RUNNER_TEMP/tlc-$TLC_GROUP" TLC_BUDGET=110
      - name: Retain measured records and logs, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tlc-${{ matrix.group }}
          path: ${{ runner.temp }}/tlc-${{ matrix.group }}
          if-no-files-found: error
          retention-days: 14
