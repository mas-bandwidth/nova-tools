---
# The podman a bench has, recorded on the bench in one line, the way tools.yml
# records the installed build (nova_build_file), so a reader of the bench finds
# it in one place; it is written when it differs and never rewritten otherwise,
# and the PODMAN line says it in the play's output. container_runtime_podman_bin
# is the binary (podman on the PATH of a Linux bench; brew's on macOS).

- name: the podman the bench has
  become: "{{ container_runtime_user != ansible_facts['user_id'] }}"
  become_user: "{{ container_runtime_user }}"
  ansible.builtin.command: "{{ container_runtime_podman_bin | default('podman') }} --version"
  register: container_runtime_version
  changed_when: false
  # ignored: a non-zero exit is the answer (absent), read from rc by the tasks below and named on the PODMAN line
  failed_when: false
  check_mode: false

# No mode: a directory that exists keeps its own (~/.config/nova is the user's, 0700).
- name: the directory of the record
  become: "{{ container_runtime_user != ansible_facts['user_id'] }}"
  become_user: "{{ container_runtime_user }}"
  ansible.builtin.file:
    path: "{{ container_runtime_record_file | dirname }}"
    state: directory
  when: container_runtime_version.rc == 0

- name: the podman version in the record
  become: "{{ container_runtime_user != ansible_facts['user_id'] }}"
  become_user: "{{ container_runtime_user }}"
  ansible.builtin.copy:
    dest: "{{ container_runtime_record_file }}"
    content: "{{ container_runtime_version.stdout | trim }}\n"
    mode: "0644"
  when: container_runtime_version.rc == 0

- name: the podman on this bench
  ansible.builtin.debug:
    msg: "PODMAN host={{ inventory_hostname }} {{ container_runtime_version.stdout | default('absent') | trim }} recorded={{ container_runtime_record_file }}"
