---
# defaults/main.yml for wsl2_bench_runner role
# ==============================================================================
# wsl2_bench_runner: Ansible role configuring Windows WSL2 machines as Linux benches.
# Aligns with docs/FLEET.md, docs/BENCH-STANDARD-WINDOWS.md, and tools/bench-wsl2.ps1.
# ==============================================================================

# Runner user & permissions
bench_wsl2_runner_user: "nova"
bench_wsl2_runner_group: "nova"
bench_wsl2_runner_uid: 1000
bench_wsl2_user: "{{ bench_wsl2_runner_user }}"
bench_wsl2_group: "{{ bench_wsl2_runner_group }}"
bench_wsl2_user_home: "/home/{{ bench_wsl2_runner_user }}"
bench_wsl2_user_shell: "/bin/bash"
bench_wsl2_user_sudo: true

# Git identity for runner commits
bench_wsl2_git_user_name: "Nova Runner"
bench_wsl2_git_user_email: "runner@mas-bandwidth.com"

# Windows Host Mount & Validation Paths
bench_wsl2_windows_mount: "/mnt/c"
bench_wsl2_windows_system32: "{{ bench_wsl2_windows_mount }}/Windows/System32"
bench_wsl2_windows_require_mount: true
bench_wsl2_validate_distro_registration: true
bench_wsl2_expected_wsl_version: "2"

# Toolchains: Go
bench_wsl2_go_install: true
bench_wsl2_go_version: "go1.27.1"
bench_wsl2_go_arch: "amd64"
bench_wsl2_go_sdk_root: "{{ bench_wsl2_user_home }}/sdk"

# Toolchains: Rust
bench_wsl2_rust_install: true
bench_wsl2_rust_packages:
  - rustc
  - cargo
bench_wsl2_cargo_home: "{{ bench_wsl2_user_home }}/.cargo"
bench_wsl2_rustup_home: "{{ bench_wsl2_user_home }}/.rustup"

# Toolchains: Nova Tools
bench_wsl2_nova_tools_install: true
bench_wsl2_nova_tools:
  - nova-bus
  - nova-check
  - nova-update
  - nova-sandbox
  - nova-swarm
  - nova-tokens
  - nova-config
bench_wsl2_nova_tools_dir: "{{ bench_wsl2_user_home }}/.local/bin"
bench_wsl2_nova_source_dir: "{{ bench_wsl2_user_home }}/nova-tools"

# Toolchains: .NET
bench_wsl2_dotnet_install: true
bench_wsl2_dotnet_channel: "8.0"
bench_wsl2_dotnet_packages:
  - dotnet-sdk-8.0
bench_wsl2_dotnet_install_script: "https://dot.net/v1/dotnet-install.sh"
bench_wsl2_dotnet_install_dir: "{{ bench_wsl2_user_home }}/.dotnet"

# System Packages (Ubuntu/Debian)
bench_wsl2_packages:
  - openssh-server
  - build-essential
  - ca-certificates
  - curl
  - git
  - sbcl
  - gh
  - redis-server
  - redis-tools
  - tar
  - gzip
  - jq

# Redis Configuration & Service
bench_wsl2_redis_service: "redis-server"
bench_wsl2_redis_port: 6379
bench_wsl2_redis_bind: "127.0.0.1 ::1"
bench_wsl2_redis_protected_mode: "yes"

# Tailnet & Machine Identity
bench_wsl2_tailscale_bin: "tailscale"
bench_wsl2_identity_file: "{{ bench_wsl2_user_home }}/nova-bench/identity.tsv"
bench_wsl2_env_file: "/etc/nova-bench/identity.env"
bench_wsl2_labels: "linux,X64,threadripper"

# Bench directory layout
bench_wsl2_bench_root: "{{ bench_wsl2_user_home }}/nova-bench"
