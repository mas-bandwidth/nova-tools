---
# tasks/toolchains.yml for wsl2_bench_runner role
# ==============================================================================
# Configures Go, Rust, Nova tools, and .NET toolchains for the runner user.
# Fully supports check mode, idempotency, and dynamic user homes.
# ==============================================================================

# ---- 1. Go Toolchain ---------------------------------------------------------

- name: check existing Go binary in sdk
  ansible.builtin.stat:
    path: "{{ bench_wsl2_go_sdk_root }}/{{ bench_wsl2_go_version }}/bin/go"
  register: go_bin_stat
  check_mode: false

- name: download Go SDK archive
  ansible.builtin.get_url:
    url: "https://go.dev/dl/{{ bench_wsl2_go_version }}.linux-{{ bench_wsl2_go_arch }}.tar.gz"
    dest: "/tmp/{{ bench_wsl2_go_version }}.tar.gz"
    mode: "0644"
  when: bench_wsl2_go_install | bool and not go_bin_stat.stat.exists and not ansible_check_mode

- name: extract Go SDK archive
  ansible.builtin.unarchive:
    src: "/tmp/{{ bench_wsl2_go_version }}.tar.gz"
    dest: "{{ bench_wsl2_go_sdk_root }}"
    remote_src: true
    owner: "{{ bench_wsl2_user }}"
    group: "{{ bench_wsl2_group }}"
  when: bench_wsl2_go_install | bool and not go_bin_stat.stat.exists and not ansible_check_mode

- name: rename extracted go directory to versioned path
  ansible.builtin.command:
    cmd: "mv {{ bench_wsl2_go_sdk_root }}/go {{ bench_wsl2_go_sdk_root }}/{{ bench_wsl2_go_version }}"
    creates: "{{ bench_wsl2_go_sdk_root }}/{{ bench_wsl2_go_version }}"
  when: bench_wsl2_go_install | bool and not go_bin_stat.stat.exists and not ansible_check_mode

- name: remove temporary Go archive
  ansible.builtin.file:
    path: "/tmp/{{ bench_wsl2_go_version }}.tar.gz"
    state: absent
  when: not ansible_check_mode

- name: link Go binary into runner go/bin
  ansible.builtin.file:
    src: "{{ bench_wsl2_go_sdk_root }}/{{ bench_wsl2_go_version }}/bin/go"
    dest: "{{ bench_wsl2_user_home }}/go/bin/go"
    state: link
    owner: "{{ bench_wsl2_user }}"
    group: "{{ bench_wsl2_group }}"
    force: true
  when: bench_wsl2_go_install | bool and not ansible_check_mode

- name: link Go binary into /usr/local/bin
  ansible.builtin.file:
    src: "{{ bench_wsl2_go_sdk_root }}/{{ bench_wsl2_go_version }}/bin/go"
    dest: "/usr/local/bin/go"
    state: link
    force: true
  when: bench_wsl2_go_install | bool and not ansible_check_mode

# ---- 2. Rust Toolchain -------------------------------------------------------

- name: check if rustc command exists
  ansible.builtin.command: "command -v rustc"
  register: rustc_cmd_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: ensure cargo directories exist in user home
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ bench_wsl2_user }}"
    group: "{{ bench_wsl2_group }}"
    mode: "0755"
  loop:
    - "{{ bench_wsl2_cargo_home }}"
    - "{{ bench_wsl2_cargo_home }}/bin"
    - "{{ bench_wsl2_rustup_home }}"
  when: bench_wsl2_rust_install | bool

- name: install Rust packages via apt
  ansible.builtin.apt:
    name: "{{ bench_wsl2_rust_packages }}"
    state: present
  when: bench_wsl2_rust_install | bool and rustc_cmd_check.rc != 0 and ansible_pkg_mgr == 'apt' and not ansible_check_mode

- name: link cargo into runner local bin
  ansible.builtin.file:
    src: "/usr/bin/cargo"
    dest: "{{ bench_wsl2_user_home }}/.local/bin/cargo"
    state: link
    owner: "{{ bench_wsl2_user }}"
    group: "{{ bench_wsl2_group }}"
    force: true
  failed_when: false
  when: bench_wsl2_rust_install | bool and not ansible_check_mode

- name: link rustc into runner local bin
  ansible.builtin.file:
    src: "/usr/bin/rustc"
    dest: "{{ bench_wsl2_user_home }}/.local/bin/rustc"
    state: link
    owner: "{{ bench_wsl2_user }}"
    group: "{{ bench_wsl2_group }}"
    force: true
  failed_when: false
  when: bench_wsl2_rust_install | bool and not ansible_check_mode

# ---- 3. Nova Tools Toolchain -------------------------------------------------

- name: check if nova tools source checkout exists
  ansible.builtin.stat:
    path: "{{ bench_wsl2_nova_source_dir }}"
  register: nova_source_stat
  check_mode: false

- name: ensure nova tools destination directory exists
  ansible.builtin.file:
    path: "{{ bench_wsl2_nova_tools_dir }}"
    state: directory
    owner: "{{ bench_wsl2_user }}"
    group: "{{ bench_wsl2_group }}"
    mode: "0755"
  when: bench_wsl2_nova_tools_install | bool

- name: link available nova tools binaries into runner PATH
  ansible.builtin.file:
    src: "{{ bench_wsl2_nova_source_dir }}/bin/{{ item }}"
    dest: "{{ bench_wsl2_nova_tools_dir }}/{{ item }}"
    state: link
    owner: "{{ bench_wsl2_user }}"
    group: "{{ bench_wsl2_group }}"
    force: true
  loop: "{{ bench_wsl2_nova_tools }}"
  failed_when: false
  when: bench_wsl2_nova_tools_install | bool and nova_source_stat.stat.exists and not ansible_check_mode

# ---- 4. .NET Toolchain -------------------------------------------------------

- name: check if dotnet command exists
  ansible.builtin.command: "command -v dotnet"
  register: dotnet_cmd_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: attempt .NET SDK installation via apt packages (dotnet-sdk)
  ansible.builtin.apt:
    name: "{{ bench_wsl2_dotnet_packages }}"
    state: present
  register: dotnet_apt_result
  failed_when: false
  when: bench_wsl2_dotnet_install | bool and dotnet_cmd_check.rc != 0 and ansible_pkg_mgr == 'apt' and not ansible_check_mode

- name: download dotnet-install script fallback if package not available
  ansible.builtin.get_url:
    url: "{{ bench_wsl2_dotnet_install_script }}"
    dest: "/tmp/dotnet-install.sh"
    mode: "0755"
  when: bench_wsl2_dotnet_install | bool and dotnet_cmd_check.rc != 0 and (dotnet_apt_result is skipped or dotnet_apt_result.failed | default(false)) and not ansible_check_mode

- name: install .NET SDK via official dotnet-install.sh fallback
  ansible.builtin.shell: >-
    bash /tmp/dotnet-install.sh --channel {{ bench_wsl2_dotnet_channel }} --install-dir {{ bench_wsl2_dotnet_install_dir }}
  args:
    creates: "{{ bench_wsl2_dotnet_install_dir }}/dotnet"
  become_user: "{{ bench_wsl2_user }}"
  when: bench_wsl2_dotnet_install | bool and dotnet_cmd_check.rc != 0 and (dotnet_apt_result is skipped or dotnet_apt_result.failed | default(false)) and not ansible_check_mode

- name: link fallback dotnet binary into /usr/local/bin
  ansible.builtin.file:
    src: "{{ bench_wsl2_dotnet_install_dir }}/dotnet"
    dest: "/usr/local/bin/dotnet"
    state: link
    force: true
  when: bench_wsl2_dotnet_install | bool and dotnet_cmd_check.rc != 0 and (dotnet_apt_result is skipped or dotnet_apt_result.failed | default(false)) and not ansible_check_mode

- name: link dotnet binary into runner local bin
  ansible.builtin.file:
    src: "{{ bench_wsl2_dotnet_install_dir }}/dotnet"
    dest: "{{ bench_wsl2_user_home }}/.local/bin/dotnet"
    state: link
    owner: "{{ bench_wsl2_user }}"
    group: "{{ bench_wsl2_group }}"
    force: true
  when: bench_wsl2_dotnet_install | bool and dotnet_cmd_check.rc != 0 and (dotnet_apt_result is skipped or dotnet_apt_result.failed | default(false)) and not ansible_check_mode

- name: remove temporary dotnet-install script
  ansible.builtin.file:
    path: "/tmp/dotnet-install.sh"
    state: absent
  when: not ansible_check_mode
