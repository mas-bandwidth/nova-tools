---
# tasks/preflight.yml for wsl2_bench_runner role
# ==============================================================================
# Validates platform, Windows filesystem mounts, and WSL distro registration.
# ==============================================================================

- name: assert target platform is linux
  ansible.builtin.assert:
    that:
      - ansible_system == 'Linux'
    fail_msg: "bench-wsl2 role requires Linux (running under WSL2), but host is {{ ansible_system }}"
    quiet: true

- name: detect WSL2 kernel characteristics
  ansible.builtin.set_fact:
    bench_wsl2_detected: >-
      {{ 'microsoft' in (ansible_kernel | lower) or 'wsl' in (ansible_kernel | lower) }}

# ---- Windows Host Paths Validation -------------------------------------------

- name: validate Windows host mount path exists
  ansible.builtin.stat:
    path: "{{ bench_wsl2_windows_mount }}"
  register: windows_mount_stat
  check_mode: false

- name: assert Windows host filesystem mount is accessible
  ansible.builtin.assert:
    that:
      - windows_mount_stat.stat.exists
      - windows_mount_stat.stat.isdir
    fail_msg: "Windows host mount '{{ bench_wsl2_windows_mount }}' not accessible. Verify WSL2 automount or drive mapping."
  when: bench_wsl2_windows_require_mount | bool and bench_wsl2_detected | bool

- name: validate Windows System32 directory
  ansible.builtin.stat:
    path: "{{ bench_wsl2_windows_system32 }}"
  register: windows_system32_stat
  check_mode: false

# ---- WSL Distro Registration Validation --------------------------------------

- name: check WSL distro registration via wsl.exe probe
  ansible.builtin.shell: >-
    {{ bench_wsl2_windows_system32 }}/wsl.exe -l -v 2>/dev/null || wsl.exe -l -v 2>/dev/null || true
  register: wsl_registration_probe
  changed_when: false
  failed_when: false
  check_mode: false
  when: bench_wsl2_validate_distro_registration | bool and bench_wsl2_detected | bool

- name: assert WSL distro is registered under WSL2
  ansible.builtin.assert:
    that:
      - "'2' in wsl_registration_probe.stdout or wsl_registration_probe.stdout == ''"
    fail_msg: "WSL distro registration check failed or not running under WSL2: {{ wsl_registration_probe.stdout }}"
  when: bench_wsl2_validate_distro_registration | bool and bench_wsl2_detected | bool and (wsl_registration_probe.stdout | default('') | trim) != ''

- name: verify /etc/wsl.conf configuration file status
  ansible.builtin.stat:
    path: /etc/wsl.conf
  register: wsl_conf_stat
  check_mode: false

- name: log platform detection and validation status
  ansible.builtin.debug:
    msg: >-
      Target host {{ inventory_hostname }}: Linux kernel {{ ansible_kernel }}
      (WSL2 detected: {{ bench_wsl2_detected }}, Windows mount: {{ windows_mount_stat.stat.exists | default(false) }},
      System32: {{ windows_system32_stat.stat.exists | default(false) }})
